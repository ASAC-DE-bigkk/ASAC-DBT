version: 2

sources:
  - name: bronze
    description: Bronze Iceberg tables loaded by the Airflow DAG from sample source data.
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: sample_events
        identifier: bronze_sample_events
        description: Append-only sample events loaded by Airflow through Trino/Iceberg.
        columns:
          - name: event_id
            tests:
              - not_null
          - name: event_type
            tests:
              - not_null
          - name: event_ts
            tests:
              - not_null
          - name: raw_object_key
            tests:
              - not_null
          - name: ingested_at
            tests:
              - not_null

models:
  - name: silver_sample_events
    description: Deduplicated, typed sample events. Keeps the latest bronze record per event_id.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: event_type
        tests:
          - not_null
      - name: event_ts
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null
  - name: gold_event_type_metrics
    description: Stable event metrics by type, aggregated from deduplicated silver events.
    columns:
      - name: event_type
        tests:
          - not_null
          - unique
      - name: event_count
        tests:
          - not_null
