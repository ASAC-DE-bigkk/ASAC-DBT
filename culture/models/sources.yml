version: 2

# bronze는 ASAC-DAG 로더가 적재한 Iceberg 테이블. dev/prod에 따라 카탈로그가 갈리므로
# database/schema를 target에 맞춘다 (dev=iceberg_dev.culture / prod=iceberg.culture).
sources:
  - name: culture_bronze
    description: culture 원천 적재(raw) Iceberg 테이블 — ASAC-DAG `write_iceberg` 로더 산출
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: bronze_kopis_performance
        description: KOPIS 공연목록(pblprfr) 원본 — 레코드 1건=1행, 원본은 record_json, provenance 포함
        columns:
          - name: record_json
            description: 원본 레코드(JSON 문자열) — silver에서 json_extract로 파싱
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC) = ingest_time (event_time 아님)
          - name: load_date
            description: 적재 파티션 일자(KST)
          - name: raw_object_key
            description: 원본 R2 객체 경로(리니지)
      - name: bronze_kopis_facility
        description: KOPIS 공연시설(prfplc) 원본 — 공연장 차원. gugunnm(자치구) 보유, 공연장→자치구 매핑 원천
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — mt10id·fcltynm·sidonm·gugunnm 등
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
