name: Traffic/Weather dbt monoproject pre-merge gate

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate-traffic-weather-monoproject:
    name: validate-traffic-weather-monoproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine Traffic/Weather monoproject scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python domains/traffic_weather/workflows/premerge_gate.py scope \
            --repository-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.monoproject_relevant == 'true'
        with:
          python-version: '3.11'
      - name: Install project gate dependencies
        if: steps.scope.outputs.monoproject_relevant == 'true'
        working-directory: domains/traffic_weather
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workflows/requirements-ci.txt
      - name: Run domain-owned pre-merge workflow
        if: steps.scope.outputs.monoproject_relevant == 'true'
        working-directory: domains/traffic_weather
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m workflows.premerge_gate run \
            --repository-root ../.. \
            --project-dir . \
            --target-path "$RUNNER_TEMP/traffic-weather-monoproject" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
      - name: Upload generated manifest
        if: ${{ always() && steps.scope.outputs.monoproject_relevant == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: traffic-weather-monoproject-manifest
          path: ${{ runner.temp }}/traffic-weather-monoproject
          if-no-files-found: ignore
