name: Traffic manifest pre-merge gate

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate-traffic-manifest:
    name: validate-traffic-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine Traffic manifest validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(domains/traffic/|packages/asac_axes/|\.github/workflows/traffic-manifest-premerge-gate\.yml$)'; then
            echo "traffic_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "traffic_relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip Traffic manifest validation
        if: steps.scope.outputs.traffic_relevant != 'true'
        run: echo "Traffic manifest validation is not required for this change."
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.traffic_relevant == 'true'
        with:
          python-version: '3.11'
      - name: Install dbt parser dependencies
        if: steps.scope.outputs.traffic_relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.10.22 dbt-trino==1.10.2
      - name: Validate fresh Traffic manifest dependencies
        if: steps.scope.outputs.traffic_relevant == 'true'
        run: |
          python domains/traffic/contracts/scripts/run_traffic_manifest_premerge_gate.py \
            --project-dir domains/traffic \
            --target-path "$RUNNER_TEMP/traffic-manifest-gate"
      - name: Upload generated manifest
        if: ${{ always() && steps.scope.outputs.traffic_relevant == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: traffic-manifest-premerge-gate
          path: ${{ runner.temp }}/traffic-manifest-gate
          if-no-files-found: ignore
