version: 2

# All models here are fully valid under Serving Contract v1. The validator must
# return zero findings for this file (paired with fixtures/manifest.json).

models:
  - name: gold_weather_place_current_outlook
    columns:
      - name: product_row_id
        tests: [not_null, unique]
      - name: place_id
      - name: forecast_at
    config:
      meta:
        serving:
          enabled: true
          external: true
          product_id: weather_place_current_outlook
          product_question: 지금 이 장소의 가장 가까운 기상 예보는 무엇입니까?
          grain: place_id마다 한 행입니다.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: fail
          publication_trigger:
            schedule_cron: "10 * * * *"
          event_time: forecast_at
          shape: wide

  # Internal-only (enabled true / external false), append, composite PK, rollup reliability, asset trigger.
  - name: gold_citydata_ppltn_dow_hour
    tests:
      - dbt_utils.unique_combination_of_columns
    columns:
      - name: area_cd
        tests: [not_null]
      - name: day_of_week
        tests: [not_null]
      - name: hour_of_day
        tests: [not_null]
      - name: base_n
    config:
      meta:
        serving:
          enabled: true
          external: false
          product_id: citydata_ppltn_dow_hour
          product_question: 이 장소는 무슨 요일 몇 시에 붐빕니까?
          grain: 장소×요일×시간마다 한 행입니다.
          primary_key: [area_cd, day_of_week, hour_of_day]
          publication_mode: append
          zero_policy: retain_last_good
          publication_trigger:
            trigger_type: asset
            max_interval_minutes: 90
          shape: rollup
          partial_policy:
            min_publish_ratio: 0.8
          reliability:
            sample_count_field: base_n
            minimum_sample_count: 30
            insufficient_sample_policy: flag_degraded
