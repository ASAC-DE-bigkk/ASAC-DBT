# Machine-readable Serving Contract schema (v1).
#
# Single source for the STRUCTURAL rules of ASAC-DAG docs/contracts/serving-contract-v1.md.
# The validator (serving_contract/validator.py) loads this file and drives required/optional/
# excluded/enum checks from it; cross-model and semantic rules are coded in validator.py.
#
# Keep this file and the ASAC-DAG doc in lockstep. On any change, bump `schema_version`
# and update the doc per its §8 version policy.

schema_version: v1.3
supported_contract_versions: [v1]

# v1.1 (#478 보강 결정): 조건부 필수 — `if_present` 필드를 선언한 모델은
# `then_required` 필드도 선언해야 한다 (event_time 없는 명부성 제품은 면제).
conditional_required:
  - if_present: event_time
    then_required: freshness_slo_minutes

# meta.serving.* fields that MUST be present (non-empty) on every model declaring a
# serving contract. Missing any of these => publication forbidden.
required:
  enabled:              {type: bool}
  external:             {type: bool}
  product_id:           {type: string, pattern: '^[a-z0-9_]+$'}
  product_question:     {type: string, non_empty: true}
  grain:                {type: string, non_empty: true}
  primary_key:          {type: list, min_items: 1}
  publication_mode:     {type: enum, allowed: [snapshot, upsert, append]}
  zero_policy:          {type: enum, allowed: [fail, retain_last_good, allow, warn]}
  publication_trigger:  {type: object}

# Optional fields — absence is legal (validator applies the documented fallback).
optional:
  contract_version:       {type: enum, allowed: [v1]}
  event_time:             {type: string}
  retention_or_horizon:   {type: string}
  partial_policy:         {type: object}
  freshness_slo_minutes:  {type: int, min: 1}
  shape:                  {type: enum, allowed: [wide, rollup, event]}
  reliability:            {type: object}
  upsert_strategy:        {type: enum, allowed: [merge, exact_set]}
  usage_patterns:         {type: list}   # v1.3 (#600/#638): 검증 질의 예시 — 항목 규칙은 usage_pattern_fields

# Defaults the Publisher applies when the field is absent (documentation of intent;
# the validator does not require them but forbids illegal explicit values).
defaults:
  enabled: false
  external: false
  zero_policy: retain_last_good
  contract_version: v1

# Fields that MUST NOT appear under meta.serving — measured at runtime or owned by
# the Gateway/Worker API contract (#476).
excluded:
  - estimated_rows
  - estimated_daily_write_rows
  - api_path
  - allowed_filters
  - default_limit
  - max_limit
  - pagination

# Legacy meta keys (siblings of `serving` under config.meta). Presence of ANY of these
# together with a meta.serving block is a double declaration and fails.
legacy_meta_keys:
  - serving_tier
  - serving_gold_candidate
  - external
  - refresh

# Nested enums validated when the owning optional object is present.
nested_enums:
  reliability.insufficient_sample_policy: [suppress_row, flag_degraded, allow]

# publication_trigger must be EXACTLY one of these shapes.
publication_trigger_shapes:
  - required_keys: [schedule_cron]
    forbidden_keys: [trigger_type, max_interval_minutes]
  - required_keys: [trigger_type, max_interval_minutes]
    forbidden_keys: [schedule_cron]
    field_values:
      trigger_type: asset

# v1.3 (#600/#638 확정): usage_patterns 항목 규칙. sql 은 참조 구현(클라이언트 실행 대상 아님),
# 전역 식별자는 (product_id, pattern_id) 쌍 — pattern_id 는 모델 안에서만 유일하면 된다.
# requires 어휘는 11개 고정(#638 §1.1) — 오타가 그냥 통과되지 않게 하는 것이 이 블록의 목적.
usage_pattern_fields:
  required: [pattern_id, sql]
  optional: [question_ko, axes, requires, verified_rows, verified_at,
             verified_publication_id, allow_empty, insight_sample_ko, d1_table]
  requires_allowed: [select_columns, sort, aggregate, group_by, having,
                     join, subquery, window, filter_range, filter_set, filter_null]
