version: 2

seeds:
  - name: kbo_seoul_schedule
    description: KBO 서울 홈경기 일정(잠실 LG/두산·고척 키움) — 수기 seed, 월 1회 갱신(git diff=감사 로그). 원천 = 공개 KBO 일정(비저작물 사실). fetch 배제 근거는 ASAC-DAG#195.
    columns:
      - name: game_date
        description: 경기일 (KST)
        tests: [not_null]
      - name: game_time
        description: 경기 시각 HH:MM (KST)
        tests: [not_null]
      - name: stadium
        description: 구장명
        tests:
          - not_null
          - accepted_values:
              values: ["잠실야구장", "고척스카이돔"]
      - name: home_team
        description: 홈팀(서울 연고)
        tests:
          - not_null
          - accepted_values:
              values: ["LG", "두산", "키움"]
      - name: away_team
        description: 원정팀
        tests: [not_null]
  - name: kbo_stadium_location
    description: 서울 KBO 구장 위치 차원 (2행) — silver 축 정렬용. 좌표 원천 = silver_culture_reservation(서울 공식 예약 API).
    columns:
      - name: stadium
        tests: [not_null, unique]
      - name: gu
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
  - name: sema_branch_location
    description: 시립미술관(SeMA) 분관·관련 장소 위치 seed (29행) — silver_culture_exhibition 이 venue_name 부분일치(strpos)로 조인. 분관(priority 10)만 좌표 보유, 그 외는 구 레벨(좌표 null).
    columns:
      - name: keyword
        description: venue_name 부분일치 키워드 (조인 키)
        tests: [not_null, unique]
      - name: gu
        description: 자치구명
        tests: [not_null]
      - name: priority
        description: 매칭 우선순위 — 높을수록 우선(분관=10). 다중 매칭 시 최댓값 채택.
        tests: [not_null]
      - name: latitude
        description: 위도(WGS84) — 분관만, 구 레벨 행은 null
      - name: longitude
        description: 경도(WGS84) — 분관만, 구 레벨 행은 null
  - name: sejong_location
    description: 세종문화회관 단일 위치 seed (1행) — silver_culture_sejong 이 cross join 으로 붙이는 좌표 상수(단일 시설).
    columns:
      - name: venue
        description: 시설명
        tests: [not_null, unique]
      - name: gu
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: seed_culture_qa_questions
    description: 페르소나 질문 카탈로그(티어링 #20, 설계 2026-07-20-culture-qa-eval.md). 페르소나 원천 = nvidia/Nemotron-Personas-Korea (HuggingFace, CC-BY-4.0) — 15명 샘플(스냅샷 docs/design/2026-07-20-qa-personas-snapshot.json), 질문은 페르소나 텍스트 근거 큐레이션(검수 게이트 7/20 통과분 30문항). 답가능=W7 평가셋 입력, 답불가=수집 로드맵 재료.
    columns:
      - name: question_id
        description: 질문 ID (QA001…)
        tests: [not_null, unique]
      - name: persona_uuid
        description: Nemotron 페르소나 uuid — 스냅샷 JSON과 조인 가능
        tests: [not_null]
      - name: question_text
        description: 자연어 질문
        tests: [not_null]
      - name: persona_lens
        description: 질문을 만든 페르소나 렌즈
        tests:
          - not_null
          - accepted_values:
              values: ["travel", "culinary", "family", "sports", "arts"]
      - name: answerable
        description: 현행 culture gold로 답 가능 여부(큐레이션 의도 — 실측은 gold의 mart_exists)
        tests: [not_null]
