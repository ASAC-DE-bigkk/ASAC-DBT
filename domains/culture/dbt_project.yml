name: culture
version: "1.0.0"
config-version: 2

profile: culture

flags:
  require_certificate_validation: true

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

# silver_* / gold_* 테이블 모두 도메인 스키마(culture)에 적재 (bronze_* 와 같은 컨벤션).
models:
  culture:
    +materialized: table
    # Iceberg CREATE OR REPLACE(원자적 메타데이터 교체) — 재빌드 중 소비자 조회 공백 0.
    # 기본 rename은 교체 창이 서브초로 남음(7/14 실측, "does not exist" 1회 목격). #180
    +on_table_exists: replace

seeds:
  culture:
    sema_branch_location:
      +column_types: {priority: integer, latitude: double, longitude: double}
    sejong_location:
      +column_types: {latitude: double, longitude: double}
    kbo_seoul_schedule:
      +column_types: {game_date: date}
    kbo_stadium_location:
      +column_types: {latitude: double, longitude: double}
