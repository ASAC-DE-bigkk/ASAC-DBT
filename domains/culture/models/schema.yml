version: 2

models:
  - name: silver_culture_facility
    description: KOPIS 공연시설 차원 (mt10id·공연장명·자치구). 공연장→자치구 매핑 원천.
    columns:
      - name: facility_id
        description: KOPIS 공연시설 ID(mt10id)
        tests:
          - not_null
          - unique
      - name: facility_name
        description: 공연장명
      - name: location_key
        description: 자치구(gugunnm)

  - name: silver_culture_event
    description: 정제된 서울 문화행사 (typed, event_key 중복제거, location_key=GUNAME 자치구, 행사기간=event_time)
    columns:
      - name: event_key
        description: surrogate 키 (제목·시작일·장소 해시)
        tests:
          - not_null
          - unique
      - name: event_title
        description: 행사명
      - name: location_key
        description: 공용 location_key = 자치구(GUNAME). 일부 행사는 자치구 미상(NULL) — gold에서 제외됨.
      - name: period_start
        description: 행사 시작일 (event_time)
      - name: period_end
        description: 행사 종료일 (event_time)
      - name: longitude
        description: 경도(WGS84, LOT) — 서울범위 밖/0은 NULL
      - name: latitude
        description: 위도(WGS84, LAT) — 서울범위 밖/0은 NULL

  - name: silver_culture_performance
    description: 정제된 KOPIS 공연 (typed, performance_id 기준 중복제거, 공연 기간 = event_time, location_key=자치구)
    columns:
      - name: performance_id
        description: KOPIS 공연 ID(mt20id)
        tests:
          - not_null
          - unique
      - name: performance_name
        description: 공연명
      - name: location_key
        description: 공용 location_key — 자치구(공연장→facility 매핑) 또는 공연장명(폴백)
        tests:
          - not_null
      - name: location_key_level
        description: location_key 출처 ('gu' = 자치구 매핑, 'venue_fallback' = 미매칭 폴백)
        tests:
          - accepted_values:
              values: ["gu", "venue_fallback"]
      - name: period_start
        description: 공연 시작일 (event_time)
      - name: period_end
        description: 공연 종료일 (event_time)

  - name: silver_culture_festival
    description: 정제된 KOPIS 축제 (공연장→facility 자치구 매핑, 축제 기간=event_time)
    columns:
      - name: festival_id
        description: KOPIS 축제 ID(mt20id)
        tests:
          - not_null
          - unique

  - name: silver_culture_exhibition
    description: 정제된 서울시립미술관 전시 (분관→자치구 매핑, 전시 기간=event_time)
    columns:
      - name: exhibition_id
        description: 전시 ID(DP_EX_NO)
        tests:
          - not_null
          - unique

  - name: silver_culture_sejong
    description: 정제된 세종문화회관 공연/전시 (location_key=종로구 상수, 기간=event_time)
    columns:
      - name: sejong_id
        description: 공연 ID(PERFORM_IDX)
        tests:
          - not_null
          - unique

  - name: gold_culture_location_daily
    description: 자치구 × 일자 culture 활동 집계 (공연·문화행사·축제·전시·세종 union, 구간→일자 전개). 혼잡 gold와 시점 조인용 표준 산출물.
    columns:
      - name: location_key
        description: 공용 location_key (자치구)
        tests:
          - not_null
      - name: event_date
        description: 공용 date 키
        tests:
          - not_null
      - name: activities_count
        description: 해당 자치구·일자 활성 활동 수 (전체)
        tests:
          - not_null
      - name: performances_count
        description: 그중 공연(KOPIS) 수
        tests:
          - not_null
      - name: events_count
        description: 그중 문화행사(서울) 수
        tests:
          - not_null
      - name: festivals_count
        description: 그중 축제(KOPIS) 수
        tests:
          - not_null
      - name: exhibitions_count
        description: 그중 전시(시립미술관) 수
        tests:
          - not_null
      - name: sejong_count
        description: 그중 세종문화회관 수
        tests:
          - not_null

  - name: silver_culture_reservation
    description: 공공예약(문화+체육) 스냅샷 — 상태(SVCSTATNM)·자치구(AREANM), (SVCID, load_date) 단위
    columns:
      - name: service_id
        description: 예약 서비스 ID(SVCID)
        tests:
          - not_null
      - name: reservation_type
        description: culture | sport
        tests:
          - accepted_values:
              values: ["culture", "sport"]
      - name: location_key
        description: 자치구(AREANM) — 일부 미상(NULL)은 gold 제외
      - name: longitude
        description: 경도(WGS84, X) — 서울범위 밖/0은 NULL
      - name: latitude
        description: 위도(WGS84, Y) — 서울범위 밖/0은 NULL

  - name: gold_culture_reservation_daily
    description: 자치구 × 스냅샷일 공공예약 가용 현황 (스냅샷 append). availability_rate=접수중/전체.
    columns:
      - name: location_key
        description: 공용 location_key (자치구)
        tests:
          - not_null
      - name: snapshot_date
        description: 적재 스냅샷 일자 (load_date)
        tests:
          - not_null
      - name: total_services
        description: 자치구·스냅샷일 예약 서비스 총수
        tests:
          - not_null
      - name: availability_rate
        description: 접수중 비율 (0~1) — 충원율 대체 지표
        tests:
          - not_null

  - name: silver_culture_boxoffice
    description: KOPIS 예매상황판(boxoffice) top50 랭킹 스냅샷 — (load_date, rank_no) 단위, 기간/순위/좌석수 정제
    columns:
      - name: rank_no
        description: 예매 순위(rnum)
        tests:
          - not_null
      - name: performance_id
        description: 공연 ID(mt20id) — location_key best-effort 조인 키
      - name: performance_name
        description: 공연명(prfnm)

  - name: gold_culture_boxoffice_daily
    description: 스냅샷일 × 순위 인기공연 랭킹 (스냅샷 append). location_key는 공연ID→자치구 best-effort(nullable).
    columns:
      - name: snapshot_date
        description: 적재 스냅샷 일자 (load_date)
        tests:
          - not_null
      - name: rank_no
        description: 예매 순위 (1~50)
        tests:
          - not_null
      - name: performance_name
        description: 공연명
        tests:
          - not_null
      - name: location_key
        description: 자치구 (공연ID→공연 매핑 best-effort, 대부분 NULL)

  - name: silver_culture_space
    description: 서울 문화공간 차원(culturalSpaceInfo) — location_key=GNGU(자치구), 좌표 정규화(Y_COORD=경도/X_COORD=위도)
    columns:
      - name: space_id
        description: 문화공간 ID(NUM)
        tests:
          - not_null
          - unique
      - name: facility_name
        description: 공간/시설명(FAC_NAME)
      - name: location_key
        description: 자치구(GNGU)
      - name: longitude
        description: 경도(WGS84, Y_COORD) — 서울범위 밖/0은 NULL
      - name: latitude
        description: 위도(WGS84, X_COORD) — 서울범위 밖/0은 NULL
