version: 2

models:
  - name: silver_culture_facility
    description: KOPIS 공연시설 dim — 목록+상세(좌표) 병합. 좌표는 detail 수집분만(부분 커버리지 — 설계 §5).
    columns:
      - name: facility_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.05}   # detail 캡(~12%) 반영 초기값 — Task 18에서 실측 후 확정
              config: {severity: warn}

  - name: silver_culture_space
    description: 서울 문화공간 dim (좌표 축 스왑 처리, space_key = NUM — Task 2 실측 채택)
    columns:
      - name: space_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.5}
              config: {severity: warn}

  - name: silver_culture_performance
    description: KOPIS 공연 기간 fact — detail(mt10id) 정밀 시설 조인, 공간축은 facility 경유
    columns:
      - name: performance_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: facility_match
        tests:
          - accepted_values:
              arguments: {values: ["detail_id", "name"]}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.5}
              config: {severity: warn}

  - name: silver_culture_festival
    description: KOPIS 축제 기간 fact — 시설 이름 매칭(미매칭 NULL)
    columns:
      - name: festival_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.3}
              config: {severity: warn}

  - name: silver_culture_event
    description: 서울 문화행사 기간 fact. 기간 질의는 event_start_date <= D and D <= event_end_date (event_at 단독 필터 = 시작일 기준)
    columns:
      - name: event_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.7}
              config: {severity: warn}

  - name: silver_culture_exhibition
    description: 시립미술관 전시 기간 fact — 위치는 분관 seed 매칭
    columns:
      - name: exhibition_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.5}
              config: {severity: warn}

  - name: silver_culture_sejong
    description: 세종문화회관 기간 fact — 위치 상수(seed)
    columns:
      - name: sejong_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests: [not_null]   # 상수 위치 — 항상 채워져야 함

  - name: silver_culture_reservation
    description: 공공예약 일 스냅샷 fact — 그레인 (service_id, load_date)
    columns:
      - name: service_id
        tests: [not_null]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: reservation_type
        tests:
          - accepted_values:
              arguments: {values: ["culture", "sport"]}
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}

  - name: silver_culture_boxoffice
    description: KOPIS 예매상황판 일 스냅샷 — 그레인 (load_date, rank_no), 공간축 면제
    columns:
      - name: rank_no
        tests: [not_null]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]

  - name: gold_culture_location_daily
    description: gu_code × 일자 문화활동 집계 (기간 겹침 전개)
    columns:
      - name: gu_code
        tests: [not_null]
      - name: event_date
        tests: [not_null]
  - name: gold_culture_reservation_daily
    description: gu_code × 스냅샷일 예약 가용 현황
    columns:
      - name: gu_code
        tests: [not_null]
  - name: gold_culture_boxoffice_daily
    description: 랭킹 스냅샷 (snapshot_date × rank_no)
    columns:
      - name: rank_no
        tests: [not_null]
