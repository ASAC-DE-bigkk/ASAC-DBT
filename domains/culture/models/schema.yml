version: 2

models:
  - name: silver_culture_facility
    description: KOPIS 공연시설 dim — 목록+상세(좌표·좌석수) 병합. 좌표·좌석수는 detail 수집분만(부분 커버리지 — 설계 §5, 캡 상향 #206).
    columns:
      - name: facility_id
        tests: [not_null, unique]
      - name: seat_scale
        description: 시설 총 좌석수. KOPIS seatscale — 0/공백(미상)은 null 로 정규화. 혼잡 규모 가중치용(#206 커버리지 확대 예정). 값이 있으면 양수(assert_facility_seat_scale_positive).
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.06}   # 실측 11.88%(detail 캡) - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_space
    description: 서울 문화공간 dim (좌표 축 스왑 처리, space_key = NUM — Task 2 실측 채택)
    columns:
      - name: space_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.94}   # 실측 99.06% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_performance
    description: KOPIS 공연 기간 fact — detail(mt10id) 정밀 시설 조인, 공간축은 facility 경유
    columns:
      - name: performance_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: facility_match
        tests:
          - accepted_values:
              arguments: {values: ["detail_id", "name"]}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_festival
    description: KOPIS 축제 기간 fact — 시설 이름 매칭(미매칭 NULL)
    columns:
      - name: festival_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_event
    description: 서울 문화행사 기간 fact. 기간 질의는 event_start_date <= D and D <= event_end_date (event_at 단독 필터 = 시작일 기준)
    columns:
      - name: event_key
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.94}   # 실측 99.41% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}   # 실측 95.59% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_exhibition
    description: 시립미술관 전시 기간 fact — 위치는 분관 seed 매칭
    columns:
      - name: exhibition_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.82}   # 실측 87.13% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_sejong
    description: 세종문화회관 기간 fact — 위치 상수(seed)
    columns:
      - name: sejong_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests: [not_null]   # 상수 위치 — 항상 채워져야 함
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_reservation
    description: 공공예약 일 스냅샷 fact — 그레인 (service_id, load_date)
    columns:
      - name: service_id
        tests: [not_null]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: reservation_type
        tests:
          - accepted_values:
              arguments: {values: ["culture", "sport"]}
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_boxoffice
    description: KOPIS 예매상황판 일 스냅샷 — 그레인 (load_date, rank_no), 공간축 면제
    columns:
      - name: rank_no
        tests: [not_null]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]

  - name: gold_culture_location_daily
    description: gu_code × 일자 문화활동 집계 (기간 겹침 전개)
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 타입은 describe 실측(2026-07-14)
    columns:
      - name: gu_code
        data_type: varchar
        tests: [not_null]
      - name: gu
        data_type: varchar
      - name: event_date
        data_type: date
        tests: [not_null]
      - name: activities_count
        data_type: bigint
      - name: performances_count
        data_type: bigint
      - name: events_count
        data_type: bigint
      - name: festivals_count
        data_type: bigint
      - name: exhibitions_count
        data_type: bigint
      - name: sejong_count
        data_type: bigint
      - name: dong_precise_count
        description: "좌표로 행정동까지 정밀한 활동 수(#111 quality_status='dong_precise')"
        data_type: bigint
        tests: [not_null]
  - name: gold_culture_reservation_daily
    description: gu_code × 스냅샷일 예약 가용 현황
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: gu_code
        data_type: varchar
        tests: [not_null]
      - name: gu
        data_type: varchar
      - name: snapshot_date
        data_type: varchar   # 물리 varchar(YYYY-MM-DD 문자열) — date 아님 주의
      - name: total_services
        data_type: bigint
      - name: culture_services
        data_type: bigint
      - name: sport_services
        data_type: bigint
      - name: open_services
        data_type: bigint
      - name: availability_rate
        data_type: decimal(38,18)   # Trino decimal 산술 결과 — double 아님 주의
      - name: dong_precise_count
        description: "좌표로 행정동까지 정밀한 예약 수(#111 quality_status='dong_precise')"
        data_type: bigint
        tests: [not_null]
  - name: gold_culture_boxoffice_daily
    description: 랭킹 스냅샷 (snapshot_date × rank_no)
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: snapshot_date
        data_type: varchar
      - name: rank_no
        data_type: integer
        tests: [not_null]
      - name: performance_id
        data_type: varchar
      - name: performance_name
        data_type: varchar
      - name: genre
        data_type: varchar
      - name: venue_name
        data_type: varchar
      - name: event_start_date
        data_type: date
      - name: event_end_date
        data_type: date
      - name: perf_count
        data_type: integer
      - name: seat_count
        data_type: integer
      - name: gu_code
        data_type: varchar
      - name: gu
        data_type: varchar

  - name: silver_culture_movie_boxoffice
    description: KOBIS 일별 영화 박스오피스(전국+서울 한정). 그레인 region×boxoffice_date×rank, boxoffice_date=load_date-1. KOPIS 예매상황판 boxoffice와 별개 축.
    columns:
      - name: region
        description: "'nation'(전국) / 'seoul'(서울 한정 wideAreaCd=0105001)"
        tests:
          - accepted_values:
              values: ["nation", "seoul"]
      - name: movie_cd
        description: KOBIS 영화 코드(movieCd)
        tests:
          - not_null
      - name: rank
        description: 그날 region top10 순위(1~10)
        tests:
          - not_null
      - name: boxoffice_date
        description: 실제 관객일(load_date − 1일)
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}

  - name: gold_culture_movie_boxoffice_daily
    description: 일별 서울/전국 영화 관객 비중(서울 쏠림). 그레인 boxoffice_date. 시도 그레인이라 자치구 gold 미편입.
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 스파이크 검증 모델
    columns:
      - name: boxoffice_date
        description: 관객일(날짜 1행)
        data_type: date
        tests:
          - not_null
          - unique
      - name: nation_top_audience
        data_type: bigint
      - name: seoul_top_audience
        data_type: bigint
      - name: seoul_audience_share
        description: 서울 top10 관객합 / 전국 top10 관객합 (서울 쏠림 신호)
        data_type: decimal(38,18)   # 1.0*x/y = Trino decimal 산술 — double 아님 주의
        tests:
          - not_null
      - name: nation_top_movie
        data_type: varchar
      - name: seoul_top_movie
        data_type: varchar

  - name: silver_culture_sports_event
    description: KBO 서울 홈경기 일정 fact (seed 원천, 그레인 game_date×stadium×game_time). 문화행사 축과 분리(sports).
    columns:
      - name: game_date
        tests: [not_null]
      - name: stadium
        tests: [not_null]
      - name: event_at
        description: 경기 시작 시각 (KST, event_time)
        tests: [not_null]
      - name: gu_code
        description: 자치구 코드 (#48 코드 축)
        tests: [not_null]
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: gold_culture_sports_schedule
    description: 서울 야구 경기 일정 질의 표면 (경기 1행). 최근접 미래 경기 = game_date>=current_date order by event_at.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: game_date
        data_type: date
        tests: [not_null]
      - name: event_at
        data_type: timestamp(6)
        tests: [not_null]
      - name: game_time
        data_type: varchar
      - name: stadium
        data_type: varchar
        tests: [not_null]
      - name: home_team
        data_type: varchar
      - name: away_team
        data_type: varchar
      - name: gu
        data_type: varchar
      - name: gu_code
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: admin_dong
        data_type: varchar
      - name: admin_dong_code
        data_type: varchar
      - name: quality_status
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: gold_culture_event_schedule
    description: 문화행사 목록 질의 표면 (행사 1행, #187). "이번 주말 ○○구 행사" = 기간 겹침 + gu_code 필터 단독 조회. 6개 silver union + norm_title×시작일×gu 크로스소스 dedup(전문 소스 우선).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: event_ref
        description: "소스 프리픽스 키 ('performance:12345') — 크로스소스 충돌 방지"
        data_type: varchar
        tests: [not_null, unique]
      - name: event_type
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [event, performance, exhibition, festival, sejong, kcisa]}
      - name: title
        data_type: varchar
        tests: [not_null]
      - name: category
        data_type: varchar
      - name: venue_name
        data_type: varchar
      - name: is_free
        data_type: varchar
      - name: event_start_date
        data_type: date
        tests: [not_null]
      - name: event_end_date
        data_type: date
        tests: [not_null]
      - name: event_at
        data_type: timestamp(6)
        tests: [not_null]
      - name: gu
        data_type: varchar
      - name: gu_code
        data_type: varchar
      - name: admin_dong
        data_type: varchar
      - name: admin_dong_code
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: quality_status
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_kcisa_event
    description: KCISA 한눈에보는문화정보 서울 행사 fact — 전 serviceName 편입, 3축(performance·event·exhibition) anti-join dedup 잔존분(#85). 그레인 event_id(=seq), 좌표 내장.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: title
        tests: [not_null]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.91}   # 실측 96.95% - 5%p (#85 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: gold_culture_activity_by_dong
    description: 행정동(admin_dong_code) × 일자 문화활동 집계(#48). dim_admin_dong 426동 scaffold라 활동 0건 동도 0으로 존재. sports 제외.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: admin_dong_code
        data_type: varchar
        tests: [not_null]
      - name: admin_dong
        data_type: varchar
      - name: gu_code
        data_type: varchar
        tests: [not_null]
      - name: gu
        data_type: varchar
      - name: stat_region_cd
        data_type: varchar
      - name: event_date
        data_type: date
        tests: [not_null]
      - name: activities_count
        data_type: bigint
      - name: performances_count
        data_type: bigint
      - name: events_count
        data_type: bigint
      - name: festivals_count
        data_type: bigint
