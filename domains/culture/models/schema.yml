version: 2

models:
  - name: silver_culture_facility
    description: KOPIS 공연시설 dim — 목록+상세(좌표) 병합. 좌표는 detail 수집분만(부분 커버리지 — 설계 §5).
    columns:
      - name: facility_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.05}   # detail 캡(~12%) 반영 초기값 — Task 18에서 실측 후 확정
              config: {severity: warn}

  - name: silver_culture_space
    description: 서울 문화공간 dim (좌표 축 스왑 처리, space_key = NUM — Task 2 실측 채택)
    columns:
      - name: space_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.5}
              config: {severity: warn}

  - name: silver_culture_performance
    description: KOPIS 공연 기간 fact — detail(mt10id) 정밀 시설 조인, 공간축은 facility 경유
    columns:
      - name: performance_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: facility_match
        tests:
          - accepted_values:
              arguments: {values: ["detail_id", "name"]}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.5}
              config: {severity: warn}

  - name: silver_culture_festival
    description: KOPIS 축제 기간 fact — 시설 이름 매칭(미매칭 NULL)
    columns:
      - name: festival_id
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.3}
              config: {severity: warn}

  - name: silver_culture_event
    description: 서울 문화행사 기간 fact. 기간 질의는 event_start_date <= D and D <= event_end_date (event_at 단독 필터 = 시작일 기준)
    columns:
      - name: event_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.7}
              config: {severity: warn}
