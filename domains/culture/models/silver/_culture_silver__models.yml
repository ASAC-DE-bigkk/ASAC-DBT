version: 2

# culture silver 계약·테스트 (#200 — schema.yml 을 layer 별로 분리, 모델명 정렬).
# gold 는 models/gold/_culture_gold__models.yml, bronze 원천은 models/sources.yml.

models:
  - name: silver_culture_boxoffice
    description: KOPIS 예매상황판 일 스냅샷 — 그레인 (load_date, rank_no), 공간축 면제
    columns:
      - name: rank_no
        tests: [not_null]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]

  - name: silver_culture_event
    description: 서울 문화행사 기간 fact. 기간 질의는 event_start_date <= D and D <= event_end_date (event_at 단독 필터 = 시작일 기준)
    columns:
      - name: event_key
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.94}   # 실측 99.41% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}   # 실측 95.59% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_exhibition
    description: 시립미술관 전시 기간 fact — 위치는 분관 seed 매칭
    columns:
      - name: exhibition_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.82}   # 실측 87.13% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_facility
    description: 'KOPIS 공연시설 dim — 목록+상세(좌표·좌석수) 병합. 좌표·좌석수는 detail 수집분만(부분 커버리지 — 설계 §5, 캡 상향 #206).'
    columns:
      - name: facility_id
        tests: [not_null, unique]
      - name: seat_scale
        description: 시설 총 좌석수. KOPIS seatscale — 0/공백(미상)은 null 로 정규화. 혼잡 규모 가중치용(#206 커버리지 확대 예정). 값이 있으면 양수(assert_facility_seat_scale_positive).
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.06}   # 실측 11.88%(detail 캡) - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_festival
    description: KOPIS 축제 기간 fact — 시설 이름 매칭(미매칭 NULL)
    columns:
      - name: festival_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_kcisa_event
    description: KCISA 한눈에보는문화정보 서울 행사 fact — 전 serviceName 편입, 3축(performance·event·exhibition) anti-join dedup 잔존분(#85). 그레인 event_id(=seq), 좌표 내장.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: title
        tests: [not_null]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.91}   # 실측 96.95% - 5%p (#85 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_movie_boxoffice
    description: KOBIS 일별 영화 박스오피스(전국+서울 한정). 그레인 region×boxoffice_date×rank, boxoffice_date=load_date-1. KOPIS 예매상황판 boxoffice와 별개 축.
    columns:
      - name: region
        description: "'nation'(전국) / 'seoul'(서울 한정 wideAreaCd=0105001)"
        tests:
          - accepted_values:
              values: ["nation", "seoul"]
      - name: movie_cd
        description: KOBIS 영화 코드(movieCd)
        tests:
          - not_null
      - name: rank
        description: 그날 region top10 순위(1~10)
        tests:
          - not_null
      - name: boxoffice_date
        description: 실제 관객일(load_date − 1일)
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}

  - name: silver_culture_performance
    description: KOPIS 공연 기간 fact — detail(mt10id) 정밀 시설 조인, 공간축은 facility 경유
    columns:
      - name: performance_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: facility_match
        tests:
          - accepted_values:
              arguments: {values: ["detail_id", "name"]}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (Task 18 확정, 상한 보정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_reservation
    description: 공공예약 일 스냅샷 fact — 그레인 (service_id, load_date)
    columns:
      - name: service_id
        tests: [not_null]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: reservation_type
        tests:
          - accepted_values:
              arguments: {values: ["culture", "sport"]}
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: gu_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.9}
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_sejong
    description: 세종문화회관 기간 fact — 위치 상수(seed)
    columns:
      - name: sejong_id
        tests: [not_null, unique]
      - name: event_at
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.95}   # 실측 100.00% - 5%p (#48 event_at 계약)
              config: {severity: warn}
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: gu_code
        tests: [not_null]   # 상수 위치 — 항상 채워져야 함
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_space
    description: 서울 문화공간 dim (좌표 축 스왑 처리, space_key = NUM — Task 2 실측 채택)
    columns:
      - name: space_key
        tests: [not_null, unique]
      - name: load_date
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.94}   # 실측 99.06% - 5%p (Task 18 확정)
              config: {severity: warn}
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: silver_culture_sports_event
    description: KBO 서울 홈경기 일정 fact (seed 원천, 그레인 game_date×stadium×game_time). 문화행사 축과 분리(sports).
    columns:
      - name: game_date
        tests: [not_null]
      - name: stadium
        tests: [not_null]
      - name: event_at
        description: 경기 시작 시각 (KST, event_time)
        tests: [not_null]
      - name: gu_code
        description: 자치구 코드 (#48 코드 축)
        tests: [not_null]
      - name: quality_status
        description: "공간축 정밀도(#111) — dong_precise(좌표→행정동)/gu_only(구 레벨 근사)/unmatched"
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  # --- SLO 마트 (tag:slo, #110). 관측 메타라 공간축 면제. 도메인 중립(domain 컬럼). ---
  - name: silver_culture_slo_run
    description: >
      run 그레인 SLO — coverage 4분해 + slo_passed 교정(raw AND expected>0, 초록위장 사후판정).
      #619 확정안 필드(event_id·record_count·row_count_source·iceberg_rows_measured)는
      2026-07-31 이전 리포트에 없어 NULL 로 들어온다 — "그때는 안 남겼다"이지 "0건"이 아니라
      not_null 을 걸지 않는다(NULL≠0).
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: domain
        tests: [not_null]
      - name: rows_source
        description: >
          이 기록의 정본 행 수(=total_iceberg_rows)의 획득 방식. 공통 계약
          product-observability/v2 의 어휘를 그대로 쓴다 — 도메인마다 다른 이름을 쓰면
          조회 DB 합류에 매핑 표가 하나 더 생긴다. 미측정이면 not_observed.
        tests:
          - accepted_values:
              arguments:
                values: [raw_manifest, bronze_run_manifest, iceberg_snapshot, count_query, publication_ledger, not_observed]
      - name: total_rows_source
        description: 수집이 센 행 수(total_rows)의 획득 방식 — raw landing manifest. 옛 리포트는 NULL
        tests:
          - accepted_values:
              arguments:
                values: [raw_manifest, bronze_run_manifest, iceberg_snapshot, count_query, publication_ledger, not_observed]
      - name: slo_passed
        tests: [not_null]
      - name: run_kind
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [scheduled, manual, backfill]}
  - name: silver_culture_slo_dataset
    description: run×dataset 그레인 — datasets[] UNNEST, 병목 추이(duration_sec) 원천. 그레인 유일성은 단일 테스트
    columns:
      - name: run_id
        tests: [not_null]
      - name: dataset_name
        tests: [not_null]
  - name: silver_culture_dag_run
    description: DAG run 그레인 — Airflow dag_run 스냅샷(KST). 그레인(dag_id,run_id) 유일성은 단일 테스트
    columns:
      - name: dag_id
        tests: [not_null]
      - name: run_id
        tests: [not_null]
      - name: state
        tests: [not_null]
      - name: retried_tasks
        description: try_number>1 이었던 태스크 수(#201·#633) — 미관측이면 NULL(0 은 "재시도 없었다"는 주장이라 섞을 수 없다)
      - name: max_try
        description: 그 run 의 최대 try_number — 1이면 무재시도, 미관측이면 NULL
