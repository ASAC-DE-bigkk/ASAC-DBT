version: 2

# bronze는 ASAC-DAG 로더가 적재한 Iceberg 테이블. dev/prod에 따라 카탈로그가 갈리므로
# database/schema를 target에 맞춘다 (dev=iceberg_dev.culture / prod=iceberg.culture).
sources:
  - name: culture_bronze
    description: culture 원천 적재(raw) Iceberg 테이블 — ASAC-DAG `write_iceberg` 로더 산출
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    # 수집 신선도 감시: collected_at(적재 시각, timestamp) 기준. `dbt source freshness`로 측정.
    loaded_at_field: collected_at
    freshness:
      warn_after: {count: 30, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: bronze_kopis_performance
        description: KOPIS 공연목록(pblprfr) 원본 — 레코드 1건=1행, 원본은 record_json, provenance 포함
        columns:
          - name: record_json
            description: 원본 레코드(JSON 문자열) — silver에서 json_extract로 파싱
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC) = ingest_time (event_time 아님)
          - name: load_date
            description: 적재 파티션 일자(KST)
          - name: raw_object_key
            description: 원본 R2 객체 경로(리니지)
      - name: bronze_kopis_facility
        description: KOPIS 공연시설(prfplc) 원본 — 공연장 차원. gugunnm(자치구) 보유, 공연장→자치구 매핑 원천
        freshness:   # SCD2 차원(느린 변화) → 완화
          warn_after: {count: 8, period: day}
          error_after: {count: 14, period: day}
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — mt10id·fcltynm·sidonm·gugunnm 등
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
      - name: bronze_seoul_cultural_event
        description: 서울 문화행사정보(culturalEventInfo) 원본 — GUNAME(자치구)·행사기간(STRTDATE/END_DATE) 보유
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — TITLE·GUNAME·STRTDATE·END_DATE·CODENAME 등
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
      - name: bronze_kopis_festival
        description: KOPIS 축제(prffest) 원본 — 공연과 동일 구조(mt20id·fcltynm·prfpdfrom/to)
        columns:
          - name: record_json
          - name: ingest_ts
      - name: bronze_seoul_sema_exhibition
        description: 서울시립미술관 전시 원본 — DP_NAME·DP_PLACE(분관)·DP_START/END
        columns:
          - name: record_json
          - name: ingest_ts
      - name: bronze_seoul_sejong
        description: 세종문화회관 공연/전시(SJWPerform) 원본 — TITLE·PLACE_LIST·START_DATE/END_DATE
        columns:
          - name: record_json
          - name: ingest_ts
      - name: bronze_seoul_culture_reservation
        description: 공공서비스예약-문화(ListPublicReservationCulture) 원본 — AREANM(자치구)·SVCSTATNM(상태) 스냅샷
        columns:
          - name: record_json
          - name: load_date
          - name: ingest_ts
      - name: bronze_seoul_sports_reservation
        description: 공공서비스예약-체육(ListPublicReservationSport) 원본 — AREANM(자치구)·SVCSTATNM(상태) 스냅샷
        columns:
          - name: record_json
          - name: load_date
          - name: ingest_ts
      - name: bronze_kopis_boxoffice
        description: KOPIS 예매상황판(boxoffice) 원본 — 기간 랭킹 top50 스냅샷(rnum·prfnm·prfplcnm·prfpd·seatcnt·mt20id)
        columns:
          - name: record_json
          - name: load_date
          - name: ingest_ts
      - name: bronze_kobis_boxoffice_nation
        description: KOBIS 일별 박스오피스 — 전국 top10 스냅샷(영화 관객수). record_json=영화 1건. KOPIS 예매상황판(bronze_kopis_boxoffice)과 다른 축.
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — rank·movieCd·movieNm·openDt·audiCnt·salesAmt·scrnCnt·showCnt 등
          - name: load_date
            description: 적재 파티션 일자(KST). 실제 관객일 targetDt = load_date − 1일
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
      - name: bronze_kobis_boxoffice_seoul
        description: KOBIS 일별 박스오피스 — 서울 한정(wideAreaCd=0105001) top10 스냅샷. 전국과 다른 영화 집합.
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — 서울 상영지역 랭킹
          - name: load_date
            description: 적재 파티션 일자(KST). 실제 관객일 targetDt = load_date − 1일
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
      - name: bronze_seoul_cultural_space
        description: 서울 문화공간정보(culturalSpaceInfo) 원본 — FAC_NAME·GNGU(자치구)·ADDR·X_COORD(위도)/Y_COORD(경도)
        freshness:   # 문화공간 차원(느린 변화) → 완화
          warn_after: {count: 8, period: day}
          error_after: {count: 14, period: day}
        columns:
          - name: record_json
          - name: ingest_ts
      - name: bronze_kopis_facility_detail
        description: KOPIS 공연시설상세(prfplc/{mt10id}) 원본 — 좌표(la=위도, lo=경도)·주소(adres). 시설 좌표의 유일 원천
        freshness:   # 좌표 차원(느린 변화) → 목록과 동일 완화
          warn_after: {count: 8, period: day}
          error_after: {count: 14, period: day}
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — mt10id·adres·la·lo 등
      - name: bronze_kopis_performance_detail
        description: KOPIS 공연상세(pblprfr/{mt20id}) 원본 — mt10id(공연시설 ID) 보유, 공연→시설 정밀 조인의 원천
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — mt20id·mt10id·prfstate 등
      - name: bronze_kcisa_seoul_event
        description: KCISA 한눈에보는문화정보(area2, sido=서울) 원본 — 현재 활성 행사 스냅샷. seq 자연키, 좌표(gpsX=경도·gpsY=위도)·sigungu 내장. 국립기관 전시 구멍 보강 원천(#85)
        columns:
          - name: record_json
            description: 원본 레코드(JSON) — seq·title·place·serviceName·realmName·sigungu·startDate/endDate(YYYYMMDD)·gpsX/gpsY
          - name: load_date
            description: 적재 파티션 일자(KST)
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC)
      - name: bronze_culture_run_report
        description: culture_slo 로더 적재 — run_report.json 원본(record_json). silver가 json_extract로 파싱(#257/#110)
        columns:
          - name: record_json
            description: run_report 전문(JSON 문자열) — domain·coverage·datasets[]·slo_passed 등
          - name: load_date
            description: 적재 파티션 일자(KST) = 리포트 load_date
          - name: ingest_ts
            description: 적재 실행 식별 타임스탬프(UTC) = 리포트 ingest_ts
          - name: raw_object_key
            description: 원본 R2 객체 경로(_reports/.../run_report.json)
      - name: bronze_culture_dag_runs
        description: culture_slo 로더 적재 — Airflow dag_run 타입드 스냅샷(14일 윈도우 멱등, culture 4 DAG)
        # v2(ASAC-DAG#411)로 적재 재개 → freshness 재활성(#240, #238 되돌림).
        # start_at 은 오프셋 포함 ISO varchar — raw 컬럼이면 나이 계산 불가라 표현식 사용.
        loaded_at_field: "from_iso8601_timestamp(start_at)"
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: domain
            description: 도메인(culture) — 도메인 중립 마트용(§6)
          - name: dag_id
            description: DAG 식별자
          - name: run_id
            description: run 식별자
          - name: state
            description: run 상태(success/failed/running 등)
          - name: run_type
            description: scheduled/manual/backfill
          - name: start_at
            description: 시작 시각(KST ISO 문자열)
          - name: end_at
            description: 종료 시각(KST ISO, running이면 null)
          - name: duration_sec
            description: 소요(초, double)
          - name: retried_tasks
            description: 그 run 에서 try_number>1 이었던 태스크 수(#201·#633) — 집계 없으면 NULL(0 아님)
          - name: max_try
            description: 그 run 의 최대 try_number — 1이면 무재시도, 집계 없으면 NULL
          - name: load_date
            description: 파티션 일자(KST, start 기준)

  # 크로스도메인 read(#276) — citydata published gold. ref 불가라 source 로 배선(citydata/traffic 선례).
  #   read-only. culture 는 자기 스키마에만 write.
  #   **스키마 이름이 target 마다 다르다** — dev=iceberg_dev.seoul_citydata / prod=iceberg.citydata
  #   (2026-07-28 prod 카탈로그 실측). 기본값을 target 으로 갈라 두지 않으면 prod 빌드가 "소스 없음"으로
  #   죽는다. env_var 는 그대로 남겨 두 이름 다 아닌 경우를 오너가 덮어쓸 수 있게 한다.
  - name: citydata_gold
    description: citydata 도메인 published gold (ASAC-DBT domains/citydata) — 크로스도메인 read 전용
    database: "{{ target.database }}"
    schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'citydata' if target.name == 'prod' else 'seoul_citydata') }}"
    tables:
      # 🔄 2026-08-08: `gold_citydata_ppltn_by_time` → `gold_citydata_ppltn_hourly`.
      #    전자는 ASAC-DBT#467 로 삭제됐다(5분 전량 재빌드 비용원). 시간 버킷 집계본이라
      #    혼잡도는 **그 시간의 최고 등급**이고 5분 분포는 남아 있지 않다.
      - name: gold_citydata_ppltn_hourly
        description: 장소×시간버킷(time_bucket) 인구혼잡 집계 — peak_congestion_level(그 시간 최고 등급)·average_population·measurement_count(버킷이 담은 5분 관측 수)·gu_code

  # 크로스도메인 read(#308) — commerce published gold. ref 불가라 source 로 배선(citydata_gold 선례).
  #   read-only. culture 는 자기 스키마에만 write. dev=iceberg_dev.commerce / prod=iceberg.commerce.
  - name: commerce_gold
    description: commerce 도메인 published gold (ASAC-DBT domains/commerce) — 크로스도메인 read 전용
    database: "{{ target.database }}"
    schema: "{{ env_var('COMMERCE_SCHEMA', 'commerce') }}"
    tables:
      - name: gold_license_dong_category_matrix
        description: 동×업종 인허가 매트릭스 — admin_dong_code(#48 canonical 호환, 220동)·active_cnt·total_cnt·opened_last_365d. 식품 = major 'health' / category 'food' (raw 영문값)
