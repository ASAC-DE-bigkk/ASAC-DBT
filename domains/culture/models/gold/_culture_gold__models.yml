version: 2

# culture gold 계약·테스트 (#200 — schema.yml 을 layer 별로 분리, 모델명 정렬).
# published gold 전 모델 contract enforced(#180). silver 는 models/silver/_culture_silver__models.yml.
# 컬럼 description 전수 작성(#242) — grain·단위·KST 여부·산식 근거를 명시. 카탈로그가 노출한다.

models:
  - name: gold_culture_activity_by_dong
    description: 행정동(admin_dong_code) × 일자 문화활동 집계(#48). dim_admin_dong 426동 scaffold라 활동 0건 동도 0으로 존재. sports 제외.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: admin_dong_code
        description: 행정동 코드(행안부 canonical 10자리, #48 공간축 조인 키)
        data_type: varchar
        tests: [not_null]
      - name: admin_dong
        description: 행정동 이름(예 명동)
        data_type: varchar
      - name: gu_code
        description: 자치구 코드(구 롤업 키)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름(예 중구)
        data_type: varchar
      - name: stat_region_cd
        description: 통계청 집계구 코드(dim_admin_dong 유래 — 외부 통계 조인용)
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST) — 행사 기간을 일 단위로 전개한 그레인 축
        data_type: date
        tests: [not_null]
      - name: activities_count
        description: 그날 그 동의 전체 문화활동 수(아래 소스별 count 의 합)
        data_type: bigint
      - name: performances_count
        description: KOPIS 공연 수
        data_type: bigint
      - name: events_count
        description: 서울시 문화행사 수
        data_type: bigint
      - name: festivals_count
        description: 서울시 축제 수
        data_type: bigint
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
      - name: kcisa_count
        description: KCISA 국립문화기관 행사 수
        data_type: bigint
      - name: free_events_count
        description: 그날 그 동의 무료(is_free='무료') 서울시 문화행사 수 — event 소스만(타 소스 유무료 정보 없음). free_access(티어링 #19) 흡수(#280)
        data_type: bigint
      - name: edu_experience_events_count
        description: 그날 그 동의 교육/체험 카테고리 행사 수 — 기술적 카운트("가족적합" 해석은 Q&A 레이어 몫)
        data_type: bigint

  - name: gold_culture_booking_curve
    description: 공연별 예매상황판 순위 궤적 요약(그레인 performance_id, 1공연 1행, #269). KOPIS는 순위(rank)만 제공 — 예매율·판매좌석·매진 데이터 없어 '순위 궤적'으로 실현. boxoffice_daily(스냅샷별)와 그레인 다름.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 그레인, 유일
        data_type: varchar
        tests: [not_null, unique]
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르 원문
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: first_seen_date
        description: 이 공연이 예매 top50에 처음 등장한 스냅샷 일(KST)
        data_type: date
      - name: last_seen_date
        description: 마지막으로 top50에 있던 스냅샷 일(KST)
        data_type: date
      - name: days_on_chart
        description: top50에 등장한 누적 스냅샷 수(체류 기간 프록시)
        data_type: integer
      - name: best_rank
        description: 이력 중 최고(최저 숫자) 순위 — 예매세 정점(1=최다). 예매율 아님, 순위 기반
        data_type: integer
      - name: best_rank_date
        description: best_rank 를 처음 달성한 스냅샷 일(KST)
        data_type: date
      - name: days_to_peak
        description: 첫 등장부터 정점 순위까지 걸린 일수(best_rank_date - first_seen_date, ≥0)
        data_type: integer
      - name: first_rank
        description: 첫 등장일의 순위(진입 순위)
        data_type: integer
      - name: last_rank
        description: 마지막 스냅샷의 순위(현재 순위)
        data_type: integer

  - name: gold_culture_boxoffice_daily
    description: KOPIS 예매 랭킹 일 스냅샷(snapshot_date × rank_no). "요즘 핫한 공연" — 스냅샷이 매일 쌓여 예매 추이 시계열의 원천이 된다.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: snapshot_date
        description: 예매 랭킹 스냅샷 일(YYYY-MM-DD 문자열 — 물리 varchar 주의)
        data_type: varchar
      - name: rank_no
        description: 예매 순위(1=최다) — snapshot_date 안에서 유일
        data_type: integer
        tests: [not_null]
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — silver_culture_performance 조인 키
        data_type: varchar
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르(연극·뮤지컬·클래식 등 원문 분류)
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: perf_count
        description: 상연 횟수(KOPIS 원문)
        data_type: integer
      - name: seat_count
        description: 공연장 좌석 수(규모 프록시)
        data_type: integer
      - name: gu_code
        description: 공연장 자치구 코드(#48 공간축)
        data_type: varchar
      - name: gu
        description: 공연장 자치구 이름
        data_type: varchar
      - name: rank_prev_3d
        description: 3일 전 같은 공연의 예매 순위 — top50 밖이었으면 NULL(달력 조인, freshness 갭 안전)
        data_type: integer
      - name: rank_delta_3d
        description: 순위 상승폭(rank_prev_3d - rank_no) — 양수=상승. NULL이면 신규/재진입(3일 전 부재)
        data_type: integer
      - name: days_on_chart
        description: 이 공연이 top50에 등장한 누적 스냅샷 수(현재 포함) — 체류 기간 프록시
        data_type: integer
      - name: is_new_entry
        description: 어제까지 없다가 오늘 처음(또는 재)진입했는지 — 첫 등장·재진입 공통 true
        data_type: boolean
      - name: momentum_status
        description: "순위 모멘텀: new(어제 부재)·rising(순위 상승)·falling(하락)·steady(변동 없음/추세 미정)"
        data_type: varchar

  - name: gold_culture_calendar_density
    description: 일×구 문화 밀도·경쟁 지수(#269). 시민 "볼 게 많은 날"=total_events, 주최자 "피해야 할 날"=concentration. int_culture_activity_days 재사용 — location_daily가 유형별 count면 여기는 다양성·집중도 요약. 그레인 gu_code×event_date.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST) — 행사 기간을 일 단위로 전개한 그레인 축
        data_type: date
        tests: [not_null]
      - name: total_events
        description: 그날 그 구의 전체 문화활동 수(유형별 distinct 합) — 시민 "볼 게 많은 날" 지표
        data_type: integer
      - name: distinct_types
        description: 그날 열린 활동 유형 수(공연·행사·축제·전시·세종·kcisa 중 몇 종) — 다양성
        data_type: integer
      - name: busiest_type
        description: 그날 가장 많이 열린 활동 유형(동수 시 임의 1개)
        data_type: varchar
      - name: busiest_type_count
        description: busiest_type 의 행사 수 — 주최자가 보는 "같은 유형 경쟁 규모"
        data_type: integer
      - name: concentration
        description: 경쟁 집중도(busiest_type_count / total_events, 0~1) — 1=한 유형 독점, 낮을수록 다양
        data_type: double

  - name: gold_culture_event_crowd
    description: 문화 행사 자치구의 요일×시간대별 평시 혼잡 베이스라인(그레인 gu_code×day_of_week×hour_of_day, #276·v2 #282). citydata gold를 크로스도메인 source로 읽어 event_schedule 있는 gu로 스코프. "그 행사 지역 무슨 요일 몇 시가 붐비나/한적한가". ⚠~120 핫스팟 한정 평시 베이스라인 — 특정 행사일 실측 lift 아님.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축) — citydata·event 공통 조인 키
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름 — citydata 쪽에서 취함(v2 fix. event_schedule 라벨은 좌표-라벨 불일치로 오표기 가능)
        data_type: varchar
      - name: day_of_week
        description: 요일(1=월 … 7=일, Trino day_of_week) — v2(#282) 추가 축. "무슨 요일 몇 시가 한적한가"
        data_type: integer
        tests: [not_null]
      - name: hour_of_day
        description: 시각(0~23, KST) — event_at 의 시(hour). 18일 이력 집계(셀당 p50 66샘플)
        data_type: integer
        tests: [not_null]
      - name: avg_ppltn
        description: 그 시간대 그 구 citydata 핫스팟들의 평균 실시간인구((min+max)/2 평균, 명)
        data_type: integer
      - name: avg_congest_score
        description: 평균 혼잡 서수(여유1·보통2·약간붐빔3·붐빔4) — 높을수록 붐빔
        data_type: double
      - name: typical_congest
        description: 그 시간대 최빈 혼잡 레벨(여유/보통/약간 붐빔/붐빔)
        data_type: varchar
      - name: crowd_samples
        description: 집계에 쓰인 citydata 관측(장소×5분 슬라이스) 수 — 신뢰도 프록시
        data_type: integer

  - name: gold_culture_event_schedule
    description: 문화행사 목록 질의 표면 (행사 1행, #187). "이번 주말 ○○구 행사" = 기간 겹침 + gu_code 필터 단독 조회. 6개 silver union + norm_title×시작일×gu 크로스소스 dedup(전문 소스 우선).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: event_ref
        description: "소스 프리픽스 키 ('performance:12345') — 크로스소스 충돌 방지"
        data_type: varchar
        tests: [not_null, unique]
      - name: event_type
        description: 원천 소스 유형 — 서빙에서 아이콘/필터 축
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [event, performance, exhibition, festival, sejong, kcisa]}
      - name: title
        description: 행사명(원문)
        data_type: varchar
        tests: [not_null]
      - name: category
        description: 소스별 분류/장르 원문(값 체계는 event_type 마다 다름 — 통합 분류 아님)
        data_type: varchar
      - name: venue_name
        description: 개최 장소 이름
        data_type: varchar
      - name: is_free
        description: 유·무료 원문 값(varchar — 소스별 표기가 달라 원문 보존, 예 "무료"/"유료"/요금 문구)
        data_type: varchar
      - name: event_start_date
        description: 행사 시작일(KST)
        data_type: date
        tests: [not_null]
      - name: event_end_date
        description: 행사 종료일(KST) — 기간 겹침 질의의 우측 경계
        data_type: date
        tests: [not_null]
      - name: event_at
        description: 행사 시작 시각(KST, #48 시간축 — where 필터 표준 컬럼)
        data_type: timestamp(6)
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름(quality_status=dong_precise 일 때만 신뢰)
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드(행안부 canonical, #48 공간축 조인 키)
        data_type: varchar
      - name: latitude
        description: 위도(WGS84) — 좌표 없는 소스는 null
        data_type: double
      - name: longitude
        description: 경도(WGS84)
        data_type: double
      - name: quality_status
        description: 공간 정밀도(#111) — dong_precise(좌표→행정동 확정)/gu_only(구까지만)/unmatched
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  - name: gold_culture_location_daily
    description: 자치구(gu_code) × 일자 문화활동 집계(기간 겹침 전개). activity_by_dong 의 구 단위 판 + 정밀도 지표.
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 타입은 describe 실측(2026-07-14)
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST) — 행사 기간을 일 단위로 전개한 그레인 축
        data_type: date
        tests: [not_null]
      - name: activities_count
        description: 그날 그 구의 전체 문화활동 수(소스별 count 의 합)
        data_type: bigint
      - name: performances_count
        description: KOPIS 공연 수
        data_type: bigint
      - name: events_count
        description: 서울시 문화행사 수
        data_type: bigint
      - name: festivals_count
        description: 서울시 축제 수
        data_type: bigint
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
      - name: dong_precise_count
        description: "좌표로 행정동까지 정밀한 활동 수(#111 quality_status='dong_precise')"
        data_type: bigint
        tests: [not_null]

  - name: gold_culture_movie_boxoffice_daily
    description: 일별 서울/전국 영화 관객 비중(서울 쏠림). 그레인 boxoffice_date. 시도 그레인이라 자치구 gold 미편입.
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 스파이크 검증 모델
    columns:
      - name: boxoffice_date
        description: 관객일(날짜 1행)
        data_type: date
        tests:
          - not_null
          - unique
      - name: nation_top_audience
        description: 전국 일별 박스오피스 top10 관객수 합(KOBIS)
        data_type: bigint
      - name: seoul_top_audience
        description: 서울 상영분 top10 관객수 합(wideAreaCd=0105001 필터)
        data_type: bigint
      - name: seoul_audience_share
        description: 서울 top10 관객합 / 전국 top10 관객합 (서울 쏠림 신호)
        data_type: decimal(38,18)   # 1.0*x/y = Trino decimal 산술 — double 아님 주의
        tests:
          - not_null
      - name: nation_top_movie
        description: 전국 1위 영화명 — 같은 날 서울 1위와 다를 수 있음(지역 취향 신호)
        data_type: varchar
      - name: seoul_top_movie
        description: 서울 상영분 1위 영화명
        data_type: varchar

  - name: gold_culture_reservation_daily
    description: 자치구(gu_code) × 스냅샷일 공공예약 가용 현황(서울시 공공서비스예약 — 문화·체육 분야).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: snapshot_date
        description: 수집 스냅샷 일(YYYY-MM-DD 문자열)
        data_type: varchar   # 물리 varchar(YYYY-MM-DD 문자열) — date 아님 주의
      - name: total_services
        description: 그 구의 전체 예약 서비스 수
        data_type: bigint
      - name: culture_services
        description: 문화 분야(문화체험 등) 서비스 수
        data_type: bigint
      - name: sport_services
        description: 체육 분야 서비스 수
        data_type: bigint
      - name: open_services
        description: 현재 접수중 상태 서비스 수
        data_type: bigint
      - name: availability_rate
        description: 접수중 비율 = open_services / total_services (0~1)
        data_type: decimal(38,18)   # Trino decimal 산술 결과 — double 아님 주의
      - name: dong_precise_count
        description: "좌표로 행정동까지 정밀한 예약 수(#111 quality_status='dong_precise')"
        data_type: bigint
        tests: [not_null]

  - name: gold_culture_sports_schedule
    description: 서울 야구 경기 일정 질의 표면 (경기 1행). 최근접 미래 경기 = game_date>=current_date order by event_at.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
    columns:
      - name: game_date
        description: 경기일(KST)
        data_type: date
        tests: [not_null]
      - name: event_at
        description: 경기 시작 시각(KST, #48 시간축)
        data_type: timestamp(6)
        tests: [not_null]
      - name: game_time
        description: 시작 시각 원문(HH:MM 문자열)
        data_type: varchar
      - name: stadium
        description: 경기장 이름(현재 시드 커버 = 잠실야구장·고척스카이돔)
        data_type: varchar
        tests: [not_null]
      - name: home_team
        description: 홈팀(KBO 구단명)
        data_type: varchar
      - name: away_team
        description: 원정팀(KBO 구단명)
        data_type: varchar
      - name: gu
        description: 경기장 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 경기장 자치구 코드(#48 공간축)
        data_type: varchar
      - name: latitude
        description: 경기장 위도(WGS84)
        data_type: double
      - name: longitude
        description: 경기장 경도(WGS84)
        data_type: double
      - name: admin_dong
        description: 경기장 행정동 이름
        data_type: varchar
      - name: admin_dong_code
        description: 경기장 행정동 코드(행안부 canonical, #48 공간축 조인 키)
        data_type: varchar
      - name: quality_status
        description: 공간 정밀도(#111) — dong_precise/gu_only/unmatched
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  # --- SLO 마트 gold (tag:slo, #110). contract enforced. 도메인 중립(#6). 비율=decimal(38,18). ---
  - name: gold_culture_slo_daily
    description: 날짜 1행 SLO — scheduled/eod 가용(분모 둘 다)·green_disguise·적재추세. 7/7 회귀 케이스의 기준표.
    config:
      contract: {enforced: true}
    columns:
      - name: domain
        description: 도메인(culture) — 도메인 중립 설계(§6, _shared 승격 대비)
        data_type: varchar
        tests: [not_null]
      - name: event_date
        description: 집계일(KST run_report load_date 기준) — 날짜 1행
        data_type: date
        tests: [not_null, unique]
      - name: scheduled_slo_passed
        description: 그날 scheduled run 이 전부 통과했나(bool_and) — scheduled 없으면 false. "자정 정기런이 제 몫을 했나"
        data_type: boolean
      - name: eod_slo_passed
        description: 그날 아무 run 이든 하나라도 통과했나(bool_or) — 수동 복구 성공도 인정. "그날이 끝날 때 데이터가 있었나"
        data_type: boolean
      - name: best_coverage_pct
        description: 그날 run 중 최고 데이터셋 커버리지(%, 0~100)
        data_type: decimal(38,18)
      - name: failed_dataset_count
        description: 실패 데이터셋 수 합(run_report failed 합산)
        data_type: bigint
      - name: violation_count
        description: 계약(min_rows 등) 위반 수 합
        data_type: bigint
      - name: total_rows
        description: 그날 최대 적재 행수(run 별 total_rows 의 max)
        data_type: bigint
      - name: ingest_duration_min
        description: culture_bronze 적재 소요 합(분) — dag_run enrichment(#411) 유래, 미적재 시 0
        data_type: decimal(38,18)
      - name: transform_runs
        description: 그날 culture_transform run 수(dag_run enrichment #411)
        data_type: bigint
      - name: transform_all_success
        description: 그날 transform 이 전부 success 였나 — 7/17 freshness 사고를 false 로 실측한 컬럼
        data_type: boolean
      - name: maintenance_ran
        description: 그날 culture_maintenance 성공 run 존재 여부
        data_type: boolean
      - name: green_disguise_runs
        description: 초록 위장 run 수 — Airflow success 인데 expected=0(전멸) 이라 raw 통과가 무의미한 경우(7/7 실사례)
        data_type: bigint

  - name: gold_culture_venue_profile
    description: 시설(facility_id) 1행 프로필 — "그 공연장 어떤 곳이야"(Q&A metric, #278). 주소·좌표 100%, seat_scale 63.7% 충전. 공연 통계는 KOPIS 공연 기준(보유 시설 421) — 전시·축제 미포함. 외부 카탈로그 비공개(meta.external=false, #269).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        external: false  # Q&A 전용 내부 마트 — 외부 카탈로그 노출 제외(#269, 대시보드 PR#6 메커니즘)
    columns:
      - name: facility_id
        description: KOPIS 시설 ID(mt10id) — PK
        data_type: varchar
        tests: [not_null, unique]
      - name: facility_name
        description: 시설명
        data_type: varchar
      - name: address
        description: 주소(충전 100%)
        data_type: varchar
        tests: [not_null]
      - name: latitude
        description: 위도(충전 100%)
        data_type: double
        tests: [not_null]
      - name: longitude
        description: 경도(충전 100%)
        data_type: double
        tests: [not_null]
      - name: seat_scale
        description: 좌석 규모(KOPIS 0/공백→null 정규화, 충전 63.7%)
        data_type: integer
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드(행안부 canonical)
        data_type: varchar
      - name: perf_count
        description: KOPIS 공연수(링크 없으면 0) — 전시·축제 미포함 캐비앗은 모델 설명 참조
        data_type: integer
        tests: [not_null]
      - name: distinct_genres
        description: 공연 장르 수
        data_type: integer
      - name: top_genre
        description: 최다 장르(max_by, 공연 없으면 null)
        data_type: varchar
      - name: top_genre_count
        description: 최다 장르 공연수
        data_type: integer
      - name: first_perf_date
        description: 첫 공연 시작일
        data_type: date
      - name: last_perf_date
        description: 마지막 공연 종료일
        data_type: date
      - name: quality_status
        description: facility dim quality_status 전파(#111)
        data_type: varchar

  - name: gold_culture_qa_eval
    description: 페르소나 질문 카탈로그 × 라우팅 커버리지(티어링 #20, #284, 그레인 question_id). 페르소나 원천 nvidia/Nemotron-Personas-Korea(CC-BY-4.0) 15명 샘플. answerable(큐레이션)과 mart_exists(information_schema 실측) 분리 — eval_ready=W7 평가셋 투입 가능. 답불가 행의 unanswerable_reason=수집 로드맵 재료. 내부 전용(meta.external=false).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        external: false  # Q&A 거버넌스 내부 마트 — 외부 카탈로그 노출 제외(#269)
    columns:
      - name: question_id
        description: 질문 ID(QA001…) — PK
        data_type: varchar
        tests: [not_null, unique]
      - name: persona_uuid
        description: Nemotron 페르소나 uuid(출처 추적 — 스냅샷 JSON 조인 키)
        data_type: varchar
      - name: persona_summary
        description: 페르소나 한 줄 요약
        data_type: varchar
      - name: home_region
        description: 페르소나 원거주지(Nemotron district)
        data_type: varchar
      - name: visit_context
        description: 부여된 서울 방문 상황(계획안 거주지 해법 — 전국 페르소나를 서울 방문자로)
        data_type: varchar
      - name: persona_lens
        description: 질문 생성 렌즈(travel/culinary/family/sports/arts)
        data_type: varchar
      - name: question_text
        description: 자연어 질문
        data_type: varchar
      - name: target_mart
        description: 라우팅 대상 gold 마트명(답가능 시 필수, 답불가면 null)
        data_type: varchar
      - name: target_columns
        description: 근거 컬럼(콤마 구분)
        data_type: varchar
      - name: answerable
        description: 현행 데이터로 답 가능 여부(큐레이션 의도)
        data_type: boolean
        tests: [not_null]
      - name: unanswerable_reason
        description: 답불가 사유 + 로드맵 힌트(답불가 시 필수)
        data_type: varchar
      - name: mart_exists
        description: target_mart가 카탈로그에 실존하는가 — information_schema 실측. 검사 스코프=culture+채택 도메인(seoul_citydata·weather·transit, 티어링 v2 #310)
        data_type: boolean
      - name: eval_ready
        description: answerable AND mart_exists — W7 평가셋 투입 가능(라우팅 건전성 신호)
        data_type: boolean

  - name: gold_culture_dine_around
    description: 동별 문화 밀도 × 요식업 스톡 프로필(그레인 admin_dong_code, 426동 스카폴드, #308·티어링 v2). culture 첫 commerce 크로스도메인 read. 문화 축=다가오는 90일 행사량(빌드 시점 롤링), 요식업 축=식품 인허가 active 스톡. dine_around_score=두 축 percent_rank 기하평균 — "공연 보고 밥 먹기 좋은 동네" 정렬 키. ⚠ commerce 동 매핑 커버리지 219/426(51.4%) — 미커버 동은 has_dining_data=false·dining_*/score null.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        external: true   # 외부 카탈로그 공개(#269 티어링 v2 — 명시적 true 첫 사용, #308 AC)
    columns:
      - name: admin_dong_code
        description: 행정동 코드(#48 행안부10 canonical) — 그레인 키
        data_type: varchar
        tests: [not_null, unique]
      - name: admin_dong
        description: 행정동 이름
        data_type: varchar
        tests: [not_null]
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: events_upcoming_90d
        description: 다가오는 90일(current_date~+90d) 문화 행사·활동 총량(activities_count 합)
        data_type: integer
        tests: [not_null]
      - name: performances_upcoming_90d
        description: 다가오는 90일 공연 수(performances_count 합) — "공연 보고" 축의 직접 지표
        data_type: integer
        tests: [not_null]
      - name: dining_active_cnt
        description: 식품 인허가 영업중(active) 스톡 — commerce gold_license_dong_category_matrix(category='food'). 미커버 동은 null
        data_type: integer
      - name: dining_opened_365d
        description: 최근 365일 식품 신규 개업 수 — 상권 활력 프록시. 미커버 동은 null
        data_type: integer
      - name: has_dining_data
        description: commerce 동 매핑 커버 여부(219/426, 7/21 실측) — false면 dining_*·dining_stock_pctl·dine_around_score 전부 null
        data_type: boolean
        tests: [not_null]
      - name: culture_events_pctl
        description: events_upcoming_90d 의 426동 내 percent_rank(0~1, 높을수록 문화 밀도 상위)
        data_type: double
        tests: [not_null]
      - name: dining_stock_pctl
        description: dining_active_cnt 의 커버 동(219) 내 percent_rank(0~1). 미커버 동은 null
        data_type: double
      - name: dine_around_score
        description: sqrt(culture_events_pctl × dining_stock_pctl) — 둘 다 높아야 높은 결합 점수(0~1). 미커버 동은 null
        data_type: double
