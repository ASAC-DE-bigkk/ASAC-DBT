    columns:
      - name: boxoffice_date
        description: 관객일(날짜 1행)
        data_type: date
        tests:
          - not_null
          - unique
      - name: nation_top_audience
        description: 전국 일별 박스오피스 top10 관객수 합(KOBIS)
        data_type: bigint
      - name: seoul_top_audience
        description: 서울 상영분 top10 관객수 합(wideAreaCd=0105001 필터)
        data_type: bigint
      - name: seoul_audience_share
        description: 서울 top10 관객합 / 전국 top10 관객합 (서울 쏠림 신호)
