          combination_of_columns: [gu_code, day_of_week, hour_of_day]
    columns:
      - name: gu_code
        description: 자치구 코드 — 혼잡 관측과 행사 데이터를 잇는 공통 키
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: day_of_week
        description: 요일(1=월요일 … 7=일요일)
        data_type: integer
        tests: [not_null]
      - name: hour_of_day
        description: 시각(0~23, KST). 최근 18일 관측을 요일×시각 칸으로 모아 계산했다
        data_type: integer
        tests: [not_null]
      - name: avg_ppltn
        description: 그 시간대 그 자치구 주요 지점의 평균 실시간 인구(명)
        data_type: integer
      - name: avg_congest_score
        description: 평균 혼잡 점수(여유 1 · 보통 2 · 약간 붐빔 3 · 붐빔 4). 높을수록 붐빈다
        data_type: double
      - name: typical_congest
        description: 그 시간대 최빈 혼잡 레벨(여유/보통/약간 붐빔/붐빔)
        data_type: varchar
      - name: crowd_samples
        description: 계산에 사용한 관측 건수 — 값이 클수록 신뢰도가 높다
        data_type: integer

