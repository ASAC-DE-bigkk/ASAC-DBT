        data_type: varchar
      - name: persona_lens
        description: 질문 생성 렌즈(travel/culinary/family/sports/arts)
        data_type: varchar
      - name: question_text
        description: 자연어 질문
        data_type: varchar
      - name: target_mart
        description: 라우팅 대상 gold 마트명(답가능 시 필수, 답불가면 null)
        data_type: varchar
      - name: target_columns
        description: 근거 컬럼(콤마 구분)
        data_type: varchar
      - name: answerable
        description: 현행 데이터로 답 가능 여부(큐레이션 의도)
        data_type: boolean
        tests: [not_null]
      - name: unanswerable_reason
        description: 답불가 사유 + 로드맵 힌트(답불가 시 필수)
        data_type: varchar
      - name: mart_exists
        description: 'target_mart가 카탈로그에 실존하는가 — information_schema 실측. 검사 스코프=culture+채택 도메인(seoul_citydata·weather·transit, 티어링 v2 #310)'
        data_type: boolean
      - name: eval_ready
        description: answerable AND mart_exists — W7 평가셋 투입 가능(라우팅 건전성 신호)
        data_type: boolean

  - name: gold_culture_dine_around
    description: '동별 문화 밀도 × 요식업 스톡 프로필(그레인 admin_dong_code, 426동 스카폴드, #308·티어링 v2). culture 첫 commerce 크로스도메인 read. 문화 축=다가오는 90일 행사량(빌드 시점 롤링), 요식업 축=식품 인허가 active 스톡. dine_around_score=두 축 percent_rank 기하평균 — "공연 보고 밥 먹기 좋은 동네" 정렬 키. ⚠ commerce 동 매핑 커버리지 219/426(51.4%) — 미커버 동은 has_dining_data=false·dining_*/score null.'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 명부성이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_dine_around
          product_question: "행사 많은 동네 주변 외식 상권은 어디인가?"
          grain: "행정동(admin_dong_code)마다 한 행"
          primary_key: [admin_dong_code]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 문화·미식 동반 추천 지수
          summary: 동네마다 앞으로 90일간 예정된 문화행사량과 영업 중인 음식점 규모를 나란히 점수화했습니다. 두 값이 모두 높은 동네일수록 점수가 높아 "공연 보고 밥 먹기 좋은 동네" 정렬에 그대로 쓸 수 있습니다.
          caveat: 음식점 데이터가 연결된 동은 426곳 중 219곳입니다. 나머지 동은 문화 지표만 채워지고 점수는 비어 있습니다(has_dining_data 로 구분).
          use_cases:
            - 데이트·나들이 코스 추천
            - 상권 입지 검토
            - 지역 관광 코스 설계
    columns:
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리. 이 표의 기본 키
        data_type: varchar
        tests: [not_null, unique]
      - name: admin_dong
        description: 행정동 이름
        data_type: varchar
        tests: [not_null]
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: events_upcoming_90d
        description: 앞으로 90일간 예정된 문화행사·활동 총량
        data_type: integer
        tests: [not_null]
      - name: performances_upcoming_90d
        description: 앞으로 90일간 예정된 공연 수
        data_type: integer
        tests: [not_null]
      - name: dining_active_cnt
        description: 영업 중인 음식점 수(식품 인허가 기준). 음식점 데이터가 연결되지 않은 동은 비어 있다
        data_type: integer
      - name: dining_opened_365d
        description: 최근 365일간 새로 문을 연 음식점 수 — 상권 활력 지표
        data_type: integer
      - name: has_dining_data
        description: 음식점 데이터가 연결된 동인지 여부. false 면 음식점 관련 값과 점수가 모두 비어 있다
        data_type: boolean
        tests: [not_null]
      - name: culture_events_pctl
        description: 426개 동 중 문화행사량 백분위(0~1, 클수록 상위)
        data_type: double
        tests: [not_null]
      - name: dining_stock_pctl
        description: 음식점 데이터가 있는 219개 동 중 음식점 수 백분위(0~1)
        data_type: double
      - name: dine_around_score
        description: 문화 백분위와 음식점 백분위의 기하평균(0~1). 둘 다 높아야 점수가 높다
        data_type: double
