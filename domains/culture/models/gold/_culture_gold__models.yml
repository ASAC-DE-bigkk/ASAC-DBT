version: 2

# culture gold 계약·테스트 (#200 — schema.yml 을 layer 별로 분리, 모델명 정렬).
# published gold 전 모델 contract enforced(#180). silver 는 models/silver/_culture_silver__models.yml.
# 컬럼 description 전수 작성(#242) — grain·단위·KST 여부·산식 근거를 명시. 카탈로그가 노출한다.

models:
  - name: gold_culture_activity_by_dong
    description: 행정동(admin_dong_code) × 일자 문화활동 집계(#48). dim_admin_dong 426동 scaffold라 활동 0건 동도 0으로 존재. sports 제외.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346, ASAC-DAG docs/contracts/serving-contract-v1.md)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_activity_by_dong
          product_question: "어느 행정동에서 언제 문화 활동이 얼마나 열리나?"
          grain: "행정동×날짜마다 한 행"
          primary_key: [admin_dong_code, event_date]
          event_time: event_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 행정동별 일자 문화활동량
          summary: 서울 426개 행정동에 대해 하루 단위로 문화활동이 몇 건 열리는지 집계했습니다. 공연·행사·축제·전시 등 유형별 건수와 함께 무료 행사, 교육·체험 행사 건수를 따로 제공합니다.
          caveat: 행사가 없는 동도 0으로 채워져 있어 지도나 시계열에 그대로 얹을 수 있습니다. 무료 여부는 서울시 문화행사 출처에만 있어 그 범위의 건수입니다.
          use_cases:
            - 생활권 문화 인프라 격차 분석
            - 부동산·상권 리포트의 생활편의 지표
            - 동 단위 문화 히트맵
    tests:
      # 서빙 계약 PK 근거(#346) — validator 가 yml 선언만 인정(싱귤러는 불변식 겸용으로 별도 유지)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, event_date]
    columns:
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리. 다른 행정동 데이터와 붙이는 조인 키
        data_type: varchar
        tests: [not_null]
      - name: admin_dong
        description: 행정동 이름(예 명동)
        data_type: varchar
      - name: gu_code
        description: 자치구 코드(구 롤업 키)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름(예 중구)
        data_type: varchar
      - name: stat_region_cd
        description: 통계청 집계구 코드 — 통계청 인구·가구 통계와 붙일 때 사용
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        tests: [not_null]
      - name: activities_count
        description: 그날 그 동에서 열린 전체 문화활동 수 — 아래 유형별 건수의 합
        data_type: bigint
      - name: performances_count
        description: KOPIS 공연 수
        data_type: bigint
      - name: events_count
        description: 서울시 문화행사 수
        data_type: bigint
      - name: festivals_count
        description: 서울시 축제 수
        data_type: bigint
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
      - name: kcisa_count
        description: KCISA 국립문화기관 행사 수
        data_type: bigint
      - name: free_events_count
        description: 그날 그 동의 무료 문화행사 수. 유·무료 표기는 서울시 문화행사 출처에만 있어 그 범위의 건수
        data_type: bigint
      - name: edu_experience_events_count
        description: 그날 그 동의 교육·체험 분류 행사 수
        data_type: bigint

  - name: gold_culture_booking_curve
    description: "공연별 예매상황판 순위 궤적 요약(그레인 performance_id, 1공연 1행, #269). KOPIS는 순위(rank)만 제공 — 예매율·판매좌석·매진 데이터 없어 '순위 궤적'으로 실현. boxoffice_daily(스냅샷별)와 그레인 다름."
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 스냅샷 요약이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_booking_curve
          product_question: "공연 예매 인기가 개막까지 어떤 궤적으로 차오르나?"
          grain: "공연(performance_id)마다 한 행"
          primary_key: [performance_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 공연별 인기 궤적 요약
          summary: 공연 한 편이 예매 순위에 언제 진입해 며칠 머물렀고 최고 몇 위까지 올랐는지를 한 행으로 요약했습니다. 진입 순위와 마지막 순위가 함께 있어 상승세인지 하락세인지 바로 판단할 수 있습니다.
          caveat: 순위 기반 지표만 제공합니다. 원천에 예매율·판매 좌석 수·매진 여부가 없고, 순위 50위 밖에 있던 기간은 집계되지 않습니다.
          use_cases:
            - 공연 마케팅 성과 벤치마킹
            - 흥행 예측 모델 입력
            - 장르별 인기 수명주기 비교
    columns:
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 한 편당 하나, 이 표의 기본 키
        data_type: varchar
        tests: [not_null, unique]
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르 원문
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: first_seen_date
        description: 이 공연이 예매 top50에 처음 등장한 스냅샷 일(KST)
        data_type: date
      - name: last_seen_date
        description: 마지막으로 top50에 있던 스냅샷 일(KST)
        data_type: date
      - name: days_on_chart
        description: 예매 순위표에 등장한 누적 일수 — 체류 기간
        data_type: integer
      - name: best_rank
        description: 이력 중 가장 높았던 순위(숫자가 작을수록 상위, 1이 최상위)
        data_type: integer
      - name: best_rank_date
        description: best_rank 를 처음 달성한 스냅샷 일(KST)
        data_type: date
      - name: days_to_peak
        description: 첫 등장부터 최고 순위에 도달하기까지 걸린 일수
        data_type: integer
      - name: first_rank
        description: 첫 등장일의 순위(진입 순위)
        data_type: integer
      - name: last_rank
        description: 마지막 스냅샷의 순위(현재 순위)
        data_type: integer

  - name: gold_culture_boxoffice_daily
    description: KOPIS 예매 랭킹 일 스냅샷(snapshot_date × rank_no). "요즘 핫한 공연" — 스냅샷이 매일 쌓여 예매 추이 시계열의 원천이 된다.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — PK = 모델 선언 그레인(snapshot_date × rank_no)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_boxoffice_daily
          product_question: "지금 서울에서 예매 상위 공연은 무엇인가?"
          grain: "스냅샷일×순위마다 한 행"
          primary_key: [snapshot_date, rank_no]
          event_time: snapshot_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 공연 예매 랭킹 (일별)
          summary: 공연 예매 순위를 매일 한 번 찍어 쌓은 데이터입니다. 3일 전 순위와의 변동폭, 차트 체류 일수, 신규 진입 여부까지 계산돼 있어 "요즘 뜨는 공연"을 바로 뽑을 수 있습니다.
          caveat: 원천이 순위만 제공합니다. 예매율·판매 좌석 수·매출액은 포함되지 않습니다.
          use_cases:
            - 인기 공연 큐레이션
            - 장르별 흥행 추이 리포트
            - 공연 추천 모델의 인기도 피처
    tests:
      # 서빙 계약 PK 근거(#346) — 그레인은 모델 선언(snapshot_date × rank_no) 그대로
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_date, rank_no]
    columns:
      - name: snapshot_date
        description: 순위를 집계한 날(YYYY-MM-DD). 문자열로 저장된다
        data_type: varchar
        tests: [not_null]
      - name: rank_no
        description: 예매 순위(1=최다) — snapshot_date 안에서 유일
        data_type: integer
        tests: [not_null]
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 상세 정보와 붙이는 조인 키
        data_type: varchar
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르(연극·뮤지컬·클래식 등 원문 분류)
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: perf_count
        description: 상연 횟수(KOPIS 원문)
        data_type: integer
      - name: seat_count
        description: 공연장 좌석 수 — 공연 규모를 가늠하는 값
        data_type: integer
      - name: gu_code
        description: 공연장이 속한 자치구 코드
        data_type: varchar
      - name: gu
        description: 공연장 자치구 이름
        data_type: varchar
      - name: rank_prev_3d
        description: 3일 전 같은 공연의 순위. 그때 순위표에 없었으면 비어 있다
        data_type: integer
      - name: rank_delta_3d
        description: 순위 상승폭(3일 전 순위 − 오늘 순위). 양수면 상승, 비어 있으면 신규 또는 재진입
        data_type: integer
      - name: days_on_chart
        description: 이 공연이 순위표에 등장한 누적 일수(오늘 포함)
        data_type: integer
      - name: is_new_entry
        description: 어제는 없다가 오늘 진입했는지 여부(첫 진입·재진입 공통)
        data_type: boolean
      - name: momentum_status
        description: "순위 모멘텀: new(어제 부재)·rising(순위 상승)·falling(하락)·steady(변동 없음/추세 미정)"
        data_type: varchar

  - name: gold_culture_calendar_density
    description: 일×구 문화 밀도·경쟁 지수(#269). 시민 "볼 게 많은 날"=total_events, 주최자 "피해야 할 날"=concentration. int_culture_activity_days 재사용 — location_daily가 유형별 count면 여기는 다양성·집중도 요약. 그레인 gu_code×event_date.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_calendar_density
          product_question: "구별로 어느 날짜에 행사가 몰리나(밀집도)?"
          grain: "구×날짜마다 한 행"
          primary_key: [gu_code, event_date]
          event_time: event_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 자치구 일자별 문화행사 밀도
          summary: 자치구마다 하루에 행사가 몇 건 열리고 그중 한 유형에 얼마나 몰리는지를 요약했습니다. 볼거리가 많은 날을 찾는 쪽과, 행사를 새로 열 때 경쟁을 피할 날을 고르는 쪽 모두가 같은 표를 씁니다.
          use_cases:
            - 행사 개최일 선정
            - 이번 주 볼거리 많은 자치구 콘텐츠
            - 지역별 문화 공급 편차 분석
    tests:
      # 서빙 계약 PK 근거(#346)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gu_code, event_date]
    columns:
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        tests: [not_null]
      - name: total_events
        description: 그날 그 구에서 열린 전체 문화활동 수 — "볼 게 많은 날" 지표
        data_type: integer
      - name: distinct_types
        description: 그날 열린 활동 유형 수(공연·행사·축제·전시·세종·kcisa 중 몇 종) — 다양성
        data_type: integer
      - name: busiest_type
        description: 그날 가장 많이 열린 활동 유형(동수 시 임의 1개)
        data_type: varchar
      - name: busiest_type_count
        description: 가장 많이 열린 유형의 행사 수 — 같은 유형끼리의 경쟁 규모
        data_type: integer
      - name: concentration
        description: 경쟁 집중도(busiest_type_count / total_events, 0~1) — 1=한 유형 독점, 낮을수록 다양
        data_type: double

  - name: gold_culture_event_crowd
    description: '문화 행사 자치구의 요일×시간대별 평시 혼잡 베이스라인(그레인 gu_code×day_of_week×hour_of_day, #276·v2 #282). citydata gold를 크로스도메인 source로 읽어 event_schedule 있는 gu로 스코프. "그 행사 지역 무슨 요일 몇 시가 붐비나/한적한가". ⚠~120 핫스팟 한정 평시 베이스라인 — 특정 행사일 실측 lift 아님.'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 요일축 명부성이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_event_crowd
          product_question: "무슨 요일 몇 시에 행사 주변이 붐비나?"
          grain: "구×요일×시간대마다 한 행"
          primary_key: [gu_code, day_of_week, hour_of_day]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 행사 지역 요일·시간대 혼잡도
          summary: 문화행사가 열리는 자치구가 요일과 시간대별로 평소 얼마나 붐비는지에 대한 기준선입니다. 서울시 실시간 도시데이터의 인구·혼잡 관측을 요일×시간 칸으로 모아 평균 인구와 대표 혼잡 등급을 계산했습니다.
          caveat: 특정 행사 당일의 증가분이 아니라 평상시 패턴입니다. 서울시가 관측하는 주요 지점 기준이라 자치구 전역을 대표하지는 않습니다.
          use_cases:
            - 방문 시간대 추천
            - 행사 운영 인력·안전 배치 계획
            - 한적한 관람 시간 안내
    tests:
      # 서빙 계약 PK 근거(#346)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gu_code, day_of_week, hour_of_day]
    columns:
      - name: gu_code
        description: 자치구 코드 — 혼잡 관측과 행사 데이터를 잇는 공통 키
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: day_of_week
        description: 요일(1=월요일 … 7=일요일)
        data_type: integer
        tests: [not_null]
      - name: hour_of_day
        description: 시각(0~23, KST). 최근 18일 관측을 요일×시각 칸으로 모아 계산했다
        data_type: integer
        tests: [not_null]
      - name: avg_ppltn
        description: 그 시간대 그 자치구 주요 지점의 평균 실시간 인구(명)
        data_type: integer
      - name: avg_congest_score
        description: 평균 혼잡 점수(여유 1 · 보통 2 · 약간 붐빔 3 · 붐빔 4). 높을수록 붐빈다
        data_type: double
      - name: typical_congest
        description: 그 시간대 최빈 혼잡 레벨(여유/보통/약간 붐빔/붐빔)
        data_type: varchar
      - name: crowd_samples
        description: 계산에 사용한 관측 건수 — 값이 클수록 신뢰도가 높다
        data_type: integer

  - name: gold_culture_event_schedule
    description: '문화행사 목록 질의 표면 (행사 1행, #187). "이번 주말 ○○구 행사" = 기간 겹침 + gu_code 필터 단독 조회. 6개 silver union + norm_title×시작일×gu 크로스소스 dedup(전문 소스 우선).'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_event_schedule
          product_question: "이번 주말·특정 기간 서울에서 무슨 문화행사가 열리나?"
          grain: "행사(event_ref)마다 한 행"
          primary_key: [event_ref]
          event_time: event_start_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
        display:
          title: 서울 문화행사 통합 일정
          summary: 서울에서 열리는 공연·전시·축제·체험 행사를 한 행에 하나씩 모은 통합 일정표입니다. 시작일과 종료일, 장소 이름과 좌표, 자치구·행정동, 유·무료 표기가 함께 들어 있어 "이번 주말 성동구 행사" 같은 조회를 이 데이터셋 하나로 끝낼 수 있습니다.
          caveat: 6개 출처를 합치면서 같은 행사가 중복되지 않도록 정리했습니다. 분류(category) 값은 출처마다 체계가 달라 통합 분류가 아닙니다.
          use_cases:
            - 주말 나들이 추천 서비스의 행사 목록
            - 지역 문화 소식 뉴스레터
            - 행사 밀집 지역 분석
    columns:
      - name: event_ref
        description: 행사 고유 키. 출처 접두어가 붙는다(예 performance:12345)
        data_type: varchar
        tests: [not_null, unique]
      - name: event_type
        description: 행사 출처 유형 — 목록에서 아이콘·필터로 쓰기 좋은 축
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [event, performance, exhibition, festival, sejong, kcisa]}
      - name: title
        description: 행사명(원문)
        data_type: varchar
        tests: [not_null]
      - name: category
        description: 소스별 분류/장르 원문(값 체계는 event_type 마다 다름 — 통합 분류 아님)
        data_type: varchar
      - name: venue_name
        description: 개최 장소 이름
        data_type: varchar
      - name: is_free
        description: 유·무료 원문 값(varchar — 소스별 표기가 달라 원문 보존, 예 "무료"/"유료"/요금 문구)
        data_type: varchar
      - name: event_start_date
        description: 행사 시작일(KST)
        data_type: date
        tests: [not_null]
      - name: event_end_date
        description: 행사 종료일(KST) — 기간 겹침 질의의 우측 경계
        data_type: date
        tests: [not_null]
      - name: event_at
        description: 행사 시작 시각(KST) — 기간 조회의 표준 필터 컬럼
        data_type: timestamp(6)
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름. quality_status 가 dong_precise 일 때만 신뢰할 수 있다
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리
        data_type: varchar
      - name: latitude
        description: 위도(WGS84) — 좌표 없는 소스는 null
        data_type: double
      - name: longitude
        description: 경도(WGS84)
        data_type: double
      - name: quality_status
        description: 위치 정밀도 — dong_precise(행정동까지 확정) / gu_only(자치구까지) / unmatched(미확정)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

