version: 2

# culture gold 계약·테스트 (#200 — schema.yml 을 layer 별로 분리, 모델명 정렬).
# published gold 전 모델 contract enforced(#180). silver 는 models/silver/_culture_silver__models.yml.
# 컬럼 description 전수 작성(#242) — grain·단위·KST 여부·산식 근거를 명시. 카탈로그가 노출한다.

models:
  - name: gold_culture_activity_by_dong
    description: 행정동(admin_dong_code) × 일자 문화활동 집계(#48). dim_admin_dong 426동 scaffold라 활동 0건 동도 0으로 존재. sports 제외.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346, ASAC-DAG docs/contracts/serving-contract-v1.md)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_activity_by_dong
          product_question: "어느 행정동에서 언제 문화 활동이 얼마나 열리나?"
          grain: "행정동×날짜마다 한 행"
          primary_key: [admin_dong_code, event_date]
          event_time: event_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # #406: `source_evidence`는 Publisher가 D1 d1_catalog_sources에 함께 게시하는
          # 공개 권리·출처 정본이다. 6개 원천 모두 외부 API 재배포와 출처표시 승인을
          # 확인했으므로 Publisher가 동일 publication_id로 게시하면 Worker가 등록 준비 상태를 판정한다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          quality_coverage:
            field: admin_dong_code
            expected_distinct_count: 426
            minimum_ratio: 1.0
          public_projection:
            schema_version: "1.0.0"
            columns: [admin_dong_code, admin_dong, gu_code, gu, stat_region_cd, event_date, activities_count, performances_count, events_count, kopis_festivals_count, exhibitions_count, sejong_count, kcisa_count, free_events_count, edu_experience_events_count, festival_events_count]
          # usage_patterns — ASAC-DAG#638 v1 규격. requires 는 고정 어휘 11개에서, basic
          # 프로파일(등호 필터·시간축 from/to·limit·전체 컬럼) 위의 추가분만 적는다.
          # sql 은 참조 구현(D1/SQLite 방언)이다 — 클라이언트가 보내 실행하는 값이 아니다.
          # verified_* 는 2026-07-31 팀 D1 라이브 게시본 실측(ASAC-DAG#600 Phase 0 산출)을
          # 옮긴 값 — 검증 스크립트가 생기면 그 산출로 대체한다(#638 §1).
          usage_patterns:
            - pattern_id: free_edu_dongs
              question_ko: 무료·교육체험 행사가 많은 동네(행정동)는 어디인가?
              axes: 동 랭킹 — 기간 합산 free+edu DESC
              requires: [select_columns, aggregate, group_by, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: d45c9031b04b460ab6a946b6fefa15fb
              insight_sample_ko: 사직동이 7월 무료 1,024·교육체험 671건으로 1위.
              sql: |
                -- :from, :n=10
                SELECT admin_dong, gu, SUM(free_events_count) AS free_cnt,
                       SUM(edu_experience_events_count) AS edu_cnt
                FROM gold_culture_activity_by_dong
                WHERE event_date >= :from
                GROUP BY admin_dong, gu ORDER BY free_cnt + edu_cnt DESC LIMIT :n
            - pattern_id: exhibition_dongs
              question_ko: 전시 많이 하는 동네는 어디인가?
              axes: 동 랭킹 — 기간 합산 exhibitions DESC
              requires: [select_columns, aggregate, group_by, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: d45c9031b04b460ab6a946b6fefa15fb
              insight_sample_ko: 하계2동 691건 — 서울시립 북서울미술관 효과.
              sql: |
                -- :from, :n=10
                SELECT admin_dong, gu, SUM(exhibitions_count) AS ex_cnt
                FROM gold_culture_activity_by_dong
                WHERE event_date >= :from
                GROUP BY admin_dong, gu ORDER BY ex_cnt DESC LIMIT :n
            # 위 둘은 "어느 동네인가"(동 랭킹)를 묻는다. 한 동네를 정해 놓고 그 안의
            # 시간 흐름을 보는 축이 없어서 더한다 — 같은 표를 세로가 아니라 가로로 읽는 질의다.
            - pattern_id: dong_activity_trend
              question_ko: 우리 동네 문화활동이 요즘 늘고 있나, 줄고 있나?
              axes: 필터(admin_dong) + 기간 — event_date DESC 시계열
              requires: [select_columns, filter_range, sort]
              verified_rows: 30
              verified_at: "2026-08-05"
              verified_publication_id: 4bc2e5c82e5d49fe8f439cbdcc89b491
              insight_sample_ko: 가양1동 7/1~8/5 누적 158건 — 하루 평균 4.4건.
              sql: |
                -- :dong, :from, :to, :n=30
                SELECT event_date, activities_count, performances_count,
                       events_count, exhibitions_count
                FROM gold_culture_activity_by_dong
                WHERE admin_dong = :dong AND event_date BETWEEN :from AND :to
                ORDER BY event_date DESC LIMIT :n
          display:
            title: 행정동별 일자 문화활동량
            summary: 서울 426개 행정동에 대해 하루 단위로 문화활동이 몇 건 열리는지 집계했습니다. 공연·행사·전시·세종문화회관·국립문화기관 5개 출처별 건수와 함께, 축제·무료·교육체험 행사 건수를 따로 제공합니다.
            caveat: 전체 건수는 중복을 제거한 값이라 유형별 건수를 더한 값과 다를 수 있습니다 — 축제는 공연과 같은 출처(KOPIS)의 같은 공연이고, 무료·교육체험·축제 행사는 행사 건수 안에 포함됩니다. 총계가 필요하면 전체 건수를 그대로 쓰십시오. 행사가 없는 동도 0으로 채워져 있어 지도나 시계열에 그대로 얹을 수 있습니다. 좌표가 없어 행정동을 확정하지 못한 활동은 빠집니다(전체의 2.3%, 전시는 17.5%·국립문화기관은 12.8%로 편차가 큽니다 — 구 단위 집계가 필요하면 별도 제품을 쓰십시오). 날짜는 최근 90일부터 향후 1년까지만 담습니다.
            use_cases:
              - 생활권 문화 인프라 격차 분석
              - 부동산·상권 리포트의 생활편의 지표
              - 동 단위 문화 히트맵
    tests:
      # 서빙 계약 PK 근거(#346) — validator 가 yml 선언만 인정(싱귤러는 불변식 겸용으로 별도 유지)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, event_date]
    columns:
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리. 다른 행정동 데이터와 붙이는 조인 키
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: false, null_meaning: not_applicable, unit: code}}
        tests: [not_null]
      - name: admin_dong
        description: 행정동 이름(예 명동)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_name, nullable: true, null_meaning: 행정동 이름 매핑이 제공되지 않음, unit: name}}
      - name: gu_code
        description: 자치구 코드(구 롤업 키)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: false, null_meaning: not_applicable, unit: code}}
        tests: [not_null]
      - name: gu
        description: 자치구 이름(예 중구)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_name, nullable: true, null_meaning: 자치구 이름 매핑이 제공되지 않음, unit: name}}
      - name: stat_region_cd
        description: 통계청 집계구 코드 — 통계청 인구·가구 통계와 붙일 때 사용
        data_type: varchar
        config: {meta: {semantic_role: statistical_area_id, nullable: true, null_meaning: 원천 통계청 집계구 코드가 제공되지 않음, unit: code}}
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        config: {meta: {semantic_role: event_date, nullable: false, null_meaning: not_applicable, unit: date}}
        tests: [not_null]
      - name: activities_count
        description: 그날 그 동에서 열린 전체 문화활동 수 — 활동 ID 기준 중복을 제거한 값이며 총계는 언제나 이 열을 쓴다. 유형별 열을 더해서 총계를 만들지 말 것(KOPIS 가 같은 공연을 공연목록·축제목록에 함께 실어 kopis_festivals_count 가 performances_count 와 겹치고, 무료·교육체험·축제 행사 수도 events_count 의 부분집합이다)
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 활동 없음은 0, unit: count}}
      - name: performances_count
        description: KOPIS 공연 수 (kopis_festivals_count 를 포함한다)
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 공연 없음은 0, unit: count}}
      - name: events_count
        description: 서울시 문화행사 수 (free_events_count·edu_experience_events_count·festival_events_count 를 포함한다)
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 행사 없음은 0, unit: count}}
      - name: kopis_festivals_count
        description: KOPIS 공연 중 축제로 분류된 수 — performances_count 의 부분집합이다(KOPIS 가 같은 공연 ID를 공연목록과 축제목록에 함께 싣는다). 서울시가 여는 축제는 festival_events_count 를 볼 것
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; KOPIS 축제 없음은 0, unit: count}}
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 전시 없음은 0, unit: count}}
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 세종문화회관 공연 없음은 0, unit: count}}
      - name: kcisa_count
        description: KCISA 국립문화기관 행사 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; KCISA 행사 없음은 0, unit: count}}
      - name: free_events_count
        description: 그날 그 동의 무료 문화행사 수. 유·무료 표기는 서울시 문화행사 출처에만 있어 그 범위의 건수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 무료 행사 없음은 0, unit: count}}
      - name: edu_experience_events_count
        description: 그날 그 동의 교육·체험 분류 행사 수 — events_count 의 부분집합
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 교육·체험 행사 없음은 0, unit: count}}
      - name: festival_events_count
        description: 그날 그 동의 축제 분류 행사 수 — 서울시 문화행사의 축제 6분류(문화/예술·기타·전통/역사·자연/경관·시민화합·관광/체육)를 합친 것으로 events_count 의 부분집합. KOPIS 축제(kopis_festivals_count)와 다른 출처다
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 서울시 축제 행사 없음은 0, unit: count}}

  - name: gold_culture_booking_curve
    description: "공연별 예매상황판 순위 궤적 요약(그레인 performance_id, 1공연 1행, #269). KOPIS는 순위(rank)만 제공 — 예매율·판매좌석·매진 데이터 없어 '순위 궤적'으로 실현. boxoffice_daily(스냅샷별)와 그레인 다름."
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 스냅샷 요약이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_booking_curve
          product_question: "공연 예매 인기가 개막까지 어떤 궤적으로 차오르나?"
          grain: "공연(performance_id)마다 한 행"
          primary_key: [performance_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 이 제품은 KOPIS 예매 순위만 읽는다(silver_culture_boxoffice·
          # silver_culture_performance). 지역 축이 없어 행정동 링크를 쓰지 않으므로
          # activity_by_dong 의 6원천 중 KOPIS 하나만 상속한다(#88 §1-2 B).
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조
          usage_patterns:
            - pattern_id: steady_sellers
              question_ko: 오래 랭킹에 머무는 스테디셀러 공연은?
              axes: 랭킹 — days_on_chart DESC
              requires: [select_columns, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 29988004f0674314a067d4c40652208f
              insight_sample_ko: DAY6 서울 공연이 31일 최장 체류.
              # KOPIS 는 순위만 제공(예매율·좌석 없음) — '순위 궤적' 해석만 가능(제품 caveat)
              sql: |
                -- :n=10
                SELECT performance_name, genre, venue_name, days_on_chart, best_rank, last_rank
                FROM gold_culture_booking_curve
                ORDER BY days_on_chart DESC LIMIT :n
            # 위가 '오래 머문' 공연이라면 아래 둘은 '빨리 오른' 공연과 '장르별 대표'다 —
            # 같은 표를 체류(days_on_chart)·속도(days_to_peak)·분류(genre) 세 축으로 읽는다.
            - pattern_id: fast_risers
              question_ko: 개막하자마자 상위권에 오른 공연은?
              axes: 필터(days_to_peak, best_rank) — days_to_peak ASC
              requires: [select_columns, filter_range, sort]
              verified_rows: 4
              verified_at: "2026-08-05"
              verified_publication_id: a1d0ab0d52a34f4094c3e1dfad56af87
              allow_empty: true   # 창에 급상승 공연이 없을 수 있다 — 0행이 정상
              insight_sample_ko: DAY6 10주년 투어가 진입 1일 만에 1위.
              sql: |
                -- :max_days=3, :top=10, :n=10
                SELECT performance_name, genre, venue_name,
                       best_rank, days_to_peak, days_on_chart
                FROM gold_culture_booking_curve
                WHERE days_to_peak <= :max_days AND best_rank <= :top
                ORDER BY days_to_peak ASC, best_rank ASC LIMIT :n
            - pattern_id: genre_leaders
              question_ko: 장르별로 가장 성적이 좋았던 공연은?
              axes: 장르별 1위 — best_rank ASC, 동률은 days_on_chart DESC
              requires: [select_columns, subquery, sort]
              verified_rows: 7
              verified_at: "2026-08-05"
              verified_publication_id: a1d0ab0d52a34f4094c3e1dfad56af87
              insight_sample_ko: 7개 장르 각 1건 — 대중음악 Stray Kids·뮤지컬 드라큘라 공동 1위.
              sql: |
                -- :n=20
                SELECT genre, performance_name, venue_name, best_rank, days_on_chart
                FROM gold_culture_booking_curve b
                WHERE b.rowid = (SELECT x.rowid FROM gold_culture_booking_curve x
                                 WHERE x.genre = b.genre
                                 ORDER BY x.best_rank ASC, x.days_on_chart DESC LIMIT 1)
                ORDER BY best_rank ASC LIMIT :n
          display:
            title: 공연별 인기 궤적 요약
            summary: 공연 한 편이 예매 순위에 언제 진입해 며칠 머물렀고 최고 몇 위까지 올랐는지를 한 행으로 요약했습니다. 진입 순위와 마지막 순위가 함께 있어 상승세인지 하락세인지 바로 판단할 수 있습니다.
            caveat: 순위 기반 지표만 제공합니다. 원천에 예매율·판매 좌석 수·매진 여부가 없고, 순위 50위 밖에 있던 기간은 집계되지 않습니다.
            use_cases:
              - 공연 마케팅 성과 벤치마킹
              - 흥행 예측 모델 입력
              - 장르별 인기 수명주기 비교
    columns:
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 한 편당 하나, 이 표의 기본 키
        data_type: varchar
        tests: [not_null, unique]
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르 원문
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: first_seen_date
        description: 이 공연이 예매 top50에 처음 등장한 스냅샷 일(KST)
        data_type: date
      - name: last_seen_date
        description: 마지막으로 top50에 있던 스냅샷 일(KST)
        data_type: date
      - name: days_on_chart
        description: 예매 순위표에 등장한 누적 일수 — 체류 기간
        data_type: integer
      - name: best_rank
        description: 이력 중 가장 높았던 순위(숫자가 작을수록 상위, 1이 최상위)
        data_type: integer
      - name: best_rank_date
        description: best_rank 를 처음 달성한 스냅샷 일(KST)
        data_type: date
      - name: days_to_peak
        description: 첫 등장부터 최고 순위에 도달하기까지 걸린 일수
        data_type: integer
      - name: first_rank
        description: 첫 등장일의 순위(진입 순위)
        data_type: integer
      - name: last_rank
        description: 마지막 스냅샷의 순위(현재 순위)
        data_type: integer

  - name: gold_culture_boxoffice_daily
    description: KOPIS 예매 랭킹 일 스냅샷(snapshot_date × rank_no). "요즘 핫한 공연" — 스냅샷이 매일 쌓여 예매 추이 시계열의 원천이 된다.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — PK = 모델 선언 그레인(snapshot_date × rank_no)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_boxoffice_daily
          product_question: "지금 서울에서 예매 상위 공연은 무엇인가?"
          grain: "스냅샷일×순위마다 한 행"
          primary_key: [snapshot_date, rank_no]
          event_time: snapshot_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 이 제품은 KOPIS 예매 순위만 읽는다(silver_culture_boxoffice·
          # silver_culture_performance). 지역 축이 없어 행정동 링크를 쓰지 않으므로
          # activity_by_dong 의 6원천 중 KOPIS 하나만 상속한다(#88 §1-2 B).
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조.
          # 3건 모두 "최신 스냅샷" 스칼라 서브쿼리를 쓴다 → requires 에 subquery.
          usage_patterns:
            - pattern_id: rising_now
              question_ko: 요즘 예매 순위가 오르는 공연은?
              axes: 최신 스냅샷 필터(momentum_status) — rank_no ASC
              requires: [select_columns, subquery, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 최신 스냅샷 rising 10건 — 1위 드라큘라.
              sql: |
                -- :status(momentum_status), :n=10
                SELECT rank_no, performance_name, genre, venue_name, rank_delta_3d
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND momentum_status = :status
                ORDER BY rank_no LIMIT :n
            - pattern_id: genre_top
              question_ko: 특정 장르(국악·클래식 등)에서 지금 인기 공연은?
              axes: 최신 스냅샷 필터(genre) — rank_no ASC
              requires: [select_columns, subquery, sort]
              verified_rows: 2
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 클래식은 랭킹 내 2건 — 장르별 결과 수 편차가 큼을 명시할 것.
              # genre 값은 KOPIS 원문 한글('뮤지컬'·'서양음악(클래식)' 등 7종) — glossary 불필요,
              # 단 값 목록이 d1_catalog_columns description 에 실려야 AI 가 정확히 필터한다
              sql: |
                -- :genre, :n=10
                SELECT rank_no, performance_name, venue_name, days_on_chart
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND genre = :genre
                ORDER BY rank_no LIMIT :n
            - pattern_id: new_entries
              question_ko: 랭킹에 새로 들어온 공연은?
              axes: 최신 스냅샷 필터(is_new_entry=1) — rank_no ASC
              requires: [select_columns, subquery, sort]
              verified_rows: 2
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 신규 진입 2건 — 9위 대중음악 공연 포함.
              sql: |
                -- :n=10
                SELECT rank_no, performance_name, genre, venue_name
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND is_new_entry = 1
                ORDER BY rank_no LIMIT :n
          display:
            title: 공연 예매 랭킹 (일별)
            summary: 공연 예매 순위를 매일 한 번 찍어 쌓은 데이터입니다. 3일 전 순위와의 변동폭, 차트 체류 일수, 신규 진입 여부까지 계산돼 있어 "요즘 뜨는 공연"을 바로 뽑을 수 있습니다.
            caveat: 원천이 순위만 제공합니다. 예매율·판매 좌석 수·매출액은 포함되지 않습니다.
            use_cases:
              - 인기 공연 큐레이션
              - 장르별 흥행 추이 리포트
              - 공연 추천 모델의 인기도 피처
    tests:
      # 서빙 계약 PK 근거(#346) — 그레인은 모델 선언(snapshot_date × rank_no) 그대로
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_date, rank_no]
    columns:
      - name: snapshot_date
        description: 순위를 집계한 날(YYYY-MM-DD). 문자열로 저장된다
        data_type: varchar
        tests: [not_null]
      - name: rank_no
        description: 예매 순위(1=최다) — snapshot_date 안에서 유일
        data_type: integer
        tests: [not_null]
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 상세 정보와 붙이는 조인 키
        data_type: varchar
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르(연극·뮤지컬·클래식 등 원문 분류)
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: perf_count
        description: 상연 횟수(KOPIS 원문)
        data_type: integer
      - name: seat_count
        description: 공연장 좌석 수 — 공연 규모를 가늠하는 값
        data_type: integer
      - name: gu_code
        description: 공연장이 속한 자치구 코드
        data_type: varchar
      - name: gu
        description: 공연장 자치구 이름
        data_type: varchar
      - name: rank_prev_3d
        description: 3일 전 같은 공연의 순위. 그때 순위표에 없었으면 비어 있다
        data_type: integer
      - name: rank_delta_3d
        description: 순위 상승폭(3일 전 순위 − 오늘 순위). 양수면 상승, 비어 있으면 신규 또는 재진입
        data_type: integer
      - name: days_on_chart
        description: 이 공연이 순위표에 등장한 누적 일수(오늘 포함)
        data_type: integer
      - name: is_new_entry
        description: 어제는 없다가 오늘 진입했는지 여부(첫 진입·재진입 공통)
        data_type: boolean
      - name: momentum_status
        description: "순위 모멘텀: new(어제 부재)·rising(순위 상승)·falling(하락)·steady(변동 없음/추세 미정)"
        data_type: varchar

  - name: gold_culture_calendar_density
    description: 일×구 문화 밀도·경쟁 지수(#269). 시민 "볼 게 많은 날"=total_events, 주최자 "피해야 할 날"=concentration. int_culture_activity_days 재사용 — location_daily가 유형별 count면 여기는 다양성·집중도 요약. 그레인 gu_code×event_date.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_calendar_density
          product_question: "구별로 어느 날짜에 행사가 몰리나(밀집도)?"
          grain: "구×날짜마다 한 행"
          primary_key: [gu_code, event_date]
          event_time: event_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 권리 정본은 gold_culture_activity_by_dong 블록이고 여기는 같은
          # silver 를 읽으므로 같은 원천을 상속한다(#88 §1-2 B). 값을 베낀 게 아니라
          # **같은 원천이라 같은 값**이다 — 원천 권리가 바뀌면 두 곳을 함께 고친다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조
          usage_patterns:
            - pattern_id: calm_days
              question_ko: 행사가 적어서 한산하게 다닐 만한 날이 언제인가?
              axes: 랭킹 — total_events ASC (기간 내)
              requires: [select_columns, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 7ed8eddecfac4ba283ce075c26b2d45d
              insight_sample_ko: 상한 없는 검증에선 2027-05-10(1건)이 1위로 떴다 — :to 필수.
              # ⚠️ :to 를 안 걸면 1년 뒤 스카폴드 날짜가 "한산한 날"로 뜬다(실측). 상한 필수 —
              # 이 관례를 실어 나르는 것이 참조 구현의 값어치다
              sql: |
                -- :gu, :from, :to, :n=10
                SELECT event_date, total_events, busiest_type
                FROM gold_culture_calendar_density
                WHERE gu = :gu AND event_date BETWEEN :from AND :to
                ORDER BY total_events ASC, event_date LIMIT :n
            - pattern_id: crowded_days
              question_ko: 행사가 몰리는 날(피해야 할 날)이 언제인가?
              axes: 랭킹 — total_events DESC
              requires: [select_columns, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 7ed8eddecfac4ba283ce075c26b2d45d
              insight_sample_ko: 7/31 중구 235건 · concentration 0.47 이 최다.
              sql: |
                -- :from, :to, :n=10
                SELECT event_date, gu, total_events, concentration, busiest_type
                FROM gold_culture_calendar_density
                WHERE event_date >= :from ORDER BY total_events DESC LIMIT :n
            # 위 둘은 '어느 날'을 고른다(날짜 축). 구끼리 비교하는 축이 없어서 더한다 —
            # 하루 평균까지 내야 관측일 수가 다른 구를 나란히 놓을 수 있다.
            - pattern_id: gu_ranking
              question_ko: 문화행사가 가장 활발한 자치구는 어디인가?
              axes: 구 랭킹 — 기간 합산 total_events DESC, 하루 평균 동반
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              verified_rows: 15
              verified_at: "2026-08-05"
              verified_publication_id: c02106f1baa24256abe26cd7554fe5e7
              insight_sample_ko: 7/1~8/5 중구 10,174건(36일, 하루 283건)으로 1위.
              sql: |
                -- :from, :to, :n=15
                SELECT gu,
                       SUM(total_events) AS events,
                       COUNT(DISTINCT event_date) AS days,
                       ROUND(SUM(total_events) * 1.0 / COUNT(DISTINCT event_date), 1) AS per_day
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                GROUP BY gu ORDER BY events DESC LIMIT :n
          display:
            title: 자치구 일자별 문화행사 밀도
            summary: 자치구마다 하루에 행사가 몇 건 열리고 그중 한 유형에 얼마나 몰리는지를 요약했습니다. 볼거리가 많은 날을 찾는 쪽과, 행사를 새로 열 때 경쟁을 피할 날을 고르는 쪽 모두가 같은 표를 씁니다.
            use_cases:
              - 행사 개최일 선정
              - 이번 주 볼거리 많은 자치구 콘텐츠
              - 지역별 문화 공급 편차 분석
    tests:
      # 서빙 계약 PK 근거(#346)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gu_code, event_date]
    columns:
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        tests: [not_null]
      - name: total_events
        description: 그날 그 구에서 열린 전체 문화활동 수 — "볼 게 많은 날" 지표
        data_type: integer
      - name: distinct_types
        description: 그날 열린 활동 유형 수(공연·행사·축제·전시·세종·kcisa 중 몇 종) — 다양성
        data_type: integer
      - name: busiest_type
        description: 그날 가장 많이 열린 활동 유형(동수 시 임의 1개)
        data_type: varchar
      - name: busiest_type_count
        description: 가장 많이 열린 유형의 행사 수 — 같은 유형끼리의 경쟁 규모
        data_type: integer
      - name: concentration
        description: 경쟁 집중도(busiest_type_count / total_events, 0~1) — 1=한 유형 독점, 낮을수록 다양
        data_type: double

