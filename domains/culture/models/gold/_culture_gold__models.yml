      - name: nation_top_movie
        description: 전국 1위 영화명 — 같은 날 서울 1위와 다를 수 있음(지역 취향 신호)
        data_type: varchar
      - name: seoul_top_movie
        description: 서울 상영분 1위 영화명
        data_type: varchar

  - name: gold_culture_reservation_daily
    description: 자치구(gu_code) × 스냅샷일 공공예약 가용 현황(서울시 공공서비스예약 — 문화·체육 분야).
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        refresh: '1일'   # culture_transform — culture_bronze(03:00 KST) 자산 트리거
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: snapshot_date
        description: 수집 스냅샷 일(YYYY-MM-DD 문자열)
