            - pattern_id: gu_day_profile
              question_ko: 이 구의 특정 요일은 시간대별로 얼마나 붐비나?
              axes: 프로파일 — hour_of_day ASC (요일 고정)
              requires: [select_columns, sort]
              verified_rows: 24
              verified_at: "2026-07-31"
              verified_publication_id: 2ba3ce94ac734d0487dfd93fa4999f55
              insight_sample_ko: 송파구 토요일 24시간 프로파일 — 00시 avg_ppltn 8,236(여유).
              sql: |
                -- :gu, :dow(1=월..7=일), :n=24
                SELECT hour_of_day, avg_ppltn, typical_congest
                FROM gold_culture_event_crowd
                WHERE gu = :gu AND day_of_week = :dow ORDER BY hour_of_day LIMIT :n
            # 위 둘은 구를 먼저 정해 놓고 그 안을 본다. "어느 구로 갈까"를 못 묻는다 —
            # 요일·시간을 고정하고 구를 비교하는 축을 더한다.
            - pattern_id: busiest_gu_at_hour
              question_ko: 이 요일 이 시간에 가장 붐비는 자치구는 어디인가?
              axes: 구 랭킹 — (요일·시간 고정) avg_congest_score DESC
              requires: [select_columns, filter_set, sort]
              verified_rows: 10
              verified_at: "2026-08-05"
              verified_publication_id: 865b88b6a8f1428e8fd6cbb9f937fa26
              insight_sample_ko: 토요일 19시 은평구 avg_ppltn 9,920 으로 '붐빔' 1위.
