        description: 경기장 경도(WGS84)
        data_type: double
      - name: admin_dong
        description: 경기장 행정동 이름
        data_type: varchar
      - name: admin_dong_code
        description: '경기장 행정동 코드(행안부 canonical, #48 공간축 조인 키)'
        data_type: varchar
      - name: quality_status
        description: 공간 정밀도(#111) — dong_precise/gu_only/unmatched
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

  # --- SLO 마트 gold (tag:slo, #110). contract enforced. 도메인 중립(#6). 비율=decimal(38,18). ---
  - name: gold_culture_slo_daily
    description: 날짜 1행 SLO — scheduled/eod 가용(분모 둘 다)·green_disguise·적재추세. 7/7 회귀 케이스의 기준표.
    config:
      contract: {enforced: true}
      meta:
        refresh: '1일'   # culture_slo 05:00 KST
    columns:
      - name: domain
        description: 도메인(culture) — 도메인 중립 설계(§6, _shared 승격 대비)
        data_type: varchar
        tests: [not_null]
      - name: event_date
        description: 집계일(KST run_report load_date 기준) — 날짜 1행
        data_type: date
        tests: [not_null, unique]
      - name: scheduled_slo_passed
        description: 그날 scheduled run 이 전부 통과했나(bool_and) — scheduled 없으면 false. "자정 정기런이 제 몫을 했나"
        data_type: boolean
      - name: eod_slo_passed
        description: 그날 아무 run 이든 하나라도 통과했나(bool_or) — 수동 복구 성공도 인정. "그날이 끝날 때 데이터가 있었나"
        data_type: boolean
      - name: best_coverage_pct
        description: 그날 run 중 최고 데이터셋 커버리지(%, 0~100)
        data_type: decimal(38,18)
      - name: failed_dataset_count
        description: 실패 데이터셋 수 합(run_report failed 합산)
        data_type: bigint
      - name: violation_count
        description: 계약(min_rows 등) 위반 수 합
        data_type: bigint
      - name: total_rows
        description: 그날 최대 적재 행수(run 별 total_rows 의 max)
        data_type: bigint
      - name: ingest_duration_min
        description: culture_bronze 적재 소요 합(분) — dag_run enrichment(#411) 유래, 미적재 시 0
        data_type: decimal(38,18)
      - name: transform_runs
        description: '그날 culture_transform run 수(dag_run enrichment #411)'
        data_type: bigint
      - name: transform_all_success
        description: 그날 transform 이 전부 success 였나 — 7/17 freshness 사고를 false 로 실측한 컬럼
        data_type: boolean
      - name: maintenance_ran
        description: 그날 culture_maintenance 성공 run 존재 여부
        data_type: boolean
      - name: green_disguise_runs
        description: 초록 위장 run 수 — Airflow success 인데 expected=0(전멸) 이라 raw 통과가 무의미한 경우(7/7 실사례)
        data_type: bigint
      # --- #619 확정안 반영: 재시도 축 + NULL 비율(관측 커버리지). 셋 다 NULL 허용이 규격이다 ---
      - name: retried_runs
        description: >
          재시도로 살아난 run 수(success ∧ retried_tasks>0) — "성공률 100%" 뒤에 숨는 재발(#201, 7일 중 4일).
          retry_observed_runs 와 짝으로 읽는다: NULL/NULL=그날 dag_run 이력 자체가 없음,
          0/0=런은 있었지만 재시도 수치 미관측, 0/N=진짜 재시도 없는 날.
        data_type: bigint
      - name: retry_observed_runs
        description: 재시도 수치를 관측할 수 있었던 run 수(분모) — 이게 없으면 retried_runs=0 이 "재시도 0건"인지 "관측 0건"인지 구분되지 않는다
        data_type: bigint
      - name: max_try_peak
        description: 그날 최대 try_number — 1이면 무재시도, NULL 이면 미관측
        data_type: bigint
      - name: min_iceberg_measure_pct
        description: 그날 run 의 적재 관측 커버리지 최저치(%) — 100 미만이면 그날 적재 수치는 부분 관측. 7/31 이전 이력은 NULL(필드 없던 시기)
        data_type: decimal(38,18)

  - name: gold_culture_venue_profile
    description: '시설(facility_id) 1행 프로필 — "그 공연장 어떤 곳이야"(Q&A metric, #278). 주소·좌표 100%, seat_scale 63.7% 충전. 공연 통계는 KOPIS 공연 기준(보유 시설 421) — 전시·축제 미포함. 외부 카탈로그 비공개(meta.external=false, #269).'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        refresh: '1일'   # culture_transform — culture_bronze(03:00 KST) 자산 트리거
        external: false  # Q&A 전용 내부 마트 — 외부 카탈로그 노출 제외(#269, 대시보드 PR#6 메커니즘)
    columns:
      - name: facility_id
        description: KOPIS 시설 ID(mt10id) — PK
        data_type: varchar
        tests: [not_null, unique]
      - name: facility_name
        description: 시설명
        data_type: varchar
      # 주소·좌표 not_null 은 dong_precise 한정(#364) — "충전 100%" 는 모든 시설이 상세를
      # 가진 시점의 스냅샷이었다. 신규 시설은 상세 수집 전까지 gu_only(주소·좌표 null)로
      # 하루 존재하는 게 정상 경로(#111 quality_status: 숨기지 않고 표시)라, 전 행 not_null
      # 은 시설이 생길 때마다 나이트런을 깨뜨린다(7/29 FC004980 실측). null 발생 경로는
      # 단일(상세 미수집 → 좌표 없음 → gu_only)이므로 이 스코프로 기존 보증은 그대로다.
      - name: address
        description: 주소 — dong_precise 한정 100% (신규 시설은 상세 수집 전까지 gu_only·null)
        data_type: varchar
        tests:
          - not_null:
              config:
                where: "quality_status = 'dong_precise'"
      - name: latitude
        description: 위도 — dong_precise 한정 100%
        data_type: double
        tests:
          - not_null:
              config:
                where: "quality_status = 'dong_precise'"
      - name: longitude
        description: 경도 — dong_precise 한정 100%
        data_type: double
        tests:
          - not_null:
              config:
                where: "quality_status = 'dong_precise'"
      - name: seat_scale
        description: 좌석 규모(KOPIS 0/공백→null 정규화, 충전 63.7%)
        data_type: integer
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드(행안부 canonical)
        data_type: varchar
      - name: perf_count
        description: KOPIS 공연수(링크 없으면 0) — 전시·축제 미포함 캐비앗은 모델 설명 참조
        data_type: integer
        tests: [not_null]
      - name: distinct_genres
        description: 공연 장르 수
        data_type: integer
      - name: top_genre
        description: 최다 장르(max_by, 공연 없으면 null)
        data_type: varchar
      - name: top_genre_count
        description: 최다 장르 공연수
        data_type: integer
      - name: first_perf_date
        description: 첫 공연 시작일
        data_type: date
      - name: last_perf_date
        description: 마지막 공연 종료일
        data_type: date
      - name: quality_status
        description: facility dim quality_status 전파(#111)
        data_type: varchar

  - name: gold_culture_qa_eval
    description: '페르소나 질문 카탈로그 × 라우팅 커버리지(티어링 #20, #284, 그레인 question_id). 페르소나 원천 nvidia/Nemotron-Personas-Korea(CC-BY-4.0) 15명 샘플. answerable(큐레이션)과 mart_exists(information_schema 실측) 분리 — eval_ready=W7 평가셋 투입 가능. 답불가 행의 unanswerable_reason=수집 로드맵 재료. 내부 전용(meta.external=false).'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        refresh: '1일'   # culture_transform — culture_bronze(03:00 KST) 자산 트리거
        external: false  # Q&A 거버넌스 내부 마트 — 외부 카탈로그 노출 제외(#269)
    columns:
      - name: question_id
        description: 질문 ID(QA001…) — PK
        data_type: varchar
        tests: [not_null, unique]
      - name: persona_uuid
        description: Nemotron 페르소나 uuid(출처 추적 — 스냅샷 JSON 조인 키)
        data_type: varchar
      - name: persona_summary
        description: 페르소나 한 줄 요약
        data_type: varchar
      - name: home_region
        description: 페르소나 원거주지(Nemotron district)
        data_type: varchar
      - name: visit_context
        description: 부여된 서울 방문 상황(계획안 거주지 해법 — 전국 페르소나를 서울 방문자로)
        data_type: varchar
      - name: persona_lens
        description: 질문 생성 렌즈(travel/culinary/family/sports/arts)
        data_type: varchar
      - name: question_text
        description: 자연어 질문
        data_type: varchar
      - name: target_mart
        description: 라우팅 대상 gold 마트명(답가능 시 필수, 답불가면 null)
        data_type: varchar
      - name: target_columns
        description: 근거 컬럼(콤마 구분)
        data_type: varchar
      - name: answerable
        description: 현행 데이터로 답 가능 여부(큐레이션 의도)
        data_type: boolean
        tests: [not_null]
      - name: unanswerable_reason
        description: 답불가 사유 + 로드맵 힌트(답불가 시 필수)
        data_type: varchar
      - name: mart_exists
        description: 'target_mart가 카탈로그에 실존하는가 — information_schema 실측. 검사 스코프=culture+채택 도메인(seoul_citydata·weather·transit, 티어링 v2 #310)'
        data_type: boolean
      - name: eval_ready
        description: answerable AND mart_exists — W7 평가셋 투입 가능(라우팅 건전성 신호)
        data_type: boolean

