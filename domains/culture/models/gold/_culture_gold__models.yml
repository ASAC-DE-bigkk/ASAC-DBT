version: 2

# culture gold 계약·테스트 (#200 — schema.yml 을 layer 별로 분리, 모델명 정렬).
# published gold 전 모델 contract enforced(#180). silver 는 models/silver/_culture_silver__models.yml.
# 컬럼 description 전수 작성(#242) — grain·단위·KST 여부·산식 근거를 명시. 카탈로그가 노출한다.

models:
  - name: gold_culture_activity_by_dong
    description: 행정동(admin_dong_code) × 일자 문화활동 집계(#48). dim_admin_dong 426동 scaffold라 활동 0건 동도 0으로 존재. sports 제외.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346, ASAC-DAG docs/contracts/serving-contract-v1.md)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_activity_by_dong
          product_question: "어느 행정동에서 언제 문화 활동이 얼마나 열리나?"
          grain: "행정동×날짜마다 한 행"
          primary_key: [admin_dong_code, event_date]
          event_time: event_date
          # 신선도 축은 event_time 과 다르다(#707) — 계약 v1.9 freshness_field.
          # event_date/event_start_date 는 미래로 뻗는 달력이라 신선도가 될 수 없다.
          freshness_field: source_collected_at
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # #406: `source_evidence`는 Publisher가 D1 d1_catalog_sources에 함께 게시하는
          # 공개 권리·출처 정본이다. 6개 원천 모두 외부 API 재배포와 출처표시 승인을
          # 확인했으므로 Publisher가 동일 publication_id로 게시하면 Worker가 등록 준비 상태를 판정한다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          quality_coverage:
            field: admin_dong_code
            expected_distinct_count: 426
            minimum_ratio: 1.0
          public_projection:
            schema_version: "1.1.0"
            columns: [admin_dong_code, admin_dong, gu_code, gu, stat_region_cd, event_date, activities_count, performances_count, events_count, kopis_festivals_count, exhibitions_count, sejong_count, kcisa_count, free_events_count, edu_experience_events_count, festival_events_count, source_collected_at]
          # usage_patterns — ASAC-DAG#638 v1 규격. requires 는 고정 어휘 11개에서, basic
          # 프로파일(등호 필터·시간축 from/to·limit·전체 컬럼) 위의 추가분만 적는다.
          # sql 은 참조 구현(D1/SQLite 방언)이다 — 클라이언트가 보내 실행하는 값이 아니다.
          # verified_* 는 2026-07-31 팀 D1 라이브 게시본 실측(ASAC-DAG#600 Phase 0 산출)을
          # 옮긴 값 — 검증 스크립트가 생기면 그 산출로 대체한다(#638 §1).
          usage_patterns:
            - pattern_id: free_edu_dongs
              question_ko: 무료·교육체험 행사가 많은 동네(행정동)는 어디인가?
              axes: 동 랭킹 — 기간 합산 free+edu DESC
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: d45c9031b04b460ab6a946b6fefa15fb
              insight_sample_ko: 사직동이 7월 무료 1,024·교육체험 671건으로 1위.
              sql: |
                -- :from=2026-08-01, :n=10
                SELECT admin_dong, gu, SUM(free_events_count) AS free_cnt,
                       SUM(edu_experience_events_count) AS edu_cnt
                FROM gold_culture_activity_by_dong
                WHERE event_date >= :from
                GROUP BY admin_dong, gu ORDER BY free_cnt + edu_cnt DESC LIMIT :n
            - pattern_id: exhibition_dongs
              question_ko: 전시 많이 하는 동네는 어디인가?
              axes: 동 랭킹 — 기간 합산 exhibitions DESC
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: d45c9031b04b460ab6a946b6fefa15fb
              insight_sample_ko: 하계2동 691건 — 서울시립 북서울미술관 효과.
              sql: |
                -- :from=2026-08-01, :n=10
                SELECT admin_dong, gu, SUM(exhibitions_count) AS ex_cnt
                FROM gold_culture_activity_by_dong
                WHERE event_date >= :from
                GROUP BY admin_dong, gu ORDER BY ex_cnt DESC LIMIT :n
            # 위 둘은 "어느 동네인가"(동 랭킹)를 묻는다. 한 동네를 정해 놓고 그 안의
            # 시간 흐름을 보는 축이 없어서 더한다 — 같은 표를 세로가 아니라 가로로 읽는 질의다.
            - pattern_id: dong_activity_trend
              question_ko: 우리 동네 문화활동이 요즘 늘고 있나, 줄고 있나?
              axes: 필터(admin_dong) + 기간 — event_date DESC 시계열
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 30 , from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              verified_rows: 30
              verified_at: "2026-08-05"
              verified_publication_id: 4bc2e5c82e5d49fe8f439cbdcc89b491
              insight_sample_ko: 가양1동 7/1~8/5 누적 158건 — 하루 평균 4.4건.
              sql: |
                -- :dong=혜화동, :from=2026-08-01, :to=2026-10-31, :n=30
                SELECT event_date, activities_count, performances_count,
                       events_count, exhibitions_count
                FROM gold_culture_activity_by_dong
                WHERE admin_dong = :dong AND event_date BETWEEN :from AND :to
                ORDER BY event_date DESC LIMIT :n
            - pattern_id: "activity_ranking_flex"
              question_ko: "원하는 지표(공연·전시·행사·축제·무료·교육 등)로 자치구 또는 행정동을 문화활동 순으로 정렬하면 어디가 상위(또는 하위)인가?"
              axes: "차원(구/동) × 지표 스위치 × 정렬방향 × 기간 랭킹 — 기존 exhibition_dongs/free_edu_dongs의 상위호환"
              verified_rows: 6
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "2026-07-01~08-31 전시 기준 상위 행정동은 소공동(중구)이 12건으로 1위."
              sql: |
                -- :dim=dong, :metric=exhibitions, :dir=desc, :from=2026-07-01, :to=2026-08-31, :n=10
                SELECT CASE :dim WHEN 'gu' THEN gu ELSE admin_dong END AS dim_value,
                       MAX(gu) AS gu,
                       SUM(CASE :metric
                             WHEN 'performances' THEN performances_count
                             WHEN 'events' THEN events_count
                             WHEN 'exhibitions' THEN exhibitions_count
                             WHEN 'kopis_festivals' THEN kopis_festivals_count
                             WHEN 'festival' THEN festival_events_count
                             WHEN 'free' THEN free_events_count
                             WHEN 'edu' THEN edu_experience_events_count
                             WHEN 'sejong' THEN sejong_count
                             WHEN 'kcisa' THEN kcisa_count
                             ELSE activities_count END) AS metric_value
                FROM gold_culture_activity_by_dong
                WHERE event_date BETWEEN :from AND :to
                GROUP BY CASE :dim WHEN 'gu' THEN gu ELSE admin_dong END
                HAVING metric_value > 0
                ORDER BY CASE WHEN :dir='asc' THEN metric_value END ASC,
                         CASE WHEN :dir='desc' THEN metric_value END DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort, filter_range]
              param_defaults: { dir: "desc", n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gu_daily_trend"
              question_ko: "우리 자치구 전체(동 합산)의 문화활동이 날짜별로 얼마나 잡혀 있나 — 늘고 있나, 줄고 있나?"
              axes: "필터(gu) + 기간 — 날짜별 동 합산 시계열(구 단위). 기존 dong_activity_trend(단일 동)의 구 집계 형제"
              verified_rows: 60
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "종로구는 활동이 잡힌 가장 최근 날짜인 2026-08-29에 문화활동 7건(공연 1·행사 4)."
              sql: |
                -- :gu=종로구, :from=2026-07-01, :to=2026-08-31, :n=60
                SELECT event_date,
                       SUM(activities_count) AS activities,
                       SUM(performances_count) AS performances,
                       SUM(events_count) AS events,
                       SUM(exhibitions_count) AS exhibitions,
                       COUNT(*) AS dongs_reporting
                FROM gold_culture_activity_by_dong
                WHERE gu = :gu AND event_date BETWEEN :from AND :to
                GROUP BY event_date
                HAVING SUM(activities_count) > 0
                ORDER BY event_date DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, having, sort]
              param_defaults: { n: 60, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "free_share_dongs"
              question_ko: "전체 문화활동 대비 무료 행사 비중이 높은 동네(행정동)는 어디인가?"
              axes: "동 랭킹 — free/activities 비율 DESC, 최소 활동수 임계값(HAVING). 기존 free_edu_dongs(절대건수)의 비율판"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "활동 20건 이상 동네 중 증산동(은평구)은 22건이 전부 무료(무료 비중 100%)."
              sql: |
                -- :from=2026-07-01, :to=2026-08-31, :min_activities=20, :n=10
                SELECT admin_dong, gu,
                       SUM(free_events_count) AS free_cnt,
                       SUM(activities_count) AS total_cnt,
                       ROUND(SUM(free_events_count) * 100.0 / SUM(activities_count), 1) AS free_pct
                FROM gold_culture_activity_by_dong
                WHERE event_date BETWEEN :from AND :to
                GROUP BY admin_dong, gu
                HAVING SUM(activities_count) >= :min_activities
                ORDER BY free_pct DESC, total_cnt DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, having, filter_range, sort]
              param_defaults: { min_activities: 20, n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "festival_occurrences"
              question_ko: "축제가 실제로 열리는(열렸던) 동네와 날짜는 언제 어디인가?"
              axes: "단면/필터 — (KOPIS 축제 + 기타 축제) 카운트가 임계값 이상인 (동, 날짜) 행 나열"
              verified_rows: 20
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "혜화동(종로구)은 2026-07-28에 축제 6건(KOPIS 5·기타 1)으로 가장 몰림."
              sql: |
                -- :from=2026-07-01, :min_festivals=1, :n=20
                SELECT event_date, admin_dong, gu,
                       kopis_festivals_count, festival_events_count,
                       (kopis_festivals_count + festival_events_count) AS festival_total,
                       activities_count
                FROM gold_culture_activity_by_dong
                WHERE event_date >= :from
                  AND (kopis_festivals_count + festival_events_count) >= :min_festivals
                ORDER BY festival_total DESC, event_date
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_festivals: 1, n: 20 , from: { rel: "-30d", as: date } }
            - pattern_id: "multi_dong_compare"
              question_ko: "관심 있는 여러 동네를 골라 문화활동을 나란히 비교하면?"
              axes: "다중선택(배열) 단면 — 선택한 행정동들의 기간 합산 지표 비교"
              verified_rows: 3
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "선택한 세 동네 중 신촌동(서대문구)이 기간 합산 활동 23건(공연 13·무료 5)으로 최다."
              sql: |
                -- :dongs=["신촌동","염창동","신월1동"], :from=2026-07-01, :to=2026-08-31, :n=20
                SELECT admin_dong, gu,
                       SUM(activities_count) AS activities,
                       SUM(performances_count) AS performances,
                       SUM(exhibitions_count) AS exhibitions,
                       SUM(free_events_count) AS free_events
                FROM gold_culture_activity_by_dong
                WHERE admin_dong IN (SELECT value FROM json_each(:dongs))
                  AND event_date BETWEEN :from AND :to
                GROUP BY admin_dong, gu
                ORDER BY activities DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_set, filter_range, sort]
              param_defaults: { n: 20, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "activity_type_mix"
              question_ko: "이 자치구(또는 서울 전체)의 문화활동은 어떤 유형(공연·행사·전시·축제)이 주를 이루나?"
              axes: "분포/비율 — 유형별 기간 합산과 비중(UNPIVOT), gu 센티널로 특정 구 또는 전체(ALL)"
              verified_rows: 4
              verified_at: "2026-08-10"
              verified_publication_id: c4c6f247ef524fd1a2a8abce3ed3e28e
              insight_sample_ko: "2026-07-01~08-31 종로구는 공연이 492건으로 4개 유형 중 63.2%를 차지."
              sql: |
                -- :gu=종로구, :from=2026-07-01, :to=2026-08-31
                WITH agg AS (
                  SELECT SUM(performances_count) AS performances,
                         SUM(events_count) AS events,
                         SUM(exhibitions_count) AS exhibitions,
                         SUM(kopis_festivals_count) AS festivals
                  FROM gold_culture_activity_by_dong
                  WHERE (:gu = 'ALL' OR gu = :gu) AND event_date BETWEEN :from AND :to
                )
                SELECT t.activity_type, t.cnt,
                       ROUND(t.cnt * 100.0 / NULLIF(t.performances + t.events + t.exhibitions + t.festivals, 0), 1) AS pct
                FROM (
                  SELECT 'performances' AS activity_type, performances AS cnt, performances, events, exhibitions, festivals FROM agg
                  UNION ALL SELECT 'events', events, performances, events, exhibitions, festivals FROM agg
                  UNION ALL SELECT 'exhibitions', exhibitions, performances, events, exhibitions, festivals FROM agg
                  UNION ALL SELECT 'festivals', festivals, performances, events, exhibitions, festivals FROM agg
                ) t
                ORDER BY t.cnt DESC
              requires: [select_columns, aggregate, subquery, filter_range, sort]
              param_defaults: { gu: "ALL", from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
          display:
            title: 행정동별 일자 문화활동량
            summary: 행정동마다 날짜별로 문화 활동이 몇 건 열리는지 집계했습니다.
            caveat: 전체 건수는 중복을 제거한 값이라 유형별 건수를 더한 값과 다를 수 있습니다 — 축제는 공연과 같은 출처(KOPIS)의 같은 공연이고, 무료·교육체험·축제 행사는 행사 건수 안에 포함됩니다. 총계가 필요하면 전체 건수를 그대로 쓰십시오. 행사가 없는 동도 0으로 채워져 있어 지도나 시계열에 그대로 얹을 수 있습니다. 좌표가 없어 행정동을 확정하지 못한 활동은 빠집니다(전체의 2.3%, 전시는 17.5%·국립문화기관은 12.8%로 편차가 큽니다 — 구 단위 집계가 필요하면 별도 제품을 쓰십시오). 날짜는 최근 90일부터 향후 1년까지만 담습니다. ⚠ 오늘 이후 날짜의 0은 "행사가 없다"가 아니라 "아직 발표되지 않았다"는 뜻입니다 — 행의 대부분이 미래 날짜이고, 활동이 잡힌 비율은 과거 구간의 3분의 1 수준입니다(2026-08-10 기준 과거 29%·미래 9%). 확정된 것만 세려면 날짜를 오늘까지로 자르고, 원천이 실제로 닿은 칸만 보려면 source_collected_at 이 비어 있지 않은 행을 쓰십시오.
            use_cases:
              - 생활권 문화 인프라 격차 분석
              - 부동산·상권 리포트의 생활편의 지표
              - 동 단위 문화 히트맵
    tests:
      # 서빙 계약 PK 근거(#346) — validator 가 yml 선언만 인정(싱귤러는 불변식 겸용으로 별도 유지)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, event_date]
    columns:
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리. 다른 행정동 데이터와 붙이는 조인 키
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: false, null_meaning: not_applicable, unit: code}}
        tests: [not_null]
      - name: admin_dong
        description: 행정동 이름(예 명동)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_name, nullable: true, null_meaning: 행정동 이름 매핑이 제공되지 않음, unit: name}}
      - name: gu_code
        description: 자치구 코드(구 롤업 키)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: false, null_meaning: not_applicable, unit: code}}
        tests: [not_null]
      - name: gu
        description: 자치구 이름(예 중구)
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_name, nullable: true, null_meaning: 자치구 이름 매핑이 제공되지 않음, unit: name}}
      - name: stat_region_cd
        description: 통계청 집계구 코드 — 통계청 인구·가구 통계와 붙일 때 사용
        data_type: varchar
        config: {meta: {semantic_role: statistical_area_id, nullable: true, null_meaning: 원천 통계청 집계구 코드가 제공되지 않음, unit: code}}
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        config: {meta: {semantic_role: event_date, nullable: false, null_meaning: not_applicable, unit: date}}
        tests: [not_null]
      - name: activities_count
        description: 그날 그 동에서 열린 전체 문화활동 수 — 활동 ID 기준 중복을 제거한 값이며 총계는 언제나 이 열을 쓴다. 유형별 열을 더해서 총계를 만들지 말 것(KOPIS 가 같은 공연을 공연목록·축제목록에 함께 실어 kopis_festivals_count 가 performances_count 와 겹치고, 무료·교육체험·축제 행사 수도 events_count 의 부분집합이다). 🔴 0 은 두 뜻이 섞여 있다 — 과거 날짜면 "그날 아무 일도 없었다", 미래 날짜면 "아직 발표되지 않았다"이다. 같은 행에서 source_collected_at 이 비어 있으면 원천이 이 칸에 닿은 적이 없다는 뜻이므로, 둘을 갈라야 하면 그 열과 event_date 를 함께 본다
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 활동 없음은 0, unit: count}}
      - name: performances_count
        description: KOPIS 공연 수 (kopis_festivals_count 를 포함한다)
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 공연 없음은 0, unit: count}}
      - name: events_count
        description: 서울시 문화행사 수 (free_events_count·edu_experience_events_count·festival_events_count 를 포함한다)
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 행사 없음은 0, unit: count}}
      - name: kopis_festivals_count
        description: KOPIS 공연 중 축제로 분류된 수 — performances_count 의 부분집합이다(KOPIS 가 같은 공연 ID를 공연목록과 축제목록에 함께 싣는다). 서울시가 여는 축제는 festival_events_count 를 볼 것
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; KOPIS 축제 없음은 0, unit: count}}
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 전시 없음은 0, unit: count}}
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 세종문화회관 공연 없음은 0, unit: count}}
      - name: kcisa_count
        description: KCISA 국립문화기관 행사 수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; KCISA 행사 없음은 0, unit: count}}
      - name: free_events_count
        description: 그날 그 동의 무료 문화행사 수. 유·무료 표기는 서울시 문화행사 출처에만 있어 그 범위의 건수
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 무료 행사 없음은 0, unit: count}}
      - name: edu_experience_events_count
        description: 그날 그 동의 교육·체험 분류 행사 수 — events_count 의 부분집합
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 교육·체험 행사 없음은 0, unit: count}}
      - name: festival_events_count
        description: 그날 그 동의 축제 분류 행사 수 — 서울시 문화행사의 축제 6분류(문화/예술·기타·전통/역사·자연/경관·시민화합·관광/체육)를 합친 것으로 events_count 의 부분집합. KOPIS 축제(kopis_festivals_count)와 다른 출처다
        data_type: bigint
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable; 서울시 축제 행사 없음은 0, unit: count}}
      - name: source_collected_at
        description: 이 행정동·날짜 집계에 쓰인 원천을 마지막으로 수집한 시각(KST). 그날 활동이 없으면 비어 있다
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: 그 칸에 활동이 없어 원천 자체가 없습니다. 스캐폴드가 0-fill 한 칸이며, Publisher 는 NULL 이 아닌 값들의 max 를 신선도로 씁니다.
            time_role: latest_collection
            timezone: Asia/Seoul
            unit: not_applicable

  - name: gold_culture_booking_curve
    description: "공연별 예매상황판 순위 궤적 요약(그레인 performance_id, 1공연 1행, #269). KOPIS는 순위(rank)만 제공 — 예매율·판매좌석·매진 데이터 없어 '순위 궤적'으로 실현. boxoffice_daily(스냅샷별)와 그레인 다름."
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 스냅샷 요약이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_booking_curve
          product_question: "공연 예매 인기가 개막까지 어떤 궤적으로 차오르나?"
          grain: "공연(performance_id)마다 한 행"
          primary_key: [performance_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 이 제품은 KOPIS 예매 순위만 읽는다(silver_culture_boxoffice·
          # silver_culture_performance). 지역 축이 없어 행정동 링크를 쓰지 않으므로
          # activity_by_dong 의 6원천 중 KOPIS 하나만 상속한다(#88 §1-2 B).
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조
          usage_patterns:
            - pattern_id: steady_sellers
              question_ko: 오래 랭킹에 머무는 스테디셀러 공연은?
              axes: 랭킹 — days_on_chart DESC
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 29988004f0674314a067d4c40652208f
              insight_sample_ko: DAY6 서울 공연이 31일 최장 체류.
              # KOPIS 는 순위만 제공(예매율·좌석 없음) — '순위 궤적' 해석만 가능(제품 caveat)
              sql: |
                -- :n=10
                SELECT performance_name, genre, venue_name, days_on_chart, best_rank, last_rank
                FROM gold_culture_booking_curve
                ORDER BY days_on_chart DESC LIMIT :n
            # 위가 '오래 머문' 공연이라면 아래 둘은 '빨리 오른' 공연과 '장르별 대표'다 —
            # 같은 표를 체류(days_on_chart)·속도(days_to_peak)·분류(genre) 세 축으로 읽는다.
            - pattern_id: fast_risers
              question_ko: 개막하자마자 상위권에 오른 공연은?
              axes: 필터(days_to_peak, best_rank) — days_to_peak ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { max_days: 3, n: 10 }
              verified_rows: 4
              verified_at: "2026-08-05"
              verified_publication_id: a1d0ab0d52a34f4094c3e1dfad56af87
              allow_empty: true   # 창에 급상승 공연이 없을 수 있다 — 0행이 정상
              insight_sample_ko: DAY6 10주년 투어가 진입 1일 만에 1위.
              sql: |
                -- :max_days=3, :top=10, :n=10
                SELECT performance_name, genre, venue_name,
                       best_rank, days_to_peak, days_on_chart
                FROM gold_culture_booking_curve
                WHERE days_to_peak <= :max_days AND best_rank <= :top
                ORDER BY days_to_peak ASC, best_rank ASC LIMIT :n
            - pattern_id: genre_leaders
              question_ko: 장르별로 가장 성적이 좋았던 공연은?
              axes: 장르별 1위 — best_rank ASC, 동률은 days_on_chart DESC
              requires: [select_columns, subquery, sort]
              param_defaults: { n: 20 }
              verified_rows: 7
              verified_at: "2026-08-05"
              verified_publication_id: a1d0ab0d52a34f4094c3e1dfad56af87
              insight_sample_ko: 7개 장르 각 1건 — 대중음악 Stray Kids·뮤지컬 드라큘라 공동 1위.
              sql: |
                -- :n=20
                SELECT genre, performance_name, venue_name, best_rank, days_on_chart
                FROM gold_culture_booking_curve b
                WHERE b.rowid = (SELECT x.rowid FROM gold_culture_booking_curve x
                                 WHERE x.genre = b.genre
                                 ORDER BY x.best_rank ASC, x.days_on_chart DESC LIMIT 1)
                ORDER BY best_rank ASC LIMIT :n
            - pattern_id: "rank_climbers"
              question_ko: "첫 등장 대비 최근 예매 순위가 오른(상승세) 공연은?"
              axes: "랭킹 — (first_rank - last_rank) DESC, 최소 체류일 임계"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "첫 등장 40위였던 뮤지컬 '디어 에반 핸슨 (Musical Dear Evan Hansen) [서울]'이 최근 9위까지 올라 31계단 상승, 차트 34일째로 상승세가 가장 뚜렷했다."
              sql: |
                -- :min_days=7, :n=10
                SELECT performance_name, genre, venue_name, first_rank, last_rank,
                       first_rank - last_rank AS rank_gain, days_on_chart
                FROM gold_culture_booking_curve
                WHERE days_on_chart >= :min_days
                ORDER BY rank_gain DESC, days_on_chart DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_days: 7, n: 10 }
            - pattern_id: "fading_from_peak"
              question_ko: "정점을 찍은 뒤 최근 순위가 크게 떨어진(식은) 공연은?"
              axes: "랭킹 — (last_rank - best_rank) DESC, 낙폭 임계"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "'Stray Kids World Tour: RUN IT [서울]'은 7월 4일 최고 1위를 찍은 뒤 최근 49위로 48계단 하락, 정점 대비 낙폭이 가장 컸다."
              sql: |
                -- :min_drop=5, :n=10
                SELECT performance_name, genre, venue_name, best_rank, best_rank_date,
                       last_rank, last_rank - best_rank AS drop_from_peak, days_on_chart
                FROM gold_culture_booking_curve
                WHERE last_rank - best_rank >= :min_drop
                ORDER BY drop_from_peak DESC, best_rank ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_drop: 5, n: 10 }
            - pattern_id: "slow_burners"
              question_ko: "뒤늦게 입소문이 나 한참 만에 정점에 오른 슬로우버너 공연은?"
              axes: "필터(days_to_peak>=min, best_rank<=top) — days_to_peak DESC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "'디어 에반 핸슨 (Musical Dear Evan Hansen) [서울]'은 첫 등장 40일 만인 8월 8일에야 최고 9위에 올라, 뒤늦게 정점을 찍은 슬로우버너였다."
              sql: |
                -- :min_peak_days=10, :top=20, :n=10
                SELECT performance_name, genre, venue_name, days_to_peak, best_rank,
                       best_rank_date, days_on_chart
                FROM gold_culture_booking_curve
                WHERE days_to_peak >= :min_peak_days AND best_rank <= :top
                ORDER BY days_to_peak DESC, best_rank ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_peak_days: 10, n: 10 }
            - pattern_id: "venue_leaderboard"
              question_ko: "예매 성적 좋은 공연이 자주 열리는 공연장은? (공연장별 실적)"
              axes: "공연장 랭킹 — 집계 MIN(best_rank) ASC, 최소 공연수 HAVING"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "'올림픽공원 KSPO DOME(체조경기장)'은 차트 진입작 8편으로 최고 1위, 평균 최고순위 11.1위·평균 체류 20.6일로 예매 강세 공연장 1위였다."
              sql: |
                -- :min_shows=2, :n=10
                SELECT venue_name, COUNT(*) AS shows,
                       MIN(best_rank) AS top_rank,
                       ROUND(AVG(best_rank), 1) AS avg_best_rank,
                       ROUND(AVG(days_on_chart), 1) AS avg_days_on_chart
                FROM gold_culture_booking_curve
                GROUP BY venue_name
                HAVING COUNT(*) >= :min_shows
                ORDER BY top_rank ASC, avg_best_rank ASC LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort]
              param_defaults: { min_shows: 2, n: 10 }
            - pattern_id: "genre_summary"
              question_ko: "장르별 예매 차트 성적 요약(작품 수·평균 최고순위·평균 체류일·평균 정점 도달일)은?"
              axes: "장르 분포 — 집계, shows DESC / avg_best_rank ASC"
              verified_rows: 7
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "'대중음악'이 차트 진입 52편으로 가장 많고, 평균 최고순위 22.6위·평균 체류 16.9일·평균 정점 도달 6.8일이었다."
              sql: |
                -- :n=10
                SELECT genre, COUNT(*) AS shows,
                       MIN(best_rank) AS top_rank,
                       ROUND(AVG(best_rank), 1) AS avg_best_rank,
                       ROUND(AVG(days_on_chart), 1) AS avg_days_on_chart,
                       ROUND(AVG(days_to_peak), 1) AS avg_days_to_peak
                FROM gold_culture_booking_curve
                GROUP BY genre
                ORDER BY shows DESC, avg_best_rank ASC LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { n: 10 }
            - pattern_id: "pre_open_anticipation"
              question_ko: "아직 개막 전인데 이미 예매 순위 상위에 오른 기대작은?"
              axes: "필터(event_start_date > today, best_rank<=top) — best_rank ASC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "개막(9월 18일) 전인데도 'NCT 127 5TH TOUR, NEO CITY: THE REDLINE [서울]'이 이미 최고 2위(8월 8일)에 올라 개막 전 기대작 1위였다."
              sql: |
                -- :today=2026-08-09, :top=30, :n=10
                SELECT performance_name, genre, venue_name, event_start_date,
                       best_rank, best_rank_date, days_on_chart
                FROM gold_culture_booking_curve
                WHERE event_start_date > :today AND best_rank <= :top
                ORDER BY best_rank ASC, event_start_date ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , today: { rel: "0d", as: date } }
            - pattern_id: "currently_running"
              question_ko: "지금 공연 중이면서 예매 순위에도 걸려 있는(지금 볼 수 있는) 작품은?"
              axes: "필터(event_start<=today<=event_end) — best_rank ASC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "공연 중(7/10~10/18)인 뮤지컬 '드라큘라 [서울]'은 최고·최근 순위가 모두 1위, 차트 41일째로 지금 볼 수 있는 최상위작이었다."
              sql: |
                -- :today=2026-08-09, :n=10
                SELECT performance_name, genre, venue_name, event_start_date, event_end_date,
                       best_rank, last_rank, days_on_chart
                FROM gold_culture_booking_curve
                WHERE event_start_date <= :today AND event_end_date >= :today
                ORDER BY best_rank ASC, last_rank ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , today: { rel: "0d", as: date } }
            - pattern_id: "flex_ranking"
              question_ko: "장르(전체/특정)를 골라 원하는 지표·정렬로 예매 차트 상위작을 보고 싶다"
              axes: "랭킹 — 차원/지표/정렬 스위치 + 장르 센티널 (steady_sellers 상위호환)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 4c4efcd6df354d26ba58cf66db52c414
              insight_sample_ko: "전체 장르에서 최고순위 기준 1위는 뮤지컬 '드라큘라 [서울]'(최고 1위, 차트 41일, 첫 3위→최근 1위)였다."
              sql: |
                -- :genre=ALL, :metric=best_rank, :dir=asc, :n=10
                SELECT performance_name, genre, venue_name,
                       best_rank, days_on_chart, days_to_peak, first_rank, last_rank
                FROM gold_culture_booking_curve
                WHERE (:genre = 'ALL' OR genre = :genre)
                ORDER BY
                  CASE :metric WHEN 'best_rank' THEN best_rank
                               WHEN 'days_on_chart' THEN days_on_chart
                               WHEN 'days_to_peak' THEN days_to_peak
                               WHEN 'last_rank' THEN last_rank END
                  * CASE WHEN :dir = 'asc' THEN 1 ELSE -1 END
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { genre: "ALL", n: 10 }
          display:
            title: 공연별 인기 궤적 요약
            summary: 공연 한 편이 예매 순위에 언제 들어와 얼마나 머물렀는지 요약합니다.
            caveat: 순위 기반 지표만 제공합니다. 원천에 예매율·판매 좌석 수·매진 여부가 없고, 순위 50위 밖에 있던 기간은 집계되지 않습니다.
            use_cases:
              - 공연 마케팅 성과 벤치마킹
              - 흥행 예측 모델 입력
              - 장르별 인기 수명주기 비교
    columns:
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 한 편당 하나, 이 표의 기본 키
        data_type: varchar
        tests: [not_null, unique]
      - name: performance_name
        description: 공연명
        data_type: varchar
      - name: genre
        description: KOPIS 장르 원문
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: first_seen_date
        description: 이 공연이 예매 top50에 처음 등장한 스냅샷 일(KST)
        data_type: date
      - name: last_seen_date
        description: 마지막으로 top50에 있던 스냅샷 일(KST)
        data_type: date
      - name: days_on_chart
        description: 예매 순위표에 등장한 누적 일수 — 체류 기간
        data_type: integer
      - name: best_rank
        description: 이력 중 가장 높았던 순위(숫자가 작을수록 상위, 1이 최상위)
        data_type: integer
      - name: best_rank_date
        description: best_rank 를 처음 달성한 스냅샷 일(KST)
        data_type: date
      - name: days_to_peak
        description: 첫 등장부터 최고 순위에 도달하기까지 걸린 일수
        data_type: integer
      - name: first_rank
        description: 첫 등장일의 순위(진입 순위)
        data_type: integer
      - name: last_rank
        description: 마지막 스냅샷의 순위(현재 순위)
        data_type: integer

  - name: gold_culture_boxoffice_daily
    description: KOPIS 예매 랭킹 일 스냅샷(snapshot_date × rank_no). "요즘 핫한 공연" — 스냅샷이 매일 쌓여 예매 추이 시계열의 원천이 된다.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — PK = 모델 선언 그레인(snapshot_date × rank_no)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_boxoffice_daily
          product_question: "지금 서울에서 예매 상위 공연은 무엇인가?"
          grain: "스냅샷일×순위마다 한 행"
          primary_key: [snapshot_date, rank_no]
          event_time: snapshot_date
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — KOPIS 예매 순위 + 공연장 위치 승계(#509: performance→
          # facility 경유로 admin_dong_code·admin_dong·좌표를 공개하며 행정동 링크를
          # 읽게 됨). #88 §1-2 B 에 따라 lineage 가 실제로 읽는 두 원천을 선언한다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조.
          # 3건 모두 "최신 스냅샷" 스칼라 서브쿼리를 쓴다 → requires 에 subquery.
          usage_patterns:
            - pattern_id: rising_now
              question_ko: 요즘 예매 순위가 오르는 공연은?
              axes: 최신 스냅샷 필터(momentum_status) — rank_no ASC
              requires: [select_columns, subquery, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 최신 스냅샷 rising 10건 — 1위 드라큘라.
              sql: |
                -- :status=rising, :n=10  (momentum_status: rising/steady/falling/new)
                SELECT rank_no, performance_name, genre, venue_name, rank_delta_3d
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND momentum_status = :status
                ORDER BY rank_no LIMIT :n
            - pattern_id: genre_top
              question_ko: 특정 장르(국악·클래식 등)에서 지금 인기 공연은?
              axes: 최신 스냅샷 필터(genre) — rank_no ASC
              requires: [select_columns, subquery, sort]
              param_defaults: { n: 10 }
              verified_rows: 2
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 클래식은 랭킹 내 2건 — 장르별 결과 수 편차가 큼을 명시할 것.
              # genre 값은 KOPIS 원문 한글('뮤지컬'·'서양음악(클래식)' 등 7종) — glossary 불필요,
              # 단 값 목록이 d1_catalog_columns description 에 실려야 AI 가 정확히 필터한다
              sql: |
                -- :genre=뮤지컬, :n=10
                SELECT rank_no, performance_name, venue_name, days_on_chart
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND genre = :genre
                ORDER BY rank_no LIMIT :n
            - pattern_id: new_entries
              question_ko: 랭킹에 새로 들어온 공연은?
              axes: 최신 스냅샷 필터(is_new_entry=1) — rank_no ASC
              requires: [select_columns, subquery, sort]
              param_defaults: { n: 10 }
              verified_rows: 2
              verified_at: "2026-07-31"
              verified_publication_id: f7f793bca4d44edfa388848ec04a1560
              allow_empty: true
              insight_sample_ko: 신규 진입 2건 — 9위 대중음악 공연 포함.
              sql: |
                -- :n=10
                SELECT rank_no, performance_name, genre, venue_name
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND is_new_entry = 1
                ORDER BY rank_no LIMIT :n
            - pattern_id: "perf_rank_history"
              question_ko: "이 공연의 예매 순위가 그동안 어떻게 움직였나?"
              axes: "시계열 — 특정 공연 필터, snapshot_date ASC 궤적"
              verified_rows: 15
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "엘리자벳은 7/25~8/8 15개 스냅샷에 걸쳐 추적되며, 7/25 기준 6위(관람 25일차, 모멘텀 falling)에서 출발한다."
              sql: |
                -- :perf=엘리자벳, :from=2026-07-25, :to=2026-08-08, :n=30
                SELECT snapshot_date, rank_no, rank_delta_3d, days_on_chart, momentum_status
                FROM gold_culture_boxoffice_daily
                WHERE performance_name = :perf AND snapshot_date BETWEEN :from AND :to
                ORDER BY snapshot_date ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 30, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "rank_movers"
              question_ko: "최근 3일간 예매 순위가 가장 크게 뛴(또는 떨어진) 공연은?"
              axes: "최신 스냅샷 랭킹 — rank_delta_3d 정렬 방향 스위치(급등/급락)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "최신 스냅샷(8/8) 기준 순위가 가장 크게 오른 공연은 aespa LIVE TOUR -SYNK: COMPLaeXITY-(대중음악, 고척스카이돔)로 3일 전 35위에서 22위로 +13 상승했다."
              sql: |
                -- :dir=desc, :n=10
                SELECT rank_no, performance_name, genre, venue_name, rank_prev_3d, rank_delta_3d
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND rank_delta_3d IS NOT NULL
                ORDER BY CASE WHEN :dir='desc' THEN rank_delta_3d END DESC,
                         CASE WHEN :dir='asc' THEN rank_delta_3d END ASC,
                         rank_no ASC
                LIMIT :n
              requires: [select_columns, subquery, filter_null, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "genre_share_on_date"
              question_ko: "이 날짜 예매 상위권은 어떤 장르가 얼마나 차지했나?"
              axes: "분포 — 특정 스냅샷 장르별 편수·점유율"
              verified_rows: 6
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "8/8 상위 50편 중 대중음악이 22편(44.0%)으로 최다이며, 이 장르의 최고 순위는 2위였다."
              sql: |
                -- :date=2026-08-08, :n=10
                SELECT genre,
                       COUNT(*) AS shows,
                       ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) AS share_pct,
                       MIN(rank_no) AS best_rank
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = :date
                GROUP BY genre
                ORDER BY shows DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, window, sort]
              param_defaults: { n: 10 , date: { rel: "-1d", as: date } }
            - pattern_id: "chart_presence_by_dim"
              question_ko: "기간 동안 예매 상위권에 이름을 가장 많이 올린 공연장/자치구/장르는?"
              axes: "차원 스위치(venue/gu/genre) — 기간 합산 차트 슬롯수 랭킹"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "8/1~8/8 동안 올림픽공원 KSPO DOME(체조경기장)이 27개 차트 슬롯(공연 7편, 최고 2위)으로 상위권에 가장 자주 올랐다."
              sql: |
                -- :dim=venue, :from=2026-08-01, :to=2026-08-08, :n=10
                SELECT CASE :dim WHEN 'gu' THEN gu WHEN 'genre' THEN genre ELSE venue_name END AS dim_value,
                       COUNT(*) AS chart_slots,
                       COUNT(DISTINCT performance_id) AS shows,
                       MIN(rank_no) AS best_rank
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date BETWEEN :from AND :to
                GROUP BY dim_value
                HAVING dim_value IS NOT NULL
                ORDER BY chart_slots DESC, best_rank ASC LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, having, sort]
              param_defaults: { n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "consistent_chart_leaders"
              question_ko: "최근 기간 동안 꾸준히 상위권(K위 이내)을 지킨 공연은?"
              axes: "랭킹 — 기간 내 top-K 진입 일수 DESC, 평균 순위 tie-break"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "7/25~8/8 15일 내내 top10을 지킨 드라큘라 [서울](뮤지컬)이 최고 1위·평균 1.3위로 가장 꾸준했다."
              sql: |
                -- :from=2026-07-25, :to=2026-08-08, :topk=10, :min_days=5, :n=10
                SELECT performance_name, genre,
                       COUNT(*) AS days_in_top,
                       MIN(rank_no) AS best_rank,
                       ROUND(AVG(rank_no), 1) AS avg_rank
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date BETWEEN :from AND :to AND rank_no <= :topk
                GROUP BY performance_id, performance_name, genre
                HAVING days_in_top >= :min_days
                ORDER BY days_in_top DESC, avg_rank ASC LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, having, sort]
              param_defaults: { min_days: 5, n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "ending_soon_still_ranked"
              question_ko: "곧 끝나는데 아직 예매 상위권인, 놓치면 아쉬운 '막차' 공연은?"
              axes: "최신 스냅샷 필터 — event_end_date 임박 윈도우, 종료일 ASC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "8/8~8/23 종료 예정 중 aespa LIVE TOUR -SYNK: COMPLaeXITY-(대중음악, 고척스카이돔, 8/8 종료)가 22위로 아직 상위권에 남아 있는 막차 공연이다."
              sql: |
                -- :today=2026-08-08, :until=2026-08-23, :n=10
                SELECT rank_no, performance_name, genre, venue_name, event_end_date, days_on_chart
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND event_end_date BETWEEN :today AND :until
                ORDER BY event_end_date ASC, rank_no ASC LIMIT :n
              requires: [select_columns, subquery, filter_range, sort]
              param_defaults: { n: 10 , today: { rel: "0d", as: date }, until: { rel: "+14d", as: date } }
            - pattern_id: "multi_genre_top"
              question_ko: "이 장르들(예: 뮤지컬·연극) 중에서 지금 예매 상위 공연은?"
              axes: "최신 스냅샷 필터(다중 장르 IN) — rank_no ASC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 58643568b392472caa7a94d41552d145
              insight_sample_ko: "뮤지컬·연극 중 최신 스냅샷(8/8) 1위는 드라큘라 [서울](뮤지컬, LG아트센터 서울 LG SIGNATURE 홀, 관람 41일차)이다."
              sql: |
                -- :genres=["뮤지컬","연극"], :n=10
                SELECT rank_no, performance_name, genre, venue_name, days_on_chart
                FROM gold_culture_boxoffice_daily
                WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM gold_culture_boxoffice_daily)
                  AND genre IN (SELECT value FROM json_each(:genres))
                ORDER BY rank_no ASC LIMIT :n
              requires: [select_columns, subquery, filter_set, sort]
              param_defaults: { n: 10 }
          display:
            title: 공연 예매 랭킹 (일별)
            summary: 공연 예매 순위를 매일 기록해 순위 변동과 신규 진입을 보여줍니다.
            caveat: 원천이 순위만 제공합니다. 예매율·판매 좌석 수·매출액은 포함되지 않습니다. 공간축(자치구·행정동·좌표)은 공연ID로 공연 정보의 공연장 위치를 승계한 best-effort 값이라 비어 있을 수 있습니다. 제목 끝의 "[서울]" 같은 표기는 장소가 아니라 투어 도시 접미사이며 tour_city 컬럼에 분리되어 있습니다.
            use_cases:
              - 인기 공연 큐레이션
              - 장르별 흥행 추이 리포트
              - 공연 추천 모델의 인기도 피처
    tests:
      # 서빙 계약 PK 근거(#346) — 그레인은 모델 선언(snapshot_date × rank_no) 그대로
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_date, rank_no]
    columns:
      - name: snapshot_date
        description: 순위를 집계한 날(YYYY-MM-DD). 문자열로 저장된다
        data_type: varchar
        tests: [not_null]
      - name: rank_no
        description: 예매 순위(1=최다) — snapshot_date 안에서 유일
        data_type: integer
        tests: [not_null]
      - name: performance_id
        description: KOPIS 공연 식별자(mt20id) — 공연 상세 정보와 붙이는 조인 키
        data_type: varchar
      - name: performance_name
        description: 공연명. 투어 공연은 끝에 "[도시]" 접미사가 붙을 수 있다(tour_city에 분리 제공)
        data_type: varchar
      - name: tour_city
        description: 공연명 끝 "[도시]" 접미사에서 분리한 투어 도시 표기. 장소 필드가 아니며 접미사가 없으면 비어 있다
        data_type: varchar
      - name: genre
        description: KOPIS 장르(연극·뮤지컬·클래식 등 원문 분류)
        data_type: varchar
      - name: venue_name
        description: 공연장 이름
        data_type: varchar
      - name: event_start_date
        description: 공연 시작일(KST)
        data_type: date
      - name: event_end_date
        description: 공연 종료일(KST)
        data_type: date
      - name: seat_count
        description: 공연장 좌석 수 — 공연 규모를 가늠하는 값
        data_type: integer
      - name: gu_code
        description: 공연장이 속한 자치구 코드
        data_type: varchar
      - name: gu
        description: 공연장 자치구 이름
        data_type: varchar
      - name: admin_dong_code
        description: 공연장이 속한 행정동 코드(공연ID로 공연 정보에서 승계, best-effort)
        data_type: varchar
      - name: admin_dong
        description: 공연장 행정동 이름(승계, best-effort)
        data_type: varchar
      - name: longitude
        description: 공연장 경도(WGS84, 승계, best-effort)
        data_type: double
      - name: latitude
        description: 공연장 위도(WGS84, 승계, best-effort)
        data_type: double
      - name: rank_prev_3d
        description: 3일 전 같은 공연의 순위. 그때 순위표에 없었으면 비어 있다
        data_type: integer
      - name: rank_delta_3d
        description: 순위 상승폭(3일 전 순위 − 오늘 순위). 양수면 상승, 비어 있으면 신규 또는 재진입
        data_type: integer
      - name: days_on_chart
        description: 이 공연이 순위표에 등장한 누적 일수(오늘 포함)
        data_type: integer
      - name: is_new_entry
        description: 어제는 없다가 오늘 진입했는지 여부(첫 진입·재진입 공통)
        data_type: boolean
      - name: momentum_status
        description: "순위 모멘텀: new(어제 부재)·rising(순위 상승)·falling(하락)·steady(변동 없음/추세 미정)"
        data_type: varchar

  - name: gold_culture_calendar_density
    description: 일×구 문화 밀도·경쟁 지수(#269). 시민 "볼 게 많은 날"=total_events, 주최자 "피해야 할 날"=concentration. int_culture_activity_days 재사용 — location_daily가 유형별 count면 여기는 다양성·집중도 요약. 그레인 gu_code×event_date.
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_calendar_density
          product_question: "구별로 어느 날짜에 행사가 몰리나(밀집도)?"
          grain: "구×날짜마다 한 행"
          primary_key: [gu_code, event_date]
          event_time: event_date
          # 신선도 축은 event_time 과 다르다(#707) — 계약 v1.9 freshness_field.
          # event_date/event_start_date 는 미래로 뻗는 달력이라 신선도가 될 수 없다.
          freshness_field: source_collected_at
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 권리 정본은 gold_culture_activity_by_dong 블록이고 여기는 같은
          # silver 를 읽으므로 같은 원천을 상속한다(#88 §1-2 B). 값을 베낀 게 아니라
          # **같은 원천이라 같은 값**이다 — 원천 권리가 바뀌면 두 곳을 함께 고친다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조
          usage_patterns:
            - pattern_id: calm_days
              question_ko: 행사가 적어서 한산하게 다닐 만한 날이 언제인가?
              axes: 랭킹 — total_events ASC (기간 내)
              requires: [select_columns, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 7ed8eddecfac4ba283ce075c26b2d45d
              insight_sample_ko: 상한 없는 검증에선 2027-05-10(1건)이 1위로 떴다 — :to 필수.
              # ⚠️ :to 를 안 걸면 1년 뒤 스카폴드 날짜가 "한산한 날"로 뜬다(실측). 상한 필수 —
              # 이 관례를 실어 나르는 것이 참조 구현의 값어치다
              sql: |
                -- :gu=중구, :from=2026-07-01, :to=2026-08-31, :n=10
                SELECT event_date, total_events, busiest_type
                FROM gold_culture_calendar_density
                WHERE gu = :gu AND event_date BETWEEN :from AND :to
                ORDER BY total_events ASC, event_date LIMIT :n
            - pattern_id: crowded_days
              question_ko: 행사가 몰리는 날(피해야 할 날)이 언제인가?
              axes: 랭킹 — total_events DESC
              requires: [select_columns, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 7ed8eddecfac4ba283ce075c26b2d45d
              insight_sample_ko: 7/31 중구 235건 · concentration 0.47 이 최다.
              # ⚠️ 위 `quiet_days` 와 달리 **:to 를 걸지 않는다.** 상한이 필요했던 이유는
              # 오름차순이라 1년 뒤 스카폴드 날짜(2027-05-30 · 1건까지 있다)가 "한산한 날"
              # 1위로 뜨기 때문인데, 여기는 **내림차순**이라 그 행들이 꼴찌로 밀린다.
              # 그리고 "피해야 할 날"은 앞으로 올 날을 묻는 질문이라 상한이 오히려 답을 자른다.
              # 선언 주석에 `:to` 가 있었는데 SQL 은 안 썼다 — 이웃에서 복사되며 딸려온 것으로,
              # 그대로 두면 `?to=` 를 보낸 쪽이 400(선언 밖 파라미터)을 맞는다(2026-08-07 수정).
              sql: |
                -- :from=2026-08-01, :n=10
                SELECT event_date, gu, total_events, concentration, busiest_type
                FROM gold_culture_calendar_density
                WHERE event_date >= :from ORDER BY total_events DESC LIMIT :n
            # 위 둘은 '어느 날'을 고른다(날짜 축). 구끼리 비교하는 축이 없어서 더한다 —
            # 하루 평균까지 내야 관측일 수가 다른 구를 나란히 놓을 수 있다.
            - pattern_id: gu_ranking
              question_ko: 문화행사가 가장 활발한 자치구는 어디인가?
              axes: 구 랭킹 — 기간 합산 total_events DESC, 하루 평균 동반
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 15 , from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              verified_rows: 15
              verified_at: "2026-08-05"
              verified_publication_id: c02106f1baa24256abe26cd7554fe5e7
              insight_sample_ko: 7/1~8/5 중구 10,174건(36일, 하루 283건)으로 1위.
              sql: |
                -- :from=2026-07-01, :to=2026-08-31, :n=15
                SELECT gu,
                       SUM(total_events) AS events,
                       COUNT(DISTINCT event_date) AS days,
                       ROUND(SUM(total_events) * 1.0 / COUNT(DISTINCT event_date), 1) AS per_day
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                GROUP BY gu ORDER BY events DESC LIMIT :n
            - pattern_id: "type_leaderboard"
              question_ko: "어떤 종류(전시·공연·축제 등)의 문화행사가 달력을 가장 많이 채우나?"
              axes: "종류 분포 랭킹 — busiest_type별 메인 일수·누적 건수 DESC (기간·구 센티널)"
              verified_rows: 4
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "2026-08~2027-02 서울 전역에서 'event' 종류가 145일 동안 그날의 메인이었고 해당 종류 누적 1,529건으로 1위(평균 집중도 0.584)."
              sql: |
                -- :gu=ALL, :from=2026-08-01, :to=2027-02-28, :n=10
                SELECT busiest_type,
                       COUNT(*) AS lead_days,
                       SUM(busiest_type_count) AS type_events,
                       ROUND(AVG(concentration), 3) AS avg_conc
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                  AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY busiest_type
                ORDER BY type_events DESC LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { gu: "ALL", n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "gu_leaderboard_by_metric"
              question_ko: "자치구를 원하는 기준(총량·일평균·종류 다양성·집중도)으로 줄세우면 어디가 상위인가?"
              axes: "구 랭킹 — 지표 스위치(events/per_day/diversity/concentration) DESC"
              verified_rows: 15
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "총량 기준 1위는 중구로 기간 누적 4,338건(하루 평균 40.5건), 하루 평균 종류 수 3.59, 평균 집중도 0.548."
              sql: |
                -- :metric=events, :from=2026-08-01, :to=2027-02-28, :n=15
                SELECT gu,
                       SUM(total_events) AS events,
                       ROUND(SUM(total_events) * 1.0 / COUNT(DISTINCT event_date), 1) AS per_day,
                       ROUND(AVG(distinct_types), 2) AS avg_types,
                       ROUND(AVG(concentration), 3) AS avg_conc
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                GROUP BY gu
                ORDER BY CASE :metric
                           WHEN 'events' THEN SUM(total_events)
                           WHEN 'per_day' THEN SUM(total_events) * 1.0 / COUNT(DISTINCT event_date)
                           WHEN 'diversity' THEN AVG(distinct_types)
                           WHEN 'concentration' THEN AVG(concentration)
                         END DESC
                LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 15, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "type_lead_by_gu"
              question_ko: "특정 종류(공연·축제 등)가 주로 어느 자치구에서 그날의 메인이 되나?"
              axes: "구 랭킹 — busiest_type 고정 후 메인 일수 DESC (종류×구 교차)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "공연(performance)이 메인인 날이 가장 많은 구는 서초구로 기간 중 39일, 누적 183건(평균 집중도 0.496)."
              sql: |
                -- :type=performance, :from=2026-08-01, :to=2027-02-28, :n=10
                SELECT gu,
                       COUNT(*) AS lead_days,
                       SUM(busiest_type_count) AS type_events,
                       ROUND(AVG(concentration), 3) AS avg_conc
                FROM gold_culture_calendar_density
                WHERE busiest_type = :type AND event_date BETWEEN :from AND :to
                GROUP BY gu
                ORDER BY lead_days DESC, type_events DESC LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "variety_or_focus_days"
              question_ko: "이 구에서 행사 종류가 다양하게 고루 열리는 날(또는 한 종류로 쏠린 날)은 언제인가?"
              axes: "단면 랭킹 — concentration 정렬 방향 스위치(asc=다양/desc=쏠림), total_events 임계값"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "중구에서 가장 고르게 분산된 날은 2027-01-03로 총 9건이 3종류에 걸쳐 열려 집중도 0.333(공연이 최다)."
              sql: |
                -- :gu=중구, :from=2026-08-01, :to=2027-02-28, :dir=asc, :min_events=5, :n=10
                SELECT event_date, total_events, distinct_types, busiest_type, concentration
                FROM gold_culture_calendar_density
                WHERE gu = :gu AND event_date BETWEEN :from AND :to
                  AND total_events >= :min_events
                ORDER BY CASE WHEN :dir = 'asc' THEN concentration END ASC,
                         CASE WHEN :dir = 'desc' THEN concentration END DESC,
                         total_events DESC
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_events: 5, dir: "asc", n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "days_by_type_selection"
              question_ko: "이 구에서 내가 고른 종류들(예: 행사·공연)이 그날의 메인인 날들을 시간순으로 보여줘."
              axes: "다중값 필터 — busiest_type IN(배열) + 기간, event_date ASC"
              verified_rows: 15
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "중구에서 행사·공연이 메인인 가장 이른 날은 2026-08-03로 event가 19건(총 31건, 집중도 0.613)."
              sql: |
                -- :gu=중구, :types=["event","performance"], :from=2026-08-01, :to=2027-02-28, :n=15
                SELECT event_date, busiest_type, busiest_type_count, total_events, concentration
                FROM gold_culture_calendar_density
                WHERE gu = :gu
                  AND event_date BETWEEN :from AND :to
                  AND busiest_type IN (SELECT value FROM json_each(:types))
                ORDER BY event_date LIMIT :n
              requires: [select_columns, filter_range, filter_set, sort]
              param_defaults: { n: 15, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "city_daily_density"
              question_ko: "서울 전체로 보면 어느 날에 문화행사가 가장 몰리나(도시 전역 일자별 밀도)?"
              axes: "일자 집계 랭킹 — 전 구 합산 total_events DESC"
              verified_rows: 31
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "기간 중 서울 전역 합산이 가장 큰 날은 2026-08-08로 총 268건(메인 종류 126건)."
              sql: |
                -- :from=2026-08-01, :to=2027-02-28, :n=31
                SELECT event_date,
                       SUM(total_events) AS events,
                       COUNT(DISTINCT gu) AS active_gus,
                       SUM(busiest_type_count) AS lead_events
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                GROUP BY event_date
                ORDER BY events DESC LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 31, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "weekday_density_profile"
              question_ko: "요일별로 보면 문화행사가 주로 언제 몰리나(주중 vs 주말)?"
              axes: "요일 분포 — strftime 파생 요일별 합산·평균 DESC (구 센티널)"
              verified_rows: 7
              verified_at: "2026-08-10"
              verified_publication_id: 6534852573ff4eba96196751296f4641
              insight_sample_ko: "서울 전역 기준 행사가 가장 몰리는 요일은 토요일(dow=6)로 기간 합산 930건, 하루 평균 22.1건(0=일~6=토)."
              sql: |
                -- :gu=ALL, :from=2026-08-01, :to=2027-02-28, :n=7
                SELECT CAST(strftime('%w', event_date) AS INTEGER) AS dow,
                       COUNT(*) AS day_rows,
                       SUM(total_events) AS events,
                       ROUND(AVG(total_events), 1) AS avg_events,
                       ROUND(AVG(concentration), 3) AS avg_conc
                FROM gold_culture_calendar_density
                WHERE event_date BETWEEN :from AND :to
                  AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY dow
                ORDER BY events DESC LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { gu: "ALL", n: 7, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
          display:
            title: 자치구 일자별 문화행사 밀도
            summary: 자치구별로 하루에 행사가 몇 건 열리고 어떤 유형에 쏠리는지 보여줍니다.
            use_cases:
              - 행사 개최일 선정
              - 이번 주 볼거리 많은 자치구 콘텐츠
              - 지역별 문화 공급 편차 분석
    tests:
      # 서빙 계약 PK 근거(#346)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gu_code, event_date]
    columns:
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST). 여러 날에 걸친 행사는 날짜마다 한 행으로 펼쳐진다
        data_type: date
        tests: [not_null]
      - name: total_events
        description: 그날 그 구에서 열린 전체 문화활동 수 — "볼 게 많은 날" 지표
        data_type: integer
      - name: distinct_types
        description: 그날 열린 활동 유형 수(공연·행사·축제·전시·세종·kcisa 중 몇 종) — 다양성
        data_type: integer
      - name: busiest_type
        description: 그날 가장 많이 열린 활동 유형(동수 시 임의 1개)
        data_type: varchar
      - name: busiest_type_count
        description: 가장 많이 열린 유형의 행사 수 — 같은 유형끼리의 경쟁 규모
        data_type: integer
      - name: concentration
        description: 경쟁 집중도(busiest_type_count / total_events, 0~1) — 1=한 유형 독점, 낮을수록 다양
        data_type: double
      - name: source_collected_at
        description: 이 자치구·날짜 집계에 쓰인 원천을 마지막으로 수집한 시각(KST)
        data_type: timestamp(6)

  - name: gold_culture_event_crowd
    description: '문화 행사 자치구의 요일×시간대별 평시 혼잡 베이스라인(그레인 gu_code×day_of_week×hour_of_day, #276·v2 #282, v3 소스전환 2026-08-08). citydata gold를 크로스도메인 source로 읽어 event_schedule 있는 gu로 스코프. "그 행사 지역 무슨 요일 몇 시가 붐비나/한적한가". ⚠~120 핫스팟 한정 평시 베이스라인 — 특정 행사일 실측 lift 아님. ⚠v3: 소스가 5분 관측(by_time, ASAC-DBT#467로 삭제)에서 시간버킷 집계(ppltn_hourly)로 바뀌어 혼잡도가 **그 시간의 최고 등급** 기준이다 — 실측 평균 혼잡점수 1.381→1.446(+4.7%).'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346) — 요일축 명부성이라 event_time 미선언(면제)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_event_crowd
          product_question: "무슨 요일 몇 시에 행사 주변이 붐비나?"
          grain: "구×요일×시간대마다 한 행"
          primary_key: [gu_code, day_of_week, hour_of_day]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 권리 정본은 gold_culture_activity_by_dong 블록이고 여기는 같은
          # silver 를 읽으므로 같은 원천을 상속한다(#88 §1-2 B). 값을 베낀 게 아니라
          # **같은 원천이라 같은 값**이다 — 원천 권리가 바뀌면 두 곳을 함께 고친다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-05"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조.
          # ⚠️ 두 패턴 모두 평시 베이스라인(핫스팟 ~120곳 한정) — 특정 행사일 실측이 아니다(제품 caveat)
          #
          # 🔄 2026-08-08 소스 전환(v3): **SQL 은 안 바꿨다** — 컬럼·그레인이 그대로라 세 질의가
          #    그대로 돈다. `insight_sample_ko` 만 새 소스 기준 실측으로 갱신했다(읽기 전용
          #    시뮬레이션, prod 원본 대상). 답이 거의 안 바뀌었다: 은평구 9,920→9,882 ·
          #    송파 00시 8,236→8,341 · 종로 최한산 여유 유지.
          #    ⚠️ `verified_publication_id` 는 **옛 게시본을 가리킨 채로 뒀다** — 새 값을 손으로
          #    지어낼 수 없다. 첫 prod 재빌드·발행 뒤에 그 run 의 id 로 갱신해야 한다.
          usage_patterns:
            - pattern_id: quiet_hours_in_gu
              question_ko: 이 구는 언제(요일×시간) 제일 한산한가?
              axes: 랭킹 — avg_congest_score ASC
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 2ba3ce94ac734d0487dfd93fa4999f55
              insight_sample_ko: 종로구 최한산 = 혼잡점수 1.0(여유) — 여러 요일·시간이 동률.
              sql: |
                -- :gu=성북구, :n=10
                SELECT day_of_week, hour_of_day, typical_congest, avg_congest_score
                FROM gold_culture_event_crowd
                WHERE gu = :gu ORDER BY avg_congest_score ASC LIMIT :n
            - pattern_id: gu_day_profile
              question_ko: 이 구의 특정 요일은 시간대별로 얼마나 붐비나?
              axes: 프로파일 — hour_of_day ASC (요일 고정)
              requires: [select_columns, sort]
              param_defaults: { n: 24 }
              verified_rows: 24
              verified_at: "2026-07-31"
              verified_publication_id: 2ba3ce94ac734d0487dfd93fa4999f55
              insight_sample_ko: 송파구 토요일 24시간 프로파일 — 00시 avg_ppltn 8,341(여유).
              sql: |
                -- :gu=마포구, :dow=6, :n=24  (dow 1=월..7=일)
                SELECT hour_of_day, avg_ppltn, typical_congest
                FROM gold_culture_event_crowd
                WHERE gu = :gu AND day_of_week = :dow ORDER BY hour_of_day LIMIT :n
            # 위 둘은 구를 먼저 정해 놓고 그 안을 본다. "어느 구로 갈까"를 못 묻는다 —
            # 요일·시간을 고정하고 구를 비교하는 축을 더한다.
            - pattern_id: busiest_gu_at_hour
              question_ko: 이 요일 이 시간에 가장 붐비는 자치구는 어디인가?
              axes: 구 랭킹 — (요일·시간 고정) avg_congest_score DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-08-05"
              verified_publication_id: 865b88b6a8f1428e8fd6cbb9f937fa26
              insight_sample_ko: 토요일 19시 은평구 avg_ppltn 9,882 로 '붐빔' 1위.
              sql: |
                -- :dow=6, :hour=18, :n=10  (dow 1=월..7=일)
                SELECT gu, avg_ppltn, avg_congest_score, typical_congest, crowd_samples
                FROM gold_culture_event_crowd
                WHERE day_of_week = :dow AND hour_of_day = :hour
                ORDER BY avg_congest_score DESC LIMIT :n
            - pattern_id: "weekend_lift_by_gu"
              question_ko: "주중 대비 주말에 유독 더 붐비는 자치구는? (나들이·상권 성격)"
              axes: "구 랭킹 — 조건부 집계 주말/주중 혼잡비(weekend_lift) DESC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "광진구는 주말 평균 혼잡 1.69로 주중 1.25보다 1.35배 높아, 주중 대비 주말에 가장 붐비는 자치구였다."
              sql: |
                -- :min_samples=200, :n=10
                SELECT gu,
                       ROUND(AVG(CASE WHEN day_of_week IN (6,7) THEN avg_congest_score END), 2) AS weekend_congest,
                       ROUND(AVG(CASE WHEN day_of_week BETWEEN 1 AND 5 THEN avg_congest_score END), 2) AS weekday_congest,
                       ROUND(AVG(CASE WHEN day_of_week IN (6,7) THEN avg_congest_score END)
                             / AVG(CASE WHEN day_of_week BETWEEN 1 AND 5 THEN avg_congest_score END), 3) AS weekend_lift
                FROM gold_culture_event_crowd
                GROUP BY gu
                HAVING SUM(crowd_samples) >= :min_samples
                ORDER BY weekend_lift DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort]
              param_defaults: { min_samples: 200, n: 10 }
            - pattern_id: "peak_slot_per_gu"
              question_ko: "자치구별로 한 주 중 가장 붐비는 시점(요일·시간)은 언제인가?"
              axes: "구별 argmax — 상관 서브쿼리로 gu당 최혼잡 슬롯 1개, avg_congest_score DESC"
              verified_rows: 24
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "은평구는 금요일(요일=5) 19시에 혼잡도 4.0('붐빔')·평균 10,419명으로 한 주 중 가장 붐비는 시점을 찍었다."
              sql: |
                -- :n=24
                SELECT gu, day_of_week, hour_of_day, typical_congest, avg_congest_score, avg_ppltn
                FROM gold_culture_event_crowd e
                WHERE e.rowid = (SELECT x.rowid FROM gold_culture_event_crowd x
                                 WHERE x.gu = e.gu
                                 ORDER BY x.avg_congest_score DESC, x.avg_ppltn DESC LIMIT 1)
                ORDER BY avg_congest_score DESC, avg_ppltn DESC LIMIT :n
              requires: [select_columns, subquery, sort]
              param_defaults: { n: 24 }
            - pattern_id: "congest_mix_for_gu"
              question_ko: "이 구는 한 주 168시간 중 혼잡 등급(여유·보통·약간 붐빔·붐빔)이 각각 몇 시간이고 비율은?"
              axes: "단일 구 분포 — typical_congest 그룹 카운트 + 구성비 window"
              verified_rows: 3
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "강남구는 한 주 168시간 중 98시간(58.3%)이 '여유' 등급으로, 상주 인구는 많아도(해당 등급 평균 약 14,649명) 면적 대비로는 대체로 한산한 편이었다."
              sql: |
                -- :gu=강남구, :n=10
                SELECT typical_congest,
                       COUNT(*) AS slots,
                       ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) AS pct,
                       ROUND(AVG(avg_ppltn)) AS mean_ppltn
                FROM gold_culture_event_crowd
                WHERE gu = :gu
                GROUP BY typical_congest
                ORDER BY slots DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, window, sort]
              param_defaults: { n: 10 }
            - pattern_id: "city_hourly_rhythm"
              question_ko: "서울 전체(전 자치구 평균)로 볼 때 하루 중 시간대별 혼잡 리듬은? (요일 지정 또는 전체)"
              axes: "시간대 분포 — 전 자치구 평균, day_of_week 센티널, hour_of_day 오름차순"
              verified_rows: 24
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "서울 전체 평균으로 0시(자정)는 혼잡 1.02·약 6,940명으로 하루의 한산한 기준선을 이뤘고, 시간대를 따라 낮 혼잡이 올라간다(시간 오름차순 출력)."
              sql: |
                -- :dow=ALL, :n=24
                SELECT hour_of_day,
                       ROUND(AVG(avg_congest_score), 2) AS congest,
                       ROUND(AVG(avg_ppltn)) AS mean_ppltn
                FROM gold_culture_event_crowd
                WHERE (:dow = 'ALL' OR day_of_week = :dow)
                GROUP BY hour_of_day
                ORDER BY hour_of_day LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { dow: "ALL", n: 24 }
            - pattern_id: "compare_gu_at_slot"
              question_ko: "후보로 고른 여러 자치구를 특정 요일·시간의 혼잡도로 나란히 비교하고 싶다."
              axes: "다중 구 단면 — json_each 배열 IN, 요일·시간 고정, avg_congest_score DESC"
              verified_rows: 3
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "토요일(요일=6) 20시 기준 강남·마포·종로 중 마포구가 혼잡 2.5('약간 붐빔')·약 21,232명으로 가장 붐볐다."
              sql: |
                -- :gus=["강남구","마포구","종로구"], :dow=6, :hour=20, :n=10
                SELECT gu, avg_ppltn, avg_congest_score, typical_congest, crowd_samples
                FROM gold_culture_event_crowd
                WHERE gu IN (SELECT value FROM json_each(:gus))
                  AND day_of_week = :dow AND hour_of_day = :hour
                ORDER BY avg_congest_score DESC, avg_ppltn DESC LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 10 }
            - pattern_id: "congest_spread_by_gu"
              question_ko: "시간대에 따라 붐빔 편차가 큰(사람이 확 몰리는) 구와 하루 종일 평탄한 구는?"
              axes: "구 랭킹 — MAX-MIN 혼잡 편차(congest_spread) DESC, 최소 표본 임계"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "은평구는 시간대별 혼잡 편차가 3.0(최저 1.0~최고 4.0)으로 가장 커, 인구는 최저 3,250~최고 10,419명으로 붐빌 땐 확 몰리는 자치구였다."
              sql: |
                -- :min_samples=200, :n=10
                SELECT gu,
                       ROUND(MAX(avg_congest_score) - MIN(avg_congest_score), 2) AS congest_spread,
                       MAX(avg_ppltn) AS peak_ppltn,
                       MIN(avg_ppltn) AS trough_ppltn,
                       ROUND(AVG(avg_congest_score), 2) AS mean_congest
                FROM gold_culture_event_crowd
                GROUP BY gu
                HAVING SUM(crowd_samples) >= :min_samples
                ORDER BY congest_spread DESC, peak_ppltn DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort]
              param_defaults: { min_samples: 200, n: 10 }
            - pattern_id: "gu_slots_ranked"
              question_ko: "이 구의 요일×시간 슬롯을 원하는 지표(혼잡/인구)와 정렬(한산순/붐빔순)로, 신뢰 표본 이상만 골라 랭킹하고 싶다."
              axes: "단일 구 슬롯 랭킹 — 지표/정렬 스위치 + 표본 임계 (quiet_hours_in_gu 상위호환)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 900831fa0bd642f5a5bff1d5a3217c02
              insight_sample_ko: "강남구에서 혼잡도 기준 가장 붐비는 슬롯은 화요일(요일=2) 13시로 혼잡 3.0('약간 붐빔')·평균 40,754명(표본 311)이었다."
              sql: |
                -- :gu=강남구, :min_samples=100, :metric=congest, :dir=desc, :n=10
                SELECT day_of_week, hour_of_day, typical_congest, avg_congest_score, avg_ppltn, crowd_samples
                FROM gold_culture_event_crowd
                WHERE gu = :gu AND crowd_samples >= :min_samples
                ORDER BY
                  (CASE :metric WHEN 'ppltn' THEN avg_ppltn ELSE avg_congest_score END)
                  * CASE WHEN :dir = 'asc' THEN 1 ELSE -1 END
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_samples: 100, n: 10 }
          display:
            title: 행사 지역 요일·시간대 혼잡도
            summary: 행사가 열리는 자치구가 요일·시간대별로 얼마나 붐비는지 보여줍니다.
            caveat: 특정 행사 당일의 증가분이 아니라 평상시 패턴입니다. 서울시가 관측하는 주요 지점 기준이라 자치구 전역을 대표하지는 않습니다. 혼잡도는 그 시간대에 관측된 **가장 붐빈 순간**을 기준으로 하므로, 한 시간 내내 그 수준이었다는 뜻은 아닙니다.
            use_cases:
              - 방문 시간대 추천
              - 행사 운영 인력·안전 배치 계획
              - 한적한 관람 시간 안내
    tests:
      # 서빙 계약 PK 근거(#346)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gu_code, day_of_week, hour_of_day]
    columns:
      - name: gu_code
        description: 자치구 코드 — 혼잡 관측과 행사 데이터를 잇는 공통 키
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: day_of_week
        description: 요일(1=월요일 … 7=일요일)
        data_type: integer
        tests: [not_null]
      - name: hour_of_day
        description: 시각(0~23, KST). 최근 18일 관측을 요일×시각 칸으로 모아 계산했다
        data_type: integer
        tests: [not_null]
      - name: avg_ppltn
        description: 그 시간대 그 자치구 주요 지점의 평균 실시간 인구(명)
        data_type: integer
      - name: avg_congest_score
        description: 평균 혼잡 점수(여유 1 · 보통 2 · 약간 붐빔 3 · 붐빔 4). 높을수록 붐빈다
        data_type: double
      - name: typical_congest
        description: 그 시간대 최빈 혼잡 레벨(여유/보통/약간 붐빔/붐빔)
        data_type: varchar
      - name: crowd_samples
        description: 계산에 사용한 관측 건수 — 값이 클수록 신뢰도가 높다
        data_type: integer

  - name: gold_culture_event_schedule
    description: '문화행사 목록 질의 표면 (행사 1행, #187). "이번 주말 ○○구 행사" = 기간 겹침 + gu_code 필터 단독 조회. 6개 silver union + norm_title×시작일×gu 크로스소스 dedup(전문 소스 우선).'
    config:
      contract:
        enforced: true   # published gold 계약(#180)
      meta:
        serving:   # Serving Contract v1.1 (#346)
          enabled: true
          external: true
          contract_version: v1
          product_id: culture_event_schedule
          product_question: "이번 주말·특정 기간 서울에서 무슨 문화행사가 열리나?"
          grain: "행사(event_ref)마다 한 행"
          primary_key: [event_ref]
          event_time: event_start_date
          # 신선도 축은 event_time 과 다르다(#707) — 계약 v1.9 freshness_field.
          # event_date/event_start_date 는 미래로 뻗는 달력이라 신선도가 될 수 없다.
          freshness_field: source_collected_at
          freshness_slo_minutes: 1800
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "30 4 * * *"
          # source_evidence — 권리 정본은 gold_culture_activity_by_dong 블록이고 여기는 같은
          # silver 를 읽으므로 같은 원천을 상속한다(#88 §1-2 B). 값을 베낀 게 아니라
          # **같은 원천이라 같은 값**이다 — 원천 권리가 바뀌면 두 곳을 함께 고친다.
          source_evidence:
            - source_id: kopis_open_api
              source_url: https://www.kopis.or.kr/por/cs/openapi/openApiFaq.do?menuId=MNU_00074
              license: KOPIS Open API 2차 가공 집계의 외부 API 재배포·출처표시 허용
              license_url: https://kopis.or.kr/upload/openApi/%EA%B3%B5%EC%97%B0%EC%98%88%EC%88%A0%ED%86%B5%ED%95%A9%EC%A0%84%EC%82%B0%EB%A7%9DOpenAPI%EA%B0%9C%EB%B0%9C%EA%B0%80%EC%9D%B4%EB%93%9C.pdf
              redistribution: allowed_with_attribution
              attribution: 공연예술통합전산망(KOPIS)
              rights_checked_at: "2026-08-04"
            - source_id: seoul_cultural_event
              source_url: https://data.seoul.go.kr/dataList/OA-15486/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: sema_exhibition
              source_url: https://data.seoul.go.kr/dataList/OA-15323/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울시립미술관
              rights_checked_at: "2026-08-04"
            - source_id: sejong_performance
              source_url: https://data.seoul.go.kr/dataList/OA-2708/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 세종문화회관, 각 컨텐츠주체
              rights_checked_at: "2026-08-04"
            - source_id: kcisa_culture_info
              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조.
          # 기간 질의는 반드시 겹침(start<=:to AND end>=:from)으로 — 시작일만 걸면 진행 중
          # 장기 행사를 놓친다(제품 caveat). 시간축(event_start_date) 밖의 event_end_date
          # 범위 조건이라 basic from/to 가 아닌 filter_range 로 선언한다.
          usage_patterns:
            - pattern_id: gu_window
              question_ko: 이번 주(기간)에 이 구에서 무슨 문화행사가 하나?
              axes: 기간 겹침 필터(gu) — event_start_date ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              insight_sample_ko: 종로구에서 해당 주간 진행·개막 10건 — 뮤지컬 '스폿라이트' 등.
              sql: |
                -- :gu=종로구, :from=2026-07-01, :to=2026-09-30, :n=10
                SELECT title, category, venue_name, is_free, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE gu = :gu AND event_start_date <= :to AND event_end_date >= :from
                ORDER BY event_start_date LIMIT :n
            - pattern_id: free_in_gu
              question_ko: 이 구에서 하는 무료 행사가 있나?
              axes: 필터(gu, is_free='무료') — event_start_date ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date } }
              verified_rows: 1
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              allow_empty: true
              insight_sample_ko: 양천구 무료 1건 — 서울문화예술교육센터 상설 체험(교육/체험, ~10/8).
              # 🔑 is_free 는 불리언이 아니라 varchar('무료'/'유료'/NULL)이고 NULL 이 53%
              # (원천이 무료 여부를 안 주는 KOPIS 계열). is_free=1 로 짜면 조용히 0행이다 —
              # 이 함정이 곧 d1_catalog_columns 가 필요한 이유
              sql: |
                -- :gu=종로구, :from=2026-08-01, :n=10
                SELECT title, category, venue_name, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE gu = :gu AND is_free = '무료' AND event_end_date >= :from
                ORDER BY event_start_date LIMIT :n
            - pattern_id: category_upcoming
              question_ko: 특정 장르(국악·전시 등) 행사가 어디서 하나?
              axes: 필터(category) — event_start_date ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , from: { rel: "-30d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              insight_sample_ko: 국악 진행·예정 10건 — 삼청각 수요 상설 공연 등.
              # category 값은 이미 한글('클래식' 12,579 · '교육/체험' 6,337 …) — glossary 불필요
              sql: |
                -- :category=연극, :from=2026-08-01, :n=10
                SELECT title, gu, venue_name, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE category = :category AND event_end_date >= :from
                ORDER BY event_start_date LIMIT :n
            - pattern_id: today_in_gu
              question_ko: 오늘 당장 이 구(또는 근처)에서 하는 행사는?
              axes: 필터(gu, 오늘이 기간 안) — event_start_date DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 , today: { rel: "0d", as: date } }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              allow_empty: true
              insight_sample_ko: gu_window 의 :from=:to=오늘 특수형.
              sql: |
                -- :gu=종로구, :today=2026-08-10, :n=10
                SELECT title, category, venue_name, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE gu = :gu AND event_start_date <= :today AND event_end_date >= :today
                ORDER BY event_start_date DESC LIMIT :n
            - pattern_id: "counts_by_dim"
              question_ko: "기간에 겹치는 행사 수를 구·동·장르·공연장·유형 중 원하는 기준으로 상위(또는 하위) N을 보여줘."
              axes: "차원 랭킹 — 기간 겹침 COUNT 정렬(구/동/장르/공연장/유형 스위치, asc/desc)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 1945fe1ac2e2467aa9a8ff207b112e1f
              insight_sample_ko: "2026-08-01 이후 겹치는 행사를 구 기준으로 세면 종로구가 102건(무료 10건)으로 1위다. :dim을 venue_name·category·admin_dong·event_type로 바꾸면 같은 창에서 공연장·장르·행정동·유형별 랭킹이 되고, :dir로 최다/최소를 뒤집을 수 있다."
              sql: |
                -- :dim=gu, :from=2026-08-01, :to=2026-12-31, :dir=desc, :n=10
                SELECT CASE :dim WHEN 'admin_dong' THEN admin_dong
                                WHEN 'category' THEN category
                                WHEN 'venue_name' THEN venue_name
                                WHEN 'event_type' THEN event_type
                                ELSE gu END AS dim_value,
                       COUNT(*) AS events,
                       SUM(CASE WHEN is_free='무료' THEN 1 ELSE 0 END) AS free_events
                FROM gold_culture_event_schedule
                WHERE event_start_date <= :to AND event_end_date >= :from
                GROUP BY CASE :dim WHEN 'admin_dong' THEN admin_dong
                                   WHEN 'category' THEN category
                                   WHEN 'venue_name' THEN venue_name
                                   WHEN 'event_type' THEN event_type
                                   ELSE gu END
                ORDER BY CASE WHEN :dir='asc' THEN events END ASC,
                         CASE WHEN :dir='desc' THEN events END DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, sort]
              param_defaults: { dir: "desc", n: 10, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "free_ratio_by_gu"
              question_ko: "가격 정보가 있는 행사만 놓고 볼 때 무료 행사 비율이 높은 자치구는 어디인가?"
              axes: "구 랭킹 — 무료 비율 DESC(가격정보 보유 임계값)"
              verified_rows: 15
              verified_at: "2026-08-10"
              verified_publication_id: 1945fe1ac2e2467aa9a8ff207b112e1f
              insight_sample_ko: "2026년 시작 행사 중 유·무료 표기가 있는 건만 보면 무료 비율은 송파구 88.1%(무료 37/판정 42)로 가장 높다. is_free가 비어 있는 행사(대부분 공연)는 분모에서 제외하고, :min_known으로 표본이 얇은 구를 걸러 낸다."
              sql: |
                -- :from=2026-01-01, :to=2026-12-31, :min_known=30, :n=15
                SELECT gu,
                       SUM(CASE WHEN is_free='무료' THEN 1 ELSE 0 END) AS free_events,
                       SUM(CASE WHEN is_free IN ('무료','유료') THEN 1 ELSE 0 END) AS priced_known,
                       ROUND(100.0 * SUM(CASE WHEN is_free='무료' THEN 1 ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN is_free IN ('무료','유료') THEN 1 ELSE 0 END), 0), 1) AS free_pct
                FROM gold_culture_event_schedule
                WHERE event_start_date BETWEEN :from AND :to
                GROUP BY gu
                HAVING priced_known >= :min_known
                ORDER BY free_pct DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, having, filter_null, sort]
              param_defaults: { min_known: 30, n: 15, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "long_running_events"
              question_ko: "특정 날짜에 진행 중인 행사 중 가장 오래(장기) 운영하는 전시·공연은 무엇인가?"
              axes: "랭킹 — 특정일 진행 중 행사 run_days DESC(장르 센티널)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 1945fe1ac2e2467aa9a8ff207b112e1f
              insight_sample_ko: "2026-08-01 기준 진행 중 행사 중 최장기는 성동구 성수 소극장의 연극 '영시기 [서울 성수]'로 393일(2025-08-01~2026-08-29) 운영이다. :category를 '연극'처럼 특정 장르로 바꾸면 그 장르 안에서, 'ALL'이면 전 장르 통합으로 순위가 나온다."
              sql: |
                -- :on_date=2026-08-01, :category=ALL, :n=10
                SELECT title, category, event_type, venue_name, gu,
                       event_start_date, event_end_date,
                       CAST(julianday(event_end_date) - julianday(event_start_date) AS INT) AS run_days
                FROM gold_culture_event_schedule
                WHERE event_start_date <= :on_date AND event_end_date >= :on_date
                  AND (:category = 'ALL' OR category = :category)
                ORDER BY run_days DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { category: "ALL", n: 10 , on_date: { rel: "0d", as: date } }
            - pattern_id: "multi_gu_agenda"
              question_ko: "내가 자주 다니는 여러 자치구(예: 성동·마포·종로)에서 이 기간에 겹치는 행사를 한 번에 보여줘."
              axes: "다중 구 단면 — 기간 겹침 목록(event_start_date ASC)"
              verified_rows: 20
              verified_at: "2026-08-10"
              verified_publication_id: 1945fe1ac2e2467aa9a8ff207b112e1f
              insight_sample_ko: "성동·마포·종로 3개 구에서 2026-08-01~08-15에 겹치는 행사를 시작일 순으로 묶으면 첫 행은 성동구 성수 소극장의 연극 '영시기 [서울 성수]'(2025-08-01~2026-08-29)다. 기존 단일 구 창(gu_window)의 다중 선택 상위호환으로, :gus JSON 배열에 원하는 구를 넣는다."
              sql: |
                -- :gus=["성동구","마포구","종로구"], :from=2026-08-01, :to=2026-08-15, :n=20
                SELECT gu, title, category, venue_name, is_free, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE gu IN (SELECT value FROM json_each(:gus))
                  AND event_start_date <= :to AND event_end_date >= :from
                ORDER BY event_start_date, gu LIMIT :n
              requires: [select_columns, filter_set, filter_range, subquery, sort]
              param_defaults: { n: 20, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
            - pattern_id: "monthly_event_histogram"
              question_ko: "행사가 몇 월에 몰리나? 시작월별 행사 수(무료·장르 다양성 포함) 추이를 보여줘."
              axes: "시계열/분포 — 월별 시작 행사 수(구 센티널)"
              verified_rows: 12
              verified_at: "2026-08-10"
              verified_publication_id: 1945fe1ac2e2467aa9a8ff207b112e1f
              insight_sample_ko: "서울 전역 시작월별 행사 수는 2026-01 296건(무료 24, 장르 14종)으로 출발해 봄·여름으로 갈수록 늘어난다. :gu를 '종로구'처럼 특정 구로 좁히면 그 구만의 월별 추이가 되고, 'ALL'이면 전역 분포가 된다."
              sql: |
                -- :from=2026-01-01, :to=2026-12-31, :gu=ALL, :n=24
                SELECT substr(event_start_date, 1, 7) AS month,
                       COUNT(*) AS events,
                       SUM(CASE WHEN is_free='무료' THEN 1 ELSE 0 END) AS free_events,
                       COUNT(DISTINCT category) AS categories
                FROM gold_culture_event_schedule
                WHERE event_start_date BETWEEN :from AND :to
                  AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY month ORDER BY month LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, sort]
              param_defaults: { gu: "ALL", n: 24, from: { rel: "-30d", as: date }, to: { rel: "0d", as: date } }
          display:
            title: 서울 문화행사 통합 일정
            summary: 서울의 공연·전시·축제·체험 행사를 한곳에 모은 통합 일정표입니다.
            caveat: 6개 출처를 합치면서 같은 행사가 중복되지 않도록 정리했습니다. 분류(category) 값은 출처마다 체계가 달라 통합 분류가 아닙니다. 무료 여부(is_free)는 서울시 문화행사 출처에만 있습니다 — 나머지 다섯 출처는 비어 있어 전체의 57%가 미상입니다(2026-08-10 기준). 무료 행사만 거르면 그 미상분이 조용히 빠지므로, 무료 여부가 필요하면 event_type 이 event 인 범위에서 쓰십시오.
            use_cases:
              - 주말 나들이 추천 서비스의 행사 목록
              - 지역 문화 소식 뉴스레터
              - 행사 밀집 지역 분석
    columns:
      - name: event_ref
        description: 행사 고유 키. 출처 접두어가 붙는다(예 performance:12345)
        data_type: varchar
        tests: [not_null, unique]
      - name: event_type
        description: 행사 출처 유형 — 목록에서 아이콘·필터로 쓰기 좋은 축
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [event, performance, exhibition, festival, sejong, kcisa]}
      - name: title
        description: 행사명(원문)
        data_type: varchar
        tests: [not_null]
      - name: category
        description: 소스별 분류/장르 원문(값 체계는 event_type 마다 다름 — 통합 분류 아님)
        data_type: varchar
      - name: venue_name
        description: 개최 장소 이름
        data_type: varchar
      - name: is_free
        description: 유·무료 원문 값(varchar — 소스별 표기가 달라 원문 보존, 예 "무료"/"유료"/요금 문구). 서울시 문화행사(event_type='event') 출처에만 있다 — sejong·performance·exhibition·kcisa·festival 은 원천에 유무료 항목이 없어 전량 비어 있고, 그래서 전체의 57%가 미상이다(2026-08-10 기준). 비어 있음은 "유료"가 아니라 "모름"이다
        data_type: varchar
      - name: event_start_date
        description: 행사 시작일(KST)
        data_type: date
        tests: [not_null]
      - name: event_end_date
        description: 행사 종료일(KST) — 기간 겹침 질의의 우측 경계
        data_type: date
        tests: [not_null]
      - name: event_at
        description: 행사 시작 시각(KST) — 기간 조회의 표준 필터 컬럼
        data_type: timestamp(6)
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름. quality_status 가 dong_precise 일 때만 신뢰할 수 있다
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리
        data_type: varchar
      - name: latitude
        description: 위도(WGS84) — 좌표 없는 소스는 null
        data_type: double
      - name: longitude
        description: 경도(WGS84)
        data_type: double
      - name: quality_status
        description: 위치 정밀도 — dong_precise(행정동까지 확정) / gu_only(자치구까지) / unmatched(미확정)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}
      - name: source_collected_at
        description: 이 행사 정보를 원천에서 수집한 시각(KST)
        data_type: timestamp(6)

  - name: gold_culture_location_daily
    description: 자치구(gu_code) × 일자 문화활동 집계(기간 겹침 전개). activity_by_dong 의 구 단위 판 + 정밀도 지표.
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 타입은 describe 실측(2026-07-14)
      meta:
        refresh: '1일'   # culture_transform — culture_bronze(03:00 KST) 자산 트리거
    columns:
      - name: gu_code
        description: 자치구 코드(#48 공간축)
        data_type: varchar
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: event_date
        description: 활동 일자(KST) — 행사 기간을 일 단위로 전개한 그레인 축
        data_type: date
        tests: [not_null]
      - name: activities_count
        description: 그날 그 구의 전체 문화활동 수 — 활동 ID 기준 중복을 제거한 값이며 총계는 언제나 이 열을 쓴다. 유형별 열의 합과 다르다(#406 실측 — 정본 620,342 · 유형 합 621,477). KOPIS 가 같은 공연을 공연목록·축제목록에 함께 실어 kopis_festivals_count 가 performances_count 와 겹치기 때문이다
        data_type: bigint
      - name: performances_count
        description: KOPIS 공연 수
        data_type: bigint
      - name: events_count
        description: 서울시 문화행사 수
        data_type: bigint
      - name: kopis_festivals_count
        description: KOPIS 공연 중 축제로 분류된 수 — performances_count 와 같은 공연을 세므로(KOPIS 가 mt20id 를 공연목록·축제목록에 함께 싣는다) 유형별 합에 더하면 이중계상된다. 서울시가 여는 축제가 필요하면 gold_culture_activity_by_dong 의 festival_events_count 를 볼 것
        data_type: bigint
      - name: exhibitions_count
        description: SeMA 전시 수
        data_type: bigint
      - name: sejong_count
        description: 세종문화회관 공연 수
        data_type: bigint
      - name: dong_precise_count
        description: "좌표로 행정동까지 정밀한 활동 수(#111 quality_status='dong_precise')"
        data_type: bigint
        tests: [not_null]

  - name: gold_culture_movie_boxoffice_daily
    description: 일별 서울/전국 영화 관객 비중(서울 쏠림). 그레인 boxoffice_date. 시도 그레인이라 자치구 gold 미편입.
    config:
      contract:
        enforced: true   # published gold 계약(#180) — 스파이크 검증 모델
      meta:
