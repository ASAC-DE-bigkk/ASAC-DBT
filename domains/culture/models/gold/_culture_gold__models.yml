              requires: [select_columns, filter_range, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              insight_sample_ko: 국악 진행·예정 10건 — 삼청각 수요 상설 공연 등.
              # category 값은 이미 한글('클래식' 12,579 · '교육/체험' 6,337 …) — glossary 불필요
              sql: |
                -- :category, :from, :n=10
                SELECT title, gu, venue_name, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE category = :category AND event_end_date >= :from
                ORDER BY event_start_date LIMIT :n
            - pattern_id: today_in_gu
              question_ko: 오늘 당장 이 구(또는 근처)에서 하는 행사는?
              axes: 필터(gu, 오늘이 기간 안) — event_start_date DESC
              requires: [select_columns, filter_range, sort]
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: fd823392eac44937946e5481921223e2
              allow_empty: true
              insight_sample_ko: gu_window 의 :from=:to=오늘 특수형.
              sql: |
                -- :gu, :today, :n=10
                SELECT title, category, venue_name, event_start_date, event_end_date
                FROM gold_culture_event_schedule
                WHERE gu = :gu AND event_start_date <= :today AND event_end_date >= :today
                ORDER BY event_start_date DESC LIMIT :n
          display:
            title: 서울 문화행사 통합 일정
            summary: 서울에서 열리는 공연·전시·축제·체험 행사를 한 행에 하나씩 모은 통합 일정표입니다. 시작일과 종료일, 장소 이름과 좌표, 자치구·행정동, 유·무료 표기가 함께 들어 있어 "이번 주말 성동구 행사" 같은 조회를 이 데이터셋 하나로 끝낼 수 있습니다.
            caveat: 6개 출처를 합치면서 같은 행사가 중복되지 않도록 정리했습니다. 분류(category) 값은 출처마다 체계가 달라 통합 분류가 아닙니다.
            use_cases:
              - 주말 나들이 추천 서비스의 행사 목록
              - 지역 문화 소식 뉴스레터
              - 행사 밀집 지역 분석
    columns:
      - name: event_ref
        description: 행사 고유 키. 출처 접두어가 붙는다(예 performance:12345)
        data_type: varchar
        tests: [not_null, unique]
      - name: event_type
        description: 행사 출처 유형 — 목록에서 아이콘·필터로 쓰기 좋은 축
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [event, performance, exhibition, festival, sejong, kcisa]}
      - name: title
        description: 행사명(원문)
        data_type: varchar
        tests: [not_null]
      - name: category
        description: 소스별 분류/장르 원문(값 체계는 event_type 마다 다름 — 통합 분류 아님)
        data_type: varchar
      - name: venue_name
        description: 개최 장소 이름
        data_type: varchar
      - name: is_free
        description: 유·무료 원문 값(varchar — 소스별 표기가 달라 원문 보존, 예 "무료"/"유료"/요금 문구)
        data_type: varchar
      - name: event_start_date
        description: 행사 시작일(KST)
        data_type: date
        tests: [not_null]
      - name: event_end_date
        description: 행사 종료일(KST) — 기간 겹침 질의의 우측 경계
        data_type: date
        tests: [not_null]
      - name: event_at
        description: 행사 시작 시각(KST) — 기간 조회의 표준 필터 컬럼
        data_type: timestamp(6)
        tests: [not_null]
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
      - name: admin_dong
        description: 행정동 이름. quality_status 가 dong_precise 일 때만 신뢰할 수 있다
        data_type: varchar
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리
        data_type: varchar
      - name: latitude
        description: 위도(WGS84) — 좌표 없는 소스는 null
        data_type: double
      - name: longitude
        description: 경도(WGS84)
        data_type: double
      - name: quality_status
        description: 위치 정밀도 — dong_precise(행정동까지 확정) / gu_only(자치구까지) / unmatched(미확정)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [dong_precise, gu_only, unmatched]}

