              source_url: https://data.seoul.go.kr/dataList/OA-16085/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: commerce_localdata_rest_restaurant
              source_url: https://data.seoul.go.kr/dataList/OA-16095/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: commerce_localdata_singing_bar
              source_url: https://data.seoul.go.kr/dataList/OA-16089/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: commerce_localdata_tour_entertainment_bar
              source_url: https://data.seoul.go.kr/dataList/OA-16092/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: commerce_localdata_tour_restaurant
              source_url: https://data.seoul.go.kr/dataList/OA-16091/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
          # usage_patterns — 규격·검증 근거는 gold_culture_activity_by_dong 블록 주석 참조.
          # qa_eval 의 '개별 점포 추천' 4문항은 이 제품이 답하지 않는다(원천 부재 = 제품 경계) —
          # 이 1건은 qa_eval 무대응이라 product_question 에서 파생했다
          usage_patterns:
            - pattern_id: hotspots
              question_ko: 행사 많은 동네 주변 외식 상권은 어디인가?
              axes: 동 랭킹 — dine_around_score DESC
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-07-31"
              verified_publication_id: 8a03a1e6d2ec48eeb02cf5bf2b5e5c35
              insight_sample_ko: 종로1·2·3·4가동 — 90일 내 행사 240건·요식업 3,529곳.
              # has_dining_data=1 필터 필수 — 요식업 데이터 없는 동은 score 가 NULL(제품 caveat)
              sql: |
                -- :n=10
                SELECT admin_dong, gu, events_upcoming_90d, dining_active_cnt, dine_around_score
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1
                ORDER BY dine_around_score DESC LIMIT :n
            # 위는 서울 전역 상위권이라 특정 구를 정해 놓고 묻는 질의가 안 된다(구를 정하면
            # 상위 10에 그 구가 없을 수 있다). 그리고 score 는 두 축의 합이라 '행사는 많은데
            # 외식이 약한 곳'을 못 찾는다 — 백분위 둘을 따로 걸어야 그 갭이 드러난다.
            - pattern_id: gu_dine_summary
              question_ko: 이 구에서 행사 보고 밥 먹기 좋은 동네는?
              axes: 필터(gu) + 동 랭킹 — dine_around_score DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-08-05"
              verified_publication_id: be6602f2b7fb4156a729e70715b55534
              insight_sample_ko: 강남구 1위 역삼1동 — 요식업 4,566곳·score 0.955.
              sql: |
                -- :gu=마포구, :n=10
                SELECT admin_dong, events_upcoming_90d, dining_active_cnt,
                       dining_opened_365d, dine_around_score
                FROM gold_culture_dine_around
                WHERE gu = :gu AND has_dining_data = 1
                ORDER BY dine_around_score DESC LIMIT :n
            - pattern_id: culture_rich_dining_poor
              question_ko: 행사는 많은데 주변 식당이 부족한 동네는?
              axes: 갭 탐지 — culture_events_pctl 상위 ∩ dining_stock_pctl 하위
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 }
              verified_rows: 10
              verified_at: "2026-08-05"
              verified_publication_id: be6602f2b7fb4156a729e70715b55534
              allow_empty: true   # 두 백분위 문턱을 동시에 만족하는 동이 없을 수 있다
              insight_sample_ko: 하계1동(노원구) 90일 행사 572건인데 요식업 396곳.
              sql: |
                -- :culture_min=0.7, :dining_max=0.3, :n=10
                SELECT admin_dong, gu, events_upcoming_90d, dining_active_cnt,
                       culture_events_pctl, dining_stock_pctl
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1
                  AND culture_events_pctl >= :culture_min
                  AND dining_stock_pctl <= :dining_max
                ORDER BY culture_events_pctl DESC LIMIT :n
            - pattern_id: "gu_dine_ranking"
              question_ko: "행사 관람 후 외식하기에 자치구 전체로 보면 어디가 가장 좋은가?"
              axes: "구 랭킹(집계) — has_dining 동 묶어 AVG(dine_around_score) DESC, 동수 임계"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "행정동 5개 이상 자치구 중 중구가 평균 dine-around 점수 0.535로 1위(동 10개·예정행사 1,837건·활성식당 10,184곳). 동 3개뿐인 소형 구를 임계값으로 걸러 대표성을 확보한 순위."
              sql: |
                -- :min_dongs=5, :n=10
                SELECT gu, COUNT(*) AS dongs, SUM(events_upcoming_90d) AS events,
                       SUM(dining_active_cnt) AS dining, ROUND(AVG(dine_around_score),3) AS avg_score
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1
                GROUP BY gu HAVING COUNT(*) >= :min_dongs
                ORDER BY avg_score DESC LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort]
              param_defaults: { min_dongs: 5, n: 10 }
            - pattern_id: "dining_rich_culture_poor"
              question_ko: "식당은 넘치는데 예정 문화행사가 거의 없어 유동 인구 유인이 아쉬운 동네는?"
              axes: "갭 탐지(역방향) — dining_stock_pctl 상위 ∩ culture_events_pctl 하위"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "보라매동(관악구)은 식당 3,451곳(외식 재고 상위 98.6%)이지만 예정 문화행사 백분위가 0으로, 외식 인프라 대비 행사 유인이 사실상 없다. 기존 culture_rich_dining_poor(행사 많고 식당 부족)의 정반대 축."
              sql: |
                -- :dining_min=0.7, :culture_max=0.3, :n=10
                SELECT admin_dong, gu, dining_active_cnt, dining_opened_365d,
                       dining_stock_pctl, culture_events_pctl
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1
                  AND dining_stock_pctl >= :dining_min
                  AND culture_events_pctl <= :culture_max
                ORDER BY dining_stock_pctl DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 }
            - pattern_id: "emerging_dining_dongs"
              question_ko: "예정 행사가 많은 동네 중 최근 1년 새 식당이 가장 활발히 생기는(뜨는) 상권은?"
              axes: "동 랭킹 — 행사 임계 하 dining_opened_365d DESC (신선도)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "예정행사 20건 이상 동네 중 목1동(양천구)이 최근 1년 신규 개업 814곳으로 가장 활발(활성 2,004곳·예정행사 49건). 재고(dining_active_cnt)가 아닌 개업 신선도로 본 성장 상권."
              sql: |
                -- :min_events=20, :n=10
                SELECT admin_dong, gu, events_upcoming_90d, dining_active_cnt, dining_opened_365d
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1 AND events_upcoming_90d >= :min_events
                ORDER BY dining_opened_365d DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_events: 20, n: 10 }
            - pattern_id: "dining_turnover_ratio"
              question_ko: "외식 상권 회전(신규개업/현재영업 비율)이 가장 빠른 동네는?"
              axes: "동 랭킹 — 비율 dining_opened_365d/dining_active_cnt DESC (분모 임계로 안정화)"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "활성 식당 200곳 이상 동네 중 압구정동(강남구)의 신규개업/활성 비율이 1.43으로 최고(활성 411·최근1년 개업 589) — 개·폐업 회전이 매우 빠른 상권. 절대량이 아닌 비율 축이라 규모가 다른 동네를 공평 비교."
              sql: |
                -- :min_active=200, :n=10
                SELECT admin_dong, gu, dining_active_cnt, dining_opened_365d,
                       ROUND(dining_opened_365d * 1.0 / dining_active_cnt, 3) AS new_ratio
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1 AND dining_active_cnt >= :min_active
                ORDER BY new_ratio DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_active: 200, n: 10 }
            - pattern_id: "flexible_dong_ranking"
              question_ko: "동네를 원하는 지표(예정행사·공연·식당수·신규개업·종합점수)로 상위/하위 정렬해 보고 싶다."
              axes: "동 랭킹(스위치) — 지표·정렬방향 가변, NULL 제외"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "지표=신규개업·내림차순이면 목1동(양천구)이 최근 1년 814곳으로 1위; 지표=종합점수면 종로1·2·3·4가동(종로구)이 0.98로 최상. 고정 hotspots(점수 DESC)를 지표·방향 스위치로 일반화한 상위호환."
              sql: |
                -- :metric=opened, :dir=desc, :n=10
                SELECT admin_dong, gu,
                       (CASE :metric WHEN 'events' THEN events_upcoming_90d
                                     WHEN 'performances' THEN performances_upcoming_90d
                                     WHEN 'dining' THEN dining_active_cnt
                                     WHEN 'opened' THEN dining_opened_365d
                                     ELSE dine_around_score END) AS m
                FROM gold_culture_dine_around
                WHERE (CASE :metric WHEN 'events' THEN events_upcoming_90d
                                    WHEN 'performances' THEN performances_upcoming_90d
                                    WHEN 'dining' THEN dining_active_cnt
                                    WHEN 'opened' THEN dining_opened_365d
                                    ELSE dine_around_score END) IS NOT NULL
                ORDER BY CASE WHEN :dir='asc' THEN m END ASC,
                         CASE WHEN :dir='desc' THEN m END DESC LIMIT :n
              requires: [select_columns, filter_null, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gu_multi_compare"
              question_ko: "관심 자치구 몇 곳(예: 마포·성동·용산)만 놓고 외식 나들이 좋은 동네를 한 번에 비교하려면?"
              axes: "다중 구 교차 비교 — dine_around_score DESC"
              verified_rows: 10
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "마포·성동·용산 중 서교동(마포구)이 dine-around 0.956으로 최상(예정행사 248건·활성식당 2,992곳). 단일 구만 보는 gu_dine_summary와 달리 임의 구 집합을 한 번에 순위화."
              sql: |
                -- :gus=["마포구","성동구","용산구"], :n=10
                SELECT admin_dong, gu, events_upcoming_90d, dining_active_cnt, dine_around_score
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1
                  AND gu IN (SELECT value FROM json_each(:gus))
                ORDER BY dine_around_score DESC LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 10 }
            - pattern_id: "score_distribution"
              question_ko: "동네들의 dine-around 종합점수는 어떻게 분포하나 — 최상위 밴드에 몇 개 동이 있나?"
              axes: "분포 — dine_around_score 밴드별 동 수·평균 예정행사 (구 센티널)"
              verified_rows: 5
              verified_at: "2026-08-10"
              verified_publication_id: 08ba804e525240cca665f130beca2c2e
              insight_sample_ko: "외식 데이터 있는 219개 동 중 dine-around 0.8 이상 최상위 밴드에 28개 동이 속하며 이들의 평균 예정행사는 235.2건. 구 센티널로 특정 구(예: 강남구) 내부 분포로 좁혀 볼 수도 있음."
              sql: |
                -- :gu=ALL, :n=10
                SELECT CASE WHEN dine_around_score >= 0.8 THEN '1_0.8-1.0'
                            WHEN dine_around_score >= 0.6 THEN '2_0.6-0.8'
                            WHEN dine_around_score >= 0.4 THEN '3_0.4-0.6'
                            WHEN dine_around_score >= 0.2 THEN '4_0.2-0.4'
                            ELSE '5_0.0-0.2' END AS score_band,
                       COUNT(*) AS dongs, ROUND(AVG(events_upcoming_90d),1) AS avg_events
                FROM gold_culture_dine_around
                WHERE has_dining_data = 1 AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY score_band ORDER BY score_band LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { gu: "ALL", n: 10 }
          display:
            title: 문화·미식 동반 추천 지수
            summary: 문화행사가 많은 동네와 음식점이 많은 동네를 함께 점수로 보여줍니다.
            caveat: 음식점 데이터가 연결된 동은 426곳 중 219곳입니다. 나머지 동은 문화 지표만 채워지고 점수는 비어 있습니다(has_dining_data 로 구분).
            use_cases:
              - 데이트·나들이 코스 추천
              - 상권 입지 검토
              - 지역 관광 코스 설계
    columns:
      - name: admin_dong_code
        description: 행정동 코드 — 행정안전부 표준 10자리. 이 표의 기본 키
        data_type: varchar
        tests: [not_null, unique]
      - name: admin_dong
        description: 행정동 이름
        data_type: varchar
        tests: [not_null]
      - name: gu_code
        description: 자치구 코드
        data_type: varchar
      - name: gu
        description: 자치구 이름
        data_type: varchar
      - name: events_upcoming_90d
        description: 앞으로 90일간 예정된 문화행사·활동 총량
        data_type: integer
        tests: [not_null]
      - name: performances_upcoming_90d
        description: 앞으로 90일간 예정된 공연 수
        data_type: integer
        tests: [not_null]
      - name: dining_active_cnt
        description: 영업 중인 음식점 수(식품 인허가 기준). 음식점 데이터가 연결되지 않은 동은 비어 있다
        data_type: integer
      - name: dining_opened_365d
        description: 최근 365일간 새로 문을 연 음식점 수 — 상권 활력 지표
        data_type: integer
      - name: has_dining_data
        description: 음식점 데이터가 연결된 동인지 여부. false 면 음식점 관련 값과 점수가 모두 비어 있다
        data_type: boolean
        tests: [not_null]
      - name: culture_events_pctl
        description: 426개 동 중 문화행사량 백분위(0~1, 클수록 상위)
        data_type: double
        tests: [not_null]
      - name: dining_stock_pctl
        description: 음식점 데이터가 있는 219개 동 중 음식점 수 백분위(0~1)
        data_type: double
      - name: dine_around_score
        description: 문화 백분위와 음식점 백분위의 기하평균(0~1). 둘 다 높아야 점수가 높다
        data_type: double
