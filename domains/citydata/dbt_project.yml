name: seoul_ppltn
version: "1.0.0"
config-version: 2

profile: seoul_ppltn

flags:
  require_certificate_validation: true

vars:
  # 행안부 행정동 마스터(#154) bronze 를 공유 common 스키마에서 읽는다 (asac_axes dim_admin_dong 소스).
  axes_bronze_schema: common

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  seoul_ppltn:
    +materialized: table
    # gold 전체 재빌드 시 원자적 교체(CREATE OR REPLACE) — R2 delete+insert 중복 방지, drop 갭 없음
    +on_table_exists: replace
  # 티어 태그는 레이어별 모델 yml(silver/_citydata_silver__models.yml·gold/_citydata_gold__models.yml)
  # 의 각 모델 `config: tags:` 에 있다(SQL=로직 / yml=메타 분리).
  # cosmos DAG 가 `tag:fast`/`tag:slow` 로 선택 → 하드코딩 리스트 제거. 아래는 우리 소유가
  # 아닌 패키지 모델이라 여기서 태깅(fast: 매 run 뷰 갱신으로 seed race 자가치유).
  asac_axes:
    dim_admin_dong:
      +tags: ['fast']

seeds:
  seoul_ppltn:
    seoul_hotspot_area_geo:
      +column_types:
        area_cd: varchar
        category: varchar
        area_nm: varchar
        center_lon: double
        center_lat: double
        lon_min: double
        lat_min: double
        lon_max: double
        lat_max: double
        polygon_wkt: varchar
