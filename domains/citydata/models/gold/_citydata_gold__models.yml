            summary: 행정동·시간별 승하차 강도와 교통 돌발 상황을 함께 봅니다. 어디가 언제 막히는지 봅니다.
            caveat: transit 도메인과 축이 겹칠 수 있어 소유 조율 대상입니다.
            use_cases:
              - 교통 혼잡 시간 회피
              - 돌발 영향 분석
              - 이동 계획
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      동네 교통량 × 돌발 — 행정동·시간별 승하차 강도와 교통 돌발 상황을 함께 봅니다. 어디가 언제 막히는지 봅니다.
    columns:
      - name: time_bucket
        data_type: timestamp(6)
        description: 시간 버킷 (KST)
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리·조인 키
        tests: [not_null]
