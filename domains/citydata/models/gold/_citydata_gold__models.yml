  - name: gold_citydata_cmrcl_daily
    config:
      tags: ['slow']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_cmrcl_daily
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 하루 결제·상권 활력이 어느 정도입니까?
          grain: (event_date, area_cd) 마다 한 행 — 장소·일 상권 집계.
          primary_key: [event_date, area_cd]
          publication_mode: append
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          event_time: event_date
          freshness_slo_minutes: 1560
          usage_patterns:
            - pattern_id: top_commerce_places_on_date
              question_ko: 특정 날 결제가 가장 많았던 장소는?
              axes: 장소 랭킹 — payment_count_total DESC (날짜 고정)
              requires: [select_columns, sort]
              sql: |
                -- :date=2026-07-30, :n=10
                SELECT area_nm, gu, payment_count_total, peak_cmrcl_lvl
                FROM gold_citydata_cmrcl_daily
                WHERE event_date = :date
                ORDER BY payment_count_total DESC LIMIT :n
            - pattern_id: place_commerce_trend
              question_ko: 특정 장소의 최근 결제 추이는?
              axes: 시계열 — 장소 고정, event_date 축
              requires: [select_columns, filter_set, filter_range, sort]
              sql: |
                -- :area_cd=POI014, :from=2026-07-01, :to=2026-07-31
                SELECT event_date, payment_count_total, busy_ratio_percent, peak_cmrcl_lvl
                FROM gold_citydata_cmrcl_daily
                WHERE area_cd = :area_cd AND event_date BETWEEN :from AND :to
                ORDER BY event_date
            - pattern_id: busy_places_in_gu
              question_ko: 특정 자치구에서 상권이 가장 바빴던 장소는?
              axes: 장소 랭킹 — busy_ratio_percent DESC (자치구·날짜 고정)
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :gu=강남구, :date=2026-07-30, :n=10
                SELECT area_nm, busy_ratio_percent, payment_count_total, peak_cmrcl_lvl
                FROM gold_citydata_cmrcl_daily
                WHERE gu = :gu AND event_date = :date
                ORDER BY busy_ratio_percent DESC LIMIT :n
          display:
            title: 장소별 일 소비(상권)
            summary: 장소마다 하루 결제 건수와 상권 활력을 집계했습니다. 붐빔 대비 얼마나 소비가 일어나는지 봅니다.
            caveat: 신한카드 결제 집계라 현금·타카드는 제외이며, 개별 점포가 아닌 장소 단위입니다.
            use_cases:
              - 상권 활력 추세
              - 붐빔 대비 소비 분석
              - 입지 리포트
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      장소별 일 소비(상권) — 장소마다 하루 결제 건수와 상권 활력을 집계했습니다. 붐빔 대비 얼마나 소비가 일어나는지 봅니다.
