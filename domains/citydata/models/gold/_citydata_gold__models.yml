              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
          product_question: 이 동네는 언제 교통이 막히고 돌발이 잦습니까?
          grain: (time_bucket, admin_dong_code) 마다 한 행 — 동·시간 교통×돌발.
          primary_key: [time_bucket, admin_dong_code]
