      - name: acc_types
        data_type: varchar
        description: 활성 돌발의 유형 목록 (사고·공사 등)

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time_bucket, admin_dong_code]
