version: 2

# citydata gold 문서·태그·테스트 (레이어 분리).
# silver 는 silver/_citydata_silver__models.yml · sources 는 models/sources.yml.

models:
  - name: gold_citydata_ppltn_daily
    config:
      tags: ['slow']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_ppltn_daily
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 하루 평균·최대 얼마나 붐볐습니까?
          grain: (event_date, area_code) 마다 한 행 — 장소·일 인구 집계.
          primary_key: [event_date, area_code]
          publication_mode: append
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          event_time: event_date
          freshness_slo_minutes: 1560
          usage_patterns:
            - pattern_id: busiest_days_for_place
              question_ko: 이 장소는 어떤 날 가장 붐볐나?
              axes: 날짜 랭킹 — average_population DESC (장소 고정)
              requires: [select_columns, sort]
              sql: |
                -- :area=성수동, :n=7
                SELECT event_date, average_population, max_population
                FROM gold_citydata_ppltn_daily
                WHERE area_name = :area
                ORDER BY average_population DESC LIMIT :n
            - pattern_id: busiest_places_on_date
              question_ko: 특정 날 가장 붐빈 장소는?
              axes: 장소 랭킹 — max_population DESC (날짜 고정)
              requires: [select_columns, sort]
              sql: |
                -- :date=2026-07-30, :n=10
                SELECT area_name, gu, max_population, busy_ratio_percent
                FROM gold_citydata_ppltn_daily
                WHERE event_date = :date
                ORDER BY max_population DESC LIMIT :n
            - pattern_id: place_daily_trend
              question_ko: 이 장소의 최근 일별 붐빔 추이는?
              axes: 시계열 — 장소 고정, event_date 축
              requires: [select_columns, filter_set, filter_range, sort]
              sql: |
                -- :area=성수동, :from=2026-07-01, :to=2026-07-31
                SELECT event_date, average_population, max_population, busy_ratio_percent
                FROM gold_citydata_ppltn_daily
                WHERE area_name = :area AND event_date BETWEEN :from AND :to
                ORDER BY event_date
          display:
            title: 장소별 일 혼잡 요약
            summary: 장소마다 하루 동안의 평균·최대·최소 인구와 혼잡을 요약했습니다. 날짜 단위로 방문 추세를 볼 때 씁니다.
            caveat: 하루 집계라 순간 피크는 max_population으로만 보입니다.
            use_cases:
              - 일별 방문 추세
              - 요일·계절 비교
              - 리포트 KPI
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      장소별 일 혼잡 요약 — 장소마다 하루 동안의 평균·최대·최소 인구와 혼잡을 요약했습니다. 날짜 단위로 방문 추세를 볼 때 씁니다.
    columns:
      - name: event_date
        data_type: date
        description: 집계 날짜 (event_at의 KST 날짜)
        tests: [not_null]
      - name: area_code
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_name
        data_type: varchar
        description: 장소명
      - name: area_type
        data_type: varchar
        description: 장소 분류
      - name: sido
        data_type: varchar
        description: 시도명 (서울)
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        data_type: double
        description: 일 평균 추정 인구
      - name: max_population
        data_type: integer
        description: 일 최대 추정 인구
      - name: min_population
        data_type: integer
        description: 일 최소 추정 인구
      - name: peak_at
        data_type: timestamp(6)
        description: 가장 혼잡했던 시각 (KST timestamp)
      - name: peak_congestion_level
        data_type: varchar
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        data_type: decimal(38,16)
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        data_type: bigint
        description: 그날 수집 슬라이스 수 (완결성 지표)

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_date, area_code]
  - name: gold_citydata_ppltn_hourly
    config:
      tags: ['hourly']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_ppltn_hourly
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 몇 시에 붐비고 몇 시에 한산합니까?
          grain: (time_bucket, area_cd) 마다 한 행 — 장소·시간 인구 집계.
          primary_key: [time_bucket, area_cd]
          publication_mode: append
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 15 * * * *
          event_time: time_bucket
          freshness_slo_minutes: 150
          shape: rollup
          usage_patterns:
            - pattern_id: peak_hours_for_place
              question_ko: 이 장소는 몇 시에 가장 붐비나?
              axes: 시간대 랭킹 — average_population DESC (장소 고정)
              requires: [select_columns, sort]
              sql: |
                -- :area=강남역, :n=5
                SELECT time_bucket, average_population, peak_congestion_level
                FROM gold_citydata_ppltn_hourly
                WHERE area_nm = :area
                ORDER BY average_population DESC LIMIT :n
            - pattern_id: busiest_places_at_time
              question_ko: 특정 시각에 가장 붐비는 장소는?
              axes: 장소 랭킹 — average_population DESC (시각 고정)
              requires: [select_columns, sort]
              sql: |
                -- :ts=2026-07-30 18:00:00, :n=10
                SELECT area_nm, gu, average_population, busy_ratio_percent
                FROM gold_citydata_ppltn_hourly
                WHERE time_bucket = :ts
                ORDER BY average_population DESC LIMIT :n
            - pattern_id: place_hourly_trend
              question_ko: 이 장소의 최근 시간별 붐빔 추이는?
              axes: 시계열 — 장소 고정, time_bucket 축
              requires: [select_columns, filter_set, filter_range, sort]
              sql: |
                -- :area_cd=POI014, :from=2026-07-30 00:00:00, :to=2026-07-30 23:00:00
                SELECT time_bucket, average_population, peak_congestion_level
                FROM gold_citydata_ppltn_hourly
                WHERE area_cd = :area_cd AND time_bucket BETWEEN :from AND :to
                ORDER BY time_bucket
          display:
            title: 장소별 시간대 혼잡
            summary: 장소마다 시간 단위로 인구·혼잡을 집계했습니다. 몇 시가 붐비고 한산한지 시간대별로 볼 수 있습니다.
            caveat: 시간 단위 집계라 그 안의 분 단위 변동은 5분 시계열을 보세요.
            use_cases:
              - 시간대별 방문 계획
              - 피크타임 분석
              - 운영 인력 배치
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      장소별 시간대 혼잡 — 장소마다 시간 단위로 인구·혼잡을 집계했습니다. 몇 시가 붐비고 한산한지 시간대별로 볼 수 있습니다.
    columns:
      - name: time_bucket
        data_type: timestamp(6)
        description: 시간 버킷 (KST)
        tests: [not_null]
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: area_category
        data_type: varchar
        description: 장소 분류
      - name: sido
        data_type: varchar
        description: 시도명 (서울)
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        data_type: double
        description: 시간 평균 추정 인구
      - name: max_population
        data_type: integer
        description: 시간 최대 추정 인구
      - name: min_population
        data_type: integer
        description: 시간 최소 추정 인구
      - name: peak_at
        data_type: timestamp(6)
        description: 그 시간 가장 혼잡했던 5분 시각 (KST timestamp)
      - name: peak_congestion_level
        data_type: varchar
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        data_type: decimal(38,16)
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        data_type: bigint
        description: 그 시간 수집 슬라이스 수 (완결성 지표, 최대 12)

