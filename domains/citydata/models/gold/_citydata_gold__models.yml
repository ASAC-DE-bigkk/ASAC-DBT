        description: 만차 버스 비율 (transit_dong)
      - name: subway_arrival_cnt
        description: 지하철 도착 횟수 (transit_dong)
      - name: subway_wait_avg_s
        description: 지하철 평균 대기 시간(초, transit_dong)
      - name: parking_lot_cnt
        description: 주차장 수 (transit_dong)
      - name: parking_occupancy_avg
        description: 주차 점유율 평균 (0~1, 높을수록 만차)
      - name: parking_full_lot_cnt
        description: 만차 주차장 수 (transit_dong)

  - name: gold_citydata_ppltn_demographics
    config:
      tags: ['slow']
      meta: {serving_tier: d1_direct}  # 대형 — 실측 200,860행(2026-07-17), D1 여유 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, dow, hour, segment_type, segment]
    description: >
      gold_citydata_ppltn_demographics — 장소×요일×시간대 인구 성별·나이대 세그먼트 패턴.
      silver_ppltn 의 wide 비율을 long 으로 언피벗해 요일×시간대 평균 집계
      (avg_rate_pct·avg_est_headcount). 해결 질문: "토요일 14시 20대가 많은 지역은",
      "이 장소 주중 저녁의 주 연령대는" — segment 필터 + avg_est_headcount 정렬.
      grain (area_cd, dow, hour, segment_type, segment) · 갱신 slow · 적재 table+replace(통째 재빌드).
      ⚠ 성별×나이대 교차는 원본에 없어 미포함 — age headcount × gender rate 근사(독립가정) ·
      avg_est_headcount 는 인구범위 중간값 기반 추정치.
    columns:
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
      - name: area_nm
        description: 장소명 (예 홍대 관광특구)
      - name: area_category
        description: 장소 분류 (관광특구/발달상권/공원 등)
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: dow
        description: 요일 (Trino day_of_week — 1=월 … 6=토 … 7=일, grain 축)
      - name: hour
        description: 시각 (0~23, KST event_at 기준, grain 축)
      - name: segment_type
        description: 세그먼트 차원 — gender | age (grain 축)
      - name: segment
        description: 세그먼트 값 — gender=male/female, age=0/10/…/70(대) (grain 축)
      - name: avg_rate_pct
        description: 그 (요일,시간) 버킷 세그먼트 비율(%) 평균
      - name: avg_est_headcount
        description: 추정 인원수 평균 = avg(인구 중간값 × 비율/100). "많은" 랭킹 키. ⚠ 인구범위 중간값 기반 추정치(교차분포 아님)
      - name: avg_ppltn
        description: 인구 중간값(min·max 평균) 평균 — 세그먼트 무관 참고
      - name: avg_congest_score
        description: 혼잡도 평균 (1 여유·2 보통·3 약간붐빔·4 붐빔)
      - name: sample_count
        description: 집계된 5분 실측 스냅샷 수 (신뢰도 지표)

  - name: gold_citydata_charger_availability
    config:
      tags: ['fast']
      meta: {serving_tier: d1_direct}  # 스냅샷·수백 행 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, stat_id]
    description: >
      gold_citydata_charger_availability — 장소×충전소 현재 EV 충전 가용 현황 스냅샷.
      silver_charger 에서 충전기별 최신 상태만 골라 충전소 단위 집계(가용/전체 대수).
      해결 질문: "지금 강남 근처 충전 가능한 곳은" — available_count>0 필터.
      grain (area_cd, stat_id) · 갱신 fast · 적재 table+replace(통째 재빌드).
      ⚠ 최신 스냅샷만(이력 없음).
    columns:
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
      - name: area_nm
        description: 장소명
      - name: area_category
        description: 장소 분류 (관광특구/발달상권 등)
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: stat_id
        description: 충전소 ID (grain 축)
      - name: stat_nm
        description: 충전소명
      - name: stat_addr
        description: 충전소 주소
      - name: stat_longitude
        description: 충전소 경도
      - name: stat_latitude
        description: 충전소 위도
      - name: place_kind
        description: 충전소 장소 구분 (마트(쇼핑몰) 등)
      - name: total_chargers
        description: 충전소 내 총 충전기 수
      - name: available_count
        description: 사용가능 충전기 수 (★ "지금 충전 가능" 판단)
      - name: charging_count
        description: 충전중 충전기 수
      - name: unavailable_count
        description: 이용 불가 충전기 수 (점검/통신이상/운영중지/상태미확인)
      - name: fast_available
        description: 급속(DC) 사용가능 충전기 수
      - name: slow_available
        description: 완속(AC) 사용가능 충전기 수
      - name: availability_pct
        description: 가용률 (available/total × 100, %)
      - name: max_output_kw
        description: 충전소 최대 충전 출력 (kW)
      - name: observed_at
        description: 최신 상태 갱신 시각 (KST, 데이터 기준일)
