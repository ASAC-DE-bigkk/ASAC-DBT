      - name: area_category
        data_type: varchar
        description: 장소 카테고리
      - name: dow
        data_type: bigint
        description: 요일 (1=월 … 7=일, Trino day_of_week, grain 축)
        tests: [not_null]
      - name: hr
        data_type: bigint
        description: 시간 (0~23, grain 축)
        tests: [not_null]
      - name: avg_ppltn
        data_type: integer
        description: 그 요일·시간대 평균 인구 (셀 평균)
      - name: max_ppltn
        data_type: integer
        description: 그 셀 최대 인구
      - name: min_ppltn
        data_type: integer
        description: 그 셀 최소 인구
      - name: typical_congest_lvl
        data_type: varchar
