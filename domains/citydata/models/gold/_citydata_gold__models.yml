  - name: gold_citydata_purchasing_power_daily
    config:
      tags: ['slow']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_purchasing_power_daily
          product_question: 이 장소는 유동인구가 실제 소비로 잘 이어집니까?
          grain: (event_date, area_cd) 마다 한 행 — 장소·일 구매력 지수.
          primary_key: [event_date, area_cd]
          publication_mode: append
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          event_time: event_date
          freshness_slo_minutes: 1560
          # #406에서 확인한 Citydata 원천·장소 축 계약이다. 공개 projection과 실제 게시 여부는 별도 gate다.
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          quality_coverage:
            field: area_cd
            expected_distinct_count: 121
            minimum_ratio: 1.0
          public_projection:
            schema_version: "1.0.0"
            columns: [event_date, area_cd, area_nm, area_category, gu, ppltn_avg, payment_amt_total, spend_per_crowd_idx, rank_spend, rank_spend_in_gu]
          usage_patterns:
            - pattern_id: top_purchasing_power_on_date
              question_ko: 특정 날 붐빔 대비 소비(구매력 지수)가 가장 높았던 장소는?
              axes: 장소 랭킹 — spend_per_crowd_idx DESC (날짜 고정)
              requires: [select_columns, sort]
              sql: |
                -- :date=2026-07-30, :n=10
                SELECT area_nm, gu, spend_per_crowd_idx, payment_amt_total
                FROM gold_citydata_purchasing_power_daily
                WHERE event_date = :date
                ORDER BY spend_per_crowd_idx DESC LIMIT :n
            - pattern_id: place_purchasing_power_trend
              question_ko: 이 장소의 구매력 지수 추이는?
              axes: 시계열 — 장소 고정, event_date 축
              requires: [select_columns, filter_set, filter_range, sort]
              sql: |
                -- :area_cd=POI014, :from=2026-07-01, :to=2026-07-31
                SELECT event_date, spend_per_crowd_idx, payment_amt_total, ppltn_avg
                FROM gold_citydata_purchasing_power_daily
                WHERE area_cd = :area_cd AND event_date BETWEEN :from AND :to
                ORDER BY event_date
            - pattern_id: high_crowd_low_spend_on_date
              question_ko: 특정 날 붐비는데 소비는 약했던 장소는?
              axes: 장소 랭킹 — spend_per_crowd_idx ASC (날짜 고정)
              requires: [select_columns, sort]
              sql: |
                -- :date=2026-07-30, :n=10
                SELECT area_nm, gu, ppltn_avg, spend_per_crowd_idx, rank_spend
