          grain: (area_cd, event_date) 마다 한 행 — 장소·일 대기질 집계.
          primary_key: [area_cd, event_date]
          publication_mode: append
          zero_policy: retain_last_good
          event_time: event_date
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: timeseries
          usage_patterns:
            - pattern_id: air_trend_for_place
              question_ko: 이 장소 최근 며칠 미세먼지 추이는?
              axes: 날짜 시계열 — event_date ASC (장소 고정)
              requires: [select_columns, sort]
              sql: |
                -- :area=강남구, :from=2026-07-20, :to=2026-08-03
                SELECT event_date, avg_pm10, avg_pm25, avg_air_idx_value
                FROM gold_citydata_air_daily
                WHERE area_nm = :area AND event_date BETWEEN :from AND :to
                ORDER BY event_date ASC
