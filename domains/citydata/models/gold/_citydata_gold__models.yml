          product_question: 이 동네 미세먼지가 요즘 며칠간 어떤 추이입니까?
          grain: (area_cd, event_date) 마다 한 행 — 장소·일 대기질 집계.
          primary_key: [area_cd, event_date]
          publication_mode: append
          zero_policy: retain_last_good
          event_time: event_date
          freshness_slo_minutes: 1560
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          usage_patterns:
            - pattern_id: "air_trend_for_place"
              question_ko: 이 장소 최근 며칠 미세먼지 추이는?
              axes: 날짜 시계열 — event_date ASC (장소 고정)
              requires: [select_columns, filter_set, filter_range, sort]
              insight_sample_ko: 강남구 PM2.5는 최근 2주 완만히 하락하는 추세다.
              sql: |
                -- :area=강남구, :from=2026-07-20, :to=2026-08-03
                SELECT event_date, avg_pm10, avg_pm25, avg_air_idx_value
                FROM gold_citydata_air_daily
                WHERE area_nm = :area AND event_date BETWEEN :from AND :to
                ORDER BY event_date ASC
            - pattern_id: "air_worst_days_for_place"
              question_ko: 이 장소 최근 N일 중 미세먼지가 가장 나빴던 날은?
              axes: 날짜 랭킹 — avg_pm10 DESC (장소·기간 고정)
              requires: [select_columns, filter_set, filter_range, sort]
              insight_sample_ko: 강남구 최근 2주 중 PM10 최악일은 7/28이었다.
              sql: |
                -- :area=강남구, :from=2026-07-20, :to=2026-08-03, :n=5
                SELECT event_date, avg_pm10, avg_pm25, avg_air_idx_value
                FROM gold_citydata_air_daily
                WHERE area_nm = :area AND event_date BETWEEN :from AND :to
                ORDER BY avg_pm10 DESC LIMIT :n
            - pattern_id: "air_compare_places_on_date"
              question_ko: 특정 날짜에 어느 자치구·장소 대기질이 더 나빴나?
              axes: 장소 랭킹 — avg_pm10 DESC (날짜 고정)
              requires: [select_columns, filter_set, sort]
              insight_sample_ko: 8/1엔 서남권 장소들의 PM10이 도심보다 높았다.
              sql: |
                -- :date=2026-08-01, :n=25
                SELECT area_nm, gu, avg_pm10, avg_pm25, avg_air_idx_value
                FROM gold_citydata_air_daily
                WHERE event_date = :date
                ORDER BY avg_pm10 DESC LIMIT :n
          display:
            title: 일별 대기질 추이
            summary: 장소마다 날짜별 평균 미세먼지(PM10/PM2.5)와 통합대기지수를 요약했습니다. 실시간 대신 며칠 추세를 봅니다.
            caveat: 통합대기지수(air_idx_value)는 높을수록 나쁨입니다.
            use_cases:
              - 미세먼지 며칠 추이
              - 요즘 대기질 좋아졌나 나빠졌나
      contract: {enforced: true}
    description: >
      일별 대기질 추이 — 장소마다 날짜별 평균 미세먼지(PM10/PM2.5)와 통합대기지수를 요약했습니다. 실시간 대신 며칠 추세를 봅니다.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: gu_code
        data_type: varchar
        description: 자치구 코드
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: admin_dong_code
        data_type: varchar
        description: 행정동 코드 (행안부 canonical)
      - name: area_category
        data_type: varchar
        description: 장소 카테고리
      - name: event_date
        data_type: date
        description: 관측 일자 (KST)
        tests: [not_null]
      - name: avg_pm10
        data_type: integer
        description: 일 평균 PM10 (㎍/㎥)
      - name: avg_pm25
        data_type: integer
        description: 일 평균 PM2.5 (㎍/㎥)
      - name: max_pm10
        data_type: integer
        description: 일 최대 PM10
      - name: max_pm25
        data_type: integer
        description: 일 최대 PM2.5
      - name: avg_air_idx_value
        data_type: double
        description: 일 평균 통합대기지수 (높을수록 나쁨)
      - name: base_n
        data_type: bigint
        description: 이 (장소·일자) 셀의 관측 표본 수
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area_cd, event_date]

  - name: gold_citydata_charger_dow_hour
    config:
