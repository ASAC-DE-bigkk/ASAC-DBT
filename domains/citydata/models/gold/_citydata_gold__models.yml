              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-04"
          product_question: 날씨가 이 동네 붐빔에 어떻게 영향을 줍니까?
          grain: (time_bucket, admin_dong_code) 마다 한 행 — 동·시간 인구×기상.
          primary_key: [time_bucket, admin_dong_code]
          publication_mode: append   # 성장형 시계열 — 새 time_bucket 만 게시(전량 snapshot 아님)
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          event_time: time_bucket
          freshness_slo_minutes: 1560   # daily 게시(전일 시각들) — 최신 데이터 ~26h 이내
          shape: rollup
          usage_patterns:
            - pattern_id: crowded_dongs_when_raining
              question_ko: 비 오는 시각에 붐비는 동네는?
              axes: 동 랭킹 — ppltn_avg DESC (시각 고정, 강수 조건)
              requires: [select_columns, sort]
              sql: |
                -- :ts=2026-07-30 18:00:00, :n=10
                SELECT admin_dong, gu, ppltn_avg, temp_c, precip_prob
                FROM gold_citydata_ppltn_x_weather_hourly
                WHERE time_bucket = :ts AND is_raining = 1
                ORDER BY ppltn_avg DESC LIMIT :n
            - pattern_id: dong_weather_crowd_trend
              question_ko: 이 동네의 시간별 붐빔과 날씨 추이는?
              axes: 시계열 — 동 고정, time_bucket 축
              requires: [select_columns, filter_set, filter_range, sort]
              sql: |
                -- :dong_code=1123072, :from=2026-07-30 00:00:00, :to=2026-07-30 23:00:00
                SELECT time_bucket, ppltn_avg, temp_c, precip_prob, is_raining
                FROM gold_citydata_ppltn_x_weather_hourly
                WHERE admin_dong_code = :dong_code AND time_bucket BETWEEN :from AND :to
                ORDER BY time_bucket
            - pattern_id: crowded_dongs_at_time
              question_ko: 특정 시각 가장 붐비는 동네와 그때 날씨는?
              axes: 동 랭킹 — ppltn_avg DESC (시각 고정)
              requires: [select_columns, sort]
              sql: |
                -- :ts=2026-07-30 18:00:00, :n=10
                SELECT admin_dong, gu, ppltn_avg, temp_c, precip_prob, is_raining
                FROM gold_citydata_ppltn_x_weather_hourly
                WHERE time_bucket = :ts
                ORDER BY ppltn_avg DESC LIMIT :n
          display:
            title: 동네 혼잡 × 날씨
            summary: 행정동·시간별 인구 혼잡과 기상 예보를 겹쳐 봤습니다. 날씨가 붐빔에 어떻게 영향 주는지 봅니다.
            caveat: KMA 단기예보(기온·강수)만 결합하며 대기질(미세먼지)은 별도입니다.
            use_cases:
              - 날씨별 방문 패턴
              - 우천 시 혼잡 예측
              - 야외 행사 리스크
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      동네 혼잡 × 날씨 — 행정동·시간별 인구 혼잡과 기상 예보를 겹쳐 봤습니다. 날씨가 붐빔에 어떻게 영향 주는지 봅니다.
    columns:
      - name: time_bucket
        data_type: timestamp(6)
        description: 시간 버킷 (KST)
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리·조인 키
        tests: [not_null]
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: hotspot_count
        data_type: bigint
        description: 그 동에 속한 우리 핫플 장소 수
      - name: ppltn_avg
        data_type: decimal(18,6)
        description: 그 동×시간 평균 붐빔
      - name: ppltn_peak
        data_type: decimal(18,6)
        description: 그 동×시간 최대 붐빔
      - name: temp_c
        data_type: double
        description: 기온(°C) 예보
      - name: precip_prob
        data_type: double
        description: 강수확률(%) 예보
      - name: humidity
        data_type: double
        description: 습도(%) 예보
      - name: wind_ms
        data_type: double
        description: 풍속(m/s) 예보
      - name: sky_code
        data_type: double
        description: 하늘 상태 코드 (1맑음/3구름많음/4흐림)
      - name: precip_type
        data_type: double
        description: 강수형태 코드 (0없음/1비/2비눈/3눈/4소나기)
      - name: is_raining
        data_type: boolean
        description: 강수형태 예보로 판단한 비/눈 여부 (boolean)

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time_bucket, admin_dong_code]
  - name: gold_citydata_ppltn_demographics
    config:
      tags: ['daily']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_ppltn_demographics
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 어떤 성별·나이대가 언제 몰립니까?
          grain: (area_cd, dow, hour, segment_type, segment) 마다 한 행 — 방문객 구성 패턴.
          primary_key: [area_cd, dow, hour, segment_type, segment]
          # 전이력 평균이라 골드는 매 run 전량 재계산(table)하되, D1 은 바뀐 버킷만 증분 upsert 한다.
          # reader 가 D1 max(last_event_at) 이후 그레인만 읽어 그 PK 만 INSERT OR REPLACE(나머지 보존).
          publication_mode: upsert
          upsert_strategy: incremental
          event_time: last_event_at        # 증분 워터마크 컬럼
          freshness_slo_minutes: 1560       # event_time 선언 시 필수(v1.1). 일 재빌드라 ppltn_daily 와 동일값
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          usage_patterns:
            - pattern_id: top_places_for_segment_at_time
              question_ko: 토요일 14시 20대가 가장 많은 지역은?
              axes: 장소 랭킹 — avg_est_headcount DESC (요일·시간·세그먼트 고정)
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :dow=6, :hour=14, :segment=20, :n=10
                SELECT area_nm, area_category, avg_est_headcount, avg_rate_pct
                FROM gold_citydata_ppltn_demographics
                WHERE dow = :dow AND hour = :hour AND segment_type = 'age' AND segment = :segment
                ORDER BY avg_est_headcount DESC LIMIT :n
            - pattern_id: segment_mix_for_place_at_time
              question_ko: 이 장소 이 요일·시간의 주 연령대는?
              axes: 세그먼트 랭킹 — avg_est_headcount DESC (장소·요일·시간 고정)
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :area=홍대 관광특구, :dow=6, :hour=20
                SELECT segment, avg_rate_pct, avg_est_headcount
                FROM gold_citydata_ppltn_demographics
                WHERE area_nm = :area AND dow = :dow AND hour = :hour AND segment_type = 'age'
                ORDER BY avg_est_headcount DESC
            - pattern_id: gender_mix_for_place_at_time
              question_ko: 이 장소 이 요일·시간의 성별 구성은?
              axes: 세그먼트 랭킹 — avg_rate_pct DESC (장소·요일·시간 고정, gender)
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :area=강남역, :dow=6, :hour=20
                SELECT segment, avg_rate_pct, avg_est_headcount
                FROM gold_citydata_ppltn_demographics
                WHERE area_nm = :area AND dow = :dow AND hour = :hour AND segment_type = 'gender'
                ORDER BY avg_rate_pct DESC
          display:
            title: 방문객 인구통계 패턴
            summary: 장소·요일·시간대별로 방문객의 성별·나이대 비율 패턴을 제공합니다. "20대는 언제 몰리나"에 답합니다.
            caveat: 집계 패턴이라 개인정보가 아닙니다.
            use_cases:
              - 타깃 고객 분석
              - 시간대별 마케팅
              - 상권 인구 프로파일
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      방문객 인구통계 패턴 — 장소·요일·시간대별로 방문객의 성별·나이대 비율 패턴을 제공합니다. "20대는 언제 몰리나"에 답합니다.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명 (예 홍대 관광특구)
      - name: area_category
        data_type: varchar
        description: 장소 분류 (관광특구/발달상권/공원 등)
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: dow
        data_type: bigint
        description: 요일 (Trino day_of_week — 1=월 … 6=토 … 7=일)
        tests: [not_null]
      - name: hour
        data_type: bigint
        description: 시각 (0~23, KST event_at 기준)
        tests: [not_null]
      - name: segment_type
        data_type: varchar
        description: 세그먼트 차원 — gender | age
        tests: [not_null]
      - name: segment
        data_type: varchar
        description: 세그먼트 값 — gender=male/female, age=0/10/…/70(대)
        tests: [not_null]
      - name: avg_rate_pct
        data_type: decimal(6,2)
        description: 그 (요일,시간) 버킷 세그먼트 비율(%) 평균
      - name: avg_est_headcount
        data_type: double
        description: 추정 인원수 평균 = avg(인구 중간값 × 비율/100). "많은" 랭킹 키. ⚠ 인구범위 중간값 기반 추정치(교차분포 아님)
      - name: avg_ppltn
        data_type: double
        description: 인구 중간값(min·max 평균) 평균 — 세그먼트 무관 참고
      - name: avg_congest_score
        data_type: double
        description: 혼잡도 평균 (1 여유·2 보통·3 약간붐빔·4 붐빔)
      - name: sample_count
        data_type: bigint
        description: 집계된 5분 실측 스냅샷 수 (신뢰도 지표)
      - name: last_event_at
        data_type: timestamp(6)
        description: 이 버킷에 기여한 가장 최근 event_at — 증분 서빙 워터마크(표시용 아님, 신선도 참고)
        tests: [not_null]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area_cd, dow, hour, segment_type, segment]

  - name: gold_citydata_ppltn_dow_hour
    config:
      tags: ['daily']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_ppltn_dow_hour
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 무슨 요일 몇 시가 붐빕니까?
          grain: (area_cd, dow, hr) 마다 한 행 — 요일×시간 붐빔 패턴.
          primary_key: [area_cd, dow, hr]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          usage_patterns:
            - pattern_id: peak_dow_hour_for_place
              question_ko: 이 장소는 무슨 요일 몇 시가 가장 붐비나?
              axes: 요일×시간 랭킹 — avg_ppltn DESC (장소 고정)
              requires: [select_columns, sort]
              sql: |
                -- :area=강남역, :n=10
                SELECT dow, hr, avg_ppltn, typical_congest_lvl
                FROM gold_citydata_ppltn_dow_hour
                WHERE area_nm = :area
                ORDER BY avg_ppltn DESC LIMIT :n
            - pattern_id: quietest_dow_hour_for_place
              question_ko: 이 장소가 가장 한산한 요일·시간은?
              axes: 요일×시간 랭킹 — avg_ppltn ASC (장소 고정, reliable만)
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :area=성수동, :n=10
                SELECT dow, hr, avg_ppltn, typical_congest_lvl
                FROM gold_citydata_ppltn_dow_hour
                WHERE area_nm = :area AND reliable = 1
                ORDER BY avg_ppltn ASC LIMIT :n
            - pattern_id: place_profile_on_dow
              question_ko: 특정 요일, 이 장소의 시간대별 붐빔은?
              axes: 시간 프로파일 — 장소·요일 고정, hr 축
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :area=강남역, :dow=2
                SELECT hr, avg_ppltn, typical_congest_lvl, reliable
                FROM gold_citydata_ppltn_dow_hour
                WHERE area_nm = :area AND dow = :dow
                ORDER BY hr
          display:
            title: 요일·시간 혼잡 패턴
            summary: 장소마다 무슨 요일 몇 시가 붐비고 한산한지 요일×시간으로 요약했습니다. 실검 수요가 가장 많은 축입니다.
            caveat: 관측 주수가 아직 적어 셀당 표본이 얇습니다(base_n·reliable 동봉). reliable=false 셀은 참고용입니다.
            use_cases:
              - 무슨 요일 붐벼 응답
              - 요일별 방문 계획
              - 한산한 요일·시간 추천
      contract: {enforced: true}
    description: >
      요일·시간 혼잡 패턴 — 장소마다 무슨 요일 몇 시가 붐비고 한산한지 요일×시간으로 요약했습니다. 실검 수요가 가장 많은 축입니다.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: gu_code
        data_type: varchar
        description: 자치구 코드
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: admin_dong_code
        data_type: varchar
        description: 행정동 코드 (행안부 canonical)
      - name: area_category
        data_type: varchar
        description: 장소 카테고리
      - name: dow
        data_type: bigint
        description: 요일 (1=월 … 7=일, Trino day_of_week)
        tests: [not_null]
      - name: hr
        data_type: bigint
        description: 시간 (0~23)
        tests: [not_null]
      - name: avg_ppltn
        data_type: integer
        description: 그 요일·시간대 평균 인구 (셀 평균)
      - name: max_ppltn
        data_type: integer
        description: 그 셀 최대 인구
      - name: min_ppltn
        data_type: integer
        description: 그 셀 최소 인구
      - name: typical_congest_lvl
        data_type: varchar
        description: 그 셀 최빈 혼잡도 (여유/보통/약간 붐빔/붐빔)
      - name: base_n
        data_type: bigint
        description: 이 (장소·요일·시간) 셀의 시간 관측 수(≈관측 주수) — 신뢰도 지표
      - name: reliable
        data_type: boolean
        description: 표본 충분 여부 (base_n>=3 = 3주+ 관측). 초기엔 false 많음 — 소비측 캐비앳용
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area_cd, dow, hr]

  - name: gold_citydata_sbike_dow_hour
    config:
      tags: ['daily']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_sbike_dow_hour
          source_evidence:
            - source_id: seoul_citydata
              source_url: https://data.seoul.go.kr/dataList/OA-21285/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          product_question: 이 장소는 무슨 요일 몇 시에 따릉이가 많습니까?
          grain: (area_cd, dow, hr) 마다 한 행 — 영역 요일×시간 따릉이 가용 패턴.
          primary_key: [area_cd, dow, hr]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          shape: rollup
          usage_patterns:
            - pattern_id: "bike_rich_dow_hour_for_place"
              question_ko: 이 장소는 무슨 요일 몇 시에 따릉이가 가장 많나?
              axes: 요일×시간 랭킹 — avg_bikes_available DESC (장소 고정)
              requires: [select_columns, filter_set, sort]
              insight_sample_ko: 여의도는 토요일 오후 2시대 대여가능 대수가 가장 많다.
              sql: |
                -- :area=여의도, :n=10
                SELECT dow, hr, avg_bikes_available, avg_availability_pct
                FROM gold_citydata_sbike_dow_hour
                WHERE area_nm = :area
                ORDER BY avg_bikes_available DESC LIMIT :n
            - pattern_id: "bike_hourly_profile_for_place_dow"
              question_ko: 이 장소, 이 요일의 시간대별 따릉이 프로파일은?
              axes: 시간 시계열 — hr ASC (장소·요일 고정)
              requires: [select_columns, filter_set, sort]
              insight_sample_ko: 여의도 토요일은 새벽에 대여가능 대수가 낮고 오후에 회복된다.
              sql: |
                -- :area=여의도, :dow=6
                SELECT hr, avg_bikes_available, avg_availability_pct
                FROM gold_citydata_sbike_dow_hour
                WHERE area_nm = :area AND dow = :dow
                ORDER BY hr ASC
            - pattern_id: "bike_best_places_at_dow_hour"
              question_ko: 이 요일·시간에 따릉이가 잘 잡히는 장소 top N은?
              axes: 장소 랭킹 — avg_bikes_available DESC (요일·시간 고정)
              requires: [select_columns, filter_set, sort]
              insight_sample_ko: 월요일 오전 8시엔 도심 업무지구보다 주거지 인접 장소에서 잘 잡힌다.
              sql: |
                -- :dow=1, :hr=8, :n=10
                SELECT area_nm, gu, avg_bikes_available, avg_availability_pct
                FROM gold_citydata_sbike_dow_hour
                WHERE dow = :dow AND hr = :hr
                ORDER BY avg_bikes_available DESC LIMIT :n
          display:
            title: 요일·시간 따릉이 가용 패턴
            summary: 장소마다 무슨 요일 몇 시에 따릉이가 많고 적은지 요일×시간으로 요약했습니다. 실시간이 아니라 전형 패턴입니다.
            caveat: 초기 데이터라 셀당 표본이 얇습니다(base_n·reliable 동봉). reliable=false 셀은 참고용입니다.
            use_cases:
              - 따릉이 잘 잡히는 요일·시간
              - 자전거 이동 계획
      contract: {enforced: true}
    description: >
      요일·시간 따릉이 가용 패턴 — 장소마다 무슨 요일 몇 시에 따릉이가 많고 적은지 요일×시간으로 요약했습니다. 실시간이 아니라 전형 패턴입니다.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: gu_code
        data_type: varchar
        description: 자치구 코드
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: admin_dong_code
        data_type: varchar
        description: 행정동 코드 (행안부 canonical)
      - name: area_category
        data_type: varchar
        description: 장소 카테고리
      - name: dow
        data_type: bigint
        description: 요일 (1=월 … 7=일, Trino day_of_week)
        tests: [not_null]
      - name: hr
        data_type: bigint
        description: 시간 (0~23)
        tests: [not_null]
      - name: avg_bikes_available
        data_type: integer
        description: 그 요일·시간대 영역 평균 대여가능 자전거 수 (대여소 합산의 평균)
      - name: avg_racks
        data_type: integer
        description: 그 요일·시간대 영역 평균 거치대 수
      - name: avg_availability_pct
        data_type: double
        description: 그 요일·시간대 평균 거치율(%) = 가용/거치대
      - name: base_n
        data_type: bigint
        description: 이 (장소·요일·시간) 셀의 표본 수 (수집 시점 개수)
      - name: reliable
        data_type: boolean
        description: 표본 충분 여부 (base_n>=30) — false 셀은 참고용
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area_cd, dow, hr]

  - name: gold_citydata_air_daily
    config:
