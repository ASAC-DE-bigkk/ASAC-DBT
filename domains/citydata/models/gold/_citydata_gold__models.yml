version: 2

# citydata gold 문서·태그·테스트 (레이어 분리).
# silver 는 silver/_citydata_silver__models.yml · sources 는 models/sources.yml.

models:
  - name: gold_citydata_ppltn_by_time
    config:
      tags: ['fast']
      meta: {serving_tier: hold}  # 5분 원본 대용량 — API 서빙 보류 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_at, area_cd]
    description: >
      gold_citydata_ppltn_by_time — 5분 스냅샷 단위 장소 인구혼잡도 시계열 원장.
      silver 소비, avg_ppltn(최소·최대 평균) 파생, 좌표·행정구역(행안부 코드)·시간축은
      #48 공통축 보강. 해결 질문: "어제 15시 전후 홍대 인구가 어떻게 변했나",
      "특정 기간 5분 단위 원자료 추출". grain (event_at, area_cd) · 갱신 fast ·
      적재 table+replace(통째 재빌드). ⚠ 연 1,270만 행급 대용량 — API 직접 서빙 보류,
      기간 조회는 일별(ppltn_daily)·시간별 롤업(예정) 골드 사용.
    columns:
      - name: event_at
        description: 대표 측정 시각 (KST timestamp, grain 축)
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
      - name: sido
        description: 시도명 (서울)
      - name: area_nm
        description: 장소명
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 (동 단위 조인 키)
      - name: area_category
        description: 장소 분류
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: area_congest_lvl
        description: 혼잡도 수준
      - name: area_ppltn_min
        description: 추정 최소 인구
      - name: area_ppltn_max
        description: 추정 최대 인구
      - name: avg_ppltn
        description: 평균 추정 인구 ((min + max) / 2)
      - name: male_ppltn_rate
        description: 남성 인구 비율(%)
      - name: female_ppltn_rate
        description: 여성 인구 비율(%)
      - name: ppltn_rate_0
        description: 0~9세 인구 비율(%)
      - name: ppltn_rate_10
        description: 10대 인구 비율(%)
      - name: ppltn_rate_20
        description: 20대 인구 비율(%)
      - name: ppltn_rate_30
        description: 30대 인구 비율(%)
      - name: ppltn_rate_40
        description: 40대 인구 비율(%)
      - name: ppltn_rate_50
        description: 50대 인구 비율(%)
      - name: ppltn_rate_60
        description: 60대 인구 비율(%)
      - name: ppltn_rate_70
        description: 70대 이상 인구 비율(%)
      - name: resnt_ppltn_rate
        description: 상주 인구 비율(%)
      - name: non_resnt_ppltn_rate
        description: 비상주(유동) 인구 비율(%)
      - name: collected_at
        description: 수집 시각

  - name: gold_citydata_ppltn_daily
    config:
      tags: ['slow']
      meta: {serving_tier: d1_direct}  # 이력·일별 — 전 기간 D1 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_code]
    description: >
      gold_citydata_ppltn_daily — 장소별 하루 혼잡 인사이트. 일 평균/최대/최소 인구,
      피크 시각·피크 혼잡도, 붐빔 비율, 측정 완결성(슬라이스 수). 해결 질문:
      "지난주 성수동은 언제 제일 붐볐나", "최근 한 달 일평균 인구 추이",
      "기간을 지정해 과거 혼잡 이력 비교". grain (event_date, area_code) ·
      갱신 slow(일) · 적재 table+replace(통째 재빌드).
    columns:
      - name: event_date
        description: 집계 날짜 (event_at의 KST 날짜) — grain 축
      - name: area_code
        description: 장소 코드 (POI###) — grain 축
      - name: area_name
        description: 장소명
      - name: area_type
        description: 장소 분류
      - name: sido
        description: 시도명 (서울)
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        description: 일 평균 추정 인구
      - name: max_population
        description: 일 최대 추정 인구
      - name: min_population
        description: 일 최소 추정 인구
      - name: peak_at
        description: 가장 혼잡했던 시각 (KST timestamp)
      - name: peak_congestion_level
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        description: 그날 수집 슬라이스 수 (완결성 지표)

  # ── citydata 계열 (#69, ASAC-DAG#192) ───────────────────────────────────────

  - name: gold_citydata_place_latest
    config:
      tags: ['fast']
      meta: {serving_tier: d1_direct}  # 스냅샷 ~121행 (specs/2026-07-17 §2)
    description: >
      gold_citydata_place_latest — 장소별 최신 크로스 신호 스냅샷(장소당 1행).
      혼잡도 × 소비(신한카드) × 지하철·버스 승하차 × 따릉이 × 대기질·기온의 최신값 통합.
      해결 질문: "지금 강남 붐비고 공기는 괜찮나", "전 장소 현재 상태를 지도/현황판에".
      grain area_cd(장소 ~121곳) · 갱신 fast · 적재 table+replace(통째 재빌드).
      ⚠ 최신 스냅샷만 — 과거 이력은 ppltn_daily 등 이력 골드 사용.
    columns:
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
        data_tests: [unique, not_null]
      - name: area_nm
        description: 장소명
      - name: area_category
        description: 장소 분류
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: area_congest_lvl
        description: 최신 혼잡도 수준
      - name: area_ppltn_min
        description: 최신 추정 최소 인구
      - name: area_ppltn_max
        description: 최신 추정 최대 인구
      - name: ppltn_at
        description: 혼잡/인구 신호의 최신 시각 (KST)
      - name: cmrcl_lvl
        description: 최신 상권 활성 수준
      - name: payment_count
        description: 최신 결제 건수 (신한카드)
      - name: payment_amt_min
        description: 최신 결제금액 하한
      - name: payment_amt_max
        description: 최신 결제금액 상한
      - name: cmrcl_at
        description: 상권 신호의 최신 시각 (KST)
      - name: subway_gton_30min
        description: 최근 30분 지하철 승차 인원
      - name: bus_gton_30min
        description: 최근 30분 버스 승차 인원
      - name: transit_at
        description: 승하차 신호의 최신 시각 (KST)
      - name: sbike_parking_total
        description: 따릉이 주차 대수 합
      - name: sbike_rack_total
        description: 따릉이 거치대 수 합
      - name: sbike_spot_count
        description: 따릉이 대여소 수
      - name: sbike_at
        description: 따릉이 신호의 최신 시각 (KST)
      - name: temperature
        description: 최신 기온 (°C)
      - name: pm25
        description: 초미세먼지 농도
      - name: pm25_index
        description: 초미세먼지 지수 (좋음/보통/나쁨…)
      - name: pm10
        description: 미세먼지 농도
      - name: pm10_index
        description: 미세먼지 지수
      - name: air_idx
        description: 통합대기환경지수
      - name: air_at
        description: 대기질 신호의 최신 시각 (KST)
      - name: refreshed_at
        description: 이 행에 반영된 신호들의 최신 시각
        data_tests: [not_null]

  - name: gold_citydata_cmrcl_daily
    config:
      tags: ['slow']
      meta: {serving_tier: d1_direct}  # 이력·일별 — 전 기간 D1 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_cd]
    description: >
      gold_citydata_cmrcl_daily — 장소별 일 소비(상권) 인사이트. 결제 건수 합/평균,
      최대 결제금액, 결제 피크 시각·피크 활성 수준, 바쁨 비율, 측정 완결성. 해결 질문:
      "이번 주 소비가 제일 활발했던 장소는", "특정 장소의 일별 결제 추이".
      grain (event_date, area_cd) · 갱신 slow(일) · 적재 table+replace(통째 재빌드).
    columns:
      - name: event_date
        description: 집계 날짜 (KST) — grain 축
        data_tests: [not_null]
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
        data_tests: [not_null]
      - name: area_nm
        description: 장소명
      - name: area_category
        description: 장소 분류
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: payment_count_total
        description: 그날 결제 건수 합
      - name: payment_count_avg
        description: 슬라이스당 평균 결제 건수
      - name: payment_amt_peak
        description: 그날 최대 결제금액(상한)
      - name: peak_at
        description: 가장 결제 활발했던 시각 (KST)
      - name: peak_cmrcl_lvl
        description: 피크 시각의 상권 활성 수준
      - name: busy_ratio_percent
        description: 상권 '바쁨' 이었던 슬라이스 비율 (%)
      - name: measurement_count
        description: 그날 수집 슬라이스 수 (완결성 지표)

  # ── 신규 골드 (#122) ─────────────────────────────────────────────────────────

  - name: gold_citydata_purchasing_power_daily
    config:
      tags: ['slow']
      meta: {serving_tier: d1_direct}  # 이력·일별 — 전 기간 D1 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_cd]
    description: >
      gold_citydata_purchasing_power_daily — 장소별 일 구매력·붐빔대비구매 지수.
      유동인구(ppltn)와 결제(cmrcl)를 일집계 조인해 buy/spend_per_crowd_idx 와
      rank(전체·자치구내) 산출. 해결 질문: "사람은 많은데 소비는 약한 곳은",
      "구매력 상위 상권 랭킹", "기간별 구매력 변화". grain (event_date, area_cd) ·
      갱신 slow(일) · 적재 table+replace(통째 재빌드).
      ⚠ 유동인구는 동시 체류 추정 — 지수는 장소 간 상대 비교용.
    columns:
      - name: event_date
        description: 집계 날짜 (KST) — grain 축
        data_tests: [not_null]
      - name: area_cd
        description: 장소 코드 (POI###, grain 축)
        data_tests: [not_null]
      - name: area_nm
        description: 장소명
      - name: area_category
        description: 장소 분류
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: ppltn_avg
        description: 그날 평균 유동인구
      - name: ppltn_peak
        description: 그날 최대 유동인구
      - name: congest_peak_lvl
        description: 피크 시각의 혼잡도 수준
      - name: payment_cnt_total
        description: 그날 결제 건수 합
      - name: payment_amt_total
        description: 그날 결제금액 합
      - name: payment_amt_peak
        description: 그날 최대 결제금액
      - name: ppltn_measure_count
        description: 인구 측정 슬라이스 수 (완결성)
      - name: cmrcl_measure_count
        description: 상권 측정 슬라이스 수 (완결성)
      - name: buy_per_crowd_idx
        description: 결제건수 / 평균 유동인구 (붐빔 대비 구매, 상대 지수)
      - name: spend_per_crowd_idx
        description: 결제금액 / 평균 유동인구 (구매력 proxy, 상대 지수)
      - name: rank_spend
        description: 그날 전체 장소 중 spend_per_crowd_idx 순위 (1=Top). 하위=구매력 약한 지역
      - name: rank_spend_in_gu
        description: 그날 자치구 내 순위

  - name: gold_citydata_ppltn_x_culture_daily
    config:
      tags: ['slow']
      meta: {serving_tier: d1_direct}  # 이력·일별 — 전 기간 D1 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, admin_dong_code]
    description: >
      gold_citydata_ppltn_x_culture_daily — 행정동×일 인구혼잡 × 문화활동 6종
      (행사·축제·공연·전시·세종·KCISA, 크로스도메인 culture source). 동별 일 붐빔과
      그날 활성 문화활동 수·유형 결합. 해결 질문: "행사 있는 날 그 동네가 얼마나 더 붐비나",
      "이번 주말 축제 열리는 동네는". grain (event_date, admin_dong_code) ·
      갱신 slow(일) · 적재 table+replace(통째 재빌드). ⚠ 커버리지 = 핫플 장소가 속한 동 한정.
    columns:
      - name: event_date
        description: 집계 날짜 (KST) — grain 축
        data_tests: [not_null]
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 — grain 축·조인 키
        data_tests: [not_null]
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: gu
        description: 자치구명
      - name: hotspot_count
        description: 그 동에 속한 우리 핫플 장소 수
      - name: ppltn_avg
        description: 그 동×일 평균 붐빔
      - name: ppltn_peak
        description: 그 동×일 최대 붐빔
      - name: event_count
        description: 그날 그 동에 활성인 문화활동 총수 6종 합 (0 포함)
      - name: has_event
        description: 문화활동 존재 여부 (boolean)
      - name: performance_count
        description: 그중 공연 수
      - name: exhibition_count
        description: 그중 전시 수
      - name: festival_count
        description: 그중 축제 수
      - name: event_types
        description: 존재하는 문화활동 유형 목록 (예 '행사, 공연, 전시')

  - name: gold_citydata_transit_x_incident_hourly
    config:
      tags: ['fast']
      meta: {serving_tier: d1_direct}  # 이력·시간별 — 전 기간 D1, 연 단위 재검토 (specs/2026-07-17 §2)
    data_tests:
      - unique_grain:
          arguments:
            columns: [time_bucket, admin_dong_code]
    description: >
      gold_citydata_transit_x_incident_hourly — 행정동×시간 승하차 강도 × 교통돌발
      (크로스도메인 traffic source). 5분창 승하차 중앙값의 시간내 평균(대표 강도)과
      그 시간 활성 돌발 수·유형(사고·공사 등) 결합. 해결 질문: "사고 났을 때 승하차가
      얼마나 줄었나", "돌발이 몰리는 시간대·동네는". grain (time_bucket=시, admin_dong_code) ·
      갱신 fast · 적재 table+replace(통째 재빌드).
    columns:
      - name: time_bucket
        description: 시간 버킷 (KST, date_trunc hour) — grain 축
        data_tests: [not_null]
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 — grain 축·조인 키
