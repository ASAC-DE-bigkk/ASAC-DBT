          caveat: 2주 데이터라 요일 대신 주말/평일로 나눕니다.
          use_cases:
            - 방문 시간 계획
            - 한산한 때 추천
            - 혼잡 회피
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, is_weekend, hr]
    description: >
      gold_citydata_ppltn_forecast — 장소×주말여부×시간대 인구혼잡 예보(패턴 기반).
      과거 평균 붐빔(expected_ppltn)±표준편차·과거 최대. 해결 질문: "이번 주말 홍대
      몇 시가 제일 붐비나", "평일 밤에 한적한 공원은". grain (area_cd, is_weekend, hr) ·
      갱신 fast · 적재 table+replace(통째 재빌드, by_time 파생).
      ⚠ 과거 패턴 기대값(기상 등 반영한 실측 예보 아님) · base_n 작으면 신뢰도 낮음.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
        data_tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: is_weekend
