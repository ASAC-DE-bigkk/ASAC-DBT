version: 2

# citydata gold 문서·태그·테스트 (레이어 분리).
# silver 는 silver/_citydata_silver__models.yml · sources 는 models/sources.yml.

models:
  - name: gold_citydata_ppltn_by_time
    config:
      tags: ['fast']
      meta:
        serving_tier: hold
        refresh: '5분'
        display:
          title: 장소 혼잡 5분 시계열
          summary: 서울 주요 장소의 인구 혼잡을 5분 단위로 쌓은 원자료입니다. 서울시는 실시간만 제공하지만 우리가 누적 보관해 과거 특정 시점의 혼잡을 재구성할 수 있습니다.
          caveat: 연 1천만 행급 대용량이라 기간을 좁혀 조회하세요. 요약이 필요하면 일별·시간별·요일×시간 롤업 골드를 쓰세요.
          use_cases:
            - 특정 시점 혼잡 재구성
            - 시계열 이상·패턴 분석
            - 커스텀 집계용 원자료
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_at, area_cd]
    description: >
      gold_citydata_ppltn_by_time — 5분 스냅샷 단위 장소 인구혼잡도 시계열 원장.
      silver 소비, avg_ppltn(최소·최대 평균) 파생, 좌표·행정구역(행안부 코드)·시간축은
      #48 공통축 보강. 해결 질문: "어제 15시 전후 홍대 인구가 어떻게 변했나",
      "특정 기간 5분 단위 원자료 추출". grain (event_at, area_cd) · 갱신 fast ·
      적재 table+replace(통째 재빌드). ⚠ 연 1,270만 행급 대용량 — API 직접 서빙 보류,
      기간 조회는 일별(ppltn_daily)·시간별 롤업(예정) 골드 사용.
    columns:
      - name: event_at
        data_type: timestamp(6)
        description: 대표 측정 시각 (KST timestamp, grain 축)
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
      - name: sido
        data_type: varchar
        description: 시도명 (서울)
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리 (동 단위 조인 키)
      - name: area_category
        data_type: varchar
        description: 장소 분류
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: area_congest_lvl
        data_type: varchar
        description: 혼잡도 수준
      - name: area_ppltn_min
        data_type: integer
        description: 추정 최소 인구
      - name: area_ppltn_max
        data_type: integer
        description: 추정 최대 인구
      - name: avg_ppltn
        data_type: integer
        description: 평균 추정 인구 ((min + max) / 2)
      - name: male_ppltn_rate
        data_type: decimal(5,2)
        description: 남성 인구 비율(%)
      - name: female_ppltn_rate
        data_type: decimal(5,2)
        description: 여성 인구 비율(%)
      - name: ppltn_rate_0
        data_type: decimal(5,2)
        description: 0~9세 인구 비율(%)
      - name: ppltn_rate_10
        data_type: decimal(5,2)
        description: 10대 인구 비율(%)
      - name: ppltn_rate_20
        data_type: decimal(5,2)
        description: 20대 인구 비율(%)
      - name: ppltn_rate_30
        data_type: decimal(5,2)
        description: 30대 인구 비율(%)
      - name: ppltn_rate_40
        data_type: decimal(5,2)
        description: 40대 인구 비율(%)
      - name: ppltn_rate_50
        data_type: decimal(5,2)
        description: 50대 인구 비율(%)
      - name: ppltn_rate_60
        data_type: decimal(5,2)
        description: 60대 인구 비율(%)
      - name: ppltn_rate_70
        data_type: decimal(5,2)
        description: 70대 이상 인구 비율(%)
      - name: resnt_ppltn_rate
        data_type: decimal(5,2)
        description: 상주 인구 비율(%)
      - name: non_resnt_ppltn_rate
        data_type: decimal(5,2)
        description: 비상주(유동) 인구 비율(%)
      - name: collected_at
        data_type: timestamp(6)
        description: 수집 시각

  - name: gold_citydata_ppltn_daily
    config:
      tags: ['slow']
      meta:
        serving_tier: d1_direct
        refresh: '1일'
        display:
          title: 장소별 일 혼잡 요약
          summary: 장소마다 하루 동안의 평균·최대·최소 인구와 혼잡을 요약했습니다. 날짜 단위로 방문 추세를 볼 때 씁니다.
          caveat: 하루 집계라 순간 피크는 max_population으로만 보입니다.
          use_cases:
            - 일별 방문 추세
            - 요일·계절 비교
            - 리포트 KPI
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_code]
    description: >
      gold_citydata_ppltn_daily — 장소별 하루 혼잡 인사이트. 일 평균/최대/최소 인구,
      피크 시각·피크 혼잡도, 붐빔 비율, 측정 완결성(슬라이스 수). 해결 질문:
      "지난주 성수동은 언제 제일 붐볐나", "최근 한 달 일평균 인구 추이",
      "기간을 지정해 과거 혼잡 이력 비교". grain (event_date, area_code) ·
      갱신 slow(일) · 적재 table+replace(통째 재빌드).
    columns:
      - name: event_date
        data_type: date
        description: 집계 날짜 (event_at의 KST 날짜) — grain 축
      - name: area_code
        data_type: varchar
        description: 장소 코드 (POI###) — grain 축
      - name: area_name
        data_type: varchar
        description: 장소명
      - name: area_type
        data_type: varchar
        description: 장소 분류
      - name: sido
        data_type: varchar
        description: 시도명 (서울)
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        data_type: double
        description: 일 평균 추정 인구
      - name: max_population
        data_type: integer
        description: 일 최대 추정 인구
      - name: min_population
        data_type: integer
        description: 일 최소 추정 인구
      - name: peak_at
        data_type: timestamp(6)
        description: 가장 혼잡했던 시각 (KST timestamp)
      - name: peak_congestion_level
        data_type: varchar
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        data_type: decimal(38,16)
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        data_type: bigint
        description: 그날 수집 슬라이스 수 (완결성 지표)

  - name: gold_citydata_ppltn_hourly
    config:
      tags: ['hourly']
      meta:
        serving_tier: d1_direct
        refresh: '1시간'
        display:
          title: 장소별 시간대 혼잡
          summary: 장소마다 시간 단위로 인구·혼잡을 집계했습니다. 몇 시가 붐비고 한산한지 시간대별로 볼 수 있습니다.
          caveat: 시간 단위 집계라 그 안의 분 단위 변동은 5분 시계열을 보세요.
          use_cases:
            - 시간대별 방문 계획
            - 피크타임 분석
            - 운영 인력 배치
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [time_bucket, area_cd]
    description: >
      gold_citydata_ppltn_hourly — 장소별 시간 혼잡 인사이트. 시간 평균/최대/최소 인구,
      피크 5분 시각·혼잡도, 붐빔 비율, 측정 완결성(최대 12슬라이스). daily(일)와 by_time(5분)
      사이의 시간 해상도 — "지난 일주일 시간별" 서빙 조회를 채운다. 해결 질문:
      "어제 오후 몇 시에 제일 붐볐나", "지난주 홍대 시간대별 붐빔 추이".
      grain (time_bucket, area_cd) · 갱신 slow(시간 롤업) · 적재 table+replace(통째 재빌드) ·
      D1 서빙은 시간버킷 append.
    columns:
      - name: time_bucket
        data_type: timestamp(6)
        description: 시간 버킷 (KST, date_trunc hour) — grain 축
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###) — grain 축
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: area_category
        data_type: varchar
        description: 장소 분류
      - name: sido
        data_type: varchar
        description: 시도명 (서울)
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        data_type: double
        description: 시간 평균 추정 인구
      - name: max_population
        data_type: integer
        description: 시간 최대 추정 인구
      - name: min_population
        data_type: integer
        description: 시간 최소 추정 인구
      - name: peak_at
        data_type: timestamp(6)
        description: 그 시간 가장 혼잡했던 5분 시각 (KST timestamp)
      - name: peak_congestion_level
        data_type: varchar
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        data_type: decimal(38,16)
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        data_type: bigint
        description: 그 시간 수집 슬라이스 수 (완결성 지표, 최대 12)

  # ── citydata 계열 (#69, ASAC-DAG#192) ───────────────────────────────────────

  - name: gold_citydata_place_latest
    config:
      tags: ['fast']
      meta:
        serving_tier: d1_direct
        refresh: '5분'
        display:
          title: 실시간 장소 종합 신호
          summary: 서울 주요 장소의 최신 혼잡·대기질·상권·따릉이 신호를 한 행으로 모았습니다. "지금 여기 어때"에 바로 답합니다.
          caveat: 서울시 API의 ~30분 발표 지연이 반영됩니다(신호별 관측시각 동봉).
          use_cases:
            - 실시간 현황 조회
            - 챗봇 현재 상태 응답
            - 대시보드 현재 카드
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      gold_citydata_place_latest — 장소별 최신 크로스 신호 스냅샷(장소당 1행).
      혼잡도 × 소비(신한카드) × 지하철·버스 승하차 × 따릉이 × 대기질·기온의 최신값 통합.
      해결 질문: "지금 강남 붐비고 공기는 괜찮나", "전 장소 현재 상태를 지도/현황판에".
      grain area_cd(장소 ~121곳) · 갱신 fast · 적재 table+replace(통째 재빌드).
      ⚠ 최신 스냅샷만 — 과거 이력은 ppltn_daily 등 이력 골드 사용.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
        data_tests: [unique, not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: area_category
        data_type: varchar
        description: 장소 분류
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: area_congest_lvl
        data_type: varchar
        description: 최신 혼잡도 수준
      - name: area_ppltn_min
        data_type: integer
        description: 최신 추정 최소 인구
      - name: area_ppltn_max
        data_type: integer
        description: 최신 추정 최대 인구
      - name: ppltn_at
        data_type: timestamp(6)
        description: 혼잡/인구 신호의 최신 시각 (KST)
      - name: cmrcl_lvl
        data_type: varchar
        description: 최신 상권 활성 수준
      - name: payment_count
        data_type: integer
        description: 최신 결제 건수 (신한카드)
      - name: payment_amt_min
        data_type: bigint
        description: 최신 결제금액 하한
      - name: payment_amt_max
        data_type: bigint
        description: 최신 결제금액 상한
      - name: cmrcl_at
        data_type: timestamp(6)
        description: 상권 신호의 최신 시각 (KST)
      - name: subway_gton_30min
        data_type: integer
        description: 최근 30분 지하철 승차 인원
      - name: bus_gton_30min
        data_type: integer
        description: 최근 30분 버스 승차 인원
      - name: transit_at
        data_type: timestamp(6)
        description: 승하차 신호의 최신 시각 (KST)
      - name: sbike_parking_total
        data_type: bigint
        description: 따릉이 주차 대수 합
      - name: sbike_rack_total
        data_type: bigint
        description: 따릉이 거치대 수 합
      - name: sbike_spot_count
        data_type: bigint
        description: 따릉이 대여소 수
      - name: sbike_at
        data_type: timestamp(6)
        description: 따릉이 신호의 최신 시각 (KST)
      - name: temperature
        data_type: decimal(4,1)
        description: 최신 기온 (°C)
      - name: pm25
        data_type: integer
        description: 초미세먼지 농도
      - name: pm25_index
        data_type: varchar
        description: 초미세먼지 지수 (좋음/보통/나쁨…)
      - name: pm10
        data_type: integer
        description: 미세먼지 농도
      - name: pm10_index
        data_type: varchar
        description: 미세먼지 지수
      - name: air_idx
        data_type: varchar
        description: 통합대기환경지수
      - name: air_at
        data_type: timestamp(6)
        description: 대기질 신호의 최신 시각 (KST)
      - name: refreshed_at
        data_type: timestamp(6)
        description: 이 행에 반영된 신호들의 최신 시각
        data_tests: [not_null]

  - name: gold_citydata_cmrcl_daily
    config:
      tags: ['slow']
      meta:
        serving_tier: d1_direct
        refresh: '1일'
        display:
          title: 장소별 일 소비(상권)
          summary: 장소마다 하루 결제 건수와 상권 활력을 집계했습니다. 붐빔 대비 얼마나 소비가 일어나는지 봅니다.
          caveat: 신한카드 결제 집계라 현금·타카드는 제외이며, 개별 점포가 아닌 장소 단위입니다.
          use_cases:
            - 상권 활력 추세
            - 붐빔 대비 소비 분석
            - 입지 리포트
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_cd]
    description: >
      gold_citydata_cmrcl_daily — 장소별 일 소비(상권) 인사이트. 결제 건수 합/평균,
      최대 결제금액, 결제 피크 시각·피크 활성 수준, 바쁨 비율, 측정 완결성. 해결 질문:
      "이번 주 소비가 제일 활발했던 장소는", "특정 장소의 일별 결제 추이".
