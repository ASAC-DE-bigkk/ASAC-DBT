        display:
          title: 요일·시간 혼잡 패턴
          summary: 장소마다 무슨 요일 몇 시가 붐비고 한산한지 요일×시간으로 요약했습니다. 실검 수요가 가장 많은 축입니다.
          caveat: 2주 데이터라 셀당 표본이 얇습니다(base_n·reliable 동봉). reliable=false 셀은 참고용입니다.
          use_cases:
            - 무슨 요일 붐벼 응답
            - 요일별 방문 계획
            - 한산한 요일·시간 추천
      contract: {enforced: true}
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, dow, hr]
    description: >
      gold_citydata_ppltn_dow_hour — 장소×요일×시간 인구혼잡 롤업. by_time 파생.
      해결 질문: "화요일 저녁 강남 붐빔?", "성수동 제일 한산한 요일·시간?".
      forecast(주말/평일 2분할)의 요일 세분화판. grain (area_cd, dow, hr) · 갱신 패턴 ·
      적재 table+replace. ⚠ 2.7주 데이터라 셀당 표본 얇음(median~22) — base_n·reliable 동봉,
      소비측이 표본 적은 셀을 "참고용"으로 캐비앳. 누적되면 신뢰도 상승(base_n 제거 가능).
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: gu
        data_type: varchar
        description: 자치구명
      - name: gu_code
        data_type: varchar
        description: 자치구 코드 (#48 공간축)
      - name: admin_dong
        data_type: varchar
        description: 행정동명
      - name: admin_dong_code
        data_type: varchar
        description: 행정동 코드 (행안부 canonical)
      - name: area_category
        data_type: varchar
        description: 장소 카테고리
      - name: dow
        data_type: bigint
        description: 요일 (1=월 … 7=일, Trino day_of_week, grain 축)
        tests: [not_null]
      - name: hr
        data_type: bigint
        description: 시간 (0~23, grain 축)
        tests: [not_null]
      - name: avg_ppltn
        data_type: integer
        description: 그 요일·시간대 평균 인구 (셀 평균)
      - name: max_ppltn
        data_type: integer
        description: 그 셀 최대 인구
      - name: min_ppltn
        data_type: integer
        description: 그 셀 최소 인구
      - name: typical_congest_lvl
        data_type: varchar
        description: 그 셀 최빈 혼잡도 (여유/보통/약간 붐빔/붐빔)
      - name: base_n
        data_type: bigint
        description: 이 (장소·요일·시간) 셀의 표본 수 — 신뢰도 지표
      - name: reliable
        data_type: boolean
        description: 표본 충분 여부 (base_n>=30). 초기엔 false 많음 — 소비측 캐비앳용
