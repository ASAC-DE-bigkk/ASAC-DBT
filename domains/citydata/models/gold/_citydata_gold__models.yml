  - name: gold_citydata_sbike_availability
    config:
      tags: ['fast']
      meta:
        serving:
          enabled: true
          external: true
          product_id: citydata_sbike_availability
          product_question: 지금 여기 따릉이가 몇 대 남아 있습니까?
          grain: (area_cd, spot_id) 마다 한 행 — 대여소별 현재 가용.
          primary_key: [area_cd, spot_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "*/5 * * * *"
          event_time: observed_at
          freshness_slo_minutes: 60
          shape: wide
          partial_policy:
            min_publish_ratio: 0.8
        display:
          title: 따릉이 대여소별 실시간 가용
          summary: 장소별 따릉이 대여소마다 지금 남은 자전거 수(parking_count)와 거치율을 제공합니다. "여기 지금 따릉이 남았어?"에 대여소 단위로 답합니다.
          caveat: 현재 상태 스냅샷이라 과거 이력은 없습니다. place_latest는 장소 합계만 주지만 이 골드는 대여소 단위입니다.
          use_cases:
            - 대여소별 잔여 자전거 확인
            - 근처 빌릴 수 있는 대여소 탐색
            - 반납 가능 거치대 확인
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    description: >
      gold_citydata_sbike_availability — 장소×대여소 현재 따릉이 가용 현황 스냅샷.
      silver_citydata_sbike 에서 대여소별 최신 관측만 골라 서빙. 해결 질문:
      "지금 여의도한강공원 따릉이 남아 있어", "근처 빌릴 수 있는 대여소는" — parking_count>0 필터.
      grain (area_cd, spot_id) · 갱신 fast · 적재 table+replace(통째 재빌드). ⚠ 최신 스냅샷만(이력 없음).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area_cd, spot_id]
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
        tests: [not_null]
      - name: area_nm
        data_type: varchar
        description: 장소명
      - name: area_category
        data_type: varchar
        description: 장소 분류
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: spot_id
        data_type: varchar
        description: 대여소 ID (grain 축)
        tests: [not_null]
      - name: spot_nm
        data_type: varchar
        description: 대여소명
      - name: spot_longitude
        data_type: double
        description: 대여소 경도
      - name: spot_latitude
        data_type: double
        description: 대여소 위도
      - name: parking_count
        data_type: integer
        description: 대여 가능 자전거 수 (★ "지금 남았어?" 판단)
      - name: rack_count
        data_type: integer
        description: 거치대 수
      - name: shared_rate_percent
        data_type: integer
        description: 거치율(%) = 자전거/거치대
      - name: has_bikes
        data_type: boolean
        description: 대여 가능 자전거 존재 여부 (parking_count>0)
      - name: observed_at
        data_type: timestamp(6)
        description: 최신 관측 시각 (KST)

