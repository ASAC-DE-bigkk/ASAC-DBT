  - name: gold_citydata_ppltn_demographics
    config:
      tags: ['daily']
      meta:
        serving_tier: d1_direct
        refresh: '패턴'
        display:
          title: 방문객 인구통계 패턴
          summary: 장소·요일·시간대별로 방문객의 성별·나이대 비율 패턴을 제공합니다. "20대는 언제 몰리나"에 답합니다.
          caveat: 집계 패턴이라 개인정보가 아닙니다.
          use_cases:
            - 타깃 고객 분석
            - 시간대별 마케팅
            - 상권 인구 프로파일
      contract: {enforced: true}  # 컬럼·타입 빌드 시점 강제 (7/13 회고 계약안)
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, dow, hour, segment_type, segment]
    description: >
      gold_citydata_ppltn_demographics — 장소×요일×시간대 인구 성별·나이대 세그먼트 패턴.
      silver_ppltn 의 wide 비율을 long 으로 언피벗해 요일×시간대 평균 집계
      (avg_rate_pct·avg_est_headcount). 해결 질문: "토요일 14시 20대가 많은 지역은",
      "이 장소 주중 저녁의 주 연령대는" — segment 필터 + avg_est_headcount 정렬.
      grain (area_cd, dow, hour, segment_type, segment) · 갱신 slow · 적재 table+replace(통째 재빌드).
      ⚠ 성별×나이대 교차는 원본에 없어 미포함 — age headcount × gender rate 근사(독립가정) ·
      avg_est_headcount 는 인구범위 중간값 기반 추정치.
    columns:
      - name: area_cd
        data_type: varchar
        description: 장소 코드 (POI###, grain 축)
      - name: area_nm
        data_type: varchar
        description: 장소명 (예 홍대 관광특구)
      - name: area_category
        data_type: varchar
        description: 장소 분류 (관광특구/발달상권/공원 등)
      - name: admin_dong_code
        data_type: varchar
        description: 행안부 행정동 코드 10자리
      - name: gu_code
        data_type: varchar
        description: 행안부 자치구 코드 5자리
      - name: longitude
        data_type: double
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        data_type: double
        description: 장소 중심점 위도 (WGS84)
      - name: dow
        data_type: bigint
        description: 요일 (Trino day_of_week — 1=월 … 6=토 … 7=일, grain 축)
      - name: hour
        data_type: bigint
        description: 시각 (0~23, KST event_at 기준, grain 축)
      - name: segment_type
        data_type: varchar
        description: 세그먼트 차원 — gender | age (grain 축)
      - name: segment
        data_type: varchar
        description: 세그먼트 값 — gender=male/female, age=0/10/…/70(대) (grain 축)
      - name: avg_rate_pct
        data_type: decimal(6,2)
        description: 그 (요일,시간) 버킷 세그먼트 비율(%) 평균
      - name: avg_est_headcount
        data_type: double
        description: 추정 인원수 평균 = avg(인구 중간값 × 비율/100). "많은" 랭킹 키. ⚠ 인구범위 중간값 기반 추정치(교차분포 아님)
      - name: avg_ppltn
        data_type: double
        description: 인구 중간값(min·max 평균) 평균 — 세그먼트 무관 참고
      - name: avg_congest_score
        data_type: double
        description: 혼잡도 평균 (1 여유·2 보통·3 약간붐빔·4 붐빔)
      - name: sample_count
        data_type: bigint
        description: 집계된 5분 실측 스냅샷 수 (신뢰도 지표)

