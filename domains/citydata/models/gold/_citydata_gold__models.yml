          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: 30 0 * * *
          event_time: time_bucket
          freshness_slo_minutes: 1560   # daily 게시(전일 시각들) — 최신 데이터 ~26h 이내
          shape: rollup
          usage_patterns:
            - pattern_id: incident_prone_dongs_at_time
              question_ko: 특정 시각에 교통 돌발이 가장 잦은 동네는?
              axes: 동 랭킹 — incident_count DESC (시각 고정)
              requires: [select_columns, sort]
              sql: |
                -- :ts=2026-07-30 18:00:00, :n=10
                SELECT admin_dong, gu, incident_count, board_5min_avg
                FROM gold_citydata_transit_x_incident_hourly
                WHERE time_bucket = :ts
                ORDER BY incident_count DESC LIMIT :n
            - pattern_id: busiest_transit_dongs_at_time
              question_ko: 특정 시각에 승차가 가장 많은 동네는?
              axes: 동 랭킹 — board_5min_avg DESC (시각 고정)
              requires: [select_columns, sort]
              sql: |
                -- :ts=2026-07-30 08:00:00, :n=10
                SELECT admin_dong, gu, board_5min_avg, alight_5min_avg, incident_count
                FROM gold_citydata_transit_x_incident_hourly
                WHERE time_bucket = :ts
                ORDER BY board_5min_avg DESC LIMIT :n
            - pattern_id: dong_transit_incident_trend
              question_ko: 이 동네의 시간별 승하차·돌발 추이는?
              axes: 시계열 — 동 고정, time_bucket 축
