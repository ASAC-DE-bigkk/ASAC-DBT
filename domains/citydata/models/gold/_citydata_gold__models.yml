      해결 질문: "화요일 저녁 강남 붐빔?", "성수동 제일 한산한 요일·시간?".
      forecast(주말/평일 2분할)의 요일 세분화판. grain (area_cd, dow, hr) · 갱신 패턴 ·
      적재 table+replace. ⚠ 2.7주 데이터라 셀당 표본 얇음(median~22) — base_n·reliable 동봉,
      소비측이 표본 적은 셀을 "참고용"으로 캐비앳. 누적되면 신뢰도 상승(base_n 제거 가능).
    columns:
