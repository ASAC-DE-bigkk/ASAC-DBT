version: 2

sources:
  - name: bronze_citydata
    description: >
      citydata 통합 API 원본 (#192/#69). **seoul_citydata 스키마로 분리** — population
      (seoul_ppltn)과 격리한다. DAG(ASAC-DAG population_citydata_bronze)가 적재.
    database: "{{ target.database }}"
    # citydata 는 별도 스키마. 샌드박스 테스트 시 SEOUL_CITYDATA_SCHEMA 로 격리.
    schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'seoul_citydata') }}"
    tables:
      - name: bronze_seoul_citydata
        description: >
          citydata 통합 API 원본 (#192, ASAC-DAG population_citydata_bronze 적재).
          1행 = 장소 1곳의 블록 1개 (block_name + payload JSON) — 기본 6블록
          allowlist(인구/상권/승하차×2/따릉이/날씨·대기질), 전 블록 원본은 R2
          raw(.json.gz)에 보존. 같은 ingest_ts delete-then-insert 멱등.
        loaded_at_field: collected_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 60, period: minute}
        columns:
          - name: block_name
            description: 블록 식별자 (LIVE_CMRCL_STTS 등) — silver가 블록별로 골라 파싱
            data_tests: [not_null]
          - name: payload
            description: ★ 블록 원본 JSON 통째
            data_tests: [not_null]
          - name: area_cd
            description: 장소 코드 (POI###)
          - name: collected_at
            description: 수집 시각 UTC

  # 크로스도메인 소스 (#122) — 별도 dbt 프로젝트의 published silver 를 같은 카탈로그에서
  # 읽는다. ref 불가라 source 로 배선. prod 도 동일 스키마명(culture/traffic) 가정.
  - name: culture
    description: 문화 도메인 published 테이블 (ASAC-DBT domains/culture).
    database: "{{ target.database }}"
    schema: culture
    tables:
      - name: silver_culture_event
        description: 서울 문화행사 기간 fact — admin_dong_code·event_start/end_date·category·is_free.
      - name: silver_culture_festival
        description: 축제 기간 fact — admin_dong_code·event_start/end_date.
      - name: silver_culture_performance
        description: 공연 기간 fact — admin_dong_code·event_start/end_date.
      - name: silver_culture_exhibition
        description: 전시 기간 fact — admin_dong_code·event_start/end_date.
      - name: silver_culture_sejong
        description: 세종문화회관 공연 기간 fact — admin_dong_code·event_start/end_date.
      - name: silver_culture_kcisa_event
        description: KCISA 문화행사 기간 fact — admin_dong_code·event_start/end_date.

  - name: traffic
    description: 교통 도메인 published 테이블 (ASAC-DBT domains/traffic).
    database: "{{ target.database }}"
    schema: traffic
    tables:
      - name: silver_seoul_traffic_incident
        description: TOPIS 돌발정보 — admin_dong_code·occurred_at·expected_clear_at·acc_type.

  - name: weather
    description: 날씨 도메인 published 테이블 (ASAC-DBT domains/weather).
    database: "{{ target.database }}"
    schema: weather
    tables:
      - name: silver_weather_forecast_by_admin_dong
        description: 기상청 단기예보(행정동 매핑) long 포맷 — admin_dong_code·forecast_at·category·fcst_value_num.

  - name: commerce
    description: 상권 도메인 published 테이블 (ASAC-DBT domains/commerce).
    database: "{{ target.database }}"
    schema: commerce
    tables:
      - name: silver_license_current
        description: 서울 인허가 명부(현재) — admin_dong_code·trdstatenm(영업상태)·dataset(업종).

  - name: transit_dong
    description: >
      교통(버스·지하철·주차) 도메인 골드 — 도메인 공용 스키마 transit (ASAC-DBT#204 로
      dev sandbox 스키마에서 전환).
    database: "{{ target.database }}"
    schema: "{{ env_var('TRANSIT_SCHEMA', 'transit') }}"
    tables:
      - name: gold_transit_dong_hourly
        description: 행정동×시간 대중교통·주차 집계 — bus_congestion_avg·subway_wait_avg_s·parking_occupancy_avg 등.

seeds:
  - name: seoul_hotspot_area_geo
    description: >
      서울시 주요 121장소 영역(shapefile, WGS84) 기반 위치 참조 데이터.
      원본은 R2 reference/population/area_geo/에 아카이브, 이 seed는 조인용 가공본
      (중심점 = 면적 가중 centroid, bbox, 폴리곤 WKT). AREA_CD/AREA_NM은
      citydata_ppltn API 및 DAG AREAS 레지스트리와 1:1 일치(121개).
    columns:
      - name: area_cd
        description: 장소 코드 (POI###) — silver/gold의 area_cd와 조인 키
        data_tests: [unique, not_null]
      - name: category
        description: 장소 분류 (관광특구/고궁·문화유산/인구밀집지역 등)
      - name: area_nm
        description: 장소명 (DAG AREAS 레지스트리와 동일 표기)
        data_tests: [unique, not_null]
      - name: center_lon
        description: 중심점 경도 (WGS84, 면적 가중 centroid)
      - name: center_lat
        description: 중심점 위도 (WGS84)
      - name: lon_min
        description: 영역 bbox 서쪽 경계
      - name: lat_min
        description: 영역 bbox 남쪽 경계
      - name: lon_max
        description: 영역 bbox 동쪽 경계
      - name: lat_max
        description: 영역 bbox 북쪽 경계
      - name: polygon_wkt
        description: 영역 폴리곤 WKT (POLYGON/MULTIPOLYGON, WGS84)

models:
  - name: silver_citydata_ppltn
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, event_at]
    description: >
      bronze payload를 json_extract로 개별 필드 분해 후 (area_cd, event_at) 기준 최신
      1건으로 중복 제거한 정제 테이블. 공간축은 코드·좌표(area_cd·admin_dong_code·gu_code·
      lon·lat)만 담고 이름은 dim_seoul_area 조인으로 얻는다(#115). incremental(delete+insert).
    columns:
      - name: area_cd
        description: 장소 코드 (POI###) — grain 축
      - name: gu_code
        description: 행안부 자치구 코드 5자리 — 구 단위 조인·롤업 키
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 (canonical) — 동 단위 도메인 통합 조인 키
      - name: longitude
        description: 장소 중심점 경도 (WGS84, seed 조인)
        data_tests:
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lon
      - name: latitude
        description: 장소 중심점 위도 (WGS84, seed 조인)
        data_tests:
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lat
      - name: area_congest_lvl
        description: 혼잡도 수준 (여유/보통/약간 붐빔/붐빔) — 소문자 정규화
      - name: area_congest_msg
        description: 혼잡도 안내 메시지
      - name: area_ppltn_min
        description: 추정 최소 인구 (integer)
      - name: area_ppltn_max
        description: 추정 최대 인구 (integer)
      - name: event_at
        description: 대표 측정 시각 (KST timestamp — PPLTN_TIME 파싱, dedup grain·크로스도메인 시간축)
      - name: collected_at
        description: 수집 시각 (KST, dedup 시 최신 판단 기준)

  - name: gold_citydata_ppltn_by_time
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_at, area_cd]
    description: >
      silver를 소비하는 시간별 장소 인구혼잡도. 평균 인구(avg_ppltn) 파생. 좌표·
      행정구역(행안부 코드)·시간축(event_at)은 silver에서 #48 공통축으로 보강됨.
      incremental(merge) — 최근 수집분만(30분 lookback) (ppltn_time, area_cd) 키로 merge.
    columns:
      - name: event_at
        description: 대표 측정 시각 (KST timestamp, grain 축)
      - name: area_nm
        description: 장소명
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 (동 단위 조인 키)
      - name: area_category
        description: 장소 분류
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: area_congest_lvl
        description: 혼잡도 수준
      - name: avg_ppltn
        description: 평균 추정 인구 ((min + max) / 2)
      - name: collected_at
        description: 수집 시각

  - name: gold_citydata_ppltn_daily
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_code]
    description: >
      silver를 소비하는 장소별 하루 혼잡 인사이트 (평균/최대/최소 인구, 피크 시각,
      붐빔 비율, 측정 완결성). grain = (event_date, area_code). incremental(merge) —
      최근 2일치 재집계 후 (event_date, area_code) 키로 merge.
    columns:
      - name: event_date
        description: 집계 날짜 (event_at의 KST 날짜) — grain 축
      - name: area_code
        description: 장소 코드 (POI###) — grain 축
      - name: area_name
        description: 장소명
      - name: area_type
        description: 장소 분류
      - name: gu
        description: 자치구명
      - name: admin_dong
        description: 행정동명
      - name: gu_code
        description: 행안부 자치구 코드 5자리
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리
      - name: longitude
        description: 장소 중심점 경도 (WGS84)
      - name: latitude
        description: 장소 중심점 위도 (WGS84)
      - name: average_population
        description: 일 평균 추정 인구
      - name: max_population
        description: 일 최대 추정 인구
      - name: min_population
        description: 일 최소 추정 인구
      - name: peak_at
        description: 가장 혼잡했던 시각 (KST timestamp)
      - name: peak_congestion_level
        description: 피크 시각의 혼잡도 수준
      - name: busy_ratio_percent
        description: 붐빔/약간 붐빔 이었던 슬라이스 비율 (%)
      - name: measurement_count
        description: 그날 수집 슬라이스 수 (완결성 지표)

  # ── citydata 계열 (#69, ASAC-DAG#192) ───────────────────────────────────────

  - name: dim_seoul_area
    description: >
      서울 주요 121장소 정적 차원 — seed 좌표 + asac_axes 경계 point-in-polygon으로
      #48 공통축(gu/admin_dong/행안부 코드)을 1회 계산. citydata silver들의 조인원.
    columns:
      - name: area_cd
        description: 장소 코드 (PK)
        data_tests: [unique, not_null]
      - name: admin_dong_code
        description: 행안부 행정동 코드 10자리 (canonical)
        data_tests:
          - asac_axes.axis_coverage:
              arguments:
                min_ratio: 0.99

  - name: silver_citydata_cmrcl
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, event_at]
    description: >
      실시간 상권(신한카드) 요약 — grain (area_cd, event_at). event_at = CMRCL_TIME
      파싱(KST, 실측 10분 주기). incremental(merge), 30분 lookback, 배치 내 dedup.
    columns:
      - name: area_cd
        data_tests: [not_null]
      - name: event_at
        description: 상권 데이터 갱신 시각 (KST)
        data_tests: [not_null]
      - name: cmrcl_lvl
        description: 장소 상권 활성 수준 (한산한/보통/분주한/바쁜)
      - name: payment_count
        description: 실시간 신한카드 결제 건수 (10분 창)

  - name: silver_citydata_cmrcl_rsb
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, event_at, rsb_lrg_ctgr, rsb_mid_ctgr]
    description: >
      상권 업종별 상세 — grain (area_cd, event_at, 업종 대·중분류). CMRCL_RSB 배열
      UNNEST. incremental(merge).
    columns:
      - name: rsb_mid_ctgr
        description: 업종 중분류 (한식/편의점 등)
        data_tests: [not_null]

  - name: silver_citydata_transit_ppltn
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, mode, observed_at]
    description: >
      지하철/버스 승하차 인원 — grain (area_cd, mode, observed_at). 원천 시각 필드가
      없어 observed_at=collected_at(KST). 5/10/30분 창 + 당일 누적. incremental(merge).
    columns:
      - name: mode
        description: subway | bus
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]

  - name: silver_citydata_sbike
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, spot_id, observed_at]
    description: >
      따릉이 대여소 현황 — grain (area_cd, spot_id, observed_at). SBIKE_STTS 배열
      UNNEST, 대여소 좌표 포함. incremental(merge).
    columns:
      - name: spot_id
        description: 대여소 ID (ST-###)
        data_tests: [not_null]

  - name: silver_citydata_air
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, event_at]
    description: >
      날씨 실황 + 대기질 — grain (area_cd, event_at=WEATHER_TIME, 실측 10분).
      FCST24HOURS(예보)는 weather 도메인 canonical이라 제외. incremental(merge).
    columns:
      - name: event_at
        data_tests: [not_null]
      - name: pm25
        description: 초미세먼지 농도
      - name: pm10
        description: 미세먼지 농도

  - name: gold_citydata_place_latest
    description: >
      장소별 최신 크로스 신호 스냅샷 (장소당 1행) — 혼잡도(silver_citydata_ppltn) ×
      소비 × 승하차 × 따릉이 × 대기질. 실시간 지도/현황판 마트. incremental(merge,
      key=area_cd) — 최근 6시간 창에서 신호별 최신값을 merge, 전체 재생성 없음.
    columns:
      - name: area_cd
        data_tests: [unique, not_null]
      - name: refreshed_at
        description: 이 행에 반영된 신호들의 최신 시각 (증분 기준점)
        data_tests: [not_null]

  - name: gold_citydata_cmrcl_daily
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_cd]
    description: >
      장소별 일 소비 인사이트 — grain (event_date, area_cd). 결제 규모·피크 시간대·
      활성 비율·측정 완결성. incremental(merge) — 최근 2일 재집계 후 merge.
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: area_cd
        data_tests: [not_null]

  # ── 신규 골드 (#122) ─────────────────────────────────────────────────────────

  - name: gold_citydata_purchasing_power_daily
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, area_cd]
    description: >
      장소별 일 구매력·붐빔대비구매 — grain (event_date, area_cd). 유동인구(ppltn)와
      결제(cmrcl)를 일집계·조인해 buy/spend_per_crowd_idx 와 rank(전체·자치구내)를 낸다.
      ⚠ 유동인구는 동시 체류 추정이라 지수는 장소 간 상대 비교용. incremental(delete+insert).
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: area_cd
        data_tests: [not_null]
      - name: buy_per_crowd_idx
        description: 결제건수 / 평균 유동인구 (붐빔 대비 구매, 상대 지수)
      - name: spend_per_crowd_idx
        description: 결제금액 / 평균 유동인구 (구매력 proxy, 상대 지수)
      - name: rank_spend
        description: 그날 전체 장소 중 spend_per_crowd_idx 순위 (1=Top). 하위=구매력 약한 지역
      - name: rank_spend_in_gu
        description: 그날 자치구 내 순위

  - name: gold_citydata_ppltn_x_culture_daily
    data_tests:
      - unique_grain:
          arguments:
            columns: [event_date, admin_dong_code]
    description: >
      인구혼잡 × 문화활동(통합) — grain (event_date, admin_dong_code). 우리 인구를 동×일
      롤업하고 그날 그 동 활성 문화활동 6종(행사·축제·공연·전시·세종·KCISA)을 UNION 해
      붙인다. 크로스도메인(source). 커버리지=우리 핫플 동 한정. incremental(delete+insert).
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: admin_dong_code
        data_tests: [not_null]
      - name: event_count
        description: 그날 그 동에 활성인 문화활동 총수 6종 합 (0 포함)
      - name: has_event
        description: 문화활동 존재 여부 (boolean)
      - name: performance_count
        description: 그중 공연 수
      - name: exhibition_count
        description: 그중 전시 수
      - name: festival_count
        description: 그중 축제 수
      - name: event_types
        description: 존재하는 문화활동 유형 목록 (예 '행사, 공연, 전시')

  - name: gold_citydata_transit_x_incident_hourly
    data_tests:
      - unique_grain:
          arguments:
            columns: [time_bucket, admin_dong_code]
    description: >
      승하차 × 교통돌발 — grain (time_bucket=시, admin_dong_code). 우리 승하차를 동×시 롤업하고
      그 시간 그 동 활성 교통돌발(traffic.silver_seoul_traffic_incident)을 붙인다. 승하차는
      5분창 중앙값의 시간내 평균(대표 강도). 크로스도메인(source). incremental(delete+insert).
    columns:
      - name: time_bucket
        data_tests: [not_null]
      - name: admin_dong_code
        data_tests: [not_null]
      - name: incident_count
        description: 그 시간 그 동에 활성인 돌발 수 (0 포함)
      - name: has_incident
        description: 돌발 존재 여부 (boolean)

  - name: gold_citydata_ppltn_x_weather_hourly
    data_tests:
      - unique_grain:
          arguments:
            columns: [time_bucket, admin_dong_code]
    description: >
      인구혼잡 × 날씨(예보) — grain (time_bucket=시, admin_dong_code). 우리 인구를 동×시 롤업하고
      기상청 단기예보(weather, 최신 발표분)를 피벗해 붙인다. 크로스도메인(source=weather).
      예보값(관측 아님). incremental(delete+insert).
    columns:
      - name: time_bucket
        data_tests: [not_null]
      - name: admin_dong_code
        data_tests: [not_null]
      - name: temp_c
        description: 기온(°C) 예보
      - name: precip_prob
        description: 강수확률(%) 예보
      - name: is_raining
        description: 강수형태 예보로 판단한 비/눈 여부 (boolean)

  - name: gold_citydata_ppltn_x_commerce_dong
    data_tests:
      - unique_grain:
          arguments:
            columns: [admin_dong_code]
    description: >
      인구혼잡 × 상권밀도 — grain admin_dong_code(동 단위). 우리 인구를 동 평균내고 그 동의
      상가 밀도(commerce 인허가 명부, 영업중 개수)를 붙인다. 크로스도메인(source=commerce).
      명부는 시계열 아닌 현재 상태라 밀도로 집계. materialized=table.
    columns:
      - name: admin_dong_code
        data_tests: [unique, not_null]
      - name: license_active
        description: 그 동의 영업중 인허가 수 (상가 밀도)
      - name: restaurant_active
        description: 그중 음식점(일반/휴게) 영업중 수

  - name: gold_citydata_ppltn_anomaly
    description: >
      인구혼잡 이상탐지 — grain area_cd(장소 현재 1행). (장소×주말여부×시간) 과거 baseline 평균±표준편차
      대비 현재 편차. z_score·pct_vs_normal 로 "지금 평소보다 붐벼?" 판단. by_time 파생 view.
    columns:
      - name: area_cd
        data_tests: [unique, not_null]
      - name: pct_vs_normal
        description: 현재 붐빔 ÷ 평소 − 1 (예 +0.4 = 평소보다 40% 더)
      - name: z_score
        description: (현재−평소)/표준편차 — 이례성 (|z|>2 강한 이례)

  - name: gold_citydata_ppltn_trend
    description: >
      인구혼잡 실시간 추세 — grain area_cd. 최근 30분 vs 이전 30분 평균 붐빔 변화율. "지금 뜨는 곳".
      by_time(5분) 최근 12버킷 파생 view.
    columns:
      - name: area_cd
        data_tests: [unique, not_null]
      - name: change_pct
        description: 최근30분 ÷ 이전30분 − 1 (붐빔 변화율)
      - name: trend
        description: 증가/감소/유지 (±5% 기준)

  - name: gold_citydata_place_scorecard
    description: >
      장소 스코어카드 — grain area_cd(장소 1행). 현재 혼잡·상권·교통·날씨·따릉이(place_latest)
      + 이상(anomaly) + 추세(trend) + 구매력(purchasing_power)을 한 행에 통합. 챗봇 "강남 어때?"용 view.
    columns:
      - name: area_cd
        data_tests: [unique, not_null]

  - name: gold_citydata_hot_commerce
    description: >
      뜨는 상권 지수 — grain area_cd. 붐빔추세+구매력+결제를 백분위 정규화 평균한 hot_index(0~1).
      "요즘 뜨는 상권?" trend+purchasing_power 파생 view.
    columns:
      - name: area_cd
        data_tests: [unique, not_null]
      - name: hot_index
        description: 세 축 백분위 평균 (0~1, 높을수록 핫)

  - name: gold_citydata_ppltn_forecast
    data_tests:
      - unique_grain:
          arguments:
            columns: [area_cd, is_weekend, hr]
    description: >
      인구혼잡 예보(패턴) — grain (area_cd, is_weekend, hr). 장소×주말여부×시간대 과거 평균 붐빔±표준편차.
      "이번 주말 홍대 붐벼?" 미래 예상 조회. by_time 파생 view.
    columns:
      - name: area_cd
        data_tests: [not_null]
      - name: expected_ppltn
        description: 그 장소·주말여부·시간대 과거 평균 붐빔

  - name: gold_citydata_ppltn_x_transit_hourly
    data_tests:
      - unique_grain:
          arguments:
            columns: [time_bucket, admin_dong_code]
    description: >
      인구혼잡 × 대중교통·주차 — grain (time_bucket=시, admin_dong_code). 우리 인구를 동×시 롤업하고
      버스혼잡·지하철대기·주차점유율(transit_dong, ⚠dev sandbox source)을 붙인다. "붐비는데 주차 돼?"용.
      incremental(delete+insert).
    columns:
      - name: time_bucket
        data_tests: [not_null]
      - name: admin_dong_code
        data_tests: [not_null]
      - name: parking_occupancy_avg
        description: 주차 점유율 평균 (0~1, 높을수록 만차)
