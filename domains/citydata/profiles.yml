seoul_ppltn:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    prod:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      # 카탈로그 논리명을 database 키로 노출 → target.database 가 잡혀 asac_axes 공유 source
      # 가 target 별 카탈로그를 읽는다(#66 커플링 해소, culture/transit 동일 방식).
      database: "{{ env_var('TRINO_ICEBERG_CATALOG', 'iceberg') }}"
      # prod 컷오버(#556) — 스키마 citydata 로 착지(dev 의 seoul_citydata 와 분리).
      schema: citydata
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 2
      timeout_seconds: 300

    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      database: "{{ env_var('TRINO_DEV_ICEBERG_CATALOG', 'iceberg_dev') }}"
      # 기본 스키마 = seoul_citydata (인구 포함 전 모델·seed 통합, #87). 개인 샌드박스는
      # SEOUL_CITYDATA_SCHEMA 하나로 격리(예: dev_<id>) — 모델(명시)·seed(기본) 모두 이 값.
      schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'seoul_citydata') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 2
      timeout_seconds: 300
