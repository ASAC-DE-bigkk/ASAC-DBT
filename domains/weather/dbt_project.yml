name: weather
version: "1.0.0"
config-version: 2

profile: weather

flags:
  require_certificate_validation: true

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  weather:
    +materialized: table

seeds:
  weather:
    +quote_columns: false
    weather_place_grid_mapping:
      +column_types:
        place_id: varchar
        place_name: varchar
        alias_names: varchar
        gu: varchar
        admin_dong: varchar
        latitude: double
        longitude: double
        nx: integer
        ny: integer
        mapping_method: varchar
        grid_distance_m: double
        source_admin_code: varchar
