  - name: bridge_weather_admin_dong_grid
    description: versioned candidate를 source_admin_code exact join으로 공통 행정동 다섯 필드에 stamp하고 unmatched도 보존한 내부 bridge다.
    config:
      meta:
        row_meaning_ko: 한 source 행정코드·bridge 버전·KMA 격자 mapping assertion과 canonical join 결과다.
        grain:
          - source_admin_code
          - bridge_version
          - nx
          - ny
        join_cardinality_ko: candidate N대 canonical dim 최대 1이며 candidate를 left join해 unmatched 손실을 금지한다.
        fan_out_policy_ko: 격자 하나가 여러 행정동 candidate에 대응하는 의도된 fan-out만 허용한다.
        spatial_semantics_ko: canonical 다섯 필드는 asac_axes.dim_admin_dong에서만 stamp하며 self-copy·prefix·centroid 인증을 금지한다.
        lifecycle: internal_candidate
        downstream:
          - W2_weather_public_gold
    columns:
      - name: place_id
        description: legacy mapping의 Weather 장소 식별자다.
      - name: place_name
        description: legacy mapping의 대표 장소명이다.
      - name: alias_names
        description: legacy mapping의 검색 별칭 목록이다.
      - name: legacy_gu
        description: legacy 자치구명이며 canonical 값이 아니다.
      - name: legacy_admin_dong
        description: legacy 행정동명이며 canonical 값이 아니다.
      - name: latitude
        description: legacy 장소 WGS84 위도이며 containment 증거가 아니다.
      - name: longitude
        description: legacy 장소 WGS84 경도이며 containment 증거가 아니다.
      - name: source_admin_code
        description: canonical dim에 exact join한 원천 행정코드 후보이며 grain 구성요소다.
        tests:
          - not_null
      - name: bridge_version
        description: append-only bridge assertion 버전이며 grain 구성요소다.
        tests:
          - not_null
      - name: nx
        description: KMA 격자 X 좌표이며 grain 구성요소다.
        tests:
          - not_null
      - name: ny
        description: KMA 격자 Y 좌표이며 grain 구성요소다.
        tests:
          - not_null
      - name: legacy_mapping_method
        description: legacy mapping_method 원문이다.
      - name: mapping_revision_label
        description: mapping 개정 label이며 source 유효 시작일 증거가 아니다.
      - name: recorded_at
        description: legacy seed의 Git 최초 기록 KST timestamp(6)다.
      - name: valid_from_at
        description: source-backed 유효 시작 KST 시각이며 v1은 null이다.
      - name: valid_to_at
        description: source-backed 유효 종료 KST 시각이며 v1은 null이다.
      - name: effective_from_basis
        description: recorded_at이 source 유효 시작일이 아님을 나타내는 근거 token이다.
      - name: mapping_method
        description: assertion 생성 방식이며 v1은 legacy_seed_exact_copy다.
      - name: temporal_quality
        description: 시간 증거 품질이며 v1은 revision_only다.
      - name: grid_distance_m
        description: legacy 장소와 격자 기준점 사이 거리 m이며 미계산 시 null이다.
      - name: admin_dong_code
        description: canonical dim에서 stamp한 행안부 10자리 행정동 코드이며 unmatched면 null이다.
      - name: admin_dong
        description: canonical dim에서 stamp한 행정동명이며 unmatched면 null이다.
      - name: gu_code
        description: canonical dim에서 stamp한 자치구 5자리 코드이며 unmatched면 null이다.
      - name: gu
        description: canonical dim에서 stamp한 자치구명이며 unmatched면 null이다.
      - name: admin_dong_revision_date
        description: canonical dim revision_date alias이며 unmatched면 null이다.
      - name: canonical_mapping_state
        description: canonical exact join 결과인 matched 또는 unmatched 상태다.
      - name: canonical_join_eligible
        description: canonical 다섯 필드를 사용할 수 있는 matched 여부다.
  - name: gold_weather_forecast_by_admin_dong
    description: 최신 공통 행정동 개정과 명시적 bridge v1을 사용해 행정동·예보시각·항목별 최신 KMA 예보를 게시하는 공개 Gold다.
    config:
      meta:
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: 서울 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
          cross_domain_usage_examples:
            - 교통과 생활인구 지표를 같은 행정동 코드와 예보 대상 시각으로 결합해 날씨 맥락을 비교합니다.
            - 문화와 상권 분석에서 같은 행정동의 항목별 최신 예보 표현을 설명 변수로 사용합니다.
          product_question: 각 공통 행정동과 예보 대상 시각 및 KMA 항목에서 최신 발표가 제공한 예보 표현과 값은 무엇입니까?
          row_meaning: 명시적 bridge v1과 최신 공통 행정동 개정에 결합된 한 행정동·예보시각·항목의 최신 KMA 예보 한 행입니다.
          grain: admin_dong_code와 forecast_at 및 category 조합마다 한 행입니다.
          anchor_universe: 게시 가능한 Grid 예보와 bridge v1 및 최신 공통 행정동 차원이 모두 만나는 행정동만 포함하며 현재 근거는 425개 코드입니다.
          usage_guidance: 행정동 코드와 예보 대상 시각 및 항목을 함께 사용하고 값은 value_representation과 범위 컬럼을 같이 해석합니다.
          do_not_use_for: 서울 426개 최신 행정동의 완전 모집단이나 실시간 관측값 또는 개인 위치를 추정하는 데 사용하지 않습니다.
          semantic_caveats: bridge v1에 없는 용신동과 최신 정본에 결합되지 않는 legacy 후보는 제외되며 행정동 설명 필드는 실행 시점 최신 개정으로 다시 stamp됩니다.
          primary_key:
            - product_row_id
          column_order:
            - product_row_id
            - admin_dong_code
            - forecast_at
            - category
            - admin_dong
            - gu_code
            - gu
            - admin_dong_revision_date
            - bridge_version
            - nx
            - ny
            - source_grid_place_id
            - issued_at
            - collected_at
            - published_at
            - fcst_value_raw
            - fcst_value_num
            - value_representation
            - value_num
            - value_lower_bound
            - value_upper_bound
            - qualitative_code
            - forecast_lead_hours
            - source_id
            - dag_run_id
            - raw_object_key
            - request_id
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: 게시 가능한 최신 KMA 실행을 다음 승인된 증분 실행에서 반영하는 것을 목표로 합니다.
            as_of_meaning: forecast_at은 예보가 대상으로 삼는 서울 기준 시각이며 수집이나 게시 시각을 대신하지 않습니다.
            late_repair_policy: 늦게 게시 가능한 실행은 최대 24시간의 승인된 명시적 cutoff repair로 비파괴 재처리합니다.
            roles:
              forecast_at:
                time_role: event
                timezone: Asia/Seoul
              issued_at:
                time_role: issue
                timezone: Asia/Seoul
              collected_at:
                time_role: collection
                timezone: Asia/Seoul
              published_at:
                time_role: publication
                timezone: Asia/Seoul
          space:
            enabled: true
            source_chain:
              - iceberg_dev.common.bronze_admin_dong_master
              - asac_axes.dim_admin_dong
            canonical_key: admin_dong_code
            revision_field: admin_dong_revision_date
            stamp_fields:
              - admin_dong_code
              - admin_dong
              - gu_code
              - gu
              - admin_dong_revision_date
            candidate_key_explanation: bridge의 source_admin_code는 최신 공통 행정동 차원에 exact join하기 전 후보 키로만 사용합니다.
            mapping_version_explanation: bridge_version은 weather_admin_dong_grid_bridge_v1로 고정하고 정본 개정일은 별도 필드에 명시합니다.
            null_location_explanation: 정본 다섯 필드에 결합되지 않은 bridge 후보는 내부 bridge에 남기되 공개 Gold에서는 제외합니다.
            fan_out_explanation: 격자 하나의 의도된 여러 행정동 매핑은 허용하지만 공개 natural grain 중복은 게시 전에 차단합니다.
            reconciliation_tests:
              - assert_gold_weather_forecast_by_admin_dong_admin_stamp_exact
              - assert_gold_weather_forecast_by_admin_dong_admin_revision_exact
          metrics: {}
          joins:
            admin_dong_dimension:
              target: model.asac_axes.dim_admin_dong
              source_keys:
                - admin_dong_code
              purpose: 행정동 코드의 최신 정본 명칭과 자치구 및 개정일을 검증합니다.
              cardinality: many_to_one
              fan_out_policy: 공통 행정동 차원에서 같은 코드가 중복되면 공개 게시를 중단합니다.
              reconciliation_test: assert_gold_weather_forecast_by_admin_dong_admin_join_reconciles
          quality:
            completeness_explanation: publishable manifest와 Bronze 완전성 및 Grid·bridge·정본 교집합을 함께 확인합니다.
            freshness_explanation: issued_at과 collected_at 및 published_at을 분리해 최신 발표와 적재 지연을 해석합니다.
            coverage_explanation: 전체 426개 정본이 아니라 bridge v1과 결합되는 현재 425개 코드가 공간 모집단입니다.
            state_fields:
              value_representation:
                allowed_values:
                  - explicit_none
                  - quantitative_exact
                  - quantitative_range
                  - bare_numeric
                  - qualitative_code
                  - missing
                  - unparseable
                state_explanations:
                  explicit_none: 원천이 강수나 적설이 없다고 명시한 표현입니다.
                  quantitative_exact: 단위가 있는 확정 수치 표현입니다.
                  quantitative_range: 미만이나 이상 또는 구간으로 제공된 범위 표현입니다.
                  bare_numeric: 단위 없이 숫자만 제공되어 공식 의미가 확정되지 않은 표현입니다.
                  qualitative_code: PTY 또는 SKY의 정성 상태 코드 표현입니다.
                  missing: 원천 예보 값이 비어 있거나 결측 표식인 상태입니다.
                  unparseable: 현재 분류 규칙으로 의미를 안전하게 해석할 수 없는 표현입니다.
          lineage:
            source_relations:
              - model.weather.silver_kma_vilage_fcst_grid
              - model.weather.bridge_weather_admin_dong_grid
              - model.asac_axes.dim_admin_dong
            identifiers:
              as_of:
                columns:
                  - forecast_at
              publication:
                columns:
                  - published_at
              raw:
                columns:
                  - raw_object_key
              request:
                columns:
                  - request_id
              run:
                columns:
                  - dag_run_id
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: 행정동 코드와 예보 대상 timestamp(6) 및 항목을 구분자로 연결한 결정적 제품 행 식별자입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: 공개 제품 기본 키이므로 null을 허용하지 않습니다.
      - name: admin_dong_code
        description: 최신 공통 행정동 차원에서 확인한 행안부 10자리 행정동 코드입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: natural grain과 다른 도메인 조인에 필수이므로 null을 허용하지 않습니다.
      - name: forecast_at
        description: 예보가 대상으로 삼는 서울 기준 timestamp(6)이며 natural grain의 시간축입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 예보 대상 시각이 없는 행은 제품 grain을 만들 수 없습니다.
            time_role: event
            timezone: Asia/Seoul
      - name: category
        description: KMA 단기예보 항목 코드이며 natural grain의 질문 축입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: dimension
            nullable: false
            null_meaning: 예보 항목을 식별할 수 없는 행은 공개하지 않습니다.
      - name: admin_dong
        description: 최신 공통 행정동 차원에서 가져온 행정동명입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 행정동명이 없는 후보는 공개 Gold에서 제외합니다.
      - name: gu_code
        description: 최신 공통 행정동 차원에서 가져온 행안부 자치구 5자리 코드입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 자치구 코드가 없는 후보는 공개 Gold에서 제외합니다.
      - name: gu
        description: 최신 공통 행정동 차원에서 가져온 자치구명입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 자치구명이 없는 후보는 공개 Gold에서 제외합니다.
      - name: admin_dong_revision_date
        description: 현재 행에 stamp한 최신 공통 행정동 정본의 개정일입니다.
        data_type: date
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 개정일이 없는 후보는 공개 Gold에서 제외합니다.
      - name: bridge_version
