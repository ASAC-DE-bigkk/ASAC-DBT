version: 2
seeds:
  - name: weather_place_grid_mapping
    description: 기존 Weather 장소·행정동 별칭을 KMA 격자에 연결한 427행 호환 seed이며 canonical 행정동 증거로 사용하지 않는다.
    columns:
      - name: place_id
        description: Weather 도메인이 부여한 장소 식별자이며 seed grain이다.
        tests:
          - not_null
          - unique
      - name: place_name
        description: 사용자 표시용 대표 장소명이다.
        tests:
          - not_null
      - name: alias_names
        description: 세로 막대로 구분한 검색 별칭 목록이다.
        tests:
          - not_null
      - name: gu
        description: legacy mapping에 기록된 자치구명이며 canonical 값이 아니다.
        tests:
          - not_null
      - name: admin_dong
        description: legacy mapping에 기록된 행정동명이며 canonical 값이 아니다.
        tests:
          - not_null
      - name: latitude
        description: 장소의 WGS84 위도이며 격자 매핑 보조 정보다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lat
      - name: longitude
        description: 장소의 WGS84 경도이며 격자 매핑 보조 정보다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lon
      - name: nx
        description: 장소에 대응하는 KMA 격자 X 좌표다.
        tests:
          - not_null
      - name: ny
        description: 장소에 대응하는 KMA 격자 Y 좌표다.
        tests:
          - not_null
      - name: mapping_method
        description: legacy 매핑 개정 label이며 유효 시작일 증거가 아니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - kma_admin_dong_grid_20260325
      - name: grid_distance_m
        description: 장소와 격자 기준점 사이 거리 m이며 계산되지 않은 경우 null이다.
      - name: source_admin_code
        description: KMA 안내 자료에 기록된 행정코드 후보이며 canonical dim과 exact join해야 한다.
        tests:
          - not_null
  - name: weather_admin_dong_grid_bridge_history
    description: legacy 427행을 손실 없이 복제하고 버전·기록 시각·시간 증거 품질을 추가한 append-only 행정동-격자 assertion seed다.
    config:
      meta:
        row_meaning_ko: source 행정코드·버전·격자에 대한 한 개의 mapping assertion이다.
        grain:
          - source_admin_code
          - bridge_version
          - nx
          - ny
        lifecycle: internal_candidate
        time_semantics_ko: recorded_at은 Git 최초 기록 시각이며 valid_from_at과 valid_to_at은 source 유효기간 증거 부재로 null이다.
        spatial_semantics_ko: source_admin_code는 후보 키이고 canonical 다섯 필드는 bridge 모델에서만 stamp한다.
        downstream:
          - bridge_weather_admin_dong_grid
          - W2_weather_public_gold
    columns:
      - name: place_id
        description: legacy mapping의 Weather 장소 식별자다.
      - name: place_name
        description: legacy mapping의 대표 장소명이다.
      - name: alias_names
        description: legacy mapping의 검색 별칭 목록이다.
      - name: legacy_gu
        description: legacy mapping에 기록된 자치구명으로 canonical 값이 아니다.
      - name: legacy_admin_dong
        description: legacy mapping에 기록된 행정동명으로 canonical 값이 아니다.
      - name: latitude
        description: legacy 장소의 WGS84 위도다.
      - name: longitude
        description: legacy 장소의 WGS84 경도다.
      - name: source_admin_code
        description: canonical 행정동 차원과 exact join할 원천 행정코드 후보다.
        tests:
          - not_null
      - name: bridge_version
        description: append-only bridge assertion 버전이며 v1은 weather_admin_dong_grid_bridge_v1이다.
        tests:
          - not_null
      - name: nx
        description: KMA 격자 X 좌표이며 candidate grain 구성요소다.
        tests:
          - not_null
      - name: ny
        description: KMA 격자 Y 좌표이며 candidate grain 구성요소다.
        tests:
          - not_null
      - name: legacy_mapping_method
        description: 원 seed의 mapping_method 원문을 보존한 값이다.
      - name: mapping_revision_label
        description: kma_admin_dong_grid_20260325 개정 label이며 유효 시작일로 해석하지 않는다.
      - name: recorded_at
        description: legacy seed가 Git에 최초 기록된 KST timestamp(6) 증거다.
      - name: valid_from_at
        description: source-backed 유효 시작 KST 시각이며 v1은 증거 부재로 null이다.
      - name: valid_to_at
        description: source-backed 유효 종료 KST 시각이며 v1은 증거 부재로 null이다.
      - name: effective_from_basis
        description: recorded_at과 source 유효 시작일을 구분하는 근거 설명 token이다.
      - name: mapping_method
        description: 이 assertion이 legacy seed exact copy로 생성됐음을 나타낸다.
      - name: temporal_quality
        description: 시간 구간 증거 품질이며 v1은 revision_only다.
      - name: grid_distance_m
        description: legacy 장소와 격자 기준점 사이 거리 m이며 미계산 시 null이다.
models:
  - name: silver_kma_vilage_fcst
    description: 기존 소비자 호환용 최신 KMA 예보 snapshot으로 place·grid·발표·예보·항목 grain을 유지한다.
    columns:
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - kma_vilage_fcst
      - name: place_id
        description: 수집 요청에 사용한 장소 식별자다.
        tests:
          - not_null
      - name: nx
        description: KMA 격자 X 좌표다.
        tests:
          - not_null
      - name: ny
        description: KMA 격자 Y 좌표다.
        tests:
          - not_null
      - name: category
        description: KMA 예보 항목 코드다.
        tests:
          - not_null
      - name: issued_at
        description: base_date와 base_time에서 만든 KST 발표 시각이다.
        tests:
          - not_null
      - name: forecast_at
        description: fcst_date와 fcst_time에서 만든 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같다.
        tests:
          - not_null
      - name: time_bucket
        description: forecast_at을 KST 시간 단위로 내린 호환 bucket이다.
        tests:
          - not_null
      - name: fcst_value_raw
        description: KMA 예보 값 원문이다.
        tests:
          - not_null
      - name: fcst_value_num
        description: 원문을 직접 double cast한 호환 수치이며 비수치 표현은 null이다.
      - name: value_representation
        description: 예보 값의 explicit_none·range·bare_numeric·정성 코드 등 표현 상태다.
      - name: value_num
        description: 표현 계약에 따라 파싱한 수치이며 bare_numeric은 별도 상태로 구분한다.
      - name: value_lower_bound
        description: 범위 표현의 포함 하한이며 해당 없으면 null이다.
      - name: value_upper_bound
        description: 범위 표현의 포함 상한이며 무상한 또는 해당 없으면 null이다.
      - name: qualitative_code
        description: PTY 또는 SKY 정성 코드 원문이며 해당 없으면 null이다.
      - name: forecast_lead_hours
        description: issued_at부터 forecast_at까지의 시간 차이다.
      - name: raw_object_key
        description: 선택 행의 R2 raw object lineage key다.
        tests:
          - not_null
      - name: payload_hash
        description: 선택 행의 raw payload 지문이다.
        tests:
          - not_null
      - name: total_count
        description: KMA 응답이 보고한 전체 item 수다.
        tests:
          - not_null
      - name: item_count
        description: 응답에서 파싱된 item 수다.
        tests:
          - not_null
      - name: load_date
        description: Bronze 적재 파티션 날짜다.
        tests:
          - not_null
      - name: collected_at
        description: 기존 호환 경로가 노출하는 수집 timestamp(6)다.
        tests:
          - not_null
      - name: dag_run_id
        description: 선택 행을 만든 Airflow 실행 식별자다.
        tests:
          - not_null
      - name: request_id
        description: 선택 행이 속한 API 요청 식별자다.
      - name: request_params_json
        description: secret 원문을 제외한 요청 조건 JSON이다.
  - name: silver_kma_vilage_fcst_observation
    description: publishable run/raw page에서 관측된 동일 KMA item signature를 한 행으로 접고 replay·invalid time·raw lineage를 보존한 내부 Silver다.
    config:
      meta:
        row_meaning_ko: 한 publishable Airflow run의 한 raw page에서 관측된 동일 KMA item signature다.
        grain:
          - dag_run_id
          - raw_object_key
          - page_no
          - source_item_key
        deduplication_ko: 같은 grain의 Bronze 중복을 한 행으로 접고 source_duplicate_count에 원 행 수를 보존한다.
        event_time: forecast_at
        ingest_time: collected_at
        incremental_key:
          - dag_run_id
          - raw_object_key
          - page_no
          - source_item_key
        late_arrival_policy_ko: 평시는 30분 inclusive lookback이고 더 오래된 repair는 W2가 소유한다.
        freshness_ko: manifest와 Bronze UTC 원문을 보존하고 KST collected_at·published_at을 별도로 노출한다.
        coverage_ko: invalid time·격자·category와 missing 또는 invalid page를 삭제하지 않고 Grid eligibility 상태로 보존한다.
        lifecycle: internal_candidate
        downstream:
          - silver_kma_vilage_fcst_grid
          - W2_weather_public_gold
    columns:
      - name: dag_run_id
        description: publishable Airflow 실행 식별자이며 observation grain 구성요소다.
        tests:
          - not_null
      - name: raw_object_key
        description: 원문 응답 R2 object key이며 observation grain 구성요소다.
        tests:
          - not_null
      - name: page_no
        description: 양수 source page 또는 legacy·invalid sentinel 0이며 null이 아닌 grain 구성요소다.
        tests:
          - not_null
      - name: source_item_key
        description: 순서 고정 tagged JSON 배열의 UTF-8 SHA-256 소문자 hex item key다.
        tests:
          - not_null
      - name: source_item_key_version
        description: item identity 정규화 규칙 버전이며 weather_kma_item_v1이다.
      - name: source_page_no
        description: Bronze page_no 원천값으로 legacy null을 그대로 보존한다.
      - name: page_no_state
        description: valid_positive·missing_legacy·invalid 중 page 품질 상태다.
      - name: source_duplicate_count
        description: 동일 observation grain으로 접힌 Bronze 원 행 수다.
      - name: request_id
        description: 접힌 행 중 결정적으로 보존한 API 요청 식별자다.
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
      - name: place_id
        description: 수집 요청에 사용한 장소 식별자다.
      - name: request_params_json
        description: secret 원문을 제외한 요청 조건 JSON이다.
      - name: base_date
        description: KMA 발표 날짜 원문이다.
      - name: base_time
        description: KMA 발표 시각 원문이다.
      - name: nx
        description: 파싱 가능한 경우의 KMA 격자 X 정수이며 invalid는 null일 수 있다.
      - name: ny
        description: 파싱 가능한 경우의 KMA 격자 Y 정수이며 invalid는 null일 수 있다.
      - name: category
        description: trim과 대문자 정규화한 KMA 항목 코드이며 비어 있으면 null이다.
      - name: category_raw
        description: KMA category 원문이며 item identity의 null과 비어 있는 값을 구분하는 데 사용한다.
      - name: fcst_date
        description: KMA 예보 대상 날짜 원문이다.
      - name: fcst_time
        description: KMA 예보 대상 시각 원문이다.
      - name: fcst_value_raw
        description: KMA 예보 값 원문이다.
      - name: issued_at
        description: 유효한 base parts에서 만든 KST timestamp(6)이며 invalid면 null이다.
      - name: forecast_at
        description: 유효한 forecast parts에서 만든 KST timestamp(6)이며 invalid면 null이다.
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같고 invalid면 null이다.
      - name: issued_time_parse_state
        description: 발표 시각 파싱 결과 valid 또는 invalid다.
      - name: forecast_time_parse_state
        description: 예보 시각 파싱 결과 valid 또는 invalid다.
      - name: time_parse_state
        description: 발표와 예보 시각이 모두 유효한지 나타내는 valid 또는 invalid 상태다.
      - name: grid_coordinate_state
        description: nx와 ny가 모두 양수인 valid 또는 Grid에서 제외할 invalid 좌표 상태다.
      - name: grid_category_state
        description: 정규화 category가 존재하는 valid 또는 Grid에서 제외할 missing 상태다.
      - name: grid_time_state
        description: issued_at과 forecast_at이 모두 유효한 valid 또는 Grid에서 제외할 invalid 시간 상태다.
      - name: grid_eligibility_state
        description: 좌표·category·시간 조건을 모두 충족한 eligible 또는 사유 상태를 observation에 보존한 excluded 값이다.
      - name: result_code
        description: KMA 응답 결과 코드이며 observation은 00만 포함한다.
      - name: result_msg
        description: KMA 응답 결과 메시지다.
      - name: http_status
        description: 수집 시 기록한 HTTP 상태 코드다.
      - name: payload_hash
        description: raw payload 내용 지문이다.
      - name: total_count
        description: KMA 응답이 보고한 전체 item 수다.
      - name: item_count
        description: 응답에서 파싱된 item 수다.
      - name: load_date
        description: Bronze 적재 파티션 날짜 문자열이다.
      - name: bronze_collected_at_utc
        description: Bronze가 기록한 UTC 수집 timestamp(6) 원문이다.
      - name: manifest_event_at_utc
        description: 선택된 manifest의 UTC 이벤트 timestamp(6) 원문이다.
      - name: collected_at
        description: bronze_collected_at_utc를 +9시간 변환한 KST 수집 timestamp(6)다.
      - name: published_at
        description: manifest_event_at_utc를 +9시간 변환한 KST 발행 timestamp(6)다.
      - name: collection_dag_id
        description: 선택된 manifest가 기록한 collection DAG 식별자다.
      - name: manifest_status
        description: 선택된 manifest 상태이며 SUCCESS다.
      - name: is_publishable
        description: 선택된 manifest의 발행 허용 값이며 true다.
      - name: manifest_expected_rows
        description: manifest가 기대한 Bronze item 행 수다.
      - name: manifest_actual_rows
        description: manifest가 실제 적재했다고 기록한 Bronze item 행 수다.
      - name: manifest_expected_raw_objects
        description: manifest가 기대한 raw object 수다.
      - name: manifest_actual_raw_objects
        description: manifest가 실제 업로드했다고 기록한 raw object 수다.
      - name: manifest_failure_reason
        description: manifest 실패 사유이며 publishable SUCCESS에서는 보통 null이다.
  - name: silver_kma_vilage_fcst_grid
    description: 유효한 observation 중 결정적으로 선택된 nx·ny·발표·예보·항목 단위 native KMA 예보 사실 내부 Silver다.
    config:
      meta:
        row_meaning_ko: 동일 native Grid 예보 사실에서 tie-break로 선택된 한 observation이다.
        grain:
          - nx
          - ny
          - issued_at
          - forecast_at
          - category
        deduplication_ko: collected_at·raw_object_key·request_id·dag_run_id·page_no·source_item_key 내림차순으로 한 행을 선택한다.
        event_time: forecast_at
        ingest_time: collected_at
        incremental_key:
          - nx
          - ny
          - issued_at
          - forecast_at
          - category
        late_arrival_policy_ko: 평시는 30분 inclusive lookback이며 explicit cutoff repair는 W2가 소유한다.
        coverage_ko: 양수 격자·비어 있지 않은 category·유효한 발표와 예보 시각만 Grid eligible이다.
        lifecycle: internal_candidate
        downstream:
          - W2_weather_public_gold
          - A1_weather_dag_gate
    columns:
      - name: nx
        description: KMA 격자 X 양수 좌표이며 Grid grain 구성요소다.
        tests:
          - not_null
      - name: ny
        description: KMA 격자 Y 양수 좌표이며 Grid grain 구성요소다.
        tests:
          - not_null
      - name: issued_at
        description: KST 발표 timestamp(6)이며 Grid grain 구성요소다.
        tests:
          - not_null
      - name: forecast_at
        description: KST 예보 대상 timestamp(6)이며 Grid grain 구성요소다.
        tests:
          - not_null
      - name: category
        description: KMA 예보 항목 코드이며 Grid grain 구성요소다.
        tests:
          - not_null
      - name: category_raw
        description: 선택 observation이 보존한 KMA category 원문이다.
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같다.
      - name: time_bucket
        description: forecast_at을 KST 시간 단위로 내린 호환 bucket이다.
      - name: request_id
        description: 선택 observation의 API 요청 식별자다.
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
      - name: source_grid_place_id
        description: 선택 observation이 보존한 수집 장소 식별자다.
      - name: request_params_json
        description: secret 원문을 제외한 요청 조건 JSON이다.
      - name: fcst_value_raw
        description: 선택 observation의 KMA 예보 값 원문이다.
      - name: fcst_value_num
        description: 원문 direct double cast 호환값이며 비수치 표현은 null이다.
      - name: value_representation
        description: explicit_none·range·bare_numeric·정성 코드 등 값 표현 상태다.
      - name: value_num
        description: 기존 kma_value_semantics가 파싱한 수치이며 bare_numeric은 상태로 분리된다.
      - name: value_lower_bound
        description: 범위 표현의 포함 하한이며 해당 없으면 null이다.
      - name: value_upper_bound
        description: 범위 표현의 포함 상한이며 해당 없으면 null이다.
      - name: qualitative_code
        description: PTY 또는 SKY 정성 코드 원문이며 해당 없으면 null이다.
      - name: forecast_lead_hours
