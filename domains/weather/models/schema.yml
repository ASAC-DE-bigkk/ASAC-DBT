      - name: fcst_value_num
        description: 원문을 직접 double로 변환할 수 있을 때만 채운 호환 수치입니다.
        data_type: double
        config:
          meta:
            semantic_role: compatibility_value
            nullable: true
            null_meaning: 단위나 범위 또는 정성 표현이라 직접 수치 변환이 불가능한 상태입니다.
      - name: value_representation
        description: 예보 값 원문의 없음과 점값 및 범위와 코드와 결측을 구분한 표현 상태입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: 값 표현 상태를 분류하지 못한 행은 공개하지 않습니다.
      - name: value_num
        description: 확정 수치 또는 단위 미확정 bare numeric에서 보존한 double 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 명시적 없음과 범위 및 정성 코드와 결측에는 단일 수치가 없습니다.
      - name: value_lower_bound
        description: 범위 예보 표현의 포함 하한이며 해당하지 않으면 null입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 범위 표현이 아니거나 안전한 하한을 만들 수 없는 상태입니다.
      - name: value_upper_bound
        description: 범위 예보 표현의 상한이며 이상 표현의 무상한과 비범위 값은 null입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 상한이 없거나 범위 표현이 아니어서 적용할 값이 없습니다.
      - name: qualitative_code
        description: PTY 또는 SKY가 제공한 정성 상태 코드 원문입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: categorical_value
            nullable: true
            null_meaning: 해당 예보 항목이 정성 코드 항목이 아닙니다.
      - name: forecast_lead_hours
        description: 발표 시각부터 예보 대상 시각까지의 시간 차이입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: derived_value
            nullable: false
            null_meaning: 발표와 예보 시각이 모두 있어야 하므로 null을 허용하지 않습니다.
      - name: source_id
        description: KMA 단기예보 원천을 식별하는 안정 식별자입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 원천 시스템을 추적할 수 없는 행은 공개하지 않습니다.
      - name: dag_run_id
        description: 선택한 예보 행을 만든 수집 DAG 실행 식별자입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 수집 실행으로 역추적할 수 없는 행은 공개하지 않습니다.
      - name: raw_object_key
        description: 선택한 예보 행의 원본 객체를 추적하는 안정 식별자입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 원본 객체로 역추적할 수 없는 행은 공개하지 않습니다.
      - name: request_id
        description: 선택한 예보 행의 외부 API 요청 식별자입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 외부 요청으로 역추적할 수 없는 행은 공개하지 않습니다.
  - name: gold_weather_forecast_summary
    description: 기존 최신 Weather Silver snapshot을 source_id별로 집계한 원천 수준 호환 요약이며 question-grain 조인 Gold가 아니다.
    columns:
      - name: source_id
        description: 집계 대상 원천 식별자이며 한 행의 grain이다.
        tests:
          - not_null
          - unique
      - name: row_count
        description: 현재 호환 Silver 행 수다.
        tests:
          - not_null
      - name: raw_object_count
        description: 현재 호환 Silver가 참조하는 raw object 고유 수다.
        tests:
          - not_null
      - name: first_forecast_at
        description: 현재 snapshot의 가장 이른 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_forecast_at
        description: 현재 snapshot의 가장 늦은 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_collected_at
        description: 현재 snapshot의 가장 늦은 수집 timestamp(6)다.
        tests:
          - not_null
  - name: silver_weather_forecast_by_admin_dong
    description: 기존 Grid 호환 Silver를 legacy place mapping으로 fan-out한 장소 단위 호환 Silver이며 canonical W1 bridge 경로가 아니다.
    columns:
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - kma_vilage_fcst
      - name: place_id
        description: legacy mapping의 행정동 장소 식별자다.
        tests:
          - not_null
      - name: source_grid_place_id
        description: fan-out 전 Grid Silver가 보존한 수집 장소 식별자다.
        tests:
          - not_null
      - name: latitude
        description: legacy 장소의 WGS84 위도다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lat
      - name: longitude
        description: legacy 장소의 WGS84 경도다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lon
      - name: admin_dong_code
        description: 기존 dim_weather_place self-copy 호환 코드이며 신규 canonical 증거로 사용하지 않는다.
        tests:
          - not_null
          - asac_axes.axis_coverage:
              arguments:
                min_ratio: 1.0
      - name: gu_code
        description: 기존 코드 prefix 호환값이며 신규 canonical 증거로 사용하지 않는다.
        tests:
          - not_null
      - name: issued_at
        description: KST 발표 timestamp(6)다.
        tests:
          - not_null
      - name: forecast_at
        description: KST 예보 대상 timestamp(6)다.
        tests:
          - not_null
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같다.
        tests:
          - not_null
      - name: category
        description: KMA 예보 항목 코드다.
        tests:
          - not_null
      - name: collected_at
        description: 선택 예보 행의 수집 timestamp(6)다.
        tests:
          - not_null
