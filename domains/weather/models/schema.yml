            time_role: collection
            timezone: Asia/Seoul
      - name: published_at
        description: manifest가 실행을 게시 가능하다고 확정한 서울 기준 timestamp(6)입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
