transit:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    prod:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      database: "{{ env_var('TRINO_ICEBERG_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('TRANSIT_SCHEMA', 'transit') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300

    dev:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      database: "{{ env_var('TRINO_DEV_ICEBERG_CATALOG', 'iceberg_dev') }}"
      # 도메인 공용 스키마(#204): prod/dev 동일 transit, 환경 분리는 카탈로그가 담당.
      # DAG 적재(bronze)와 같은 TRANSIT_SCHEMA 를 읽어야 bronze·silver 동일 스키마(#51)가 유지된다.
      schema: "{{ env_var('TRANSIT_SCHEMA', 'transit') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300
