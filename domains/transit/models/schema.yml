version: 2

models:
  # ---------------- 차원 ----------------
  - name: dim_transit_station
    description: >
      지하철 역사 차원(최신 load_date). PK station_id(bldn_id). 실시간 arrival 조인용
      정규화 컬럼 station_name_join(괄호 제거) + route 노출. 공간축 부착.
    columns:
      - name: station_id
        description: 역사 코드(bldn_id) — PK.
        tests:
          - not_null:
              config:
                tags: [gate]
          - unique:
              config:
                tags: [gate]
      - name: station_name
        tests:
          - not_null:
              config:
                tags: [hourly]
      - name: route
        tests:
          # gate: (station_name_join, route) 조인 유일성 계약의 축 — 대량 null 회귀는
          # 매핑 결손으로 이어지므로 15분 게이트가 잡는다(애매하면 gate 원칙).
          - not_null:
              config:
                tags: [gate]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
              config:
                tags: [hourly]
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
              config:
                tags: [hourly]
      - name: admin_dong_code
        description: >
          행안부 10자리. 마스터 784역 중 서울 행정경계 내 ~400역만 할당됨(coverage≈0.51).
          나머지는 bbox(느슨한 사각형) 안이나 경기·인천(철산·부천·부평·별내 등) 소속이라 NULL.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.50}
              config:
                tags: [hourly]
      - name: gu_code
        description: 행안부 5자리(자치구).

  - name: dim_transit_parking
    description: >
      주차장 차원(최신 load_date). PK parking_id(pklt_cd). 공간축 부착 + addr_gu(주소 자치구 토큰)
      + 운영 컬럼(평일/주말 운영시간, 유·무료, 야간개방 — "운영시간 내 점유율" 분석 재료).
    columns:
      - name: parking_id
        tests:
          - not_null:
              config:
                tags: [gate]
          - unique:
              config:
                tags: [gate]
      - name: parking_name
        tests:
          - not_null:
              config:
                tags: [hourly]
      - name: wd_oper_bgng_tm
        description: 평일 운영 시작시각(HHMM 문자열 그대로, '0000/0000'=미상 존재).
      - name: wd_oper_end_tm
        description: 평일 운영 종료시각(HHMM, '2400' 표기·자정 넘김 '0100' 존재).
      - name: we_oper_bgng_tm
        description: 주말 운영 시작시각(HHMM).
      - name: we_oper_end_tm
        description: 주말 운영 종료시각(HHMM).
      - name: night_free_open_yn_nm
        description: 야간 무료 개방 여부 명칭(원천 nght_free_opn_yn_name, 예 '야간 미개방').
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
              config:
                tags: [hourly]
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
              config:
                tags: [hourly]
      - name: admin_dong_code
        description: >
          좌표 0.0(미상) 주차장이 다수라 커버리지 제한. 마스터 850개 lot 중 유효좌표
          118개만 행정동 할당(coverage≈0.14). 실시간에 실제 쓰이는 lot 은 대부분 유효좌표라
          silver_transit_parking 에서는 커버리지 0.96.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.12}
              config:
                tags: [hourly]

  # ---------------- 실버 ----------------
  # 테스트 스코핑(B안): 성장하는 incremental 모델의 행 단위 테스트(not_null·accepted_values·
  # in_seoul_bbox·unique_combination)는 최근 var(transit_test_lookback_days)일만 검증한다
  # — 아카이브가 커져도 test 비용이 상수(vars 주석 참조). 단,
  #   · 시간축 컬럼 자신의 not_null 은 스코핑하지 않는다: 자기 컬럼 where 가 null 을 먼저
  #     걸러 공검증(항상 통과)이 된다. 전량 유지해도 Iceberg null-count 프루닝으로 저렴.
  #   · axis_coverage 는 전 이력 실측으로 임계를 캘리브레이션(0.45/0.85 등)한 비율 테스트라
  #     윈도를 좁히면 표본 구성이 달라져 오탐한다 — 재캘리브레이션 전까지 전량 유지.
  # 테스트 티어(A안): tag:gate = 그레인 unique·키/시간축 not_null·freshness 계약 —
  #   transit_transform 의 매 15분 dbt build 가 실행(계약 게이트 유지). tag:hourly =
  #   range/enum/coverage/파생·속성 not_null·warn 감시 — 같은 DAG 의 시간당 1회 분기
  #   (dbt_test_rest)가 실행(검출 지연 최대 1시간 감수, 쿼리 개수 부담 완화).
  #   무태그 테스트는 fresh build 에 남는다(신규 테스트의 보수적 기본값). heavy 모델
  #   테스트는 태그 없이 heavy DAG 의 build --select tag:heavy 소관(모델 tags 상속).
  - name: silver_transit_parking
    description: >
      주차장 실시간 정제. grain (parking_id, event_at). event_at=NOW_PRK_VHCL_UPDT_TM KST.
      공간축은 dim_transit_parking 조인.
    columns:
      - name: parking_id
        tests:
          - not_null:
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: event_at
        description: 도메인 대표시각(주차 현황 갱신, KST).
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증), 섹션 주석 참조
              config:
                tags: [gate]
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: admin_dong_code
        description: dim_transit_parking 조인. 실시간 lot 은 대부분 유효좌표(coverage≈0.96).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.90}
              config:
                tags: [hourly]

  - name: silver_transit_subway_arrival
    description: >
      지하철 도착정보 정제. grain (statn_id, ordkey, recptn_dt). event_at=recptnDt KST.
      공간축은 dim_transit_station 조인('역명+노선', subwayId→route seed 변환).
    columns:
      - name: statn_id
        tests:
          - not_null:
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: event_at
        description: 도메인 대표시각(도착정보 수신, KST).
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: route
        description: seoul_subway_line_code seed 로 subwayId 에서 변환한 노선 라벨.
      - name: is_last_train
        description: >
          막차 여부(원천 lstcarAt 0/1 → int). '_at' 접미사는 공통축 계약상 KST timestamp
          전용이라 여부형 이름으로 명명.
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: terminal_statn_nm
        description: 종착(행선지) 역명(원천 bstatnNm).
      - name: transfer_line_cnt
        description: 해당 역 환승 노선 수(원천 trnsitCo, int).
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: admin_dong_code
        description: >
          dim_transit_station 조인. 수집이 경로형 ALL(#369)로 바뀌며 수도권 전 역이
          들어와, 경기·인천 역(부천·소사·개봉 등)은 서울 행정동이 없어 NULL 이 정상이다
          — 실측 커버리지 0.48(dim_transit_station 의 0.51 과 같은 사유). 임계는
          '서울 역이 정상 부착되는가'를 지키는 선으로 잡는다(6역 한정 수집 시절의
          0.90 은 ALL 전환 후 구조적으로 달성 불가).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.45}
              config:
                tags: [hourly]

  - name: silver_transit_bus_position
    description: >
      버스 실시간 위치 정제(XML regexp+UNNEST 파싱). grain (veh_id, data_tm).
      event_at=dataTm KST. gpsX/gpsY→경위도 직접 + 행정동 런타임 할당.
    columns:
      - name: veh_id
        tests:
          - not_null:
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: event_at
        description: 도메인 대표시각(버스 위치 관측, KST).
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: stop_flag
        description: 정차 여부(원천 stopFlag 0/1 → int, 1=정류소 정차 중).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: is_full
        description: 만차 여부(원천 isFullFlag 0/1 → int).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: is_last_bus
        description: 막차 여부(원천 islastyn 0/1 → int).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: rt_dist_km
        description: 노선 누적 진행거리 km(원천 rtDist, 실증 39.65~62.2 → 노선 왕복 수십 km 스케일).
      - name: full_sect_dist_km
        description: 현재 구간 전체거리 km(원천 fullSectDist, 실증 0.095~3.584 → 정류장 간 수백 m 스케일).
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
              config:
                where: "event_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]
      - name: admin_dong_code
        description: >
          런타임 point-in-polygon 할당. 수집이 전 노선(ALL, #369)으로 바뀌며 서울
          외곽·수도권 경계 노선의 정류장이 서울 행정경계 밖에 찍혀 NULL 이 되는 게
          정상이다(실측 0.90 — 시간대·운행 노선 구성에 따라 변동, 출퇴근엔 외곽
          노선이 더 운행). 지하철 admin_dong_code(0.45)와 같은 ALL 전환 사유이며,
          6노선 한정 수집 시절의 0.90 은 마진이 없어 조금만 외곽이 섞여도 깨진다.
          임계는 '서울 노선이 정상 부착되는가'를 지키는 선(0.85)으로 낮춘다 —
          좌표 파싱 대량 실패 등 진짜 회귀는 이 밑에서 잡힌다.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.85}
              config:
                tags: [hourly]

  # ---------------- 골드 ----------------
  - name: gold_transit_dong_hourly
    config:
      meta:
        # Serving Contract v1 (#478, dags/docs/contracts/serving-contract-v1.md) —
        # 구 serving_tier·refresh·external 을 meta.serving 으로 대체(계약 §9 마이그레이션).
        serving:
          enabled: true
          external: true
          product_id: transit_dong_hourly
          # 지시대명사 금지 — AI 가 읽는 입력이라 "이 행정동은" 이면 값을 되묻고 끝난다
          # (ASK-Seoul-Serving#189, citydata 선례 ASAC-DBT#474). 커버리지가 부분(값이
          # 있는 동·시간만)이라 숫자는 넣지 않는다.
          product_question: 서울 행정동별 교통 상태는 시간대에 따라 어떻게 달라집니까?
          grain: (admin_dong_code, hour_at)마다 한 행 — 동×시간 교통 이력.
          primary_key: [admin_dong_code, hour_at]
          publication_mode: append          # 최근 구간 삭제→재삽입 (lookback 2h, runtime 상수)
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "40 * * * *"     # 3-tier hourly 주기 승계 (ASAC-DAG#475)
          event_time: hour_at
          # 버킷 완결 대기(60분) + 변환 1시간 주기 + 게시 :40 이 겹치면 건강해도 ~2h 지연 —
          # dong_now 75분(내재지연 실측 보정, #475)과 같은 논리로 한 사이클 여유를 더해 180분.
          freshness_slo_minutes: 180
          shape: rollup
          # source_evidence — source_id는 원천 source 노드명과 일치시킨다(parking_full_risk 관례).
          # dbt 계보 기준: 실시간 3종(subway_arrival·parking·bus_position) + 각 silver/dim 이 읽는
          # 마스터 1종(park_info_master). 좌표→행정동 배정에 쓰는 공통 공간축(asac_axes)은
          # citydata·traffic 선례대로 제품 원천 목록에 넣지 않는다(원천 데이터만 선언).
          source_evidence:
            - source_id: subway_arrival
              source_url: https://data.seoul.go.kr/dataList/OA-12764/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: subway_station_master
              source_url: https://data.seoul.go.kr/dataList/OA-21232/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: bus_position
              source_url: https://www.data.go.kr/data/15000332/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: parking
              source_url: https://data.seoul.go.kr/dataList/OA-21709/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: park_info_master
              source_url: https://data.seoul.go.kr/dataList/OA-13122/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
          # usage_patterns 3건(DBT#434 기준: 외부 유지 제품은 예시 3건 이상). hour_at 은
          # 포맷 혼재(마이크로초 유무)라 시각 축 추출은 strftime 대신 substr 로 고정.
          usage_patterns:
            - pattern_id: dong_day_timeline
              question_ko: 이 동네는 그날 시간대별로 얼마나 붐볐나?
              axes: 필터(동, 날짜) — 시간 오름차순 타임라인
              requires: [select_columns, filter_set, sort]
              sql: |
                -- :dong=1165054000(행정동 코드), :date=2026-08-01
                SELECT hour_at, bus_congestion_avg, bus_veh_cnt, subway_arrival_cnt, parking_occupancy_avg
                FROM gold_transit_dong_hourly
                WHERE admin_dong_code = :dong AND substr(hour_at, 1, 10) = :date
                ORDER BY hour_at
              verified_rows: 12
              verified_at: "2026-08-05"
              allow_empty: true   # 그 날짜에 관측이 없는 동은 0행이 정상
            - pattern_id: dong_peak_hours
              question_ko: 이 동네는 보통 몇 시에 버스가 가장 붐비나?
              axes: 시간대 집계 — 버스 혼잡 평균 DESC (버스 축만 — 타 소스 평균을 버스 관측 시간대로 좁히지 않기 위함)
              requires: [select_columns, aggregate, group_by, filter_set, filter_null, sort]
              param_defaults: { n: 5 }
              sql: |
                -- :dong=1165054000, :n=5
                SELECT substr(hour_at, 12, 2) AS hh,
                       ROUND(AVG(bus_congestion_avg), 3) AS bus_congestion,
                       COUNT(*) AS observed_hours
                FROM gold_transit_dong_hourly
                WHERE admin_dong_code = :dong AND bus_congestion_avg IS NOT NULL
                GROUP BY hh
                ORDER BY bus_congestion DESC LIMIT :n
              verified_rows: 5
              verified_at: "2026-08-05"
              allow_empty: true   # 버스 관측이 전무한 동(주차·지하철만 있는 동 실재)은 0행이 정상
            - pattern_id: busiest_dongs_at_hour
              question_ko: 특정 시각에 버스가 가장 혼잡했던 동네는?
              axes: 동 랭킹(시각 고정) — 버스 혼잡 평균 DESC
              requires: [select_columns, filter_set, filter_null, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :at=2026-08-01 18:00:00, :n=10 — 정확 일치 대신 substr: 마이크로초 붙은 이력 행도 매칭
                SELECT admin_dong_code, bus_congestion_avg, bus_veh_cnt
                FROM gold_transit_dong_hourly
                WHERE substr(hour_at, 1, 19) = :at AND bus_congestion_avg IS NOT NULL
                ORDER BY bus_congestion_avg DESC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
            - pattern_id: "rank_dim_by_metric_window"
              question_ko: "요즘 어느 동네(또는 자치구)가 버스 혼잡/지하철 대기/주차 점유가 가장 심한가(또는 가장 여유로운가)?"
              axes: "차원(동/구) 랭킹 — 지표·정렬·기간 스위치, 관측 시간 임계값 이상만. busiest_dongs_at_hour(단일 시각·버스만)의 상위호환(기간 평균·다지표·양방향·구 집계)"
              verified_rows: 0                # 실 D1 실측: [10, 10, 10, 10] (스탬핑 대기)
              insight_sample_ko: "2026-07-20~26 자치구(행정동코드 앞 5자리) 평균 버스 혼잡 1위는 11650, 평균 6.012 (관측 171시간)."
              sql: |
                -- :dim=gu, :metric=bus_congestion, :from=2026-07-20, :to=2026-07-26, :min_hours=20, :dir=desc, :n=10
                WITH base AS (
                  SELECT CASE :dim WHEN 'gu' THEN substr(admin_dong_code, 1, 5) ELSE admin_dong_code END AS dim_value,
                    CASE :metric
                      WHEN 'bus_congestion' THEN bus_congestion_avg
                      WHEN 'subway_wait' THEN subway_wait_avg_s
                      WHEN 'subway_arrivals' THEN subway_arrival_cnt
                      WHEN 'parking_occupancy' THEN parking_occupancy_avg
                      WHEN 'bus_full' THEN bus_full_ratio
                      WHEN 'subway_last_train' THEN subway_last_train_cnt
                      ELSE bus_congestion_avg END AS m
                  FROM gold_transit_dong_hourly
                  WHERE substr(hour_at, 1, 10) BETWEEN :from AND :to
                )
                SELECT dim_value,
                       ROUND(AVG(m), 3) AS metric_value,
                       COUNT(m) AS observed_hours
                FROM base
                WHERE m IS NOT NULL
                GROUP BY dim_value
                HAVING COUNT(m) >= :min_hours
                ORDER BY CASE WHEN :dir = 'asc' THEN metric_value END ASC,
                         CASE WHEN :dir = 'desc' THEN metric_value END DESC
                LIMIT :n
              requires: [select_columns, subquery, aggregate, group_by, filter_range, filter_null, having, sort]
              param_defaults: { min_hours: 20, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "dong_typical_day_profile"
              question_ko: "이 동네의 하루 리듬은? 시간대별로 버스·지하철·주차가 어떻게 달라지나?"
              axes: "단일 동 시간대(0-23) 프로파일 — 버스 혼잡·지하철 도착/대기·주차 점유 다지표 평균을 한 행에. dong_peak_hours(버스 단일지표 상위 n시각)의 다지표 프로파일판"
              verified_rows: 0                # 실 D1 실측: [24, 24] (스탬핑 대기)
              insight_sample_ko: "동 1150064000의 00시대 평균 — 버스 혼잡 3.0, 지하철 도착 190.5건, 대기 375초, 주차 점유 0.605 (관측 2시간)."
              sql: |
                -- :dong=1150064000
                SELECT substr(hour_at, 12, 2) AS hh,
                       ROUND(AVG(bus_congestion_avg), 3) AS bus_congestion,
                       ROUND(AVG(subway_arrival_cnt), 1) AS subway_arrivals,
                       ROUND(AVG(subway_wait_avg_s), 0) AS subway_wait_s,
                       ROUND(AVG(parking_occupancy_avg), 3) AS parking_occupancy,
                       COUNT(*) AS observed_hours
                FROM gold_transit_dong_hourly
                WHERE admin_dong_code = :dong
                GROUP BY hh
                ORDER BY hh
              requires: [select_columns, aggregate, group_by, filter_set, sort]
            - pattern_id: "dong_dayofweek_profile"
              question_ko: "이 동네는 요일에 따라 혼잡/대기 패턴이 어떻게 다른가? 주중과 주말 중 언제 더 붐비나?"
              axes: "단일 동 요일(0=일~6=토)별 지표 평균 — 지표 스위치. 시간대(hour-of-day) 축과 직교하는 요일 축"
              verified_rows: 0                # 실 D1 실측: [7, 7] (스탬핑 대기)
              insight_sample_ko: "동 1150064000의 일요일(dow=0) 평균 버스 혼잡 3.0 (관측 1시간 — 레플리카 표본)."
              sql: |
                -- :dong=1150064000, :metric=bus_congestion
                SELECT strftime('%w', hour_at) AS dow,
                       ROUND(AVG(CASE :metric
                         WHEN 'bus_congestion' THEN bus_congestion_avg
                         WHEN 'subway_wait' THEN subway_wait_avg_s
                         WHEN 'subway_arrivals' THEN subway_arrival_cnt
                         WHEN 'parking_occupancy' THEN parking_occupancy_avg
                         ELSE bus_congestion_avg END), 3) AS metric_value,
                       COUNT(*) AS observed_hours
                FROM gold_transit_dong_hourly
                WHERE admin_dong_code = :dong
                GROUP BY dow
                ORDER BY dow
              requires: [select_columns, aggregate, group_by, filter_set, sort]
            - pattern_id: "city_hourly_trend"
              question_ko: "서울 전체로 이 기간 시간대별 대중교통 이용/혼잡 추이는?"
              axes: "서울 전체 시간별 타임라인 — 동 합산 지하철 도착·버스 대수와 평균 버스 혼잡. 동 단위 dong_day_timeline과 직교하는 도시 전역 시계열"
              verified_rows: 0                # 실 D1 실측: [23, 48] (스탬핑 대기)
              insight_sample_ko: "2026-07-20 00시 서울 57개 동 합산 — 지하철 도착 379건, 버스 303대, 평균 버스 혼잡 3.087."
              sql: |
                -- :from=2026-07-20, :to=2026-07-20, :n=200
                SELECT substr(hour_at, 1, 13) AS hour_slot,
                       COUNT(DISTINCT admin_dong_code) AS dongs,
                       SUM(subway_arrival_cnt) AS subway_arrivals,
                       SUM(bus_veh_cnt) AS bus_vehicles,
                       ROUND(AVG(bus_congestion_avg), 3) AS bus_congestion
                FROM gold_transit_dong_hourly
                WHERE substr(hour_at, 1, 10) BETWEEN :from AND :to
                GROUP BY hour_slot
                ORDER BY hour_slot
                LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_range, sort]
              param_defaults: { n: 200 }
            - pattern_id: "dong_metric_threshold_hours"
              question_ko: "이 동네에서 버스 혼잡(또는 지하철 대기/주차 점유)이 임계값을 넘긴 시간은 언제였나?"
              axes: "단일 동 임계 초과 시간 목록 — 지표 스위치·임계값, 지표값 DESC(가장 심했던 순). dong_day_timeline(특정 하루 전체)과 달리 전체 이력에서 극단 시각만 추출"
              verified_rows: 0                # 실 D1 실측: [20, 20, 20] (스탬핑 대기)
              insight_sample_ko: "동 1114057000에서 버스 혼잡 4 이상인 시간 18건, 최고는 2026-07-24 23시 혼잡 16.75(버스 4대)."
              sql: |
                -- :dong=1114057000, :metric=bus_congestion, :thr=4, :n=20
                WITH base AS (
                  SELECT hour_at, bus_congestion_avg, bus_veh_cnt, subway_wait_avg_s,
                    CASE :metric
                      WHEN 'bus_congestion' THEN bus_congestion_avg
                      WHEN 'subway_wait' THEN subway_wait_avg_s
                      WHEN 'parking_occupancy' THEN parking_occupancy_avg
                      WHEN 'bus_full' THEN bus_full_ratio
                      ELSE bus_congestion_avg END AS m
                  FROM gold_transit_dong_hourly
                  WHERE admin_dong_code = :dong
                )
                SELECT hour_at, ROUND(m, 3) AS metric_value,
                       bus_congestion_avg, bus_veh_cnt, subway_wait_avg_s
                FROM base
                WHERE m >= :thr
                ORDER BY m DESC
                LIMIT :n
              requires: [select_columns, subquery, filter_set, filter_range, sort]
              param_defaults: { n: 20 }
            - pattern_id: "dongs_rank_at_hour_metric"
              question_ko: "이 시각에 지하철 대기(또는 버스 혼잡/주차 점유)가 가장 심했던(또는 가장 여유로운) 동네는?"
              axes: "특정 시각 고정 동 랭킹 — 지표·정렬 방향 스위치. busiest_dongs_at_hour(버스 혼잡·DESC 고정)의 상위호환(지하철·주차 포함, 양방향)"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "2026-07-20 11시 지하철 대기 최장 동은 1171053100, 758.25초(버스 25대·지하철 도착 80건)."
              sql: |
                -- :at=2026-07-20 11:00:00, :metric=subway_wait, :dir=desc, :n=10
                WITH base AS (
                  SELECT admin_dong_code, bus_veh_cnt, subway_arrival_cnt,
                    CASE :metric
                      WHEN 'bus_congestion' THEN bus_congestion_avg
                      WHEN 'subway_wait' THEN subway_wait_avg_s
                      WHEN 'subway_arrivals' THEN subway_arrival_cnt
                      WHEN 'parking_occupancy' THEN parking_occupancy_avg
                      WHEN 'bus_full' THEN bus_full_ratio
                      ELSE bus_congestion_avg END AS m
                  FROM gold_transit_dong_hourly
                  WHERE substr(hour_at, 1, 19) = :at
                )
                SELECT admin_dong_code, ROUND(m, 3) AS metric_value, bus_veh_cnt, subway_arrival_cnt
                FROM base
                WHERE m IS NOT NULL
                ORDER BY CASE WHEN :dir = 'asc' THEN m END ASC,
                         CASE WHEN :dir = 'desc' THEN m END DESC
                LIMIT :n
              requires: [select_columns, subquery, filter_set, filter_null, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "dong_congestion_band_distribution"
              question_ko: "이 동네의 버스 혼잡도는 어느 구간에 얼마나 분포하나?"
              axes: "단일 동 버스 혼잡도 밴드 분포 — 밴드별 시간수·평균 버스대수·평균 만차비율. 랭킹/타임라인과 다른 분포(히스토그램) 축"
              verified_rows: 0                # 실 D1 실측: [3, 1] (스탬핑 대기)
              insight_sample_ko: "동 1114057000은 3개 혼잡 밴드에 분포 — 최저 밴드 2_normal 3시간(평균 3.0대), 상위 밴드에 severe 구간 존재."
              sql: |
                -- :dong=1114057000
                SELECT CASE
                         WHEN bus_congestion_avg < 3 THEN '1_calm'
                         WHEN bus_congestion_avg < 4 THEN '2_normal'
                         WHEN bus_congestion_avg < 6 THEN '3_busy'
                         ELSE '4_severe' END AS congestion_band,
                       COUNT(*) AS hours,
                       ROUND(AVG(bus_veh_cnt), 1) AS avg_vehicles,
                       ROUND(AVG(bus_full_ratio), 3) AS avg_full_ratio
                FROM gold_transit_dong_hourly
                WHERE admin_dong_code = :dong AND bus_congestion_avg IS NOT NULL
                GROUP BY congestion_band
                ORDER BY congestion_band
              requires: [select_columns, aggregate, group_by, filter_set, filter_null, sort]
          display:
            title: 행정동별 시간대 교통 이력
            summary: 행정동마다 시간대별 버스·지하철·주차 상태를 쌓아 온 이력입니다.
            caveat: 한 시간 안에 잡힌 관측들의 평균이라 연속 측정이 아닙니다. 값이 있는 동·시간만 유효하며, 관측 수가 적은 칸은 대표성이 약할 수 있습니다.
            use_cases:
              - 동네 교통 시계열 분석
              - 시간대별 혼잡 패턴 리포트
              - 상권·인구 데이터와 교차 분석
    description: >
      동×시간대 교통 상태판(#67). grain (admin_dong_code, hour_at). hour_at=date_trunc('hour',
      event_at) KST. silver 3종(버스·지하철·주차)을 동·시간으로 집계해 한 행에 나란히(3원 outer 결합
      — 한 소스만 있는 조합도 행 생성). 지하철은 역 3곳(4개 동)에만 존재해 대부분 행에서 subway_* null.
      정화된 silver(#66)만 소비하므로 추가 시간 필터 없음. incremental merge(-3h lookback).
    tests:
      # 서빙 계약 복합 PK 근거 — validator 가 unique_combination 이름으로 인정(#478, culture #346 관례).
      # 스코핑(B안): incremental merge lookback 3h ≪ 윈도 — 신규 갱신 버킷의 중복은 윈도 내에서 잡힌다.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, hour_at]
          config:
            where: "hour_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
            tags: [gate]
    columns:
      - name: admin_dong_code
        description: 행안부 10자리 행정동 코드(공간축). null 행은 소스에서 제외.
        tests:
          - not_null:
              config:
                where: "hour_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: hour_at
        description: 시간 버킷(KST 벽시계).
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: bus_obs_cnt
        description: 버스 관측 행수(동×시간).
      - name: bus_veh_cnt
        description: distinct 차량 수(veh_id).
      - name: bus_congestion_avg
        description: 혼잡도 평균(원천 congestion, 0='정보없음' 제외. 값역 3~5).
      - name: bus_full_ratio
        description: 만차 비율(is_full 평균, 0~1).
      - name: bus_stop_ratio
        description: 정차 비율(stop_flag 평균, 0~1).
      - name: subway_arrival_cnt
        description: 지하철 도착정보 관측 행수.
      - name: subway_wait_avg_s
        description: 접근 중 열차 평균 잔여 도착시간(초). barvl_dt_sec=0(도착/진입) 제외.
      - name: subway_last_train_cnt
        description: 막차 관측 합(is_last_train 합).
      - name: parking_lot_cnt
        description: 관측 주차 개소 수(동×시간 distinct lot).
      - name: parking_occupancy_avg
        description: >
          평균 점유율 — 주차장마다 구한 평균 점유율을 다시 평균한 값입니다(주차장 수로 동등 가중).
      - name: parking_full_lot_cnt
        description: 만차 개소 수(개소별 시간 내 최대 점유율 >= 0.95).

  # ---------------- 기반 아카이브 골드 (#286) ----------------
  - name: dim_transit_bus_route_tier
    description: >
      버스 노선 수집 티어 분류(#286, 수집 정책 ASAC-DAG #440). grain bus_route_id.
      tier 를 routeType 원천(bronze_bus_route_master, ASAC-DAG #471)에서 직접 조인한다.
      DAG 가 수집 정책(BUS_TIER1_TYPES: 간선3·광역6)으로 tier 를 계산해 넣으므로
      dbt 는 재계산하지 않는다(단일 출처). 이전 관측 역산(#286)은 dense 창 미운행
      tier1 을 놓쳤으나(실측 140 vs 165) 원천 조인으로 해소. 관측 tier 는 검증용으로
      병기(tier_mismatch 로 원천↔수집 불일치 감지). 매 빌드 전체 재계산.
    columns:
      - name: bus_route_id
        tests:
          - not_null:
              config:
                tags: [gate]
          - unique:
              config:
                tags: [gate]
      - name: tier
        description: 1=간선·광역(전 시간대 수집), 2=그 외(하루 3회 수집).
        tests:
          - not_null:
              config:
                tags: [hourly]
          - accepted_values:
              arguments: {values: [1, 2], quote: false}
              config:
                tags: [hourly]

  - name: gold_transit_dong_15min
    config:
      meta: {serving_tier: hold, refresh: '15분'}  # 원자재 아카이브 — 서빙은 파생(dong_now·hourly)이 대체
    description: >
      동×15분 교통 상태 기반 아카이브(#286). grain (admin_dong_code, bucket_at).
      gold_transit_dong_hourly(#67)의 15분판 + 버스 tier1 한정 컬럼(*_t1, 시간대 비교
      파생 전용) + 소스별 최신 관측 시각(*_last_event_at, '지금' 카드 freshness 근거).
      원본 주 경계 삭제(ASAC-DAG #369) 대비 영구 아카이브 — full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null:
              config:
                where: "bucket_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: bucket_at
        description: 15분 버킷(KST 벽시계, transit_time_bucket). 그레인 축.
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: bus_obs_cnt
        description: 버스 관측 행수(전 티어 — 현재 상태·커버리지 용도).
      - name: bus_obs_cnt_t1
        description: >
          버스 관측 행수(tier1 한정). 시간대끼리 비교하는 파생(리듬 G4·예측 G10)은
          반드시 *_t1 만 소비 — tier2 는 07·13·19시에만 관측돼 표본 구성이 달라짐(#440).
      - name: bus_last_event_at
        description: 버킷 내 버스 최신 관측 시각(KST) — "N분 전 관측" 표기 근거.
      - name: subway_last_event_at
        description: 버킷 내 지하철 최신 관측 시각(KST).
      - name: parking_last_event_at
        description: 버킷 내 주차 최신 관측 시각(KST).

  - name: gold_transit_route_section_30min
    config:
      meta: {serving_tier: hold, refresh: '30분'}  # 원자재 — 사용자향은 bus_route_comfort(2차) 예정
    description: >
      노선×구간×30분 버스 아카이브(#286). grain (bus_route_id, sect_ord, bucket_at).
      티어링(#440) 후 30분 주기에 맞춘 버킷 = 런 1회 스냅샷. 전 티어 저장 + tier 스탬프
      (필터는 파생 몫 — G3 프로파일은 tier=1 만). full_refresh=false 고정.
    columns:
      - name: bus_route_id
        tests:
          - not_null:
              config:
                where: "bucket_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: sect_ord
        description: 노선 내 구간 순번(원천 sectOrd). 그레인 축 — null 행은 제외.
        tests:
          - not_null:
              config:
                where: "bucket_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: bucket_at
        description: 30분 버킷(KST 벽시계). 그레인 축.
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: tier
        description: >
          빌드 시점의 dim_transit_bus_route_tier 분류 스탬프. 과거 버킷 소급 재분류 없음
          (당시 수집 정책의 기록). 최근 7일 무관측 노선(dim 미등재)은 null.
        tests:
          - accepted_values:
              arguments: {values: [1, 2], quote: false}
              config:
                where: "bucket_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [hourly]

  - name: gold_transit_parking_lot_15min
    config:
      meta: {serving_tier: hold, refresh: '15분'}  # 원자재 — 서빙은 full_risk·profile 이 대체
    description: >
      주차장 개소×15분 점유 아카이브(#286). grain (parking_id, bucket_at). 수집 5분 주기라
      버킷당 ~3관측. occ_last(max_by 최신 점유율)는 G2 변화율(연속 버킷 lag)용.
      full_refresh=false 고정.
    columns:
      - name: parking_id
        tests:
          - not_null:
              config:
                where: "bucket_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: bucket_at
        description: 15분 버킷(KST 벽시계). 그레인 축.
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: occ_last
        description: 버킷 내 최신 관측 점유율(max_by). 최신 관측이 결손이면 null.
      - name: admin_dong_code
        description: 개소 상수(최신 관측값 스탬프).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.90}
              config:
                tags: [hourly]

  # ---------------- 사용자향 골드 1차 (#289) ----------------
  - name: gold_transit_dong_now
    config:
      meta:
        serving:
          enabled: true
          external: true
          product_id: transit_dong_now
          # 지시대명사 금지(#189). 스냅샷 ~410행 / 서울 행정동 426 이라 전수가 아니므로
          # 숫자 대신 "서울 행정동별" 로 범위만 준다. "상태가 나쁜 곳" 같은 합성 순위는
          # 쓰지 않는다 — 3축을 합친 점수 컬럼이 없어 AI 가 기준을 지어내야 한다.
          product_question: 지금 서울 행정동별 버스 혼잡·지하철 대기·주차 여유는 어떻습니까?
          grain: admin_dong_code마다 한 행 — 동별 현재 교통 스냅샷.
          primary_key: [admin_dong_code]
          publication_mode: snapshot        # ~410행 전량 교체 (staging 원자 전환)
          zero_policy: retain_last_good     # 0행이면 직전 게시본 유지 (프로토타입 export 게이트 승계)
          publication_trigger:
            schedule_cron: "10,25,40,55 * * * *"   # 3-tier fast 주기 승계 (ASAC-DAG#475)
          event_time: bus_last_event_at     # 최다 관측 소스(버스) 기준 신선도 축
          # 15분 버킷 아카이브 프런티어 설계라 건강해도 ~50분 지연 실측(2026-07-21, silver 신선) —
          # 30분은 내재지연 오탐, 실측+여유 75분 (프로토타입 STALE_THRESHOLD_MIN 승계).
          freshness_slo_minutes: 75
          shape: wide
          # source_evidence — dong_hourly 와 같은 실시간 3종·주차 마스터에 더해, dong_15min 이
          # 읽는 dim_transit_bus_route_tier 의 원천(bus_route_master)까지 선언한다(*_t1 컬럼 근거).
          source_evidence:
            - source_id: subway_arrival
              source_url: https://data.seoul.go.kr/dataList/OA-12764/F/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: subway_station_master
              source_url: https://data.seoul.go.kr/dataList/OA-21232/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: bus_position
              source_url: https://www.data.go.kr/data/15000332/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: bus_route_master
              source_url: https://www.data.go.kr/data/15000193/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: parking
              source_url: https://data.seoul.go.kr/dataList/OA-21709/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
            - source_id: park_info_master
              source_url: https://data.seoul.go.kr/dataList/OA-13122/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-07"
          # usage_patterns — 파일럿 2건(#384)에 DBT#434 기준(3건 이상·verified 필수)으로
          # requires·verified_rows·verified_at 를 채우고 단건 조회 축 1건 추가.
          usage_patterns:
            - pattern_id: congested_dongs_now_top
              question_ko: 지금 버스가 가장 혼잡한 동네는?
              axes: 동 랭킹 — 버스 혼잡도 평균 DESC
              requires: [select_columns, filter_null, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :n=10
                SELECT admin_dong, gu, bus_congestion_avg, bus_congestion_grade, bus_last_event_at
                FROM gold_transit_dong_now
                WHERE bus_congestion_avg IS NOT NULL
                ORDER BY bus_congestion_avg DESC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
            - pattern_id: parking_avail_dongs_in_gu
              question_ko: 이 자치구에서 지금 주차 여유 있는 동네는?
              axes: 구 내 동 랭킹 — 주차 여유 % DESC
              requires: [select_columns, filter_set, filter_null, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :gu=강남구, :n=10
                SELECT admin_dong, parking_avail_pct, parking_lot_cnt, parking_last_event_at
                FROM gold_transit_dong_now
                WHERE gu = :gu AND parking_avail_pct IS NOT NULL
                ORDER BY parking_avail_pct DESC LIMIT :n
              verified_rows: 4    # 주차 관측이 있는 동만 행 생성 — 구별로 10 미만이 정상
              verified_at: "2026-08-05"
              allow_empty: true   # 실시간 주차 관측이 없는 구는 0행이 정상
            - pattern_id: my_dong_now
              question_ko: 우리 동네 지금 교통 상태는 어떤가?
              axes: 단건 조회 — 구+행정동 이름으로 현재 스냅샷 1행
              requires: [select_columns, filter_set]
              sql: |
                -- :gu=서초구, :dong=서초2동 — 동명은 구 간 중복(예: 신사동 강남/관악)이라 gu 필터 필수
                SELECT admin_dong, gu, bus_congestion_grade, bus_congestion_avg,
                       parking_avail_pct, parking_lot_cnt, subway_wait_min, bus_last_event_at
                FROM gold_transit_dong_now
                WHERE gu = :gu AND admin_dong = :dong
              verified_rows: 1
              verified_at: "2026-08-05"
              allow_empty: true   # 없는 동 이름·관측 없는 동은 0행이 정상
            - pattern_id: "dongs_ranked_by_metric"
              question_ko: "지금 선택한 교통 지표 기준으로 가장 높은(또는 낮은) 동네는? (버스 혼잡·지하철 대기·주차 여유·버스 대수 중 선택, 특정 구로 좁힐 수 있음)"
              axes: "동 랭킹 — 선택 지표(버스혼잡/지하철대기/주차여유/버스대수) 값, 정렬 방향 스위치, 구 센티널"
              verified_rows: 0                # 실 D1 실측: [10, 5, 10] (스탬핑 대기)
              insight_sample_ko: "지하철 대기(subway_wait) 내림차순 전체 1위는 관악구 중앙동으로 대기 33.7분."
              sql: |
                -- :metric=subway_wait, :gu=ALL, :dir=desc, :n=10
                SELECT admin_dong, gu,
                       CASE :metric WHEN 'bus_congestion' THEN bus_congestion_avg
                                    WHEN 'subway_wait' THEN subway_wait_min
                                    WHEN 'parking_avail' THEN parking_avail_pct
                                    ELSE bus_veh_cnt END AS metric_value
                FROM gold_transit_dong_now
                WHERE (:gu = 'ALL' OR gu = :gu)
                  AND CASE :metric WHEN 'bus_congestion' THEN bus_congestion_avg
                                   WHEN 'subway_wait' THEN subway_wait_min
                                   WHEN 'parking_avail' THEN parking_avail_pct
                                   ELSE bus_veh_cnt END IS NOT NULL
                ORDER BY CASE WHEN :dir='asc' THEN metric_value END ASC,
                         CASE WHEN :dir='desc' THEN metric_value END DESC
                LIMIT :n
              requires: [select_columns, filter_set, filter_null, sort]
              param_defaults: { gu: "ALL", dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gu_transit_rollup_ranked"
              question_ko: "지금 자치구별로 선택한 교통 지표의 동 평균이 가장 높은(또는 낮은) 구는?"
              axes: "자치구 집계 랭킹 — 선택 지표 동 평균, 정렬 방향 스위치"
              verified_rows: 0                # 실 D1 실측: [10, 10, 10] (스탬핑 대기)
              insight_sample_ko: "버스 혼잡 평균 내림차순 1위는 서초구(관측 동 18개, 평균 5.6)."
              sql: |
                -- :metric=bus_congestion, :dir=desc, :n=10
                WITH agg AS (
                  SELECT gu, COUNT(*) AS dong_cnt,
                         AVG(CASE :metric WHEN 'bus_congestion' THEN bus_congestion_avg
                                          WHEN 'subway_wait' THEN subway_wait_min
                                          WHEN 'parking_avail' THEN parking_avail_pct
                                          ELSE bus_veh_cnt END) AS metric_avg
                  FROM gold_transit_dong_now
                  GROUP BY gu)
                SELECT gu, dong_cnt, ROUND(metric_avg, 2) AS metric_avg
                FROM agg
                WHERE metric_avg IS NOT NULL
                ORDER BY CASE WHEN :dir='asc' THEN metric_avg END ASC,
                         CASE WHEN :dir='desc' THEN metric_avg END DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, subquery, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "bus_grade_distribution"
              question_ko: "지금 버스 혼잡 등급(여유/보통/혼잡) 분포는 어떤가? (전체 또는 특정 구)"
              axes: "분포 — 버스 혼잡 등급별 동 개수·비율, 구 센티널"
              verified_rows: 0                # 실 D1 실측: [3, 2] (스탬핑 대기)
              insight_sample_ko: "전체 등급 관측된 414개 동 중 버스 '여유'가 362개(87.4%)로 대다수."
              sql: |
                -- :gu=ALL
                SELECT bus_congestion_grade,
                       COUNT(*) AS dong_cnt,
                       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
                FROM gold_transit_dong_now
                WHERE bus_congestion_grade IS NOT NULL
                  AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY bus_congestion_grade
                ORDER BY dong_cnt DESC
              requires: [select_columns, aggregate, group_by, window, filter_null, filter_set]
              param_defaults: { gu: "ALL" }
            - pattern_id: "hard_transit_dongs_now"
              question_ko: "지금 버스도 혼잡하고 지하철 대기도 긴, 대중교통으로 다니기 가장 힘든 동네는?"
              axes: "교차 단면 — 버스 혼잡 AND 지하철 대기 임계 이상, 대기 DESC"
              verified_rows: 0                # 실 D1 실측: [5, 6, 5] (스탬핑 대기)
              insight_sample_ko: "min_wait=5 기준 1위는 영등포구 당산2동 — 버스 혼잡(평균 7.5)에 지하철 대기 21.9분."
              sql: |
                -- :min_wait=5, :n=10
                SELECT admin_dong, gu, bus_congestion_grade, bus_congestion_avg, subway_wait_min
                FROM gold_transit_dong_now
                WHERE bus_congestion_grade = '혼잡'
                  AND subway_wait_min >= :min_wait
                ORDER BY subway_wait_min DESC, bus_congestion_avg DESC
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_wait: 5, n: 10 }
            - pattern_id: "compare_selected_dongs"
              question_ko: "이 동네들의 지금 교통 상태(버스·지하철·주차)를 나란히 비교하면?"
              axes: "다중 선택 단면 — 선택한 동네들 현재 스냅샷 비교"
              verified_rows: 0                # 실 D1 실측: [3, 2] (스탬핑 대기)
              insight_sample_ko: "3개 동 비교 시 금천구 가산동은 버스 여유(평균 3.0)·지하철 대기 1.0분·주차 여유 60%."
              sql: |
                -- :codes=["1156060500","1154551000","1114059000"] — admin_dong_code 배열(동명은 구 간 중복이라 코드로 지정)
                SELECT admin_dong, gu, bus_congestion_grade, bus_congestion_avg,
                       subway_wait_min, parking_avail_pct
                FROM gold_transit_dong_now
                WHERE admin_dong_code IN (SELECT value FROM json_each(:codes))
                ORDER BY admin_dong
              requires: [select_columns, filter_set, subquery, sort]
            - pattern_id: "easy_drive_dongs_now"
              question_ko: "지금 주차 여유가 넉넉하고 버스도 안 붐비는(차 대기 편한) 동네는?"
              axes: "교차 랭킹 — 주차 여유 임계 이상 AND 버스 여유 등급, 여유% DESC"
              verified_rows: 0                # 실 D1 실측: [10, 10, 10] (스탬핑 대기)
              insight_sample_ko: "min_avail=50 기준 1위는 성동구 옥수동 — 주차 여유 94%에 버스 여유(평균 3.0)."
              sql: |
                -- :min_avail=50, :n=10
                SELECT admin_dong, gu, parking_avail_pct, parking_lot_cnt,
                       bus_congestion_grade, bus_congestion_avg
                FROM gold_transit_dong_now
                WHERE parking_avail_pct >= :min_avail
                  AND bus_congestion_grade = '여유'
                ORDER BY parking_avail_pct DESC, bus_congestion_avg ASC
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_avail: 50, n: 10 }
            - pattern_id: "gu_bus_congested_share"
              question_ko: "지금 관할 동네 중 버스가 혼잡한 동네 비율이 가장 높은(또는 낮은) 구는?"
              axes: "자치구 비율 랭킹 — 버스 혼잡 등급 동 비율, 정렬 방향 스위치"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "혼잡 동 비율 내림차순 1위는 서초구 — 18개 동 중 7개(38.9%)가 혼잡."
              sql: |
                -- :dir=desc, :n=10
                SELECT gu,
                       COUNT(*) AS dong_cnt,
                       SUM(CASE WHEN bus_congestion_grade = '혼잡' THEN 1 ELSE 0 END) AS congested_cnt,
                       ROUND(100.0 * SUM(CASE WHEN bus_congestion_grade = '혼잡' THEN 1 ELSE 0 END) / COUNT(*), 1) AS congested_pct
                FROM gold_transit_dong_now
                WHERE bus_congestion_grade IS NOT NULL
                GROUP BY gu
                ORDER BY CASE WHEN :dir='asc' THEN congested_pct END ASC,
                         CASE WHEN :dir='desc' THEN congested_pct END DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, filter_null, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
          display:
            title: 지금 우리 동네 교통 상태
            summary: 행정동마다 지금 버스·주차·지하철 상태를 한 행으로 보여줍니다.
            caveat: 버스가 자주 다니지 않는 동은 표시된 값이 수 시간 전 관측일 수 있어, 함께 제공되는 관측 시각(_last_event_at)을 확인하세요. 지하철 대기 시간은 실시간 도착정보가 있는 역 주변 동에만 채워집니다.
            use_cases:
              - 동네 교통 현황 위젯·대시보드
              - 외출 전 대중교통·주차 상황 확인
              - 행정동별 실시간 혼잡 지도
    description: >
      "지금 우리 동네 교통" 스코어카드(#289 G1). grain admin_dong_code — 소스(버스·지하철·
      주차)별 최근 24h 내 최신 관측 버킷 지표 + 관측 시각(*_last_event_at, "N분 전 관측"
      표기 근거) + 사용자 등급(혼잡 여유/보통/혼잡, 주차 여유 %, 대기 분). 매 변환 재생성
      스냅샷(table) — 경과 시간은 조회 시점 기준으로 소비 측이 계산.
    columns:
      - name: admin_dong_code
        description: 행안부 10자리 행정동 코드.
        tests:
          - not_null:
              config:
                tags: [gate]
          - unique:
              config:
                tags: [gate]
      - name: admin_dong
        description: 행정동 이름.
      - name: gu_code
        description: 자치구 코드.
      - name: gu
        description: 자치구 이름.
      - name: bus_congestion_avg
        description: 최신 15분 버킷 버스 혼잡도 평균(원천 congestion 값역 3~5, 0='정보없음' 제외).
      - name: bus_congestion_grade
        description: 혼잡 등급(여유<3.5≤보통<4.5≤혼잡). 원천 congestion 값역 3/4/5.
        tests:
          - accepted_values:
              arguments: {values: ['여유', '보통', '혼잡']}
              config:
                tags: [hourly]
      - name: bus_full_ratio
        description: 버스 만차 비율(is_full 평균, 0~1).
      - name: bus_veh_cnt
        description: 관측 distinct 차량 수.
      - name: bus_last_event_at
        description: 버스 최신 관측 시각(KST) — "N분 전 관측" 표기 근거.
      - name: subway_wait_min
        description: 접근 중 열차 평균 잔여 도착시간(분). 실시간 제공 역 주변 동에만 값 — 그 외 null 정상.
      - name: subway_arrival_cnt
        description: 지하철 도착정보 관측 행수.
      - name: subway_last_event_at
        description: 지하철 최신 관측 시각(KST).
      - name: parking_occupancy_avg
        description: 최신 버킷 평균 주차 점유율(0~1).
      - name: parking_avail_pct
        description: 주차 여유 %((1-점유율)×100 반올림).
      - name: parking_lot_cnt
        description: 관측 주차 개소 수.
      - name: parking_full_lot_cnt
        description: 만차(점유율>=0.95) 개소 수.
      - name: parking_last_event_at
        description: 주차 최신 관측 시각(KST).

  - name: gold_transit_x_weather_dong_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G6) — 카드 화면 붙일 때 d1_direct 전환
    description: >
      날씨 조건부 교통 상태(#289 G6, × weather). grain (admin_dong_code, hour_at).
      과거 행 = 교통 실측(버스 tier1 한정) + 당시 예보(패턴 학습), 미래 행 = 예보만
      (교통 null, 전망 카드). 날씨는 최신 발표분 피벗(max_by issued_at, citydata 선례).
      과거 예보-교통 쌍의 자체 아카이브 겸용 — full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null:
              config:
                # 하한만 건다 — 미래 행(예보)은 윈도 상한이 없어 그대로 검증된다.
                where: "hour_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: hour_at
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: precip_mm
        description: 예보 강수량 mm. 원천 '강수없음'은 null — PTY(precip_type)=0 과 함께 해석.
      - name: precip_type
        description: 강수형태(0없음/1비/2비눈/3눈/4소나기).
      - name: is_precip
        description: 강수 예보 여부(precip_type>0).

  - name: gold_transit_lastmile_dong_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G9)
    description: >
      지하철 주변 따릉이 라스트마일(#289 G9, × citydata). grain (admin_dong_code, hour_at),
      지하철역 보유 동 한정. 따릉이는 핫스팟 121곳 주변 대여소만 — sbike_* null 은
      "정보 없음"(대여소 없음 아님). citydata 보존 별도라 자체 아카이브 겸용 —
      full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null:
              config:
                where: "hour_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: hour_at
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: sbike_bike_last_sum
        description: 동 내 대여소별 최신 잔여 대수 합(시간 내 마지막 관측 기준).

  - name: gold_transit_dong_rhythm
    config:
      meta: {serving_tier: hold, refresh: '패턴'}  # 2차 후보 (G4 히트맵)
    description: >
      동별 요일×시간 교통 리듬(#287 G4). grain (admin_dong_code, dow, hh) — dow ISO(1=월),
      hh 0~23, KST. 아카이브(dong_15min) 전량 재집계(table). 버스는 tier1 한정·관측수 가중
      (#440 원칙 ②). *_base_n = 기여 15분 버킷 수 — 표본 부족 판단은 소비 측 몫
      (4주 누적 시 칸당 ~16). G1 '평시 대비'·G10 예측의 기준선.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
      - name: dow
        description: ISO 요일(1=월 … 7=일, bucket_at KST 기준).
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6, 7], quote: false}
      - name: hh
        description: 시간(0~23, KST).
        tests:
          - not_null
      - name: bus_base_n
        description: 버스(tier1) 기여 버킷 수 — 표본 배지 근거.

  - name: gold_transit_parking_profile
    config:
      meta:
        serving:
          enabled: true
          # DBT#434 재검토: 식별자가 parking_id 뿐(이름·위치 없음)이라 단독 해석 불가(G3),
          # 핵심 수치 full_prob 는 full_risk·event_access 경유로 이미 외부 노출. 내부 부품으로 유지.
          external: false
          product_id: transit_parking_profile
          product_question: 이 주차장은 요일·시간대별로 평소 얼마나 찹니까?
          grain: (parking_id, dow, hh)마다 한 행 — 주차장 평시 점유 프로파일.
          primary_key: [parking_id, dow, hh]
          publication_mode: snapshot        # 일 1회 전량 교체
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: "40 8 * * *"     # 3-tier daily 주기 승계 (ASAC-DAG#475)
          shape: rollup
          # 표본 판단은 소비 측 배지 몫(#288 원칙)이라 억제하지 않고 그대로 게시한다.
          # 4주 누적 시 칸당 ~16 도달 — 그 뒤 flag_degraded 전환 검토.
          reliability:
            sample_count_field: base_n
            minimum_sample_count: 16
            insufficient_sample_policy: allow
          display:
            title: 주차장 요일·시간대 혼잡 패턴
            summary: 공영주차장마다 요일·시간대별로 평소 얼마나 차는지 보여줍니다.
            caveat: 관측이 쌓인 만큼 정확해지므로, 함께 제공되는 표본 수(base_n)가 적은 칸은 아직 신뢰도가 낮습니다. 운영 초기에는 표본이 얇을 수 있습니다.
            use_cases:
              - 언제 가면 자리 있나 안내
              - 주차 수요 예측·요금 정책
              - 목적지 도착 시간대 추천
          usage_patterns:
            - pattern_id: "named_full_lots_in_gu_at_slot"
              question_ko: "이 자치구에서 (요일)(시각)에 평소 만차가 잦은 주차장은 어디인가?"
              axes: "주차장 랭킹(요일·시각 고정, 구 센티널) — 지표/정렬 스위치, 표본 신뢰도 하한 · full_risk 조인으로 주차장 이름 노출"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "종로구(11110) 주차장 중 목요일 07시에 평소 만차가 가장 잦은 곳은 '청계3(창경궁로_남) 공영주차장(시)'로, 만차확률 0.4·평균 점유율 0.722(표본 8버킷)."
              sql: |
                -- :gu=11110(법정 구코드; ALL=서울 전체), :dow=4(목요일; 1=월..7=일), :hh=7, :metric=full_prob, :dir=desc, :min_n=6, :n=10
                SELECT r.parking_name, r.gu_code, r.admin_dong_code, p.base_n,
                       ROUND(p.occ_avg, 3) AS occ_avg, ROUND(p.full_prob, 3) AS full_prob
                FROM gold_transit_parking_profile p
                JOIN gold_transit_parking_full_risk r ON r.parking_id = p.parking_id
                WHERE p.dow = :dow AND p.hh = :hh AND (:gu = 'ALL' OR r.gu_code = :gu) AND p.base_n >= :min_n
                ORDER BY CASE WHEN :dir = 'asc' THEN (CASE :metric WHEN 'occ_avg' THEN p.occ_avg ELSE p.full_prob END) END ASC,
                         CASE WHEN :dir = 'desc' THEN (CASE :metric WHEN 'occ_avg' THEN p.occ_avg ELSE p.full_prob END) END DESC
                LIMIT :n
              requires: [select_columns, join, filter_set, filter_range, sort]
              param_defaults: { gu: "ALL", min_n: 6, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "lot_top_busy_slots"
              question_ko: "이 주차장이 평소 가장 만차되기 쉬운 요일·시간대 조합은?"
              axes: "주차장 내부 (요일×시간) 셀 랭킹 — 지표 스위치, 표본 신뢰도 하한"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "173840 주차장이 가장 만차되기 쉬운 시간대 1위는 화요일(dow=2) 19시로, 만차확률 1.0·평균 점유율 0.988(표본 12버킷)."
              sql: |
                -- :lot=173840, :metric=full_prob, :min_n=6, :n=10
                SELECT dow, hh, base_n, ROUND(occ_avg, 3) AS occ_avg, ROUND(full_prob, 3) AS full_prob
                FROM gold_transit_parking_profile
                WHERE parking_id = :lot AND base_n >= :min_n
                ORDER BY (CASE :metric WHEN 'occ_avg' THEN occ_avg ELSE full_prob END) DESC, base_n DESC
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { min_n: 6, n: 10 }
            - pattern_id: "lot_weekday_weekend_by_hour"
              question_ko: "이 주차장은 시간대별로 평일과 주말 중 언제 더 붐비나?"
              axes: "시간대(hh) 단면 — 평일(dow 1-5)/주말(dow 6-7) 조건부 집계 피벗(점유율·만차확률 동시)"
              verified_rows: 0                # 실 D1 실측: [24, 24] (스탬핑 대기)
              insight_sample_ko: "1367804 주차장은 00시 점유율이 평일 0.545·주말 0.554로 거의 같고, 두 경우 모두 만차확률은 0이다(시간대별 24행으로 평일/주말 격차를 한눈에)."
              sql: |
                -- :lot=1367804, :min_n=4
                SELECT hh,
                       ROUND(AVG(CASE WHEN dow BETWEEN 1 AND 5 THEN occ_avg END), 3) AS weekday_occ,
                       ROUND(AVG(CASE WHEN dow IN (6, 7) THEN occ_avg END), 3) AS weekend_occ,
                       ROUND(AVG(CASE WHEN dow BETWEEN 1 AND 5 THEN full_prob END), 3) AS weekday_full_prob,
                       ROUND(AVG(CASE WHEN dow IN (6, 7) THEN full_prob END), 3) AS weekend_full_prob
                FROM gold_transit_parking_profile
                WHERE parking_id = :lot AND base_n >= :min_n
                GROUP BY hh
                ORDER BY hh
              requires: [select_columns, aggregate, group_by, filter_set, filter_range, sort]
              param_defaults: { min_n: 4 }
            - pattern_id: "lot_full_risk_windows"
              question_ko: "이 주차장은 이 요일에 몇 시대에 만차 위험이 높나?"
              axes: "필터(주차장, 요일) — 만차확률 임계값 이상 시간대만, 시간 오름차순 타임라인"
              verified_rows: 0                # 실 D1 실측: [14, 13] (스탬핑 대기)
              insight_sample_ko: "173840 주차장은 금요일 만차 위험(만차확률 0.5 이상) 시간대가 00시부터 나타나며, 00시 만차확률 1.0·평균 점유율 0.997."
              sql: |
                -- :lot=173840, :dow=5(금요일; 1=월..7=일), :min_p=0.5, :min_n=6, :n=24
                SELECT hh, base_n, ROUND(occ_avg, 3) AS occ_avg, ROUND(full_prob, 3) AS full_prob
                FROM gold_transit_parking_profile
                WHERE parking_id = :lot AND dow = :dow AND base_n >= :min_n AND full_prob >= :min_p
                ORDER BY hh
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { min_n: 6, min_p: 0.5, n: 24 }
            - pattern_id: "chronically_full_lots"
              question_ko: "평상시 어느 시간대든 거의 늘 만차라 자리 찾기 어려운 주차장은?"
              axes: "주차장 랭킹(프로파일 전체 집계) — 요일·시간칸 평균 만차확률/점유율 DESC, 커버리지 하한"
              verified_rows: 0                # 실 D1 실측: [15, 15] (스탬핑 대기)
              insight_sample_ko: "평상시 거의 항상 만차인 주차장 1위는 173005로, 관측된 46개 요일·시간칸(총 396버킷) 전부에서 평균 만차확률 1.0·평균 점유율 1.0."
              sql: |
                -- :metric=full_prob, :min_cells=20, :n=15
                SELECT parking_id,
                       COUNT(*) AS cells,
                       SUM(base_n) AS obs_total,
                       ROUND(AVG(occ_avg), 3) AS occ_avg_all,
                       ROUND(AVG(full_prob), 3) AS full_prob_all
                FROM gold_transit_parking_profile
                GROUP BY parking_id
                HAVING COUNT(*) >= :min_cells
                ORDER BY (CASE :metric WHEN 'occ_avg' THEN AVG(occ_avg) ELSE AVG(full_prob) END) DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, having, sort]
              param_defaults: { min_cells: 20, n: 15 }
            - pattern_id: "lot_dow_profile_at_hour"
              question_ko: "이 주차장은 특정 시각 기준으로 요일별 혼잡도가 어떻게 다른가?"
              axes: "필터(주차장, 시각 고정) — 요일(dow) 단면, 요일 오름차순"
              verified_rows: 0                # 실 D1 실측: [7, 7] (스탬핑 대기)
              insight_sample_ko: "173752 주차장의 18시 점유율은 화요일(dow=2) 0.449·만차확률 0에서 시작해 요일 순으로 이어지며, 요일별 혼잡 편차를 비교할 수 있다."
              sql: |
                -- :lot=173752, :hh=18
                SELECT dow, base_n, ROUND(occ_avg, 3) AS occ_avg, ROUND(full_prob, 3) AS full_prob
                FROM gold_transit_parking_profile
                WHERE parking_id = :lot AND hh = :hh
                ORDER BY dow
              requires: [select_columns, filter_set, sort]
    description: >
      주차장별 요일×시간 점유 프로파일(#288 G2 프로파일 축). grain (parking_id, dow, hh).
      아카이브(parking_lot_15min) 전량 재집계. full_prob = 버킷 중 occ_max>=0.95 비율.
    tests:
      # 서빙 계약 복합 PK 근거 — validator 가 unique_combination 이름으로 인정(#478, culture #346 관례).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [parking_id, dow, hh]
    columns:
      - name: parking_id
        description: 주차장 ID.
        tests:
          - not_null
      - name: dow
        description: 요일(1=월~7=일, Trino day_of_week). 그레인 축.
        tests:
          - not_null
      - name: hh
        description: 시간대(0~23). 그레인 축.
        tests:
          - not_null
      - name: base_n
        description: 기여 15분 버킷 수 — 표본 신뢰도(같은 칸 주 1회×4버킷 → 4주 ~16).
      - name: occ_avg
        description: 평시 평균 점유율(0~1).
      - name: full_prob
        description: 만차 확률(0~1). base_n 얇으면(운영 초기) 소비 측 배지 처리.

  - name: gold_transit_parking_full_risk
    config:
      meta:
        serving:
          enabled: true
          external: true
          product_id: transit_parking_full_risk
          # 지시대명사 금지(#189). 실시간 제공 시영주차장만(~108) 이라 전수가 아니므로 숫자 없음.
          product_question: 지금 서울에서 만차에 가까운 주차장은 어디입니까?
          grain: parking_id마다 한 행 — 실시간 제공 주차장의 현재 만차 리스크.
          primary_key: [parking_id]
          publication_mode: snapshot        # ~108행 전량 교체
          zero_policy: retain_last_good     # 0행이면 직전 게시본 유지 (프로토타입 export 게이트 승계)
          publication_trigger:
            schedule_cron: "10,25,40,55 * * * *"   # 3-tier fast 주기 승계 (ASAC-DAG#475)
          event_time: last_event_at
          freshness_slo_minutes: 75         # dong_now 와 동일 근거 (프로토타입 75분 승계)
          shape: wide
          # source_id는 원천 source 노드명과 일치시킨다. 고정 coverage·공개 projection은 별도 근거가 필요하다.
          source_evidence:
            - source_id: park_info_master
              source_url: https://data.seoul.go.kr/dataList/OA-13122/S/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
            - source_id: parking
              source_url: https://data.seoul.go.kr/dataList/OA-21709/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-03"
          quality_coverage:
            not_applicable_reason: 게시 모집단은 매 source run의 최근 24시간 유효 주차 관측 집합으로 동적으로 정의되어 고정 distinct 분모가 성립하지 않음
          public_projection:
            schema_version: "1.0.0"
            columns: [parking_id, last_event_at, parking_name, admin_dong_code, gu_code, latitude, longitude, occ_now, avail_pct, capacity_now, avail_lot_est, occ_rate_per_min, rate_base_n, minutes_to_full_est, full_prob_now_slot, profile_base_n, last_bucket_at]
          # usage_patterns — 파일럿 2건(#384)에 DBT#434 기준으로 requires·verified 를 채우고
          # 제품 고유의 관측 vs 통계 비교 축(#406 3축 설계) 1건 추가.
          usage_patterns:
            - pattern_id: full_soon_lots
              question_ko: 곧 만차될 것 같은 주차장은 어디인가?
              axes: 주차장 랭킹 — 만차까지 예상 분 ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :n=10
                SELECT parking_name, gu_code, avail_pct, minutes_to_full_est, last_event_at
                FROM gold_transit_parking_full_risk
                WHERE minutes_to_full_est > 0  -- 0=이미 만차(비조치 대상) 제외
                ORDER BY minutes_to_full_est ASC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
            - pattern_id: best_avail_lots_now
              question_ko: 지금 자리 여유가 가장 많은 주차장은?
              axes: 주차장 랭킹 — 잔여 대수 추정 DESC
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :n=10
                SELECT parking_name, avail_pct, avail_lot_est, capacity_now, last_event_at
                FROM gold_transit_parking_full_risk
                ORDER BY avail_lot_est DESC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
            - pattern_id: avail_lots_in_gu
              question_ko: 이 자치구에서 지금 자리 여유 있는 주차장은?
              axes: 구 내 주차장 랭킹 — 여유 % DESC (현재 관측 축만 사용)
              requires: [select_columns, filter_set, filter_null, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :gu=11710(법정 구 코드), :n=10
                SELECT parking_name, admin_dong_code, avail_pct, avail_lot_est,
                       capacity_now, last_event_at
                FROM gold_transit_parking_full_risk
                WHERE gu_code = :gu AND avail_pct IS NOT NULL
                ORDER BY avail_pct DESC LIMIT :n
              verified_rows: 4    # 구별 실시간 제공 주차장 수만큼 — 10 미만이 정상
              verified_at: "2026-08-05"
              allow_empty: true   # 실시간 제공 주차장이 없는 구는 0행이 정상
          display:
            title: 지금 주차장 만차 위험
            summary: 공영주차장마다 지금 얼마나 찼는지(관측)·만차까지 남은 시간(추정)·평소 만차 확률(통계)을 함께 보여줍니다.
            caveat: 만차까지 예상 시간은 최근 관측 추세의 추정값이라 급격한 변동(행사 등)은 빗나갈 수 있고, 만차 확률은 과거 통계라 오늘의 실제 상황과 다를 수 있습니다. 모든 값의 기준 시각은 조회 시점이 아니라 그 주차장의 마지막 관측 시각(last_event_at)입니다 — 수집이 지연되면 값이 오래됐을 수 있으니 last_event_at 을 함께 확인하세요. 실시간 정보를 제공하는 시영주차장만 포함됩니다.
            use_cases:
              - 목적지 주차 가능 여부 안내
              - 만차 임박 알림
              - 주차장 실시간 지도
    description: >
      주차장별 현재 만차 리스크 스냅샷(#288 G2). grain parking_id — 시간 의미가 다른
      세 축을 한 행에 분리 노출(#406): ① 현재 관측(occ_now·avail_pct·capacity_now,
      최신 15분 버킷 실측) ② 추세 추정(occ_rate_per_min·minutes_to_full_est, 최근 45분
      연속 4버킷 선형 외삽 — 만차선 0.95) ③ 과거 통계(full_prob_now_slot·profile_base_n,
      아카이브 전량 요일×시 프로파일). 기준 시각은 벽시계가 아니라 아카이브 프런티어
      (last_bucket_at·last_event_at). canonical mapping: 원천 PKLT_CD(GetParkingInfo,
      OA-21709) → parking_id → silver_transit_parking → gold_transit_parking_lot_15min
      (15분 아카이브) → profile·full_risk. 매 변환 재생성 table.
    columns:
      - name: parking_id
        description: 주차장 ID.
        data_type: varchar
        config: {meta: {semantic_role: entity_id, nullable: false, null_meaning: not_applicable, unit: code}}
        tests:
          - not_null:
              config:
                tags: [gate]
          - unique:
              config:
                tags: [gate]
      - name: parking_name
        description: 주차장 이름.
        data_type: varchar
        config: {meta: {semantic_role: entity_name, nullable: true, null_meaning: 주차장 마스터 이름을 매핑하지 못함, unit: name}}
      - name: admin_dong_code
        description: 행정동 코드.
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: true, null_meaning: 유효 좌표 또는 행정동 매핑이 없음, unit: code}}
      - name: gu_code
        description: 자치구 코드.
        data_type: varchar
        config: {meta: {semantic_role: administrative_area_id, nullable: true, null_meaning: 유효 좌표 또는 자치구 매핑이 없음, unit: code}}
      - name: latitude
        description: 위도(지도 표시용, dim 마스터).
        data_type: double
        config: {meta: {semantic_role: latitude, nullable: true, null_meaning: 주차장 마스터의 유효 좌표가 없음, unit: degree}}
      - name: longitude
        description: 경도(지도 표시용, dim 마스터).
        data_type: double
        config: {meta: {semantic_role: longitude, nullable: true, null_meaning: 주차장 마스터의 유효 좌표가 없음, unit: degree}}
      - name: occ_now
        description: >
          [현재 관측] 현재 점유율 — 가장 최근 관측 기준입니다. 주차 대수와 총 면수가 모두 유효할 때만
          계산합니다. 만차를 넘겨 세운 경우 1을 넘을 수 있습니다. 24시간 안에 유효한 관측이 없는
          주차장은 제외됩니다.
        data_type: double
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable, unit: ratio}}
        tests:
          # 서빙 품질 규칙(#668 게시 증거)의 핵심 단언이라 gate — 파생값이지만 15분 게시 제품.
          - not_null:
              config:
                tags: [gate]
      - name: avail_pct
        description: "[현재 관측] 여유 %((1-occ_now)×100 반올림)."
        data_type: double
        config: {meta: {semantic_role: derived_metric, nullable: false, null_meaning: not_applicable, unit: percent}}
      - name: capacity_now
        description: "[현재 관측] 총 면수(최신 관측 TPKCT — 운영상 증감 가능)."
        data_type: integer
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable, unit: parking_spaces}}
      - name: avail_lot_est
        description: "[현재 관측 파생] 잔여 대수 추정(총면수×여유율 반올림)."
        data_type: double
        config: {meta: {semantic_role: derived_metric, nullable: false, null_meaning: not_applicable, unit: estimated_parking_spaces}}
      - name: occ_rate_per_min
        description: >
          [추세 추정] 분당 점유율 변화 — 최근 45분 관측의 처음과 끝 차이입니다. 관측이 4회에
          못 미치면(새로 생겼거나 관측이 빠진 주차장) 값이 비어 있습니다.
        data_type: double
        config: {meta: {semantic_role: derived_metric, nullable: true, null_meaning: 최근 45분 연속 4버킷이 없어 추세를 계산하지 못함, unit: ratio_per_minute}}
      - name: rate_base_n
        description: "[추세 추정 근거] 추세 계산에 쓴 버킷 수(45분 창) — 4 미만이면 추세 미산출."
        data_type: bigint
        config: {meta: {semantic_role: sample_count, nullable: false, null_meaning: not_applicable, unit: count}}
      - name: minutes_to_full_est
        description: >
          [추세 추정] 만차(점유 0.95)까지 예상 분 — 최근 추세의 선형 외삽.
          채워지는 중(rate>0)일 때만, 이미 만차면 0, 그 외 null.
        data_type: double
        config: {meta: {semantic_role: derived_metric, nullable: true, null_meaning: 채워지는 추세가 아니거나 추세 표본이 부족함, unit: minute}}
      - name: full_prob_now_slot
        description: >
          [과거 통계] 이 시간대(요일×시) 평시 만차 확률 — 아카이브 전량 프로파일
          (occ_max>=0.95 터치 비율)에서 그 lot 의 최신 관측 시각 칸을 조인.
          null=프로파일 미보유.
        data_type: decimal(2,1)
        config: {meta: {semantic_role: probability, nullable: true, null_meaning: 해당 주차장·요일·시간대 프로파일이 없음, unit: ratio}}
      - name: profile_base_n
        description: "[과거 통계 근거] 조인된 프로파일 칸의 표본 수(base_n) — 소비 측 배지 판단."
        data_type: bigint
        config: {meta: {semantic_role: sample_count, nullable: true, null_meaning: 해당 주차장·요일·시간대 프로파일이 없음, unit: count}}
      - name: last_bucket_at
        description: "[기준 시각] 최신 15분 버킷 시각 — 프로파일 조인 기준 칸."
        data_type: timestamp(6)
        config: {meta: {semantic_role: observation_bucket_time, nullable: false, null_meaning: not_applicable, unit: timestamp_kst}}
        tests:
          - not_null:
              config:
                tags: [gate]
      - name: last_event_at
        description: >
          [기준 시각] 최신 관측 시각(KST) — 신선도 축(event_time). 현재 관측·추세·통계
          모두 이 시각 기준이며, 조회 시점까지의 경과분 계산은 소비 측 몫.
        data_type: timestamp(6)
        config: {meta: {semantic_role: observed_at, nullable: false, null_meaning: not_applicable, unit: timestamp_kst}}
        tests:
          - not_null:
              config:
                tags: [gate]

  - name: gold_transit_bus_route_comfort
    config:
      meta: {serving_tier: hold, refresh: '패턴'}  # 2차 후보 (G3) — 행수 확인 전 서빙 투입 금지
    description: >
      노선×구간별 요일×시간 쾌적도(#288 G3). grain (bus_route_id, sect_ord, dow, hh).
      tier1(간선·광역) 한정 — tier2 는 하루 3회 관측이라 시간대 프로파일 불성립(#440).
      아카이브(route_section_30min) 전량 재집계, 관측수 가중.
    columns:
