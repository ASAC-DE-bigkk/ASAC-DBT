version: 2

models:
  # ---------------- 차원 ----------------
  - name: dim_transit_station
    description: >
      지하철 역사 차원(최신 load_date). PK station_id(bldn_id). 실시간 arrival 조인용
      정규화 컬럼 station_name_join(괄호 제거) + route 노출. 공간축 부착.
    columns:
      - name: station_id
        description: 역사 코드(bldn_id) — PK.
        tests:
          - not_null
          - unique
      - name: station_name
        tests:
          - not_null
      - name: route
        tests:
          - not_null
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        description: >
          행안부 10자리. 마스터 784역 중 서울 행정경계 내 ~400역만 할당됨(coverage≈0.51).
          나머지는 bbox(느슨한 사각형) 안이나 경기·인천(철산·부천·부평·별내 등) 소속이라 NULL.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.50}
      - name: gu_code
        description: 행안부 5자리(자치구).

  - name: dim_transit_parking
    description: >
      주차장 차원(최신 load_date). PK parking_id(pklt_cd). 공간축 부착 + addr_gu(주소 자치구 토큰)
      + 운영 컬럼(평일/주말 운영시간, 유·무료, 야간개방 — "운영시간 내 점유율" 분석 재료).
    columns:
      - name: parking_id
        tests:
          - not_null
          - unique
      - name: parking_name
        tests:
          - not_null
      - name: wd_oper_bgng_tm
        description: 평일 운영 시작시각(HHMM 문자열 그대로, '0000/0000'=미상 존재).
      - name: wd_oper_end_tm
        description: 평일 운영 종료시각(HHMM, '2400' 표기·자정 넘김 '0100' 존재).
      - name: we_oper_bgng_tm
        description: 주말 운영 시작시각(HHMM).
      - name: we_oper_end_tm
        description: 주말 운영 종료시각(HHMM).
      - name: night_free_open_yn_nm
        description: 야간 무료 개방 여부 명칭(원천 nght_free_opn_yn_name, 예 '야간 미개방').
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        description: >
          좌표 0.0(미상) 주차장이 다수라 커버리지 제한. 마스터 850개 lot 중 유효좌표
          118개만 행정동 할당(coverage≈0.14). 실시간에 실제 쓰이는 lot 은 대부분 유효좌표라
          silver_transit_parking 에서는 커버리지 0.96.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.12}

  # ---------------- 실버 ----------------
  - name: silver_transit_parking
    description: >
      주차장 실시간 정제. grain (parking_id, event_at). event_at=NOW_PRK_VHCL_UPDT_TM KST.
      공간축은 dim_transit_parking 조인.
    columns:
      - name: parking_id
        tests:
          - not_null
      - name: event_at
        description: 도메인 대표시각(주차 현황 갱신, KST).
        tests:
          - not_null
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        description: dim_transit_parking 조인. 실시간 lot 은 대부분 유효좌표(coverage≈0.96).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.90}

  - name: silver_transit_subway_arrival
    description: >
      지하철 도착정보 정제. grain (statn_id, ordkey, recptn_dt). event_at=recptnDt KST.
      공간축은 dim_transit_station 조인('역명+노선', subwayId→route seed 변환).
    columns:
      - name: statn_id
        tests:
          - not_null
      - name: event_at
        description: 도메인 대표시각(도착정보 수신, KST).
        tests:
          - not_null
      - name: route
        description: seoul_subway_line_code seed 로 subwayId 에서 변환한 노선 라벨.
      - name: is_last_train
        description: >
          막차 여부(원천 lstcarAt 0/1 → int). '_at' 접미사는 공통축 계약상 KST timestamp
          전용이라 여부형 이름으로 명명.
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: terminal_statn_nm
        description: 종착(행선지) 역명(원천 bstatnNm).
      - name: transfer_line_cnt
        description: 해당 역 환승 노선 수(원천 trnsitCo, int).
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        description: >
          dim_transit_station 조인. 수집이 경로형 ALL(#369)로 바뀌며 수도권 전 역이
          들어와, 경기·인천 역(부천·소사·개봉 등)은 서울 행정동이 없어 NULL 이 정상이다
          — 실측 커버리지 0.48(dim_transit_station 의 0.51 과 같은 사유). 임계는
          '서울 역이 정상 부착되는가'를 지키는 선으로 잡는다(6역 한정 수집 시절의
          0.90 은 ALL 전환 후 구조적으로 달성 불가).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.45}

  - name: silver_transit_bus_position
    description: >
      버스 실시간 위치 정제(XML regexp+UNNEST 파싱). grain (veh_id, data_tm).
      event_at=dataTm KST. gpsX/gpsY→경위도 직접 + 행정동 런타임 할당.
    columns:
      - name: veh_id
        tests:
          - not_null
      - name: event_at
        description: 도메인 대표시각(버스 위치 관측, KST).
        tests:
          - not_null
      - name: stop_flag
        description: 정차 여부(원천 stopFlag 0/1 → int, 1=정류소 정차 중).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: is_full
        description: 만차 여부(원천 isFullFlag 0/1 → int).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: is_last_bus
        description: 막차 여부(원천 islastyn 0/1 → int).
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: rt_dist_km
        description: 노선 누적 진행거리 km(원천 rtDist, 실증 39.65~62.2 → 노선 왕복 수십 km 스케일).
      - name: full_sect_dist_km
        description: 현재 구간 전체거리 km(원천 fullSectDist, 실증 0.095~3.584 → 정류장 간 수백 m 스케일).
      - name: longitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lon}
      - name: latitude
        tests:
          - asac_axes.in_seoul_bbox:
              arguments: {kind: lat}
      - name: admin_dong_code
        description: >
          런타임 point-in-polygon 할당. 수집이 전 노선(ALL, #369)으로 바뀌며 서울
          외곽·수도권 경계 노선의 정류장이 서울 행정경계 밖에 찍혀 NULL 이 되는 게
          정상이다(실측 0.90 — 시간대·운행 노선 구성에 따라 변동, 출퇴근엔 외곽
          노선이 더 운행). 지하철 admin_dong_code(0.45)와 같은 ALL 전환 사유이며,
          6노선 한정 수집 시절의 0.90 은 마진이 없어 조금만 외곽이 섞여도 깨진다.
          임계는 '서울 노선이 정상 부착되는가'를 지키는 선(0.85)으로 낮춘다 —
          좌표 파싱 대량 실패 등 진짜 회귀는 이 밑에서 잡힌다.
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.85}

  # ---------------- 골드 ----------------
  - name: gold_transit_dong_hourly
    config:
      meta:
        serving_tier: d1_direct   # 이력·시간별 — D1 append 서빙 (ASAC-DAG#475 1차)
        refresh: '1시간'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 행정동별 시간대 교통 이력
          summary: 서울 행정동마다 시간대별 교통 상태를 쌓아 온 이력입니다. 한 시간 동안 버스가 얼마나 붐볐고, 지하철이 몇 번 도착했으며, 주차장이 얼마나 찼는지를 동×시간 한 칸에 담았습니다. 지금 상태가 아니라 과거 흐름을 보는 용도입니다.
          caveat: 한 시간 안에 잡힌 관측들의 평균이라 연속 측정이 아닙니다. 값이 있는 동·시간만 유효하며, 관측 수가 적은 칸은 대표성이 약할 수 있습니다.
          use_cases:
            - 동네 교통 시계열 분석
            - 시간대별 혼잡 패턴 리포트
            - 상권·인구 데이터와 교차 분석
    description: >
      동×시간대 교통 상태판(#67). grain (admin_dong_code, hour_at). hour_at=date_trunc('hour',
      event_at) KST. silver 3종(버스·지하철·주차)을 동·시간으로 집계해 한 행에 나란히(3원 outer 결합
      — 한 소스만 있는 조합도 행 생성). 지하철은 역 3곳(4개 동)에만 존재해 대부분 행에서 subway_* null.
      정화된 silver(#66)만 소비하므로 추가 시간 필터 없음. incremental merge(-3h lookback).
    columns:
      - name: admin_dong_code
        description: 행안부 10자리 행정동 코드(공간축, 그레인 축). null 행은 소스에서 제외.
        tests:
          - not_null
      - name: hour_at
        description: 시간 버킷(KST 벽시계, date_trunc('hour', event_at)). 그레인 축.
        tests:
          - not_null
      - name: bus_obs_cnt
        description: 버스 관측 행수(동×시간).
      - name: bus_veh_cnt
        description: distinct 차량 수(veh_id).
      - name: bus_congestion_avg
        description: 혼잡도 평균(원천 congestion, 0='정보없음' 제외. 값역 3~5).
      - name: bus_full_ratio
        description: 만차 비율(is_full 평균, 0~1).
      - name: bus_stop_ratio
        description: 정차 비율(stop_flag 평균, 0~1).
      - name: subway_arrival_cnt
        description: 지하철 도착정보 관측 행수.
      - name: subway_wait_avg_s
        description: 접근 중 열차 평균 잔여 도착시간(초). barvl_dt_sec=0(도착/진입) 제외.
      - name: subway_last_train_cnt
        description: 막차 관측 합(is_last_train 합).
      - name: parking_lot_cnt
        description: 관측 주차 개소 수(동×시간 distinct lot).
      - name: parking_occupancy_avg
        description: >
          평균 점유율(개소별 평균 점유율의 평균, 개소 동등가중). 과거 소수문자열 캐스트
          결손으로 전건 null 이던 시기 있음 — #72 매크로로 해소(2026-07-20 실증 #286).
      - name: parking_full_lot_cnt
        description: 만차 개소 수(개소별 시간 내 최대 점유율 >= 0.95).

  # ---------------- 기반 아카이브 골드 (#286) ----------------
  - name: dim_transit_bus_route_tier
    description: >
      버스 노선 수집 티어 분류(#286, 수집 정책 ASAC-DAG #440). grain bus_route_id.
      tier 를 routeType 원천(bronze_bus_route_master, ASAC-DAG #471)에서 직접 조인한다.
      DAG 가 수집 정책(BUS_TIER1_TYPES: 간선3·광역6)으로 tier 를 계산해 넣으므로
      dbt 는 재계산하지 않는다(단일 출처). 이전 관측 역산(#286)은 dense 창 미운행
      tier1 을 놓쳤으나(실측 140 vs 165) 원천 조인으로 해소. 관측 tier 는 검증용으로
      병기(tier_mismatch 로 원천↔수집 불일치 감지). 매 빌드 전체 재계산.
    columns:
      - name: bus_route_id
        tests:
          - not_null
          - unique
      - name: tier
        description: 1=간선·광역(전 시간대 수집), 2=그 외(하루 3회 수집).
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2], quote: false}

  - name: gold_transit_dong_15min
    config:
      meta: {serving_tier: hold, refresh: '15분'}  # 원자재 아카이브 — 서빙은 파생(dong_now·hourly)이 대체
    description: >
      동×15분 교통 상태 기반 아카이브(#286). grain (admin_dong_code, bucket_at).
      gold_transit_dong_hourly(#67)의 15분판 + 버스 tier1 한정 컬럼(*_t1, 시간대 비교
      파생 전용) + 소스별 최신 관측 시각(*_last_event_at, '지금' 카드 freshness 근거).
      원본 주 경계 삭제(ASAC-DAG #369) 대비 영구 아카이브 — full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
      - name: bucket_at
        description: 15분 버킷(KST 벽시계, transit_time_bucket). 그레인 축.
        tests:
          - not_null
      - name: bus_obs_cnt
        description: 버스 관측 행수(전 티어 — 현재 상태·커버리지 용도).
      - name: bus_obs_cnt_t1
        description: >
          버스 관측 행수(tier1 한정). 시간대끼리 비교하는 파생(리듬 G4·예측 G10)은
          반드시 *_t1 만 소비 — tier2 는 07·13·19시에만 관측돼 표본 구성이 달라짐(#440).
      - name: bus_last_event_at
        description: 버킷 내 버스 최신 관측 시각(KST) — "N분 전 관측" 표기 근거.
      - name: subway_last_event_at
        description: 버킷 내 지하철 최신 관측 시각(KST).
      - name: parking_last_event_at
        description: 버킷 내 주차 최신 관측 시각(KST).

  - name: gold_transit_route_section_30min
    config:
      meta: {serving_tier: hold, refresh: '30분'}  # 원자재 — 사용자향은 bus_route_comfort(2차) 예정
    description: >
      노선×구간×30분 버스 아카이브(#286). grain (bus_route_id, sect_ord, bucket_at).
      티어링(#440) 후 30분 주기에 맞춘 버킷 = 런 1회 스냅샷. 전 티어 저장 + tier 스탬프
      (필터는 파생 몫 — G3 프로파일은 tier=1 만). full_refresh=false 고정.
    columns:
      - name: bus_route_id
        tests:
          - not_null
      - name: sect_ord
        description: 노선 내 구간 순번(원천 sectOrd). 그레인 축 — null 행은 제외.
        tests:
          - not_null
      - name: bucket_at
        description: 30분 버킷(KST 벽시계). 그레인 축.
        tests:
          - not_null
      - name: tier
        description: >
          빌드 시점의 dim_transit_bus_route_tier 분류 스탬프. 과거 버킷 소급 재분류 없음
          (당시 수집 정책의 기록). 최근 7일 무관측 노선(dim 미등재)은 null.
        tests:
          - accepted_values:
              arguments: {values: [1, 2], quote: false}

  - name: gold_transit_parking_lot_15min
    config:
      meta: {serving_tier: hold, refresh: '15분'}  # 원자재 — 서빙은 full_risk·profile 이 대체
    description: >
      주차장 개소×15분 점유 아카이브(#286). grain (parking_id, bucket_at). 수집 5분 주기라
      버킷당 ~3관측. occ_last(max_by 최신 점유율)는 G2 변화율(연속 버킷 lag)용.
      full_refresh=false 고정.
    columns:
      - name: parking_id
        tests:
          - not_null
      - name: bucket_at
        description: 15분 버킷(KST 벽시계). 그레인 축.
        tests:
          - not_null
      - name: occ_last
        description: 버킷 내 최신 관측 점유율(max_by). 최신 관측이 결손이면 null.
      - name: admin_dong_code
        description: 개소 상수(최신 관측값 스탬프).
        tests:
          - asac_axes.axis_coverage:
              arguments: {min_ratio: 0.90}

  # ---------------- 사용자향 골드 1차 (#289) ----------------
  - name: gold_transit_dong_now
    config:
      meta:
        serving_tier: d1_direct   # 스냅샷 ~410행 — 15분 전량 교체 (ASAC-DAG#475 1차)
        refresh: '15분'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 지금 우리 동네 교통 상태
          summary: 서울 각 행정동의 현재 교통 상태를 한 행으로 보여줍니다. 버스가 얼마나 붐비는지(여유·보통·혼잡), 인근 공영주차장에 자리가 얼마나 남았는지(%), 지하철이 평균 몇 분 뒤 도착하는지를 동 단위로 묶었습니다. 각 값이 몇 분 전 관측인지도 함께 있어 얼마나 최신인지 판단할 수 있습니다.
          caveat: 버스가 자주 다니지 않는 동은 표시된 값이 수 시간 전 관측일 수 있어, 함께 제공되는 관측 시각(_last_event_at)을 확인하세요. 지하철 대기 시간은 실시간 도착정보가 있는 역 주변 동에만 채워집니다.
          use_cases:
            - 동네 교통 현황 위젯·대시보드
            - 외출 전 대중교통·주차 상황 확인
            - 행정동별 실시간 혼잡 지도
    description: >
      "지금 우리 동네 교통" 스코어카드(#289 G1). grain admin_dong_code — 소스(버스·지하철·
      주차)별 최근 24h 내 최신 관측 버킷 지표 + 관측 시각(*_last_event_at, "N분 전 관측"
      표기 근거) + 사용자 등급(혼잡 여유/보통/혼잡, 주차 여유 %, 대기 분). 매 변환 재생성
      스냅샷(table) — 경과 시간은 조회 시점 기준으로 소비 측이 계산.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
          - unique
      - name: bus_congestion_grade
        description: 혼잡 등급(여유<3.5≤보통<4.5≤혼잡). 원천 congestion 값역 3/4/5.
        tests:
          - accepted_values:
              arguments: {values: ['여유', '보통', '혼잡']}
      - name: parking_avail_pct
        description: 주차 여유 %((1-점유율)×100 반올림).

  - name: gold_transit_x_weather_dong_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G6) — 카드 화면 붙일 때 d1_direct 전환
    description: >
      날씨 조건부 교통 상태(#289 G6, × weather). grain (admin_dong_code, hour_at).
      과거 행 = 교통 실측(버스 tier1 한정) + 당시 예보(패턴 학습), 미래 행 = 예보만
      (교통 null, 전망 카드). 날씨는 최신 발표분 피벗(max_by issued_at, citydata 선례).
      과거 예보-교통 쌍의 자체 아카이브 겸용 — full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
      - name: hour_at
        tests:
          - not_null
      - name: precip_mm
        description: 예보 강수량 mm. 원천 '강수없음'은 null — PTY(precip_type)=0 과 함께 해석.
      - name: precip_type
        description: 강수형태(0없음/1비/2비눈/3눈/4소나기).
      - name: is_precip
        description: 강수 예보 여부(precip_type>0).

  - name: gold_transit_lastmile_dong_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G9)
    description: >
      지하철 주변 따릉이 라스트마일(#289 G9, × citydata). grain (admin_dong_code, hour_at),
      지하철역 보유 동 한정. 따릉이는 핫스팟 121곳 주변 대여소만 — sbike_* null 은
      "정보 없음"(대여소 없음 아님). citydata 보존 별도라 자체 아카이브 겸용 —
      full_refresh=false 고정.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
      - name: hour_at
        tests:
          - not_null
      - name: sbike_bike_last_sum
        description: 동 내 대여소별 최신 잔여 대수 합(시간 내 마지막 관측 기준).

  - name: gold_transit_dong_rhythm
    config:
      meta: {serving_tier: hold, refresh: '패턴'}  # 2차 후보 (G4 히트맵)
    description: >
      동별 요일×시간 교통 리듬(#287 G4). grain (admin_dong_code, dow, hh) — dow ISO(1=월),
      hh 0~23, KST. 아카이브(dong_15min) 전량 재집계(table). 버스는 tier1 한정·관측수 가중
      (#440 원칙 ②). *_base_n = 기여 15분 버킷 수 — 표본 부족 판단은 소비 측 몫
      (4주 누적 시 칸당 ~16). G1 '평시 대비'·G10 예측의 기준선.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
      - name: dow
        description: ISO 요일(1=월 … 7=일, bucket_at KST 기준).
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6, 7], quote: false}
      - name: hh
        description: 시간(0~23, KST).
        tests:
          - not_null
      - name: bus_base_n
        description: 버스(tier1) 기여 버킷 수 — 표본 배지 근거.

  - name: gold_transit_parking_profile
    config:
      meta:
        serving_tier: d1_direct   # dow×hh 프로파일 ~864행 — 일 1회 전량 교체 (ASAC-DAG#475 1차)
        refresh: '패턴'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 주차장 요일·시간대 혼잡 패턴
          summary: 공영주차장마다 요일과 시간대별로 평소 얼마나 차는지를 정리했습니다. 예를 들어 '이 주차장은 평일 오후에 만차 확률이 높다' 같은 평시 패턴을 만차 확률과 함께 제공합니다. 지금 상태가 아니라 '보통 이 시간엔 이렇다'는 기준선입니다.
          caveat: 관측이 쌓인 만큼 정확해지므로, 함께 제공되는 표본 수(base_n)가 적은 칸은 아직 신뢰도가 낮습니다. 운영 초기에는 표본이 얇을 수 있습니다.
          use_cases:
            - 언제 가면 자리 있나 안내
            - 주차 수요 예측·요금 정책
            - 목적지 도착 시간대 추천
    description: >
      주차장별 요일×시간 점유 프로파일(#288 G2 프로파일 축). grain (parking_id, dow, hh).
      아카이브(parking_lot_15min) 전량 재집계. full_prob = 버킷 중 occ_max>=0.95 비율.
    columns:
      - name: parking_id
        tests:
          - not_null
      - name: dow
        tests:
          - not_null
      - name: hh
        tests:
          - not_null
      - name: full_prob
        description: 만차 확률(0~1). base_n 얇으면(운영 초기) 소비 측 배지 처리.

  - name: gold_transit_parking_full_risk
    config:
      meta:
        serving_tier: d1_direct   # 스냅샷 ~108행 — 15분 전량 교체 (ASAC-DAG#475 1차)
        refresh: '15분'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 지금 주차장 만차 위험
          summary: 공영주차장별 현재 얼마나 찼는지(%)와, 채워지는 속도로 본 '만차까지 남은 예상 시간'을 보여줍니다. 여기에 '이 시간대 평소 만차 확률'을 더해, 지금 출발하면 자리가 있을지 판단하도록 했습니다.
          caveat: 만차까지 예상 시간은 최근 관측 추세로 계산해 급격한 변동(행사 등)은 빗나갈 수 있습니다. 실시간 정보를 제공하는 주차장만 포함됩니다.
          use_cases:
            - 목적지 주차 가능 여부 안내
            - 만차 임박 알림
            - 주차장 실시간 지도
    description: >
      주차장별 현재 만차 리스크 스냅샷(#288 G2). grain parking_id — 현재 점유·잔여 추정
      + 최근 1시간(4버킷) occ_last 추세의 만차까지 예상 분 + 이 시간대 평시 만차 확률
      (프로파일 조인). 매 변환 재생성 table, 기준은 아카이브 프런티어.
    columns:
      - name: parking_id
        tests:
          - not_null
          - unique
      - name: minutes_to_full_est
        description: 만차(0.95)까지 예상 분. 채워지는 중(rate>0)일 때만, 이미 만차면 0, 그 외 null.
      - name: occ_rate_per_min
        description: 분당 점유율 변화(최근 4버킷 처음↔끝). 4버킷 미만 관측이면 null.

  - name: gold_transit_bus_route_comfort
    config:
      meta: {serving_tier: hold, refresh: '패턴'}  # 2차 후보 (G3) — 행수 확인 전 서빙 투입 금지
    description: >
      노선×구간별 요일×시간 쾌적도(#288 G3). grain (bus_route_id, sect_ord, dow, hh).
      tier1(간선·광역) 한정 — tier2 는 하루 3회 관측이라 시간대 프로파일 불성립(#440).
      아카이브(route_section_30min) 전량 재집계, 관측수 가중.
    columns:
      - name: bus_route_id
        tests:
          - not_null
      - name: sect_ord
        tests:
          - not_null
      - name: base_n
        description: 기여 30분 버킷 수(같은 칸 주 1회×2버킷 → 4주 ~8).

  - name: gold_transit_event_access
    config:
      meta:
        serving_tier: d1_direct   # 행사 명부 ~1천 행 — 일 1회 전량 교체 (ASAC-DAG#475 1차)
        refresh: '1일'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 행사장 가는 길 안내
          summary: 진행·예정 문화행사마다 가장 가까운 지하철역과 공영주차장을 거리와 함께 정리했습니다. 도보 몇 분 거리에 어떤 역이 있는지, 주차장은 얼마나 가까운지, 그 시간대 주차가 붐비는지까지 한 행에 담아 '이 행사 어떻게 갈까'를 바로 답합니다.
          caveat: 역·주차장 거리는 직선거리라 실제 도보 경로와 다를 수 있습니다. 수도권 전 노선 역을 대상으로 하므로 서울 밖 역이 최근접일 수 있습니다.
          use_cases:
            - 행사 상세 페이지의 교통 안내
            - 나들이·공연 예매 서비스
            - 대중교통 vs 자차 추천
    description: >
      행사장 가는 길 안내판(#290 G7, × culture). grain event_ref — 진행·예정 행사의
      최근접 지하철역·주차장(dim 마스터 기반 great_circle_distance, 전 행사 즉시 제공)
      + 행사 시간대 최근접 주차장 평시 만차 확률(#288 프로파일, evt_hh 미상은 19시 근사·
      전 요일 평균). 매 변환 재생성 table.
    columns:
      - name: event_ref
        tests:
          - not_null
          - unique
      - name: nearest_station_dist_m
        description: 최근접 역 직선거리 m(도보 환산은 소비 측 — 80m/분 관례).
      - name: nearest_parking_full_prob
        description: >
          최근접 주차장의 행사 시간대(evt_hh) 평시 만차 확률(전 요일 평균).
          null = 실시간 미제공 lot(정보 없음).

  - name: gold_transit_supply_x_demand_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G8)
    description: >
      핫스팟 수요×공급 교통 압박(#291 G8, × citydata). grain (area_cd, hour_at).
      **범위(#291 결론)**: 핫스팟에서만 얻을 수 있는 것만 담는다 — 수요(실시간 인구·
      혼잡 라벨 + mode 별 5분 승하차)와, 압박 판정에 필요한 최소 공급(주차 점유율).
      동 축 공급 지표(관측 lot·만차 lot·버스 차량·지하철 도착)는 citydata
      gold_citydata_ppltn_x_transit_hourly 또는 gold_transit_dong_15min 을
      admin_dong_code 로 조회한다 — 같은 동의 핫스팟마다 같은 값이 반복될 뿐이라
      여기 두면 실질 중복이다. 합성 지수는 두지 않고 구성 요소 + 플래그만 노출.
      citydata 보존 별도 → 자체 아카이브, full_refresh=false.
    columns:
      - name: area_cd
        tests:
          - not_null
      - name: hour_at
        tests:
          - not_null
      - name: congest_lvl_last
        description: 시간 내 최신 혼잡 라벨(여유/보통/약간 붐빔/붐빔).
      - name: is_parking_pressured
        description: 혼잡('약간 붐빔'/'붐빔') AND 주차 점유>=0.8. 주차 실측 없는 동은 false 아님 null 주의.

  - name: gold_transit_forecast_card
    config:
      meta:
        serving_tier: d1_direct   # 예보 카드 ~7.7천 행 — 일 1회 전량 교체 (ASAC-DAG#475 1차)
        refresh: '1일'
        external: true            # 외부 카탈로그 공개(1차)
        display:
          title: 내일 이 시간 교통 예측 카드
          summary: 서울 주요 지역의 앞으로 며칠간 시간대별 예상을 담았습니다. 기대 인구(붐빌지), 날씨 예보(비/기온), 그 지역의 평시 교통 패턴을 합쳐 '내일 이 시간에 여기 가면 어떨지'를 미리 보여줍니다. 대중교통이 나은지 여부도 함께 표시합니다.
          caveat: 예보와 평시 패턴을 결합한 전망이라 실제와 다를 수 있습니다. 날씨 단기예보 가용 범위(약 +3일)까지만 제공됩니다.
          use_cases:
            - 나들이 계획 추천 서비스
            - 혼잡 회피 경로 안내
            - 날씨 연동 외출 도우미
    description: >
      "내일 이 시간 교통" 예측 카드(#292 G10, × citydata × weather). grain (area_cd,
      target_hour_at 미래 시각 — 프런티어 이후, 상한은 단기예보 +3일). 기대 인구
      (citydata 프로파일) + 날씨 예보(G6 미래 행 재사용) + 평시 교통(G4 리듬, 버스 tier1)
      3원 결합. 추천은 해석 가능한 불리언 3개(v1 단순 규칙 — 합성 점수 없음).
      매 변환 재생성 table(과거 검증은 G6 아카이브 몫).
    columns:
      - name: area_cd
        tests:
          - not_null
      - name: target_hour_at
        tests:
          - not_null
      - name: transit_recommended
        description: 주차 혼잡 예상(평시 점유>=0.8, 표본>=4) 또는 강수 예보 시 true.
      - name: rhythm_parking_base_n
        description: 리듬 기준선 표본 수(G4 승계) — 운영 초기 얇음, 소비 측 배지 판단.
