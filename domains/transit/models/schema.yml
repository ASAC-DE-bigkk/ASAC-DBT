              source_url: https://www.data.go.kr/data/15138937/openapi.do
              license: 이용허락범위 제한 없음
              license_url: https://www.data.go.kr/data/15138937/openapi.do
              redistribution: allowed_with_attribution
              attribution: 한국문화정보원
              rights_checked_at: "2026-08-04"
            - source_id: national_data_office_admin_dong_link
              source_url: https://www.data.go.kr/data/15136368/fileData.do
              license: 공공저작물 제3유형(출처표시·변경금지) — 2차 가공 집계 외부 API 재배포 승인
              license_url: https://www.kogl.or.kr/info/licenseType3.do
              redistribution: allowed_with_attribution
              attribution: 국가데이터처
              rights_checked_at: "2026-08-04"
          # usage_patterns 3건(DBT#434 기준). 행사 조회는 결과가 비는 게 정상인 질의라
          # 전건 allow_empty — 소비 측은 0행을 '조건에 맞는 행사 없음'으로 해석한다.
          usage_patterns:
            - pattern_id: event_route_lookup
              question_ko: 이 행사에 대중교통이나 자차로 어떻게 가나?
              axes: 필터(행사명 부분 일치) — 최근접 역·주차장 안내
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :q=미술관, :n=10 — ORDER BY 없는 LIMIT 은 비결정적이라 시작일 최신순 고정
                SELECT title, venue_name, gu, nearest_station_name, nearest_station_route,
                       nearest_station_dist_m, nearest_parking_name, nearest_parking_dist_m
                FROM gold_transit_event_access
                WHERE title LIKE '%' || :q || '%'
                ORDER BY event_start_date DESC, event_ref LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
              allow_empty: true
            - pattern_id: subway_easy_events_in_gu
              question_ko: 이 구에서 지하철로 가기 편한 행사는?
              axes: 구 내 행사 랭킹 — 최근접 역 거리 ASC (종료 행사 제외)
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :gu=성북구, :today=2026-08-05, :n=10
                SELECT title, venue_name, event_start_date, event_end_date,
                       nearest_station_name, nearest_station_dist_m
                FROM gold_transit_event_access
                WHERE gu = :gu AND event_end_date >= :today
                ORDER BY nearest_station_dist_m ASC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
              allow_empty: true
            - pattern_id: low_parking_stress_events_today
              question_ko: 오늘 하는 행사 중 주차 부담이 적은 곳은?
              axes: 행사 랭킹(오늘 진행 중, 주차장 도보권 한정) — 인근 주차장 평시 만차 확률 ASC
              requires: [select_columns, filter_range, filter_null, sort]
              param_defaults: { n: 10 }
              sql: |
                -- :today=2026-08-05, :max_m=500(주차장 거리 상한 — 멀어서 안 차는 행사 배제), :n=10
                SELECT title, venue_name, gu, nearest_parking_name,
                       nearest_parking_dist_m, nearest_parking_full_prob
                FROM gold_transit_event_access
                WHERE event_start_date <= :today AND event_end_date >= :today
                  AND nearest_parking_full_prob IS NOT NULL
                  AND nearest_parking_dist_m <= :max_m
                ORDER BY nearest_parking_full_prob ASC, nearest_parking_dist_m ASC LIMIT :n
              verified_rows: 10
              verified_at: "2026-08-05"
              allow_empty: true
            - pattern_id: "accessibility_by_dim"
              question_ko: "자치구·행사유형·지하철노선 중 어느 축이 대중교통/주차 접근성이 좋은가?"
              axes: "차원별 집계·랭킹(구/유형/노선 스위치) — 지표(건수/평균역거리) + 정렬방향 스위치"
              verified_rows: 0                # 실 D1 실측: [6, 10, 10] (스탬핑 대기)
              insight_sample_ko: "행사유형(dim=event_type)으로 집계하면 공연(performance)이 520건으로 가장 많고, 최근접 지하철역까지 평균 474.1m·800m 내 역 1.84개로 접근성이 양호하다."
              sql: |
                -- :dim=event_type, :sort=cnt, :dir=desc, :n=10
                SELECT CASE :dim WHEN 'event_type' THEN event_type
                            WHEN 'route' THEN nearest_station_route
                            ELSE gu END AS dim_value,
                       COUNT(*) AS event_cnt,
                       ROUND(AVG(nearest_station_dist_m), 1) AS avg_station_dist_m,
                       ROUND(AVG(stations_within_800m), 2) AS avg_stations_800m,
                       ROUND(AVG(nearest_parking_full_prob), 3) AS avg_parking_full_prob
                FROM gold_transit_event_access
                GROUP BY dim_value
                ORDER BY CASE WHEN :sort='dist' AND :dir='asc'  THEN AVG(nearest_station_dist_m) END ASC,
                         CASE WHEN :sort='dist' AND :dir='desc' THEN AVG(nearest_station_dist_m) END DESC,
                         CASE WHEN :sort='cnt'  AND :dir='asc'  THEN COUNT(*) END ASC,
                         CASE WHEN :sort='cnt'  AND :dir='desc' THEN COUNT(*) END DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "events_by_subway"
              question_ko: "이 지하철역(또는 이 호선)으로 갈 수 있는 진행 중 행사는?"
              axes: "필터(역/노선 센티널, 미종료) — 최근접 역 거리 ASC"
              verified_rows: 0                # 실 D1 실측: [10, 10, 10] (스탬핑 대기)
              insight_sample_ko: "광화문(세종문화회관)역 인근 미종료 행사 중 가장 가까운 건 역에서 35m 거리의 '2026 해치마당 미디어월 두 번째 전시'(종로구)다."
              sql: |
                -- :station=광화문(세종문화회관), :route=ALL, :today=2026-08-05, :n=10
                SELECT title, venue_name, gu, nearest_station_name, nearest_station_route,
                       nearest_station_dist_m, event_start_date, event_end_date
                FROM gold_transit_event_access
                WHERE event_end_date >= :today
                  AND (:station = 'ALL' OR nearest_station_name = :station)
                  AND (:route = 'ALL' OR nearest_station_route = :route)
                ORDER BY nearest_station_dist_m ASC, event_start_date DESC LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { station: "ALL", route: "ALL", n: 10 }
            - pattern_id: "most_subway_options_events"
              question_ko: "도보권(800m) 지하철 선택지가 가장 많은 행사는?"
              axes: "행사 랭킹(미종료, 역 개수 임계) — 800m 내 역 개수 DESC, 최근접 거리 ASC"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "800m 내 지하철역이 10개나 되는 중구 푸르지오아트홀의 '오스카 피터슨 탄생 100주년 기념 콘서트'가 대중교통 선택지가 가장 많은 행사다(최근접 을지로4가 63m)."
              sql: |
                -- :today=2026-08-05, :min_st=3, :n=10
                SELECT title, venue_name, gu, stations_within_800m,
                       nearest_station_name, nearest_station_route, nearest_station_dist_m
                FROM gold_transit_event_access
                WHERE event_end_date >= :today AND stations_within_800m >= :min_st
                ORDER BY stations_within_800m DESC, nearest_station_dist_m ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_st: 3, n: 10 }
            - pattern_id: "station_access_distribution"
              question_ko: "행사들의 지하철 접근성은 초역세권/도보권/외곽으로 어떻게 분포하나?"
              axes: "분포·비율(미종료, 구 센티널) — 거리 버킷별 건수와 비중(%)"
              verified_rows: 0                # 실 D1 실측: [3, 3] (스탬핑 대기)
              insight_sample_ko: "미종료 행사 전체(1434건)의 551건(38.4%)이 지하철역 250m 이내 초역세권에 있다. 종로구만 보면 그 비중이 73.4%로 훨씬 높다."
              sql: |
                -- :gu=ALL, :today=2026-08-05
                SELECT CASE WHEN nearest_station_dist_m <= 250 THEN '1_초역세권_250m'
                            WHEN nearest_station_dist_m <= 800 THEN '2_도보권_800m'
                            ELSE '3_외곽_800m초과' END AS access_band,
                       COUNT(*) AS event_cnt,
                       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
                FROM gold_transit_event_access
                WHERE event_end_date >= :today AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY access_band
                ORDER BY access_band
              requires: [select_columns, aggregate, group_by, window, filter_range]
              param_defaults: { gu: "ALL" }
            - pattern_id: "transit_desert_events"
              question_ko: "도보권 지하철역이 아예 없어 셔틀·자차가 필요한 행사는?"
              axes: "단면(미종료, 800m 내 역 0개, 구 센티널) — 최근접 역 거리 DESC(접근성 최악순)"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "도보권(800m) 지하철역이 하나도 없는 행사 중 최악은 최근접역이 3237m나 떨어진 종로구 서울시립 미술아카이브 프로그램이다(인근 500m 주차장도 0개)."
              sql: |
                -- :gu=ALL, :today=2026-08-05, :n=10
                SELECT title, venue_name, gu, nearest_station_name, nearest_station_dist_m,
                       nearest_parking_name, nearest_parking_dist_m, parkings_within_500m
                FROM gold_transit_event_access
                WHERE event_end_date >= :today
                  AND stations_within_800m = 0
                  AND (:gu = 'ALL' OR gu = :gu)
                ORDER BY nearest_station_dist_m DESC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { gu: "ALL", n: 10 }
            - pattern_id: "both_modes_events"
              question_ko: "지하철도 가깝고 주차도 여유 있는, 대중교통·자차 모두 편한 행사는?"
              axes: "행사 랭킹(미종료, 역·주차장 개수 임계) — 도보권 역+주차장 합 DESC"
              verified_rows: 0                # 실 D1 실측: [10, 10] (스탬핑 대기)
              insight_sample_ko: "지하철·주차 모두 편한 행사 1위는 800m 내 역 10개·500m 내 주차장 11개(인근 주차장 평시 만차확률 0)인 중구 푸르지오아트홀의 '오스카 피터슨 탄생 100주년' 공연이다."
              sql: |
                -- :today=2026-08-05, :min_st=1, :min_pk=1, :n=10
                SELECT title, venue_name, gu,
                       stations_within_800m, nearest_station_dist_m,
                       parkings_within_500m, nearest_parking_dist_m, nearest_parking_full_prob
                FROM gold_transit_event_access
                WHERE event_end_date >= :today
                  AND stations_within_800m >= :min_st
                  AND parkings_within_500m >= :min_pk
                ORDER BY (stations_within_800m + parkings_within_500m) DESC,
                         nearest_station_dist_m ASC LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_st: 1, min_pk: 1, n: 10 }
            - pattern_id: "events_in_selected_gus"
              question_ko: "선택한 여러 자치구에서 (특정 유형의) 진행 중 행사를 한꺼번에 보려면?"
              axes: "다중 선택 필터(구 배열 IN + 유형 센티널, 미종료) — 시작일 최신순"
              verified_rows: 0                # 실 D1 실측: [20, 18] (스탬핑 대기)
              insight_sample_ko: "종로·서초·마포 세 구의 미종료 행사를 시작일 최신순으로 보면 12/29 예술의전당 '함신익과 심포니 송 마스터즈 시리즈'(서초구)가 가장 나중 일정이다."
              sql: |
                -- :gus=["종로구","서초구","마포구"], :type=ALL, :today=2026-08-05, :n=20
                SELECT gu, title, venue_name, event_type, event_start_date, event_end_date,
                       nearest_station_name, nearest_station_dist_m
                FROM gold_transit_event_access
                WHERE event_end_date >= :today
                  AND gu IN (SELECT value FROM json_each(:gus))
                  AND (:type = 'ALL' OR event_type = :type)
                ORDER BY event_start_date DESC, event_ref LIMIT :n
              requires: [select_columns, filter_set, subquery, filter_range, sort]
              param_defaults: { type: "ALL", n: 20 }
          display:
            title: 행사장 가는 길 안내
            summary: 문화행사마다 가장 가까운 지하철역과 공영주차장을 거리와 함께 보여줍니다.
            caveat: 역·주차장 거리는 직선거리라 실제 도보 경로와 다를 수 있습니다. 수도권 전 노선 역을 대상으로 하므로 서울 밖 역이 최근접일 수 있습니다.
            use_cases:
              - 행사 상세 페이지의 교통 안내
              - 나들이·공연 예매 서비스
              - 대중교통 vs 자차 추천
    description: >
      행사장 가는 길 안내판(#290 G7, × culture). grain event_ref — 진행·예정 행사의
      최근접 지하철역·주차장(dim 마스터 기반 great_circle_distance, 전 행사 즉시 제공)
      + 행사 시간대 최근접 주차장 평시 만차 확률(#288 프로파일, evt_hh 미상은 19시 근사·
      전 요일 평균). 매 변환 재생성 table.
    columns:
      - name: event_ref
        description: 행사 식별자(culture 원천 승계).
        tests:
          - not_null
          - unique
      - name: event_type
        description: 행사 유형(culture 원천 분류).
      - name: title
        description: 행사명.
      - name: venue_name
        description: 행사 장소명.
      - name: event_start_date
        description: 행사 시작일.
      - name: event_end_date
        description: 행사 종료일.
      - name: event_at
        description: 행사 대표 시각.
      - name: evt_hh
        description: 행사 시간대(0~23). 미상은 19시 근사.
      - name: is_evt_hh_imputed
        description: evt_hh 근사 여부(true=19시 대체) — 만차 확률 해석 주의 신호.
      - name: admin_dong_code
        description: 행사장 행정동 코드.
      - name: gu
        description: 자치구 이름.
      - name: latitude
        description: 행사장 위도.
      - name: longitude
        description: 행사장 경도.
      - name: nearest_station_name
        description: 최근접 지하철역 이름(수도권 전 노선 대상 — 서울 밖 역 가능).
      - name: nearest_station_route
        description: 최근접 역 노선명.
      - name: nearest_station_dist_m
        description: 최근접 역 직선거리 m(도보 환산은 소비 측 — 80m/분 관례).
      - name: stations_within_800m
        description: 800m 내 지하철역 수.
      - name: nearest_parking_id
        description: 최근접 공영주차장 ID.
      - name: nearest_parking_name
        description: 최근접 공영주차장 이름.
      - name: nearest_parking_dist_m
        description: 최근접 주차장 직선거리 m.
      - name: parkings_within_500m
        description: 500m 내 공영주차장 수.
      - name: nearest_parking_full_prob
        description: >
          최근접 주차장의 행사 시간대(evt_hh) 평시 만차 확률(전 요일 평균).
          null = 실시간 미제공 lot(정보 없음).
      - name: nearest_parking_profile_base_n
        description: 만차 확률 프로파일 표본 수 합 — 소비 측 배지 판단.

  - name: gold_transit_supply_x_demand_hourly
    config:
      meta: {serving_tier: hold, refresh: '1시간'}  # 2차 후보 (G8)
    description: >
      핫스팟 수요×공급 교통 압박(#291 G8, × citydata). grain (area_cd, hour_at).
      **범위(#291 결론)**: 핫스팟에서만 얻을 수 있는 것만 담는다 — 수요(실시간 인구·
      혼잡 라벨 + mode 별 5분 승하차)와, 압박 판정에 필요한 최소 공급(주차 점유율).
      동 축 공급 지표(관측 lot·만차 lot·버스 차량·지하철 도착)는 citydata
      gold_citydata_ppltn_x_transit_hourly 또는 gold_transit_dong_15min 을
      admin_dong_code 로 조회한다 — 같은 동의 핫스팟마다 같은 값이 반복될 뿐이라
      여기 두면 실질 중복이다. 합성 지수는 두지 않고 구성 요소 + 플래그만 노출.
      citydata 보존 별도 → 자체 아카이브, full_refresh=false.
    columns:
      - name: area_cd
        tests:
          - not_null:
              config:
                where: "hour_at >= current_date - interval '{{ var('transit_test_lookback_days') }}' day"
                tags: [gate]
      - name: hour_at
        tests:
          - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
              config:
                tags: [gate]
      - name: congest_lvl_last
        description: 시간 내 최신 혼잡 라벨(여유/보통/약간 붐빔/붐빔).
      - name: is_parking_pressured
        description: 혼잡('약간 붐빔'/'붐빔') AND 주차 점유>=0.8. 주차 실측 없는 동은 false 아님 null 주의.