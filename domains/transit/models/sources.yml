version: 2

# transit 브론즈 원천. ASAC-DAG transit DAG 들이 iceberg[_dev].<TRANSIT_SCHEMA> 에 적재.
# database/schema 는 프로필(target)이 해석 → bronze·silver 동일 스키마(#51, #204).
sources:
  - name: transit_bronze
    description: Seoul transit Bronze Iceberg tables loaded by ASAC-DAG transit DAGs.
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    # 적재 지연(staleness) 게이트(#207): 실시간 DAG 20분 주기 기준 3회 연속 미적재에 warn,
    # 9회에 error. event_at "미래" 이상치 필터(#66 vars 게이트)와는 별개 축으로 상보적.
    loaded_at_field: ingested_at
    freshness:
      warn_after: {count: 60, period: minute}
      error_after: {count: 180, period: minute}
    tables:
      # --- 마스터(정적) ---
      - name: subway_station_master
        identifier: bronze_subway_station_master
        description: 서울 지하철 역사 마스터(bldn_id·bldn_nm·route·lat·lot + 계보). #162 적재.
        loaded_at_field: collected_at
        freshness: null  # 주1회(@weekly) 참조 마스터 — 분 단위 신선도 게이트 비대상(소스 공통 기준 상속 차단)
        columns:
          - name: bldn_id
            description: 역사 코드(4자리) — 마스터 PK.
            tests:
              - not_null:
                  config:
                    tags: [gate]
          - name: bldn_nm
            description: 역명(일부 괄호 부기 예 '잠실(송파구청)').
            tests:
              - not_null:
                  config:
                    tags: [hourly]
          - name: route
            description: 노선 라벨(예 '2호선','신분당선','7호선(인천)').
            tests:
              # gate: dim 의 (station_name_join, route) 조인 계약 축(원천) — 애매하면 gate.
              - not_null:
                  config:
                    tags: [gate]
          - name: lat
            description: 위도(WGS84 십진도, varchar).
          - name: lot
            description: 경도(WGS84 십진도, varchar).
          - name: load_date
            tests:
              - not_null:
                  config:
                    tags: [gate]

      - name: bus_route_master
        identifier: bronze_bus_route_master
        description: >
          버스 노선 마스터(getBusRouteList 주간 스냅샷, ASAC-DAG #471) — bus_route_id·
          bus_route_nm·route_type·tier + 계보. tier 는 수집 정책(BUS_TIER1_TYPES)으로
          DAG 에서 계산됨(간선3·광역6=1, 그 외=2). dim_transit_bus_route_tier 가 소비.
        loaded_at_field: collected_at
        freshness: null  # 주1회 참조 마스터 — 분 단위 신선도 게이트 비대상
        columns:
          - name: bus_route_id
            description: >
              노선 ID(busRouteId) — 스냅샷 내 PK. 주간 재적재로 load_date 마다 전체
              스냅샷이 쌓이므로 테이블 전역 unique 는 두 번째 적재(2026-07-26)부터
              구조적으로 거짓 — 유일성 계약은 (bus_route_id, load_date) 단위로
              assert_transit_bronze_bus_route_master_pk_per_load_date 가 지킨다.
            tests:
              - not_null:
                  config:
                    tags: [gate]
          - name: route_type
            description: >
              원천 routeType(varchar — 3간선·6광역·4지선·8경기 등 서울 API 코드).
              not_null 을 걸지 않는다: 원천이 빈 routeType 을 주면 tier 는 2로 분류되고
              route_type 은 NULL 로 적재되는데, source not_null 실패는 dbt build 를
              정지시켜(변환 중단) 얻는 것보다 잃는 게 크다. 빈 값은 tier=2 로 안전 흡수.
          - name: tier
            description: 1=간선·광역(dense 수집), 2=그 외. DAG 가 BUS_TIER1_TYPES 로 판정.
            tests:
              - not_null:
                  config:
                    tags: [hourly]
              - accepted_values:
                  arguments: {values: [1, 2], quote: false}
                  config:
                    tags: [hourly]

      - name: park_info_master
        identifier: bronze_park_info_master
        description: 서울 주차장 정보 마스터(pklt_cd·pklt_nm·addr·lat·lot 등 39필드 + 계보). #162 적재.
        # 원천 권리(#406 C4). manifest→D1 전달 형식은 공통 표준화 확정 시 이관(#406 공통 결손).
        meta:
          source_rights:
            source_name: 서울시 공영주차장 안내 정보
            dataset_id: OA-13122
            source_url: https://data.seoul.go.kr/dataList/OA-13122/S/1/datasetView.do
            api_service: GetParkInfo
            license: 공공누리 제1유형(출처표시)
            attribution: 서울특별시
            commercial_use: true
            redistribution: true
            verified_at: "2026-08-03"
        loaded_at_field: collected_at
        freshness: null  # 주1회(@weekly) 참조 마스터 — 분 단위 신선도 게이트 비대상(소스 공통 기준 상속 차단)
        columns:
          - name: pklt_cd
            description: 주차장 코드 — 마스터 PK.
            tests:
              - not_null:
                  config:
                    tags: [gate]
          - name: pklt_nm
            tests:
              - not_null:
                  config:
                    tags: [hourly]
          - name: addr
            description: 주소(첫 토큰이 자치구인 경우가 많음).
          - name: lat
          - name: lot
          - name: load_date
            tests:
              - not_null:
                  config:
                    tags: [gate]

      # --- 실시간(스트리밍) ---
      # 테스트 스코핑(B안): raw not_null 은 최근 var(transit_test_lookback_days)일
      # (ingested_at UTC — 저장 관례는 assert_transit_bronze_future_event_at_ratio 와 동일)만
      # 검증한다. ingested_at 자신의 not_null 은 자기 where 가 null 을 걸러 공검증이 되므로
      # 스코핑하지 않는다(전량 유지 — Iceberg null-count 프루닝으로 저렴).
      - name: subway_arrival
        identifier: bronze_subway_arrival
        description: >
          지하철 실시간 도착정보. 1행 = 도착예측 1건, 페이로드는 raw(JSON) 컬럼.
          핵심 키 statnId/ordkey/recptnDt, 노선 subwayId, 역명 statnNm.
        columns:
          - name: raw
            description: 도착예측 1건 JSON 페이로드.
            tests:
              - not_null:
                  config:
                    where: "ingested_at >= cast(at_timezone(current_timestamp, 'UTC') as timestamp(6)) - interval '{{ var('transit_test_lookback_days') }}' day"
                    tags: [hourly]
          - name: ingested_at
            tests:
              - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
                  config:
                    tags: [gate]

      - name: parking
        identifier: bronze_parking
        description: >
          주차장 실시간(GetParkingInfo). 1행 = 주차장 스냅샷 1건, 페이로드는 raw(JSON).
          키 PKLT_CD, 갱신시각 NOW_PRK_VHCL_UPDT_TM, 현재주차 NOW_PRK_VHCL_CNT.
        # 원천 권리(#406 C4). manifest→D1 전달 형식은 공통 표준화 확정 시 이관(#406 공통 결손).
        meta:
          source_rights:
            source_name: 서울시 시영주차장 실시간 주차대수 정보
            dataset_id: OA-21709
            source_url: https://data.seoul.go.kr/dataList/OA-21709/A/1/datasetView.do
            api_service: GetParkingInfo
            license: 공공누리 제1유형(출처표시)
            attribution: 서울특별시
            commercial_use: true
            redistribution: true
            verified_at: "2026-08-03"
        columns:
          - name: raw
            tests:
              - not_null:
                  config:
                    where: "ingested_at >= cast(at_timezone(current_timestamp, 'UTC') as timestamp(6)) - interval '{{ var('transit_test_lookback_days') }}' day"
                    tags: [hourly]
          - name: ingested_at
            tests:
              - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
                  config:
                    tags: [gate]

      - name: bus_position
        identifier: bronze_bus_position
        description: >
          버스 실시간 위치(getBusPosByRtid). 1행 = 노선 1회 호출 응답, raw 는 XML(<itemList> 다건).
          Trino xpath 부재로 regexp_extract_all + UNNEST 로 파싱(vehId/dataTm/gpsX/gpsY).
        columns:
          - name: raw
            description: ServiceResult XML(다수 itemList 포함).
            tests:
              - not_null:
                  config:
                    where: "ingested_at >= cast(at_timezone(current_timestamp, 'UTC') as timestamp(6)) - interval '{{ var('transit_test_lookback_days') }}' day"
                    tags: [hourly]
          - name: ingested_at
            tests:
              - not_null:  # 시간축 자신 — 스코핑 금지(공검증)
                  config:
                    tags: [gate]

  # ---- 크로스 도메인 published 테이블 (#289) ----
  # citydata 프로젝트의 관례(sources.yml)와 동일: database 는 target 이 해석(iceberg[_dev]),
  # schema 는 상대 도메인 고정. 신선도 게이트는 상대 도메인 소관이라 걸지 않는다.
  - name: weather
    description: 날씨 도메인 published 테이블 (ASAC-DBT domains/weather).
    database: "{{ target.database }}"
    schema: weather
    tables:
      - name: silver_weather_forecast_by_admin_dong
        description: >
          기상청 단기예보(행정동 매핑) long 포맷 — admin_dong_code·forecast_at·category·
          fcst_value_num·issued_at. (동,예보시각,카테고리)별 발표가 갱신되므로 소비 측이
          max_by(…, issued_at) 로 최신 발표분을 골라 피벗한다(citydata 선례).

  - name: seoul_citydata
    description: citydata 도메인 published 테이블 (ASAC-DBT domains/citydata).
    database: "{{ target.database }}"
    # 스키마 이름이 target 마다 다르다 — dev=seoul_citydata / prod=citydata (#556 컷오버).
    # culture 952fd36 관례: 기본값을 target 으로 가르고 env_var 는 오너 오버라이드용으로 유지.
    schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'citydata' if target.name == 'prod' else 'seoul_citydata') }}"
    tables:
      - name: silver_citydata_sbike
        description: >
          따릉이 대여소 실시간 — spot_id·parking_count(잔여)·rack_count·observed_at·
          admin_dong_code(핫스팟 121곳 주변). 수집 5분 주기.
      - name: silver_citydata_ppltn
        description: >
          핫스팟 실시간 인구 — area_cd·event_at·area_congest_lvl(여유/보통/약간 붐빔/붐빔)·
          area_ppltn_min/max·admin_dong_code. 5분 주기.
      - name: silver_citydata_transit_ppltn
        description: >
          핫스팟 대중교통 승하차 — area_cd·mode(bus/subway)·observed_at·
          gton/gtoff_5min_min/max(승차/하차)·station_count. 수집 5분 주기.
          버스 티어링(ASAC-DAG #440) 이후 버스 '수요' 축은 이 소스가 5분 해상도로 보강.
      # (gold_citydata_ppltn_forecast 삭제 — 상류가 citydata e684c2c 에서 제거되어
      #  유일 소비자 forecast_card 도 함께 삭제, ASAC-DBT#432)

  - name: culture
    description: 문화 도메인 published 테이블 (ASAC-DBT domains/culture).
    database: "{{ target.database }}"
    schema: culture
    tables:
      - name: gold_culture_event_schedule
        description: >
          공연·전시·행사 일정 — event_ref·event_type·title·venue_name·
          event_start/end_date·event_at(시각, 일부만)·latitude/longitude·admin_dong_code.
