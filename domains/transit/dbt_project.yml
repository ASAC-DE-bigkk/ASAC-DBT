name: transit
version: "1.0.0"
config-version: 2

profile: transit

flags:
  require_certificate_validation: true

# transit silver 신선도(상한) 게이트 임계 (#66). event_at(KST 벽시계) > utc_to_kst(ingested_at)+스큐
# 인 미래 행을 silver 에서 차단한다. 한 곳에서만 정의해 모델 3종·감시 테스트가 공유(리터럴 중복 금지).
vars:
  # 상한 허용 오차(분): 수집 파이프 클럭 스큐 감안. macros/freshness.sql 참조.
  transit_freshness_skew_minutes: 10
  # bronze 원천의 미래 event_at 비율이 이 값을 넘으면 감시 warn 테스트가 경고(조용한 대량 드랍 방지).
  transit_freshness_warn_ratio: 0.05
  # 감시 warn 테스트의 관측 윈도(시간, ingested_at 기준). 전 이력 비율은 이력이 쌓일수록
  # 급성 이상(예: 원천 시계 붕괴로 당일 100% 미래)을 임계 아래로 희석하므로 최근 윈도로만 잰다.
  transit_freshness_monitor_hours: 24

  # 아카이브 개시일(KST) — 이 시각 이전 관측은 gold 아카이브에 넣지 않는다.
  # 배경: 2026-07-20 이전 데이터는 (1) silver grain 중복(버스 2,054·주차 2,592·지하철
  # 10,315행), (2) 티어링 미실효로 전 노선이 매 런 수집돼 tier 스탬프가 무의미,
  # (3) 수집 정책 자체가 달랐다(24시간 균등 vs 시간창). 이 셋이 섞인 이력을 영구
  # 아카이브에 남기면 프로파일·리듬 baseline 이 오염된 채 고정되므로, 새 수집 정책이
  # 시작되는 2026-07-21 09:00 KST 부터 새로 쌓는다(사용자 결정, 기존 테이블은 드롭).
  # ⚠️ 이 값을 과거로 낮추면 오염 구간이 아카이브로 유입된다 — 낮추기 전 silver 정합 확인.
  transit_archive_start_at: "2026-07-21 09:00:00"



model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

# dim: 최신 load_date 스냅샷 차원. 주 1회 변하는 공간 조인(ST_Contains)이라
#   view 로 두면 silver/테스트가 매 빌드마다 point-in-polygon 을 재수행한다.
#   table 로 물화해 시간당 빌드의 반복 재계산을 제거한다.
# silver: 시간당 수집분 incremental.
# gold: silver 를 동×시간 버킷으로 재집계하는 마트도 incremental(merge, -3h lookback #67).
#
# tag:heavy — 아카이브 전량을 매 런 재집계하는 프로파일 4종(materialized='table').
#   15분 신선도가 불필요해 transit_transform_heavy DAG 가 --select tag:heavy 로
#   느린 주기에 따로 빌드하고, transit_transform(*/15)은 --exclude tag:heavy 로
#   제외한다(#443 에서 예고한 분리). 실시간성 있는 table 모델(dong_now,
#   forecast_card, parking_full_risk)은 의도적으로 heavy 가 아니다 — 추가 전에
#   제품 오너 확인 필요.
models:
  transit:
    dim:
      +materialized: table
    silver:
      +materialized: incremental
    gold:
      +materialized: incremental
      gold_transit_dong_rhythm:
        +tags: [heavy]
      gold_transit_parking_profile:
        +tags: [heavy]
      gold_transit_bus_route_comfort:
        +tags: [heavy]
      gold_transit_event_access:
        +tags: [heavy]

# 지하철 실시간 arrival 의 subwayId 코드 → 역명마스터 route 라벨 crosswalk.
# 하나의 subwayId 가 복수 route 라벨을 포괄하는 경우(1075→분당선·수인선,
# 1077→신분당선·신분당선(연장)·(연장2)) subway_id 다행으로 매핑을 확장한다.
# 행안부/노선 코드는 varchar 고정(선행 0/숫자 오인 방지).
seeds:
  transit:
    +quote_columns: false
    seoul_subway_line_code:
      +column_types:
        subway_id: varchar
        line_name: varchar
