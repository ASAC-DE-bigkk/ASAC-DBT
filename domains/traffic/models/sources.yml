version: 2

sources:
  - name: traffic_bronze
    description: Seoul TOPIS traffic Bronze Iceberg tables loaded by ASAC-DAG.
    database: "{{ target.database }}"
    schema: "{{ env_var('ASK_SEOUL_SCHEMA', 'ask_seoul') }}"
    loaded_at_field: collected_at
    freshness:
      warn_after: {count: 30, period: minute}
      error_after: {count: 2, period: hour}
    tables:
      - name: seoul_traffic_incident
        identifier: bronze_seoul_traffic_incident
        description: Seoul TOPIS AccInfo incident rows with raw lineage metadata.
        columns:
          - name: request_id
            tests:
              - not_null
          - name: source_id
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: request_params_json
            tests:
              - not_null
          - name: acc_id
            tests:
              - not_null
          - name: start_index
            tests:
              - not_null
          - name: end_index
            tests:
              - not_null
          - name: occr_date
            tests:
              - not_null
          - name: occr_time
            tests:
              - not_null
          - name: grs80tm_x
            description: TOPIS source GRS80 TM X coordinate, not WGS84 longitude.
          - name: grs80tm_y
            description: TOPIS source GRS80 TM Y coordinate, not WGS84 latitude.
          - name: result_code
            tests:
              - not_null
          - name: result_msg
            tests:
              - not_null
          - name: raw_object_key
            tests:
              - not_null
          - name: payload_hash
            tests:
              - not_null
          - name: http_status
            tests:
              - not_null
          - name: list_total_count
            tests:
              - not_null
          - name: row_count
            tests:
              - not_null
          - name: collected_at
            tests:
              - not_null
          - name: load_date
            tests:
              - not_null
          - name: dag_run_id
            tests:
              - not_null

      - name: collection_run_manifest
        identifier: bronze_collection_run_manifest
        description: Bronze DAG run-level publish gate written by ASAC-DAG.
        loaded_at_field: event_at
        columns:
          - name: source_id
            tests:
              - not_null
          - name: dag_run_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null
          - name: is_publishable
            tests:
              - not_null
          - name: event_at
            tests:
              - not_null

      - name: seoul_traffic_incident_request_audit
        identifier: bronze_seoul_traffic_incident_request_audit
        description: Seoul TOPIS AccInfo request-level audit rows, including normal zero-row responses.
        columns:
          - name: request_id
            tests:
              - not_null
          - name: source_id
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: start_index
            tests:
              - not_null
          - name: end_index
            tests:
              - not_null
          - name: request_params_json
            tests:
              - not_null
          - name: raw_object_key
            tests:
              - not_null
          - name: payload_hash
            tests:
              - not_null
          - name: http_status
            tests:
              - not_null
          - name: result_code
            tests:
              - not_null
          - name: result_msg
            tests:
              - not_null
          - name: list_total_count
            tests:
              - not_null
          - name: row_count
            tests:
              - not_null
          - name: collected_at
            tests:
              - not_null
          - name: load_date
            tests:
              - not_null
          - name: dag_run_id
            tests:
              - not_null
