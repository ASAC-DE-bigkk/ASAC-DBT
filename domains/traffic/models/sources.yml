version: 2

sources:
  - name: traffic_bronze
    description: Seoul TOPIS traffic Bronze Iceberg tables loaded by ASAC-DAG.
    database: "{{ target.database }}"
    schema: "{{ env_var('ASK_SEOUL_SCHEMA', 'ask_seoul') }}"
    tables:
      - name: seoul_traffic_incident
        identifier: bronze_seoul_traffic_incident
        description: Seoul TOPIS AccInfo incident rows with raw lineage metadata.
        freshness: null
        columns:
          - name: request_id
            description: API request identifier for this parsed TOPIS record.
            tests:
              - not_null
          - name: source_id
            description: Fixed source identifier for TOPIS AccInfo incidents.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: request_params_json
            description: Redacted request parameters retained for reproducibility.
            tests:
              - not_null
          - name: acc_id
            description: Stable TOPIS accident identifier used as the Silver record key.
            tests:
              - not_null
          - name: start_index
            description: Inclusive TOPIS page start index.
            tests:
              - not_null
          - name: end_index
            description: Inclusive TOPIS page end index.
            tests:
              - not_null
          - name: occr_date
            description: Source incident occurrence date component (YYYYMMDD).
            tests:
              - not_null
          - name: occr_time
            description: Source incident occurrence time component; TOPIS may provide HHMM or HHMMSS.
            tests:
              - not_null
          - name: grs80tm_x
            description: TOPIS source GRS80 TM X coordinate, not WGS84 longitude.
          - name: grs80tm_y
            description: TOPIS source GRS80 TM Y coordinate, not WGS84 latitude.
          - name: result_code
            description: TOPIS response result code; INFO-000 rows are eligible for Silver.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message corresponding to result_code.
            tests:
              - not_null
          - name: raw_object_key
            description: R2 object key holding the raw TOPIS response.
            tests:
              - not_null
          - name: payload_hash
            description: Raw response content fingerprint.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded by the collection task.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported total incident count for the request.
            tests:
              - not_null
          - name: row_count
            description: Number of incident rows parsed from this response page.
            tests:
              - not_null
          - name: collected_at
            description: Bronze collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow collection run lineage.
            tests:
              - not_null
          - name: exp_clr_date
            description: TOPIS expected-clear date component; nullable when not supplied.
          - name: exp_clr_time
            description: TOPIS expected-clear time component; nullable when not supplied.
          - name: acc_type
            description: TOPIS incident type classification.
          - name: acc_dtype
            description: TOPIS detailed incident type classification.
          - name: link_id
            description: TOPIS road-link identifier; nullable source attribute.
          - name: acc_info
            description: TOPIS incident free-text information; nullable source attribute.
          - name: acc_road_code
            description: TOPIS road code; nullable source attribute.

      - name: collection_run_manifest
        identifier: bronze_collection_run_manifest
        description: Bronze DAG run-level publish gate written by ASAC-DAG.
        loaded_at_field: event_at
        freshness:
          warn_after: {count: 15, period: minute}
          error_after: {count: 30, period: minute}
        columns:
          - name: source_id
            description: Source identifier for the publish-gate manifest.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow run whose Bronze output is being published.
            tests:
              - not_null
          - name: status
            description: Collection terminal status; Silver accepts SUCCESS only.
            tests:
              - not_null
          - name: is_publishable
            description: Explicit gate allowing downstream dbt consumption.
            tests:
              - not_null
          - name: event_at
            description: Manifest event timestamp used for freshness monitoring.
            tests:
              - not_null

      - name: seoul_traffic_incident_request_audit
        identifier: bronze_seoul_traffic_incident_request_audit
        description: Seoul TOPIS AccInfo request-level audit rows, including normal zero-row responses.
        freshness: null
        columns:
          - name: request_id
            description: API request identifier for the audited TOPIS page.
            tests:
              - not_null
          - name: source_id
            description: Fixed TOPIS source identifier.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: start_index
            description: Inclusive requested page start index.
            tests:
              - not_null
          - name: end_index
            description: Inclusive requested page end index.
            tests:
              - not_null
          - name: request_params_json
            description: Redacted request parameters retained for reproducibility.
            tests:
              - not_null
          - name: raw_object_key
            description: R2 object key holding the raw response.
            tests:
              - not_null
          - name: payload_hash
            description: Raw response content fingerprint.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded by collection.
            tests:
              - not_null
          - name: result_code
            description: TOPIS response result code.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported total count for the audited request.
            tests:
              - not_null
          - name: row_count
            description: Number of parsed rows for the audited request, including valid zero-row responses.
            tests:
              - not_null
          - name: collected_at
            description: Audit record collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow collection run lineage.
            tests:
              - not_null
