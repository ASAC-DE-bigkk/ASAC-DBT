version: 2

models:
  - name: gold_weather_place_forecast_change_daily
    description: 장소·예보일별 최근 두 KMA 발표를 비교해 기온·강수확률·첫 강수 예상시각의 수정 내역을 제공하는 공개 Gold 제품입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: weather_place_forecast_change_daily
          product_question: 특정 장소의 일별 예보는 직전 KMA 발표보다 어떻게 바뀌었습니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: weather.compare_forecast_change_daily
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 서울역의 내일 예보는 직전 발표와 비교해 어떻게 바뀌었나요?
              - 이 장소의 강수확률이나 기온 예보 수정 내역을 알려주세요.
              - 여의도공원의 첫 강수 예상 시각이 이전 예보보다 달라졌나요?
          grain: place_id와 forecast_date마다 한 행 — 최신 발표와 직전 발표의 일별 비교.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: fail
          publication_trigger:
            trigger_type: asset
            max_interval_minutes: 240
          event_time: latest_issued_at
          freshness_slo_minutes: 240
          retention_or_horizon: 게시 시점 기준 오늘 이후의 최신 예보 일자만 유지합니다.
          shape: wide
          # D1/클라이언트가 실행하는 SQL이 아닌 카탈로그 참조 구현입니다.
          # D1 재게시 전이므로 verified_* 실측·인사이트는 선언하지 않습니다.
          usage_patterns:
            - pattern_id: forecast_change_for_place_date
              question_ko: 특정 장소·예보일에서 최신 발표는 직전 발표보다 어떻게 바뀌었습니까?
              axes: 장소·예보일 필터 — 최신·직전 발표 변화 비교
              requires: [select_columns]
              allow_empty: true
              sql: |
                -- :place_id, :forecast_date
                SELECT place_name, admin_dong, gu, forecast_date,
                       latest_issued_at, previous_issued_at, change_state,
                       min_temp_change_c, max_temp_change_c,
                       max_precip_prob_change_pct,
                       latest_first_precipitation_at, previous_first_precipitation_at
                FROM gold_weather_place_forecast_change_daily
                WHERE place_id = :place_id
                  AND forecast_date = :forecast_date
          public_projection:
            schema_version: "1.1.0"
            columns: [product_row_id, place_id, forecast_date, latest_issued_at, change_state, place_name, admin_dong_code, admin_dong, gu_code, gu, previous_issued_at, issue_gap_hours, latest_category_count, previous_category_count, latest_forecast_hour_count, previous_forecast_hour_count, latest_min_temp_c, previous_min_temp_c, min_temp_change_c, latest_max_temp_c, previous_max_temp_c, max_temp_change_c, latest_max_precip_prob_pct, previous_max_precip_prob_pct, max_precip_prob_change_pct, latest_first_precipitation_at, previous_first_precipitation_at, latest_collected_at_max, previous_collected_at_max]
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Weather 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
            - rapidapi_serving
          cross_domain_usage_examples:
            - 강수 대응 서비스에서 최신 발표와 직전 발표의 강수확률 변화를 함께 확인합니다.
            - 행사 운영 분석에서 장소별 최고·최저기온 예보가 발표 사이에 얼마나 바뀌었는지 확인합니다.
          product_question: 특정 장소의 일별 예보는 직전 KMA 발표보다 어떻게 바뀌었습니까?
          row_meaning: >-
            최신 기상청 발표와 그 직전 발표를 비교한 장소(place_id)·예보일(forecast_date)별
            예보 변화 1건입니다.
          grain: place_id와 forecast_date마다 한 행 — 최신 발표와 직전 발표의 일별 비교.
          anchor_universe: >-
            최신 발표에 존재하는 장소·예보일 조합을 기준으로 하며, 비교할 직전 발표가 없더라도
            최신 발표 행은 유지합니다.
          usage_guidance: >-
            change_state를 먼저 확인한 뒤 기온·강수확률·최초 강수 예보 시각의 전후 값을 비교하고,
            latest_issued_at과 previous_issued_at으로 실제 비교 대상 발표를 확인합니다.
          do_not_use_for: >-
            관측소 실측 날씨나 사후 확정값 조회, 장기 기후 평년값 또는 계절 전망에 사용하지 않습니다.
          semantic_caveats: >-
            forecast_date는 Asia/Seoul 기준 예보일입니다. 직전 발표가 없으면 previous 계열 값과
            변화량이 비어 있을 수 있으며, 최초 강수 예보 시각은 실제 강수 시작 시각이 아닙니다.
          primary_key: [product_row_id]
          column_order:
            - product_row_id
            - place_id
            - forecast_date
            - latest_issued_at
            - change_state
            - place_name
            - admin_dong_code
            - admin_dong
            - gu_code
            - gu
            - previous_issued_at
            - issue_gap_hours
            - latest_category_count
            - previous_category_count
            - latest_forecast_hour_count
            - previous_forecast_hour_count
            - latest_min_temp_c
            - previous_min_temp_c
            - min_temp_change_c
            - latest_max_temp_c
            - previous_max_temp_c
            - max_temp_change_c
            - latest_max_precip_prob_pct
            - previous_max_precip_prob_pct
            - max_precip_prob_change_pct
            - latest_first_precipitation_at
            - previous_first_precipitation_at
            - latest_collected_at_max
            - previous_collected_at_max
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: latest_collected_at_max 기준 240분 이내 갱신을 목표로 합니다.
            as_of_meaning: >-
              latest_issued_at은 최신 비교 기준 발표이고 previous_issued_at은 바로 직전 비교 발표입니다.
            late_repair_policy: >-
              지연 수집이나 원천 정정이 반영되면 같은 product_row_id의 비교 결과를 다시 계산해 교체합니다.
            roles:
              latest_issued_at:
                time_role: latest_issue
                timezone: Asia/Seoul
              previous_issued_at:
                time_role: previous_issue
                timezone: Asia/Seoul
              latest_first_precipitation_at:
                time_role: latest_first_precipitation_forecast
                timezone: Asia/Seoul
              previous_first_precipitation_at:
                time_role: previous_first_precipitation_forecast
                timezone: Asia/Seoul
              latest_collected_at_max:
                time_role: latest_collection
                timezone: Asia/Seoul
              previous_collected_at_max:
                time_role: previous_collection
                timezone: Asia/Seoul
          space:
            enabled: false
          metrics: {}
          joins: {}
          quality:
            completeness_explanation: >-
              최신 발표의 장소·예보일 행을 기준으로 하며, 직전 발표가 없을 때도 최신 행은 유지합니다.
            coverage_explanation: >-
              장소 기준정보와 연결되고 최신 발표에 포함된 서울 장소·예보일 조합을 제공합니다.
            freshness_explanation: >-
              latest_collected_at_max를 기준으로 최신 수집 시각과 240분 갱신 목표를 확인합니다.
            state_fields:
              change_state:
                allowed_values:
                  - no_previous_issue
                  - partial_comparison
                  - changed
                  - unchanged
                state_explanations:
                  no_previous_issue: 비교 가능한 직전 발표가 없어 최신 발표만 제공하는 상태입니다.
                  partial_comparison: 최신·직전 발표는 있으나 기온·강수확률·첫 강수 예보 시각 중 일부만 비교할 수 있는 상태입니다.
                  changed: 비교 가능한 핵심 예보 값 중 하나 이상이 직전 발표와 달라진 상태입니다.
                  unchanged: 비교 가능한 핵심 예보 값이 직전 발표와 모두 같은 상태입니다.
          lineage:
            source_relations:
              - model.asac_seoul.silver_weather_forecast_by_admin_dong
            identifiers:
              as_of:
                columns:
                  - latest_issued_at
                  - forecast_date
              publication:
                relation_level_only: true
                columns: []
              raw:
                relation_level_only: true
                columns: []
              request:
                relation_level_only: true
                columns: []
              run:
                relation_level_only: true
                columns: []
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: place_id와 forecast_date를 직렬화한 식별자입니다.
        data_type: varchar
        tests: [not_null, unique]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_id
        description: 장소 식별자입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: place_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_name
        description: 사용자에게 표시하는 장소명입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: false
            null_meaning: 매핑된 장소의 표시 이름이 없으면 공개 제품 행으로 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong_code
        description: 장소가 속한 legacy mapping 기준 행정동 10자리 코드입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 장소 mapping에 행정동 코드가 없으면 공개 제품 행으로 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong
        description: 장소가 속한 행정동명입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 장소 mapping에 행정동명이 없으면 공개 제품 행으로 허용하지 않습니다.
            unit: not_applicable
      - name: gu_code
        description: 장소가 속한 자치구 5자리 코드입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 장소 mapping에 자치구 코드가 없으면 공개 제품 행으로 허용하지 않습니다.
            unit: not_applicable
      - name: gu
        description: 장소가 속한 자치구명입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 장소 mapping에 자치구명이 없으면 공개 제품 행으로 허용하지 않습니다.
            unit: not_applicable
      - name: forecast_date
        description: 비교 대상 KST 예보일입니다.
        data_type: date
        tests: [not_null]
        config:
          meta:
            semantic_role: temporal_attribute
            nullable: false
            null_meaning: forecast_date 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: latest_issued_at
        description: 비교에 사용한 최신 KMA 발표 시각입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: latest_issued_at 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            time_role: latest_issue
            timezone: Asia/Seoul
            unit: not_applicable
      - name: previous_issued_at
        description: 비교에 사용한 직전 KMA 발표 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: 비교 가능한 직전 발표가 없어 change_state가 no_previous_issue인 경우입니다.
            time_role: previous_issue
            timezone: Asia/Seoul
            unit: not_applicable
      - name: issue_gap_hours
        description: 직전 발표부터 최신 발표까지의 시간 차이입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 비교 가능한 직전 발표가 없어 발표 간격을 계산할 수 없는 경우입니다.
            unit: hour
      - name: latest_category_count
        description: 최신 발표에서 해당 장소·예보일에 확인된 KMA 카테고리 수입니다.
        data_type: bigint
        tests: [not_null]
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: 집계 값이므로 null을 허용하지 않습니다.
            unit: count
      - name: previous_category_count
        description: 직전 발표에서 해당 장소·예보일에 확인된 KMA 카테고리 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 비교 가능한 직전 발표가 없는 경우입니다.
            unit: count
      - name: latest_forecast_hour_count
        description: 최신 발표에서 해당 장소·예보일에 포함된 서로 다른 예보 대상 시각 수입니다.
        data_type: bigint
        tests: [not_null]
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: 집계 값이므로 null을 허용하지 않습니다.
            unit: count
      - name: previous_forecast_hour_count
        description: 직전 발표에서 해당 장소·예보일에 포함된 서로 다른 예보 대상 시각 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 비교 가능한 직전 발표가 없는 경우입니다.
            unit: count
      - name: latest_min_temp_c
        description: 최신 발표가 예보한 해당 날짜의 최저기온이며 TMN이 없으면 시간별 TMP 최솟값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 발표에 TMN과 수치형 TMP가 모두 없어 최저기온을 계산할 수 없는 경우입니다.
            unit: celsius
      - name: previous_min_temp_c
        description: 직전 발표가 예보한 해당 날짜의 최저기온이며 TMN이 없으면 시간별 TMP 최솟값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 직전 발표가 없거나 직전 발표에 TMN과 수치형 TMP가 모두 없는 경우입니다.
            unit: celsius
      - name: min_temp_change_c
        description: 최신 최저기온에서 직전 최저기온을 뺀 변화량입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 또는 직전 최저기온 중 하나가 없어 변화량을 계산할 수 없는 경우입니다.
            unit: celsius
      - name: latest_max_temp_c
        description: 최신 발표가 예보한 해당 날짜의 최고기온이며 TMX가 없으면 시간별 TMP 최댓값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 발표에 TMX와 수치형 TMP가 모두 없어 최고기온을 계산할 수 없는 경우입니다.
            unit: celsius
      - name: previous_max_temp_c
        description: 직전 발표가 예보한 해당 날짜의 최고기온이며 TMX가 없으면 시간별 TMP 최댓값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 직전 발표가 없거나 직전 발표에 TMX와 수치형 TMP가 모두 없는 경우입니다.
            unit: celsius
      - name: max_temp_change_c
        description: 최신 최고기온에서 직전 최고기온을 뺀 변화량입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 또는 직전 최고기온 중 하나가 없어 변화량을 계산할 수 없는 경우입니다.
            unit: celsius
      - name: latest_max_precip_prob_pct
        description: 최신 발표에서 해당 날짜의 시간별 강수확률 중 최댓값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 발표에 수치형 POP가 없어 최대 강수확률을 계산할 수 없는 경우입니다.
            unit: percent
      - name: previous_max_precip_prob_pct
        description: 직전 발표에서 해당 날짜의 시간별 강수확률 중 최댓값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 직전 발표가 없거나 직전 발표에 수치형 POP가 없는 경우입니다.
            unit: percent
      - name: max_precip_prob_change_pct
        description: 최신 최대 강수확률에서 직전 최대 강수확률을 뺀 퍼센트포인트 변화량입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 최신 또는 직전 최대 강수확률 중 하나가 없어 변화량을 계산할 수 없는 경우입니다.
            unit: percentage_point
      - name: latest_first_precipitation_at
        description: 최신 발표에서 PTY가 0이 아닌 첫 KST 예보 대상 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: 해당 예보일에 비나 눈 형태가 예보되지 않은 경우입니다.
            time_role: latest_first_precipitation_forecast
            timezone: Asia/Seoul
            unit: not_applicable
      - name: previous_first_precipitation_at
        description: 직전 발표에서 PTY가 0이 아닌 첫 KST 예보 대상 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: 직전 발표가 없거나 해당 예보일에 비나 눈 형태가 예보되지 않은 경우입니다.
            time_role: previous_first_precipitation_forecast
            timezone: Asia/Seoul
            unit: not_applicable
      - name: change_state
        description: 이전 발표 없음, 부분 비교, 변경, 동일을 구분한 상태입니다.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [no_previous_issue, partial_comparison, changed, unchanged]
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: change_state 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: latest_collected_at_max
        description: 최신 발표 비교행을 구성한 원천 예보 중 가장 늦은 수집 시각입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 최신 발표의 수집 시각이 없으면 freshness를 판정할 수 없어 허용하지 않습니다.
            time_role: latest_collection
            timezone: Asia/Seoul
            unit: not_applicable
      - name: previous_collected_at_max
        description: 직전 발표 비교행을 구성한 원천 예보 중 가장 늦은 수집 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: 비교 가능한 직전 발표가 없는 경우입니다.
            time_role: previous_collection
            timezone: Asia/Seoul
            unit: not_applicable
