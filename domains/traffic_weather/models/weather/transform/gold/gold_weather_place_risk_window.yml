version: 2

models:
  - name: gold_weather_place_risk_window
    description: 장소별 폭염·한파·호우·대설·강풍 후보를 설명 가능한 임계값으로 선별한 공개 Gold 제품입니다. 기상청 공식 특보가 아닙니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: weather_place_risk_window
          display:
            title: 장소별 기상 위험 예상 시간대
            summary: 장소별로 이동·방문 시 주의가 필요한 기상 위험 예보 시간대를 보여줍니다.
            caveat: 예보값 임계치 기반 참고 정보이며 공식 기상특보가 아닙니다.
            use_cases: ["야외 활동 전 기상 위험 확인"]
          product_question: 서울 주요 장소 중 방문·이동 주의가 필요할 수 있는 예보 시간과 근거는 무엇입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: weather.find_risk_windows
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 서울역에서 이동에 주의가 필요할 수 있는 예보 시간은 언제인가요?
              - 이 장소에 폭염·강풍·호우 후보가 예보된 시간과 근거를 알려주세요.
              - 내일 여의도공원을 방문할 때 참고할 위험 예보가 있나요?
          grain: place_id와 forecast_at마다 한 행 — 자체 임계값을 만족한 후보 위험 예보.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: allow
          publication_trigger:
            trigger_type: asset
            max_interval_minutes: 240
          event_time: forecast_at
          freshness_field: forecast_collected_at_max
          freshness_slo_minutes: 240
          quality_coverage:
            not_applicable_reason: 위험 조건을 충족한 장소·예보시각만 게시하는 희소 이벤트 제품이므로, 게시 행의 place_id 수는 전체 장소 모집단의 커버리지를 뜻하지 않습니다.
          retention_or_horizon: 최신 KMA 예보가 제공하는 미래 구간만 매 게시 시점에 교체합니다.
          shape: event
          source_evidence:
            - source_id: kma_vilage_fcst
              source_url: https://www.data.go.kr/data/15084084/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: risk_windows_for_place
              question_ko: 특정 장소에서 자체 임계값을 만족한 위험 후보 예보는 언제입니까?
              axes: 장소 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 66
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :place_id='seoul_admd_1120062000'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id
                ORDER BY forecast_at ASC
            - pattern_id: upcoming_risk_windows
              question_ko: 특정 시간 범위에 위험 후보가 예보된 장소·시각은 무엇입니까?
              axes: 예보 대상 시각 범위 필터 — 시간 ASC
              requires: [select_columns, filter_range, sort]
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: risk_label_candidates
              question_ko: 특정 위험 후보 라벨을 포함한 장소·시각은 무엇입니까?
              axes: 위험 후보 라벨 포함 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :risk_label='폭염후보', :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE risk_labels LIKE '%' || :risk_label || '%'
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: risk_candidates_for_place_window
              question_ko: 특정 장소의 방문 시간 범위에 위험 후보 예보가 있습니까?
              axes: 장소·예보 대상 시각 범위 필터 — 시간 ASC
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true
              verified_rows: 45
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :place_id='seoul_admd_1120062000', :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id
                  AND forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY forecast_at ASC
            - pattern_id: next_risk_candidate_for_place
              question_ko: 특정 장소의 다음 위험 후보 예보 시각과 근거는 무엇입니까?
              axes: 장소·기준 시각 필터 — 예보 대상 시각 ASC, 1건
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :place_id='seoul_admd_1120062000', :as_of_at='2026-07-30 00:00:00'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id AND forecast_at >= :as_of_at
                ORDER BY forecast_at ASC
                LIMIT 1
            - pattern_id: multi_risk_label_candidates
              question_ko: 한 시각에 둘 이상의 위험 후보 라벨이 함께 나타난 장소는 어디입니까?
              axes: 복수 위험 후보 라벨 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE risk_labels LIKE '%,%'
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: latest_risk_candidates
              question_ko: 가장 먼 미래 시각까지 이어지는 위험 후보 예보는 무엇입니까?
              axes: 예보 대상 시각 정렬 — forecast_at DESC
              requires: [select_columns, sort]
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :n=20
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                ORDER BY forecast_at DESC, place_id
                LIMIT :n
            - pattern_id: risk_candidate_count_by_place
              question_ko: 특정 시간 범위에서 장소별 위험 후보 예보 건수는 얼마입니까?
              axes: 예보 대상 시각 범위 집계 — 위험 후보 수 DESC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, count(*) AS risk_candidate_count
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY place_id
                ORDER BY risk_candidate_count DESC, place_id
                LIMIT :n
          public_projection:
            schema_version: "1.2.0"
            columns:
              - product_row_id
              - place_id
              - place_name
              - admin_dong_code
              - admin_dong
              - gu_code
              - gu
              - forecast_at
              - temp_c
              - wind_ms
              - precip_prob_pct
              - pty_code
              - pcp_mm
              - sno_cm
              - heat_risk
              - cold_risk
              - heavy_rain_risk
              - snow_risk
              - wind_risk
              - risk_labels
              - forecast_issued_at_min
              - forecast_issued_at_max
              - forecast_collected_at_max
    columns:
      - name: product_row_id
        description: place_id와 예보시각을 직렬화한 식별자입니다.
        data_type: varchar
        tests: [not_null, unique]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_id
        description: 장소 식별자입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: place_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_name
        description: 장소명입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: false
            null_meaning: 매핑된 장소는 이름을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong_code
        description: 이 장소가 속한 행정동 10자리 코드입니다(장소 매핑에서 승계, 별도 공간 계약 없음).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 행정동 코드를 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong
        description: 행정동명입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 행정동명을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: gu_code
        description: 자치구 5자리 코드입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 자치구 코드를 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: gu
        description: 자치구명입니다(장소 매핑에서 승계). 같은 행정동명이 여러 자치구에 있을 때 구분에 사용합니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 자치구명을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: forecast_at
        description: 후보 위험이 적용되는 KST 예보 시각입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: forecast_at 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: temp_c
        description: 이 예보시각의 기온입니다. 폭염·한파 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 TMP 카테고리가 없어 결측된 경우입니다.
            unit: celsius
      - name: wind_ms
        description: 이 예보시각의 풍속입니다. 강풍 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 WSD 카테고리가 없어 결측된 경우입니다.
            unit: meter_per_second
      - name: precip_prob_pct
        description: 이 예보시각의 강수확률입니다. 위험 후보 판정에는 쓰지 않는 참고 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 POP 카테고리가 없어 결측된 경우입니다.
            unit: percent
      - name: pty_code
        description: KMA 강수형태 코드입니다. 호우 후보 판정의 근거값입니다.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6', '7']
        config:
          meta:
            semantic_role: categorical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 PTY 카테고리가 없어 결측된 경우입니다.
            unit: not_applicable
      - name: pcp_mm
        description: PCP 원문에서 숫자로 파싱 가능했던 강수량(mm)입니다. 호우 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: PCP 카테고리가 없거나 원문이 숫자로 파싱되지 않는 표현(범위·없음 등)인 경우입니다.
            unit: millimeter
      - name: sno_cm
        description: SNO 원문에서 숫자로 파싱 가능했던 적설량(cm)입니다. 대설 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: SNO 카테고리가 없거나 원문이 숫자로 파싱되지 않는 표현(범위·없음 등)인 경우입니다.
            unit: centimeter
      - name: heat_risk
        description: temp_c가 33도 이상인지 나타내는 폭염 후보 플래그입니다. 공식 폭염특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: temp_c가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: cold_risk
        description: temp_c가 영하 12도 이하인지 나타내는 한파 후보 플래그입니다. 공식 한파특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: temp_c가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: heavy_rain_risk
        description: pty_code가 비 계열(1·4·5)이고 pcp_mm이 15mm 이상인지 나타내는 호우 후보 플래그입니다. 공식 호우특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: pty_code가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: snow_risk
        description: sno_cm이 1cm 이상인지 나타내는 대설 후보 플래그입니다. 공식 대설특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: false
            null_meaning: sno_cm 결측은 0으로 보정해 판정하므로 null이 발생하지 않습니다.
            unit: not_applicable
      - name: wind_risk
        description: wind_ms가 초속 14m 이상인지 나타내는 강풍 후보 플래그입니다. 공식 강풍특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: wind_ms가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: risk_labels
        description: 자체 임계값을 만족한 설명용 후보 목록이며 공식 특보가 아닙니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: false
            null_meaning: risk_labels 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: forecast_issued_at_min
        description: 이 예보시각을 구성하는 카테고리들의 KMA 발표시각 중 가장 이른 값입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 발표시각이 없는 행은 최신 예보를 결정할 수 없습니다.
            time_role: issue_min
            timezone: Asia/Seoul
            unit: not_applicable
      - name: forecast_issued_at_max
        description: 이 예보시각을 구성하는 카테고리들의 KMA 발표시각 중 가장 늦은 값입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 발표시각이 없는 행은 최신 예보를 결정할 수 없습니다.
            time_role: issue_max
            timezone: Asia/Seoul
            unit: not_applicable
      - name: forecast_collected_at_max
        description: 이 위험 후보 행을 구성한 원천 예보 중 가장 늦은 수집 시각입니다. 예보 대상 시각과 별도의 서빙 freshness 축입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
