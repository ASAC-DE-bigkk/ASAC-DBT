version: 2

models:
  - name: gold_weather_forecast_summary
    description: 기존 최신 Weather Silver snapshot을 source_id별로 집계한 원천 수준 호환 요약이며 question-grain 조인 Gold가 아니다.
    columns:
      - name: source_id
        description: 집계 대상 원천 식별자이며 한 행의 grain이다.
        tests:
          - not_null
          - unique
      - name: row_count
        description: 현재 호환 Silver 행 수다.
        tests:
          - not_null
      - name: raw_object_count
        description: 현재 호환 Silver가 참조하는 raw object 고유 수다.
        tests:
          - not_null
      - name: first_forecast_at
        description: 현재 snapshot의 가장 이른 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_forecast_at
        description: 현재 snapshot의 가장 늦은 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_collected_at
        description: 현재 snapshot의 가장 늦은 수집 timestamp(6)다.
        tests:
          - not_null

  - name: gold_weather_current_wide_by_admin_dong
    description: 동당 1행 = 현재 예보시각의 최신 KMA 예보 WIDE 서빙(★full). 정본 gold_weather_forecast_by_admin_dong(425동)만 소비하며 LONG→WIDE로 8지표를 나란히 제공한다.
    config:
      meta:
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Weather 데이터 제품 운영팀
          maturity: low
          intended_consumer_types: [analyst, ai_catalog, cross_domain_dbt, rapidapi_serving]
          product_question: 각 서울 행정동의 현재 시각 최신 KMA 예보는 무엇입니까?
          row_meaning: 한 행정동의 현재 예보시각 WIDE 예보 한 행입니다.
          grain: admin_dong_code마다 정확히 한 행입니다.
          do_not_use_for: 과거 예보 이력이나 실측 관측 또는 개인 위치 추정에 사용하지 않습니다.
          semantic_caveats: forecast_at은 발표시각이 아니라 예보 대상 시각이며 현재 KST 시 이상 중 가장 이른 예보입니다. PCP·SNO는 raw+representation을 함께 해석합니다.
    columns:
      - name: product_row_id
        description: admin_dong_code를 그대로 쓴 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null, unique]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각(현재 시 이상 중 가장 이른 것)입니다.
        tests: [not_null]
      - name: sky_code
        description: KMA 하늘상태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '3', '4']
      - name: pty_code
        description: KMA 강수형태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6', '7']

  - name: gold_weather_forecast_wide_by_admin_dong
    description: 동×예보시각 전 horizon KMA 예보 WIDE mart. W-A1의 현재 슬라이스를 전체 예보 구간(+최대 5일)으로 확장한다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_at를 구분자로 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각입니다.
        tests: [not_null]
      - name: sky_code
        description: KMA 하늘상태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '3', '4']

  - name: gold_weather_daily_by_admin_dong
    description: 동×일 KMA 예보 일 롤업 mart. 최저/최고/평균기온·강수확률 최대·강수·눈 시간수를 제공한다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 구분자로 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: 예보 대상 서울 기준 날짜입니다.
        tests: [not_null]
      - name: precip_hours
        description: 그 날 강수형태(PTY)가 없음(0)이 아닌 예보 시간 수입니다.
        tests: [not_null]

  - name: gold_weather_alert_by_admin_dong
    description: 동×예보시각 기상 경보 후보 플래그(폭염·한파·호우·대설·강풍). ⚠️ 예보값 근사이며 공식 기상특보가 아니다(임계 기준 공식 대조 필요).
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_at를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각입니다.
        tests: [not_null]
      - name: any_alert
        description: 경보 후보 중 하나 이상이 활성인지 나타내는 파생 불리언입니다.
        tests: [not_null]

  - name: gold_weather_current_wide_by_gu
    description: 구×현재시각 대표 예보(동 current wide 롤업). 수치는 평균/최소/최대, 강수는 동 비율. D1 서빙 후보.
    columns:
      - name: product_row_id
        description: gu_code를 그대로 쓴 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: gu_code
        description: 행안부 자치구 5자리 코드입니다.
        tests: [not_null, unique]
      - name: dong_count
        description: 해당 자치구에서 집계된 행정동 수입니다.
        tests: [not_null]

  - name: gold_weather_precip_profile_by_admin_dong
    description: 동×일 강수 특화 프로파일(강수확률·강수/눈/진눈깨비 시간·PCP mm·SNO cm). 값 의미계층 활용.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: 예보 대상 서울 기준 날짜입니다.
        tests: [not_null]
      - name: precip_hours
        description: 그 날 강수형태(PTY)가 없음(0)이 아닌 예보 시간 수입니다.
        tests: [not_null]
