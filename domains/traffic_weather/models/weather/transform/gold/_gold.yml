version: 2

models:
  - name: gold_weather_forecast_summary
    description: 기존 최신 Weather Silver snapshot을 source_id별로 집계한 원천 수준 호환 요약이며 question-grain 조인 Gold가 아니다.
    columns:
      - name: source_id
        description: 집계 대상 원천 식별자이며 한 행의 grain이다.
        tests:
          - not_null
          - unique
      - name: row_count
        description: 현재 호환 Silver 행 수다.
        tests:
          - not_null
      - name: raw_object_count
        description: 현재 호환 Silver가 참조하는 raw object 고유 수다.
        tests:
          - not_null
      - name: first_forecast_at
        description: 현재 snapshot의 가장 이른 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_forecast_at
        description: 현재 snapshot의 가장 늦은 KST 예보 대상 시각이다.
        tests:
          - not_null
      - name: last_collected_at
        description: 현재 snapshot의 가장 늦은 수집 timestamp(6)다.
        tests:
          - not_null

  - name: gold_weather_current_wide_by_admin_dong
    description: 동당 1행 = 현재 예보시각의 최신 KMA 예보 WIDE 서빙(★full). 정본 gold_weather_forecast_by_admin_dong(425동)만 소비하며 LONG→WIDE로 8지표를 나란히 제공한다.
    config:
      meta:
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Weather 데이터 제품 운영팀
          maturity: low
          intended_consumer_types: [analyst, ai_catalog, cross_domain_dbt, rapidapi_serving]
          product_question: 각 서울 행정동의 현재 시각 최신 KMA 예보는 무엇입니까?
          row_meaning: 한 행정동의 현재 예보시각 WIDE 예보 한 행입니다.
          grain: admin_dong_code마다 정확히 한 행입니다.
          do_not_use_for: 과거 예보 이력이나 실측 관측 또는 개인 위치 추정에 사용하지 않습니다.
          semantic_caveats: forecast_at은 발표시각이 아니라 예보 대상 시각이며 현재 KST 시 이상 중 가장 이른 예보입니다. PCP·SNO는 raw+representation을 함께 해석합니다.
    columns:
      - name: product_row_id
        description: admin_dong_code를 그대로 쓴 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null, unique]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각(현재 시 이상 중 가장 이른 것)입니다.
        tests: [not_null]
      - name: sky_code
        description: KMA 하늘상태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '3', '4']
      - name: pty_code
        description: KMA 강수형태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6', '7']

  - name: gold_weather_forecast_wide_by_admin_dong
    description: 동×예보시각 전 horizon KMA 예보 WIDE mart. W-A1의 현재 슬라이스를 전체 예보 구간(+최대 5일)으로 확장한다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_at를 구분자로 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각입니다.
        tests: [not_null]
      - name: sky_code
        description: KMA 하늘상태 코드입니다.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '3', '4']

  - name: gold_weather_daily_by_admin_dong
    description: 동×일 KMA 예보 일 롤업 mart. 최저/최고/평균기온·강수확률 최대·강수·눈 시간수를 제공한다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 구분자로 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: 예보 대상 서울 기준 날짜입니다.
        tests: [not_null]
      - name: precip_hours
        description: 그 날 강수형태(PTY)가 없음(0)이 아닌 예보 시간 수입니다.
        tests: [not_null]

  - name: gold_weather_alert_by_admin_dong
    description: 동×예보시각 기상 경보 후보 플래그(폭염·한파·호우·대설·강풍). ⚠️ 예보값 근사이며 공식 기상특보가 아니다(임계 기준 공식 대조 필요).
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_at를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각입니다.
        tests: [not_null]
      - name: any_alert
        description: 경보 후보 중 하나 이상이 활성인지 나타내는 파생 불리언입니다.
        tests: [not_null]

  - name: gold_weather_current_wide_by_gu
    description: 구×현재시각 대표 예보(동 current wide 롤업). 수치는 평균/최소/최대, 강수는 동 비율. D1 서빙 후보.
    columns:
      - name: product_row_id
        description: gu_code를 그대로 쓴 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: gu_code
        description: 행안부 자치구 5자리 코드입니다.
        tests: [not_null, unique]
      - name: dong_count
        description: 해당 자치구에서 집계된 행정동 수입니다.
        tests: [not_null]

  - name: gold_weather_precip_profile_by_admin_dong
    description: 동×일 강수 특화 프로파일(강수확률·강수/눈/진눈깨비 시간·PCP mm·SNO cm). 값 의미계층 활용.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: 예보 대상 서울 기준 날짜입니다.
        tests: [not_null]
      - name: precip_hours
        description: 그 날 강수형태(PTY)가 없음(0)이 아닌 예보 시간 수입니다.
        tests: [not_null]

  - name: gold_weather_forecast_completeness_by_admin_dong_hourly
    description: 관측된 행정동×예보시각 forecast grain에서 core8 항목 완전성을 측정하는 Weather 내부 Gold다.
    config:
      meta:
        weather_new_gold_product: true
        grain: admin_dong_code × forecast_at
        row_meaning: 정본 Weather Gold에 실제 존재하는 한 행정동·예보시각 grain의 core8 항목 존재성 한 행입니다.
        anchor_universe: ref('gold_weather_forecast_by_admin_dong')에 관측된 admin_dong_code × forecast_at grain이며 통째로 사라진 forecast slot은 범위 밖입니다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_at을 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_at
        description: 예보 대상 서울 기준 시각입니다.
        tests: [not_null]
      - name: expected_core_category_count
        description: 항상 8개 core category 기대 수입니다.
        tests: [not_null]
      - name: observed_core_category_count
        description: 해당 grain에서 관측된 core category 수입니다.
        tests: [not_null]
      - name: missing_core_category_count
        description: 기대 8개 중 결측 core category 수입니다.
        tests: [not_null]
      - name: core_category_coverage_ratio
        description: observed_core_category_count / expected_core_category_count입니다.
        tests: [not_null]
      - name: completeness_state
        description: complete, partial, missing_core 중 하나입니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['complete', 'partial', 'missing_core']

  - name: gold_weather_forecast_issue_cycle_coverage_daily
    description: Grid issue history와 canonical bridge v1 기준으로 issue×forecast_date의 행정동 core8 expected cell coverage를 측정하는 Weather 내부 Gold다.
    config:
      meta:
        weather_new_gold_product: true
        grain: issued_at × forecast_date
        row_meaning: 한 KMA issue 시각과 forecast date의 forecast slot × canonical 행정동 × core8 expected cell coverage 한 행입니다.
        anchor_universe: ref('silver_kma_vilage_fcst_grid')의 관측 issue/date forecast slot과 bridge_weather_admin_dong_grid_bridge_v1 canonical 425개 행정동입니다.
    columns:
      - name: product_row_id
        description: issued_at과 forecast_date를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: issued_at
        description: KMA 발표 기준 서울 기준 시각입니다.
        tests: [not_null]
      - name: forecast_date
        description: 예보 대상 서울 기준 날짜입니다.
        tests: [not_null]
      - name: expected_cell_count
        description: forecast slot × mapped admin dong × core8로 독립 재구성한 기대 cell 수입니다.
        tests: [not_null]
      - name: observed_cell_count
        description: Grid row를 같은 bridge v1 canonical 행정동으로 fan-out한 관측 cell 수입니다.
        tests: [not_null]
      - name: missing_cell_count
        description: expected_cell_count - observed_cell_count입니다.
        tests: [not_null]
      - name: mapped_admin_dong_count
        description: bridge v1 canonical_join_eligible=true 행정동 수이며 계약상 425입니다.
        tests: [not_null]
      - name: issue_cycle_coverage_ratio
        description: observed_cell_count / expected_cell_count이며 bridge 행정동이 0개라 분모가 0이면 null입니다.
      - name: issue_cycle_coverage_state
        description: bridge_contract_mismatch, complete, partial, missing 중 하나이며 bridge 불일치를 빈 테이블로 숨기지 않습니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bridge_contract_mismatch', 'complete', 'partial', 'missing']

  - name: gold_weather_x_culture_activity_daily
    description: Weather 일별 행정동 anchor에 문화 활동 일별 Gold를 left join한 동시 노출 context다.
    config:
      meta:
        weather_new_gold_product: true
        grain: admin_dong_code × forecast_date
        row_meaning: 한 행정동과 forecast date의 Weather daily context와 같은 날짜 문화활동 지표 한 행입니다.
        anchor_universe: ref('gold_weather_daily_by_admin_dong')의 모든 admin_dong_code × forecast_date grain입니다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: Weather forecast date입니다.
        tests: [not_null]
      - name: culture_observation_present
        description: Culture upstream row 존재 여부입니다.
        tests: [not_null]
      - name: external_freshness_status
        description: Culture upstream Gold freshness 노출 상태입니다.
        tests: [not_null]

  - name: gold_weather_x_transit_hourly
    description: Weather hourly wide anchor에 교통 동×시간 Gold를 left join한 동시 노출 context다.
    config:
      meta:
        weather_new_gold_product: true
        grain: admin_dong_code × hour_at
        row_meaning: 한 행정동과 시간의 Weather hourly context와 같은 시간 교통 지표 한 행입니다.
        anchor_universe: ref('gold_weather_forecast_wide_by_admin_dong')의 모든 admin_dong_code × forecast_at grain입니다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 hour_at을 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: hour_at
        description: Weather forecast_at을 시간축으로 노출한 KST wall-clock timestamp입니다.
        tests: [not_null]
      - name: transit_observation_present
        description: Transit upstream row 존재 여부입니다.
        tests: [not_null]
      - name: external_freshness_status
        description: Transit upstream Gold freshness 노출 상태입니다.
        tests: [not_null]

  - name: gold_weather_x_commerce_business_exposure_daily
    description: Weather 일별 행정동 anchor에 forecast_date 기준 as-of Commerce 사업체 stock을 left join한 노출 context다.
    config:
      meta:
        weather_new_gold_product: true
        grain: admin_dong_code × forecast_date
        row_meaning: 한 행정동과 forecast date의 Weather daily context와 no-hindsight Commerce 사업체 stock 한 행입니다.
        anchor_universe: ref('gold_weather_daily_by_admin_dong')의 모든 admin_dong_code × forecast_date grain입니다.
    columns:
      - name: product_row_id
        description: admin_dong_code와 forecast_date를 연결한 결정적 제품 행 식별자입니다.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: 행안부 10자리 정본 행정동 코드입니다.
        tests: [not_null]
      - name: forecast_date
        description: Weather forecast date입니다.
        tests: [not_null]
      - name: commerce_observation_present
        description: no-hindsight 조건을 만족하는 Commerce upstream row 존재 여부입니다.
        tests: [not_null]
      - name: commerce_latest_collected_at
        description: 결합된 Commerce stock의 수집 기준 시각입니다.
