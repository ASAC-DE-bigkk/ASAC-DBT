version: 2

models:
  - name: silver_weather_forecast_by_admin_dong_serving
    description: Public Weather forecast-change product가 읽는 최근 예보 working set이다. 기존 full-history legacy Silver는 보존하고, KST 기준 어제 이후 예보만 Iceberg forecast_at 일자 파티션으로 유지한다.
    columns:
      - name: place_id
        tests: [not_null]
      - name: issued_at
        tests: [not_null]
      - name: forecast_at
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: collected_at
        tests: [not_null]
  - name: silver_weather_forecast_by_admin_dong
    description: 기존 Grid 호환 Silver를 legacy place mapping으로 fan-out한 장소 단위 호환 Silver이며 canonical W1 bridge 경로가 아니다.
    columns:
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - kma_vilage_fcst
      - name: place_id
        description: legacy mapping의 행정동 장소 식별자다.
        tests:
          - not_null
      - name: source_grid_place_id
        description: fan-out 전 Grid Silver가 보존한 수집 장소 식별자다.
        tests:
          - not_null
      - name: latitude
        description: legacy 장소의 WGS84 위도다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lat
      - name: longitude
        description: legacy 장소의 WGS84 경도다.
        tests:
          - not_null
          - asac_axes.in_seoul_bbox:
              arguments:
                kind: lon
      - name: admin_dong_code
        description: 기존 dim_weather_place self-copy 호환 코드이며 신규 canonical 증거로 사용하지 않는다.
        tests:
          - not_null
          - asac_axes.axis_coverage:
              arguments:
                min_ratio: 1.0
      - name: gu_code
        description: 기존 코드 prefix 호환값이며 신규 canonical 증거로 사용하지 않는다.
        tests:
          - not_null
      - name: issued_at
        description: KST 발표 timestamp(6)다.
        tests:
          - not_null
      - name: forecast_at
        description: KST 예보 대상 timestamp(6)다.
        tests:
          - not_null
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같다.
        tests:
          - not_null
      - name: category
        description: KMA 예보 항목 코드다.
        tests:
          - not_null
      - name: collected_at
        description: 선택 예보 행의 수집 timestamp(6)다.
        tests:
          - not_null
  - name: dim_weather_place
    description: legacy Weather 장소·검색 별칭·KMA 격자를 제공하는 호환 차원이며 self-copy 행정코드는 canonical W1 bridge를 대체하지 않는다.
    columns:
      - name: place_id
        description: Weather 장소 식별자이며 차원 grain이다.
        tests:
          - not_null
          - unique
      - name: place_name
        description: 사용자 표시용 대표 장소명이다.
        tests:
          - not_null
      - name: alias_names
        description: 세로 막대로 구분한 검색 별칭 목록이다.
        tests:
          - not_null
      - name: gu
        description: legacy mapping의 자치구명이다.
        tests:
          - not_null
      - name: admin_dong
        description: legacy mapping의 행정동명이다.
        tests:
          - not_null
      - name: latitude
        description: 장소의 WGS84 위도다.
        tests:
          - not_null
      - name: longitude
        description: 장소의 WGS84 경도다.
        tests:
          - not_null
      - name: nx
        description: 장소에 대응하는 KMA 격자 X 좌표다.
        tests:
          - not_null
      - name: ny
        description: 장소에 대응하는 KMA 격자 Y 좌표다.
        tests:
          - not_null
      - name: mapping_method
        description: legacy grid mapping 개정 label이다.
        tests:
          - not_null
      - name: source_admin_code
        description: KMA 안내 자료의 행정코드 후보다.
        tests:
          - not_null
      - name: admin_dong_code
        description: source_admin_code self-copy 호환값이며 canonical 인증값이 아니다.
        tests:
          - not_null
          - asac_axes.axis_coverage:
              arguments:
                min_ratio: 1.0
      - name: gu_code
        description: source_admin_code 앞 5자리 호환값이며 canonical 인증값이 아니다.
        tests:
          - not_null
      - name: grid_distance_m
        description: 장소와 격자 기준점 사이 거리 m이며 미계산 시 null이다.
  - name: gold_weather_forecast_by_place
    description: 기존 장소별 최신 KMA 예보 호환 mart이며 W2의 canonical admin_dong_code·forecast_at·category question-grain Gold가 아니다.
    columns:
      - name: place_id
        description: legacy Weather 장소 식별자이며 mart grain 구성요소다.
        tests:
          - not_null
      - name: place_name
        description: 사용자 표시용 대표 장소명이다.
        tests:
          - not_null
      - name: alias_names
        description: 세로 막대로 구분한 검색 별칭 목록이다.
        tests:
          - not_null
      - name: gu
        description: legacy mapping의 자치구명이다.
      - name: admin_dong
        description: legacy mapping의 행정동명이다.
      - name: latitude
        description: legacy 장소의 WGS84 위도다.
        tests:
          - not_null
      - name: longitude
        description: legacy 장소의 WGS84 경도다.
        tests:
          - not_null
      - name: admin_dong_code
        description: 기존 self-copy 호환 행정코드이며 W2 canonical 경로가 아니다.
        tests:
          - not_null
          - asac_axes.axis_coverage:
              arguments:
                min_ratio: 1.0
      - name: gu_code
        description: 기존 prefix 호환 자치구 코드이며 W2 canonical 경로가 아니다.
        tests:
          - not_null
      - name: nx
        description: KMA 격자 X 좌표다.
        tests:
          - not_null
      - name: ny
        description: KMA 격자 Y 좌표다.
        tests:
          - not_null
      - name: mapping_method
        description: legacy 장소-격자 mapping 개정 label이다.
      - name: grid_distance_m
        description: 장소와 격자 기준점 사이 거리 m이며 미계산 시 null이다.
      - name: source_admin_code
        description: KMA 안내 자료의 행정코드 후보다.
      - name: source_grid_place_id
        description: 장소 fan-out 전 Grid Silver의 수집 장소 식별자다.
      - name: request_id
        description: 선택 예보 행의 API 요청 식별자다.
      - name: source_id
        description: 기상청 단기예보 원천 식별자다.
      - name: request_params_json
        description: secret 원문을 제외한 요청 조건 JSON이다.
      - name: category
        description: KMA 예보 항목 코드이며 mart grain 구성요소다.
        tests:
          - not_null
      - name: issued_at
        description: KST 발표 timestamp(6)다.
        tests:
          - not_null
      - name: forecast_at
        description: KST 예보 대상 timestamp(6)이며 mart grain 구성요소다.
        tests:
          - not_null
      - name: event_at
        description: cross-domain event time이며 forecast_at과 같다.
        tests:
          - not_null
      - name: time_bucket
        description: forecast_at을 KST 시간 단위로 내린 호환 bucket이다.
        tests:
          - not_null
      - name: fcst_value_raw
        description: 선택 예보 값 원문이다.
        tests:
          - not_null
      - name: fcst_value_num
        description: 선택 예보 값의 direct double cast 호환값이다.
      - name: raw_object_key
        description: 선택 예보의 R2 raw object lineage key다.
        tests:
          - not_null
      - name: payload_hash
        description: 선택 예보 raw payload 내용 지문이다.
      - name: total_count
        description: KMA 응답이 보고한 전체 item 수다.
      - name: item_count
        description: 응답에서 파싱된 item 수다.
      - name: load_date
        description: Bronze 적재 파티션 날짜 문자열이다.
      - name: collected_at
        description: 선택 예보 행의 수집 timestamp(6)다.
        tests:
          - not_null
      - name: dag_run_id
        description: 선택 예보 행을 만든 Airflow 실행 식별자다.
