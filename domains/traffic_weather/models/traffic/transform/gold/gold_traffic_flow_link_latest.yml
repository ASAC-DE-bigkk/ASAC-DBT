version: 2

models:
  - name: gold_traffic_flow_link_latest
    description: 도로 링크별 가장 최근 관측된 TrafficInfo 속도·통행시간 한 행을 제공하는 공개 Gold 모델입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        serving:
          enabled: true
          external: true
          product_id: traffic_flow_link_latest
          display:
            title: 도로 링크별 최신 교통 흐름
            summary: 도로 링크마다 가장 최근에 관측된 속도와 통행시간을 보여줍니다.
            caveat: 관측값이 없는 링크는 결과에 포함되지 않습니다.
            use_cases: ["도로 링크별 현재 흐름 조회"]
          product_question: 서울 도로 링크별 가장 최근 속도와 통행시간은 무엇입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.get_link_latest
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 이 도로 링크의 가장 최근 속도와 통행시간은 얼마인가요?
              - 지금 값이 있는 링크와 결측 링크를 구분해 보여주세요.
              - 링크별 관측 시각을 함께 확인할 수 있나요?
          grain: link_id마다 한 행 — 링크별 최신 교통 흐름 스냅샷.
          primary_key: [product_row_id]
          publication_mode: upsert
          upsert_strategy: exact_set
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: observed_at_kst
          freshness_slo_minutes: 90
          shape: wide
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: latest_snapshot_for_link
              question_ko: 특정 링크의 가장 최근 속도·통행시간·관측 시각은 무엇입니까?
              axes: 링크 필터 — 최신 스냅샷 조회
              requires: [select_columns, filter_set]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :link_id='1190000100'
                SELECT link_id, flow_speed, flow_travel_time, flow_value_quality, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE link_id = :link_id
            - pattern_id: available_link_values
              question_ko: 현재 속도와 통행시간 값이 모두 사용 가능한 링크는 무엇입니까?
              axes: available 품질 상태 필터 — 관측 시각 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :n=50
                SELECT link_id, flow_speed, flow_travel_time, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
                ORDER BY observed_at_kst DESC
                LIMIT :n
            - pattern_id: missing_value_links
              question_ko: 최신 교통 값이 결측인 링크는 무엇입니까?
              axes: missing_value 품질 상태 필터 — 관측 시각 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :n=50
                SELECT link_id, flow_value_quality, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'missing_value'
                ORDER BY observed_at_kst DESC
                LIMIT :n
            - pattern_id: slowest_available_links
              question_ko: 현재 값이 있는 링크 중 속도가 가장 낮은 곳은 어디입니까?
              axes: available 상태 필터 — flow_speed ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :n=20
                SELECT link_id, flow_speed, flow_travel_time, observed_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
                ORDER BY flow_speed ASC
                LIMIT :n
            - pattern_id: longest_travel_time_links
              question_ko: 현재 값이 있는 링크 중 통행시간이 가장 긴 곳은 어디입니까?
              axes: available 상태 필터 — flow_travel_time DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :n=20
                SELECT link_id, flow_speed, flow_travel_time, observed_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
                ORDER BY flow_travel_time DESC
                LIMIT :n
            - pattern_id: link_observation_window
              question_ko: 특정 관측 시간 범위에 갱신된 링크의 최신 값은 무엇입니까?
              axes: 관측 시각 범위 필터 — 관측 시각 DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 100, from_at: { rel: "-30d", as: datetime }, to_at: { rel: "0d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT link_id, flow_speed, flow_travel_time, flow_value_quality, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE observed_at_kst >= :from_at AND observed_at_kst < :to_at
                ORDER BY observed_at_kst DESC
                LIMIT :n
            - pattern_id: oldest_current_observations
              question_ko: 최신 링크 스냅샷 중 관측 시각이 가장 오래된 링크는 무엇입니까?
              axes: 관측 시각 정렬 — observed_at_kst ASC
              requires: [select_columns, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                -- :n=20
                SELECT link_id, flow_value_quality, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                ORDER BY observed_at_kst ASC
                LIMIT :n
            - pattern_id: value_quality_overview
              question_ko: 최신 링크 스냅샷에서 값 품질 상태별 링크 수는 얼마입니까?
              axes: 값 품질 상태 집계 — 링크 수 DESC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: false
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "c1886803d27d40a19e6b5b65ab354558"
              sql: |
                SELECT flow_value_quality, count(*) AS link_count
                FROM gold_traffic_flow_link_latest
                GROUP BY flow_value_quality
                ORDER BY link_count DESC, flow_value_quality
            - pattern_id: "network_flow_summary"
              question_ko: "현재 값이 있는 서울 전체 링크의 속도·통행시간 요약(개수·평균·최저·최고)은 무엇입니까?"
              axes: "available 상태 필터 — 네트워크 전체 단일행 집계"
              verified_rows: 0                # 실 D1 실측: [1] (스탬핑 대기)
              insight_sample_ko: "현재 값이 있는 링크 288개의 평균 속도는 27.9 km/h(최저 6.1, 최고 90.0), 평균 통행시간은 145.5초(최저 6, 최고 657)입니다."
              sql: |
                SELECT count(*) AS available_link_count,
                       round(avg(flow_speed), 1) AS avg_flow_speed,
                       min(flow_speed) AS min_flow_speed,
                       max(flow_speed) AS max_flow_speed,
                       round(avg(flow_travel_time), 1) AS avg_flow_travel_time,
                       min(flow_travel_time) AS min_flow_travel_time,
                       max(flow_travel_time) AS max_flow_travel_time
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
              requires: [select_columns, aggregate, filter_set]
            - pattern_id: "speed_band_distribution"
              question_ko: "현재 링크들을 속도 구간(20 미만·20~40·40~60·60 이상)으로 나누면 각 구간의 링크 수와 평균은 어떻습니까?"
              axes: "속도 구간 분류 집계 — 구간 분포 히스토그램"
              verified_rows: 0                # 실 D1 실측: [4] (스탬핑 대기)
              insight_sample_ko: "속도 20 km/h 미만 구간에 115개 링크가 몰려 있고(평균 14.8 km/h), 이 구간의 평균 통행시간은 170.6초입니다."
              sql: |
                SELECT CASE
                         WHEN flow_speed < 20 THEN '01_under_20'
                         WHEN flow_speed < 40 THEN '02_20_to_40'
                         WHEN flow_speed < 60 THEN '03_40_to_60'
                         ELSE '04_60_plus'
                       END AS speed_band,
                       count(*) AS link_count,
                       round(avg(flow_speed), 1) AS avg_flow_speed,
                       round(avg(flow_travel_time), 1) AS avg_flow_travel_time
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
                GROUP BY speed_band
                ORDER BY speed_band
              requires: [select_columns, aggregate, group_by, sort, filter_set]
            - pattern_id: "links_ranked_by_metric"
              question_ko: "선택한 지표(속도 또는 통행시간)와 정렬 방향으로 현재 링크 순위를 보고 싶습니다."
              axes: "available 필터 — 지표·정렬 방향 스위치 랭킹"
              verified_rows: 0                # 실 D1 실측: [20, 20, 10] (스탬핑 대기)
              insight_sample_ko: "속도 오름차순(가장 느린 순)으로 보면 1위는 링크 1010003300으로 현재 속도 6.1 km/h, 통행시간 381초입니다."
              sql: |
                -- :metric=flow_speed, :dir=asc, :n=20
                SELECT link_id, flow_speed, flow_travel_time, flow_value_quality, observed_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
                ORDER BY
                  CASE WHEN :dir = 'asc' THEN (CASE :metric WHEN 'flow_travel_time' THEN flow_travel_time ELSE flow_speed END) END ASC,
                  CASE WHEN :dir = 'desc' THEN (CASE :metric WHEN 'flow_travel_time' THEN flow_travel_time ELSE flow_speed END) END DESC
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { dir: "asc", n: 20 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "congested_links_below_speed"
              question_ko: "현재 속도가 지정한 임계값 이하로 떨어진(정체) 링크는 어디입니까?"
              axes: "available·속도 임계값 필터 — flow_speed ASC"
              verified_rows: 0                # 실 D1 실측: [50, 50] (스탬핑 대기)
              insight_sample_ko: "속도 20 km/h 이하 링크 중 가장 느린 곳은 1010003300으로 6.1 km/h, 통행시간 381초입니다."
              sql: |
                -- :max_speed=20, :n=50
                SELECT link_id, flow_speed, flow_travel_time, observed_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available' AND flow_speed <= :max_speed
                ORDER BY flow_speed ASC
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { max_speed: 20, n: 50 }
            - pattern_id: "congestion_share_below_speed"
              question_ko: "현재 값이 있는 링크 중 지정한 속도 임계값 이하인 링크의 비율은 얼마입니까?"
              axes: "available·속도 임계값 — 정체 링크 비율 단일행"
              verified_rows: 0                # 실 D1 실측: [1, 1] (스탬핑 대기)
              insight_sample_ko: "현재 값이 있는 288개 링크 중 119개(41.3%)가 속도 20 km/h 이하입니다."
              sql: |
                -- :max_speed=20
                SELECT count(*) AS available_link_count,
                       sum(CASE WHEN flow_speed <= :max_speed THEN 1 ELSE 0 END) AS congested_link_count,
                       round(100.0 * sum(CASE WHEN flow_speed <= :max_speed THEN 1 ELSE 0 END) / count(*), 1) AS congested_pct
                FROM gold_traffic_flow_link_latest
                WHERE flow_value_quality = 'available'
              requires: [select_columns, aggregate, filter_set]
              param_defaults: { max_speed: 20 }
            - pattern_id: "links_for_id_set"
              question_ko: "관심 있는 여러 링크의 현재 속도·통행시간 스냅샷을 한 번에 보고 싶습니다."
              axes: "링크 ID 다중 선택 필터 — link_id ASC"
              verified_rows: 0                # 실 D1 실측: [3, 2] (스탬핑 대기)
              insight_sample_ko: "요청한 3개 링크 중 1010009500은 현재 속도 12.3 km/h, 통행시간 40초로 관측되었습니다."
              sql: |
                -- :link_ids=["1010009500","1140024200","1150003100"]
                SELECT link_id, flow_speed, flow_travel_time, flow_value_quality, observed_at_kst, collected_at_kst
                FROM gold_traffic_flow_link_latest
                WHERE link_id IN (SELECT value FROM json_each(:link_ids))
                ORDER BY link_id
              requires: [select_columns, filter_set]
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - flow_speed
              - flow_travel_time
              - flow_value_quality
              - observed_at_kst
              - collected_at_kst
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Traffic 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
            - rapidapi_serving
          cross_domain_usage_examples:
            - 특정 도로 구간의 현재 소통 상태를 외부 API로 조회할 때 사용합니다.
            - 혼잡 구간 대시보드에서 링크별 최신 속도를 지도에 표시할 때 사용합니다.
          product_question: 서울 도로 링크별 가장 최근 속도와 통행시간은 무엇입니까?
          row_meaning: 도로 링크 한 곳의 가장 최근 관측 속도·통행시간 한 행입니다.
          grain: link_id마다 정확히 한 행입니다.
          anchor_universe: silver_seoul_traffic_flow에서 지금까지 관측된 적이 있는 전체 link_id 집합입니다. 관측된 적 없는 링크는 포함되지 않습니다.
          usage_guidance: 링크별 observed_at_kst가 서로 다를 수 있으므로 최신성을 함께 확인하고, flow_value_quality가 available인 행만 속도·통행시간 분석에 사용합니다.
          do_not_use_for: 링크 간 동일 순간 비교나 실시간 긴급 경보, 공식 교통정보 판정에 사용하지 않습니다.
          semantic_caveats: 링크별 관측시각이 다를 수 있으므로 이 모델을 같은 순간의 전수 스냅샷으로 해석하면 안 됩니다. flow_speed·flow_travel_time이 null이면 flow_value_quality가 missing_value입니다.
          primary_key:
            - product_row_id
          column_order:
            - product_row_id
            - link_id
            - source_id
            - flow_speed
            - flow_travel_time
            - flow_value_quality
            - observed_at_kst
            - raw_object_key
            - payload_hash
            - request_id
            - collected_at_kst
            - dag_run_id
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: 링크별로 원천 TrafficInfo가 갱신될 때마다 incremental merge로 최신 관측을 반영하는 것을 목표로 합니다.
            as_of_meaning: observed_at_kst는 이 링크의 가장 최근 원천 관측 시각이며 링크마다 다를 수 있습니다.
            late_repair_policy: incremental merge로 해당 링크의 최신 관측만 갱신하며 과거 관측 이력은 보존하지 않습니다.
            roles:
              observed_at_kst:
                time_role: event
                timezone: Asia/Seoul
              collected_at_kst:
                time_role: collection
                timezone: Asia/Seoul
          space:
            enabled: false
          metrics: {}
          joins: {}
          quality:
            completeness_explanation: flow_value_quality로 원천 응답에서 속도·통행시간 값이 실제로 존재했는지 확인합니다.
            freshness_explanation: observed_at_kst(원천 관측)와 collected_at_kst(수집)를 분리해 원천 지연과 수집 지연을 각각 해석합니다.
            coverage_explanation: 원천 TOPIS 링크 전체가 아니라 지금까지 실제로 관측된 link_id만 포함하므로 링크 커버리지는 부분적입니다.
            state_fields:
              flow_value_quality:
                allowed_values:
                  - available
                  - missing_value
                state_explanations:
                  available: flow_speed 또는 flow_travel_time 중 하나 이상이 원천에 존재하는 상태입니다.
                  missing_value: flow_speed와 flow_travel_time이 모두 원천에 없는 상태입니다.
          lineage:
            source_relations:
              - model.asac_seoul.silver_seoul_traffic_flow
            identifiers:
              as_of:
                columns:
                  - observed_at_kst
              publication:
                relation_level_only: true
                columns: []
              raw:
                columns:
                  - raw_object_key
              request:
                columns:
                  - request_id
              run:
                columns:
                  - dag_run_id
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: link_id를 그대로 쓴 결정적 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - unique:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: 공개 제품 기본 키이므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - unique:
              config:
                tags: [traffic_gold_gate]
        config:
