version: 2

models:
  - name: gold_traffic_flow_link_latest
    description: 도로 링크별 가장 최근 관측된 TrafficInfo 속도·통행시간 한 행을 제공하는 공개 Gold 모델입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Traffic 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
            - rapidapi_serving
          cross_domain_usage_examples:
            - 특정 도로 구간의 현재 소통 상태를 외부 API로 조회할 때 사용합니다.
            - 혼잡 구간 대시보드에서 링크별 최신 속도를 지도에 표시할 때 사용합니다.
          product_question: 각 도로 링크의 가장 최근 속도와 통행시간은 무엇입니까?
          row_meaning: 도로 링크 한 곳의 가장 최근 관측 속도·통행시간 한 행입니다.
          grain: link_id마다 정확히 한 행입니다.
          anchor_universe: silver_seoul_traffic_flow에서 지금까지 관측된 적이 있는 전체 link_id 집합입니다. 관측된 적 없는 링크는 포함되지 않습니다.
          usage_guidance: 링크별 observed_at_kst가 서로 다를 수 있으므로 최신성을 함께 확인하고, flow_value_quality가 available인 행만 속도·통행시간 분석에 사용합니다.
          do_not_use_for: 링크 간 동일 순간 비교나 실시간 긴급 경보, 공식 교통정보 판정에 사용하지 않습니다.
          semantic_caveats: 링크별 관측시각이 다를 수 있으므로 이 모델을 같은 순간의 전수 스냅샷으로 해석하면 안 됩니다. flow_speed·flow_travel_time이 null이면 flow_value_quality가 missing_value입니다.
          primary_key:
            - product_row_id
          column_order:
            - product_row_id
            - link_id
            - source_id
            - flow_speed
            - flow_travel_time
            - flow_value_quality
            - observed_at_utc
            - observed_at_kst
            - raw_object_key
            - payload_hash
            - request_id
            - collected_at_utc
            - dag_run_id
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: 링크별로 원천 TrafficInfo가 갱신될 때마다 incremental merge로 최신 관측을 반영하는 것을 목표로 합니다.
            as_of_meaning: observed_at_kst는 이 링크의 가장 최근 원천 관측 시각이며 링크마다 다를 수 있습니다.
            late_repair_policy: incremental merge로 해당 링크의 최신 관측만 갱신하며 과거 관측 이력은 보존하지 않습니다.
            roles:
              observed_at_kst:
                time_role: event
                timezone: Asia/Seoul
              observed_at_utc:
                time_role: event_source
                timezone: Asia/Seoul
              collected_at_utc:
                time_role: collection
                timezone: Asia/Seoul
          space:
            enabled: false
          metrics: {}
          joins: {}
          quality:
            completeness_explanation: flow_value_quality로 원천 응답에서 속도·통행시간 값이 실제로 존재했는지 확인합니다.
            freshness_explanation: observed_at_kst(원천 관측)와 collected_at_utc(수집)를 분리해 원천 지연과 수집 지연을 각각 해석합니다.
            coverage_explanation: 원천 TOPIS 링크 전체가 아니라 지금까지 실제로 관측된 link_id만 포함하므로 링크 커버리지는 부분적입니다.
            state_fields:
              flow_value_quality:
                allowed_values:
                  - available
                  - missing_value
                state_explanations:
                  available: flow_speed 또는 flow_travel_time 중 하나 이상이 원천에 존재하는 상태입니다.
                  missing_value: flow_speed와 flow_travel_time이 모두 원천에 없는 상태입니다.
          lineage:
            source_relations:
              - model.asac_seoul.silver_seoul_traffic_flow
            identifiers:
              as_of:
                columns:
                  - observed_at_kst
              publication:
                relation_level_only: true
                columns: []
              raw:
                columns:
                  - raw_object_key
              request:
                columns:
                  - request_id
              run:
                columns:
                  - dag_run_id
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: link_id를 그대로 쓴 결정적 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - unique:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: 공개 제품 기본 키이므로 null을 허용하지 않습니다.
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null
          - unique
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: natural grain이므로 null을 허용하지 않습니다.
      - name: source_id
        description: 원천을 식별하는 안정 식별자입니다.
        data_type: varchar
        tests:
          - not_null
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 원천 시스템을 추적할 수 없는 행은 공개하지 않습니다.
      - name: flow_speed
        description: 이 링크의 가장 최근 관측 속도입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_value_quality가 missing_value인 경우입니다.
      - name: flow_travel_time
        description: 이 링크의 가장 최근 관측 통행시간입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_value_quality가 missing_value인 경우입니다.
      - name: flow_value_quality
        description: flow_speed·flow_travel_time 값이 원천에 실제로 존재했는지 구분한 상태입니다.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['available', 'missing_value']
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: 품질 상태를 분류하지 못한 행은 공개하지 않습니다.
      - name: observed_at_utc
        description: 원천 관측 시각을 변환 전 그대로 보존한 timestamp(6)입니다.
        data_type: timestamp(6)
        tests:
          - not_null
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 관측 시각이 없는 행은 최신 관측을 결정할 수 없습니다.
            time_role: event_source
            timezone: Asia/Seoul
      - name: observed_at_kst
        description: 원천 관측 시각을 서울 기준으로 변환한 timestamp(6)입니다.
        data_type: timestamp(6)
        tests:
          - not_null
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 관측 시각이 없는 행은 최신 관측을 결정할 수 없습니다.
            time_role: event
            timezone: Asia/Seoul
      - name: raw_object_key
        description: 선택된 관측 행의 원본 객체를 추적하는 안정 식별자입니다.
        data_type: varchar
        tests:
          - not_null
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 원본 객체로 역추적할 수 없는 행은 공개하지 않습니다.
      - name: payload_hash
        description: 선택된 관측 행의 payload hash입니다.
        data_type: varchar
        tests:
          - not_null
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: payload hash가 없는 행은 공개하지 않습니다.
      - name: request_id
        description: 선택된 관측 행의 외부 API 요청 식별자입니다.
        data_type: varchar
        tests:
          - not_null
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 외부 요청으로 역추적할 수 없는 행은 공개하지 않습니다.
      - name: collected_at_utc
        description: 원천 응답을 수집한 시각을 변환 전 그대로 보존한 timestamp(6)입니다.
        data_type: timestamp(6)
        tests:
          - not_null
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 수집 시각이 없으면 적재 지연을 검증할 수 없습니다.
            time_role: collection
            timezone: Asia/Seoul
      - name: dag_run_id
        description: 선택된 관측 행을 만든 수집 DAG 실행 식별자입니다.
        data_type: varchar
        tests:
          - not_null
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 수집 실행으로 역추적할 수 없는 행은 공개하지 않습니다.
