version: 2

models:
  - name: gold_traffic_flow_link_time_profile
    description: 도로 링크의 KST 요일·시간대별 관측 이력에서 속도 분포와 통행시간 기준선을 집계한 공개 Gold 제품입니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: traffic_flow_link_time_profile
          display:
            title: 도로 링크별 요일·시간대 교통 흐름
            summary: 도로 링크별 과거 관측을 요일과 시간대별로 집계해 평소 교통 흐름을 보여줍니다.
            caveat: 과거 관측 이력을 바탕으로 한 기준값이며 실시간 예측이 아닙니다.
            use_cases: ["요일·시간대별 교통 패턴 분석"]
          product_question: 서울 도로 링크 중 요일·시간대별 평균 속도가 가장 낮은 곳은 어디입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.get_link_time_profile
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 이 링크는 평일 오후 6시에 보통 어느 정도 속도인가요?
              - 같은 요일과 시간대의 통행시간 기준선을 알려주세요.
              - 표본이 부족해 대표성이 낮은 링크 프로파일이 있나요?
          grain: link_id, kst_day_of_week, kst_hour마다 한 행 — 시간대별 이력 기준선.
          primary_key: [product_row_id]
          publication_mode: upsert
          upsert_strategy: exact_set
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: last_observed_at_kst
          freshness_slo_minutes: 90
          retention_or_horizon: 보존된 전체 Traffic Flow Silver 이력을 affected profile key 단위로 재집계합니다.
          shape: rollup
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - kst_day_of_week
              - kst_hour
              - observation_count
              - speed_observation_count
              - avg_flow_speed
              - min_flow_speed
              - max_flow_speed
              - avg_flow_travel_time
              - first_observed_at_kst
              - last_observed_at_kst
          reliability:
            sample_count_field: observation_count
            minimum_sample_count: 12
            insufficient_sample_policy: flag_degraded
          usage_patterns:
            - pattern_id: profile_for_link_time_slot
              question_ko: 특정 링크의 특정 요일·시간대 평균 속도와 통행시간 기준선은 무엇입니까?
              axes: 링크·요일·시간 필터 — 프로파일 조회
              requires: [select_columns, filter_set]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :link_id='1120006300', :kst_day_of_week=4, :kst_hour=13
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, speed_observation_count,
                       avg_flow_speed, min_flow_speed, max_flow_speed, avg_flow_travel_time
                FROM gold_traffic_flow_link_time_profile
                WHERE link_id = :link_id
                  AND kst_day_of_week = :kst_day_of_week
                  AND kst_hour = :kst_hour
            - pattern_id: profiles_for_link_day
              question_ko: 특정 링크의 한 요일 전체 시간대별 속도 프로파일은 어떻습니까?
              axes: 링크·요일 필터 — 시간 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :link_id='1120006300', :kst_day_of_week=4
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, avg_flow_speed,
                       avg_flow_travel_time
                FROM gold_traffic_flow_link_time_profile
                WHERE link_id = :link_id AND kst_day_of_week = :kst_day_of_week
                ORDER BY kst_hour ASC
            - pattern_id: same_time_across_links
              question_ko: 특정 요일·시간대에 평균 속도가 낮은 링크는 어디입니까?
              axes: 요일·시간 필터 — 평균 속도 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 16
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :kst_day_of_week=4, :kst_hour=13, :n=20
                SELECT link_id, observation_count, avg_flow_speed, min_flow_speed, max_flow_speed,
                       avg_flow_travel_time
                FROM gold_traffic_flow_link_time_profile
                WHERE kst_day_of_week = :kst_day_of_week AND kst_hour = :kst_hour
                ORDER BY avg_flow_speed ASC
                LIMIT :n
            - pattern_id: slowest_average_profiles
              question_ko: 표본이 충분한 시간대 프로파일 중 평균 속도가 가장 낮은 링크는 어디입니까?
              axes: 최소 표본 필터 — 평균 속도 ASC
              requires: [select_columns, filter_range, sort]
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :min_observation_count=12, :n=20
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, avg_flow_speed,
                       avg_flow_travel_time
                FROM gold_traffic_flow_link_time_profile
                WHERE observation_count >= :min_observation_count
                ORDER BY avg_flow_speed ASC
                LIMIT :n
            - pattern_id: low_sample_profiles
              question_ko: 대표성이 낮을 수 있는 표본 부족 시간대 프로파일은 무엇입니까?
              axes: 표본 수 상한 필터 — observation_count ASC
              requires: [select_columns, filter_range, sort]
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :min_observation_count=12, :n=50
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, speed_observation_count,
                       avg_flow_speed
                FROM gold_traffic_flow_link_time_profile
                WHERE observation_count < :min_observation_count
                ORDER BY observation_count ASC, link_id
                LIMIT :n
            - pattern_id: wide_speed_range_profiles
              question_ko: 같은 시간대 안에서도 속도 변동 폭이 큰 링크 프로파일은 무엇입니까?
              axes: 속도 범위 하한 필터 — 범위 DESC
              requires: [select_columns, filter_range, sort]
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :min_speed_range=1, :n=20
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, min_flow_speed,
                       max_flow_speed, max_flow_speed - min_flow_speed AS speed_range
                FROM gold_traffic_flow_link_time_profile
                WHERE max_flow_speed - min_flow_speed >= :min_speed_range
                ORDER BY speed_range DESC
                LIMIT :n
            - pattern_id: travel_time_baselines
              question_ko: 특정 링크의 시간대별 평균 통행시간 기준선은 무엇입니까?
              axes: 링크 필터 — 평균 통행시간 DESC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                -- :link_id='1120006300'
                SELECT link_id, kst_day_of_week, kst_hour, observation_count, avg_flow_travel_time
                FROM gold_traffic_flow_link_time_profile
                WHERE link_id = :link_id
                ORDER BY avg_flow_travel_time DESC NULLS LAST, kst_day_of_week, kst_hour
            - pattern_id: profile_coverage_by_time_slot
              question_ko: 요일·시간대별로 기준선이 있는 링크 프로파일 수는 얼마입니까?
              axes: 요일·시간대 집계 — 프로파일 수 DESC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: false
              verified_rows: 35
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e9b2664871904a11a7750014e4192574"
              sql: |
                SELECT kst_day_of_week, kst_hour, count(*) AS profile_count
                FROM gold_traffic_flow_link_time_profile
                GROUP BY kst_day_of_week, kst_hour
                ORDER BY kst_day_of_week, kst_hour
    columns:
      - name: product_row_id
        description: link_id, 요일, 시간을 직렬화한 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - unique:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: link_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: observation_count
        description: 해당 링크·요일·시간대에 포함된 전체 관측 수입니다. 서로 다른 관측일 수는 아니므로 대표성 판단에 주의합니다.
        data_type: bigint
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: observation_count 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: count
      - name: last_observed_at_kst
        description: 기준선에 포함된 가장 최근 KST 관측 시각입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: last_observed_at_kst 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: kst_day_of_week
        description: 서울 기준 요일 번호입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: temporal_attribute
            nullable: false
            null_meaning: kst_day_of_week 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: day_of_week
      - name: kst_hour
        description: 서울 기준 시각의 시(hour) 값입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: temporal_attribute
            nullable: false
            null_meaning: kst_hour 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: hour_of_day
      - name: speed_observation_count
        description: 속도 값이 존재하는 관측 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: speed_observation_count 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: count
      - name: avg_flow_speed
        description: 프로필 평균 교통 흐름 속도입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: avg_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: min_flow_speed
        description: 프로필 최소 교통 흐름 속도입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: min_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: max_flow_speed
        description: 프로필 최대 교통 흐름 속도입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: max_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: avg_flow_travel_time
        description: 프로필 평균 교통 흐름 통행시간입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: avg_flow_travel_time 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: second
      - name: first_observed_at_kst
        description: 프로필 첫 관측 서울 기준 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: first_observed_at_kst 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: not_applicable
