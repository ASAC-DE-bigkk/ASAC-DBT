version: 2

models:
  - name: gold_traffic_flow_congestion_hotspots_hourly
    description: KST 시간대 안에서 가장 느린 관측 링크를 순위화해 제공하는 공개 Gold 모델입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        serving:
          enabled: true
          external: true
          product_id: traffic_flow_congestion_hotspots_hourly
          display:
            title: 시간대별 도로 혼잡 구간
            summary: 시간대별로 관측 속도가 낮은 도로 링크를 순위로 보여줍니다.
            caveat: 관측된 링크를 속도 기준으로 정렬한 결과입니다.
            use_cases: ["시간대별 혼잡 구간 파악"]
          product_question: 지금 서울에서 관측 속도가 가장 낮은 도로 링크는 어디입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.list_congestion_hotspots
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 지금 관측된 속도가 가장 낮은 도로 링크는 어디인가요?
              - 오늘 오후 6시에 저속 링크 상위 목록을 보여주세요.
              - 특정 시간대의 혼잡 hotspot과 관측 링크 수를 알려주세요.
          grain: hour_at과 link_id마다 한 행 — 시간대별 링크 혼잡 순위 관측.
          primary_key: [product_row_id]
          publication_mode: upsert
          upsert_strategy: exact_set
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: hour_at
          freshness_slo_minutes: 90
          retention_or_horizon: 무기한 누적 Gold이며 D1 exporter 적재 전 보존·purge 정책을 별도 승인합니다.
          shape: event
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: hotspots_for_hour
              question_ko: 특정 시간대에 저속 상위 10위로 관측된 링크는 어디입니까?
              axes: 시간대·hotspot 상태 필터 — 혼잡 순위 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 10
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :hour_at='2026-08-05 09:00:00'
                SELECT link_id, hour_at, flow_speed, flow_travel_time, congestion_rank, observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at = :hour_at AND hotspot_state = 'lowest_speed_top_10'
                ORDER BY congestion_rank ASC
            - pattern_id: ranked_links_for_hour
              question_ko: 특정 시간대에 관측된 링크를 속도 순위로 보고 싶습니다.
              axes: 시간대 필터 — congestion_rank ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 16
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :hour_at='2026-08-05 09:00:00', :n=50
                SELECT link_id, hour_at, flow_speed, flow_travel_time, congestion_rank, hotspot_state,
                       observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at = :hour_at
                ORDER BY congestion_rank ASC
                LIMIT :n
            - pattern_id: hotspot_history_for_link
              question_ko: 특정 링크가 저속 hotspot으로 관측된 시간대는 언제입니까?
              axes: 링크·hotspot 상태·시간 범위 필터 — 시간 ASC
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true
              verified_rows: 10
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :link_id='1210023300', :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00'
                SELECT link_id, hour_at, flow_speed, congestion_rank, observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE link_id = :link_id
                  AND hotspot_state = 'lowest_speed_top_10'
                  AND hour_at >= :from_at AND hour_at < :to_at
                ORDER BY hour_at ASC
            - pattern_id: lowest_speed_in_window
              question_ko: 특정 시간 범위에서 관측 속도가 가장 낮았던 링크는 어디입니까?
              axes: 시간 범위·가용 속도 필터 — flow_speed ASC
              requires: [select_columns, filter_range, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=50
                SELECT link_id, hour_at, flow_speed, congestion_rank, observed_link_count, hotspot_state
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                  AND flow_value_quality = 'available'
                ORDER BY flow_speed ASC
                LIMIT :n
            - pattern_id: hourly_observation_coverage
              question_ko: 시간대별로 혼잡 순위를 계산한 관측 링크 수는 얼마입니까?
              axes: 시간대 범위 집계 — hour_at ASC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: true
              verified_rows: 35
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00'
                SELECT hour_at, max(observed_link_count) AS observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                GROUP BY hour_at
                ORDER BY hour_at ASC
            - pattern_id: missing_speed_for_hour
              question_ko: 특정 시간대에 속도 값이 없어 순위를 신뢰할 수 없는 링크는 무엇입니까?
              axes: 시간대·missing_speed 상태 필터 — 링크 ID ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :hour_at='2026-08-05 09:00:00', :n=50
                SELECT link_id, hour_at, flow_speed, flow_travel_time, flow_value_quality, hotspot_state
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at = :hour_at AND hotspot_state = 'missing_speed'
                ORDER BY link_id
                LIMIT :n
            - pattern_id: rank_cutoff_for_hour
              question_ko: 특정 시간대에서 지정한 혼잡 순위 이내에 드는 링크는 무엇입니까?
              axes: 시간대·순위 상한 필터 — congestion_rank ASC
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { max_rank: 10 }
              allow_empty: true
              verified_rows: 10
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :hour_at='2026-08-05 09:00:00', :max_rank=10
                SELECT link_id, hour_at, flow_speed, congestion_rank, hotspot_state
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at = :hour_at AND congestion_rank <= :max_rank
                ORDER BY congestion_rank ASC
            - pattern_id: recent_hotspot_hours
              question_ko: 최근 특정 시간 범위에서 저속 hotspot으로 반복 관측된 링크는 무엇입니까?
              axes: 시간 범위·hotspot 상태 집계 — 발생 시간 수 DESC
              requires: [select_columns, filter_range, filter_set, aggregate, group_by, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "975fddb26e9e454987068337f4f9efe9"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=20
                SELECT link_id, count(*) AS hotspot_hour_count, min(flow_speed) AS min_flow_speed
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                  AND hotspot_state = 'lowest_speed_top_10'
                GROUP BY link_id
                ORDER BY hotspot_hour_count DESC, min_flow_speed ASC
                LIMIT :n
            - pattern_id: "ranked_links_for_hour_switch"
              question_ko: "특정 시간대에 관측된 링크를 속도 또는 통행시간 기준으로, 오름/내림차순을 골라 순위대로 보고 싶습니다."
              axes: "시간대 필터 — 지표(속도/통행시간)·정렬 방향 스위치 랭킹"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "2026-07-31 21:00:00에 속도 기준 가장 느린 링크는 1080002500으로 7.0km/h(혼잡 순위 1위, 통행시간 415초, 관측 링크 47개)입니다."
              sql: |
                -- :hour_at=2026-07-31 21:00:00, :metric=speed, :dir=asc, :n=20
                SELECT link_id, hour_at, flow_speed, flow_travel_time, congestion_rank, hotspot_state, observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at = :hour_at
                ORDER BY CASE WHEN :metric='speed' AND :dir='asc' THEN flow_speed END ASC,
                         CASE WHEN :metric='speed' AND :dir='desc' THEN flow_speed END DESC,
                         CASE WHEN :metric='travel_time' AND :dir='asc' THEN flow_travel_time END ASC,
                         CASE WHEN :metric='travel_time' AND :dir='desc' THEN flow_travel_time END DESC
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { dir: "asc", n: 20 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "longest_travel_time_in_window"
              question_ko: "특정 시간 범위에서 통행시간이 가장 길었던 링크·시각은 어디입니까?"
              axes: "시간 범위·가용 품질 필터 — flow_travel_time DESC"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "관측 창 전체에서 통행시간이 가장 길었던 링크는 1220003800(2026-07-31 13:00:00)으로 1080초, 속도 10.0km/h(혼잡 순위 2위)입니다."
              sql: |
                -- :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00, :n=20
                SELECT link_id, hour_at, flow_speed, flow_travel_time, congestion_rank, hotspot_state
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                  AND flow_value_quality = 'available'
                ORDER BY flow_travel_time DESC, hour_at ASC
                LIMIT :n
              requires: [select_columns, filter_range, filter_set, sort]
              param_defaults: { n: 20 }
            - pattern_id: "hour_of_day_speed_profile"
              question_ko: "관측 창에서 하루 중 몇 시(시간대)에 평균 속도가 가장 낮습니까?"
              axes: "시간 범위 필터 — 시(hour-of-day) 파생 차원 집계, 평균 속도 ASC"
              verified_rows: 0                # 실 D1 실측: [24, 23] (스탬핑 대기)
              insight_sample_ko: "관측 창 전체에서 시 기준 평균 속도가 가장 낮은 시간대는 18시로 평균 19.7km/h(관측 29건, 최저 6.2km/h, 평균 통행시간 278초)입니다."
              sql: |
                -- :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00
                SELECT substr(hour_at, 12, 2) AS hour_of_day, count(*) AS observation_count,
                       round(avg(flow_speed), 1) AS avg_flow_speed, min(flow_speed) AS min_flow_speed,
                       round(avg(flow_travel_time), 1) AS avg_flow_travel_time
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                GROUP BY hour_of_day
                ORDER BY avg_flow_speed ASC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
            - pattern_id: "worst_congestion_hours"
              question_ko: "관측 창에서 저속 hotspot 링크가 충분히 관측된 시각 중 가장 혼잡(평균 속도 최저)했던 시간은 언제입니까?"
              axes: "시간 범위·hotspot 상태 필터 — 시각별 집계, 최소 관측 링크 임계값, 평균 속도 ASC"
              verified_rows: 0                # 실 D1 실측: [20, 10] (스탬핑 대기)
              insight_sample_ko: "저속 top-10 링크가 5개 이상 관측된 시각 중 평균 속도가 가장 낮았던 시간은 2026-07-31 12:00:00으로 링크 10개 평균 11.9km/h(최저 8.4km/h, 최대 통행시간 274초)입니다."
              sql: |
                -- :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00, :min_links=5, :n=20
                SELECT hour_at, count(*) AS hotspot_link_count, round(avg(flow_speed), 1) AS avg_flow_speed,
                       min(flow_speed) AS min_flow_speed, max(flow_travel_time) AS max_flow_travel_time
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                  AND hotspot_state = 'lowest_speed_top_10'
                GROUP BY hour_at
                HAVING count(*) >= :min_links
                ORDER BY avg_flow_speed ASC, min_flow_speed ASC
                LIMIT :n
              requires: [select_columns, filter_range, filter_set, aggregate, group_by, having, sort]
              param_defaults: { min_links: 5, n: 20 }
            - pattern_id: "persistent_severe_congestion"
              question_ko: "관측 창에서 지정한 속도 이하로 여러 시간 반복 관측된, 만성적으로 심하게 막히는 링크는 어디입니까?"
              axes: "시간 범위·속도 임계값 필터 — 링크별 발생 시간 집계, 최소 시간 임계값, 발생 시간 DESC"
              verified_rows: 0                # 실 D1 실측: [5, 13] (스탬핑 대기)
              insight_sample_ko: "속도 10km/h 이하가 2시간 이상 반복된 링크는 5곳이며, 최다는 1010009500으로 13시간(최저 2.0km/h, 평균 6.6km/h, 최대 통행시간 247초)입니다."
              sql: |
                -- :max_speed=10, :min_hours=2, :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00, :n=20
                SELECT link_id, count(*) AS severe_hour_count, min(flow_speed) AS min_flow_speed,
                       round(avg(flow_speed), 1) AS avg_flow_speed, max(flow_travel_time) AS max_flow_travel_time
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                  AND flow_value_quality = 'available'
                  AND flow_speed <= :max_speed
                GROUP BY link_id
                HAVING count(*) >= :min_hours
                ORDER BY severe_hour_count DESC, min_flow_speed ASC
                LIMIT :n
              requires: [select_columns, filter_range, filter_set, aggregate, group_by, having, sort]
              param_defaults: { max_speed: 10, min_hours: 2, n: 20 }
            - pattern_id: "hotspot_share_by_link"
              question_ko: "관측 창에서 관측된 시간 대비 저속 hotspot으로 잡힌 비중이 가장 높은, 즉 가장 일관되게 막히는 링크는 어디입니까?"
              axes: "시간 범위 필터 — 링크별 hotspot 시간/관측 시간 비율, 최소 관측 임계값, 비율 DESC"
              verified_rows: 0                # 실 D1 실측: [20, 10] (스탬핑 대기)
              insight_sample_ko: "관측 5시간 이상 링크 중 hotspot 비중이 가장 높은 곳은 1240000900으로 관측 8시간 전부 저속 top-10(비중 1.0, 최저 13.9km/h)입니다."
              sql: |
                -- :min_observed_hours=5, :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00, :n=20
                SELECT link_id, count(*) AS observed_hour_count,
                       sum(CASE WHEN hotspot_state = 'lowest_speed_top_10' THEN 1 ELSE 0 END) AS hotspot_hour_count,
                       round(1.0 * sum(CASE WHEN hotspot_state = 'lowest_speed_top_10' THEN 1 ELSE 0 END) / count(*), 3) AS hotspot_share,
                       min(flow_speed) AS min_flow_speed
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE hour_at >= :from_at AND hour_at < :to_at
                GROUP BY link_id
                HAVING count(*) >= :min_observed_hours
                ORDER BY hotspot_share DESC, observed_hour_count DESC
                LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, having, sort]
              param_defaults: { min_observed_hours: 5, n: 20 }
            - pattern_id: "congestion_for_link_set"
              question_ko: "내가 지정한 여러 링크(예: 통근 경로)의 관측 창 내 시간별 혼잡 이력을 한 번에 보고 싶습니다."
              axes: "다중 링크 배열·시간 범위 필터 — 링크·시각 ASC"
              verified_rows: 0                # 실 D1 실측: [115, 12] (스탬핑 대기)
              insight_sample_ko: "지정한 링크 3개(1010009500·1000021700·1210013400)의 관측 창 내 시간별 이력 114행이 반환되며, 첫 행은 1000021700 2026-08-04 18:00 속도 19.0km/h(혼잡 순위 3위)입니다."
              sql: |
                -- :link_ids=["1010009500","1000021700","1210013400"], :from_at=2026-07-30 00:00:00, :to_at=2026-08-10 00:00:00, :n=200
                SELECT link_id, hour_at, flow_speed, flow_travel_time, congestion_rank, hotspot_state, observed_link_count
                FROM gold_traffic_flow_congestion_hotspots_hourly
                WHERE link_id IN (SELECT value FROM json_each(:link_ids))
                  AND hour_at >= :from_at AND hour_at < :to_at
                ORDER BY link_id, hour_at ASC
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { n: 200 }
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - hour_at
              - flow_speed
              - flow_travel_time
              - flow_value_quality
              - observed_at_kst
              - congestion_rank
              - observed_link_count
              - hotspot_state
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Traffic 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
            - rapidapi_serving
          cross_domain_usage_examples:
            - 특정 시간대 서울에서 가장 느린 도로 링크를 외부 API로 조회할 때 사용합니다.
            - 혼잡 경보 대시보드에서 시간대별 저속 링크 상위 목록을 보여줄 때 사용합니다.
          product_question: 지금 서울에서 관측 속도가 가장 낮은 도로 링크는 어디입니까?
          row_meaning: 관측된 hour_at 시간대 한 곳과 link_id 한 곳의 순위화된 관측 속도·통행시간 한 행입니다.
          grain: hour_at과 link_id 조합마다 정확히 한 행입니다.
          anchor_universe: silver_seoul_traffic_flow에서 해당 hour_at에 실제로 관측이 있었던 link_id만 포함하며, 전체 링크 universe가 아닙니다.
          usage_guidance: congestion_rank는 그 시간대에 실제로 관측된 링크 집합 안에서의 상대순위이며, hotspot_state가 lowest_speed_top_10인 행만 저속 후보로 사용합니다.
          do_not_use_for: 도로등급 보정이 필요한 공식 혼잡등급 판정이나 링크 간 절대 속도 비교, 실시간 긴급 경보에 사용하지 않습니다.
          semantic_caveats: congestion_rank는 observed_link_count(그 시간대 관측된 링크 수)를 분모로 하는 상대순위이며, 시간대마다 observed_link_count가 달라 순위의 절대적 의미가 달라질 수 있습니다. flow_speed가 null이면 congestion_rank 계산에서 nulls last로 처리됩니다.
          primary_key:
            - product_row_id
          column_order:
            - product_row_id
            - link_id
            - hour_at
            - flow_speed
            - flow_travel_time
            - flow_value_quality
            - observed_at_kst
            - congestion_rank
            - observed_link_count
            - hotspot_state
            - raw_object_key
            - payload_hash
            - dag_run_id
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: pinned Flow run이 터치한 hour_at만 incremental merge로 재계산하는 것을 목표로 합니다.
            as_of_meaning: hour_at은 observed_at_kst를 시간 단위로 절삭한 평가 시간 bucket이며, 그 시간대 안에서 링크별 최신 관측만 순위에 반영합니다.
            late_repair_policy: incremental merge로 해당 hour_at의 링크 순위만 전체 재계산하며 과거 시간대 순위는 보존합니다.
            roles:
              hour_at:
                time_role: evaluation_bucket
                timezone: Asia/Seoul
              observed_at_kst:
                time_role: event
                timezone: Asia/Seoul
          space:
            enabled: false
          metrics: {}
          joins: {}
          quality:
            completeness_explanation: flow_value_quality로 원천 응답에서 속도·통행시간 값이 실제로 존재했는지 확인하고, hotspot_state로 순위 계산 가능 여부를 구분합니다.
            freshness_explanation: observed_at_kst(원천 관측)를 hour_at(평가 시간 bucket)과 분리해 원천 지연을 해석합니다.
            coverage_explanation: 그 hour_at에 실제로 관측된 link_id만 포함하므로 시간대마다 observed_link_count가 다르며 전체 링크 universe가 아닙니다.
            state_fields:
              flow_value_quality:
                allowed_values:
                  - available
                  - missing_value
                state_explanations:
                  available: flow_speed 또는 flow_travel_time 중 하나 이상이 원천에 존재하는 상태입니다.
                  missing_value: flow_speed와 flow_travel_time이 모두 원천에 없는 상태입니다.
              hotspot_state:
                allowed_values:
                  - missing_speed
                  - lowest_speed_top_10
                  - observed
                state_explanations:
                  missing_speed: flow_speed가 없어 저속 여부를 판정할 수 없는 상태입니다.
                  lowest_speed_top_10: 그 hour_at 관측 링크 중 congestion_rank가 10 이하인 저속 후보 상태입니다.
                  observed: 정상 관측되었으나 저속 상위 10위 안에 들지 않은 상태입니다.
          lineage:
            source_relations:
              - model.asac_seoul.silver_seoul_traffic_flow
            identifiers:
              as_of:
                columns:
                  - hour_at
              publication:
                relation_level_only: true
                columns: []
              raw:
                columns:
                  - raw_object_key
              request:
                relation_level_only: true
                columns: []
              run:
                columns:
                  - dag_run_id
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: link_id와 hour_at을 '|' 구분자로 직렬화한 결정적 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - unique:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: 공개 제품 기본 키이므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: natural grain의 일부이므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: hour_at
        description: observed_at_kst를 시간 단위로 절삭한 서울 기준 평가 시간입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: natural grain의 일부이므로 null을 허용하지 않습니다.
            time_role: evaluation_bucket
            timezone: Asia/Seoul
            unit: not_applicable
      - name: flow_speed
        description: 이 링크·시간대의 최신 관측 속도입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_value_quality가 missing_value인 경우이며 hotspot_state가 missing_speed로 표시됩니다.
            unit: kilometer_per_hour
      - name: flow_travel_time
        description: 이 링크·시간대의 최신 관측 통행시간입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_value_quality가 missing_value인 경우입니다.
            unit: second
      - name: flow_value_quality
        description: flow_speed·flow_travel_time 값이 원천에 실제로 존재했는지 구분한 상태입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - accepted_values:
              arguments:
                values: ['available', 'missing_value']
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: 품질 상태를 분류하지 못한 행은 공개하지 않습니다.
            unit: not_applicable
      - name: observed_at_kst
        description: 관측 시각을 서울 기준으로 변환한 timestamp(6)이며 hour_at의 근거입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 관측 시각이 없는 행은 hour_at을 만들 수 없습니다.
            time_role: event
            timezone: Asia/Seoul
            unit: not_applicable
      - name: congestion_rank
        description: 같은 hour_at 안에서 flow_speed 오름차순(느릴수록 낮은 순위)으로 매긴 순위입니다.
        data_type: bigint
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: derived_value
            nullable: false
            null_meaning: rank() window 함수는 그 hour_at의 모든 관측 행에 순위를 부여하므로 null이 없습니다.
            unit: rank
      - name: observed_link_count
        description: 같은 hour_at에 관측된 link_id 총 수이며 congestion_rank의 분모 맥락입니다.
        data_type: bigint
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: derived_value
            nullable: false
            null_meaning: count() window 함수는 그 hour_at의 모든 관측 행에 값을 부여하므로 null이 없습니다.
            unit: count
      - name: hotspot_state
        description: flow_speed 존재 여부와 congestion_rank를 기준으로 구분한 저속 후보 상태입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - accepted_values:
              arguments:
                values: ['missing_speed', 'lowest_speed_top_10', 'observed']
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: case 표현식이 모든 행에 세 상태 중 하나를 부여하므로 null이 없습니다.
            unit: not_applicable
      - name: raw_object_key
        description: 선택된 관측 행의 원본 객체를 추적하는 안정 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 원본 객체로 역추적할 수 없는 행은 공개하지 않습니다.
      - name: payload_hash
        description: 선택된 관측 행의 payload hash입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: payload hash가 없는 행은 공개하지 않습니다.
      - name: dag_run_id
        description: 선택된 관측 행을 만든 수집 DAG 실행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: lineage_id
            nullable: false
            null_meaning: 수집 실행으로 역추적할 수 없는 행은 공개하지 않습니다.
