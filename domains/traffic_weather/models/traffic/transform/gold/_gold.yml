version: 2

models:
  - name: gold_traffic_incident_summary
    description: Support-only one-row-per-source aggregate of the pinned current incident snapshot; excluded from the five Traffic Quality Gold products.
    config:
      meta:
        traffic_quality_product: false
        support_only: true
    columns:
      - name: source_id
        description: TOPIS source identifier; unique summary grain.
        tests:
          - not_null
          - unique
      - name: row_count
        description: Current deduplicated Silver incident count.
        tests:
          - not_null
      - name: raw_object_count
        description: Distinct R2 raw objects represented by the current Silver rows.
        tests:
          - not_null
      - name: source_coordinate_row_count
        description: Silver rows whose original GRS80 TM coordinate pair was present.
        tests:
          - not_null
      - name: missing_source_coordinate_row_count
        description: Silver rows whose original coordinate pair was absent.
        tests:
          - not_null
      - name: first_occurred_at
        description: Earliest current incident occurrence timestamp in KST; null for a valid zero-incident snapshot.
      - name: last_occurred_at
        description: Latest current incident occurrence timestamp in KST; null for a valid zero-incident snapshot.
      - name: last_collected_at
        description: Latest Bronze collection timestamp represented in the current snapshot; null for a valid zero-incident snapshot.

  - name: gold_traffic_incident_x_flow
    description: Current TOPIS incidents left-joined to the pinned per-link TrafficInfo speed and travel-time snapshot.
    config:
      meta:
        traffic_quality_product: true
    columns:
      - name: source_record_id
        description: Stable TOPIS incident identifier.
        tests:
          - not_null
          - unique
      - name: incident_source_id
        description: Incident source identifier.
        tests:
          - not_null
      - name: link_id
        description: TOPIS road-link identifier shared by incident and flow data.
      - name: occurred_at
        description: Incident occurrence timestamp in KST.
        tests:
          - not_null
      - name: incident_dag_run_id
        description: Publishable incident Bronze snapshot used for the current incident row.
        tests:
          - not_null
      - name: flow_speed
        description: Speed from the matching TrafficInfo response; null when no flow row matched.
      - name: flow_travel_time
        description: Travel time from the matching TrafficInfo response; null when no flow row matched.
      - name: flow_value_quality
        description: Flow metric availability classification.
      - name: flow_observed_at
        description: Flow response collection timestamp.
      - name: flow_raw_object_key
        description: R2 raw lineage for the matching flow response.
      - name: flow_payload_hash
        description: SHA-256 lineage hash for the matching flow response.
      - name: flow_dag_run_id
        description: Publishable flow Bronze snapshot used for the join.
      - name: flow_match_status
        description: Join result; matched when a flow link row exists, otherwise missing_flow.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'missing_flow']

  - name: gold_traffic_incident_collection_coverage_5m
    description: 실제로 물질화된 TOPIS request-audit를 source와 UTC 수집 5분 구간별로 요약하며 미착륙 schedule slot은 생성하지 않는 품질 제품입니다.
    config:
      meta:
        traffic_quality_product: true
    columns:
      - name: product_row_id
        description: source_id와 coverage_window_at_utc를 결정적으로 직렬화한 식별자입니다.
        tests: [not_null, unique]
      - name: source_id
        description: request-audit source identifier입니다.
        tests: [not_null]
      - name: coverage_window_at_utc
        description: collected_at을 UTC-naive 5분 경계로 내림한 관측 구간 시작입니다.
        tests: [not_null]
      - name: coverage_window_end_at_utc
        description: 관측 구간의 exclusive 종료 시각입니다.
        tests: [not_null]
      - name: evidence_scope
        description: 이 제품이 물질화된 snapshot 증거만 표현함을 나타냅니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['materialized_snapshot_only']
      - name: materialized_request_count
        description: 해당 구간에 실제 존재하는 audit row 수입니다.
        tests: [not_null]
      - name: materialized_distinct_request_count
        description: 해당 구간의 distinct request_id 수입니다.
        tests: [not_null]
      - name: duplicate_request_count
        description: materialized request row 수와 distinct request 수의 차이입니다.
        tests: [not_null]
      - name: materialized_raw_object_count
        description: audit가 가리키는 distinct raw_object_key 수입니다.
        tests: [not_null]
      - name: materialized_row_count
        description: audit row_count의 합이며 schedule 기대량이 아닙니다.
        tests: [not_null]
      - name: successful_request_count
        description: HTTP 2xx이며 result_code가 INFO-000인 audit request 수입니다.
        tests: [not_null]
      - name: api_failed_request_count
        description: non-2xx 또는 non-INFO-000인 audit request 수입니다.
        tests: [not_null]
      - name: invalid_contract_request_count
        description: 필수 request-audit 열 또는 page/count 계약을 위반한 row 수입니다.
        tests: [not_null]
      - name: observed_run_count
        description: audit row에서 관측한 distinct dag_run_id 수입니다.
        tests: [not_null]
      - name: effective_manifest_run_count
        description: source/run별 latest effective manifest에 결합된 distinct run 수입니다.
        tests: [not_null]
      - name: success_publishable_run_count
        description: latest effective 상태가 SUCCESS와 publishable인 distinct run 수입니다.
        tests: [not_null]
      - name: terminal_failure_run_count
        description: latest effective 상태가 FAILED이거나 failure reason이 있는 distinct run 수입니다.
        tests: [not_null]
      - name: manifest_not_publishable_run_count
        description: latest effective 상태가 SUCCESS+publishable이 아닌 distinct manifest run 수입니다.
        tests: [not_null]
      - name: min_reported_incident_count
        description: 구간 audit의 최소 list_total_count입니다.
      - name: max_reported_incident_count
        description: 구간 audit의 최대 list_total_count입니다.
      - name: first_collected_at_utc
        description: 구간에서 가장 이른 audit collected_at입니다.
        tests: [not_null]
      - name: last_collected_at_utc
        description: 구간에서 가장 늦은 audit collected_at입니다.
        tests: [not_null]
      - name: coverage_state
        description: 물질화된 audit와 latest effective manifest 정합 상태입니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - manifest_missing
                  - api_failure
                  - manifest_not_publishable
                  - materialized_partial
                  - materialized_zero
                  - materialized_consistent

  - name: gold_traffic_incident_expected_clearance_profile_by_admin_dong_daily
    description: 고정 current snapshot의 incident를 발생일과 canonical 또는 unmapped bucket으로 묶어 expected-clear 증거 비율과 예상 lead minutes를 제공하는 제품입니다.
    config:
      meta:
        traffic_quality_product: true
    columns:
      - name: product_row_id
        description: profile_day와 mapping_bucket의 결정적 식별자입니다.
        tests: [not_null, unique]
      - name: profile_day
        description: occurred_at의 KST calendar date입니다.
        tests: [not_null]
      - name: mapping_bucket
        description: canonical admin_dong_code 또는 __UNMAPPED__입니다.
        tests: [not_null]
      - name: admin_dong_code
        description: canonical bucket의 정본 코드이며 unmapped bucket에서는 null입니다.
      - name: admin_dong
        description: canonical 행정동명이며 unmapped bucket에서는 null입니다.
      - name: gu_code
        description: canonical 자치구 코드이며 unmapped bucket에서는 null입니다.
      - name: gu
        description: canonical 자치구명이며 unmapped bucket에서는 null입니다.
      - name: admin_dong_revision_date
        description: canonical stamp revision이며 unmapped bucket에서는 null입니다.
      - name: snapshot_dag_run_id
        description: current Silver가 상속한 pinned incident run입니다.
        tests: [not_null]
      - name: snapshot_run_count
        description: bucket 안 distinct pinned run 수이며 항상 1이어야 합니다.
        tests: [not_null]
      - name: evidence_scope
        description: pinned current snapshot을 occurrence day로 재집계했음을 나타냅니다.
        tests:
          - accepted_values:
              arguments:
                values: ['pinned_current_snapshot_by_occurrence_day']
      - name: incident_count
        description: expected_clear_at null 여부와 무관한 current incident 수입니다.
        tests: [not_null]
      - name: expected_clearance_present_count
        description: expected_clear_at이 있는 incident 수입니다.
        tests: [not_null]
      - name: expected_clearance_missing_count
        description: expected_clear_at이 없는 incident 수입니다.
        tests: [not_null]
      - name: expected_clearance_usable_count
        description: expected_clear_at이 occurred_at 이상인 incident 수입니다.
        tests: [not_null]
      - name: expected_clearance_invalid_count
        description: expected_clear_at이 occurred_at보다 이른 incident 수입니다.
        tests: [not_null]
      - name: expected_clearance_present_ratio
        description: present count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: expected_clearance_missing_ratio
        description: missing count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: expected_clearance_usable_ratio
        description: usable count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: expected_clearance_invalid_ratio
        description: invalid count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: min_expected_clearance_lead_minutes
        description: usable source expectation의 최소 lead minutes이며 실제 duration이 아닙니다.
      - name: avg_expected_clearance_lead_minutes
        description: usable source expectation의 평균 lead minutes이며 실제 duration이 아닙니다.
      - name: max_expected_clearance_lead_minutes
        description: usable source expectation의 최대 lead minutes이며 실제 duration이 아닙니다.
      - name: profile_state
        description: expected-clear evidence의 없음, invalid-only, partial, complete 상태입니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - no_expected_clearance_evidence
                  - invalid_expected_clearance_evidence
                  - partial_expected_clearance_evidence
                  - complete_expected_clearance_evidence

  - name: gold_traffic_incident_spatial_mapping_quality_daily
    description: 고정 current snapshot의 incident를 발생일과 canonical 또는 unmapped bucket으로 묶고 공간 매핑 실패 원인을 상호배타적으로 분리하는 제품입니다.
    config:
      meta:
        traffic_quality_product: true
    columns:
      - name: product_row_id
        description: quality_day와 mapping_bucket의 결정적 식별자입니다.
        tests: [not_null, unique]
      - name: quality_day
        description: occurred_at의 KST calendar date입니다.
        tests: [not_null]
      - name: mapping_bucket
        description: canonical admin_dong_code 또는 __UNMAPPED__입니다.
        tests: [not_null]
      - name: admin_dong_code
        description: canonical bucket의 정본 코드이며 unmapped bucket에서는 null입니다.
      - name: admin_dong
        description: canonical 행정동명이며 unmapped bucket에서는 null입니다.
      - name: gu_code
        description: canonical 자치구 코드이며 unmapped bucket에서는 null입니다.
      - name: gu
        description: canonical 자치구명이며 unmapped bucket에서는 null입니다.
      - name: admin_dong_revision_date
        description: canonical stamp revision이며 unmapped bucket에서는 null입니다.
      - name: snapshot_dag_run_id
        description: current Silver가 상속한 pinned incident run입니다.
        tests: [not_null]
      - name: snapshot_run_count
        description: bucket 안 distinct pinned run 수이며 항상 1이어야 합니다.
        tests: [not_null]
      - name: evidence_scope
        description: pinned current snapshot을 occurrence day로 재집계했음을 나타냅니다.
        tests:
          - accepted_values:
              arguments:
                values: ['pinned_current_snapshot_by_occurrence_day']
      - name: incident_count
        description: bucket의 current incident 수입니다.
        tests: [not_null]
      - name: mapped_incident_count
        description: canonical dimension에 exact join된 incident 수입니다.
        tests: [not_null]
      - name: source_coordinate_missing_count
        description: source GRS80 TM coordinate pair가 없는 incident 수입니다.
        tests: [not_null]
      - name: wgs84_conversion_or_bbox_miss_count
        description: source coordinate는 있으나 WGS84 변환 또는 Seoul bbox guard 후 좌표가 없는 incident 수입니다.
        tests: [not_null]
      - name: boundary_match_missing_count
        description: WGS84 좌표는 있으나 Silver boundary match code가 없는 incident 수입니다.
        tests: [not_null]
      - name: canonical_admin_miss_count
        description: Silver candidate admin code는 있으나 canonical dimension에 없는 incident 수입니다.
        tests: [not_null]
      - name: mapping_success_ratio
        description: mapped incident를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: source_coordinate_missing_ratio
        description: source-coordinate-missing count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: wgs84_conversion_or_bbox_miss_ratio
        description: conversion/bbox miss count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: boundary_match_missing_ratio
        description: boundary miss count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: canonical_admin_miss_ratio
        description: canonical miss count를 incident_count로 나눈 비율입니다.
        tests: [not_null]
      - name: mapping_state
        description: mapping_bucket이 canonical이면 mapped, __UNMAPPED__이면 unmapped입니다.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mapped', 'unmapped']

  - name: gold_traffic_incident_x_weather_current_hourly
    description: Canonical Traffic current-hourly admin-dong rows left-joined with no-hindsight KMA forecast context at the same admin-dong and hour.
    config:
      meta:
        traffic_quality_product: false
        cross_domain_gold: true
        grain: admin_dong_code and hour_at, exactly preserving gold_traffic_incident_current_by_admin_dong_hourly.
        anchor_model: gold_traffic_incident_current_by_admin_dong_hourly
        context_domain: weather
        null_semantics: Missing weather context remains null and never rewrites Traffic incident_count or has_incident semantics.
    columns:
      - name: product_row_id
        description: Traffic product_row_id preserved from the canonical current-hourly anchor.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: Canonical admin-dong code preserved from the Traffic anchor.
        tests: [not_null]
      - name: hour_at
        description: Traffic evaluation hour preserved from the Traffic anchor.
        tests: [not_null]
      - name: admin_dong
        description: Canonical admin-dong name preserved from the Traffic anchor.
        tests: [not_null]
      - name: gu_code
        description: Canonical gu code preserved from the Traffic anchor.
        tests: [not_null]
      - name: gu
        description: Canonical gu name preserved from the Traffic anchor.
        tests: [not_null]
      - name: admin_dong_revision_date
        description: Canonical admin-dong revision date preserved from the Traffic anchor.
        tests: [not_null]
      - name: incident_count
        description: Traffic incident count preserved exactly; null still means Traffic quality did not support a count.
      - name: has_incident
        description: Traffic has-incident flag preserved exactly; null still means Traffic quality did not support the boolean.
      - name: quality_state
        description: Traffic quality state preserved exactly from the anchor.
        tests: [not_null]
      - name: snapshot_as_of_at
        description: Traffic snapshot as-of timestamp preserved from the anchor.
      - name: status_observed_at
        description: Traffic status observation timestamp used as the Weather no-hindsight cutoff.
        tests: [not_null]
      - name: published_at
        description: Traffic publication timestamp preserved from the anchor.
        tests: [not_null]
      - name: snapshot_dag_run_id
        description: Traffic snapshot DAG run identifier preserved from the anchor.
        tests: [not_null]
      - name: source_id
        description: Traffic source identifier preserved from the anchor.
        tests: [not_null]
      - name: weather_category_coverage_count
        description: Count of available Weather categories among TMP, POP, REH, WSD, SKY, and PTY after no-hindsight filtering; null when no eligible weather row exists.
      - name: weather_latest_issued_at
        description: Latest KMA issued_at among category winners that were issued no later than Traffic status_observed_at.
      - name: weather_latest_collected_at
        description: Latest collection timestamp among eligible Weather category winners.
      - name: weather_latest_published_at
        description: Latest public Weather Gold published_at among eligible category winners, preserving context publication as-of evidence.
      - name: tmp_value_num
        description: TMP numeric value from Weather value_num; null when missing.
      - name: pop_value_num
        description: POP numeric value from Weather value_num; null when missing.
      - name: reh_value_num
        description: REH numeric value from Weather value_num; null when missing.
      - name: wsd_value_num
        description: WSD numeric value from Weather value_num; null when missing.
      - name: sky_qualitative_code
        description: SKY qualitative code from Weather qualitative_code; null when missing.
      - name: pty_qualitative_code
        description: PTY qualitative code from Weather qualitative_code; null when missing.
      - name: is_precipitating
        description: Nullable PTY-derived precipitation flag; true for recognized nonzero PTY 1-7, false for PTY 0, null when PTY is missing or unrecognized.

  - name: gold_traffic_incident_x_citydata_crowding_current_hourly
    description: Canonical Traffic current-hourly admin-dong rows left-joined with Seoul Citydata monitored-place crowding context at the same admin-dong and hour.
    config:
      meta:
        traffic_quality_product: false
        cross_domain_gold: true
        grain: admin_dong_code and hour_at, exactly preserving gold_traffic_incident_current_by_admin_dong_hourly.
        anchor_model: gold_traffic_incident_current_by_admin_dong_hourly
        context_domain: citydata_crowding
        null_semantics: Missing crowding context leaves metrics null and sets crowding_observed false; avg_ppltn is monitored-place context, not resident or admin-dong total population.
    columns:
      - name: product_row_id
        description: Traffic product_row_id preserved from the canonical current-hourly anchor.
        tests: [not_null, unique]
      - name: admin_dong_code
        description: Canonical admin-dong code preserved from the Traffic anchor.
        tests: [not_null]
      - name: hour_at
        description: Traffic evaluation hour preserved from the Traffic anchor.
        tests: [not_null]
      - name: admin_dong
        description: Canonical admin-dong name preserved from the Traffic anchor.
        tests: [not_null]
      - name: gu_code
        description: Canonical gu code preserved from the Traffic anchor.
        tests: [not_null]
      - name: gu
        description: Canonical gu name preserved from the Traffic anchor.
        tests: [not_null]
      - name: admin_dong_revision_date
        description: Canonical admin-dong revision date preserved from the Traffic anchor.
        tests: [not_null]
      - name: incident_count
        description: Traffic incident count preserved exactly; null still means Traffic quality did not support a count.
      - name: has_incident
        description: Traffic has-incident flag preserved exactly; null still means Traffic quality did not support the boolean.
      - name: quality_state
        description: Traffic quality state preserved exactly from the anchor.
        tests: [not_null]
      - name: snapshot_as_of_at
        description: Traffic snapshot as-of timestamp preserved from the anchor.
      - name: status_observed_at
        description: Traffic status observation timestamp preserved from the anchor.
        tests: [not_null]
      - name: published_at
        description: Traffic publication timestamp preserved from the anchor.
        tests: [not_null]
      - name: snapshot_dag_run_id
        description: Traffic snapshot DAG run identifier preserved from the anchor.
        tests: [not_null]
      - name: source_id
        description: Traffic source identifier preserved from the anchor.
        tests: [not_null]
      - name: monitored_place_count
        description: Count of latest Citydata monitored-place rows represented in the admin-dong/hour context; null when no place was observed.
      - name: avg_place_avg_ppltn
        description: Average of monitored-place avg_ppltn values after latest-per-area selection; not a summed or resident population total.
      - name: peak_place_avg_ppltn
        description: Maximum monitored-place avg_ppltn after latest-per-area selection; not an admin-dong population total.
      - name: crowding_latest_observed_at
        description: Latest Citydata event_at among selected monitored-place rows.
      - name: crowding_latest_collected_at
        description: Latest Citydata collected_at among selected monitored-place rows.
      - name: crowding_observed
        description: False when no Citydata monitored-place row matched this Traffic admin-dong/hour; true when at least one selected place row exists.
        tests: [not_null]
