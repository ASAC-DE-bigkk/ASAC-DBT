version: 2

models:
  - name: gold_traffic_flow_change_latest
    description: 도로 링크별 최신 관측과 직전 관측의 속도·통행시간 차이 및 실제 관측 간격을 제공하는 공개 Gold 제품입니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: traffic_flow_change_latest
          display:
            title: 도로 링크별 교통 흐름 변화
            summary: 도로 링크마다 최신 관측값과 직전 관측값의 속도·통행시간 변화를 보여줍니다.
            caveat: 직전 관측값이 없으면 변화량을 비교할 수 없습니다.
            use_cases: ["교통 흐름 급변 링크 파악"]
          product_question: 직전 관측보다 속도가 느려지거나 통행시간이 늘어난 서울 도로 구간은 어디입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.get_flow_change
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 이 링크의 속도는 직전 관측보다 어떻게 변했나요?
              - 최근 통행시간이 늘어난 링크를 찾아주세요.
              - 직전 관측이 없어 비교할 수 없는 링크가 있나요?
          grain: link_id마다 한 행 — 링크별 최신 관측과 바로 이전 관측의 비교.
          primary_key: [product_row_id]
          publication_mode: upsert
          upsert_strategy: exact_set
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: observed_at_kst
          freshness_slo_minutes: 90
          shape: wide
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: change_for_link
              question_ko: 특정 링크의 최신 속도와 통행시간은 직전 관측보다 어떻게 바뀌었습니까?
              axes: 링크 필터 — 최신·직전 관측 비교
              requires: [select_columns, filter_set]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :link_id='1000001200'
                SELECT link_id, observed_at_kst, previous_observed_at_kst, flow_speed, previous_flow_speed,
                       flow_speed_change, flow_travel_time, previous_flow_travel_time,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE link_id = :link_id
            - pattern_id: speed_decreased_links
              question_ko: 직전 관측보다 속도가 감소한 링크는 어디입니까?
              axes: speed_decreased 상태 필터 — 속도 변화 ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state = 'speed_decreased'
                ORDER BY flow_speed_change ASC
                LIMIT :n
            - pattern_id: speed_increased_links
              question_ko: 직전 관측보다 속도가 증가한 링크는 어디입니까?
              axes: speed_increased 상태 필터 — 속도 변화 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state = 'speed_increased'
                ORDER BY flow_speed_change DESC
                LIMIT :n
            - pattern_id: links_without_prior_observation
              question_ko: 직전 관측이 없어 변화 비교를 할 수 없는 링크는 무엇입니까?
              axes: no_prior_observation 상태 필터 — 최신 관측 시각 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 46
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :n=50
                SELECT link_id, observed_at_kst, flow_speed, flow_travel_time, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state = 'no_prior_observation'
                ORDER BY observed_at_kst DESC
                LIMIT :n
            - pattern_id: largest_speed_drop
              question_ko: 속도 하락 폭이 가장 큰 링크는 어디입니까?
              axes: 음수 속도 변화 필터 — flow_speed_change ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE flow_speed_change < 0
                ORDER BY flow_speed_change ASC
                LIMIT :n
            - pattern_id: largest_travel_time_increase
              question_ko: 통행시간 증가 폭이 가장 큰 링크는 어디입니까?
              axes: 양수 통행시간 변화 필터 — flow_travel_time_change DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_travel_time, previous_flow_travel_time,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE flow_travel_time_change > 0
                ORDER BY flow_travel_time_change DESC
                LIMIT :n
            - pattern_id: speed_change_state_overview
              question_ko: 최신 링크 스냅샷에서 속도 변화 상태별 링크 수는 얼마입니까?
              axes: 속도 변화 상태 집계 — 링크 수 DESC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: false
              verified_rows: 4
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                SELECT speed_change_state, count(*) AS link_count
                FROM gold_traffic_flow_change_latest
                GROUP BY speed_change_state
                ORDER BY link_count DESC, speed_change_state
            - pattern_id: change_observation_window
              question_ko: 특정 관측 시간 범위에서 속도 변화가 큰 링크는 어디입니까?
              axes: 관측 시각 범위 필터 — 절대 속도 변화 DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 50, from_at: { rel: "-30d", as: datetime }, to_at: { rel: "0d", as: datetime } }
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "60eec21f66b64832ae71f0b6cf0f3cc3"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=50
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE observed_at_kst >= :from_at AND observed_at_kst < :to_at
                ORDER BY abs(flow_speed_change) DESC
                LIMIT :n
            - pattern_id: "rank_flow_change_by_metric"
              question_ko: "속도 변화 또는 통행시간 변화 지표를 골라, 원하는 방향으로 가장 많이 변한 링크를 보고 싶습니다."
              axes: "지표(속도 변화/통행시간 변화)·정렬 방향·상태 스위치 — 선택 지표 정렬"
              verified_rows: 0                # 실 D1 실측: [20, 10, 15] (스탬핑 대기)
              insight_sample_ko: "속도 변화 지표를 오름차순으로 보면 링크 1060004100 이 직전 74.0→현재 35.0 km/h로 39 km/h 하락해 낙폭이 가장 컸다."
              sql: |
                -- :metric=speed_change, :dir=asc, :state=ALL, :n=20
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       flow_travel_time, previous_flow_travel_time, flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state <> 'no_prior_observation'
                  AND (:state = 'ALL' OR speed_change_state = :state)
                ORDER BY
                  CASE WHEN :dir='asc' THEN (CASE :metric WHEN 'travel_time_change' THEN flow_travel_time_change ELSE flow_speed_change END) END ASC,
                  CASE WHEN :dir='desc' THEN (CASE :metric WHEN 'travel_time_change' THEN flow_travel_time_change ELSE flow_speed_change END) END DESC,
                  link_id
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              param_defaults: { state: "ALL", dir: "asc", n: 20 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "relative_speed_change_ranking"
              question_ko: "절대 속도 변화가 아니라 직전 속도 대비 비율(%)로 가장 크게 느려지거나 빨라진 링크는 어디입니까?"
              axes: "모드(감속/가속) 스위치 — 직전 속도 대비 변화율 정렬"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "상대 감속 1위는 링크 1030000400 으로 직전 54.0→현재 18.0 km/h, 즉 -66.7%로 절대값이 큰 링크와는 다른 순위가 드러난다."
              sql: |
                -- :mode=slowdown, :n=20
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       round(100.0 * flow_speed_change / previous_flow_speed, 1) AS speed_change_pct, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE previous_flow_speed > 0
                  AND ((:mode='slowdown' AND flow_speed_change < 0) OR (:mode='speedup' AND flow_speed_change > 0))
                ORDER BY
                  CASE WHEN :mode='slowdown' THEN 100.0 * flow_speed_change / previous_flow_speed END ASC,
                  CASE WHEN :mode='speedup'  THEN 100.0 * flow_speed_change / previous_flow_speed END DESC,
                  link_id
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
            - pattern_id: "compound_flow_shift"
              question_ko: "속도 하락과 통행시간 증가가 동시에 나타난 혼잡 심화 링크(또는 그 반대의 소통 개선 링크)는 어디입니까?"
              axes: "모드(혼잡 심화/소통 개선) 스위치 — 두 지표 동시 이동 필터·통행시간 변화 정렬"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "혼잡 심화 1위 링크 1180031700 은 속도 15.8 km/h 하락과 통행시간 315초 증가가 동시에 나타나(현재 10.2 km/h) 정체 발생 신호가 가장 강했다."
              sql: |
                -- :mode=congestion, :n=20
                SELECT link_id, observed_at_kst, flow_speed, flow_speed_change, flow_travel_time,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE (:mode='congestion' AND flow_speed_change < 0 AND flow_travel_time_change > 0)
                   OR (:mode='relief'     AND flow_speed_change > 0 AND flow_travel_time_change < 0)
                ORDER BY
                  CASE WHEN :mode='congestion' THEN flow_travel_time_change END DESC,
                  CASE WHEN :mode='relief'     THEN flow_travel_time_change END ASC,
                  link_id
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
            - pattern_id: "speed_change_magnitude_distribution"
              question_ko: "직전 관측이 있는 링크들의 속도 변화가 급락·소폭·무변화·소폭 상승·급등 구간에 어떻게 분포합니까?"
              axes: "속도 변화 크기 버킷 분포 — 버킷별 링크 수"
              verified_rows: 0                # 실 D1 실측: [5] (스탬핑 대기)
              insight_sample_ko: "비교 가능한 222개 링크의 속도 변화 분포는 10 km/h 이상 급락 13개, 10 미만 하락 98개, 무변화 5개, 10 미만 상승 89개, 10 이상 급등 17개로, 소폭 변동에 크게 몰려 있다."
              sql: |
                SELECT
                  CASE
                    WHEN flow_speed_change <= -10 THEN '1_drop_ge_10'
                    WHEN flow_speed_change < 0   THEN '2_drop_lt_10'
                    WHEN flow_speed_change = 0   THEN '3_unchanged'
                    WHEN flow_speed_change < 10  THEN '4_rise_lt_10'
                    ELSE '5_rise_ge_10'
                  END AS speed_change_bucket,
                  count(*) AS link_count,
                  min(flow_speed_change) AS min_change,
                  max(flow_speed_change) AS max_change
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state <> 'no_prior_observation'
                GROUP BY speed_change_bucket
                ORDER BY speed_change_bucket
              requires: [select_columns, filter_set, aggregate, group_by, sort]
            - pattern_id: "significant_speed_change_links"
              question_ko: "속도가 지정한 기준(km/h) 이상으로 변한 링크는 상승·하락 방향을 가리지 않고 모두 몇 곳이며 어디입니까?"
              axes: "절대 속도 변화 임계값 필터 — 절대 변화 DESC"
              verified_rows: 0                # 실 D1 실측: [30, 12] (스탬핑 대기)
              insight_sample_ko: "속도가 10 km/h 이상 변한 링크는 30곳이며, 변화 폭이 가장 큰 링크 1190000500 은 직전 29.0→현재 75.0 km/h로 46 km/h 상승했다."
              sql: |
                -- :min_abs_change=10, :n=100
                SELECT link_id, observed_at_kst, flow_speed, previous_flow_speed, flow_speed_change,
                       flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE abs(flow_speed_change) >= :min_abs_change
                ORDER BY abs(flow_speed_change) DESC, link_id
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              param_defaults: { min_abs_change: 10, n: 100 }
            - pattern_id: "stale_comparison_interval"
              question_ko: "현재와 직전 관측 사이 간격이 지정한 분(minute) 이상으로 벌어져 변화값 해석에 주의가 필요한 링크는 어디입니까?"
              axes: "관측 간격 임계값 필터 — 간격(분) DESC"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "직전 관측이 60분 이상 지난 링크 중 1210005200 은 간격이 11173분(약 7.8일, 직전 2026-07-31 21:48 → 현재 2026-08-08 16:02)으로 가장 길어, 이 변화값은 직전 대비 즉각 변화로 보기 어렵다."
              sql: |
                -- :min_gap_minutes=60, :n=20
                SELECT link_id, observed_at_kst, previous_observed_at_kst,
                       cast((julianday(observed_at_kst) - julianday(previous_observed_at_kst)) * 24 * 60 as integer) AS gap_minutes,
                       flow_speed_change, flow_travel_time_change, speed_change_state
                FROM gold_traffic_flow_change_latest
                WHERE speed_change_state <> 'no_prior_observation'
                  AND (julianday(observed_at_kst) - julianday(previous_observed_at_kst)) * 24 * 60 >= :min_gap_minutes
                ORDER BY gap_minutes DESC, link_id
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { min_gap_minutes: 60, n: 20 }
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - flow_speed
              - flow_travel_time
              - flow_value_quality
              - observed_at_utc
              - observed_at_kst
              - previous_flow_speed
              - previous_flow_travel_time
              - previous_observed_at_kst
              - flow_speed_change
              - flow_travel_time_change
              - speed_change_state
    columns:
      - name: product_row_id
        description: link_id와 같은 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - unique:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: link_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: observed_at_kst
        description: 최신 교통 흐름 관측 KST 시각입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: observed_at_kst 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: speed_change_state
        description: 직전 관측 없음, 속도 비교 불가, 감소, 증가, 동일을 구분합니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - accepted_values:
              arguments:
                values: [no_prior_observation, speed_unavailable, speed_decreased, speed_increased, speed_unchanged]
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: speed_change_state 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: flow_speed
        description: 교통 흐름 속도 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
