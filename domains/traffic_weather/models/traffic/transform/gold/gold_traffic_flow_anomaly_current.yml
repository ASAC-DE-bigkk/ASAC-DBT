      - name: anomaly_direction
        description: 현재 속도의 기준 범위 대비 방향입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: true
            null_meaning: anomaly_direction 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: not_applicable
