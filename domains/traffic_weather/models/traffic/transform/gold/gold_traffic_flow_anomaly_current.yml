version: 2

models:
  - name: gold_traffic_flow_anomaly_current
    description: 링크별 최신 속도를 같은 KST 요일·시간대 이력 분포와 비교하고 표본 충분성을 함께 제공하는 공개 Gold 제품입니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: traffic_flow_anomaly_current
          display:
            title: 도로 링크별 교통 흐름 이상 징후
            summary: 도로 링크의 최신 속도를 같은 요일·시간대의 과거 관측과 비교해 평소와 다른 흐름을 보여줍니다.
            caveat: 과거 관측 표본이 부족하면 이상 여부가 낮은 신뢰도로 표시됩니다.
            use_cases: ["이상 정체 구간 탐지"]
          product_question: 지금 평소보다 느린 서울 도로 구간은 어디입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.list_flow_anomalies
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 평소보다 속도가 크게 달라진 링크를 알려주세요.
              - 현재 이상 링크의 기준선과 표본 충분성은 어떤가요?
              - 기준선이 없어 이상 여부를 판단할 수 없는 링크가 있나요?
          grain: link_id마다 한 행 — 최신 관측과 동일 요일·시간대 기준선 비교.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: observed_at_kst
          freshness_slo_minutes: 90
          shape: wide
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - flow_speed
              - flow_travel_time
              - flow_value_quality
              - observed_at_kst
              - collected_at_kst
              - kst_day_of_week
              - kst_hour
              - profile_observation_count
              - distinct_observation_date_count
              - speed_observation_count
              - p25_flow_speed
              - median_flow_speed
              - p75_flow_speed
              - profile_first_observed_at_kst
              - profile_last_observed_at_kst
              - baseline_state
              - speed_delta_from_median
              - speed_ratio_to_median
              - anomaly_direction
          reliability:
            sample_count_field: distinct_observation_date_count
            minimum_sample_count: 4
            insufficient_sample_policy: flag_degraded
          usage_patterns:
            - pattern_id: anomaly_for_link
              question_ko: 특정 도로 링크의 최신 속도는 같은 요일·시간대 기준선과 비교해 어떻습니까?
              axes: 링크 필터 — 최신 속도·중앙값·이상 방향 비교
              requires: [select_columns, filter_set]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :link_id='1080002600'
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, p25_flow_speed, p75_flow_speed,
                       speed_delta_from_median, speed_ratio_to_median, anomaly_direction, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE link_id = :link_id
            - pattern_id: anomalies_by_direction
              question_ko: 기준 범위보다 느리거나 빠른 링크는 무엇입니까?
              axes: 이상 방향 필터 — 속도 편차 절대값 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :anomaly_direction='below_typical_range', :n=20
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, speed_delta_from_median,
                       speed_ratio_to_median, anomaly_direction
                FROM gold_traffic_flow_anomaly_current
                WHERE anomaly_direction = :anomaly_direction
                ORDER BY abs(speed_delta_from_median) DESC
                LIMIT :n
            - pattern_id: representative_baseline_outliers
              question_ko: 표본이 충분한 링크 중 기준선에서 가장 크게 벗어난 곳은 어디입니까?
              axes: representative 기준선 필터 — 속도 편차 절대값 DESC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :n=20
                SELECT link_id, flow_speed, median_flow_speed, speed_delta_from_median, speed_ratio_to_median,
                       distinct_observation_date_count, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE baseline_state = 'representative'
                ORDER BY abs(speed_delta_from_median) DESC
                LIMIT :n
            - pattern_id: slowdown_from_baseline
              question_ko: 평소 중앙값보다 가장 느려진 링크는 어디입니까?
              axes: 음수 속도 편차 필터 — speed_delta_from_median ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, speed_delta_from_median,
                       speed_ratio_to_median, anomaly_direction
                FROM gold_traffic_flow_anomaly_current
                WHERE speed_delta_from_median < 0
                ORDER BY speed_delta_from_median ASC
                LIMIT :n
            - pattern_id: speedup_from_baseline
              question_ko: 평소 중앙값보다 가장 빨라진 링크는 어디입니까?
              axes: 양수 속도 편차 필터 — speed_delta_from_median DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :n=20
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, speed_delta_from_median,
                       speed_ratio_to_median, anomaly_direction
                FROM gold_traffic_flow_anomaly_current
                WHERE speed_delta_from_median > 0
                ORDER BY speed_delta_from_median DESC
                LIMIT :n
            - pattern_id: insufficient_history_baselines
              question_ko: 이력 표본이 부족해 현재 이상 여부를 판단할 수 없는 링크는 무엇입니까?
              axes: 기준선 상태 필터 — 이력 일수 ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :n=50
                SELECT link_id, observed_at_kst, flow_speed, distinct_observation_date_count,
                       profile_observation_count, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE baseline_state = 'insufficient_history'
                ORDER BY distinct_observation_date_count ASC, profile_observation_count ASC
                LIMIT :n
            - pattern_id: baseline_state_overview
              question_ko: 최신 링크 스냅샷에서 기준선 판정 상태별 링크 수는 얼마입니까?
              axes: 기준선 상태 집계 — 링크 수 DESC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: false
              verified_rows: 2
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                SELECT baseline_state, count(*) AS link_count
                FROM gold_traffic_flow_anomaly_current
                GROUP BY baseline_state
                ORDER BY link_count DESC, baseline_state
            - pattern_id: anomaly_observation_window
              question_ko: 특정 관측 시간 범위에서 기준선 대비 속도 편차가 큰 링크는 무엇입니까?
              axes: 관측 시각 범위 필터 — 절대 속도 편차 DESC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 50 }
              allow_empty: true
              verified_rows: 50
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "af13423e1c1f43ca8f71ba8720672738"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=50
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, speed_delta_from_median,
                       anomaly_direction, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE observed_at_kst >= :from_at AND observed_at_kst < :to_at
                ORDER BY abs(speed_delta_from_median) DESC
                LIMIT :n
            - pattern_id: "speed_profile_by_time_dim"
              question_ko: "현재 스냅샷을 관측 시각의 시(hour) 또는 요일 기준으로 묶으면 시간축별 평균 속도·통행시간은 어떻습니까?"
              axes: "관측 시간 차원 스위치(시/요일) 집계 — 시간 버킷 ASC"
              verified_rows: 0                # 실 D1 실측: [20, 6] (스탬핑 대기)
              insight_sample_ko: "관측 시각 시(hour) 기준으로 0시대에 마지막 관측된 링크는 2곳이며 평균 속도 63.0km/h, 평균 통행시간 78.0초로, 시간축별 현재 속도 분포를 한눈에 보여준다."
              sql: |
                -- :dim=hour
                SELECT CASE WHEN :dim = 'dow' THEN kst_day_of_week ELSE kst_hour END AS time_bucket,
                       count(*) AS link_count,
                       round(avg(flow_speed), 1) AS avg_flow_speed,
                       round(avg(flow_travel_time), 1) AS avg_flow_travel_time
                FROM gold_traffic_flow_anomaly_current
                GROUP BY CASE WHEN :dim = 'dow' THEN kst_day_of_week ELSE kst_hour END
                ORDER BY time_bucket ASC
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "snapshot_for_links"
              question_ko: "여러 도로 링크의 현재 속도와 평소 기준선 비교 스냅샷을 한 번에 보고 싶습니다."
              axes: "링크 다중 선택(배열 IN) — 링크 ID ASC"
              verified_rows: 0                # 실 D1 실측: [3, 2] (스탬핑 대기)
              insight_sample_ko: "링크 1050015000는 현재 13.2km/h로 평소 중앙값 13.8km/h보다 0.6km/h 낮으며(p25 12.8·p75 13.8, insufficient_history), 지정한 세 링크를 한 요청으로 비교 조회한다."
              sql: |
                -- :link_ids=["1110008800","1220031300","1050015000"]
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed, p25_flow_speed, p75_flow_speed,
                       round(flow_speed - median_flow_speed, 1) AS speed_vs_median, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE link_id IN (SELECT value FROM json_each(:link_ids))
                ORDER BY link_id
              requires: [select_columns, filter_set]
            - pattern_id: "outside_typical_band_links"
              question_ko: "현재 속도가 평소 사분위 범위(p25~p75) 밖으로 벗어난 링크는 어디입니까? 느린 쪽/빠른 쪽을 선택할 수 있습니다."
              axes: "IQR 밴드 이탈 방향 스위치(하단/상단) — 중앙값 대비 편차 정렬"
              verified_rows: 0                # 실 D1 실측: [20, 20] (스탬핑 대기)
              insight_sample_ko: "밴드 하단 이탈에서 링크 1130000400가 현재 47.0km/h로 평소 p25 65.0·중앙값 74.0을 크게 밑돌아 중앙값 대비 -27.0km/h로 가장 심하게 느리다."
              sql: |
                -- :band_side=below, :n=20
                SELECT link_id, observed_at_kst, flow_speed, p25_flow_speed, median_flow_speed, p75_flow_speed,
                       round(flow_speed - median_flow_speed, 1) AS speed_vs_median, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE median_flow_speed IS NOT NULL
                  AND ( (:band_side = 'below' AND flow_speed < p25_flow_speed)
                     OR (:band_side = 'above' AND flow_speed > p75_flow_speed) )
                ORDER BY CASE WHEN :band_side = 'below' THEN flow_speed - median_flow_speed END ASC,
                         CASE WHEN :band_side = 'above' THEN flow_speed - median_flow_speed END DESC
                LIMIT :n
              requires: [select_columns, filter_null, filter_range, sort]
              param_defaults: { n: 20 }
            - pattern_id: "relative_to_baseline_links"
              question_ko: "매칭 프로파일이 있는 링크 중 현재 속도가 평소 중앙값 대비 지정 폭 이상 느려지거나 빨라진 링크는 어디입니까?"
              axes: "중앙값 대비 방향 스위치(느림/빠름)·최소 편차 임계값 — 편차 정렬"
              verified_rows: 0                # 실 D1 실측: [20, 18] (스탬핑 대기)
              insight_sample_ko: "느려진 방향에서 링크 1130000400가 현재 47.0km/h로 평소 중앙값 74.0 대비 -27.0km/h(비율 0.635)로 가장 크게 둔화됐다. speed_delta_from_median이 아직 비어 있어도 중앙값에서 라이브로 산출한다."
              sql: |
                -- :direction=slower, :min_abs_delta=0, :n=20
                SELECT link_id, observed_at_kst, flow_speed, median_flow_speed,
                       round(flow_speed - median_flow_speed, 1) AS speed_delta,
                       round(flow_speed * 1.0 / median_flow_speed, 3) AS speed_ratio, baseline_state
                FROM gold_traffic_flow_anomaly_current
                WHERE median_flow_speed IS NOT NULL AND median_flow_speed > 0
                  AND ( (:direction = 'slower' AND median_flow_speed - flow_speed >= :min_abs_delta)
                     OR (:direction = 'faster' AND flow_speed - median_flow_speed >= :min_abs_delta) )
                ORDER BY CASE WHEN :direction = 'slower' THEN flow_speed - median_flow_speed END ASC,
                         CASE WHEN :direction = 'faster' THEN flow_speed - median_flow_speed END DESC
                LIMIT :n
              requires: [select_columns, filter_null, filter_range, sort]
              param_defaults: { min_abs_delta: 0, n: 20 }
            - pattern_id: "widest_typical_speed_band_links"
              question_ko: "과거 같은 요일·시간대 기준으로 평소 속도 변동폭(p75-p25)이 가장 큰, 즉 기준선 변동성이 큰 링크는 어디입니까?"
              axes: "평소 속도 밴드폭(p75-p25) 정렬 — 밴드폭 DESC"
              verified_rows: 0                # 실 D1 실측: [20, 5] (스탬핑 대기)
              insight_sample_ko: "링크 1120001700(금요일 18시)의 평소 속도 밴드폭이 33.0km/h(p25 58.0~p75 91.0)로 가장 넓어, 같은 시간대라도 속도가 크게 출렁여 기준선 신뢰도가 낮음을 시사한다."
              sql: |
                -- :n=20
                SELECT link_id, kst_day_of_week, kst_hour, p25_flow_speed, median_flow_speed, p75_flow_speed,
                       round(p75_flow_speed - p25_flow_speed, 1) AS typical_speed_band_width,
                       distinct_observation_date_count
                FROM gold_traffic_flow_anomaly_current
                WHERE p25_flow_speed IS NOT NULL
                ORDER BY p75_flow_speed - p25_flow_speed DESC, link_id
                LIMIT :n
              requires: [select_columns, filter_null, sort]
              param_defaults: { n: 20 }
            - pattern_id: "baseline_maturity_breakdown"
              question_ko: "최신 스냅샷에서 기준선 상태와 확보된 이력 일수(distinct_observation_date_count)별 링크 수 분포는 어떻습니까?"
              axes: "기준선 상태 × 이력 일수 교차 집계 — 상태·일수 ASC"
              verified_rows: 0                # 실 D1 실측: [3] (스탬핑 대기)
              insight_sample_ko: "insufficient_history 링크 139곳이 이력 1일만 확보(평균 프로파일 관측 1.89회)했고, no_matching_profile 145곳은 이력 0일이라, 대표성(representative) 기준선까지 이력 축적이 더 필요한 콜드스타트 상태임을 보여준다."
              sql: |
                SELECT baseline_state, distinct_observation_date_count,
                       count(*) AS link_count,
                       round(avg(profile_observation_count), 2) AS avg_profile_obs
                FROM gold_traffic_flow_anomaly_current
                GROUP BY baseline_state, distinct_observation_date_count
                ORDER BY baseline_state, distinct_observation_date_count
              requires: [select_columns, aggregate, group_by, sort]
    columns:
      - name: product_row_id
        description: link_id와 같은 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - unique:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: link_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: observed_at_kst
        description: 비교 대상 최신 KST 관측 시각입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: observed_at_kst 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: baseline_state
        description: 최신 속도 결측, 기준선 없음, 표본 부족, 기준선 속도 결측, 대표 가능을 구분합니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - accepted_values:
              arguments:
                values: [current_speed_unavailable, no_matching_profile, insufficient_history, baseline_speed_unavailable, representative]
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: baseline_state 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: flow_speed
        description: 교통 흐름 속도 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
