version: 2

models:
  - name: gold_traffic_flow_anomaly_current
    description: 링크별 최신 속도를 같은 KST 요일·시간대 이력 분포와 비교하고 표본 충분성을 함께 제공하는 공개 Gold 제품입니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: traffic_flow_anomaly_current
          product_question: 각 도로 링크의 최신 속도는 같은 요일·시간대의 평소 범위와 비교해 어떻습니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.list_flow_anomalies
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 평소보다 속도가 크게 달라진 링크를 알려주세요.
              - 현재 이상 링크의 기준선과 표본 충분성은 어떤가요?
              - 기준선이 없어 이상 여부를 판단할 수 없는 링크가 있나요?
          grain: link_id마다 한 행 — 최신 관측과 동일 요일·시간대 기준선 비교.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: retain_last_good
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: observed_at_kst
          freshness_slo_minutes: 90
          shape: wide
          source_evidence:
            - source_id: seoul_traffic_flow
              source_url: https://data.seoul.go.kr/dataList/OA-13291/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-06"
          public_projection:
            schema_version: "1.0.0"
            columns:
              - product_row_id
              - link_id
              - flow_speed
              - flow_travel_time
              - flow_value_quality
              - observed_at_kst
              - collected_at_kst
              - kst_day_of_week
              - kst_hour
              - profile_observation_count
              - distinct_observation_date_count
              - speed_observation_count
              - p25_flow_speed
              - median_flow_speed
              - p75_flow_speed
              - profile_first_observed_at_kst
              - profile_last_observed_at_kst
              - baseline_state
              - speed_delta_from_median
              - speed_ratio_to_median
              - anomaly_direction
          reliability:
            sample_count_field: distinct_observation_date_count
            minimum_sample_count: 4
            insufficient_sample_policy: flag_degraded
    columns:
      - name: product_row_id
        description: link_id와 같은 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - unique:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: link_id
        description: TOPIS 도로 링크 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: link_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: observed_at_kst
        description: 비교 대상 최신 KST 관측 시각입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: observed_at_kst 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: baseline_state
        description: 최신 속도 결측, 기준선 없음, 표본 부족, 기준선 속도 결측, 대표 가능을 구분합니다.
        data_type: varchar
        tests:
          - not_null:
              config: {tags: [traffic_gold_gate]}
          - accepted_values:
              arguments:
                values: [current_speed_unavailable, no_matching_profile, insufficient_history, baseline_speed_unavailable, representative]
              config: {tags: [traffic_gold_gate]}
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: baseline_state 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: flow_speed
        description: 교통 흐름 속도 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: flow_travel_time
        description: 교통 흐름 통행시간 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: flow_travel_time 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: second
      - name: flow_value_quality
        description: 속도·통행시간 값 존재 여부 품질 상태입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: flow_value_quality 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: collected_at_kst
        description: 원천 수집 시각을 서울 기준으로 변환한 값입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: collected_at_kst 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: kst_day_of_week
        description: 서울 기준 요일 번호입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: temporal_attribute
            nullable: false
            null_meaning: kst_day_of_week 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: day_of_week
      - name: kst_hour
        description: 서울 기준 시각의 시(hour) 값입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: temporal_attribute
            nullable: false
            null_meaning: kst_hour 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: hour_of_day
      - name: profile_observation_count
        description: 비교 기준 프로필 전체 관측 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: profile_observation_count 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: count
      - name: distinct_observation_date_count
        description: 비교 기준 프로필의 서로 다른 관측일 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: distinct_observation_date_count 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: count
      - name: speed_observation_count
        description: 속도 값이 존재하는 관측 수입니다.
        data_type: bigint
        config:
          meta:
            semantic_role: analytical_value
            nullable: false
            null_meaning: speed_observation_count 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: count
      - name: p25_flow_speed
        description: 비교 기준 속도 25분위 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: p25_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: median_flow_speed
        description: 비교 기준 속도 중앙값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: median_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: p75_flow_speed
        description: 비교 기준 속도 75분위 값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: p75_flow_speed 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: profile_first_observed_at_kst
        description: 비교 기준 프로필 첫 관측 서울 기준 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: profile_first_observed_at_kst 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: not_applicable
      - name: profile_last_observed_at_kst
        description: 비교 기준 프로필 마지막 관측 서울 기준 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: profile_last_observed_at_kst 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: not_applicable
      - name: speed_delta_from_median
        description: 현재 속도와 기준 중앙값의 차이입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: speed_delta_from_median 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: kilometer_per_hour
      - name: speed_ratio_to_median
        description: 현재 속도를 기준 중앙값으로 나눈 비율입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: speed_ratio_to_median 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: ratio
      - name: anomaly_direction
        description: 현재 속도의 기준 범위 대비 방향입니다.
        data_type: varchar
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: true
            null_meaning: anomaly_direction 값이 null이면 원천 결측, 조인 미매칭 또는 비교 기준 부족으로 해당 공개 지표를 산출할 수 없음을 뜻합니다.
            unit: not_applicable
