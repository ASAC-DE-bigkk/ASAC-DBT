version: 2
models:
  - name: gold_traffic_incident_x_weather_current_hourly
    description: 정본 Traffic 현재-시간 행정동 행에 no-hindsight KMA 예보 맥락을 left join으로 붙인 공개 Gold 모델입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        traffic_quality_product: false
        cross_domain_gold: true
        grain: admin_dong_code and hour_at, exactly preserving gold_traffic_incident_current_by_admin_dong_hourly.
        anchor_model: gold_traffic_incident_current_by_admin_dong_hourly
        context_domain: weather
        null_semantics: Missing weather context remains null and never rewrites Traffic incident_count or has_incident semantics.
        serving:
          enabled: true
          external: true
          product_id: traffic_incident_x_weather_current_hourly
          product_question: 돌발이 있는(또는 없는) 서울 행정동의 같은 평가 시간 KMA 예보 맥락은 무엇입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: traffic.get_incident_weather_context
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 현재 돌발이 있는 행정동의 같은 시각 날씨 예보는 무엇인가요?
              - 강남구 행정동의 돌발 현황과 날씨 맥락을 함께 알려주세요.
              - 날씨 맥락이 결측인 교통 돌발 행정동이 있나요?
          grain: admin_dong_code와 hour_at마다 한 행 — 행정동 현재 돌발·날씨 맥락 스냅샷.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: fail
          publication_trigger:
            schedule_cron: '12 * * * *'
          event_time: hour_at
          freshness_slo_minutes: 90
          shape: wide
          source_evidence:
            - source_id: seoul_topis_acc_info
              source_url: https://data.seoul.go.kr/dataList/OA-13315/A/1/datasetView.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 서울특별시
              rights_checked_at: "2026-08-04"
            - source_id: kma_vilage_fcst
              source_url: https://www.data.go.kr/data/15084084/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-04"
          quality_coverage:
            field: admin_dong_code
            expected_distinct_count: 426
            minimum_ratio: 1.0
          # D1/클라이언트 참조 구현이며 재게시 전 verified_* 실측·인사이트는 선언하지 않습니다.
          usage_patterns:
            - pattern_id: incident_weather_for_dong_hour
              question_ko: 특정 행정동·평가 시각의 교통 돌발 현황과 날씨 맥락은 무엇입니까?
              axes: 행정동·평가 시각 필터 — 돌발 현황과 no-hindsight 날씨 맥락
              requires: [select_columns]
              allow_empty: true
              sql: |
                -- :admin_dong_code, :hour_at
                SELECT admin_dong, gu, hour_at, incident_count, has_incident, quality_state, weather_category_coverage_count, tmp_value_num, pop_value_num, reh_value_num, wsd_value_num,
                       sky_qualitative_code, pty_qualitative_code, is_precipitating, status_observed_at, weather_latest_issued_at
                FROM gold_traffic_incident_x_weather_current_hourly
                WHERE admin_dong_code = :admin_dong_code AND hour_at = :hour_at
          public_projection:
            schema_version: "1.0.0"
            columns: [product_row_id, admin_dong_code, hour_at, admin_dong, gu_code, gu, admin_dong_revision_date, incident_count, has_incident, quality_state, snapshot_as_of_at, status_observed_at, published_at, weather_category_coverage_count, weather_latest_issued_at, weather_latest_collected_at, weather_latest_published_at, tmp_value_num, pop_value_num, reh_value_num, wsd_value_num, sky_qualitative_code, pty_qualitative_code, is_precipitating]
        public_gold:
          contract_version: "1.0"
          documentation_language: ko-KR
          owner: Traffic 데이터 제품 운영팀
          maturity: low
          visibility: published_producer
          contract_status: dev_pending
          exposure_status: none_no_live_consumer
          intended_consumer_types:
            - analyst
            - ai_catalog
            - cross_domain_dbt
            - rapidapi_serving
          cross_domain_usage_examples:
            - 행정동별 현재 돌발 상황과 같은 시각 날씨를 함께 조회하는 외부 API 응답에 사용합니다.
            - 생활인구·상권 분석에서 같은 행정동의 교통과 날씨 동시 맥락을 보조 변수로 사용합니다.
          product_question: 돌발이 있는(또는 없는) 서울 행정동의 같은 평가 시간 KMA 예보 맥락은 무엇입니까?
          row_meaning: 정본 행정동 한 곳과 하나의 평가 시간에 대한 현재 돌발정보와 no-hindsight 날씨 맥락 한 행입니다.
          grain: admin_dong_code와 hour_at 조합마다 정확히 한 행이며 gold_traffic_incident_current_by_admin_dong_hourly의 grain을 그대로 보존합니다.
          anchor_universe: gold_traffic_incident_current_by_admin_dong_hourly의 정본 행정동 전체 scaffold이며 날씨 맥락 유무와 무관하게 모든 행이 보존됩니다.
          usage_guidance: incident_count·has_incident·quality_state는 anchor 원본 값을 그대로 사용하고, 날씨 맥락은 weather_category_coverage_count로 커버리지를 먼저 확인한 뒤 사용합니다.
          do_not_use_for: 사고 발생시각별 이력이나 개인 위치 추정, 실시간 긴급 경보, 공식 기상특보 판정에 사용하지 않습니다.
          semantic_caveats: 날씨 맥락은 status_observed_at 이전에 issued_at이 확정된 Grid 이력에서 카테고리별 최신 예보를 선택합니다. 더 최신인 미래 발표분이 있어도 이전의 유효한 발표분으로 돌아가며, 결측은 Traffic incident_count·has_incident·quality_state를 절대 재작성하지 않습니다.
          primary_key: [product_row_id]
          column_order:
            - product_row_id
            - admin_dong_code
            - hour_at
            - admin_dong
            - gu_code
            - gu
            - admin_dong_revision_date
            - incident_count
            - has_incident
            - quality_state
            - snapshot_as_of_at
            - status_observed_at
            - published_at
            - snapshot_dag_run_id
            - source_id
            - weather_category_coverage_count
            - weather_latest_issued_at
            - weather_latest_collected_at
            - weather_latest_published_at
            - tmp_value_num
            - pop_value_num
            - reh_value_num
            - wsd_value_num
            - sky_qualitative_code
            - pty_qualitative_code
            - is_precipitating
          time:
            canonical_timezone: Asia/Seoul
            freshness_slo: Traffic anchor의 manifest freshness 계약(경고 15분·오류 30분)을 그대로 승계하며, 날씨 맥락은 no-hindsight 조건을 만족하는 최신 예보만 반영합니다.
            as_of_meaning: snapshot_as_of_at은 anchor의 complete publishable run 수집 시각이며, weather_latest_issued_at은 Traffic status_observed_at 이전에 확정된 날씨 맥락의 최신 발표 시각입니다.
            late_repair_policy: 이 모델은 매 실행마다 anchor와 날씨 맥락을 전체 재계산(full refresh)하므로 별도 late repair가 없습니다.
            roles:
              hour_at:
                time_role: evaluation_bucket
                timezone: Asia/Seoul
              snapshot_as_of_at:
                time_role: as_of
                timezone: Asia/Seoul
              status_observed_at:
                time_role: observation
                timezone: Asia/Seoul
              published_at:
                time_role: publication
                timezone: Asia/Seoul
              weather_latest_issued_at:
                time_role: context_issue
                timezone: Asia/Seoul
              weather_latest_collected_at:
                time_role: context_collection
                timezone: Asia/Seoul
              weather_latest_published_at:
                time_role: context_publication
                timezone: Asia/Seoul
          space:
            enabled: true
            source_chain: [iceberg_dev.common.bronze_admin_dong_master, asac_axes.dim_admin_dong]
            canonical_key: admin_dong_code
            revision_field: admin_dong_revision_date
            approved_revision_date: "2025-04-01"
            stamp_fields: [admin_dong_code, admin_dong, gu_code, gu, admin_dong_revision_date]
            candidate_key_explanation: admin_dong_code는 anchor(gold_traffic_incident_current_by_admin_dong_hourly)가 이미 dim_admin_dong과 exact join으로 확정한 stamp를 그대로 승계하는 후보 키이며, 이 모델은 canonical_admin_dong과의 방어적 join으로 그 확정을 재검증합니다.
            mapping_version_explanation: 공개 공간 stamp는 anchor가 이미 확정한 값을 승계하고, 날씨 맥락을 찾을 때만 weather_admin_dong_grid_bridge_v1을 고정해 행정동과 KMA Grid를 연결합니다.
            null_location_explanation: 정본에 결합되지 않는 admin_dong_code는 canonical_admin_dong과의 inner join에서 자연히 제외됩니다.
            fan_out_explanation: canonical_admin_dong은 admin_dong_code distinct 집합이며, 날씨 bridge·Grid 후보는 Traffic 제품 행과 카테고리별로 결정적 최신 1건을 선택한 뒤 집계합니다. 따라서 최종 anchor 행 증가는 허용하지 않으며 위반 시 게시 전 재조정 테스트가 실패시킵니다.
            reconciliation_tests: [assert_gold_traffic_incident_x_weather_current_hourly_admin_stamp_exact, assert_gold_traffic_incident_x_weather_current_hourly_admin_join_reconciles]
          metrics:
            incident_count:
              expression: anchor(gold_traffic_incident_current_by_admin_dong_hourly)에서 재집계 없이 그대로 승계
              unit: 건
              aggregation: passthrough
              denominator: not_applicable
              zero_meaning: complete 또는 complete_zero 근거가 확인된 평가 시각에 해당 행정동의 현재 사고가 없음을 뜻합니다.
              null_meaning: anchor의 snapshot 완전성이나 공간 정합성을 확인할 근거가 부족한 상태입니다.
              additive_axes:
                - admin_dong
              non_additive_axes:
                - time
          joins:
            weather_admin_dong_bridge:
              target: model.asac_seoul.bridge_weather_admin_dong_grid
              source_keys: [admin_dong_code]
              purpose: Traffic 정본 행정동을 고정된 weather_admin_dong_grid_bridge_v1의 KMA Grid 좌표로 변환합니다.
              cardinality: many_to_one
              fan_out_policy: 같은 행정동의 bridge 후보가 여러 개여도 최종 날씨 선택은 Traffic 제품 행과 카테고리별 결정적 winner 한 건으로 제한하며, 최종 anchor grain 증가는 허용하지 않습니다.
              reconciliation_test: assert_gold_traffic_incident_x_weather_current_hourly_context_reconciles
            weather_context:
              target: model.asac_seoul.silver_kma_vilage_fcst_grid
              source_keys: [admin_dong_code, hour_at, status_observed_at]
              purpose: 같은 행정동·시간의 KMA Grid 이력에서 status_observed_at 이전 카테고리별 최신 발표를 결합합니다.
              cardinality: one_to_one
              fan_out_policy: 공유 Weather winner-order key로 카테고리별 최신 유효 이력 1건만 남기고 traffic_product_row_id로 group by하므로 날씨 맥락은 최대 한 행이며, 위반 시 context 재조정 테스트가 실패합니다.
              reconciliation_test: assert_gold_traffic_incident_x_weather_current_hourly_context_reconciles
          quality:
            completeness_explanation: incident_count·has_incident·quality_state는 anchor의 completeness 판정을 그대로 승계하며, weather_category_coverage_count로 날씨 맥락 자체의 완전성을 별도로 확인합니다.
            freshness_explanation: status_observed_at(Traffic 관측)과 weather_latest_issued_at(날씨 발표)을 분리해 두 도메인의 신선도를 각각 해석합니다.
            coverage_explanation: 정본 행정동 전체 scaffold를 anchor에서 그대로 승계하므로 돌발 유무와 무관하게 426개 행정동이 항상 존재합니다. 날씨 맥락 커버리지는 weather_category_coverage_count(0~6)로 별도 확인합니다.
            state_fields:
              quality_state:
                allowed_values:
                  - complete
                  - complete_zero
                  - missing
                  - partial
                  - api_failure
                  - current_mismatch
                  - spatial_mapping_incomplete
                state_explanations:
                  complete: 사고가 한 건 이상이며 publishable과 row 및 current와 공간 정합성이 모두 확인된 상태입니다.
                  complete_zero: 정상 API 응답과 완전한 수집 근거에서 전체 현재 사고가 0건으로 확인된 상태입니다.
                  missing: 선택 run의 manifest 또는 필수 request audit 근거가 없는 상태입니다.
                  partial: publishable 상태나 예상 행과 객체 및 page 완전성 조건이 충족되지 않았거나 실패 종류를 명확히 구분할 수 없는 상태입니다.
                  api_failure: 명시적 non-2xx와 non-INFO-000 audit 또는 HttpProblemError 및 ParseError manifest 근거가 확인된 상태입니다.
                  current_mismatch: 기대한 Bronze 사고 식별자와 current Silver 사고 식별자의 양방향 차이가 있는 상태입니다.
                  spatial_mapping_incomplete: current 사고 하나 이상이 정본 행정동에 정확히 결합되지 않은 상태입니다.
          lineage:
            source_relations:
              - model.asac_seoul.bridge_weather_admin_dong_grid
              - model.asac_seoul.gold_traffic_incident_current_by_admin_dong_hourly
              - model.asac_seoul.silver_kma_vilage_fcst_grid
              - model.asac_axes.dim_admin_dong
            identifiers:
              as_of:
                columns:
                  - snapshot_as_of_at
              publication:
                columns:
                  - published_at
              raw:
                relation_level_only: true
                columns: []
              request:
                relation_level_only: true
                columns: []
              run:
                columns:
                  - snapshot_dag_run_id
          lifecycle:
            status: active
    columns:
      - name: product_row_id
        description: anchor(gold_traffic_incident_current_by_admin_dong_hourly)에서 그대로 승계한 결정적 제품 행 식별자입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
          - unique:
              config:
                tags: [traffic_gold_gate]
        config:
          meta: {semantic_role: primary_key, nullable: false, null_meaning: '제품 기본 키이므로 null을 허용하지 않습니다.', unit: not_applicable}
      - name: admin_dong_code
        description: anchor에서 승계한 행안부 10자리 정본 행정동 코드입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta: {semantic_role: join_key, nullable: false, null_meaning: 'natural grain과 정본 공간 조인에 필수이므로 null을 허용하지 않습니다.', unit: not_applicable}
      - name: hour_at
        description: anchor에서 승계한 서울 기준 snapshot 평가 시간입니다.
        data_type: timestamp(6)
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta: {semantic_role: timestamp, nullable: false, null_meaning: '모든 행정동 cell이 공유하는 평가 시간 grain이므로 null을 허용하지 않습니다.', time_role: evaluation_bucket, timezone: Asia/Seoul, unit: not_applicable}
      - name: admin_dong
        description: anchor에서 승계한 정본 행정동명입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta: {semantic_role: spatial_stamp, nullable: false, null_meaning: '정본 행정동명이 없는 후보는 공개하지 않습니다.', unit: not_applicable}
      - name: gu_code
        description: anchor에서 승계한 행안부 자치구 5자리 코드입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 자치구 코드가 없는 후보는 공개하지 않습니다.
            unit: not_applicable
      - name: gu
        description: anchor에서 승계한 자치구명입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 자치구명이 없는 후보는 공개하지 않습니다.
            unit: not_applicable
      - name: admin_dong_revision_date
        description: anchor에서 승계한 승인 공통 행정동 revision입니다.
        data_type: date
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: spatial_stamp
            nullable: false
            null_meaning: 정본 개정일이 없는 후보는 공개하지 않습니다.
            unit: not_applicable
      - name: incident_count
        description: anchor에서 그대로 승계한 현재 돌발 건수입니다. null은 anchor의 quality가 건수를 지지하지 못했다는 뜻이며 날씨 결합으로 재작성되지 않습니다.
        data_type: bigint
        config:
          meta:
            semantic_role: metric
            nullable: true
            unit: 건
            zero_meaning: complete 또는 complete_zero 근거가 확인된 평가 시각에 해당 행정동의 현재 사고가 없음을 뜻합니다.
            null_meaning: anchor의 snapshot 완전성이나 공간 정합성을 확인할 근거가 부족한 상태입니다.
            aggregation_behavior: passthrough
      - name: has_incident
        description: anchor에서 그대로 승계한 현재 돌발 존재 플래그입니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: anchor의 quality가 boolean을 지지하지 못한 상태입니다.
            unit: not_applicable
      - name: quality_state
        description: anchor에서 그대로 승계한 Traffic snapshot 품질 상태입니다.
        data_type: varchar
        tests:
          - not_null:
              config:
                tags: [traffic_gold_gate]
        config:
          meta:
            semantic_role: quality_state
            nullable: false
            null_meaning: 공개 제품은 quality_state 없는 행을 게시하지 않습니다.
            unit: not_applicable
      - name: snapshot_as_of_at
        description: anchor에서 승계한 complete publishable run의 최신 request audit 수집 시각입니다.
        data_type: timestamp(6)
        config:
          meta:
            semantic_role: timestamp
            nullable: true
            null_meaning: complete publishable 근거가 없는 상태입니다.
            time_role: as_of
            timezone: Asia/Seoul
            unit: not_applicable
      - name: status_observed_at
