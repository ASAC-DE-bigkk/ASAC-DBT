version: 2

sources:
  - name: traffic_bronze
    description: Seoul TOPIS traffic Bronze Iceberg tables loaded by ASAC-DAG.
    config:
      tags: ["ask_seoul_traffic_transform_source"]
    database: "{{ target.database }}"
    schema: "{{ env_var('ASK_SEOUL_SCHEMA', 'ask_seoul') }}"
    tables:
      - name: seoul_traffic_incident
        identifier: bronze_seoul_traffic_incident
        description: Seoul TOPIS AccInfo incident rows with raw lineage metadata.
        freshness: null
        columns:
          - name: request_id
            description: API request identifier for this parsed TOPIS record.
            tests:
              - not_null
          - name: source_id
            description: Fixed source identifier for TOPIS AccInfo incidents.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: request_params_json
            description: Redacted request parameters retained for reproducibility.
            tests:
              - not_null
          - name: acc_id
            description: Stable TOPIS accident identifier used as the Silver record key.
            tests:
              - not_null
          - name: start_index
            description: Inclusive TOPIS page start index.
            tests:
              - not_null
          - name: end_index
            description: Inclusive TOPIS page end index.
            tests:
              - not_null
          - name: occr_date
            description: Source incident occurrence date component (YYYYMMDD).
            tests:
              - not_null
          - name: occr_time
            description: Source incident occurrence time component; TOPIS may provide HHMM or HHMMSS.
            tests:
              - not_null
          - name: grs80tm_x
            description: TOPIS source GRS80 TM X coordinate, not WGS84 longitude.
          - name: grs80tm_y
            description: TOPIS source GRS80 TM Y coordinate, not WGS84 latitude.
          - name: result_code
            description: TOPIS response result code; INFO-000 rows are eligible for Silver.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message corresponding to result_code.
            tests:
              - not_null
          - name: raw_object_key
            description: R2 object key holding the raw TOPIS response.
            tests:
              - not_null
          - name: payload_hash
            description: Raw response content fingerprint.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded by the collection task.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported total incident count for the request.
            tests:
              - not_null
          - name: row_count
            description: Number of incident rows parsed from this response page.
            tests:
              - not_null
          - name: collected_at
            description: Bronze collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow collection run lineage.
            tests:
              - not_null
          - name: exp_clr_date
            description: TOPIS expected-clear date component; nullable when not supplied.
          - name: exp_clr_time
            description: TOPIS expected-clear time component; nullable when not supplied.
          - name: acc_type
            description: TOPIS incident type classification.
          - name: acc_dtype
            description: TOPIS detailed incident type classification.
          - name: link_id
            description: TOPIS road-link identifier; nullable source attribute.
          - name: acc_info
            description: TOPIS incident free-text information; nullable source attribute.
          - name: acc_road_code
            description: TOPIS road code; nullable source attribute.

      - name: collection_run_manifest
        identifier: bronze_collection_run_manifest
        description: Bronze DAG run-level publish gate written by ASAC-DAG.
        loaded_at_field: event_at
        freshness:
          warn_after:
            count: "{{ env_var('ASK_SEOUL_REPORT_TRAFFIC_FRESHNESS_WARN_MINUTES', '15') | int }}"
            period: minute
          error_after:
            count: "{{ env_var('ASK_SEOUL_REPORT_TRAFFIC_FRESHNESS_ERROR_MINUTES', '30') | int }}"
            period: minute
        columns:
          - name: source_id
            description: Source identifier for the publish-gate manifest.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow run whose Bronze output is being published.
            tests:
              - not_null
          - name: status
            description: Collection terminal status; Silver accepts SUCCESS only.
            tests:
              - not_null
          - name: is_publishable
            description: Explicit gate allowing downstream dbt consumption.
            tests:
              - not_null
          - name: event_at
            description: Manifest event timestamp used for freshness monitoring.
            tests:
              - not_null
          - name: expected_rows
            description: Source-reported incident row total expected for this collection run; zero is valid only with complete request-audit evidence.
          - name: actual_rows
            description: Incident rows verified in Bronze for this collection run.
          - name: expected_raw_objects
            description: Raw response objects expected from the resolved TOPIS page plan.
          - name: actual_raw_objects
            description: Raw response objects successfully landed for this collection run.
          - name: failure_reason
            description: Redacted failure class and task identifier for a failed collection event; it does not contain a structured failure stage.

      - name: seoul_traffic_incident_request_audit
        identifier: bronze_seoul_traffic_incident_request_audit
        description: Seoul TOPIS AccInfo request-level audit rows, including normal zero-row responses.
        freshness: null
        columns:
          - name: request_id
            description: API request identifier for the audited TOPIS page.
            tests:
              - not_null
          - name: source_id
            description: Fixed TOPIS source identifier.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_incident']
          - name: start_index
            description: Inclusive requested page start index.
            tests:
              - not_null
          - name: end_index
            description: Inclusive requested page end index.
            tests:
              - not_null
          - name: request_params_json
            description: Redacted request parameters retained for reproducibility.
            tests:
              - not_null
          - name: raw_object_key
            description: R2 object key holding the raw response.
            tests:
              - not_null
          - name: payload_hash
            description: Raw response content fingerprint.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded by collection.
            tests:
              - not_null
          - name: result_code
            description: TOPIS response result code.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported total count for the audited request.
            tests:
              - not_null
          - name: row_count
            description: Number of parsed rows for the audited request, including valid zero-row responses.
            tests:
              - not_null
          - name: collected_at
            description: Audit record collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow collection run lineage.
            tests:
              - not_null

      - name: seoul_traffic_flow
        identifier: bronze_seoul_traffic_flow
        description: Seoul TOPIS TrafficInfo per-link speed and travel-time rows with raw XML lineage metadata.
        freshness: null
        columns:
          - name: request_id
            description: Deterministic request identifier for a link within one flow snapshot.
            tests:
              - not_null
          - name: source_id
            description: Fixed source identifier for Seoul TrafficInfo flow rows.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_flow']
          - name: request_params_json
            description: Redacted request parameters including the requested link id.
            tests:
              - not_null
          - name: link_id
            description: TOPIS road-link identifier used to call TrafficInfo.
            tests:
              - not_null
          - name: prcs_spd
            description: TOPIS processed speed value before Silver casting.
          - name: prcs_trv_time
            description: TOPIS processed travel-time value before Silver casting.
          - name: raw_object_key
            description: R2 object key holding the original TrafficInfo JSON.
            tests:
              - not_null
          - name: payload_hash
            description: SHA-256 fingerprint of the original response.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded for the link request.
            tests:
              - not_null
          - name: result_code
            description: TOPIS response result code.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported response row count.
            tests:
              - not_null
          - name: row_count
            description: Number of parsed rows for this link response.
            tests:
              - not_null
          - name: collected_at
            description: Flow response collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow flow Bronze collection run lineage.
            tests:
              - not_null

      - name: seoul_traffic_flow_request_audit
        identifier: bronze_seoul_traffic_flow_request_audit
        description: Seoul TrafficInfo request-level audit rows, including valid no-data responses.
        freshness: null
        columns:
          - name: request_id
            description: Deterministic request identifier for a link within one flow snapshot.
            tests:
              - not_null
          - name: source_id
            description: Fixed source identifier for Seoul TrafficInfo flow requests.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['seoul_traffic_flow']
          - name: request_params_json
            description: Redacted request parameters including the requested link id.
            tests:
              - not_null
          - name: link_id
            description: Requested TOPIS road-link identifier.
            tests:
              - not_null
          - name: raw_object_key
            description: R2 object key holding the original response.
            tests:
              - not_null
          - name: payload_hash
            description: SHA-256 fingerprint of the original response.
            tests:
              - not_null
          - name: http_status
            description: HTTP status recorded for the link request.
            tests:
              - not_null
          - name: result_code
            description: TOPIS response result code.
            tests:
              - not_null
          - name: result_msg
            description: TOPIS response message.
            tests:
              - not_null
          - name: list_total_count
            description: TOPIS-reported response row count.
            tests:
              - not_null
          - name: row_count
            description: Number of parsed rows for this link response.
            tests:
              - not_null
          - name: collected_at
            description: Flow response collection timestamp.
            tests:
              - not_null
          - name: load_date
            description: KST ingestion partition date.
            tests:
              - not_null
          - name: dag_run_id
            description: Airflow flow Bronze collection run lineage.
            tests:
              - not_null

  - name: traffic_citydata_gold
    description: Seoul Citydata Gold tables consumed as cross-domain context by Traffic-owned marts.
    database: "{{ target.database }}"
    schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'citydata' if target.name == 'prod' else 'seoul_citydata') }}"
    tables:
      - name: gold_citydata_ppltn_by_time
        identifier: gold_citydata_ppltn_by_time
        description: Place-level Seoul Citydata population/crowding observations by event timestamp.
        freshness: null
        columns:
          - name: event_at
            description: Observation timestamp for the Citydata place crowding row.
            tests:
              - not_null
          - name: area_cd
            description: Seoul Citydata monitored place identifier.
            tests:
              - not_null
          - name: admin_dong_code
            description: Canonical admin-dong code assigned by the Citydata product.
          - name: avg_ppltn
            description: Average observed place population/crowding estimate for the monitored place.
          - name: collected_at
            description: Timestamp when the Citydata row was collected.
      - name: gold_citydata_place_latest
        identifier: gold_citydata_place_latest
        description: 장소별 최신 혼잡·결제·승하차·따릉이 상태를 신호별 관측시각과 함께 제공하는 Citydata Gold다.

  - name: traffic_culture_gold
    description: Culture 도메인의 게시 Gold를 Traffic 맥락 조인에 읽기 전용으로 사용한다.
    database: "{{ target.database }}"
    schema: culture
    tables:
      - name: gold_culture_activity_by_dong
        description: 행정동×일 문화활동 집계 Gold다.
      - name: gold_culture_event_schedule
        description: 행사 1행의 장소·기간·공간 품질을 제공하는 Culture 일정 Gold다.

  - name: traffic_transit_gold
    description: Transit 도메인의 행정동×시간 운영 상태 Gold를 Traffic 맥락 조인에 읽기 전용으로 사용한다.
    database: "{{ target.database }}"
    schema: transit
    tables:
      - name: gold_transit_dong_hourly
        description: 버스·지하철·주차 지표를 행정동×시간으로 제공하는 Transit Gold다.

  - name: traffic_commerce_gold
    description: Commerce 도메인의 행정동 사업체 Gold를 Traffic 노출 맥락 조인에 읽기 전용으로 사용한다.
    database: "{{ target.database }}"
    schema: commerce
    tables:
      - name: gold_license_dong_summary
        description: 행정동별 사업체 stock 요약 Gold다.
