selectors:
  - name: ask_seoul_traffic_transform_source
    description: Traffic Bronze source와 해당 source 계약 리소스를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_source, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_availability
    description: Traffic source availability singular test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_availability, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_asac_axes
    description: Traffic 변환이 준비하는 공통 asac_axes seed phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_asac_axes, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_asac_axes_contract
    description: Traffic 변환 전 공통 asac_axes seed 계약 phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_asac_axes_contract, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_common_admin
    description: Traffic 변환이 사용하는 canonical 행정동 model phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_common_admin, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_silver
    description: Traffic scheduled Silver model과 test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_silver, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_flow_silver_model
    description: Pinned Flow Bronze run을 materialize하는 Flow Silver model 하나만 선택한다.
    definition:
      intersection:
        - {method: fqn, value: silver_seoul_traffic_flow, indirect_selection: empty}
        - {method: resource_type, value: model}
  - name: ask_seoul_traffic_transform_flow_silver_tests
    description: Flow Silver model의 직접 계약 test만 선택한다.
    definition:
      intersection:
        - {method: fqn, value: "*silver_seoul_traffic_flow*", indirect_selection: empty}
        - {method: resource_type, value: test}
  - name: ask_seoul_traffic_transform_incident_silver
    description: Traffic Silver 실행 계약에서 Flow 전용 model과 test를 제외한다.
    definition:
      intersection:
        - {method: selector, value: ask_seoul_traffic_transform_silver}
        - exclude:
            - {method: fqn, value: "*silver_seoul_traffic_flow*", indirect_selection: empty}
  - name: ask_seoul_traffic_transform_gold
    description: Traffic scheduled Gold model과 test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_transform_gold, indirect_selection: cautious}
  - name: ask_seoul_traffic_transform_gold_models
    description: Traffic scheduled Gold model nodes only; tests are excluded for cadence-specific gates.
    definition:
      intersection:
        - method: tag
          value: ask_seoul_traffic_transform_gold
          indirect_selection: empty
        - method: resource_type
          value: model

  - name: ask_seoul_traffic_transform_gold_gate_tests
    description: Traffic Gold fast gate tests selected every transform run.
    definition:
      intersection:
        - method: tag
          value: ask_seoul_traffic_transform_gold
          indirect_selection: empty
        - method: tag
          value: traffic_gold_gate
          indirect_selection: empty
        - method: resource_type
          value: test

  - name: ask_seoul_traffic_transform_gold_hourly_tests
    description: Traffic Gold hourly assurance tests; includes gate tests plus hourly extensions.
    definition:
      union:
        - intersection:
            - method: tag
              value: ask_seoul_traffic_transform_gold
              indirect_selection: empty
            - method: tag
              value: traffic_gold_gate
              indirect_selection: empty
            - method: resource_type
              value: test
        - intersection:
            - method: tag
              value: ask_seoul_traffic_transform_gold
              indirect_selection: empty
            - method: tag
              value: traffic_gold_hourly_extension
              indirect_selection: empty
            - method: resource_type
              value: test

  - name: ask_seoul_traffic_transform_gold_full_tests
    description: Traffic Gold full assurance tests; includes gate, hourly extension, and daily extension tests.
    definition:
      union:
        - intersection:
            - method: tag
              value: ask_seoul_traffic_transform_gold
              indirect_selection: empty
            - method: tag
              value: traffic_gold_gate
              indirect_selection: empty
            - method: resource_type
              value: test
        - intersection:
            - method: tag
              value: ask_seoul_traffic_transform_gold
              indirect_selection: empty
            - method: tag
              value: traffic_gold_hourly_extension
              indirect_selection: empty
            - method: resource_type
              value: test
        - intersection:
            - method: tag
              value: ask_seoul_traffic_transform_gold
              indirect_selection: empty
            - method: tag
              value: traffic_gold_daily_extension
              indirect_selection: empty
            - method: resource_type
              value: test
  - name: ask_seoul_traffic_transform_flow_gold_scope
    description: Traffic Flow Gold models and their child tests that require compatible Flow Silver inputs.
    definition:
      union:
        - {method: fqn, value: gold_traffic_flow_link_latest, children: true}
        - {method: fqn, value: gold_traffic_flow_change_latest, children: true}
        - {method: fqn, value: gold_traffic_flow_congestion_hotspots_hourly, children: true}
        - {method: fqn, value: gold_traffic_flow_link_time_profile, children: true}
        - {method: fqn, value: gold_traffic_flow_anomaly_current, children: true}


  - name: ask_seoul_traffic_transform_gold_incident_models
    description: Traffic Gold model nodes excluding Flow Gold scope for incident-only trigger runs.
    definition:
      intersection:
        - {method: selector, value: ask_seoul_traffic_transform_gold_models}
        - exclude:
            - {method: selector, value: ask_seoul_traffic_transform_flow_gold_scope}

  - name: ask_seoul_traffic_transform_gold_incident_gate_tests
    description: Traffic Gold gate tests excluding Flow Gold scope for incident-only trigger runs.
    definition:
      intersection:
        - {method: selector, value: ask_seoul_traffic_transform_gold_gate_tests}
        - exclude:
            - {method: selector, value: ask_seoul_traffic_transform_flow_gold_scope}

  - name: ask_seoul_traffic_transform_gold_incident_hourly_tests
    description: Traffic Gold hourly tests excluding Flow Gold scope for incident-only trigger runs.
    definition:
      intersection:
        - {method: selector, value: ask_seoul_traffic_transform_gold_hourly_tests}
        - exclude:
            - {method: selector, value: ask_seoul_traffic_transform_flow_gold_scope}

  - name: ask_seoul_traffic_transform_gold_incident_full_tests
    description: Traffic Gold full tests excluding Flow Gold scope for incident-only trigger runs.
    definition:
      intersection:
        - {method: selector, value: ask_seoul_traffic_transform_gold_full_tests}
        - exclude:
            - {method: selector, value: ask_seoul_traffic_transform_flow_gold_scope}

  - name: ask_seoul_traffic_recovery_silver
    description: 고정 snapshot용 Traffic recovery Silver phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_recovery_silver, indirect_selection: cautious}
  - name: ask_seoul_traffic_recovery_metadata
    description: Traffic recovery 완료 metadata anchor phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_recovery_metadata, indirect_selection: cautious}
  - name: ask_seoul_traffic_recovery_gold
    description: 고정 snapshot용 Traffic recovery Gold phase를 선택한다.
    definition: {method: tag, value: ask_seoul_traffic_recovery_gold, indirect_selection: cautious}
  - name: traffic_transform_contract_gate
    description: Traffic Bronze source의 generic contract test만 선택한다.
    definition:
      intersection:
        - method: tag
          value: ask_seoul_traffic_transform_source
          indirect_selection: cautious
        - method: test_type
          value: generic

  - name: ask_seoul_traffic_transform_incident_preflight_contracts
    description: Traffic Incident availability와 Bronze generic contract를 한 번에 검증한다.
    definition:
      union:
        - {method: selector, value: ask_seoul_traffic_transform_availability}
        - {method: selector, value: traffic_transform_contract_gate}

  - name: ask_seoul_traffic_transform_incident_hot_build
    description: Pinned Incident Silver models and one compound publication receipt.
    definition:
      union:
        - {method: fqn, value: silver_seoul_traffic_incident, indirect_selection: empty}
        - {method: fqn, value: silver_seoul_traffic_incident_current, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_incident_silver_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_flow_hot_build
    description: Pinned Flow Silver model and one compound publication receipt.
    definition:
      union:
        - {method: fqn, value: silver_seoul_traffic_flow, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_flow_silver_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_core_gold_hot_build
    description: Pinned Traffic Incident anchor, five Traffic Flow D1 models, and the core receipt.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_congestion_hotspots_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_link_latest, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_change_latest, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_link_time_profile, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_anomaly_current, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_core_gold_serving_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_core_gold_incident_hot_build
    description: Pinned Traffic Incident anchor and core receipt without Flow branches.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_core_gold_serving_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_core_gold_bootstrap_hot_build
    description: First-run Traffic anchor plus the five Traffic Flow D1 models and core receipt.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_congestion_hotspots_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_link_latest, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_change_latest, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_link_time_profile, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_flow_anomaly_current, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_core_gold_serving_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_core_gold_incident_bootstrap_hot_build
    description: First-run Traffic anchor plus the core receipt without Flow branches.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_core_gold_serving_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_cross_domain_gold_hot_build
    description: Traffic anchor plus the separately published Traffic×Weather product and cross-domain receipt.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_incident_x_weather_current_hourly, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_gold_serving_publication_receipt, indirect_selection: empty}

  - name: ask_seoul_traffic_transform_cross_domain_gold_bootstrap_hot_build
    description: First-run Traffic anchor plus the separately published Traffic×Weather product and receipt.
    definition:
      union:
        - {method: fqn, value: gold_traffic_incident_current_by_admin_dong_hourly, indirect_selection: empty}
        - {method: fqn, value: gold_traffic_incident_x_weather_current_hourly, indirect_selection: empty}
        - {method: fqn, value: assert_traffic_gold_serving_publication_receipt, indirect_selection: empty}

  # Backward-compatible names now resolve to the Traffic Core path.  The
  # cross-domain path has explicit selectors above so it cannot block Core.
  - name: ask_seoul_traffic_transform_gold_hot_build
    description: Compatibility alias for the Traffic Core hot build.
    definition: {method: selector, value: ask_seoul_traffic_transform_core_gold_hot_build}

  - name: ask_seoul_traffic_transform_gold_incident_hot_build
    description: Compatibility alias for the Traffic Core incident hot build.
    definition: {method: selector, value: ask_seoul_traffic_transform_core_gold_incident_hot_build}

  - name: ask_seoul_traffic_transform_gold_bootstrap_hot_build
    description: Compatibility alias for the Traffic Core bootstrap hot build.
    definition: {method: selector, value: ask_seoul_traffic_transform_core_gold_bootstrap_hot_build}

  - name: ask_seoul_traffic_transform_gold_incident_bootstrap_hot_build
    description: Compatibility alias for the Traffic Core incident bootstrap hot build.
    definition: {method: selector, value: ask_seoul_traffic_transform_core_gold_incident_bootstrap_hot_build}

  - name: ask_seoul_traffic_daily_assurance
    description: Full Traffic contracts executed by the 09:00 reliability audit.
    definition:
      union:
        - {method: selector, value: ask_seoul_traffic_transform_incident_preflight_contracts}
        - {method: selector, value: ask_seoul_traffic_transform_silver}
        - {method: selector, value: ask_seoul_traffic_transform_flow_silver_tests}
        - {method: selector, value: ask_seoul_traffic_transform_common_admin}
        - {method: selector, value: ask_seoul_traffic_transform_asac_axes_contract}
        - {method: selector, value: ask_seoul_traffic_transform_gold_full_tests}

  - name: ask_seoul_weather_transform_source
    description: Weather Bronze source와 해당 source 계약 리소스를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_source, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_asac_axes
    description: Weather 변환이 준비하는 공통 asac_axes seed phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_asac_axes, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_common_admin
    description: Weather 변환이 사용하는 canonical 행정동 model phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_common_admin, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_place_mapping
    description: Weather place mapping seed phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_place_mapping, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_silver
    description: Weather scheduled Silver model과 test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_silver, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_gold
    description: Weather scheduled Gold summary model과 test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_gold, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_place_mart
    description: Weather place mart model과 test phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_transform_place_mart, indirect_selection: cautious}
  - name: ask_seoul_weather_transform_serving_place_mart
    description: Public Weather forecast-change용 bounded serving working set과 계약 test만 선택한다.
    definition:
      union:
        - {method: path, value: models/weather/transform/place_mart/dim_weather_place.sql, indirect_selection: cautious}
        - {method: path, value: models/weather/transform/place_mart/silver_weather_forecast_by_admin_dong_serving.sql, indirect_selection: cautious}
        - {method: path, value: tests/weather/transform/place_mart/assert_silver_weather_admin_dong_serving_grain_unique.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/transform/place_mart/assert_silver_weather_admin_dong_serving_retention_window.sql, indirect_selection: empty}
  - name: ask_seoul_weather_w1_inputs
    description: Weather W1 bridge가 요구하는 공통축과 Weather seed만 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w1_inputs, indirect_selection: cautious}
  - name: ask_seoul_weather_w1_bridge
    description: Weather W1 bridge model과 전용 singular test만 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w1_bridge, indirect_selection: cautious}
  - name: weather_transform_contract_gate
    description: Weather Bronze source의 generic contract test만 선택한다.
    definition:
      intersection:
        - method: tag
          value: ask_seoul_weather_transform_source
          indirect_selection: cautious
        - method: test_type
          value: generic

  - name: ask_seoul_weather_w2_recovery_window_models
    description: Weather W2 bounded recovery window model graph phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_window_models, indirect_selection: cautious}
  - name: ask_seoul_weather_w2_recovery_window_contracts
    description: Weather W2 bounded recovery window reconciliation contract phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_window_contracts, indirect_selection: cautious}
  - name: ask_seoul_weather_w2_recovery_winner_contract
    description: Weather W2 bounded recovery winner no-downgrade bucket contract phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_winner_contract, indirect_selection: cautious}
  - name: ask_seoul_weather_w2_recovery_lineage_contract
    description: Weather W2 bounded recovery bucket lineage contract phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_lineage_contract, indirect_selection: cautious}
  - name: ask_seoul_weather_w2_recovery_final_contract
    description: Weather W2 bounded recovery final publishability contract phase를 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_final_contract, indirect_selection: cautious}

  - name: ask_seoul_weather_w2_recovery_stage_window_contract
    description: 용신동 경량 recovery stage의 현재 6시간 창 계약 하나만 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/recovery/stage/assert_weather_w2_recovery_stage_window.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_recovery_stage_model
    description: 용신동 경량 recovery의 project-internal protected staging model만 선택한다.
    definition: {method: tag, value: ask_seoul_weather_w2_recovery_stage_model, indirect_selection: cautious}

  - name: ask_seoul_weather_w2_recovery_post_publish_bridge_contract
    description: 경량 recovery publish 직후 전 동 missing·extra·invalid bridge를 검증하는 FULL reconcile 하나만 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_bridge_exclusions_reconcile.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_recovery_stage_final
    description: 용신동 경량 recovery stage 전체 reconciliation 계약을 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/recovery/stage/assert_weather_w2_recovery_stage_final_reconciles.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_recovery_stage_winner
    description: 용신동 경량 recovery stage winner bucket 계약을 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/recovery/stage/assert_weather_w2_recovery_stage_no_downgrade.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_recovery_stage_lineage
    description: 용신동 경량 recovery stage lineage bucket 계약을 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/recovery/stage/assert_weather_w2_recovery_stage_lineage.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_canonical_models
    description: Weather canonical W2 observation, native grid, public Gold model만 선택한다.
    definition:
      union:
        - {method: path, value: models/weather/special/silver/silver_kma_vilage_fcst_observation.sql, indirect_selection: empty}
        - {method: path, value: models/weather/special/silver/silver_kma_vilage_fcst_grid.sql, indirect_selection: empty}
        - {method: path, value: models/weather/special/gold/gold_weather_forecast_by_admin_dong.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_canonical_contracts
    description: Weather canonical W2 public Gold의 매 snapshot 영향 grain 계약 test만 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_join_reconciles.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_revision_exact.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_stamp_exact.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_bridge_exclusions_reconcile.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_canonical_source_contract.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_grain_unique.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_latest_grid_record.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_product_row_id_reproducible.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/recovery/winner/assert_gold_weather_forecast_by_admin_dong_repair_no_downgrade.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/recovery/reconciliation/assert_gold_weather_forecast_by_admin_dong_repair_reconciles.sql, indirect_selection: empty}

  - name: ask_seoul_weather_w2_canonical_full_contracts
    description: Weather canonical W2 public Gold의 일일 전체 이력 계약 test만 선택한다.
    definition:
      union:
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_join_reconciles.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_revision_exact.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_admin_stamp_exact.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_bridge_exclusions_reconcile.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_canonical_source_contract.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_grain_unique.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_latest_grid_record_full.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/assert_gold_weather_forecast_by_admin_dong_product_row_id_reproducible.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/recovery/winner/assert_gold_weather_forecast_by_admin_dong_repair_no_downgrade.sql, indirect_selection: empty}
        - {method: path, value: tests/weather/special/recovery/reconciliation/assert_gold_weather_forecast_by_admin_dong_repair_reconciles.sql, indirect_selection: empty}
