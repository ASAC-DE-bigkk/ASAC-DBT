            - pattern_id: "frozen_cells_zero_new"
              d1_table: d1_geo_grid_overview
              question_ko: "규모(:min_active 이상)가 있는데 최근 1년 신규 개업이 0건인 격자×대분류 셀은 어디인가? (:major='ALL' 또는 특정 대분류)"
              axes: "grid×major 셀 단면 — 비율 asc(stagnant_grids_new_ratio, 격자 합산)와 달리 '정확히 0'인 셀을 대분류 단위로 짚음"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "활성 30개 이상인데 신규 개업 0건인 최대 셀은 (37.575, 127.0)의 environment로, 활성 100개가 전부 기존 업소다."
              sql: |
