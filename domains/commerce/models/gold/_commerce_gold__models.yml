        description: 중분류 한글
  - name: gold_license_geo_grid
    description: 상권 밀집 히트맵 — 좌표 0.005도(약 500m) 격자 × 업종 영업 밀도·최근 신규. 지도 핫스팟 질의(좌표 84%만).
