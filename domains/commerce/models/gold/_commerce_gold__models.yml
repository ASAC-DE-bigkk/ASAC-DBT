              axes: "반전쌍 B의 역방향: growth-hotspots 와 정렬 반전(desc↔asc) = 관점 반전(뜨는↔정착)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "격자(37.460, 127.035)는 280곳 중 신규 1.4%뿐, 잠실 인근(37.495, 127.11)은 961곳 규모인데 신규 2.2% — 대형이지만 저회전 상권."
              sql: |
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
