              requires: [select_columns, sort, filter_range]
              param_defaults: { status_code: "ALL", n: 10 }
            - pattern_id: "dataset_keyword_search"
              question_ko: "업종 코드(dataset)를 모를 때 한글 키워드(:kw)로 데이터셋을 찾고 진행중 체류 요약까지 한 번에 보려면? (탐색/발견 패턴)"
              axes: "룩업: dataset_ko/dataset LIKE '%:kw%' → 업종별 세그먼트 합·가중평균 경과일, 규모 내림차순"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "'음식점' 키워드로 4개 데이터셋이 잡히고, 최대는 서울시 일반음식점(진행중 535,953 세그먼트, 가중평균 경과 160.6일)이다."
              sql: |
                -- :kw='음식점', :n=20
                SELECT dataset, dataset_ko, category_ko,
                       SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                  AND (dataset_ko LIKE '%' || :kw || '%' OR dataset LIKE '%' || :kw || '%')
                GROUP BY dataset
                ORDER BY segments DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 20 }
            - pattern_id: "major_top_dataset_window"
              question_ko: "대분류별로 특정 상태(:status_code)에 가장 오래 머무는 대표 업종 top-:top_n 은? (그룹별 1위 — 전체 랭킹은 한 분야가 독식할 수 있음)"
              axes: "그룹별 랭킹: major_ko 파티션 → avg_days DESC ROW_NUMBER ≤ :top_n | 단면: :status_code·진행중·표본 :min_n 이상"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "폐업 상태(표본 100+)의 문화 대분류 대표는 서울시 게임물배급업으로 평균 경과 207.8일(734 세그먼트)이다."
              sql: |
                -- :status_code='03', :min_n=100, :top_n=1
                WITH ranked AS (
                  SELECT major_ko, dataset_ko, n_segments, avg_days, p90_days,
                         ROW_NUMBER() OVER (PARTITION BY major_ko ORDER BY avg_days DESC) AS rn
                  FROM d1_status_duration
                  WHERE status_code = :status_code AND is_ongoing = 1 AND n_segments >= :min_n
                )
                SELECT major_ko, dataset_ko, n_segments, avg_days, p90_days
                FROM ranked
                WHERE rn <= :top_n
                ORDER BY major_ko, rn
              requires: [select_columns, sort, filter_range, window, subquery]
              param_defaults: { min_n: 100, top_n: 1 }
            - pattern_id: "duration_band_distribution"
              question_ko: "상태 체류 경과일은 어느 대역(30일 미만/30~90/90~180/180일 이상)에 몰려 있나? (분포 형태 — 평균 한 점이 아니라 히스토그램)"
              axes: "분포: avg_days 4개 대역 버킷 → 셀 수·세그먼트 수 | 단면: :status_code(센티널 ALL) × :is_ongoing"
              verified_rows: 3
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "진행중 폐업 상태는 3개 대역에 걸치며, 30~90일 대역에 7개 업종 셀·39,360 세그먼트가 있다."
              sql: |
                -- :status_code='03', :is_ongoing=1
                SELECT CASE
                         WHEN avg_days < 30 THEN 'a_30일미만'
                         WHEN avg_days < 90 THEN 'b_30_90일'
                         WHEN avg_days < 180 THEN 'c_90_180일'
                         ELSE 'd_180일이상'
                       END AS band,
                       COUNT(*) AS cells,
                       SUM(n_segments) AS segments
                FROM d1_status_duration
                WHERE is_ongoing = :is_ongoing
                  AND (:status_code = 'ALL' OR status_code = :status_code)
                GROUP BY band
                ORDER BY band
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { status_code: "ALL" }
            - pattern_id: "flex_duration_ranking"
              question_ko: "상태(:status_code)·중분류(:category, 'ALL'=전체) 범위에서 지표(:metric ∈ {avg,p50,p90,max})와 방향(:dir ∈ {asc,desc})을 골라 업종 체류 랭킹을 보려면? (고정 랭킹 3종의 파라미터 일반화)"
              axes: "랭킹: 업종(dataset) → 지표 스위치×정렬 스위치 | 단면: 진행중·:status_code·:category(센티널 ALL)·표본 :min_n 이상"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "폐업·진행중·표본 30+ 조건의 p90 내림차순 1위는 서울시 환경측정대행업(p90 235일, 평균 188.5일, 78 세그먼트)이다."
              sql: |
                -- :status_code='03', :category='ALL', :metric='p90', :dir='desc', :min_n=30, :n=10
                SELECT dataset_ko, category_ko, status_group, n_segments, avg_days, p50_days, p90_days, max_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                  AND status_code = :status_code
                  AND (:category = 'ALL' OR category = :category)
                  AND n_segments >= :min_n
                ORDER BY
                  CASE WHEN :dir = 'asc' THEN
                    CASE :metric WHEN 'avg' THEN avg_days WHEN 'p50' THEN p50_days WHEN 'p90' THEN p90_days ELSE max_days END
                  END ASC,
                  CASE WHEN :dir = 'desc' THEN
                    CASE :metric WHEN 'avg' THEN avg_days WHEN 'p50' THEN p50_days WHEN 'p90' THEN p90_days ELSE max_days END
                  END DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { category: "ALL", min_n: 30, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc], metric: [avg, p50, p90, max] }
          contract_version: v1
          product_question: 인허가 상태에 얼마나 머무나?
          grain: dataset×상태×진행중
          primary_key: [dataset, status_code, is_ongoing]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [dataset, status_code, is_ongoing]
    columns:
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류.
      - name: status_code
        data_type: varchar
        description: 상태코드 2자리 정규화 — 01영업/02휴업/03폐업/04취소·말소/05제외·전출/06기타.
        tests: [not_null]
      - name: status_group
        data_type: varchar
        description: 상태군 한글 라벨(status_code 그룹핑).
      - name: is_ongoing
        data_type: boolean
        description: 진행중 세그먼트 여부(true=아직 종료 안 된 현재 상태).
        tests: [not_null]              # PK 근거(#478)
      - name: n_segments
        data_type: bigint
        description: 집계 세그먼트 수(표본). 30 미만은 저표본(회색 처리 권장).
      - name: avg_days
        data_type: double
        description: 평균 지속 일수.
      - name: p50_days
        data_type: bigint
        description: 중앙값 지속 일수(approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 지속 일수(approx_percentile).
      - name: max_days
        data_type: bigint
        description: 최대 지속 일수.
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_transition
    description: 휴업 다음은 재개? 폐업? — 상태 전이 매트릭스(from→to) × 업종. 씨앗 지표(이력 축적에 따라 성장).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_status_transition
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_status_transition   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 인허가 상태 전이 경로
            summary: 업소가 어떤 상태에서 어떤 상태로 옮겨가는지(영업에서 휴업, 휴업에서 폐업 등) 업종별 전이 건수를 표로 만들었습니다.
            caveat: 이력이 쌓이는 중인 씨앗 지표라 절대 건수보다 상대 비중으로 읽어야 합니다.
            use_cases:
              - 휴업의 결말 분석
              - 폐업 선행 신호 탐색
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rank_transition_paths"
              question_ko: "서울 인허가 업소의 상태 전이는 어떤 경로가 가장 많은가?"
              axes: "랭킹 — 행=전이경로(from_group→to_group), 값=건수·전체 구성비"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "영업→폐업이 3,580건(79.4%)으로 압도적 1위, 영업→제외/전출 695건(15.4%), 영업→취소/말소 165건(3.7%) 순. 휴업→영업(재개)은 14건(0.3%)에 불과해 관측된 전이의 대부분이 '퇴장' 방향."
              sql: |
                SELECT from_group || '→' || to_group AS path, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/(SELECT SUM(transitions) FROM d1_status_transition),1) AS pct FROM d1_status_transition GROUP BY 1 ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "rank_datasets_by_path"
              question_ko: "특정 전이 경로(예: 영업→폐업)가 가장 많이 발생한 업종은 어디인가?"
              axes: ":param 단면(:from_status,:to_status) + 랭킹 — 행=dataset"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:from_status='01', :to_status='03' 검증) 영업→폐업은 일반음식점 783건 > 즉석판매제조가공업 604건 > 통신판매업 511건 > 휴게음식점 454건 순 — 식품업이 상위권 대부분을 차지."
              sql: |
                SELECT dataset_ko, category_ko, transitions FROM d1_status_transition WHERE from_status = :from_status AND to_status = :to_status ORDER BY transitions DESC LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "from_slice_destinations"
              question_ko: "특정 상태(예: 휴업)에서 다음에 어디로 가는가 — 재개인가 폐업인가?"
              axes: "축반전쌍 A-1 — from 고정 단면(:from_status), 행=행선지(to_group)"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:from_status='02' 검증) 휴업 이후는 폐업 16건(51.6%) vs 재개 14건(45.2%)로 거의 반반의 갈림길, 제외/전출 1건(3.2%). 단 총 31건 저표본(<30 기준선 근처)이라 방향성 참고용."
              sql: |
                SELECT to_group, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/SUM(SUM(transitions)) OVER (),1) AS pct FROM d1_status_transition WHERE from_status = :from_status GROUP BY to_group ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "to_slice_origins"
              question_ko: "특정 상태(예: 폐업)로는 어떤 상태에서 유입되는가?"
              axes: "축반전쌍 A-2 — to 고정 단면(:to_status), 행=출발지(from_group). A-1과 방향 반전"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:to_status='03' 검증) 폐업 유입의 99.5%(3,580건)가 영업에서 직행. 휴업을 거친 폐업은 16건(0.4%)뿐 — 서울 인허가 데이터에서 '휴업 후 폐업' 경로는 사실상 드물고, 폐업은 영업 상태에서 곧바로 발생."
              sql: |
                SELECT from_group, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/SUM(SUM(transitions)) OVER (),1) AS pct FROM d1_status_transition WHERE to_status = :to_status GROUP BY from_group ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "category_destination_mix"
              question_ko: "중분류(업종군)별로 전이의 종착지 구성은 어떻게 다른가 — 폐업행 비중은?"
              axes: "축반전쌍 B-1 — 행=category, 값=행선지(폐업/재개) 구성비"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "식품은 전이 2,314건 중 99.8%(2,310건)가 폐업행인 반면, 산업은 1,323건 중 폐업행이 47.5%(628건)뿐 — 산업(통신판매업 등)은 제외/전출·취소가 대체 퇴장 경로. 의료 82.2%, 문화 44.3%로 업종군 간 격차가 큼."
              sql: |
                SELECT category_ko, SUM(transitions) AS total, SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END) AS to_closure, SUM(CASE WHEN to_status='01' THEN transitions ELSE 0 END) AS to_reopen, ROUND(100.0*SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END)/SUM(transitions),1) AS closure_pct FROM d1_status_transition GROUP BY category_ko ORDER BY total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "destination_category_leaders"
              question_ko: "각 종착 상태(폐업·제외/전출·취소 등)별로 어떤 업종군이 주도하는가?"
              axes: "축반전쌍 B-2 — 행=행선지(to_group), 값=상위 3개 category. B-1과 축 반전"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "폐업의 1위는 식품(2,310건)이지만, 제외/전출(525건)·취소/말소(148건)의 1위는 모두 산업 — 같은 '퇴장'이라도 식품은 폐업 신고로, 산업(통신판매업)은 행정적 제외·취소로 나가는 구조가 뚜렷."
              sql: |
                SELECT to_group, category_ko, transitions FROM (SELECT to_group, category_ko, SUM(transitions) AS transitions, ROW_NUMBER() OVER (PARTITION BY to_group ORDER BY SUM(transitions) DESC) AS rn FROM d1_status_transition GROUP BY to_group, category_ko) t WHERE rn <= 3 ORDER BY to_group, transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window, filter_range]
            - pattern_id: "cross_major_destination"
              question_ko: "대분류 × 종착 상태 교차표 — 분야별 퇴장 방식의 프로파일은?"
              axes: "두 축 교차 — 행=major_ko, 열=to_group 피벗(CASE), 값=건수"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "보건은 2,928건 중 폐업 2,847건(97.2%)으로 폐업 단일 경로에 집중, 산업은 1,323건이 폐업 628·제외/전출 525·취소 148로 3분산. 문화는 제외/전출(115)이 폐업(105)을 앞서는 유일한 대분류."
              sql: |
                SELECT major_ko, SUM(CASE WHEN to_group='영업' THEN transitions ELSE 0 END) AS reopen, SUM(CASE WHEN to_group='휴업' THEN transitions ELSE 0 END) AS suspend, SUM(CASE WHEN to_group='폐업' THEN transitions ELSE 0 END) AS close, SUM(CASE WHEN to_group='취소/말소' THEN transitions ELSE 0 END) AS cancel, SUM(CASE WHEN to_group='제외/전출' THEN transitions ELSE 0 END) AS moveout, SUM(transitions) AS total FROM d1_status_transition GROUP BY major_ko ORDER BY total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "closure_share_by_dataset"
              question_ko: "전이가 충분히 관측된 업종 중 폐업행 비중이 높은/낮은 곳은?"
              axes: "랭킹(저표본 컷 HAVING>=30) — 행=dataset, 값=폐업행 구성비"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "표본 30건 이상 업종 중 즉석판매제조가공업(604건)·미용업(176건)·건강기능식품일반판매업(334건) 등 7개는 폐업행 100%. 반면 담배소매업은 81.2%(56/69)로 최저권 — 취소/말소 등 행정 경로 비중이 상대적으로 큼."
              sql: |
                SELECT dataset_ko, SUM(transitions) AS total, SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END) AS closures, ROUND(100.0*SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END)/SUM(transitions),1) AS closure_pct FROM d1_status_transition GROUP BY dataset_ko HAVING SUM(transitions) >= 30 ORDER BY closure_pct DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "dataset_transition_matrix"
              question_ko: "특정 업종(데이터셋) 하나의 전이 매트릭스 전체는 어떤 모양인가?"
              axes: ":param 단면(:dataset short 코드) — 행=from→to 조합 전체"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:dataset='mail_order_sale' 검증) 통신판매업은 제외/전출 515건 > 폐업 511건 > 취소/말소 109건 — 폐업 신고보다 행정적 이탈이 절반 이상. 휴업→폐업 10건 vs 휴업→재개 6건으로 휴업 후에도 폐업 우세. 78개 데이터셋 중 전이 경로가 가장 다양한 업종(10개 경로)."
              sql: |
                SELECT from_group, to_group, transitions FROM d1_status_transition WHERE dataset = :dataset ORDER BY transitions DESC
              requires: [select_columns, sort]
            - pattern_id: "inv_reopen_paths"
              question_ko: "영업으로 복귀(재개)하는 경로는 어디서 오나? (퇴장 관점의 반전)"
              axes: "전이 랭킹 — to_status='01'(재개) 관점(폐업 퇴장 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "재개(→영업) 경로는 휴업에서 오는 통신판매업 6건이 최다 — 퇴장 경로(수천 건) 대비 극히 희소."
              sql: |
                SELECT from_group, dataset_ko, transitions
                FROM d1_status_transition WHERE to_status = '01'
                ORDER BY transitions DESC LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "inv_rarest_paths"
              question_ko: "가장 드물게 관측되는 전이 경로는? (최다 경로 랭킹의 반전)"
              axes: "전이경로 랭킹 — 건수 ASC(rank_transition_paths 의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "가장 희귀한 경로는 취소/말소→폐업 1건 — 행정 말소 후 폐업 신고가 겹친 예외 사례."
              sql: |
                SELECT from_group || '→' || to_group AS path, SUM(transitions) AS transitions
                FROM d1_status_transition GROUP BY path ORDER BY transitions ASC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "x_closure_path_vs_lifespan"
              question_ko: "상태 전이에서 폐업행 비중이 높은 업종은 실제 수명도 짧은가 — 퇴장 경로 구성(전이 관점)과 수명 분포(기간 관점)의 업종 결합"
              axes: "업종(dataset) 랭킹 — status_transition(전이 전체 대비 폐업행 구성비) ⋈ lifespan(가중평균 수명·조기폐업률, 구 합산) on dataset, 1:1"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "폐업행 전이 비중 1위는 동물약국(전이 32건 전부 폐업행, 100%)인데 수명 쪽은 다르다 — 폐업 1,907건의 가중평균 수명 1,274일, 조기폐업률 19.5%로 '전이는 전부 폐업으로 가지만 버티는 기간은 3년 반'인 업종이다. 두 지표가 갈라지는 업종을 골라내는 게 이 패턴의 용도다."
              sql: |
                -- :min_transitions=10, :min_closed=100, :n=10
                WITH tr AS (
                  SELECT dataset, MAX(dataset_ko) AS dataset_ko, SUM(transitions) AS total_transitions,
                         100.0*SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END)/SUM(transitions) AS closure_share_pct
                  FROM d1_status_transition GROUP BY dataset
                ), lf AS (
                  SELECT dataset, SUM(n_closed) AS n_closed,
                         ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w,
                         ROUND(100.0*SUM(closed_within_1y)/SUM(n_closed),1) AS early_close_pct
                  FROM d1_lifespan GROUP BY dataset
                )
                SELECT t.dataset_ko, t.total_transitions, ROUND(t.closure_share_pct,1) AS closure_share_pct,
                       l.n_closed, l.avg_days_w, l.early_close_pct
                FROM tr t JOIN lf l ON l.dataset = t.dataset
                WHERE t.total_transitions >= :min_transitions AND l.n_closed >= :min_closed
                ORDER BY t.closure_share_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
              param_defaults: { min_transitions: 10, min_closed: 100, n: 10 }
            - pattern_id: "scope_path_matrix"
              question_ko: "특정 대분류 또는 중분류(:dim ∈ {major, category}, :code) 안에서 상태 전이 경로 구성은 어떤 모양인가?"
              axes: "차원 스위치 단면 + 랭킹/비율 — 행=전이경로(from_group→to_group), 값=건수·범위 내 구성비. dataset_transition_matrix 의 상위 스코프(major/category) 일반화"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "식품(food) 업종군의 전이는 영업→폐업이 3,143건으로 범위 내 99.9%를 차지한다."
              sql: |
                -- :dim='category', :code='food', :n=25
                SELECT from_group || '→' || to_group AS path,
                       SUM(transitions) AS transitions,
                       ROUND(100.0 * SUM(transitions) / SUM(SUM(transitions)) OVER (), 1) AS pct
                FROM d1_status_transition
                WHERE CASE :dim WHEN 'major' THEN major WHEN 'category' THEN category END = :code
                GROUP BY path
                ORDER BY transitions DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, window]
              param_defaults: { n: 25 }
              param_enum: { dim: [major, category] }
            - pattern_id: "flow_share_rank"
              question_ko: "특정 출발 상태군(:from_group, 'ALL'=전체)에서 특정 종착 상태군(:to_group)으로 가는 비중이 높은/낮은(:dir) 업종군·업종(:dim ∈ {category, dataset})은 어디인가? (표본 :min_total 건 이상만)"
              axes: "랭킹/비율 — 행=:dim 값, 값=조건부 전이 비중(share_pct). closure_share_by_dataset(폐업행·dataset·HAVING 30·DESC 고정)의 파라미터 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "영업발 전이 30건 이상 업종 중 폐업행 비중 1위는 서울시 건강기능식품유통전문판매업 인허가 정보로, 33건 전부(100.0%)가 폐업으로 갔다."
              sql: |
                -- :dim='dataset', :from_group='영업', :to_group='폐업', :min_total=30, :dir='desc', :n=10
                SELECT CASE :dim WHEN 'category' THEN category_ko WHEN 'dataset' THEN dataset_ko END AS dim_value,
                       SUM(transitions) AS total,
                       SUM(CASE WHEN to_group = :to_group THEN transitions ELSE 0 END) AS to_target,
                       ROUND(100.0 * SUM(CASE WHEN to_group = :to_group THEN transitions ELSE 0 END) / SUM(transitions), 1) AS share_pct
                FROM d1_status_transition
                WHERE (:from_group = 'ALL' OR from_group = :from_group)
                GROUP BY dim_value
                HAVING SUM(transitions) >= :min_total
                ORDER BY CASE WHEN :dir = 'asc' THEN share_pct END ASC,
                         CASE WHEN :dir = 'desc' THEN share_pct END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { from_group: "ALL", min_total: 30, dir: "desc", n: 10 }
              param_enum: { dim: [category, dataset], dir: [asc, desc] }
            - pattern_id: "group_net_flow"
              question_ko: "각 상태군은 전이를 통해 순유입인가 순유출인가 — 유입·유출·순변화량은? (:major='ALL' 또는 특정 대분류)"
              axes: "교차/수지 — 행=상태군, 값=유출(from 측 합)·유입(to 측 합)·순유입(net). from/to 양쪽 축을 한 표로 합산"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "전 분류 기준 순유입 1위 상태군은 폐업으로, 유입 5,086건 대 유출 8건으로 순유입 +5,078건 — 사실상 종착 상태다."
              sql: |
                -- :major='ALL'
                SELECT grp,
                       SUM(outflow) AS outflow,
                       SUM(inflow) AS inflow,
                       SUM(inflow) - SUM(outflow) AS net
                FROM (
                  SELECT from_group AS grp, transitions AS outflow, 0 AS inflow
                  FROM d1_status_transition
                  WHERE (:major = 'ALL' OR major = :major)
                  UNION ALL
                  SELECT to_group, 0, transitions
                  FROM d1_status_transition
                  WHERE (:major = 'ALL' OR major = :major)
                ) t
                GROUP BY grp
                ORDER BY net DESC
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { major: "ALL" }
            - pattern_id: "origin_share_matrix"
              question_ko: "모든 출발 상태군에 대해, 각 상태군에서 나가는 전이의 행선지별 확률(행 정규화 매트릭스)은? (:category='ALL' 또는 특정 중분류)"
              axes: "교차/비율 — 행=from_group×to_group 전 조합, 값=건수·출발군 내 비중(마르코프 행렬 뷰). from_slice_destinations(출발군 1개씩 호출)의 전체 매트릭스 일반화"
              verified_rows: 12
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "영업 상태에서 나가는 전이의 80.4%(5,061건)가 폐업행이다 — 영업 이탈의 지배적 행선지는 폐업이다."
              sql: |
                -- :category='ALL'
                SELECT from_group, to_group,
                       SUM(transitions) AS transitions,
                       ROUND(100.0 * SUM(transitions) / SUM(SUM(transitions)) OVER (PARTITION BY from_group), 1) AS from_share_pct
                FROM d1_status_transition
                WHERE (:category = 'ALL' OR category = :category)
                GROUP BY from_group, to_group
                ORDER BY from_group, transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
              param_defaults: { category: "ALL" }
            - pattern_id: "compare_category_profiles"
              question_ko: "두 업종군(:cat_a, :cat_b)의 전이 경로 프로파일은 어떻게 다른가 — 경로별 건수와 각자 내부 구성비를 나란히 비교하면?"
              axes: "A/B 교차 비교 — 행=전이경로, 열=업종군 A/B 각각의 건수·자기 총량 대비 구성비(규모 차 보정)"
              verified_rows: 7
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "영업→폐업 비중이 식품은 99.9%(3,143건)인 반면 의료는 81.8%(314건)로, 의료가 폐업 외 경로(휴업·전출 등)로 더 분산된다."
              sql: |
                -- :cat_a='food', :cat_b='health_medical'
                SELECT from_group || '→' || to_group AS path,
                       SUM(CASE WHEN category = :cat_a THEN transitions ELSE 0 END) AS a_transitions,
                       ROUND(100.0 * SUM(CASE WHEN category = :cat_a THEN transitions ELSE 0 END) / SUM(SUM(CASE WHEN category = :cat_a THEN transitions ELSE 0 END)) OVER (), 1) AS a_pct,
                       SUM(CASE WHEN category = :cat_b THEN transitions ELSE 0 END) AS b_transitions,
                       ROUND(100.0 * SUM(CASE WHEN category = :cat_b THEN transitions ELSE 0 END) / SUM(SUM(CASE WHEN category = :cat_b THEN transitions ELSE 0 END)) OVER (), 1) AS b_pct
                FROM d1_status_transition
                WHERE category IN (:cat_a, :cat_b)
                GROUP BY path
                ORDER BY a_transitions + b_transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "volume_concentration_rank"
              question_ko: "전이 관측은 어떤 분류값(:dim ∈ {major, category, dataset})에 얼마나 집중돼 있나 — 상위 :n개의 점유율과 누적 점유율은? (:category='ALL' 또는 특정 중분류 내)"
              axes: "랭킹/분포 — 행=:dim 값, 값=전이 총량·점유율(pct)·누적 점유율(cum_pct). 순수 볼륨 랭킹+집중도는 기존 패턴에 없음"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "전이 관측 1위 데이터셋은 서울시 통신판매업 인허가 정보로 1,638건 — 단일 데이터셋이 전체의 25.8%를 차지한다."
              sql: |
                -- :dim='dataset', :category='ALL', :n=10
                SELECT CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko WHEN 'dataset' THEN dataset_ko END AS dim_value,
                       SUM(transitions) AS transitions,
                       ROUND(100.0 * SUM(transitions) / SUM(SUM(transitions)) OVER (), 1) AS pct,
                       ROUND(100.0 * SUM(SUM(transitions)) OVER (ORDER BY SUM(transitions) DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / SUM(SUM(transitions)) OVER (), 1) AS cum_pct
                FROM d1_status_transition
                WHERE (:category = 'ALL' OR category = :category)
                GROUP BY dim_value
                ORDER BY transitions DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, window]
              param_defaults: { category: "ALL", n: 10 }
              param_enum: { dim: [major, category, dataset] }
            - pattern_id: "status_code_glossary"
              question_ko: "상태 코드(01~05)는 각각 어떤 상태군을 뜻하나 — 다른 패턴의 :from_status/:to_status 파라미터에 쓸 코드 사전은?"
              axes: "단면/사전 — 행=상태 코드, 값=상태군 라벨. from/to 양측 합집합으로 매핑 무결성까지 확인"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "코드 01=영업을 시작으로 5개 코드가 각 1개 상태군에 1:1 매핑된다(01 영업, 02 휴업, 03 폐업, 04 취소/말소, 05 제외/전출)."
              sql: |
                -- 파라미터 없음
                SELECT status_code, status_group
                FROM (
                  SELECT DISTINCT from_status AS status_code, from_group AS status_group FROM d1_status_transition
                  UNION
                  SELECT DISTINCT to_status, to_group FROM d1_status_transition
                ) t
                ORDER BY status_code
              requires: [select_columns, sort, subquery]
            - pattern_id: "rare_paths_detail"
              question_ko: "관측이 극히 드문(:max_t건 이하) 전이는 구체적으로 어떤 업종·경로에서 나오나?"
              axes: "임계값 단면 — 행=업종(dataset)×경로 원본 행, 값=건수 ASC. inv_rarest_paths(경로 합계 고정 10행)와 달리 업종 상세·임계값 파라미터"
              verified_rows: 20
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "e4a9d0567d8240b19c7ee538b338fa1c"
              insight_sample_ko: "1건짜리 희귀 전이의 예로 서울시 게임물배급업 인허가 정보의 영업→제외/전출 1건이 잡힌다."
              sql: |
                -- :max_t=3, :n=20
                SELECT dataset_ko, category_ko, from_group, to_group, transitions
                FROM d1_status_transition
                WHERE transitions <= :max_t
                ORDER BY transitions ASC, dataset_ko
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { max_t: 3, n: 20 }
          contract_version: v1
          product_question: 영업→폐업 등 상태 전이는 어떤 경로인가?
          grain: 업종3단×상태전이
          primary_key: [major, category, dataset, from_status, to_status]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, from_status, to_status]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: from_status
        data_type: varchar
        description: 전이 이전 상태코드(01~06).
        tests: [not_null]
      - name: to_status
        data_type: varchar
        description: 전이 이후 상태코드(01~06).
        tests: [not_null]
      - name: from_group
        data_type: varchar
        description: 이전 상태군 한글 라벨.
      - name: to_group
        data_type: varchar
        description: 이후 상태군 한글 라벨.
      - name: transitions
        data_type: bigint
        description: 해당 전이 발생 건수. 30 미만 저표본.
        tests: [not_null]

  # ═══ 화면 3: 지역 프로파일·지도(geo-place) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_dong_summary
    description: 우리 동네 상권 요약 — 행정동별 업소 현황 스냅샷(전체·영업·폐업·업종수·지도표시 가능). 동 지도/요약 서빙 표면.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_dong_summary
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_dong_summary   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 행정동별 상권 요약
            summary: 행정동마다 업소가 몇 곳이고 그중 영업 중은 몇 곳인지, 업종은 몇 가지인지 한 줄로 정리했습니다.
            use_cases:
              - 동네 상권 규모 비교
              - 지도 위 상권 요약 표시
              - 입지 후보 1차 선별
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "dong_open_top"
              question_ko: "서울에서 영업 중 업소가 가장 많은 동(상권 최대 동)은 어디인가?"
              axes: "dong → 영업 업소 수 랭킹(top-N, desc)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "역삼1동이 영업 8,924개(누적 32,486)로 서울 1위, 서초1동 7,622개·신림동 6,915개가 뒤를 잇는다."
              sql: |
                SELECT admin_dong, gu, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                ORDER BY business_open_count DESC
                LIMIT :n; -- :n 예시 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "gu_open_rollup"
              question_ko: "자치구별로 영업 업소 규모와 영업 비중은 어떻게 다른가?"
              axes: "반전 쌍A-1: dong → gu 롤업(차원 상향 교환)"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구가 21개 동 합계 영업 37,525개로 구 1위(송파 24,870·마포 20,907), 영업 비중은 마포구 27.8%가 가장 높다."
              sql: |
                SELECT gu, COUNT(*) AS dong_cnt, SUM(business_open_count) AS open_total,
                       SUM(business_count) AS total_cnt,
                       ROUND(100.0 * SUM(business_open_count) / SUM(business_count), 1) AS open_pct
                FROM d1_dong_summary
                GROUP BY gu
                ORDER BY open_total DESC; -- 25개 구 전체
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu_dong_breakdown"
              question_ko: "특정 구 안에서는 어느 동이 상권이 큰가?"
              axes: "반전 쌍A-2: gu → dong 분해(차원 하향 교환, gu_open_rollup 의 역방향) + :gu 파라미터 단면"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구 21개 동 중 역삼1동(8,924)이 2위 논현1동(5,976)의 1.5배 — 구 내 상권 집중이 뚜렷하다."
              sql: |
                SELECT admin_dong, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                WHERE gu = :gu -- 예시 '강남구'
                ORDER BY business_open_count DESC;
              requires: [select_columns, sort, aggregate]
            - pattern_id: "dong_closed_share_top"
              question_ko: "누적 대비 폐업 비중이 가장 높은(상권 물갈이가 심했던) 동은 어디인가?"
              axes: "반전 쌍B-1: 폐업 관점 · 비중(절대값 아님) · desc"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "압구정동은 누적 6,386개 중 5,817개(91.1%)가 폐업 상태로 서울 최고 — 길음1동 84.4%, 신도림동 82.5% 순."
              sql: |
                SELECT admin_dong, gu, business_closed_count, business_count,
                       ROUND(100.0 * business_closed_count / business_count, 1) AS closed_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 500 (극소 동 노이즈 컷)
                ORDER BY closed_pct DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dong_open_share_top"
              question_ko: "누적 대비 영업 비중이 가장 높은(살아있는 가게 비율이 높은) 동은 어디인가?"
              axes: "반전 쌍B-2: 영업(생존) 관점 — dong_closed_share_top 의 관점 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "세곡동이 영업 비중 42.3%로 1위(서울 평균 24.4%의 1.7배) — 가양1동 39.9%, 마장동 38.9% 등 신규 개발지가 상위."
              sql: |
                SELECT admin_dong, gu, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 500
                ORDER BY open_pct DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dong_profile_lookup"
              question_ko: "우리 동네(특정 동)의 상권 프로필과 구 내 순위는?"
              axes: "단일 dong 단면(:dong 파라미터) + 구 내 순위 파생"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "역삼1동은 강남구 영업 1위(8,924개, 지오코딩 96.8%)인 반면 '역삼%'에 같이 걸리는 역삼2동은 영업 6개·구 내 18위 — 접두 검색이 성격이 전혀 다른 동을 함께 반환함을 확인."
              sql: |
                SELECT admin_dong, gu, business_count, business_open_count, business_closed_count,
                       dataset_count, geocoded_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct,
                       ROUND(100.0 * geocoded_count / business_count, 1) AS geocoded_pct,
                       latest_collected_at,
                       (SELECT COUNT(*) + 1 FROM d1_dong_summary s2
                        WHERE s2.gu = s1.gu AND s2.business_open_count > s1.business_open_count) AS open_rank_in_gu
                FROM d1_dong_summary s1
                WHERE admin_dong LIKE :dong; -- 예시 '역삼%' (동명 중복 주의 — gu 필터 병용 권장)
              requires: [select_columns, aggregate, filter_set]
            - pattern_id: "dong_geocode_coverage_bottom"
              question_ko: "지도에 못 찍히는 업소가 많은(좌표 커버리지 최저) 동은 어디인가?"
              axes: "정렬 반전(asc — 최저 커버리지) · 데이터 품질 관점"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "성내3동은 181개 중 80개(44.2%)만 좌표 보유로 지도 커버리지 최저 — 상위 동(역삼1동 96.8%)과 2배 이상 격차."
              sql: |
                SELECT admin_dong, gu, geocoded_count, business_count,
                       ROUND(100.0 * geocoded_count / business_count, 1) AS geocoded_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 100
                ORDER BY geocoded_pct ASC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "freshness_by_collected_date"
              question_ko: "동별 데이터가 언제 수집분인가 — 얼마나 신선한가?"
              axes: "시간축(수집일) 분포 — 스냅샷 테이블의 유일한 시간 단면"
              verified_rows: 16
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "417개 동 중 171개는 7/9, 139개는 7/27 수집분이고 8개 동은 6/30 이후 갱신이 없다 — '데이터 기준일'은 동마다 다르다."
              sql: |
                SELECT date(latest_collected_at) AS collected_date, COUNT(*) AS dong_cnt
                FROM d1_dong_summary
                GROUP BY collected_date
                ORDER BY collected_date;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "diversity_vs_size_rank_cross"
              question_ko: "업종 다양성이 규모 대비 두드러지는 동은 어디인가?"
              axes: "두 축 교차: 업종 다양성 rank × 규모 rank (윈도우 함수 — D1 지원 확인)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "구로1동이 업종 100종으로 다양성 1위인데 규모는 5위 — 독산1동은 다양성 4위 vs 규모 20위로 격차가 가장 크다."
              sql: |
                SELECT admin_dong, gu, dataset_count, business_count,
                       RANK() OVER (ORDER BY dataset_count DESC) AS diversity_rank,
                       RANK() OVER (ORDER BY business_count DESC) AS size_rank
                FROM d1_dong_summary
                ORDER BY dataset_count DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, window]
            - pattern_id: "size_quartile_open_rate"
              question_ko: "동 규모(누적 업소 수) 구간별로 영업 비중과 업종 다양성이 어떻게 다른가?"
              axes: "두 축 교차: 규모 4분위 × 영업 비중/다양성 평균"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "규모 하위 절반 동은 평균 영업 비중 12.5~14.5%·업종 6~13종에 그치는 반면 상위 절반은 24~26%·63~79종 — 소형 동 레코드는 폐업 잔재 비중이 압도적."
              sql: |
                SELECT q AS size_quartile, COUNT(*) AS dongs,
                       ROUND(AVG(open_pct), 1) AS avg_open_pct,
                       ROUND(AVG(dataset_count), 0) AS avg_dataset_count
                FROM (SELECT NTILE(4) OVER (ORDER BY business_count) AS q,
                             100.0 * business_open_count / business_count AS open_pct,
                             dataset_count
                      FROM d1_dong_summary)
                GROUP BY q
                ORDER BY q; -- quartile 1=규모 최소 … 4=최대
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "inv_dataset_count_asc"
              question_ko: "업종 다양성이 가장 낮은(단조로운) 동은? (다양성 top 랭킹의 반전)"
              axes: "동 랭킹 — dataset_count ASC(다양성 관점의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "방화2동은 업소 310곳에 업종 37종뿐 — 규모 대비 업종 다양성 최저."
              sql: |
                -- :min_count=300, :n=10
                SELECT admin_dong, gu, dataset_count, business_count, business_open_count
                FROM d1_dong_summary WHERE business_count >= :min_count
                ORDER BY dataset_count ASC LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_count: 300, n: 10 }
            - pattern_id: "new_gu_fixed_closed_share"
              question_ko: "이 자치구 안에서 물갈이(폐업 비중)가 심한 동은? (구 고정 단면 + 폐업 관점)"
              axes: "자치구 고정(:gu) → 동 랭킹, 폐업 비중 관점"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구 내에서는 압구정동이 누적 6,389곳 중 91.1% 폐업으로 물갈이 최심."
              sql: |
                -- :gu='강남구'
                SELECT admin_dong, business_count, business_closed_count,
                       ROUND(100.0*business_closed_count/business_count,1) AS closed_pct
                FROM d1_dong_summary WHERE gu = :gu
                ORDER BY closed_pct DESC
              requires: [select_columns, sort, aggregate]
            - pattern_id: "x_churned_dong_hot_category"
              question_ko: "물갈이가 심했던 동네에서 지금 신규 유입 1위 업종은? (동 이력 × 동×업종 매트릭스 교차)"
              axes: "제품 간 조인 — dong_summary(폐업 비중) × dong_category_matrix(신규 유입)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "폐업 비중 91.1%인 압구정동에서도 최근 1년 신규 1위는 식품 592곳 — 물갈이와 재유입이 동시에 일어난다."
              sql: |
                -- :min_count=500, :n=10
                WITH churn AS (
                  SELECT admin_dong_code, admin_dong, gu, business_count,
                         ROUND(100.0*business_closed_count/business_count,1) AS closed_pct
                  FROM d1_dong_summary WHERE business_count >= :min_count),
                hot AS (
                  SELECT admin_dong_code, category, opened_last_365d,
                         ROW_NUMBER() OVER (PARTITION BY admin_dong_code ORDER BY opened_last_365d DESC) rn
                  FROM d1_dong_category_matrix)
                SELECT c.admin_dong, c.gu, c.closed_pct, h.category AS hot_category, h.opened_last_365d
                FROM churn c JOIN hot h ON h.admin_dong_code = c.admin_dong_code AND h.rn = 1
                ORDER BY c.closed_pct DESC LIMIT :n
              requires: [select_columns, sort, aggregate, join, subquery, window, filter_range]
              param_defaults: { min_count: 500, n: 10 }
            - pattern_id: "dong_metric_rank_switch"
              question_ko: "지표(누적/영업/폐업/업종 다양성/지오코딩/미지오코딩)와 정렬 방향, 자치구 범위를 골라 동 순위를 보면? (:metric ∈ {total, open, closed, diversity, geocoded, ungeocoded}, :dir ∈ {asc, desc}, :gu 는 구 이름 또는 'ALL'=서울 전체)"
              axes: "동 랭킹 일반화 — 지표 스위치(6종) × 정렬 방향 스위치 × 구 센티널 단면 × 임계값. dong_open_top·inv_dataset_count_asc 등 고정 랭킹 패턴들의 파라미터 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "영업 업소 수 기준 서울 1위 동은 강남구 역삼1동으로, 영업 중 8,926곳(누적 32,512곳)이다."
              sql: |
                -- :metric='open', :dir='desc', :gu='ALL', :min_count=100, :n=10
                SELECT admin_dong, gu,
                       CASE :metric WHEN 'total' THEN business_count
                                    WHEN 'open' THEN business_open_count
                                    WHEN 'closed' THEN business_closed_count
                                    WHEN 'diversity' THEN dataset_count
                                    WHEN 'geocoded' THEN geocoded_count
                                    WHEN 'ungeocoded' THEN business_count - geocoded_count END AS metric_value,
                       business_count, business_open_count
                FROM d1_dong_summary
                WHERE business_count >= :min_count
                  AND (:gu = 'ALL' OR gu = :gu)
                ORDER BY CASE WHEN :dir = 'asc' THEN CASE :metric WHEN 'total' THEN business_count WHEN 'open' THEN business_open_count WHEN 'closed' THEN business_closed_count WHEN 'diversity' THEN dataset_count WHEN 'geocoded' THEN geocoded_count WHEN 'ungeocoded' THEN business_count - geocoded_count END END ASC,
                         CASE WHEN :dir = 'desc' THEN CASE :metric WHEN 'total' THEN business_count WHEN 'open' THEN business_open_count WHEN 'closed' THEN business_closed_count WHEN 'diversity' THEN dataset_count WHEN 'geocoded' THEN geocoded_count WHEN 'ungeocoded' THEN business_count - geocoded_count END END DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_count: 100, gu: "ALL", dir: "desc", n: 10 }
              param_enum: { metric: [total, open, closed, diversity, geocoded, ungeocoded], dir: [asc, desc] }
            - pattern_id: "city_kpi_snapshot"
              question_ko: "서울 전체 상권을 한 줄로 요약하면? (동/구 수, 누적·영업·폐업 규모, 영업·폐업·지오코딩 비율, 수집 기간)"
              axes: "전시(全市) 단면 — 1행 KPI 롤업. 기존 패턴은 모두 동/구 단위라 서울 총계 자체를 주는 패턴이 없었음"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "서울 417개 동·25개 구에 누적 1,551,232개 업소가 등록돼 있고 영업 중은 377,642곳(24.3%), 지오코딩 커버리지는 91.0%다."
              sql: |
                -- 파라미터 없음: 서울 전체 1행 KPI
                SELECT COUNT(*) AS dong_cnt,
                       COUNT(DISTINCT gu) AS gu_cnt,
                       SUM(business_count) AS total_businesses,
                       SUM(business_open_count) AS open_total,
                       SUM(business_closed_count) AS closed_total,
                       ROUND(100.0 * SUM(business_open_count) / SUM(business_count), 1) AS open_pct,
                       ROUND(100.0 * SUM(business_closed_count) / SUM(business_count), 1) AS closed_pct,
                       ROUND(100.0 * SUM(geocoded_count) / SUM(business_count), 1) AS geocoded_pct,
                       MIN(date(latest_collected_at)) AS oldest_collected,
                       MAX(date(latest_collected_at)) AS newest_collected
                FROM d1_dong_summary
              requires: [select_columns, aggregate]
            - pattern_id: "gu_geocode_quality_rollup"
              question_ko: "자치구별 지오코딩(좌표 확보) 품질은 어떤가 — 어느 구부터 보정해야 하나? (:dir='asc' 최저 커버리지부터, 'desc' 최고부터)"
              axes: "gu 롤업 × 데이터 품질 관점 + 정렬 방향 스위치. 기존 지오코딩 패턴(dong_geocode_coverage_bottom)은 동 단위뿐이고, 기존 gu 롤업(gu_open_rollup)은 영업 관점뿐"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "지오코딩 커버리지 최하위 구는 종로구(83.5%)로 미좌표 업소가 8,701곳에 달한다."
              sql: |
                -- :dir='asc'
                SELECT gu, COUNT(*) AS dong_cnt,
                       SUM(business_count) AS total_businesses,
                       SUM(geocoded_count) AS geocoded_total,
                       SUM(business_count - geocoded_count) AS ungeocoded_total,
                       ROUND(100.0 * SUM(geocoded_count) / SUM(business_count), 1) AS geocoded_pct,
                       MIN(date(latest_collected_at)) AS oldest_collected
                FROM d1_dong_summary
                GROUP BY gu
                ORDER BY CASE WHEN :dir = 'asc' THEN 100.0 * SUM(geocoded_count) / SUM(business_count) END ASC,
                         CASE WHEN :dir = 'desc' THEN 100.0 * SUM(geocoded_count) / SUM(business_count) END DESC
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { dir: "asc" }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gu_select_compare"
              question_ko: "내가 고른 자치구 몇 곳(2곳 이상 임의 개수)을 나란히 비교하면? (:gus 는 구 이름의 JSON 배열 문자열, 예: '[\"강남구\",\"마포구\"]')"
              axes: "임의 선택 gu 집합 비교 단면 — JSON 배열 문자열 파라미터를 json_each 로 전개해 배열 IN 을 대체. 전체 25개 구 롤업(gu_open_rollup)과 달리 관심 구만 골라 옆으로 비교"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "강남구는 21개 동, 누적 148,964개 업소 중 영업 37,548곳(25.2%), 지오코딩 커버리지 94.6%로 비교 대상 중 규모 1위다."
              sql: |
                -- :gus='["강남구","마포구"]'
                SELECT gu, COUNT(*) AS dong_cnt,
                       SUM(business_count) AS total_businesses,
                       SUM(business_open_count) AS open_total,
                       ROUND(100.0 * SUM(business_open_count) / SUM(business_count), 1) AS open_pct,
                       ROUND(100.0 * SUM(business_closed_count) / SUM(business_count), 1) AS closed_pct,
                       ROUND(100.0 * SUM(geocoded_count) / SUM(business_count), 1) AS geocoded_pct,
                       ROUND(AVG(dataset_count), 0) AS avg_dataset_count
                FROM d1_dong_summary
                WHERE gu IN (SELECT value FROM json_each(:gus))
                GROUP BY gu
                ORDER BY open_total DESC
              requires: [select_columns, sort, aggregate, group_by, subquery]
            - pattern_id: "open_pct_histogram"
              question_ko: "서울 동들의 영업 비중(생존율)은 어떻게 분포하나 — 몇 %대 구간에 동이 몰려 있나?"
              axes: "분포 — 영업 비중 10%p 버킷 히스토그램. 기존 패턴은 상/하위 랭킹뿐이라 전체 분포 형태를 주는 패턴이 없었음"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "영업 비중 0~10% 구간에 19개 동이 있고 이들의 평균 누적 업소 수는 471곳이다."
              sql: |
                -- :min_count=100
                SELECT (CAST(100.0 * business_open_count / business_count AS INTEGER) / 10) * 10 AS open_pct_bucket,
                       COUNT(*) AS dong_cnt,
                       ROUND(AVG(business_count), 0) AS avg_business_count
                FROM d1_dong_summary
                WHERE business_count >= :min_count
                GROUP BY open_pct_bucket
                ORDER BY open_pct_bucket
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { min_count: 100 }
            - pattern_id: "dong_other_status_top"
              question_ko: "영업도 폐업도 아닌 상태(휴업·취소 등)의 업소 비중이 높은 동은 어디인가?"
              axes: "동 랭킹 — 제3상태(business_count - open - closed) 비중 관점. 기존 패턴이 영업/폐업 두 상태만 다뤄 못 보던 잔여 상태 파생 지표"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "제3상태 비중 1위는 종로구 사직동으로 누적 7,671곳 중 964곳(12.6%)이 영업·폐업 어느 쪽도 아니다."
              sql: |
                -- :min_count=500, :n=10
                SELECT admin_dong, gu, business_count,
                       business_count - business_open_count - business_closed_count AS other_status_count,
                       ROUND(100.0 * (business_count - business_open_count - business_closed_count) / business_count, 1) AS other_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count
                ORDER BY other_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_count: 500, n: 10 }
            - pattern_id: "top_dong_concentration_by_gu"
              question_ko: "자치구별로 1위 동이 구 전체 영업 상권을 얼마나 독식하나 — 단일 동 의존이 큰 구는?"
              axes: "교차 — gu 롤업 × 구내 1위 동 집중도(윈도우). gu_open_rollup(총량)·gu_dong_breakdown(단일 구 분해)이 못 주는 구간 비교 가능한 집중도 지표"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "관악구는 1위 동 신림동이 구 전체 영업 업소의 50.1%(6,903/13,782곳)를 차지해 단일 동 의존이 가장 크다."
              sql: |
                -- :n=25
                SELECT gu, dong_cnt, open_total, top_dong, top_dong_open,
                       ROUND(100.0 * top_dong_open / open_total, 1) AS top_dong_share_pct
                FROM (
                  SELECT gu,
                         COUNT(*) OVER (PARTITION BY gu) AS dong_cnt,
                         SUM(business_open_count) OVER (PARTITION BY gu) AS open_total,
                         admin_dong AS top_dong,
                         business_open_count AS top_dong_open,
                         ROW_NUMBER() OVER (PARTITION BY gu ORDER BY business_open_count DESC) AS rn
                  FROM d1_dong_summary
                )
                WHERE rn = 1
                ORDER BY top_dong_share_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, window, subquery]
              param_defaults: { n: 25 }
            - pattern_id: "city_open_cum_share"
              question_ko: "상위 N개 동이 서울 전체 영업 업소의 몇 %를 차지하나 — 상권 집중은 얼마나 심한가?"
              axes: "분포/집중 — 영업 업소 랭킹에 전시(全市) 누적 점유율(파레토 곡선) 결합. dong_open_top 이 절대값만 주는 것과 달리 집중도 해석이 붙음"
              verified_rows: 20
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "영업 업소 1위 역삼1동(8,926곳) 한 곳만으로 서울 전체 영업 업소의 2.4%가 채워진다."
              sql: |
                -- :n=20
                SELECT admin_dong, gu, business_open_count,
                       ROUND(100.0 * SUM(business_open_count) OVER (ORDER BY business_open_count DESC, admin_dong_code ROWS UNBOUNDED PRECEDING)
                             / (SELECT SUM(business_open_count) FROM d1_dong_summary), 1) AS cum_share_pct
                FROM d1_dong_summary
                ORDER BY business_open_count DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, window, subquery]
              param_defaults: { n: 20 }
            - pattern_id: "stale_dong_top"
              question_ko: "수집분이 가장 오래된(재수집이 시급한) 동은 어디이고, 최신 수집 대비 며칠 뒤처졌나?"
              axes: "시간축 — 최장 미수집 동 랭킹 + 최신 스냅샷 대비 지연일 파생. freshness_by_collected_date 가 날짜별 분포만 주는 것과 달리 대상 동을 지목"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c22f664672b04d67bed90d0c16001c69"
              insight_sample_ko: "수집분이 가장 오래된 동은 중구 청구동(2026-06-30 수집)으로 최신 수집 대비 37일 뒤처져 있다."
              sql: |
                -- :n=10
                SELECT admin_dong, gu, date(latest_collected_at) AS collected_date,
                       CAST(julianday((SELECT MAX(latest_collected_at) FROM d1_dong_summary)) - julianday(latest_collected_at) AS INTEGER) AS days_behind_newest,
                       business_count
                FROM d1_dong_summary
                ORDER BY latest_collected_at ASC
                LIMIT :n
              requires: [select_columns, sort, subquery]
              param_defaults: { n: 10 }
          contract_version: v1
          product_question: 우리 동네(행정동)에 업소가 몇 개 있고 얼마나 열고 닫혔나?
          grain: 행정동
          primary_key: [admin_dong_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: wide
    columns:
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리(동당 1행).
        tests: [not_null, unique]
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글).
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: business_count
        data_type: bigint
        description: 누적 업소 수(폐업 포함 — active_cnt 와 혼용 금지).
        tests: [not_null]
      - name: business_open_count
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: business_closed_count
        data_type: bigint
        description: 폐업(03) 업소 수.
      - name: dataset_count
        data_type: bigint
        description: 이 동에 존재하는 업종(dataset) 종수.
      - name: geocoded_count
        data_type: bigint
        description: 좌표(위경도) 보유 업소 수 — 지도 커버리지 배지(geocoded/business).
      - name: latest_collected_at
        data_type: timestamp(6)
        description: 이 동 데이터의 최신 수집 시각(화면 '데이터 기준일').

  - name: gold_license_dong_category_matrix
    description: 우리 동네엔 뭐가 많나 — 행정동 × 중분류 스톡(영업/전체) + 최근 1년 신규 개업. 동네 프로파일/지도 서빙.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_dong_category_matrix
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_dong_category_matrix   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 행정동별 업종 구성
            summary: 행정동마다 어떤 업종이 몇 곳씩 있는지, 최근 1년 신규 개업은 얼마나 되는지 교차 집계했습니다.
            use_cases:
              - 동네 업종 프로파일 작성
              - 경쟁 밀도 확인
              - 미진출 업종 탐색
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "dong_category_profile"
              question_ko: "이 동네(:dong)엔 무슨 업종이 많나? (구성비 포함)"
              axes: "dong→category (특정 단면 파라미터 + 동네 내 비중) — 반전쌍 A의 정방향"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "역삼1동 영업 업소의 51.2%(4,568곳)가 식품 — 산업 12.8%, 의료 9.5% 순. 최근 1년 식품 개업만 492건."
              sql: |
                SELECT category_ko, major_ko, active_cnt, total_cnt, opened_last_365d,
                       ROUND(100.0 * active_cnt / SUM(active_cnt) OVER (), 1) AS share_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong = :dong  -- 예: '역삼1동' (동명 중복 시 AND gu = :gu 병행, 예: '신사동')
                ORDER BY active_cnt DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "category_top_dongs"
              question_ko: "이 업종(:category_ko)이 가장 많은 동네는 어디인가? (top-N)"
              axes: "category→dong (축 반전: dong_category_profile 과 차원 교환 쌍 A) + 랭킹 top-N (수정: 파라미터명을 :category_ko 로 명시 — 한글 라벨 컬럼과 비교함을 소비 측에 드러냄)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품 영업 업소 1위 동은 역삼1동(4,568곳) — 신림동(3,806)·종로1·2·3·4가동(3,529)·보라매동(3,454) 순. 단 산업(93%)·문화(71%)는 동 미상 비중이 높아 이 패턴은 식품·위생·미용 등 커버리지 높은 업종에 적합."
              sql: |
                SELECT admin_dong, gu, active_cnt, opened_last_365d
                FROM d1_dong_category_matrix
                WHERE category_ko = :category_ko  -- 예: '식품' (11종: 식품/의료/위생·미용/약국/동물/안경·치과/숙박/축산/문화/산업/환경)
                  AND admin_dong_code <> 'UNK'    -- 지오코딩 실패분 제외(미제외 시 UNK 가 상위 독점)
                ORDER BY active_cnt DESC
                LIMIT 10;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "vital_dongs_top"
              question_ko: "최근 1년 개업이 가장 활발한(뜨는) 동네는 어디인가?"
              axes: "dong 랭킹(활력 desc) — 반전쌍 B의 정방향(활발)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 개업 1위는 역삼1동(960건), 가양1동(929)·목1동(926)이 근소한 차. 반포1동은 영업 스톡 대비 개업률 29.3%로 유입 강도 최고."
              sql: |
                SELECT admin_dong, gu, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                GROUP BY admin_dong_code, admin_dong, gu
                ORDER BY opened_1y DESC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "dormant_dongs"
              question_ko: "상권 규모는 있는데 신규 개업이 끊긴(침체) 동네는 어디인가?"
              axes: "정렬·관점 반전(쌍 B): 개업 최다 desc ↔ 개업률 최저 asc(활발↔침체)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "영업 500곳 이상 동 중 개업률 최저는 마장동 3.6%(2,622곳 중 신규 94건) — 중림동 4.7%, 가리봉동 4.8%, 혜화동 5.2%가 뒤따르는 침체권."
              sql: |
                SELECT admin_dong, gu, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                GROUP BY admin_dong_code, admin_dong, gu
                HAVING SUM(active_cnt) >= :min_active  -- 예: 500 (군소 동 노이즈 컷)
                ORDER BY open_rate_pct ASC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "category_survival_stock"
              question_ko: "어떤 업종이 많이 사라졌나 — 업종별 영업 잔존율과 소멸 스톡은?"
              axes: "관점 반전(쌍 C): 영업 스톡 ↔ 소멸 스톡(누적-현재), 비중 ↔ 절대값 병기 — 서울 전체 총량이므로 UNK 포함이 정확"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품은 누적 110.4만 중 20.9%만 영업 잔존(소멸 스톡 87.3만) — 잔존율 최고 동물(54.3%)의 2.6배 소멸 강도. 단, 폐업 시점 정보는 없으니 '누적 잔존율'로만 해석."
              sql: |
                SELECT category_ko, SUM(active_cnt) AS active_cnt, SUM(total_cnt) AS total_cnt,
                       SUM(total_cnt) - SUM(active_cnt) AS gone_cnt,
                       ROUND(100.0 * SUM(active_cnt) / SUM(total_cnt), 1) AS alive_pct
                FROM d1_dong_category_matrix
                GROUP BY category_ko
                ORDER BY alive_pct ASC;  -- DESC 로 바꾸면 '가장 오래 남는 업종'
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu_category_cross"
              question_ko: "두 자치구(:gu_a vs :gu_b)의 업종 구성은 어떻게 다른가?"
              axes: "두 축 교차 비교(gu × category) + 구내 비중 — 동 미상(UNK) 행도 gu 는 유효해 구 단위는 커버리지 완전"
              verified_rows: 22
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "강남구·마포구 모두 산업(통신판매 등)이 절반가량(47.1% vs 48.4%) — 문화 비중은 마포(19.2%)가 강남(17.4%)보다 높고, 식품은 강남 21.9% vs 마포 21.2%로 비슷."
              sql: |
                SELECT gu, category_ko, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(active_cnt) / SUM(SUM(active_cnt)) OVER (PARTITION BY gu), 1) AS share_in_gu_pct
                FROM d1_dong_category_matrix
                WHERE gu IN (:gu_a, :gu_b)  -- 예: '강남구', '마포구'
                GROUP BY gu, category_ko
                ORDER BY category_ko, gu;
              requires: [select_columns, sort, aggregate, group_by, window, filter_set]
            - pattern_id: "dong_signature_category"
              question_ko: "서울 각 동네의 '대표(1위) 업종'은 무엇이 가장 흔한가?"
              axes: "dong→category 를 다시 category 로 접는 2단 축(동별 1위 업종의 도시 분포) — 윈도우 함수 D1 동작 검증됨"
              verified_rows: 7
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "서울 417개 동 중 217개 동(52%)의 최다 영업 업종은 식품, 92개 동은 산업, 68개 동은 의료. 단 산업·문화는 동 미상 비중이 커 실제보다 과소평가될 수 있음."
              sql: |
                WITH ranked AS (
                  SELECT admin_dong, gu, category_ko, active_cnt,
                         ROW_NUMBER() OVER (PARTITION BY admin_dong_code, gu_code ORDER BY active_cnt DESC) AS rn
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK'
                )
                SELECT category_ko, COUNT(*) AS dong_cnt
                FROM ranked
                WHERE rn = 1
                GROUP BY category_ko
                ORDER BY dong_cnt DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "gu_category_concentration"
              question_ko: "이 업종(:category_ko)은 어느 자치구에 집중돼 있나? (서울 점유율)"
              axes: "category→gu 집중도(절대값 + 도시 점유율 비중 병기) — category_top_dongs 의 구 스케일판 (수정: 파라미터명을 :category_ko 로 명시 — 한글 라벨 컬럼과 비교함을 소비 측에 드러냄)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "숙박 영업 업소는 중구(469곳, 서울의 17.1%)·종로구(342곳, 12.5%)에 집중 — 상위 2개 구가 서울 숙박의 약 30%를 점유."
              sql: |
                SELECT gu, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(active_cnt) /
                             (SELECT SUM(active_cnt) FROM d1_dong_category_matrix WHERE category_ko = :category_ko), 1) AS city_share_pct
                FROM d1_dong_category_matrix
                WHERE category_ko = :category_ko  -- 예: '숙박'
                  AND gu_code <> 'UNK'
                GROUP BY gu
                ORDER BY active_cnt DESC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "category_openings_rank"
              question_ko: "최근 1년 어떤 업종이 가장 많이 새로 생겼나? (규모와 개업률)"
              axes: "category 랭킹(신규 유입 절대값 desc ↔ 영업 대비 개업률로 관점 전환 가능) — 서울 전체 총량이므로 UNK 포함"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 개업은 산업(49,608건)·식품(35,837건)이 압도. 영업 스톡 대비 개업률은 식품 15.5%로 최고 수준(회전 빠름), 환경은 3.4%로 최저."
              sql: |
                SELECT category_ko, SUM(opened_last_365d) AS opened_1y, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                GROUP BY category_ko
                ORDER BY opened_1y DESC;  -- open_rate_pct DESC 로 바꾸면 '회전이 빠른 업종'
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "inv_category_fixed_dong_rank"
              question_ko: "이 업종이 가장 많은 동은? (동 고정→업종 구성의 차원 교환)"
              axes: "업종 고정(:category) → 동 랭킹 — dong_category_profile 의 역방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품이 가장 많은 동은 역삼1동 4,568곳(누적 19,044) — 동 고정 조회의 역방향."
              sql: |
                -- :category='food', :n=10
                SELECT admin_dong, gu, active_cnt, total_cnt, opened_last_365d
                FROM d1_dong_category_matrix WHERE category = :category AND admin_dong IS NOT NULL
                ORDER BY active_cnt DESC LIMIT :n
              requires: [select_columns, sort, filter_null]
              param_defaults: { n: 10 }
            - pattern_id: "new_hot_new_opening_cells"
              question_ko: "최근 1년 신규 개업이 가장 몰린 동×업종 조합은? (재고 대신 유입 관점)"
              axes: "동×업종 교차 랭킹 — opened_last_365d(재고 active_cnt 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 신규가 가장 몰린 조합은 목1동 식품 817곳(활성 대비 40.8%)."
              sql: |
                -- :n=10
                SELECT admin_dong, gu, category, opened_last_365d, active_cnt,
                       ROUND(100.0*opened_last_365d/NULLIF(active_cnt,0),1) AS new_pct
                FROM d1_dong_category_matrix WHERE admin_dong IS NOT NULL
                ORDER BY opened_last_365d DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_null]
              param_defaults: { n: 10 }
            - pattern_id: "inv_new_share_asc"
              question_ko: "신규 유입이 거의 없는(정체된) 동×업종 조합은?"
              axes: "동×업종 랭킹 — 신규 비중 ASC(유입 관점의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "장위1동 환경 업종은 활성 115곳에 최근 1년 신규 0건 — 완전 정체 셀."
              sql: |
                -- :min_active=100, :n=10
                SELECT admin_dong, gu, category, active_cnt, opened_last_365d,
                       ROUND(100.0*opened_last_365d/active_cnt,2) AS new_pct
                FROM d1_dong_category_matrix WHERE active_cnt >= :min_active
                ORDER BY new_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_active: 100, n: 10 }
            - pattern_id: "x_gu_spec_dong_hotspot"
              question_ko: "이 자치구의 특화 업종(LQ>=:min_lq)들은 구 안 어느 동에 몰려 있나? — 구 단위 특화의 동 단위 핫스팟 드릴다운"
              axes: "spec(:gu_code 단면, LQ 필터) ⋈ matrix(같은 :gu_code 안 동별 재고, ROW_NUMBER 로 업종별 1위 동만), 조인 키 category(+양쪽 동일 :gu_code 재바인딩). 특화 업종당 정확히 1행(top 동)이라 팬아웃 없음"
              verified_rows: 3
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "금천구 특화 1위 축산(LQ 1.994)은 구 재고 815곳 중 70.3%(564곳)가 독산1동 한 동에 몰린 초집중형 특화다."
              sql: |
                -- :gu_code='11545', :min_lq=1.2
                WITH ranked AS (
                  SELECT category, admin_dong, active_cnt,
                         ROW_NUMBER() OVER (PARTITION BY category ORDER BY active_cnt DESC) AS rn,
                         SUM(active_cnt) OVER (PARTITION BY category) AS gu_category_total
                  FROM d1_dong_category_matrix
                  WHERE gu_code = :gu_code AND admin_dong_code <> 'UNK'
                )
                SELECT s.category, s.category_ko, s.lq, s.active_cnt AS gu_active_cnt,
                       r.admin_dong AS top_dong, r.active_cnt AS top_dong_cnt,
                       ROUND(100.0*r.active_cnt/NULLIF(r.gu_category_total,0),1) AS top_dong_share_pct
                FROM d1_gu_specialization s
                JOIN ranked r ON r.category = s.category AND r.rn = 1
                WHERE s.gu_code = :gu_code AND s.lq >= :min_lq
                ORDER BY s.lq DESC
              requires: [select_columns, sort, aggregate, join, subquery, window, filter_range]
              param_defaults: { min_lq: 1.2 }
            - pattern_id: "x_category_dong_health"
              question_ko: "이 업종(:category)이 많은 동네 top-N의 전업종 상권 건강도(영업 비중)는 어떤가? — 업종 집적지가 건강한 상권인지 물갈이 상권인지"
              axes: "matrix(:category 단면 → 동 랭킹 active_cnt DESC) ⋈ dong_summary(동 전업종 프로필), 조인 키 admin_dong_code, category 고정 후 양쪽 모두 동 그레인이라 1:1. matrix 의 UNK 동 행은 inner join 으로 자연 탈락"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "숙박 재고 1위 동은 종로1·2·3·4가동(영업 176곳·최근 1년 개업 48곳)인데, 이 동의 전업종 영업 비중은 32.5%로 누적 18,092곳 중 3분의 1만 살아 있는 물갈이 상권이다."
              sql: |
                -- :category='lodging', :n=10
                SELECT m.admin_dong, m.gu, m.active_cnt AS category_active_cnt, m.opened_last_365d,
                       d.business_count AS dong_total_all_industry,
                       ROUND(100.0*d.business_open_count/NULLIF(d.business_count,0),1) AS dong_open_pct
                FROM d1_dong_category_matrix m
                JOIN d1_dong_summary d ON d.admin_dong_code = m.admin_dong_code
                WHERE m.category = :category
                ORDER BY m.active_cnt DESC
                LIMIT :n
              requires: [select_columns, sort, join, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "x_dong_inflow_gu_churn"
              question_ko: "폐업 회전이 심한 자치구(:y 폐업률>=:min_churn) 안에서 그래도 신규 유입이 살아있는 동은 어디인가? — 위험 구 내부의 회복 포켓 탐색"
              axes: "churn(구별 :y 폐업률, HAVING 임계값 통과 구만) ⋈ matrix(동별 전업종 재고·최근 1년 개업률), 조인 키 gu_code. 구→동 1:N 은 의도된 드릴다운(구 지표는 소속 동 행에 반복). 두 CTE 로 각자 그레인에서 먼저 집계해 팬아웃 차단"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "2025년 폐업률 9.01%로 임계값을 넘은 성북구 안에서 길음1동은 영업 1,031곳 대비 최근 1년 개업 387곳(개업률 37.5%)으로 유입이 가장 활발한 회복 포켓이다."
              sql: |
                -- :y='2025', :min_churn=0.08, :n=15
                WITH guc AS (
                  SELECT gu_code, ROUND(1.0*SUM(closed)/NULLIF(SUM(stock_start),0),4) AS gu_churn_rate
                  FROM d1_churn_yearly
                  WHERE y = :y AND gu_code <> 'UNK'
                  GROUP BY gu_code
                  HAVING 1.0*SUM(closed)/NULLIF(SUM(stock_start),0) >= :min_churn
                ),
                dong AS (
                  SELECT gu_code, gu, admin_dong, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                         ROUND(100.0*SUM(opened_last_365d)/NULLIF(SUM(active_cnt),0),1) AS open_rate_pct
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK'
                  GROUP BY gu_code, gu, admin_dong_code, admin_dong
                )
                SELECT d.gu, d.admin_dong, d.active_total, d.opened_1y, d.open_rate_pct, g.gu_churn_rate
                FROM dong d
                JOIN guc g ON g.gu_code = d.gu_code
                ORDER BY d.open_rate_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, join, subquery, filter_range]
              param_defaults: { min_churn: 0.08, n: 15 }
            - pattern_id: "gu_overview_rank"
              question_ko: "서울 25개 자치구를 원하는 지표(:metric ∈ {active,opened,open_rate,alive})와 방향(:dir ∈ {asc,desc})으로 줄 세우면 어떤 순서인가?"
              axes: "gu 랭킹 — 정렬 기준·방향 파라미터화. 기존 패턴엔 구 단위 종합 순위가 없음(gu_category_cross 는 2개 구 비교, gu_category_concentration 은 업종 고정)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "영업 재고 1위 자치구는 강남구로 활성 109,134곳, 최근 1년 개업 12,746곳(개업률 11.7%), 누적 대비 잔존율 34.3%다."
              sql: |
                -- :metric='active', :dir='desc', :n=10
                WITH per_gu AS (
                  SELECT gu, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                         ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct,
                         ROUND(100.0 * SUM(active_cnt) / NULLIF(SUM(total_cnt), 0), 1) AS alive_pct
                  FROM d1_dong_category_matrix
                  WHERE gu_code <> 'UNK'
                  GROUP BY gu
                )
                SELECT gu, active_total, opened_1y, open_rate_pct, alive_pct
                FROM per_gu
                ORDER BY
                  CASE WHEN :dir = 'desc' THEN
                    CASE :metric WHEN 'active' THEN active_total WHEN 'opened' THEN opened_1y
                                 WHEN 'open_rate' THEN open_rate_pct WHEN 'alive' THEN alive_pct END
                  END DESC,
                  CASE WHEN :dir = 'asc' THEN
                    CASE :metric WHEN 'active' THEN active_total WHEN 'opened' THEN opened_1y
                                 WHEN 'open_rate' THEN open_rate_pct WHEN 'alive' THEN alive_pct END
                  END ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc], metric: [active, opened, open_rate, alive] }
            - pattern_id: "gu_dong_rank"
              question_ko: "이 자치구(:gu) 안에서 상권이 가장 큰 동네는 어디이고, 구 상권이 그 동에 얼마나 몰려 있나?"
              axes: "gu 고정 → dong 랭킹 + 구내 집중도 비중 — 기존 dong 랭킹(vital_dongs_top 등)은 전서울 대상뿐, 구 내부 뷰 부재"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "강남구 상권 1위 동은 역삼1동으로 활성 8,926곳 — 구 동 매핑분의 23.8%가 이 한 동에 몰려 있고 최근 1년 개업률은 10.8%다."
              sql: |
                -- :gu='강남구', :n=10
                SELECT admin_dong, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct,
                       ROUND(100.0 * SUM(active_cnt) / SUM(SUM(active_cnt)) OVER (), 1) AS share_in_gu_pct
                FROM d1_dong_category_matrix
                WHERE gu = :gu AND admin_dong_code <> 'UNK'
                GROUP BY admin_dong_code, admin_dong
                ORDER BY active_total DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, window, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "category_lq_dongs"
              question_ko: "이 업종(:category_ko)이 '상대적으로' 특화된 동네는 어디인가? (절대 개수가 아니라 동 내 비중 ÷ 서울 평균 비중 = LQ)"
              axes: "category 고정 → dong 랭킹(상대 특화도 LQ) — category_top_dongs(절대 개수)의 비율 관점 반전, 동 크기 효과 제거"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "약국 특화도 1위는 강북구 삼양동(LQ 46.36) — 동 내 활성업소의 71.4%(5곳)가 약국으로, 서울 평균 비중의 46배다."
              sql: |
                -- :category_ko='약국', :min_cat=5, :n=10
                WITH cell AS (
                  SELECT admin_dong_code, admin_dong, gu, SUM(active_cnt) AS cat_active
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK' AND category_ko = :category_ko
                  GROUP BY admin_dong_code, admin_dong, gu
                ), dong_tot AS (
                  SELECT admin_dong_code, SUM(active_cnt) AS dong_active
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK'
                  GROUP BY admin_dong_code
                ), city AS (
                  SELECT 1.0 * (SELECT SUM(cat_active) FROM cell) / (SELECT SUM(dong_active) FROM dong_tot) AS city_share
                )
                SELECT c.admin_dong, c.gu, c.cat_active,
                       ROUND(100.0 * c.cat_active / t.dong_active, 1) AS share_in_dong_pct,
                       ROUND((1.0 * c.cat_active / t.dong_active) / ct.city_share, 2) AS lq
                FROM cell c, dong_tot t, city ct
                WHERE t.admin_dong_code = c.admin_dong_code
                  AND c.cat_active >= :min_cat
                ORDER BY lq DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { min_cat: 5, n: 10 }
            - pattern_id: "dong_survival_rank"
              question_ko: "누적 인허가 대비 살아남은 비율(잔존율)이 가장 낮은/높은 동네는 어디인가? (:category_ko='ALL'=전 업종, :dir ∈ {asc,desc})"
              axes: "dong 랭킹(누적 잔존율·소멸 스톡) + category 센티널 — category_survival_stock(업종 단위)의 dong 스케일판. dormant_dongs(최근 1년 개업률)와 달리 장기 생존 관점"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "잔존율 최저 동네는 강남구 압구정동 — 누적 6,403곳 중 547곳만 남아 잔존율 8.5%, 소멸 스톡 5,856곳이다."
              sql: |
                -- :category_ko='ALL', :min_total=500, :dir='asc', :n=10
                SELECT admin_dong, gu, SUM(active_cnt) AS active_cnt, SUM(total_cnt) AS total_cnt,
                       SUM(total_cnt) - SUM(active_cnt) AS gone_cnt,
                       ROUND(100.0 * SUM(active_cnt) / SUM(total_cnt), 1) AS alive_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                  AND (:category_ko = 'ALL' OR category_ko = :category_ko)
                GROUP BY admin_dong_code, admin_dong, gu
                HAVING SUM(total_cnt) >= :min_total
                ORDER BY CASE WHEN :dir = 'asc' THEN 100.0 * SUM(active_cnt) / SUM(total_cnt) END ASC,
                         CASE WHEN :dir = 'desc' THEN 100.0 * SUM(active_cnt) / SUM(total_cnt) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { category_ko: "ALL", min_total: 500, dir: "asc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "dong_diversity_rank"
              question_ko: "한 업종에 편중된 동네와 업종이 고르게 다양한 동네는 어디인가? (:dir='desc'=편중, 'asc'=다양)"
              axes: "dong 랭킹(업종 구성의 편중도: 1위 업종 비중) + 1위 업종명 — dong_signature_category(1위 업종의 도시 분포)와 달리 동 자체의 편중 정도를 순위화"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "업종 편중 1위는 성동구 마장동 — 활성 2,621곳의 81.3%가 축산 단일 업종이다(11개 업종 모두 보유하되 축산 쏠림)."
              sql: |
                -- :dir='desc', :min_active=200, :n=10
                WITH per_dong AS (
                  SELECT admin_dong_code, admin_dong, gu,
                         SUM(active_cnt) AS active_total,
                         SUM(CASE WHEN active_cnt > 0 THEN 1 ELSE 0 END) AS categories_present,
                         MAX(active_cnt) AS top_cat_active
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK'
                  GROUP BY admin_dong_code, admin_dong, gu
                )
                SELECT admin_dong, gu, active_total, categories_present,
                       (SELECT x.category_ko FROM d1_dong_category_matrix x
                        WHERE x.admin_dong_code = per_dong.admin_dong_code
                        ORDER BY x.active_cnt DESC LIMIT 1) AS top_category_ko,
                       ROUND(100.0 * top_cat_active / active_total, 1) AS top_share_pct
                FROM per_dong
                WHERE active_total >= :min_active
                ORDER BY CASE WHEN :dir = 'desc' THEN 100.0 * top_cat_active / active_total END DESC,
                         CASE WHEN :dir = 'asc' THEN 100.0 * top_cat_active / active_total END ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { min_active: 200, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "category_pair_dongs"
              question_ko: "두 업종(:cat_a, :cat_b)이 함께 몰린 동네는 어디이고, 두 업종의 짝 비율은? (예: 의료 대비 약국)"
              axes: "category×category → dong 교차(두 업종 동반 분포) — 기존 패턴은 모두 단일 업종 또는 전 업종 관점, 업종 짝 비교 부재"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "의료·약국 동반 규모 1위는 서초구 서초1동 — 의료 859곳에 약국 118곳으로 의료 1곳당 약국 0.14곳이다."
              sql: |
                -- :cat_a='의료', :cat_b='약국', :n=10
                SELECT admin_dong, gu,
                       SUM(CASE WHEN category_ko = :cat_a THEN active_cnt ELSE 0 END) AS a_active,
                       SUM(CASE WHEN category_ko = :cat_b THEN active_cnt ELSE 0 END) AS b_active,
                       ROUND(1.0 * SUM(CASE WHEN category_ko = :cat_b THEN active_cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN category_ko = :cat_a THEN active_cnt ELSE 0 END), 0), 2) AS b_per_a
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK' AND category_ko IN (:cat_a, :cat_b)
                GROUP BY admin_dong_code, admin_dong, gu
                ORDER BY SUM(active_cnt) DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "category_open_rate_dongs"
              question_ko: "이 업종(:category_ko) 기준 최근 1년 개업률이 가장 높은(뜨는)/낮은(정체) 동네는? (:category_ko='ALL'=전 업종, :dir ∈ {desc,asc})"
              axes: "dong 랭킹(개업률) + category 센티널 + 방향 스위치 — vital_dongs_top(전 업종·절대 개업 desc)과 dormant_dongs(전 업종·개업률 asc)를 업종 축으로 일반화한 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "식품 업종 개업률 1위 동네는 강남구 압구정동 — 활성 411곳에 최근 1년 개업 591건(개업률 143.8%)으로 회전이 재고를 앞선다."
              sql: |
                -- :category_ko='식품', :dir='desc', :min_active=50, :n=10
                SELECT admin_dong, gu, SUM(active_cnt) AS active_cnt, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                  AND (:category_ko = 'ALL' OR category_ko = :category_ko)
                GROUP BY admin_dong_code, admin_dong, gu
                HAVING SUM(active_cnt) >= :min_active
                ORDER BY CASE WHEN :dir = 'desc' THEN 100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0) END DESC,
                         CASE WHEN :dir = 'asc' THEN 100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0) END ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { category_ko: "ALL", min_active: 50, dir: "desc", n: 10 }
              param_enum: { dir: [desc, asc] }
            - pattern_id: "major_breakdown"
              question_ko: "이 대분류(:major_ko)는 어떤 소분류로 구성되나? (규모·신규 유입·잔존율)"
              axes: "major→category 드릴다운 — 기존 패턴이 전혀 쓰지 않던 major 축 개방. 특히 보건 대분류는 8개 소분류를 포괄(문화/산업/환경은 1:1)"
              verified_rows: 8
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "보건 대분류 활성업소의 65.6%는 식품(230,756곳)이며, 식품의 누적 잔존율은 20.9%로 낮은 편이다."
              sql: |
                -- :major_ko='보건'
                SELECT category_ko, SUM(active_cnt) AS active_cnt, SUM(total_cnt) AS total_cnt,
                       SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(active_cnt) / SUM(SUM(active_cnt)) OVER (), 1) AS share_in_major_pct,
                       ROUND(100.0 * SUM(active_cnt) / SUM(total_cnt), 1) AS alive_pct
                FROM d1_dong_category_matrix
                WHERE major_ko = :major_ko
                GROUP BY category_ko
                ORDER BY active_cnt DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "dong_mapping_coverage"
              question_ko: "동 매핑 실패(UNK) 비중이 큰 업종/자치구는 어디인가 — 동 단위 분석 결과를 얼마나 믿을 수 있나? (:dim ∈ {category,gu})"
              axes: "품질·커버리지 단면 — 차원 스위치(category↔gu)로 UNK 스톡 비중. 기존 패턴들이 일괄 제외하는 UNK 의 크기를 정량화하는 메타 패턴"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c62333eea0f042078a861dc06607c87c"
              insight_sample_ko: "산업 업종은 활성 470,277곳 중 93.0%(437,360곳)가 동 미상(UNK)이라 동 단위 분석 커버리지가 사실상 없다."
              sql: |
                -- :dim='category'
                SELECT CASE :dim WHEN 'category' THEN category_ko WHEN 'gu' THEN gu END AS dim_value,
                       SUM(CASE WHEN admin_dong_code = 'UNK' THEN active_cnt ELSE 0 END) AS unk_active,
                       SUM(active_cnt) AS active_total,
                       ROUND(100.0 * SUM(CASE WHEN admin_dong_code = 'UNK' THEN active_cnt ELSE 0 END)
                             / NULLIF(SUM(active_cnt), 0), 1) AS unk_pct
                FROM d1_dong_category_matrix
                WHERE gu_code <> 'UNK'
                GROUP BY CASE :dim WHEN 'category' THEN category_ko WHEN 'gu' THEN gu END
                ORDER BY unk_pct DESC
              requires: [select_columns, sort, aggregate, group_by]
              param_enum: { dim: [category, gu] }
          contract_version: v1
          product_question: 이 동네엔 무슨 업종이 많나?
          grain: 행정동×업종
          primary_key: [admin_dong_code, gu_code, major, category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, gu_code, major, category]
    columns:
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(보존).
        tests: [not_null]
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글).
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
        tests: [not_null]              # PK 근거(#478)
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류(동네 업종 구성축).
        tests: [not_null]
      - name: active_cnt
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: total_cnt
        data_type: bigint
        description: 누적 업소 수(폐업 포함).
      - name: opened_last_365d
        data_type: bigint
        description: 최근 365일 개업 수(동네 활력 — 개업일 보유분 기준).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_geo_grid
    description: 상권 밀집 히트맵 — 좌표 0.005도(약 500m) 격자 × 업종 영업 밀도·최근 신규. 지도 핫스팟 질의(좌표 84%만).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: [d1_geo_grid_overview, d1_geo_grid_detail]
          d1_rollup: overview=(grid_lat,grid_lng,major) 집계 · detail=(grid_lat,grid_lng,major,category) 원 grain
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_geo_grid   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 상권 밀집 격자(개요)
            summary: 서울을 약 500m 격자로 나눠 격자마다 영업 중인 업소 수와 최근 신규 개업 수를 셌습니다.
            caveat: 좌표가 있는 업소만 격자에 담겨 전체의 약 84%를 반영합니다.
            use_cases:
              - 지도 히트맵
              - 상권 핫스팟 탐색
              - 배후 수요 추정
          d1_display:                   # commerce 확장 — 한 모델이 여러 D1 제품을 낳을 때 제품별 덮어쓰기
            d1_geo_grid_detail:
              title: 상권 밀집 격자(업종별)
              summary: 500m 격자를 업종까지 쪼개 격자마다 업종별 영업 업소 수와 최근 신규 개업 수를 담았습니다.
              caveat: 좌표가 있는 업소만 격자에 담겨 전체의 약 84%를 반영합니다.
              use_cases:
                - 업종별 지도 히트맵
                - 격자 단위 경쟁 밀도 확인
                - 출점 후보지 선별
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "hotspot_top_grids"
              d1_table: d1_geo_grid_overview
              question_ko: "서울에서 업소가 가장 밀집한 500m 격자는 어디인가? (전 업종 합산 top-N)"
              axes: "grid(격자)→랭킹 desc, major 합산 소거 — top-N 기본형"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "최대 밀집 격자는 가산디지털단지 일대(37.485,126.895) 4,489곳, 2위 테헤란로 선릉~삼성(37.505,127.055) 4,467곳 — 최근 1년 개업은 후자가 828곳으로 전자(217곳)의 4배."
              sql: |
                -- 예시값: LIMIT 10 (top-N 조정)
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                ORDER BY active_total DESC
                LIMIT 10
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "major_top_grids"
              d1_table: d1_geo_grid_overview
