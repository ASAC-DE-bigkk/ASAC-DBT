              question_ko: "특정 자치구에서 개업(또는 폐업)이 가장 몰렸던 달 top-N 은 언제인가?"
              axes: "자치구 고정 단면 × 시간(ym) 극값 랭킹 — new_worst_net_months(서울 전체·순증)의 구 스코프·이벤트 파라미터판"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "강남구(11680)에서 2016-01 이후 개업이 가장 몰린 달은 2021-01(969건)이다."
              sql: |
                -- :gu_code='11680', :event_type='opened', :ym_from='2016-01', :n=10
