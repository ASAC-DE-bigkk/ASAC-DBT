      - name: business_closed_count
        data_type: bigint
        description: 폐업(03) 업소 수.
      - name: dataset_count
        data_type: bigint
        description: 이 동에 존재하는 업종(dataset) 종수.
      - name: geocoded_count
        data_type: bigint
        description: 좌표(위경도) 보유 업소 수 — 지도 커버리지 배지(geocoded/business).
      - name: latest_collected_at
        data_type: timestamp(6)
        description: 이 동 데이터의 최신 수집 시각(화면 '데이터 기준일').

  - name: gold_license_dong_category_matrix
    description: 우리 동네엔 뭐가 많나 — 행정동 × 중분류 스톡(영업/전체) + 최근 1년 신규 개업. 동네 프로파일/지도 서빙.
    config:
      contract: {enforced: true}
    columns:
      - name: admin_dong_code
