          primary_key: [grid_lat, grid_lng, major, category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [grid_lat, grid_lng, major, category]
    columns:
      - name: grid_lat
        data_type: double
        description: 격자 대표 위도(0.005도 버킷 — 약 500m).
        tests: [not_null]
      - name: grid_lng
        data_type: double
        description: 격자 대표 경도(0.005도 버킷).
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: active_cnt
        data_type: bigint
        description: 격자 내 영업(01) 업소 수(밀도).
        tests: [not_null]
      - name: opened_last_365d_active
        data_type: bigint
        description: 격자 내 최근 365일 개업(현재 영업) 수 — 신규 핫스팟.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_gu_specialization
    description: 우리 구 특화 업종 — 자치구별 업종 특화지수(LQ)·구성비. LQ>1 이면 서울 평균 대비 밀집.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_gu_specialization
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_gu_specialization   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 자치구 업종 특화지수
            summary: 자치구마다 어떤 업종이 서울 평균보다 밀집해 있는지 특화지수(LQ)와 구성비로 나타냈습니다. 1보다 크면 평균보다 많다는 뜻입니다.
            use_cases:
              - 자치구 상권 성격 규정
              - 특화 업종 발굴
              - 지역 브랜딩 근거
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "gu_top_specialized"
              question_ko: "이 자치구는 어떤 업종에 특화됐나? (:gu 단면, LQ 랭킹)"
              axes: "구 고정(:param 단면) → 업종 랭킹(LQ 기준). 짝: category_top_gus 와 축 반전 1쌍."
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: ":gu='성동구' 실행 — 축산 LQ 5.78(서울 평균의 5.8배, 2,487곳)로 압도적 1위, 2위 환경(1.24)과 격차가 매우 큼. 구성비 1위는 산업(47.6%)이지만 LQ 0.97로 특화 아님."
              sql: |
                SELECT category_ko, major_ko, active_cnt, ROUND(share_in_gu*100,1) AS share_pct, lq FROM d1_gu_specialization WHERE gu = :gu ORDER BY lq DESC LIMIT 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_top_gus"
              question_ko: "이 업종은 어느 구에 특화돼 있나? (:category 단면, 축 반전)"
              axes: "업종 고정(:param 단면) → 구 랭킹(LQ 기준). gu_top_specialized 의 축 반전 짝(1쌍째). (수정: 필터를 영문 코드 컬럼 category 로 — 한글 라벨 비교 시 코드 전달하면 0행)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: ":category='축산' 실행 — 1위 성동구(LQ 5.78, 2,487곳), 2위 금천구(2.00, 820곳), 3위 송파(1.42)부터 급락. 마장동 축산시장 클러스터가 데이터로 확인됨."
              sql: |
                SELECT gu, active_cnt, ROUND(share_in_gu*100,2) AS share_pct, lq FROM d1_gu_specialization WHERE category = :category AND gu_code != 'UNK' ORDER BY lq DESC LIMIT 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "seoul_top_lq"
              question_ko: "서울 전체에서 가장 강한 특화(구×업종 조합) top-N은?"
              axes: "전역 랭킹 top-N (구×업종 조합, 소표본 노이즈 컷 active_cnt>=50)."
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "서울 최강 특화는 성동 축산 5.78, 중구 숙박 3.59, 종로 숙박 3.24 순 — 도심 2개 구가 숙박을, 성동·금천이 축산을 양분."
              sql: |
                SELECT gu, category_ko, active_cnt, lq FROM d1_gu_specialization WHERE gu_code != 'UNK' AND active_cnt >= 50 ORDER BY lq DESC LIMIT 15
              requires: [select_columns, sort, filter_range]
            - pattern_id: "gu_composition"
              question_ko: "이 구의 업종 구성(절대 규모·비중)은 어떻게 되나? (:gu 단면)"
              axes: "구 고정(:param 단면) → 업종 구성 랭킹(절대 규모 기준). 짝: category_volume_gus 와 축 반전 2쌍째. LQ 랭킹(gu_top_specialized)과 '특화 vs 비중' 대비."
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: ":gu='마포구' 실행 — 산업 29,370곳(48.4%)·식품 21.2%·문화 19.2%가 상위 3개. 문화 비중이 타 구 대비 높아 LQ 1.52로 특화까지 겸함."
              sql: |
                SELECT category_ko, major_ko, active_cnt, ROUND(share_in_gu*100,1) AS share_pct FROM d1_gu_specialization WHERE gu = :gu ORDER BY active_cnt DESC
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_volume_gus"
              question_ko: "이 업종의 절대 규모가 가장 큰 구는? (특화와 규모의 괴리 확인, 축 반전)"
              axes: "업종 고정(:param 단면) → 구 랭킹(절대 규모 기준). gu_composition 의 축 반전 짝(2쌍째). (수정: 필터를 영문 코드 컬럼 category 로 — 한글 라벨 비교 시 코드 전달하면 0행)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: ":category='식품' 실행 — 절대 규모 1위 강남(23,885곳)이지만 LQ 0.911로 비특화. 규모 top10 중 LQ 최고는 종로(1.21) — '많다'와 '특화됐다'가 다름을 보여주는 대표 사례."
              sql: |
                SELECT gu, active_cnt, lq FROM d1_gu_specialization WHERE category = :category AND gu_code != 'UNK' ORDER BY active_cnt DESC LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "niche_vs_anchor"
              question_ko: "특화 업종(LQ>=1.5) 중 대규모 앵커형과 소규모 니치형은 각각 어디인가? (LQ×규모 두 축 교차)"
              axes: "두 축 교차: LQ(특화 강도) × active_cnt(규모) 사분면 분류."
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "LQ 1.5 이상 21개 조합 중 '대규모 특화'는 8개 — 마포 문화(11,661곳, 1.52)·중구 문화(9,919곳, 1.71)가 규모·특화 동시 달성, 중구·종로 숙박은 수백 곳 규모의 니치 특화."
              sql: |
                SELECT gu, category_ko, active_cnt, lq, CASE WHEN active_cnt >= 1000 THEN '대규모 특화' ELSE '니치 특화' END AS type FROM d1_gu_specialization WHERE gu_code != 'UNK' AND lq >= 1.5 ORDER BY lq DESC
              requires: [select_columns, sort, filter_range]
            - pattern_id: "gu_major_mix"
              question_ko: "구별 대분류(산업/보건/문화/환경) 구성은 어떻게 다른가? (구×대분류 피벗)"
              axes: "두 축 교차: 구(행) × 대분류(피벗 열), 절대 규모."
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "총 규모 1위 강남(108,998곳: 산업 51,286·보건 37,602). 25개 구 중 서대문·은평·노원 3곳만 보건이 산업을 역전 — 주거형 상권 신호."
              sql: |
                SELECT gu, SUM(CASE WHEN major='industry' THEN active_cnt ELSE 0 END) AS industry_cnt, SUM(CASE WHEN major='health' THEN active_cnt ELSE 0 END) AS health_cnt, SUM(CASE WHEN major='culture' THEN active_cnt ELSE 0 END) AS culture_cnt, SUM(CASE WHEN major='environment' THEN active_cnt ELSE 0 END) AS env_cnt, SUM(active_cnt) AS total_cnt FROM d1_gu_specialization WHERE gu_code != 'UNK' GROUP BY gu ORDER BY total_cnt DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu_concentration_hhi"
              question_ko: "어느 구가 소수 업종에 편중됐고 어느 구가 균형 잡혔나? (HHI 집중도 랭킹)"
              axes: "구 랭킹 top-N (파생 지표 HHI = Σ share² — 높을수록 소수 업종 편중)."
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "업종 집중도 최고 서초 0.372(산업 56.2% 편중), 최저 서대문 0.279 — 서대문이 서울에서 가장 균형 잡힌 업종 구성."
              sql: |
                SELECT gu, ROUND(SUM(share_in_gu*share_in_gu),4) AS hhi, SUM(active_cnt) AS total_cnt FROM d1_gu_specialization WHERE gu_code != 'UNK' GROUP BY gu ORDER BY hhi DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_geo_spread"
              question_ko: "어떤 업종이 지역적으로 가장 편중돼 있나? (업종별 LQ 격차 랭킹)"
              axes: "업종 랭킹 top-N (구간 LQ 격차 = 지리적 편중도)."
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "지역 편중 1위 축산(LQ 격차 5.42, 성동 쏠림), 2위 숙박(3.42, 도심 쏠림). 최소는 산업(0.36) — 47만 곳이 전 구에 고르게 분포."
              sql: |
                SELECT category_ko, COUNT(*) AS gu_cnt, MIN(lq) AS lq_min, MAX(lq) AS lq_max, ROUND(MAX(lq)-MIN(lq),3) AS lq_range, SUM(active_cnt) AS seoul_cnt FROM d1_gu_specialization WHERE gu_code != 'UNK' GROUP BY category_ko ORDER BY lq_range DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "inv_lq_lowest"
              question_ko: "이 업종이 상대적으로 가장 결핍된(LQ 최저) 자치구는? (특화 랭킹의 정렬 반전)"
              axes: "자치구 랭킹 — LQ ASC(특화 top 랭킹의 반전 = 공백 상권 탐색)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "식품 LQ 최저는 서초구 0.746 — 절대 규모(12,680곳)는 큰데 상대 특화는 약한 공백 상권."
              sql: |
                -- :category='food', :n=10
                SELECT gu, active_cnt, ROUND(share_in_gu*100,2) AS share_pct, lq
                FROM d1_gu_specialization WHERE category = :category AND gu_code <> 'UNK'
                ORDER BY lq ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "new_gu_fixed_lq_asc"
              question_ko: "이 자치구에서 상대적으로 부족한 업종은? (구의 특화 상위 랭킹의 반전)"
              axes: "자치구 고정(:gu) → 업종 랭킹 LQ ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "강남구가 가장 부족한 업종은 숙박(LQ 0.479, 149곳)."
              sql: |
                -- :gu='강남구'
                SELECT category, active_cnt, ROUND(share_in_gu*100,2) AS share_pct, lq
                FROM d1_gu_specialization WHERE gu = :gu ORDER BY lq ASC LIMIT 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "new_lq_vs_volume_quadrant"
              question_ko: "특화도는 높은데 절대 규모는 작은 업종×구 조합은? (두 지표 사분면)"
              axes: "업종×구 교차 — LQ(상대) × active_cnt(절대) 사분면"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "성동구 축산은 LQ 5.775·2,487곳으로 규모와 특화를 겸비(big_specialized)."
              sql: |
                -- :n=15
                SELECT gu, category, active_cnt, lq,
                       CASE WHEN lq >= 1.2 AND active_cnt < 500 THEN 'niche_specialized'
                            WHEN lq >= 1.2 THEN 'big_specialized'
                            WHEN active_cnt >= 500 THEN 'big_generic' ELSE 'small_generic' END AS quadrant
                FROM d1_gu_specialization WHERE gu_code <> 'UNK'
                ORDER BY lq DESC LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { n: 15 }
            - pattern_id: "x_spec_vs_lifespan"
              question_ko: "특화된 업종은 그 지역에서 더 오래 버티나? (특화도 × 수명 교차)"
              axes: "제품 간 조인 — gu_specialization(LQ) × lifespan(p50 수명)"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "3aa556738a524a81a4f7652b26b19333"
              insight_sample_ko: "서대문구 식품은 LQ 1.337 특화에 수명 중앙값 1,148일 — 특화도와 수명의 동행 여부를 구별로 비교할 수 있다."
              sql: |
                -- :category='food', :min_closed=100
                SELECT s.gu, s.lq, s.active_cnt, l.p50_days, l.n_closed
                FROM d1_gu_specialization s
                JOIN d1_lifespan l ON l.gu_code = s.gu_code AND l.category = s.category
                WHERE s.category = :category AND s.gu_code <> 'UNK' AND l.n_closed >= :min_closed
                ORDER BY s.lq DESC LIMIT 15
              requires: [select_columns, sort, join, filter_range]
              param_defaults: { min_closed: 100 }
            - pattern_id: "x_spec_flow_momentum"
              question_ko: "지금 특화된(LQ>=:min_lq) 구×업종 조합은 최근 몇 년간 순유입이 계속됐나? — 강화 중인 특화 vs 쇠퇴 중인 특화 판별"
              axes: "spec(현재 LQ 스냅샷) ⋈ flow(:y_from~:y_to 기간 합산), 조인 키 gu_code+category. flow 는 (y×event_type) 다중행이라 GROUP BY 로 접어 팬아웃 차단. net ASC 정렬로 '특화인데 유출 중'인 위험 조합이 상단에 옴"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "문화 LQ 1.52로 특화인 마포구가 2021~2025년 개업 836·폐업 2,055로 순유출 -1,219를 기록 — 특화가 쇠퇴 국면에 들어선 대표 조합이다."
              sql: |
                -- :min_lq=1.3, :y_from='2021', :y_to='2025', :n=15
                SELECT s.gu, s.category, s.category_ko, s.lq, s.active_cnt,
                       SUM(CASE WHEN f.event_type='opened' THEN f.cnt ELSE 0 END) AS opened_win,
                       SUM(CASE WHEN f.event_type='closed' THEN f.cnt ELSE 0 END) AS closed_win,
                       SUM(CASE WHEN f.event_type='opened' THEN f.cnt ELSE -f.cnt END) AS net_win
                FROM d1_gu_specialization s
                JOIN d1_flow_yearly f ON f.gu_code = s.gu_code AND f.category = s.category
                WHERE s.lq >= :min_lq AND s.gu_code <> 'UNK' AND f.y BETWEEN :y_from AND :y_to
                GROUP BY s.gu_code, s.gu, s.category, s.category_ko, s.lq, s.active_cnt
                ORDER BY net_win ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
              param_defaults: { min_lq: 1.3, n: 15 }
            - pattern_id: "spec_rank_explorer"
              question_ko: "서울 전체 구×업종 조합에서 (:major 대분류로 좁혀서, 활성 :min_cnt 이상 소표본 컷 후) LQ 상위/하위 :n은? (:major='ALL'이면 전체, :dir ∈ {desc=특화 top, asc=결핍 top})"
              axes: "전역 랭킹 top-N — 센티널(:major) × 임계값(:min_cnt) × 정렬 방향(:dir). 고정 패턴 seoul_top_lq(컷 50·15행·desc 고정)의 파라미터 일반화 상위호환이며 asc 방향은 전역 결핍 탐색이라는 미커버 영역을 연다."
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "활성 50곳 이상 컷을 걸면 서울 전 구×업종 조합 중 특화 1위는 성동구 축산으로, LQ 5.78에 구내 비중 7.67%(활성 2,486곳)다."
              sql: |
                -- :major='ALL', :min_cnt=50, :dir='desc', :n=15
                SELECT gu, category_ko, major_ko, active_cnt, ROUND(share_in_gu*100,2) AS share_pct, lq
                FROM d1_gu_specialization
                WHERE gu_code <> 'UNK'
                  AND (:major = 'ALL' OR major = :major)
                  AND active_cnt >= :min_cnt
                ORDER BY CASE WHEN :dir='asc' THEN lq END ASC,
                         CASE WHEN :dir='desc' THEN lq END DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { major: "ALL", min_cnt: 50, n: 15 }
              param_enum: { dir: [desc, asc] }
            - pattern_id: "major_share_gu_ranking"
              question_ko: "이 대분류(:major) 계열의 비중이 가장 높은 자치구는 어디인가? (구별 대분류 점유율 랭킹)"
              axes: "구 랭킹 top-N — 대분류 축 집계(category보다 한 단계 위). 기존 gu_major_mix 는 4개 대분류 전부를 절대 규모 피벗으로만 주고 특정 대분류 기준 정렬·비중이 없음. 보건 대분류는 8개 업종의 합이라 category 단면 패턴으로는 답할 수 없다."
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "보건 대분류 비중 1위는 은평구로, 활성 24,659곳 중 11,625곳(47.13%)이 보건 계열이다."
              sql: |
                -- :major='health', :n=10
                SELECT gu,
                       SUM(CASE WHEN major = :major THEN active_cnt ELSE 0 END) AS major_cnt,
                       ROUND(SUM(CASE WHEN major = :major THEN share_in_gu ELSE 0 END)*100, 2) AS major_share_pct,
                       SUM(active_cnt) AS total_cnt
                FROM d1_gu_specialization
                WHERE gu_code <> 'UNK'
                GROUP BY gu
                ORDER BY major_share_pct DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { n: 10 }
            - pattern_id: "gu_rank_r_category"
              question_ko: "25개 구 각각의 :r위 업종은 무엇인가? (:metric ∈ {share=구내 비중, lq=특화도} 기준, 전 구 한눈에)"
              axes: "구별 그룹 내 랭킹 단면 — 윈도우 ROW_NUMBER 로 구마다 :r위 업종 1행씩 추출. 기존 gu_top_specialized/gu_composition 은 구 하나를 고정해야 해서 '전 구의 1위(또는 2위) 업종 일람'은 미커버."
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "비중 기준 각 구 1위 업종 가운데 가장 압도적인 곳은 서초구 산업으로, 구내 비중 56.2%(활성 39,746곳, LQ 1.144)다."
              sql: |
                -- :metric='share', :r=1
                SELECT gu, category_ko, major_ko, active_cnt, ROUND(share_in_gu*100,1) AS share_pct, lq
                FROM (
                  SELECT *, ROW_NUMBER() OVER (
                    PARTITION BY gu
                    ORDER BY CASE :metric WHEN 'lq' THEN lq ELSE share_in_gu END DESC
                  ) AS rn
                  FROM d1_gu_specialization
                  WHERE gu_code <> 'UNK'
                )
                WHERE rn = :r
                ORDER BY CASE :metric WHEN 'lq' THEN lq ELSE share_in_gu END DESC
              requires: [select_columns, sort, window, subquery]
              param_enum: { metric: [share, lq] }
            - pattern_id: "gu_pair_profile_diff"
              question_ko: "두 자치구(:gu_a vs :gu_b)의 업종 특화 프로필은 어디서 가장 갈리나? (11개 업종 LQ 나란히 비교)"
              axes: "구 2개 교차 단면 — 조건부 집계 피벗으로 업종별 LQ_a/LQ_b/격차를 한 행에. 기존 패턴은 전부 구 하나 고정 또는 전역 랭킹이라 구 대 구 직접 비교는 미커버."
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "강남구와 금천구가 가장 갈리는 업종은 축산으로, LQ 0.719 대 1.994(격차 -1.275) — 금천구 쪽이 압도적으로 특화돼 있다."
              sql: |
                -- :gu_a='강남구', :gu_b='금천구'
                SELECT category_ko, major_ko,
                       MAX(CASE WHEN gu = :gu_a THEN lq END) AS lq_a,
                       MAX(CASE WHEN gu = :gu_b THEN lq END) AS lq_b,
                       ROUND(MAX(CASE WHEN gu = :gu_a THEN lq END) - MAX(CASE WHEN gu = :gu_b THEN lq END), 3) AS lq_gap,
                       MAX(CASE WHEN gu = :gu_a THEN active_cnt END) AS cnt_a,
                       MAX(CASE WHEN gu = :gu_b THEN active_cnt END) AS cnt_b
                FROM d1_gu_specialization
                WHERE gu IN (:gu_a, :gu_b)
                GROUP BY category_ko, major_ko
                ORDER BY ABS(lq_gap) DESC
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "gu_profile_similarity"
              question_ko: "이 자치구(:gu)와 업종 특화 프로필이 가장 비슷한 구는 어디인가? (11개 업종 LQ 거리 기준 유사 구 top-N)"
              axes: "구 랭킹 top-N — 같은 테이블 셀프 조인으로 업종별 LQ 제곱거리 합을 계산해 프로필 유사도 순 정렬. 기존 패턴에 구 간 유사도 개념 없음."
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "강남구와 특화 프로필이 가장 비슷한 구는 서초구다(11개 업종 LQ 제곱거리 합 0.453)."
              sql: |
                -- :gu='강남구', :n=5
                SELECT b.gu, ROUND(SUM((a.lq - b.lq)*(a.lq - b.lq)), 3) AS lq_dist2, COUNT(*) AS common_categories
                FROM d1_gu_specialization a
                JOIN d1_gu_specialization b ON b.category = a.category AND b.gu <> a.gu AND b.gu_code <> 'UNK'
                WHERE a.gu = :gu AND a.gu_code <> 'UNK'
                GROUP BY b.gu
                ORDER BY lq_dist2 ASC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, sort, join]
              param_defaults: { n: 5 }
            - pattern_id: "category_pair_colocation"
              question_ko: "두 업종(:cat_a, :cat_b)이 동시에 특화된 자치구는 어디인가? (둘 중 낮은 LQ가 높은 순 = 동반 특화 랭킹)"
              axes: "구 랭킹 top-N — 셀프 조인으로 업종 2개의 LQ 를 같은 행에 놓고 MIN(lq_a, lq_b) 내림차순. 기존 category 단면 패턴들은 업종 하나만 고정 가능해 동반 특화(공생 업종 입지) 질문은 미커버."
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "숙박과 식품이 동시에 가장 강하게 특화된 구는 서대문구로, 숙박 LQ 1.655·식품 LQ 1.337(페어 하한 1.337 기준 1위)이다."
              sql: |
                -- :cat_a='lodging', :cat_b='food', :n=10
                SELECT a.gu, a.lq AS lq_a, b.lq AS lq_b, MIN(a.lq, b.lq) AS lq_pair_floor,
                       a.active_cnt AS cnt_a, b.active_cnt AS cnt_b
                FROM d1_gu_specialization a
                JOIN d1_gu_specialization b ON b.gu_code = a.gu_code AND b.category = :cat_b
                WHERE a.category = :cat_a AND a.gu_code <> 'UNK'
                ORDER BY MIN(a.lq, b.lq) DESC
                LIMIT :n
              requires: [select_columns, sort, join]
              param_defaults: { n: 10 }
            - pattern_id: "category_lq_band_census"
              question_ko: "각 업종은 25개 구 중 몇 곳에서 특화(LQ>=:hi)·중립·결핍(LQ<=:lo) 상태인가? (업종별 LQ 밴드 분포)"
              axes: "업종별 분포 집계 — LQ 를 소비자 지정 임계값으로 3개 밴드로 나눠 구 수를 센다. 기존 category_geo_spread 는 min/max 격차만 주고 '몇 개 구에서 특화/결핍인지' 밴드 분포는 미커버."
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "LQ 1.2/0.8 경계 기준으로 안경·치과는 25개 구 중 11곳에서 특화, 5곳에서 결핍 — 특화 구가 가장 넓게 퍼진 업종이다."
              sql: |
                -- :hi=1.2, :lo=0.8
                SELECT category_ko, major_ko,
                       SUM(CASE WHEN lq >= :hi THEN 1 ELSE 0 END) AS specialized_gus,
                       SUM(CASE WHEN lq > :lo AND lq < :hi THEN 1 ELSE 0 END) AS neutral_gus,
                       SUM(CASE WHEN lq <= :lo THEN 1 ELSE 0 END) AS deficient_gus,
                       COUNT(*) AS total_gus
                FROM d1_gu_specialization
                WHERE gu_code <> 'UNK'
                GROUP BY category_ko, major_ko
                ORDER BY specialized_gus DESC
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "seoul_category_baseline"
              question_ko: "서울 전체의 업종 구성(각 업종이 전체 활성 업소에서 차지하는 비중)은 어떻게 되나? (LQ 해석의 기준 분포)"
              axes: "전역 단면 집계 — 업종별 서울 합계와 전체 대비 비중(%). 기존 category_geo_spread 는 합계만 주고 비중(=LQ 의 분모가 되는 기준 분포)은 미커버. 구별 share_in_gu 를 해석하려면 이 기준선이 필요하다."
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "843a034339b549818665da94a21ee19a"
              insight_sample_ko: "서울 전체 1위 업종은 산업으로 활성 470,277곳, 전체의 49.07%를 차지한다 — 이 비중이 각 구 LQ 계산의 분모다."
              sql: |
                -- :n=11
                SELECT category_ko, major_ko, SUM(active_cnt) AS seoul_cnt,
                       ROUND(SUM(active_cnt)*100.0 / (SELECT SUM(active_cnt) FROM d1_gu_specialization WHERE gu_code <> 'UNK'), 2) AS seoul_share_pct,
                       COUNT(*) AS gu_cnt
                FROM d1_gu_specialization
                WHERE gu_code <> 'UNK'
                GROUP BY category_ko, major_ko
                ORDER BY seoul_cnt DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, subquery, sort]
              param_defaults: { n: 11 }
          contract_version: v1
          product_question: 이 자치구는 어떤 업종이 특화됐나(LQ)?
          grain: 자치구×업종
          primary_key: [gu_code, major, category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [gu_code, major, category]
    columns:
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
        tests: [not_null]
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류(특화 판정 업종축).
        tests: [not_null]
      - name: active_cnt
        data_type: bigint
        description: 구 내 해당 업종 영업(01) 업소 수.
      - name: share_in_gu
        data_type: decimal(38,18)
        description: 구 내 업종 구성비 = active_cnt / 구 전체 영업수.
      - name: lq
        data_type: decimal(38,6)
        description: 입지계수 LQ = 구 업종비중 / 서울 업종비중. 1 초과=특화(예 성동 축산 5.8).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_stock_age_band
    description: 신상 상권 vs 노포 상권 — 영업 업소의 업력 밴드(1년 미만~20년+) 분포 × 업종 × 자치구.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_age_band
          d1_rollup: (major,category,gu_code,age_band) SUM(active_cnt) — dataset 드롭
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_age_band   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 업력 구간별 업소 분포
            summary: 영업 중인 업소를 1년 미만부터 20년 이상까지 업력 구간으로 나눠 업종·자치구별 비중을 냈습니다.
            use_cases:
              - 신상 상권·노포 상권 구분
              - 상권 성숙도 비교
              - 세대교체 진행도 파악
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rank_gu_new_share_top"
              question_ko: "'신상 상권'은 어디? — 1년 미만 새 가게 비중이 높은 자치구 top-N"
              axes: "행=gu_code(25), 지표=1년 미만 비중(new_pct) 내림차순 — [축반전 쌍 A] rank_gu_old_share_top 과 관점 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "7ff0a3957e274ea6a57f0265871efca8"
              insight_sample_ko: "1년 미만 비중 1위는 관악구(11620) 10.7%, 이어 서대문(11410) 10.5%·광진(11215) 10.1% — 서울 전체 평균 8.9%(85,683/959,368)를 크게 웃도는 신생 유입 상권."
              sql: |
                -- :top_n 예시 10
                SELECT gu_code,
                       SUM(active_cnt) AS total_cnt,
                       SUM(CASE WHEN age_band='0_lt1y' THEN active_cnt ELSE 0 END) AS new_cnt,
                       ROUND(100.0*SUM(CASE WHEN age_band='0_lt1y' THEN active_cnt ELSE 0 END)/SUM(active_cnt),1) AS new_pct
                FROM d1_age_band
                WHERE gu_code <> 'UNK'
                GROUP BY gu_code
                ORDER BY new_pct DESC
                LIMIT :top_n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rank_gu_old_share_top"
              question_ko: "'노포 상권'은 어디? — 20년+ 노포 비중이 높은 자치구 top-N (신상 랭킹의 관점 반전)"
              axes: "행=gu_code(25), 지표=20년+ 비중(old_pct) 내림차순 — [축반전 쌍 A] rank_gu_new_share_top 의 반대 극단"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "7ff0a3957e274ea6a57f0265871efca8"
              insight_sample_ko: "노포 비중은 원도심이 압도: 중구(11140) 20.9%(9,584곳)·종로(11110) 19.2%로 1·2위, 3위 중랑(11260) 15.9%와 5%p 이상 격차."
              sql: |
                -- :top_n 예시 10
                SELECT gu_code,
                       SUM(active_cnt) AS total_cnt,
