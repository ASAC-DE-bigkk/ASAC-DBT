            - pattern_id: "top_gu_trend"
              question_ko: "기간 내 개업(또는 폐업) 상위 :n 개 자치구의 월별 추이를 롱 포맷으로 한 번에 보면? (랭킹→시계열 결합)"
              axes: "서브쿼리 랭킹으로 상위 구 선별 × 시간(ym) 시계열 전개(롱 포맷: ym×gu 행)"
              verified_rows: 72
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "2024-07~2026-06 개업 상위 3개 구 추이의 첫 행은 2024-07 강서구(11500) 1건이다."
              sql: |
                -- :event_type='opened', :ym_from='2024-07', :ym_to='2026-06', :n=3
                SELECT f.ym, f.gu_code, SUM(f.cnt) AS total
                FROM d1_flow_monthly f
                WHERE f.event_type = :event_type
                  AND f.ym BETWEEN :ym_from AND :ym_to
                  AND f.gu_code IN (
                    SELECT gu_code FROM d1_flow_monthly
                    WHERE event_type = :event_type
                      AND ym BETWEEN :ym_from AND :ym_to
                      AND gu_code <> 'UNK'
                    GROUP BY gu_code
                    ORDER BY SUM(cnt) DESC
                    LIMIT :n
                  )
                GROUP BY f.ym, f.gu_code
                ORDER BY f.ym, total DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery]
              param_defaults: { n: 3 }
          product_id: commerce_flow_monthly   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 서울 인허가 개·폐업 흐름(월별)
            summary: 달마다 업종별·지역별로 몇 곳이 문을 열고 닫았는지 집계했습니다. 상권 증감 추이를 볼 때 기본으로 쓰는 해상도입니다.
            caveat: 완결된 달만 담아 이번 달은 빠집니다.
            use_cases:
              - 자치구별 상권 증감 추이
              - 업종 경기 흐름 비교
              - 창업 시점 판단
          contract_version: v1
          product_question: 개·폐업 흐름 추이(월)
          grain: 월×이벤트×업종×지역3축
          primary_key: [ym, event_type, dataset, gu_code, admin_dong_code, legal_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [ym, event_type, dataset, gu_code, admin_dong_code, legal_code]
    columns:
      - name: ym
        data_type: varchar
        description: 이벤트 발생 연월(YYYY-MM, 문자열). 완결월만(당월 제외).
        config: {meta: {semantic_role: event_month, nullable: false, null_meaning: not_applicable, unit: YYYY-MM}}
        tests: [not_null]              # PK 근거(#478)
      - name: y
        data_type: integer
        description: 연(정수, ym 파생) — 월 데이터의 연 단위 집계용.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        config: {meta: {semantic_role: event_type, nullable: false, null_meaning: not_applicable, unit: category}}
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        config: {meta: {semantic_role: administrative_area_id, nullable: false, null_meaning: not_applicable; 미매핑은 UNK 값으로 표현, unit: code}}
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(비율은 품질 실측으로 관측).
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류(health/culture/industry/environment).
        config: {meta: {semantic_role: major_category, nullable: false, null_meaning: not_applicable, unit: category}}
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        config: {meta: {semantic_role: category, nullable: true, null_meaning: taxonomy 중분류가 지정되지 않음, unit: category}}
      - name: cnt
        data_type: bigint
        description: 월별 개업/폐업 건수.
        config: {meta: {semantic_role: measure, nullable: false, null_meaning: not_applicable, unit: count}}
        tests: [not_null]
      - name: src_collected_at
        data_type: timestamp(6)
        description: >-
          이 행을 만든 빌드가 반영한 원천 수집 시각.
          다음 갱신은 이 시각 이후 바뀐 기간만 다시 계산해 바꿔 넣습니다.
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_flow_yearly
    description: 개업/폐업 흐름 연 grain × 업종3단 × 지역3축 — 장기(수십 년) 상권 추세. 완결연만(당년 제외). 소급 신고가 건드린 연도는 다음 증분이 그 연도만 재계산해 교체(#603, src_collected_at 워터마크).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_flow_yearly
          d1_rollup: (y,event_type,major,category,gu_code) SUM(cnt) — dataset/dong 드롭, y→varchar
          event_time: y                       # 시간축(#478 v1) — _catalog.time_axis/freshness(타 도메인 동형)
          freshness_slo_minutes: 1051200   # 730일(2년). 완결연 grain: y='YYYY' 를 연초로 파싱하면 최신 이벤트연이 최대 약 730일 전. 게시 지연 감시는 publication_trigger.max_interval_minutes(26h) 담당
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rank_gu_by_event_year"
              question_ko: "특정 연도에 개업(또는 폐업)이 가장 많았던 자치구 top-N은?"
              axes: "연도·이벤트 고정 → 자치구 랭킹(top-N). 축 반전쌍 A의 정방향(trend_one_gu_yearly와 차원 교환)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 개업 1위는 강남구 14,217건으로 2위 서초구(7,954건)의 1.8배 — 상위 4개 구(강남·서초·송파·마포)가 뚜렷한 선두 그룹."
              sql: |
                -- 예시값: :y='2024', :event_type='opened', :n=10
                SELECT f.gu_code, g.gu, SUM(f.cnt) AS cnt
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.event_type = :event_type AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu
                ORDER BY cnt DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "trend_one_gu_yearly"
              question_ko: "특정 자치구의 연도별 개업·폐업·순증 추이는? (rank_gu_by_event_year의 축 반전: 구 고정→연도 나열)"
              axes: "자치구 고정 → 연도 시계열(개업/폐업/순증). 축 반전쌍 A의 역방향(차원 교환)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "강남구 순증은 2020~21년 7,000건대로 정점 후 2024~25년 3,800건대로 반토막 — 개업은 유지(1.4만)되나 폐업이 2015년 5,825→2024년 10,356건으로 늘어난 탓."
              sql: |
                -- 예시값: :gu_code='11680'(강남구), :y_from='2015', :y_to='2025'
                SELECT y,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE gu_code = :gu_code AND y BETWEEN :y_from AND :y_to
                GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rank_category_net_top"
              question_ko: "특정 연도에 순증(개업-폐업)이 가장 큰 업종은?"
              axes: "연도 고정 → 업종(중분류) 랭킹, 순증 내림차순. 축 반전쌍 B의 정방향"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 순증 1위는 산업(industry) +20,073건으로 압도적(개업 58,755·폐업 38,682) — 2위 문화 +1,933건과 10배 차이."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT major, category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE y = :y
                GROUP BY major, category
                ORDER BY net DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { n: 5 }
            - pattern_id: "rank_category_net_bottom"
              question_ko: "특정 연도에 순감(폐업 초과)이 가장 심한 업종은? (rank_category_net_top의 정렬 반전)"
              axes: "연도 고정 → 업종 랭킹, 순증 오름차순(순감 우선). 축 반전쌍 B의 역방향(정렬 반전)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 순감 업종은 식품(food) -6,547건과 축산(livestock) -234건 단 둘 — 나머지 9개 업종은 모두 순증이라 '식품 폐업 초과'가 유일한 대형 수축축."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT major, category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE y = :y
                GROUP BY major, category
                ORDER BY net ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { n: 5 }
            - pattern_id: "timeseries_category_flow"
              question_ko: "특정 업종의 연도별 개업·폐업·순증 시계열은? (변곡점 탐지)"
              axes: "업종 고정 → 연도 시계열(시간축 y)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "식품업 순증은 2020~22년 +5,600~7,200건에서 2023년 +4건으로 급락, 2024년 -6,547건·2025년 -4,863건 — 2024년부터 폐업(45,739)이 개업(39,192)을 추월하는 구조 전환."
              sql: |
                -- 예시값: :category='food', :y_from='2016', :y_to='2025'
                SELECT y,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE category = :category AND y BETWEEN :y_from AND :y_to
                GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "slice_flow_cell"
              question_ko: "특정 연도×자치구×업종 한 단면의 개업·폐업 원값은? (:param 단면 조회)"
              axes: "y×gu_code×category 전축 고정 → event_type 2행 단면(저장 grain 그대로)"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 강남구 식품업: 개업 4,439건 vs 폐업 4,834건 — 서울 개업 1위 구에서도 식품업은 순감(-395건)."
              sql: |
                -- 예시값: :y='2024', :gu_code='11680'(강남구), :category='food'
                SELECT y, event_type, major, category, gu_code, cnt
                FROM d1_flow_yearly
                WHERE y = :y AND gu_code = :gu_code AND category = :category
                ORDER BY event_type
              requires: [select_columns, sort]
            - pattern_id: "cross_gu_category_net"
              question_ko: "특정 연도·대분류에서 자치구×업종 교차로 어느 조합이 가장 수축/성장했나?"
              axes: "연도·대분류 고정 → 자치구 × 중분류 두 축 교차(셀 랭킹)"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 보건 대분류의 순감 상위 15개 셀은 전부 식품업 — 1위 강서구 -1,034건(개업 1,933·폐업 2,967), 2위 종로구 -777건으로 식품 수축이 특정 구가 아닌 전역 현상임을 보여줌."
              sql: |
                -- 예시값: :y='2024', :major='health', :n=15 (성장 조합은 ORDER BY net DESC로 반전)
                SELECT f.gu_code, g.gu, f.category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.major = :major AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu, f.category
                ORDER BY net ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
              param_defaults: { n: 15 }
            - pattern_id: "decade_longrun_flow"
              question_ko: "10년 단위로 본 서울 인허가 개업·폐업의 장기(1900~2025) 물결은?"
              axes: "시간축 재버킷(연→10년대) 장기 시계열"
              verified_rows: 13
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "개업은 1990s 32.9만→2000s 68.7만→2010s 93.9만으로 정점, 2020s는 6년치만으로 76.8만. 폐업 기록은 1980s 이전 사실상 0(전산화 이전) — 장기 비교는 개업축만 신뢰 가능."
              sql: |
                -- 파라미터 없음(전 기간). 필요시 WHERE y >= :y_from ('1960') 추가
                SELECT CAST(CAST(y AS INTEGER)/10*10 AS TEXT) || 's' AS decade,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed
                FROM d1_flow_yearly
                GROUP BY CAST(y AS INTEGER)/10*10
                ORDER BY CAST(y AS INTEGER)/10*10
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "rank_gu_closure_pressure"
              question_ko: "특정 연도에 개업 대비 폐업 압력(폐업/개업 비율)이 가장 높은 자치구는? (개업량 랭킹의 관점 반전)"
              axes: "연도 고정 → 자치구 랭킹(절대량 아닌 비율 지표 — 볼륨 랭킹의 관점 반전)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 폐업/개업 비율 1위는 서대문구 1.208(개업 2,905 vs 폐업 3,510)로 유일하게 종로구(1.028)와 함께 1.0 초과 — 개업 절대량 1위 강남구는 이 랭킹엔 없음."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT f.gu_code, g.gu,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS close_per_open
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu
                ORDER BY close_per_open DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
              param_defaults: { n: 5 }
            - pattern_id: "inv_closed_yearly_top"
              question_ko: "연도별 폐업이 가장 많았던 해는? (개업 관점의 반전)"
              axes: "연도 랭킹 — 폐업 DESC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "폐업이 가장 많았던 해는 2024년 99,361건."
              sql: |
                -- :n=10
                SELECT y, SUM(cnt) AS closed_cnt
                FROM d1_flow_yearly WHERE event_type='closed' AND y >= '2010'
                GROUP BY y ORDER BY closed_cnt DESC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "new_yoy_growth"
              question_ko: "전년 대비 개업 증가율이 가장 높았던 해는? (절대량 대신 증감률)"
              axes: "연도 시계열 — YoY 증감률(절대량 관점의 파생 반전)"
              verified_rows: 14
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2012년 개업 82,807건이 기준점(직전 연도 없어 증감률 null) — 이후 연도부터 YoY 해석."
              sql: |
                -- :y_from='2012'
                WITH y AS (SELECT y, SUM(cnt) AS opened FROM d1_flow_yearly
                           WHERE event_type='opened' AND y >= :y_from GROUP BY y)
                SELECT y, opened, LAG(opened) OVER (ORDER BY y) AS prev,
                       ROUND(100.0*(opened - LAG(opened) OVER (ORDER BY y))/NULLIF(LAG(opened) OVER (ORDER BY y),0),1) AS yoy_pct
                FROM y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
            - pattern_id: "x_flow_open_vs_surviving_stock"
              question_ko: "임의 기간(:y_from~:y_to) 개업 유입이 많았는데 현존 재고가 그에 못 미치는 구×업종 조합은? — 유입 대비 잔존(소모전) 셀 랭킹"
              axes: "flow(기간 개업 합산, GROUP BY 로 y×event 팬아웃 접기) ⋈ spec(현재 active_cnt), 조인 키 gu_code+category. stock_per_open = 현존 재고 / 기간 개업 — 낮을수록 유입이 재고로 안 쌓이는 고소모 셀. 창 이전 개업분이 재고에 포함되므로 1 초과 가능(러프한 프록시임을 명시)"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "유입 대비 잔존 최하위는 양천구 food — 기간 개업 6,057곳 대비 현존 재고 6,144곳(1.01배)으로, 유입이 순재고 확대로 이어지지 않고 교체만 도는 소모전 셀이다."
              sql: |
                -- :y_from='2010', :y_to='2025', :min_opened=500, :n=15
                SELECT f.gu_code, s.gu, f.category,
                       SUM(CASE WHEN f.event_type='opened' THEN f.cnt ELSE 0 END) AS opened_win,
                       s.active_cnt AS current_active,
                       ROUND(1.0*s.active_cnt/NULLIF(SUM(CASE WHEN f.event_type='opened' THEN f.cnt ELSE 0 END),0),3) AS stock_per_open
                FROM d1_flow_yearly f
                JOIN d1_gu_specialization s ON s.gu_code = f.gu_code AND s.category = f.category
                WHERE f.y BETWEEN :y_from AND :y_to AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, s.gu, f.category, s.active_cnt
                HAVING SUM(CASE WHEN f.event_type='opened' THEN f.cnt ELSE 0 END) >= :min_opened
                ORDER BY stock_per_open ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, join, filter_range]
              param_defaults: { min_opened: 500, n: 15 }
            - pattern_id: "trend_gu_category_flow"
              question_ko: "특정 자치구×업종(중분류) 조합의 연도별 개업·폐업·순증 추이는? (기존 구-전체/업종-전체 시계열이 못 보는 두 축 동시 고정)"
              axes: "자치구×업종 두 축 고정 → 연도 시계열(개업/폐업/순증). trend_one_gu_yearly(구만 고정)와 timeseries_category_flow(업종만 고정)의 교차 결측 지점"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "강남구(11680) food 업종은 2022년 개업 4,591건·폐업 0건, 순증 +4,591로 구간을 시작한다."
              sql: |
                -- :gu_code='11680', :category='food', :y_from='2022', :y_to='2025'
                SELECT y,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE gu_code = :gu_code AND category = :category AND y BETWEEN :y_from AND :y_to
                GROUP BY y
                ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rank_net_by_dim_window"
              question_ko: "특정 기간(:y_from~:y_to) 누적 순증(개업-폐업)이 가장 크거나(:dir='desc') 가장 작은(:dir='asc') 축값은? :dim ∈ {gu, category, major} 로 자치구/중분류/대분류 축을 선택한다."
              axes: "기간 창 합산 → 선택 차원 랭킹(순증 기준, 정렬 방향 선택). 기존 단일 연도 고정 랭킹(rank_category_net_top/bottom)의 기간·차원·방향 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2022~2025년 누적 순증 1위 업종은 industry로 개업 153,391건·폐업 76,386건, 순증 +77,005건이다."
              sql: |
                -- :dim='category', :y_from='2022', :y_to='2025', :dir='desc', :n=10
                SELECT CASE :dim WHEN 'gu' THEN gu_code WHEN 'major' THEN major ELSE category END AS dim_value,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE y BETWEEN :y_from AND :y_to
                  AND (:dim <> 'gu' OR gu_code <> 'UNK')
                GROUP BY CASE :dim WHEN 'gu' THEN gu_code WHEN 'major' THEN major ELSE category END
                ORDER BY CASE WHEN :dir='asc' THEN SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) END ASC,
                         CASE WHEN :dir='desc' THEN SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dim: [gu, category, major], dir: [asc, desc] }
            - pattern_id: "composition_share_by_dim"
              question_ko: "특정 연도·이벤트(개업/폐업)의 구성비는? :dim ∈ {major, category, gu} 로 대분류/중분류/자치구 축을 골라 점유율(%)을 본다."
              axes: "연도·이벤트 고정 → 선택 차원 구성비(점유율 %) 단면. 기존 랭킹 패턴은 절대량만 주고 전체 대비 비중은 없음"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2024년 개업의 대분류 구성은 industry가 37,076건으로 전체의 52.7%를 차지해 1위다."
              sql: |
                -- :y='2024', :event_type='opened', :dim='major'
                SELECT CASE :dim WHEN 'category' THEN category WHEN 'gu' THEN gu_code ELSE major END AS dim_value,
                       SUM(cnt) AS total_cnt,
                       ROUND(100.0 * SUM(cnt) / SUM(SUM(cnt)) OVER (), 1) AS share_pct
                FROM d1_flow_yearly
                WHERE y = :y AND event_type = :event_type
                  AND (:dim <> 'gu' OR gu_code <> 'UNK')
                GROUP BY CASE :dim WHEN 'category' THEN category WHEN 'gu' THEN gu_code ELSE major END
                ORDER BY total_cnt DESC
              requires: [select_columns, sort, aggregate, group_by, window, filter_range]
              param_enum: { dim: [major, category, gu] }
            - pattern_id: "compare_two_years_by_gu"
              question_ko: "두 시점(:y1 → :y2) 사이 자치구별 개업(또는 폐업) 증감량·증감률은? :dir ∈ {asc, desc} 로 급증/급감 어느 쪽을 앞세울지 고른다."
              axes: "두 연도 단면 비교 → 자치구 랭킹(증감량·증감률). 연속 시계열(new_yoy_growth, 서울 전체)과 달리 임의 두 시점을 자치구 축으로 대조"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2023년 대비 2024년 개업 증가 1위는 서초구(11650)로 706건에서 7,831건으로 +7,125건(+1009.2%) 늘었다."
              sql: |
                -- :event_type='opened', :y1='2023', :y2='2024', :dir='desc', :n=10
                WITH cmp AS (
                  SELECT f.gu_code, g.gu,
                         SUM(CASE WHEN f.y = :y1 THEN f.cnt ELSE 0 END) AS y1_cnt,
                         SUM(CASE WHEN f.y = :y2 THEN f.cnt ELSE 0 END) AS y2_cnt
                  FROM d1_flow_yearly f
                  LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                  WHERE f.event_type = :event_type AND f.y IN (:y1, :y2) AND f.gu_code <> 'UNK'
                  GROUP BY f.gu_code, g.gu
                )
                SELECT gu_code, gu, y1_cnt, y2_cnt,
                       y2_cnt - y1_cnt AS diff,
                       ROUND(100.0 * (y2_cnt - y1_cnt) / NULLIF(y1_cnt, 0), 1) AS pct_change
                FROM cmp
                ORDER BY CASE WHEN :dir='asc' THEN y2_cnt - y1_cnt END ASC,
                         CASE WHEN :dir='desc' THEN y2_cnt - y1_cnt END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, subquery, join, filter_range]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "rank_category_closure_pressure"
              question_ko: "특정 연도(선택적으로 특정 자치구 안)에서 개업 대비 폐업 압력(폐업/개업 비율)이 가장 높은 업종은? :gu_code='ALL'이면 서울 전체, 자치구 코드를 주면 그 구 안에서만. :min_opened 미만 소표본 업종은 제외."
              axes: "연도(±자치구) 고정 → 업종 랭킹(비율 지표). 기존 rank_gu_closure_pressure(자치구 축)의 업종 축 대응 + 소표본 컷"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2024년 서울 전체 폐업 압력 1위 업종은 livestock으로 개업 372건 대비 폐업 619건, 폐업/개업 비율 1.664다."
              sql: |
                -- :y='2024', :gu_code='ALL', :min_opened=20, :n=10
                SELECT category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       ROUND(1.0 * SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END), 0), 3) AS close_per_open
                FROM d1_flow_yearly
                WHERE y = :y AND (:gu_code = 'ALL' OR gu_code = :gu_code)
                GROUP BY category
                HAVING SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) >= :min_opened
                ORDER BY close_per_open DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { gu_code: "ALL", min_opened: 20, n: 10 }
            - pattern_id: "peak_year_by_gu"
              question_ko: "지정 기간 안에서 각 자치구의 개업(또는 폐업)이 정점이었던 해는 언제이고 그때 규모는? (구별 전성기/최악기 지도)"
              axes: "자치구별 극값 연도 탐지(윈도우 랭킹) — 기존 패턴엔 없는 '축값별 argmax' 형태"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2000~2025년 개업 정점 규모 1위는 마포구(11440)로, 2022년 8,174건이 최고치다."
              sql: |
                -- :event_type='opened', :y_from='2000', :y_to='2025'
                WITH g AS (
                  SELECT gu_code, y, SUM(cnt) AS cnt_sum
                  FROM d1_flow_yearly
                  WHERE event_type = :event_type AND y BETWEEN :y_from AND :y_to AND gu_code <> 'UNK'
                  GROUP BY gu_code, y
                )
                SELECT p.gu_code, s.gu, p.y AS peak_year, p.cnt_sum AS peak_cnt
                FROM (
                  SELECT gu_code, y, cnt_sum,
                         ROW_NUMBER() OVER (PARTITION BY gu_code ORDER BY cnt_sum DESC, y DESC) AS rn
                  FROM g
                ) p
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) s ON s.gu_code = p.gu_code
                WHERE p.rn = 1
                ORDER BY p.cnt_sum DESC
              requires: [select_columns, sort, aggregate, group_by, subquery, window, join, filter_range]
            - pattern_id: "trend_gu_share_of_city"
              question_ko: "특정 자치구의 개업(또는 폐업)이 서울 전체에서 차지하는 점유율은 연도별로 커지고 있나 줄고 있나?"
              axes: "자치구 고정 → 연도 시계열(전체 대비 점유율 %). 절대량 시계열(trend_one_gu_yearly)의 비중 관점 반전"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "강남구(11680) 개업의 서울 점유율은 2022년 7,315/93,974건, 7.78%에서 구간을 시작한다."
              sql: |
                -- :gu_code='11680', :event_type='opened', :y_from='2022', :y_to='2025'
                WITH t AS (
                  SELECT y,
                         SUM(CASE WHEN gu_code = :gu_code THEN cnt ELSE 0 END) AS gu_cnt,
                         SUM(cnt) AS city_cnt
                  FROM d1_flow_yearly
                  WHERE event_type = :event_type AND y BETWEEN :y_from AND :y_to
                  GROUP BY y
                )
                SELECT y, gu_cnt, city_cnt,
                       ROUND(100.0 * gu_cnt / NULLIF(city_cnt, 0), 2) AS share_pct
