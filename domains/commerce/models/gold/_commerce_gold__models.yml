              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_n: 50, n: 10 }
            - pattern_id: "new_status_group_rollup"
              question_ko: "상태군별 전체 체류기간 프로필은? (상위 축 롤업)"
              axes: "상태군(status_group) 롤업 — dataset 축을 접은 상위 집계"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "폐업 세그먼트 156만건·가중평균 141.6일. max 226일은 관측창 상한이라 상태군 간 max 비교는 무의미."
              sql: |
                SELECT status_group, COUNT(*) AS dataset_cells, SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days*n_segments)/SUM(n_segments),1) AS w_avg_days,
                       MAX(max_days) AS max_days
                FROM d1_status_duration GROUP BY status_group ORDER BY segments DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "x_pause_length_vs_fate"
              question_ko: "오래 쉬는 업종의 휴업은 결국 폐업으로 끝나는가 — 휴업(02) 상태의 체류일과 휴업발 전이의 행선지 구성(재개 vs 폐업행 비중)의 업종 결합"
              axes: "업종(dataset) 랭킹 — status_duration(status_code='02' 체류일, is_ongoing 합산) ⋈ status_transition(from_status='02' 행선지 구성) on dataset, 1:1"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "휴업 체류가 가장 긴 업종은 통신판매업(휴업 세그먼트 2,693건, 가중평균 173.4일)이다. 이 업종의 휴업발 전이 19건 중 52.6%가 폐업으로, 42.1%만 재개로 갔다 — 긴 휴업이 폐업 종착으로 기우는 패턴이다."
              sql: |
                -- :min_transitions=3, :n=10
                WITH du AS (
                  SELECT dataset, MAX(dataset_ko) AS dataset_ko,
                         SUM(n_segments) AS pause_segments,
                         ROUND(SUM(avg_days*n_segments)/SUM(n_segments),1) AS pause_avg_days
                  FROM d1_status_duration
                  WHERE status_code = '02'
                  GROUP BY dataset
                ), tr AS (
                  SELECT dataset,
                         SUM(transitions) AS from_pause_total,
                         SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END) AS to_close,
                         SUM(CASE WHEN to_status='01' THEN transitions ELSE 0 END) AS to_reopen
                  FROM d1_status_transition
                  WHERE from_status = '02'
                  GROUP BY dataset
                )
                SELECT d.dataset_ko, d.pause_segments, d.pause_avg_days,
                       t.from_pause_total,
                       ROUND(100.0*t.to_close/t.from_pause_total,1) AS close_pct,
                       ROUND(100.0*t.to_reopen/t.from_pause_total,1) AS reopen_pct
                FROM du d JOIN tr t ON t.dataset = d.dataset
                WHERE t.from_pause_total >= :min_transitions
                ORDER BY d.pause_avg_days DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
              param_defaults: { min_transitions: 3, n: 10 }
            - pattern_id: "dim_rollup_duration"
              question_ko: "대분류/중분류(:dim ∈ {major, category}) 축으로 접으면 어느 분류가 상태에 오래 머무나? 상태(:status_code, 'ALL'=전체)와 진행중 여부(:is_ongoing)를 골라 보는 분류축 롤업."
              axes: "롤업: 차원 스위치(major_ko|category_ko) → 가중평균 경과일 내림차순 | 단면: :status_code(센티널 ALL) × :is_ongoing"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "진행 중 세그먼트 기준 중분류 가중평균 경과일 1위는 산업으로 171.9일(1,129,284 세그먼트, 최장 235일)이다."
              sql: |
                -- :dim='category', :status_code='ALL', :is_ongoing=1
                SELECT CASE :dim WHEN 'major' THEN major_ko ELSE category_ko END AS dim_value,
                       COUNT(*) AS cells,
                       SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days,
                       MAX(max_days) AS max_days
                FROM d1_status_duration
                WHERE is_ongoing = :is_ongoing
                  AND (:status_code = 'ALL' OR status_code = :status_code)
                GROUP BY CASE :dim WHEN 'major' THEN major_ko ELSE category_ko END
                ORDER BY w_avg_days DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { status_code: "ALL" }
              param_enum: { dim: [major, category] }
            - pattern_id: "category_status_matrix"
              question_ko: "특정 대분류(:major, 'ALL'=전체) 안에서 중분류×상태군 교차로 보면 어느 중분류가 어느 상태에 오래 머무나? (major_status_matrix 의 드릴다운)"
              axes: "교차: 중분류(category_ko) × 상태군(status_group) 매트릭스, 셀값=가중평균 경과일 | 단면: :major(센티널 ALL)·진행중"
              verified_rows: 33
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "보건 대분류를 중분류로 펼치면 첫 셀인 동물×휴업이 가중평균 122.0일(17 세그먼트)로 동물 카테고리 내 최장 체류 상태다."
              sql: |
                -- :major='health'
                SELECT category_ko, status_group,
                       SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                  AND (:major = 'ALL' OR major = :major)
                GROUP BY category_ko, status_group
                ORDER BY category_ko, w_avg_days DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { major: "ALL" }
            - pattern_id: "status_escape_profile"
              question_ko: "특정 상태(:status_code)를 거친 세그먼트 중 이미 종결(탈출)된 비중이 높은 업종은? 휴업이면 '재개·전이율', 영업이면 '이탈률'의 프록시. (비율 축)"
              axes: "비율: 업종(dataset)별 종결 세그먼트 비중(completed_pct) 내림차순 | 단면: :status_code | 임계값: 총 세그먼트 :min_total 이상"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "휴업 탈출 비중 1위는 서울시 축산판매업으로 휴업 세그먼트의 16.7%(5건)가 이미 종결됐고, 종결된 휴업은 평균 53.4일 만에 끝났다."
              sql: |
                -- :status_code='02', :min_total=10, :n=10
                SELECT dataset_ko, category_ko,
                       SUM(CASE WHEN is_ongoing = 1 THEN n_segments ELSE 0 END) AS ongoing_segments,
                       SUM(CASE WHEN is_ongoing = 0 THEN n_segments ELSE 0 END) AS completed_segments,
                       ROUND(100.0 * SUM(CASE WHEN is_ongoing = 0 THEN n_segments ELSE 0 END) / SUM(n_segments), 1) AS completed_pct,
                       ROUND(SUM(CASE WHEN is_ongoing = 0 THEN avg_days * n_segments END)
                             / NULLIF(SUM(CASE WHEN is_ongoing = 0 THEN n_segments ELSE 0 END), 0), 1) AS completed_w_avg_days
                FROM d1_status_duration
                WHERE status_code = :status_code
                GROUP BY dataset
                HAVING SUM(n_segments) >= :min_total
                   AND SUM(CASE WHEN is_ongoing = 0 THEN n_segments ELSE 0 END) > 0
                ORDER BY completed_pct DESC, completed_segments DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_total: 10, n: 10 }
            - pattern_id: "ongoing_backlog_volume"
              question_ko: "어느 업종에 특정 상태(:status_code, 'ALL'=전체) 세그먼트가 가장 많이 쌓여 있나? 기간이 아니라 규모(건수) 기준 랭킹."
              axes: "랭킹: 업종×상태 → n_segments 내림차순 | 단면: 진행중·:status_code(센티널 ALL)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2a8b3571a5914172a850e9e8b1a81b85"
              insight_sample_ko: "폐업 상태로 남아 있는 세그먼트가 가장 많은 업종은 서울시 일반음식점(415,522개)이며 평균 158.6일째 그 상태다."
              sql: |
                -- :status_code='03', :n=10
                SELECT dataset_ko, status_group, n_segments, avg_days, p90_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                  AND (:status_code = 'ALL' OR status_code = :status_code)
