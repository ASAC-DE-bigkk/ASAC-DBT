              insight_sample_ko: "병원(9,976㎡)·대규모점포(9,199㎡)가 압도적 1·2위, 3위 석유판매업(942.8㎡)과 10배 격차. 체력단련장은 3,926곳 표본에 429.6㎡."
              sql: |
                SELECT dataset, dataset_ko, SUM(n_with_area) AS n_biz, ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2 FROM d1_area_profile GROUP BY dataset, dataset_ko HAVING SUM(n_with_area) >= 100 ORDER BY w_avg_m2 DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "gu_rank_for_dataset"
              question_ko: "이 업종(:dataset 자리, 예: 휴게음식점)은 어느 구에서 매장이 큰가? [축반전 A-1: 업종 고정 → 구 랭킹]"
              axes: ":param 단면(dataset) + gu 랭킹 — 축반전 쌍 A의 정방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "휴게음식점 중앙값 1위는 마포구 34.0㎡(1,870곳). 강남구는 중앙값 30.2㎡로 7위지만 p90은 128.5㎡로 상위 꼬리가 가장 김."
              sql: |
                SELECT gu, n_with_area, ROUND(p50_m2,1) AS p50_m2, ROUND(p90_m2,1) AS p90_m2, avg_m2, ROUND(100.0*lt_33m2/n_with_area,1) AS pct_small FROM d1_area_profile WHERE dataset = 'rest_restaurant' AND gu_code <> 'UNK' ORDER BY p50_m2 DESC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dataset_rank_for_gu"
              question_ko: "이 구(:gu 자리, 예: 강남구)에서는 어떤 업종의 매장이 큰가? [축반전 A-2: 구 고정 → 업종 랭킹]"
              axes: ":param 단면(gu) + dataset 랭킹 — 축반전 쌍 A의 역방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "강남구 중앙값 1위 대규모점포 3,273㎡(대형 비중 80%), 2위 병원 2,510㎡(90.5%). 유흥주점 155곳은 중앙값 335㎡로 절반(49.7%)이 330㎡ 이상."
              sql: |
                SELECT dataset_ko, n_with_area, ROUND(p50_m2,1) AS p50_m2, avg_m2, ROUND(100.0*ge_330m2/n_with_area,1) AS pct_large FROM d1_area_profile WHERE gu = '강남구' AND n_with_area >= 30 ORDER BY p50_m2 DESC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "small_share_rank_by_dataset"
              question_ko: "소형(33㎡ 미만) 매장 비중이 가장 높은 업종은? [축반전 B-1: 업종 축]"
              axes: "랭킹 top-N — dataset 축 소형 비중, 축반전 쌍 B의 정방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "식품자동판매기 92.3%가 33㎡ 미만으로 압도적 1위. 이용업 72.8%, 즉석판매제조가공업 71.6%(1.4만 곳) 순 — 소형 창업 밀집 업종."
              sql: |
                SELECT dataset, dataset_ko, SUM(n_with_area) AS n_biz, ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33 FROM d1_area_profile GROUP BY dataset, dataset_ko HAVING SUM(n_with_area) >= 200 ORDER BY pct_lt33 DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "small_share_rank_by_gu"
              question_ko: "소형 매장 비중이 가장 높은 자치구는? [축반전 B-2: 구 축]"
              axes: "랭킹 전체 25구 — gu 축 소형/대형 비중, 축반전 쌍 B의 역방향"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "소형 비중 1위 동대문구 46.5%, 최저 마포구 32.1% — 14.4%p 격차. 대형(330㎡+) 비중은 중구가 5.6%로 1위."
              sql: |
                SELECT gu, SUM(n_with_area) AS n_biz, ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33, ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_ge330 FROM d1_area_profile WHERE gu_code <> 'UNK' GROUP BY gu ORDER BY pct_lt33 DESC LIMIT 25
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "category_profile_in_major"
              question_ko: "이 대분류(:major 자리, 예: 보건) 안에서 중분류별 면적 프로필은?"
              axes: ":param 단면(major) + category 드릴다운 — 업종 3단 계층 탐색"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "보건 대분류에서 식품이 20.6만 곳(가중평균 71.9㎡)으로 모수 최다, 의료는 555곳뿐이나 9,976㎡로 178배 큼. 숙박은 소형 비중 0.3%."
              sql: |
                SELECT category, category_ko, SUM(n_with_area) AS n_biz, ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2, ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33 FROM d1_area_profile WHERE major = 'health' GROUP BY category, category_ko ORDER BY n_biz DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "cross_major_by_gu"
              question_ko: "대분류별 평균 매장 크기를 25개 구에 걸쳐 교차 비교하면? (구×대분류 매트릭스)"
              axes: "두 축 교차 — gu × major 피벗(조건부 가중 평균)"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "보건 가중평균은 강남구 173.9㎡ 1위, 관악구 70.8㎡ 최하(2.5배 차). 산업은 중구가 2,810.6㎡로 독보적(석유·가스·대규모점포 입지 효과)."
              sql: |
                SELECT gu, ROUND(SUM(CASE WHEN major='health' THEN avg_m2*n_with_area END)/SUM(CASE WHEN major='health' THEN n_with_area END),1) AS health_w_avg, ROUND(SUM(CASE WHEN major='industry' THEN avg_m2*n_with_area END)/SUM(CASE WHEN major='industry' THEN n_with_area END),1) AS industry_w_avg, ROUND(SUM(CASE WHEN major='culture' THEN avg_m2*n_with_area END)/SUM(CASE WHEN major='culture' THEN n_with_area END),1) AS culture_w_avg FROM d1_area_profile WHERE gu_code <> 'UNK' GROUP BY gu ORDER BY health_w_avg DESC LIMIT 25
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "polarization_p90_over_p50"
              question_ko: "매장 면적 양극화(p90/p50 배율)가 가장 심한 업종×구 조합은?"
              axes: "두 축 교차(dataset×gu) + 파생 지표 랭킹 — 표본 100+ 필터"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "건강기능식품일반판매업(서대문구)이 중앙값 4.1㎡ vs p90 97.1㎡로 23.8배 최고 양극화 — 온라인 사업자(초소형)와 매장형 혼재 신호. 축산판매업(강남구)도 20.8배."
              sql: |
                SELECT dataset_ko, gu, n_with_area, ROUND(p50_m2,1) AS p50_m2, ROUND(p90_m2,1) AS p90_m2, ROUND(p90_m2/p50_m2,1) AS p90_over_p50 FROM d1_area_profile WHERE gu_code <> 'UNK' AND n_with_area >= 100 AND p50_m2 > 0 ORDER BY p90_over_p50 DESC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "large_store_count_by_gu"
              question_ko: "대형(330㎡ 이상) 매장이 가장 많은 자치구 top 10은? (절대 수 기준)"
              axes: "랭킹 top-N — gu 축 절대 수(비중 랭킹 P5와 상보)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "대형 매장 절대 수 1위 강남구 1,565곳(전체의 5.3%), 2위 중구 711곳 — 다만 비중으로는 중구(5.6%)가 강남을 역전."
              sql: |
                SELECT gu, SUM(ge_330m2) AS n_large, SUM(n_with_area) AS n_biz, ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_large FROM d1_area_profile WHERE gu_code <> 'UNK' GROUP BY gu ORDER BY n_large DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "inv_smallest_area_dataset"
              question_ko: "매장이 가장 작은 업종은? (대형 랭킹의 정렬 반전)"
              axes: "업종 랭킹 — 가중 평균 면적 ASC(rank_top_avg_area_by_dataset 의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "가장 작은 업종은 식품자동판매기업 가중평균 10.2㎡ — 최대 업종(병원 약 1만㎡)과 1,000배 차."
              sql: |
                -- :min_n=100, :n=10
                SELECT dataset_ko, SUM(n_with_area) AS n_biz,
                       ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2
                FROM d1_area_profile GROUP BY dataset_ko HAVING SUM(n_with_area) >= :min_n
                ORDER BY w_avg_m2 ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 100, n: 10 }
            - pattern_id: "inv_gu_fixed_smallest"
              question_ko: "이 자치구에서 가장 작은 매장 업종은? (구 고정 + 정렬 반전)"
              axes: "자치구 고정(:gu) → 업종 랭킹 p50 ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "강남구에서도 식품자동판매기업이 중앙값 3.3㎡·소형 비중 95.4%로 최소."
              sql: |
                -- :gu='강남구', :min_n=30, :n=10
                SELECT dataset_ko, n_with_area, p50_m2, ROUND(100.0*lt_33m2/n_with_area,1) AS pct_small
                FROM d1_area_profile WHERE gu = :gu AND n_with_area >= :min_n
                ORDER BY p50_m2 ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 30, n: 10 }
            - pattern_id: "new_large_share_by_category"
              question_ko: "대형(330㎡+) 매장 비중이 높은 업종군은? (소형 비중 관점의 반전)"
              axes: "중분류 랭킹 — 대형 비중 DESC(small_share 관점의 반전)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ad6237eb23fe4f7894a86260b845a75e"
              insight_sample_ko: "의료는 330㎡ 이상이 95.1%이고 33㎡ 미만은 0% — 소형이 존재하지 않는 업종군."
              sql: |
                SELECT category_ko, SUM(n_with_area) AS n_biz,
                       ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_large,
                       ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_small
                FROM d1_area_profile GROUP BY category_ko ORDER BY pct_large DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu_rank_for_dataset_any"
              question_ko: "이 업종(:dataset)은 어느 구에서 매장이 큰가/작은가? (:dir ∈ {asc, desc}, 표본 :min_n 이상)"
              axes: ":param 단면(dataset) + gu 랭킹 — 정렬 방향 스위치. 기존 gu_rank_for_dataset(dataset·방향 고정)의 파라미터 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "휴게음식점 매장이 가장 큰 구는 마포구로 중위 33.7㎡(p90 99.9㎡, 표본 1,873곳)이며 소형(33㎡ 미만) 비중은 48.4%다."
              sql: |
                -- :dataset='rest_restaurant', :dir='desc', :min_n=30, :n=10
                SELECT gu, n_with_area, ROUND(p50_m2,1) AS p50_m2, ROUND(p90_m2,1) AS p90_m2, avg_m2,
                       ROUND(100.0*lt_33m2/n_with_area,1) AS pct_small
                FROM d1_area_profile
                WHERE dataset = :dataset AND gu_code <> 'UNK' AND n_with_area >= :min_n
                ORDER BY CASE WHEN :dir='asc' THEN p50_m2 END ASC,
                         CASE WHEN :dir='desc' THEN p50_m2 END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { dir: "desc", min_n: 30, n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "dataset_gu_vs_city"
              question_ko: "특정 구의 특정 업종 매장 면적은 서울 전체 평균 대비 어떤 수준인가?"
              axes: "단일 셀 단면(dataset×gu) + 서울 전체 가중 평균 벤치마크 비율(subquery)"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "강남구 일반음식점(12,156곳)의 평균 면적은 112.4㎡로 서울 전체 가중 평균 78.9㎡의 1.42배다."
              sql: |
                -- :dataset='general_restaurant', :gu='강남구'
                SELECT gu, dataset_ko, n_with_area, ROUND(p50_m2,1) AS p50_m2, avg_m2,
                       ROUND(100.0*lt_33m2/n_with_area,1) AS pct_small,
                       (SELECT ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1)
                          FROM d1_area_profile WHERE dataset = :dataset) AS city_w_avg_m2,
                       ROUND(avg_m2 / (SELECT SUM(avg_m2*n_with_area)/SUM(n_with_area)
                                         FROM d1_area_profile WHERE dataset = :dataset), 2) AS ratio_to_city
                FROM d1_area_profile
                WHERE dataset = :dataset AND gu = :gu
              requires: [select_columns, aggregate, subquery, filter_range]
            - pattern_id: "dataset_gu_concentration"
              question_ko: "이 업종 사업장은 어느 구에 몰려 있나? (사업장 수 점유율 기준)"
              axes: ":param 단면(dataset) + gu 분포 — 사업장 수 점유율(window). 규모 랭킹(gu_rank_for_dataset)과 상보인 '양' 관점"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "체력단련장은 강남구에 486곳(서울의 12.4%)으로 가장 많이 몰려 있고, 강남구 체력단련장의 중위 면적은 217.7㎡다."
              sql: |
                -- :dataset='fitness_center', :n=10
                SELECT gu, n_with_area,
                       ROUND(100.0*n_with_area/SUM(n_with_area) OVER (),1) AS pct_share,
                       ROUND(p50_m2,1) AS p50_m2
                FROM d1_area_profile
                WHERE dataset = :dataset AND gu_code <> 'UNK'
                ORDER BY n_with_area DESC
                LIMIT :n
              requires: [select_columns, sort, window, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { n: 10 }
            - pattern_id: "midsize_share_rank_switch"
              question_ko: "중형(33~330㎡) 매장 비중이 가장 높은 업종/자치구는? (:dim ∈ {gu, dataset})"
              axes: "비율 랭킹 — 차원 스위치(gu|dataset). 기존 소형(lt_33)·대형(ge_330) 비중 패턴이 안 덮는 중형 밴드"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "단란주점은 사업장 1,870곳 중 98.9%가 중형(33~330㎡) 매장으로 업종 가운데 중형 집중도가 가장 높다(소형 0.9%, 대형 0.2%)."
              sql: |
                -- :dim='dataset', :min_n=200, :n=10
                SELECT CASE :dim WHEN 'gu' THEN gu WHEN 'dataset' THEN dataset_ko END AS dim_value,
                       SUM(n_with_area) AS n_biz,
                       ROUND(100.0*SUM(n_with_area - lt_33m2 - ge_330m2)/SUM(n_with_area),1) AS pct_mid_33_330,
                       ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33,
                       ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_ge330
                FROM d1_area_profile
                WHERE gu_code <> 'UNK'
                GROUP BY CASE :dim WHEN 'gu' THEN gu WHEN 'dataset' THEN dataset_ko END
                HAVING SUM(n_with_area) >= :min_n
                ORDER BY pct_mid_33_330 DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { dim: "dataset", min_n: 200, n: 10 }
              param_enum: { dim: [gu, dataset] }
            - pattern_id: "gu_pair_dataset_gap"
              question_ko: "두 자치구(:gu_a vs :gu_b)에서 같은 업종의 중위 매장 면적 격차가 가장 큰 업종은?"
              axes: "두 단면 교차 비교(gu_a vs gu_b) — dataset 축 격차 랭킹(조건부 피벗), 양쪽 모두 표본 :min_n 이상인 업종만"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "강남구와 노원구의 중위 면적 격차가 가장 큰 업종은 유통전문판매업으로 32.2㎡ 대 16.1㎡, 1.99배 차이다."
              sql: |
                -- :gu_a='강남구', :gu_b='노원구', :min_n=30, :n=10
                SELECT dataset_ko,
                       MAX(CASE WHEN gu = :gu_a THEN ROUND(p50_m2,1) END) AS p50_a,
                       MAX(CASE WHEN gu = :gu_b THEN ROUND(p50_m2,1) END) AS p50_b,
                       ROUND(MAX(CASE WHEN gu = :gu_a THEN p50_m2 END)
                             / MAX(CASE WHEN gu = :gu_b THEN p50_m2 END), 2) AS ratio_a_over_b
                FROM d1_area_profile
                WHERE gu IN (:gu_a, :gu_b) AND n_with_area >= :min_n
                GROUP BY dataset_ko
                HAVING COUNT(*) = 2 AND MIN(p50_m2) > 0
                ORDER BY ratio_a_over_b DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 30, n: 10 }
            - pattern_id: "geo_spread_rank_by_dataset"
              question_ko: "같은 업종인데 구에 따라 매장 크기가 가장 크게 달라지는 업종은? (구간 중위 면적 max/min 배율)"
              axes: "dataset 랭킹 — 구간(between-gu) 지역 편차 배율. 셀 내부 양극화(polarization_p90_over_p50)와 구별되는 '지역 간' 편차"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "건강기능식품일반판매업은 25개 구에서 중위 면적이 3.9~45.8㎡로 11.6배 벌어져 지역 간 편차가 가장 크다."
              sql: |
                -- :min_n=30, :min_gu=10, :n=10
                SELECT dataset_ko, COUNT(*) AS n_gu,
                       ROUND(MIN(p50_m2),1) AS min_p50_m2, ROUND(MAX(p50_m2),1) AS max_p50_m2,
                       ROUND(MAX(p50_m2)/MIN(p50_m2),1) AS max_over_min
                FROM d1_area_profile
                WHERE gu_code <> 'UNK' AND n_with_area >= :min_n AND p50_m2 > 0
                GROUP BY dataset_ko
                HAVING COUNT(*) >= :min_gu
                ORDER BY max_over_min DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 30, min_gu: 10, n: 10 }
            - pattern_id: "unk_gu_share_by_dataset"
              question_ko: "자치구 미상(UNK) 사업장 비중이 높은 데이터셋은? (지역 분석 신뢰도 점검)"
              axes: "비율 랭킹 — dataset 축 데이터 품질(UNK 커버리지)"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "구 미상(UNK) 비중이 가장 높은 데이터셋은 대규모점포로 656곳 중 9곳(1.37%)이 자치구에 매핑되지 않았다."
              sql: |
                -- :n=10
                SELECT dataset_ko,
                       SUM(CASE WHEN gu_code = 'UNK' THEN n_with_area ELSE 0 END) AS n_unk,
                       SUM(n_with_area) AS n_total,
                       ROUND(100.0*SUM(CASE WHEN gu_code = 'UNK' THEN n_with_area ELSE 0 END)/SUM(n_with_area),2) AS pct_unk
                FROM d1_area_profile
                GROUP BY dataset_ko
                HAVING SUM(CASE WHEN gu_code = 'UNK' THEN n_with_area ELSE 0 END) > 0
                ORDER BY pct_unk DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { n: 10 }
            - pattern_id: "category_profile_any_major_gu"
              question_ko: "이 대분류(:major) 안 중분류별 면적 프로필은? 특정 구로 좁히면? (:gu='ALL'이면 서울 전체)"
              axes: ":param 단면(major) + category 드릴다운 + 센티널 gu 필터 — 기존 category_profile_in_major(major 고정·전 구 합산)의 일반화 상위호환"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "보건 대분류에서는 식품 중분류가 206,433곳으로 가장 많고 가중 평균 71.9㎡, 소형 비중 37.3%·대형 비중 2.5%다."
              sql: |
                -- :major='health', :gu='ALL'
                SELECT category, category_ko, SUM(n_with_area) AS n_biz,
                       ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2,
                       ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33,
                       ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_ge330
                FROM d1_area_profile
                WHERE major = :major AND (:gu = 'ALL' OR gu = :gu)
                GROUP BY category, category_ko
                ORDER BY n_biz DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              # v1.11 (#217 P1): gu 생략 = 서울 전체 — 센티널 'ALL' 을 호출자가 몰라도 된다
              param_defaults: { gu: "ALL" }
            - pattern_id: "category_profile_major_gus"
              question_ko: "이 대분류(:major) 안 중분류별 면적 프로필을 고른 구들(:gus)만 합산하면? (:gus 는 구 이름 배열)"
              axes: ":param 단면(major) + category 드릴다운 + gu 다중 선택(P3 배열) — category_profile_any_major_gu(단일 구/전체)의 다중 선택 확장"
              verified_rows: 0
              insight_sample_ko: ""
              sql: |
                -- :major='health', :gus='["강남구","서초구","송파구"]'
                SELECT category, category_ko, SUM(n_with_area) AS n_biz,
                       ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2,
                       ROUND(100.0*SUM(lt_33m2)/SUM(n_with_area),1) AS pct_lt33,
                       ROUND(100.0*SUM(ge_330m2)/SUM(n_with_area),1) AS pct_ge330
                FROM d1_area_profile
                WHERE major = :major AND gu IN (:gus)
                GROUP BY category, category_ko
                ORDER BY n_biz DESC
              requires: [select_columns, sort, aggregate, group_by, filter_set]
              # v1.11 (#217 P3): 게이트웨이가 :gus 를 원소 수만큼 ?,?,? 로 전개(원소별 값 bind).
              # verified_* 는 검증 스크립트 실측으로만 채운다(§8 — 스탬프 전엔 runnable=false 로 자동 비활성).
              params: { gus: { type: array, item: string, max_len: 100 } }
            - pattern_id: "top_p50_combos"
              question_ko: "서울 전체에서 중위 매장 면적이 가장 큰 업종×구 조합은? (표본 :min_n 이상)"
              axes: "전역 교차 랭킹(dataset×gu) — 절대 중위 면적 기준. 비율 기반 양극화 랭킹(polarization)과 상보"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "표본 50곳 이상 조합 중 중위 면적 1위는 중구 대규모점포(58곳)로 p50 10,686.4㎡, p90 27,653.8㎡다."
              sql: |
                -- :min_n=50, :n=10
                SELECT dataset_ko, gu, n_with_area, ROUND(p50_m2,1) AS p50_m2, ROUND(p90_m2,1) AS p90_m2
                FROM d1_area_profile
                WHERE gu_code <> 'UNK' AND n_with_area >= :min_n
                ORDER BY p50_m2 DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 50, n: 10 }
            - pattern_id: "gu_business_mix"
              question_ko: "이 구의 상권은 어떤 업종으로 구성돼 있나? (사업장 수 점유율 기준)"
              axes: ":param 단면(gu) + dataset 구성비(window) — 크기 랭킹(dataset_rank_for_gu)과 상보인 '구성' 관점"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "마포구 사업장 구성 1위는 일반음식점으로 7,772곳, 구 전체 인허가 사업장의 52.2%를 차지한다(중위 56.9㎡)."
              sql: |
                -- :gu='마포구', :n=10
                SELECT dataset_ko, n_with_area,
                       ROUND(100.0*n_with_area/SUM(n_with_area) OVER (),1) AS pct_of_gu,
                       ROUND(p50_m2,1) AS p50_m2
                FROM d1_area_profile
                WHERE gu = :gu
                ORDER BY n_with_area DESC
                LIMIT :n
              requires: [select_columns, sort, window, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { n: 10 }
            - pattern_id: "top_dataset_per_gu"
              question_ko: "각 자치구에서 매장이 가장 큰 대표 업종은 무엇인가? (구별 top-1 지도)"
              axes: "그룹별 top-1 — gu 파티션 window(ROW_NUMBER), 표본 :min_n 이상 셀만"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "1f8d2ca362784eb2a966fd537c615433"
              insight_sample_ko: "구별 대표 대형 업종 1위는 중구의 대규모점포(표본 58곳)로 중위 면적 10,686.4㎡다."
              sql: |
                -- :min_n=30
                SELECT gu, dataset_ko, n_with_area, ROUND(p50_m2,1) AS p50_m2
                FROM (
                  SELECT gu, dataset_ko, n_with_area, p50_m2,
                         ROW_NUMBER() OVER (PARTITION BY gu ORDER BY p50_m2 DESC) AS rn
                  FROM d1_area_profile
                  WHERE gu_code <> 'UNK' AND n_with_area >= :min_n
                )
                WHERE rn = 1
                ORDER BY p50_m2 DESC
              requires: [select_columns, sort, window, subquery, filter_range]
              # v1.11 (#217 P1): 예시값 주석의 임계값·방향을 기본값으로 — 생략 가능
              param_defaults: { min_n: 30 }
          contract_version: v1
          product_question: 업종별 매장 면적 분포는?
          grain: 업종3단×자치구
          primary_key: [major, category, dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, gu_code]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(면적 필드 보유 detail 한정).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: n_with_area
        data_type: bigint
        description: 면적(sitearea) 유효 업소 수(모수 — 표본 신뢰 배지).
        tests: [not_null]
      - name: avg_m2
        data_type: double
        description: 평균 면적(제곱미터).
      - name: p50_m2
        data_type: double
        description: 중앙값 면적(제곱미터).
      - name: p90_m2
        data_type: double
        description: 90퍼센타일 면적(제곱미터).
      - name: lt_33m2
        data_type: bigint
        description: 33제곱미터 미만(소형) 업소 수.
      - name: ge_330m2
        data_type: bigint
        description: 330제곱미터 이상(대형) 업소 수.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_detail_uptae_mix
    description: 업종 속 세부 업태 — 업태(uptaenm) 구성·플로우 × 업종. 소분류보다 깊은 축(일반음식점 안 한식/커피숍). lodging 제외.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_uptae_rollup
          d1_rollup: (major,category,dataset,uptaenm) 집계 + share 사전계산 — gu 드롭
          # 롤업이 export 시점에 만들어 내는 파생 컬럼. gold 에 없어 `columns:` 로는 선언할 수 없다
          # (contract.enforced 가 gold 실출력과 대조하므로). export 가 d1_catalog_columns 게시에 쓴다.
          d1_derived_columns:
            share: 같은 dataset 안에서 이 세부 업태(uptaenm)가 차지하는 활성 업소 비율(0~1). 분모는 그 dataset 의 active_cnt 합계이며, 합계가 0이면 NULL.
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_uptae_rollup   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 업종 속 세부 업태 구성
            summary: 같은 업종 안에서 세부 업태가 어떻게 나뉘는지 구성비와 증감을 담았습니다. 일반음식점 안의 한식·커피숍 같은 구분입니다.
            caveat: 숙박업은 제외했습니다.
            use_cases:
              - 업태 단위 경쟁 구도 파악
              - 세분 시장 규모 추정
              - 업태 전환 검토
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "uptae_top_ranking"
              question_ko: "서울에서 활성 업소가 가장 많은 세부 업태 top-N은?"
              axes: "uptaenm 랭킹 (전 dataset)"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "1위 종합몰 104,269(통신판매 내 24.2%)·2위 의류/패션/잡화/뷰티 100,389 — 온라인이 상위 독식. 오프라인 1위는 한식 50,722(일반음식점의 42.1%), 일반미용업 20,300(미용실의 60.6%)."
              sql: |
                SELECT uptaenm, dataset, major, category, active_cnt, total_cnt, opened_last_365d, ROUND(share,3) AS share FROM d1_uptae_rollup ORDER BY active_cnt DESC LIMIT 20
              requires: [select_columns, sort, aggregate]
            - pattern_id: "dataset_mix_slice"
              question_ko: "특정 업종(dataset) 안의 업태 구성은 어떻게 되나? (:dataset 단면)"
              axes: "dataset → uptaenm 단면 (:dataset 파라미터) [축반전 쌍1-A]"
              verified_rows: 30
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "일반음식점: 한식 50,722(42.1%) > 기타 21,222(17.6%) > 호프/통닭 8,805(7.3%) > 경양식 8,693. 분식은 누적 81,007인데 활성 7,519뿐 — 구성비와 이력 규모가 크게 어긋나는 업태."
              sql: |
                SELECT uptaenm, active_cnt, total_cnt, opened_last_365d, ROUND(share,4) AS share FROM d1_uptae_rollup WHERE dataset = :dataset ORDER BY active_cnt DESC LIMIT 30 -- 예: :dataset = 'general_restaurant'
              requires: [select_columns, sort, aggregate]
            - pattern_id: "uptae_dataset_span"
              question_ko: "같은 업태명이 여러 업종(dataset)에 걸쳐 등장하는 경우는? (업태 축으로 반전)"
              axes: "uptaenm → dataset 스팬 [축반전 쌍1-B: dataset_mix_slice의 역방향]"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "'기타'는 6개 dataset에 걸침(활성 91,875) — 업태명 단독 집계 시 최대 노이즈원. 커피숍은 휴게음식점 14,664 + 일반음식점 2로 분산 — 업태명은 dataset 경계를 넘으므로 업태 총량은 반드시 GROUP BY uptaenm."
              sql: |
                SELECT uptaenm, COUNT(DISTINCT dataset) AS dataset_cnt, SUM(active_cnt) AS active_total, GROUP_CONCAT(DISTINCT dataset) AS datasets FROM d1_uptae_rollup GROUP BY uptaenm HAVING dataset_cnt >= 2 ORDER BY active_total DESC LIMIT 20
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "growth_uptae_ranking"
              question_ko: "최근 1년 개업을 주도한 업태와 회전율(개업/활성)은?"
              axes: "uptaenm 랭킹 (opened_last_365d 플로우 + open_ratio 파생)"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "즉석판매제조가공업이 개업 9,056건에 open_ratio 0.59로 회전 최고 — 활성 15,360의 59%가 1년 내 개업. 종합몰 16,511건(비율 0.158)이 절대량 1위. 백화점(휴게)은 개업 617 > 활성 543(비율 1.136)로 개업-즉시폐업 이상 신호."
              sql: |
                SELECT uptaenm, dataset, active_cnt, opened_last_365d, ROUND(opened_last_365d * 1.0 / NULLIF(active_cnt,0), 3) AS open_ratio FROM d1_uptae_rollup WHERE opened_last_365d >= 50 ORDER BY opened_last_365d DESC LIMIT 20
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dataset_concentration_hhi"
              question_ko: "업종별 업태 다양성/집중도는? — 단일 업태 지배 업종 vs 다양성 업종"
              axes: "dataset 랭킹 (share 사전계산 활용한 HHI 집중도)"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "다양성 최고는 통신판매 HHI 0.145·일반음식점 0.229, 반대로 세탁업 HHI 0.937(일반세탁 96.8%)·고압가스 0.78은 사실상 단일 업태 업종. 업태 축 드릴다운은 HHI 낮은 업종에서만 유의미."
              sql: |
                SELECT dataset, major, category, COUNT(*) AS uptae_cnt, SUM(active_cnt) AS active_total, ROUND(MAX(share), 3) AS top1_share, ROUND(SUM(share*share), 3) AS hhi FROM d1_uptae_rollup GROUP BY dataset, major, category HAVING active_total >= 500 ORDER BY hhi ASC LIMIT 20
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "survival_by_uptae"
              question_ko: "폐업이 가장 잦았던(생존율 낮은) 세부 업태는?"
              axes: "uptaenm 랭킹 (active/total 생존율, 하위) [축반전 쌍2-A]"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "과자점 2.2%(189/8,626)·다방 5.5%(982/17,716)·분식 9.3%(7,519/81,007) — 시대 소멸 업태가 하위 독점. 집단급식소 0%는 해당 dataset 상태코드 체계 차이로 실폐업 아님 주의."
              sql: |
                SELECT uptaenm, dataset, active_cnt, total_cnt, ROUND(active_cnt * 1.0 / total_cnt, 3) AS survival_rate FROM d1_uptae_rollup WHERE total_cnt >= 1000 ORDER BY survival_rate ASC LIMIT 20
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "survival_by_dataset"
              question_ko: "업종(dataset) 단위로 보면 생존율이 낮은 업종은? (dataset 축으로 반전)"
              axes: "dataset 랭킹 (생존율 하위) [축반전 쌍2-B: survival_by_uptae의 역방향]"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "식품자동판매기 8.1%(5,502/68,286)·즉석판매제조가공 9.9%가 최저 — 그런데 즉석판매는 최근 1년 개업 9,056건으로 저생존+고유입 회전 시장. 일반음식점은 22.5%로 체감보다 높은 편."
              sql: |
                SELECT dataset, major, category, SUM(active_cnt) AS active_total, SUM(total_cnt) AS total_all, ROUND(SUM(active_cnt)*1.0/SUM(total_cnt),3) AS survival_rate, SUM(opened_last_365d) AS opened_365d FROM d1_uptae_rollup GROUP BY dataset, major, category HAVING total_all >= 1000 ORDER BY survival_rate ASC LIMIT 20
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "category_top_uptae_cross"
              question_ko: "중분류(category)별 대표 업태 top-3은? (두 축 교차)"
              axes: "category × uptaenm 교차 (윈도우 top-3)"
              verified_rows: 18
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "6개 카테고리 대표: food 한식 50,722 / hygiene_beauty 일반미용업 20,300 / health_medical 의원 10,619 / industry 종합몰 104,269 / livestock 식육판매업 6,353 / culture 태권도 1,248(권투 554의 2.3배)."
              sql: |
                SELECT category, uptaenm, dataset, active_cnt FROM (SELECT category, uptaenm, dataset, active_cnt, ROW_NUMBER() OVER (PARTITION BY category ORDER BY active_cnt DESC) AS rn FROM d1_uptae_rollup) WHERE rn <= 3 ORDER BY category, rn
              requires: [select_columns, sort, window, filter_range]
            - pattern_id: "uptae_keyword_search"
              question_ko: "특정 키워드가 들어간 업태를 전 업종에서 찾으면? (:keyword 검색)"
              axes: "uptaenm LIKE 검색 (:keyword 파라미터, 전 dataset 횡단)"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "'커피' 검색: 커피숍(휴게음식점) 14,664 + 커피숍(일반음식점) 2. 업태명이 7,647종(자유서식 포함)이라 정확 매칭 전에 LIKE로 표기 변형(까페/다방/커피숍)을 먼저 훑는 진입 패턴."
              sql: |
                SELECT uptaenm, dataset, category, active_cnt, total_cnt, opened_last_365d, ROUND(share,3) AS share FROM d1_uptae_rollup WHERE uptaenm LIKE '%' || :keyword || '%' ORDER BY active_cnt DESC LIMIT 20 -- 예: :keyword = '커피'
              requires: [select_columns, sort, aggregate, filter_set]
            - pattern_id: "inv_share_asc"
              question_ko: "같은 업종 안에서 비중이 가장 낮은(희귀) 업태는?"
              axes: "업태 랭킹 — share ASC(주력 업태 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "일반음식점 안에서 '이동조리' 업태는 누적 101건 중 영업 3곳(비중 0%대)으로 사실상 희귀."
              sql: |
                -- :dataset='general_restaurant', :min_total=30, :n=10
                SELECT uptaenm, active_cnt, total_cnt, ROUND(share*100,2) AS share_pct
                FROM d1_uptae_rollup WHERE dataset = :dataset AND total_cnt >= :min_total
                ORDER BY share ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_total: 30, n: 10 }
            - pattern_id: "new_uptae_fixed_dataset_rank"
              question_ko: "이 업태는 어떤 업종에서 주로 나타나나? (업종 고정→업태 랭킹의 차원 교환)"
              axes: "업태 고정(:uptae) → 업종(dataset) 랭킹 — 역방향"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "'푸드트럭' 업태는 휴게음식점(1,229건)에 가장 많이 등록 — 업태를 고정하면 소속 업종이 드러난다."
              sql: |
                -- :uptae='푸드트럭'
                SELECT dataset, category, active_cnt, total_cnt, ROUND(share*100,2) AS share_pct
                FROM d1_uptae_rollup WHERE uptaenm = :uptae
                ORDER BY total_cnt DESC
              requires: [select_columns, sort, aggregate]
            - pattern_id: "new_growth_uptae"
              question_ko: "최근 1년 신규 개업이 활발한 업태는? (재고 비중 대신 유입 관점)"
              axes: "업태 랭킹 — opened_last_365d / 신규 비중(share 관점의 반전) 주의: 분자는 기간 내 개업 전체, 분모는 현재 영업분이라 100% 초과 가능(회전이 빠른 업태)."
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "'백화점' 업태(휴게음식점)는 신규 비중 112.6% — 분모(현재 영업)보다 기간 내 개업이 많은 초고회전 업태."
              sql: |
                -- :min_active=100, :n=15
                SELECT uptaenm, dataset, active_cnt, opened_last_365d,
                       ROUND(100.0*opened_last_365d/NULLIF(active_cnt,0),1) AS new_pct
                FROM d1_uptae_rollup WHERE active_cnt >= :min_active
                ORDER BY new_pct DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_active: 100, n: 15 }
            - pattern_id: "new_dead_uptae"
              question_ko: "현재 영업 중이 하나도 없는(사실상 소멸한) 업태는?"
              axes: "업태 랭킹 — active_cnt=0 & total_cnt 보유(생존 관점의 극단 반전)"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "448145c0ad344bb99b25a51cb63400c3"
              insight_sample_ko: "'집단급식소' 업태는 누적 2,286건 중 현재 영업 0곳 — 제도 변경으로 소멸한 업태."
              sql: |
                -- :n=15
                SELECT uptaenm, dataset, active_cnt, total_cnt
                FROM d1_uptae_rollup WHERE active_cnt = 0 AND total_cnt > 0
                ORDER BY total_cnt DESC LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { n: 15 }
            - pattern_id: "x_category_churn_uptae_detail"
              question_ko: "폐업 회전이 높은 이 업종(:category) 안에서 실제로 어떤 세부 업태가 재고와 최근 개업을 지배하나? — 업종 위험 지표의 업태 해부"
              axes: "churn(서울 전체 :y·:category 합산 1행 CTE) ⋈ uptae_rollup(업태 랭킹 active_cnt DESC), 조인 키 category. 업종 1행이 업태 N행에 컨텍스트 컬럼으로 반복되는 의도된 브로드캐스트(팬아웃 아님). uptae_rollup 은 category 11종 중 6종만 보유 — 나머지는 inner join 으로 빈 결과"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "2025년 food 업종은 폐업률 18.19%(연초 재고 235,814곳·폐업 42,891곳) 국면인데, 그 재고 1위 업태는 한식(영업 50,715곳·누적 221,691곳·최근 1년 개업 4,298곳)이다."
              sql: |
                -- :y='2025', :category='food', :n=15
                WITH cat AS (
                  SELECT category, SUM(stock_start) AS stock_start, SUM(opened) AS opened, SUM(closed) AS closed,
                         ROUND(1.0*SUM(closed)/NULLIF(SUM(stock_start),0),4) AS churn_rate
                  FROM d1_churn_yearly
                  WHERE y = :y AND category = :category
                  GROUP BY category
                )
                SELECT u.uptaenm, u.dataset, u.active_cnt, u.total_cnt, u.opened_last_365d,
                       c.churn_rate AS category_churn_rate, c.stock_start AS category_stock_start, c.closed AS category_closed
                FROM d1_uptae_rollup u
                JOIN cat c ON c.category = u.category
                ORDER BY u.active_cnt DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, subquery, filter_range]
              param_defaults: { n: 15 }
            - pattern_id: "hier_rollup_switch"
              question_ko: "대분류/중분류/업종 어느 층위로든 서울 상권 총괄(활성·누적·최근 1년 개업·생존율)을 보면? (:dim ∈ {major, category, dataset} 명시 필수)"
              axes: "차원 스위치(:dim) 계층 롤업 — 재고·유입·생존율 총괄 랭킹"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "중분류 기준 최대는 industry로 활성 41만9518곳(누적 91만3715곳)이며, 생존율 45.9%에 최근 1년 신규 유입은 활성 대비 10.8%다."
              sql: |
                -- :dim='category', :n=10
                SELECT CASE :dim WHEN 'major' THEN major WHEN 'category' THEN category ELSE dataset END AS dim_value,
                       COUNT(*) AS uptae_rows,
                       SUM(active_cnt) AS active_total,
                       SUM(total_cnt) AS total_all,
                       SUM(opened_last_365d) AS opened_365d,
                       ROUND(SUM(active_cnt)*1.0/NULLIF(SUM(total_cnt),0),3) AS survival_rate,
                       ROUND(100.0*SUM(opened_last_365d)/NULLIF(SUM(active_cnt),0),1) AS new_pct
                FROM d1_uptae_rollup
                GROUP BY CASE :dim WHEN 'major' THEN major WHEN 'category' THEN category ELSE dataset END
                ORDER BY active_total DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, sort]
              param_defaults: { n: 10 }
              param_enum: { dim: [major, category, dataset] }
            - pattern_id: "survival_rank_dir"
              question_ko: "생존율이 가장 높은(또는 낮은) 세부 업태는? — 정렬 방향과 모수 임계값을 직접 지정 (:dir ∈ {asc, desc} 명시 필수)"
              axes: "uptaenm 랭킹 — 생존율 정렬 방향 스위치(:dir) + 임계값(:min_total) [survival_by_uptae 상위호환: 상위(장수) 방향을 신규 커버]"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "누적 1000건 이상 업태 중 생존율 1위는 집단급식소(group_meal_facility)의 '학교'로, 1515곳 중 1413곳이 영업 중이어서 생존율 93.3%다."
              sql: |
                -- :dir='desc', :min_total=1000, :n=10
                SELECT uptaenm, dataset, category, active_cnt, total_cnt,
                       ROUND(active_cnt*1.0/total_cnt,3) AS survival_rate
                FROM d1_uptae_rollup
                WHERE total_cnt >= :min_total
                ORDER BY CASE WHEN :dir='asc' THEN active_cnt*1.0/total_cnt END ASC,
                         CASE WHEN :dir='desc' THEN active_cnt*1.0/total_cnt END DESC,
                         total_cnt DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_total: 1000, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "category_dataset_mix"
              question_ko: "특정 중분류(category) 안은 어떤 업종(dataset)들로 구성되고 각각의 점유율·생존율은?"
              axes: "category → dataset 단면 + 카테고리 내 활성 점유율(비율)"
              verified_rows: 19
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "food 중분류 활성 업소의 59.8%가 general_restaurant(12만427곳)에 몰려 있고, 이 업종의 생존율은 22.5%로 낮은 편이다."
              sql: |
                -- :category='food', :n=20
                SELECT dataset, major,
                       COUNT(*) AS uptae_cnt,
                       SUM(active_cnt) AS active_total,
                       ROUND(100.0*SUM(active_cnt)/NULLIF((SELECT SUM(active_cnt) FROM d1_uptae_rollup WHERE category = :category),0),1) AS active_pct,
                       SUM(opened_last_365d) AS opened_365d,
                       ROUND(SUM(active_cnt)*1.0/NULLIF(SUM(total_cnt),0),3) AS survival_rate
                FROM d1_uptae_rollup
                WHERE category = :category
                GROUP BY dataset, major
                ORDER BY active_total DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, sort, subquery]
              param_defaults: { n: 20 }
            - pattern_id: "dataset_top_uptae_window"
              question_ko: "36개 업종 각각의 대표(1~k위) 업태는? — 기준 지표를 활성/개업/비중 중에서 선택 (:metric ∈ {active, opened, share} 명시 필수)"
              axes: "dataset × uptaenm 교차 — 윈도우 top-:top_n, 기준 지표 스위치(:metric)"
              verified_rows: 36
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "활성 업소 기준 bakery 업종의 대표 업태는 '제과점영업'(4228곳)으로, 업종 내 share 1.0의 단일 지배 구조다."
              sql: |
                -- :metric='active', :top_n=1
                SELECT dataset, category, uptaenm, active_cnt, opened_last_365d, ROUND(share,3) AS share
                FROM (
                  SELECT t.*, ROW_NUMBER() OVER (PARTITION BY dataset ORDER BY metric_val DESC) AS rn
                  FROM (
                    SELECT dataset, category, uptaenm, active_cnt, opened_last_365d, share,
                           CASE :metric WHEN 'opened' THEN opened_last_365d WHEN 'share' THEN share ELSE active_cnt END AS metric_val
                    FROM d1_uptae_rollup
                  ) t
                )
                WHERE rn <= :top_n
                ORDER BY dataset, rn
              requires: [select_columns, window, subquery, filter_range, sort]
              param_defaults: { top_n: 1 }
              param_enum: { metric: [active, opened, share] }
            - pattern_id: "stagnant_uptae"
              question_ko: "최근 1년 신규 개업이 한 건도 없는데 영업 중 업소는 많은(유입이 끊긴) 업태는? (:dataset='ALL'이면 전 업종)"
              axes: "uptaenm 랭킹 — 유입 단절(opened_last_365d=0) 필터 + 센티널 업종 필터 + 규모 임계값"
              verified_rows: 14
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "최근 1년 개업 0건인데 활성 업소가 가장 많은 그룹은 mail_order_sale의 업태명 미기재('-') 1만667곳으로, 생존율도 13.2%에 그쳐 유입 단절 신호가 가장 크다."
              sql: |
                -- :min_active=50, :dataset='ALL', :n=15
                SELECT uptaenm, dataset, category, active_cnt, total_cnt,
                       ROUND(active_cnt*1.0/total_cnt,3) AS survival_rate
                FROM d1_uptae_rollup
                WHERE opened_last_365d = 0
                  AND active_cnt >= :min_active
                  AND (:dataset = 'ALL' OR dataset = :dataset)
                ORDER BY active_cnt DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_active: 50, dataset: "ALL", n: 15 }
            - pattern_id: "active_size_distribution"
              question_ko: "업태들의 규모 분포는? — 활성 업소 수 구간(0 / 1-9 / 10-99 / 100-999 / 1000+)별 업태 수와 활성 총량 (:dataset='ALL'이면 전 업종)"
              axes: "분포 — 활성 업소 수 구간별 업태 수·활성 총량 (센티널 업종 필터)"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "전 업종에서 활성 0곳 업태가 1376종에 달하는 반면, 활성 1000곳 이상 대형 업태는 64종뿐인데 이들이 활성 63만6935곳을 차지한다 — 극단적 롱테일 구조다."
              sql: |
                -- :dataset='ALL'
                SELECT CASE WHEN active_cnt = 0 THEN '0'
                            WHEN active_cnt < 10 THEN '1-9'
                            WHEN active_cnt < 100 THEN '10-99'
                            WHEN active_cnt < 1000 THEN '100-999'
                            ELSE '1000+' END AS size_band,
                       COUNT(*) AS uptae_cnt,
                       SUM(active_cnt) AS active_total
                FROM d1_uptae_rollup
                WHERE (:dataset = 'ALL' OR dataset = :dataset)
                GROUP BY size_band
                ORDER BY MIN(active_cnt)
              requires: [select_columns, aggregate, group_by, sort, filter_range]
              param_defaults: { dataset: "ALL" }
            - pattern_id: "survival_rate_distribution"
              question_ko: "업태 생존율은 어떻게 분포하나? — 생존율 20%p 구간별 업태 수·재고 (:dataset='ALL'이면 전 업종, :min_total 이상 모수만)"
              axes: "분포 — 생존율 구간(00-20%~80-100%)별 업태 수·활성·누적 (임계값 + 센티널)"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "누적 100건 이상 업태 중 36종이 생존율 20% 미만 구간에 있고, 이 구간에만 누적 61만6413건·활성 7만3001곳이 몰려 있어 대형 업태일수록 저생존 구간에 집중된다."
              sql: |
                -- :min_total=100, :dataset='ALL'
                SELECT CASE WHEN active_cnt*1.0/total_cnt < 0.2 THEN '00-20%'
                            WHEN active_cnt*1.0/total_cnt < 0.4 THEN '20-40%'
                            WHEN active_cnt*1.0/total_cnt < 0.6 THEN '40-60%'
                            WHEN active_cnt*1.0/total_cnt < 0.8 THEN '60-80%'
                            ELSE '80-100%' END AS survival_band,
                       COUNT(*) AS uptae_cnt,
                       SUM(active_cnt) AS active_total,
                       SUM(total_cnt) AS total_all
                FROM d1_uptae_rollup
                WHERE total_cnt >= :min_total
                  AND (:dataset = 'ALL' OR dataset = :dataset)
                GROUP BY survival_band
                ORDER BY survival_band
              requires: [select_columns, aggregate, group_by, sort, filter_range]
              param_defaults: { min_total: 100, dataset: "ALL" }
            - pattern_id: "dataset_head_to_head"
              question_ko: "두 업종(dataset)을 나란히 놓고 규모·생존율·신규 유입을 비교하면? (예: 일반음식점 vs 휴게음식점)"
              axes: "dataset 2종 비교 단면 — 재고·유입·생존율 프로필 병렬"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "general_restaurant는 활성 12만427곳·생존율 22.5%·신규 유입 10.5%인 반면 rest_restaurant는 활성 3만6941곳·생존율 25.2%·신규 유입 19.0%로, 휴게음식점 쪽이 생존율과 유입 모두 우위다."
              sql: |
                -- :ds_a='general_restaurant', :ds_b='rest_restaurant'
                SELECT dataset, category, major,
                       COUNT(*) AS uptae_cnt,
                       SUM(active_cnt) AS active_total,
                       SUM(total_cnt) AS total_all,
                       SUM(opened_last_365d) AS opened_365d,
                       ROUND(SUM(active_cnt)*1.0/NULLIF(SUM(total_cnt),0),3) AS survival_rate,
                       ROUND(100.0*SUM(opened_last_365d)/NULLIF(SUM(active_cnt),0),1) AS new_pct
                FROM d1_uptae_rollup
                WHERE dataset IN (:ds_a, :ds_b)
                GROUP BY dataset, category, major
                ORDER BY active_total DESC
              requires: [select_columns, aggregate, group_by, sort, filter_range]
            - pattern_id: "keyword_rollup"
              question_ko: "특정 키워드가 들어간 업태군 전체의 시장 규모 총계는? (예: '미용' 관련 업태를 다 합치면 몇 곳인가)"
              axes: "키워드 집계 단면 — LIKE 매칭 업태군의 재고·유입·생존율 총계 1행"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c36a40599c4d4a59be10dfa6e02a3913"
              insight_sample_ko: "'미용' 포함 업태는 3종이며 활성 2만6267곳(누적 8만5714곳, 생존율 30.6%), 최근 1년 개업은 2253곳이다."
              sql: |
                -- :keyword='미용'
                SELECT COUNT(*) AS uptae_cnt,
                       SUM(active_cnt) AS active_total,
                       SUM(total_cnt) AS total_all,
                       SUM(opened_last_365d) AS opened_365d,
                       ROUND(SUM(active_cnt)*1.0/NULLIF(SUM(total_cnt),0),3) AS survival_rate
                FROM d1_uptae_rollup
                WHERE uptaenm LIKE '%' || :keyword || '%'
              requires: [select_columns, aggregate, filter_range]
          contract_version: v1
          product_question: 업태 구성은 어떤가?
          grain: 업종3단×업태×자치구
          primary_key: [major, category, dataset, uptaenm, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, uptaenm, gu_code]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(업태 필드 보유 detail — 19종).
        tests: [not_null]
      - name: uptaenm
        data_type: varchar
        description: 업태명(원천 uptaenm 최말단 분류).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: active_cnt
        data_type: bigint
        description: 해당 업태 영업(01) 업소 수.
      - name: total_cnt
        data_type: bigint
        description: 해당 업태 누적 업소 수(폐업 포함).
      - name: opened_last_365d
        data_type: bigint
        description: 최근 365일 개업 수(성장 주도 업태 판단).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_multi_site
    description: 체인·다점포 비율 — 동일 전화 다지점(체인/다점포 추정) 비율 × 업종. 근사(전화 44%·번호공유 노이즈).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_multi_site
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_multi_site   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 업종별 다점포 운영 비율
            summary: 같은 전화번호를 여러 지점이 함께 쓰는 경우를 다점포로 보고 업종별 비율을 냈습니다.
            caveat: 전화번호가 있는 업소가 44%뿐이고 번호 공유 잡음이 섞여 근사값입니다.
            use_cases:
              - 체인화 정도 비교
              - 프랜차이즈 침투 업종 탐색
              - 독립 점포 경쟁 환경 파악
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "top_multi_site_ratio"
              question_ko: "다점포(체인)화 비율이 가장 높은 업종 top-N은?"
              axes: "업종3단(dataset) × 다지점 비율, 내림차순 랭킹"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "영화배급업이 89.1%(394곳 중 351)로 압도적 1위, 동물약국 74.6%·게임물배급업 73.6% 순 — 배급·유통형 업종이 최상위."
              sql: |
                SELECT dataset, dataset_ko, major_ko, category_ko, sites_with_phone, multi_site_locations,
                       ROUND(multi_site_ratio*100,1) AS multi_site_pct, multi_site_operators, max_sites_per_operator
                FROM d1_multi_site
                WHERE sites_with_phone >= :min_sites  -- 예: 300 (소표본 잡음 컷, 필수)
                ORDER BY multi_site_ratio DESC
                LIMIT :n;  -- 예: 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "bottom_multi_site_ratio"
              question_ko: "(축 반전: 정렬 반전) 독립 자영업 성격이 가장 강한(다점포화가 낮은) 업종은?"
              axes: "top_multi_site_ratio의 정렬 반전(ASC) — 체인 침투 최저 업종"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "세탁업 1.9%(2,728곳 중 53)·노래연습장 3.3%·치과기공소 3.6% — 생활밀착 업종은 여전히 독립 자영업 위주."
              sql: |
                SELECT dataset, dataset_ko, major_ko, category_ko, sites_with_phone, multi_site_locations,
                       ROUND(multi_site_ratio*100,1) AS multi_site_pct
                FROM d1_multi_site
                WHERE sites_with_phone >= :min_sites  -- 예: 300
                ORDER BY multi_site_ratio ASC
                LIMIT :n;  -- 예: 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "top_multi_site_volume"
              question_ko: "(축 반전: 관점 반전, 비율→절대량) 다지점 지점 수가 절대적으로 많은 업종은?"
              axes: "업종3단 × 다지점 지점 절대 수 — 비율 랭킹의 관점 반전(분모 하한 불필요)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "절대량 1위는 통신판매업 19,062지점(비율은 18.9%에 불과), 2위 출판사 4,790 — 비율 top(영화배급업 351지점)과 절대량 top이 완전히 다른 명단."
              sql: |
                SELECT dataset, dataset_ko, major_ko, multi_site_locations, sites_with_phone,
                       ROUND(multi_site_ratio*100,1) AS multi_site_pct, multi_site_operators
                FROM d1_multi_site
                ORDER BY multi_site_locations DESC
                LIMIT :n;  -- 예: 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_weighted_rollup"
              question_ko: "(축 반전: 차원 교환, dataset→category) 중분류 단위로 묶으면 어느 분야가 체인화됐나?"
              axes: "중분류(category) 가중 집계 — 행 단순평균이 아닌 지점 수 가중 비율"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "동물 53.4%로 1위, 위생·미용 7.8%로 최하 — 중분류 간 가중 다지점율 격차 약 7배. multi_site_operators는 업종 간 중복 가능성 때문에 SUM에서 의도적으로 제외."
              sql: |
                SELECT category_ko, major_ko, COUNT(*) AS n_datasets, SUM(sites_with_phone) AS sites_with_phone,
                       SUM(multi_site_locations) AS multi_site_locations,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS weighted_multi_site_pct
                FROM d1_multi_site
                GROUP BY category_ko, major_ko
                ORDER BY weighted_multi_site_pct DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "keyword_slice"
              question_ko: ":param 단면 — 특정 업종(코드 또는 한글 키워드)의 다점포 현황은?"
              axes: "단일 업종 단면 조회 — dataset 코드 일치 또는 dataset_ko 부분 일치"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "'약국' 검색 → 약국 21.0%(4,743곳, 최대 7지점) vs 동물약국 74.6% — 같은 키워드 안에서도 체인화 정도가 크게 갈림."
              sql: |
                SELECT dataset, dataset_ko, major_ko, category_ko, sites_with_phone, multi_site_locations,
                       ROUND(multi_site_ratio*100,1) AS multi_site_pct, multi_site_operators, max_sites_per_operator
                FROM d1_multi_site
                WHERE dataset = :q OR dataset_ko LIKE '%' || :q || '%'  -- 예: :q = '약국' (코드·한글 겸용)
                ORDER BY sites_with_phone DESC;
              requires: [select_columns, sort, aggregate, filter_set]
            - pattern_id: "major_category_cross"
              question_ko: "두 축 교차 — 대분류×중분류 매트릭스에서 다지점율 분포는?"
              axes: "대분류(major) × 중분류(category) 2축 교차, 가중 비율"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "보건 대분류 내부 격차가 가장 큼: 동물 53.4% vs 위생·미용 7.8%. 문화 38.4%·환경 34.0%·산업 21.3%는 중분류=대분류 1:1 구조."
              sql: |
                SELECT major_ko, category_ko, SUM(sites_with_phone) AS sites,
                       SUM(multi_site_locations) AS multi_locs,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS multi_site_pct
                FROM d1_multi_site
                GROUP BY major_ko, category_ko
                ORDER BY major_ko, multi_site_pct DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "chain_depth_ranking"
              question_ko: "운영주체당 지점 수(같은 업종 내 체인 심도)가 깊은 업종은?"
              axes: "업종3단 × 업종 내 지점수/운영주체 비 — '넓게 퍼진 체인'과 '깊게 파고든 체인' 구분"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "영화상영관이 운영주체당 5.23지점(53주체·277지점)으로 압도적 — 멀티플렉스 구조. 2위 위탁급식 1.89. 값이 2 미만인 업종은 운영주체의 나머지 지점이 타 업종에 있다는 뜻(전역 전화 기준 판정)."
              sql: |
                SELECT dataset, dataset_ko, major_ko, multi_site_operators, multi_site_locations,
                       ROUND(1.0*multi_site_locations/multi_site_operators,2) AS avg_sites_per_operator,
                       max_sites_per_operator
                FROM d1_multi_site
                WHERE multi_site_operators >= :min_ops  -- 예: 30 (주체 수 하한으로 잡음 컷)
                ORDER BY avg_sites_per_operator DESC
                LIMIT :n;  -- 예: 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "market_overview"
              question_ko: "서울 전체에서 다점포 지점은 몇 %인가? (개요 카드)"
              axes: "테이블 전체 1행 요약 — 후속 질의의 기준선"
              verified_rows: 1
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "140개 업종, 전화 보유 289,892지점 중 66,554지점(23.0%)이 다지점 소속. 단일 운영주체 최대 19지점(20+ 공용번호 컷 상한)."
              sql: |
                SELECT COUNT(*) AS n_industries, SUM(sites_with_phone) AS total_sites_with_phone,
                       SUM(multi_site_locations) AS total_multi_site_locations,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS overall_multi_site_pct,
                       MAX(max_sites_per_operator) AS max_sites_single_operator
                FROM d1_multi_site;
              requires: [select_columns, aggregate]
            - pattern_id: "inv_category_fixed_dataset_rank"
              question_ko: "이 업종군 안에서 다점포 비율이 높은 세부 업종은? (중분류 고정→세부 드릴다운)"
              axes: "중분류 고정(:category) → dataset 랭킹 — 차원 교환 정방향"
              verified_rows: 16
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "식품군 내에서는 건강기능식품유통전문판매업이 다점포 비율 69.7%로 1위."
              sql: |
                -- :category='food', :min_sites=100
                SELECT dataset_ko, sites_with_phone, multi_site_locations, ROUND(multi_site_ratio*100,1) AS multi_pct,
                       max_sites_per_operator
                FROM d1_multi_site WHERE category = :category AND sites_with_phone >= :min_sites
                ORDER BY multi_site_ratio DESC
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_sites: 100 }
            - pattern_id: "inv_dataset_to_category_rollup"
              question_ko: "중분류 단위로 합치면 다점포 비율은 어떻게 되나? (세부→상위 롤업)"
              axes: "dataset → category 롤업 — 위 패턴의 역방향(차원 상향)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "중분류로 합치면 동물(animal)이 다점포 53.4%로 최상위 — 세부 업종 랭킹과 순서가 달라진다."
              sql: |
                SELECT category, SUM(sites_with_phone) AS sites, SUM(multi_site_locations) AS multi_locs,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS multi_pct,
                       MAX(max_sites_per_operator) AS max_sites
                FROM d1_multi_site GROUP BY category ORDER BY multi_pct DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "new_max_sites_extreme"
              question_ko: "한 운영자가 가장 많은 지점을 가진 업종은? (비율 대신 극단값 지표)"
              axes: "업종 랭킹 — max_sites_per_operator(지표 반전: 비율→극단)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "한 운영자의 최대 지점 수는 의료기기판매(임대)업이 1위 — 비율이 아닌 극단값으로 보면 체인 구조가 드러난다."
              sql: |
                -- :n=10
                SELECT dataset_ko, category_ko, multi_site_operators, max_sites_per_operator, sites_with_phone
                FROM d1_multi_site ORDER BY max_sites_per_operator DESC LIMIT :n
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
            - pattern_id: "new_sites_per_operator"
              question_ko: "운영자당 지점 수(체인 밀도)가 높은 업종은?"
              axes: "업종 랭킹 — 지점/운영자 파생비율(절대량과 다른 시선)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ea87eec4b13f4529894660d21261d0d1"
              insight_sample_ko: "영화상영관은 운영자당 5.23개 지점으로 체인 밀도 최고(운영자 53명·지점 277개)."
              sql: |
                -- :min_ops=20, :n=10
                SELECT dataset_ko, multi_site_operators, multi_site_locations,
                       ROUND(1.0*multi_site_locations/NULLIF(multi_site_operators,0),2) AS locs_per_operator
                FROM d1_multi_site WHERE multi_site_operators >= :min_ops
                ORDER BY locs_per_operator DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_ops: 20, n: 10 }
            - pattern_id: "dim_switch_rollup"
              question_ko: "대분류/중분류 중 원하는 축(:dim ∈ {major, category})으로 묶었을 때 어느 분야가 가장 체인화됐나?"
              axes: "차원 스위치 롤업 — category_weighted_rollup·inv_dataset_to_category_rollup 의 상위호환(major 축 롤업은 기존에 없음), 지점 수 가중 비율"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "대분류 가중 집계에서 문화가 다지점 비율 38.4%(업종 52개, 지점 34,973곳 중 다지점 13,442곳, 최대 체인 18개점)로 1위다."
              sql: |
                -- :dim='major'
                SELECT CASE :dim WHEN 'major' THEN major_ko ELSE category_ko END AS dim_value,
                       COUNT(*) AS n_datasets,
                       SUM(sites_with_phone) AS sites_with_phone,
                       SUM(multi_site_locations) AS multi_site_locations,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS weighted_multi_pct,
                       MAX(max_sites_per_operator) AS max_chain_depth
                FROM d1_multi_site
                GROUP BY CASE :dim WHEN 'major' THEN major_ko ELSE category_ko END
                ORDER BY weighted_multi_pct DESC
              requires: [select_columns, aggregate, group_by, sort]
              param_enum: { dim: [major, category] }
            - pattern_id: "ratio_band_histogram"
              question_ko: "업종들의 체인화율은 어떤 분포인가? (0-10%/10-30%/30-50%/50%+ 구간별 업종 수, 지점 :min_sites 곳 이상만)"
              axes: "다지점 비율 구간 분포(히스토그램) — 기존 패턴에 없는 분포 축"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "지점 100곳 이상 업종 기준 체인화율 0-10% 구간에 13개 업종·79,830개 지점이 몰려 있고 이 구간 평균 다지점율은 5.7%다."
              sql: |
                -- :min_sites=100
                SELECT CASE WHEN multi_site_ratio < 0.1 THEN '0-10%'
                            WHEN multi_site_ratio < 0.3 THEN '10-30%'
                            WHEN multi_site_ratio < 0.5 THEN '30-50%'
                            ELSE '50%+' END AS ratio_band,
                       COUNT(*) AS n_datasets,
                       SUM(sites_with_phone) AS sites_with_phone,
                       SUM(multi_site_locations) AS multi_site_locations,
                       ROUND(100.0*AVG(multi_site_ratio),1) AS avg_multi_pct
                FROM d1_multi_site
                WHERE sites_with_phone >= :min_sites
                GROUP BY CASE WHEN multi_site_ratio < 0.1 THEN '0-10%'
                            WHEN multi_site_ratio < 0.3 THEN '10-30%'
                            WHEN multi_site_ratio < 0.5 THEN '30-50%'
                            ELSE '50%+' END
                ORDER BY ratio_band
              requires: [select_columns, aggregate, group_by, filter_range, sort]
              param_defaults: { min_sites: 100 }
            - pattern_id: "category_share_of_total"
              question_ko: "서울 전체 다지점 지점 중 어느 중분류가 몇 %를 차지하나? (구성비 상위 :n개)"
              axes: "중분류 × 전체 대비 구성비(share-of-total) — 서브쿼리 총합 대비 비중, 기존에 없는 구성비 축"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "서울 전체 다지점 지점의 37.0%(24,603곳)가 산업 중분류에서 나와 구성비 1위다."
              sql: |
                -- :n=10
                SELECT category_ko, major_ko,
                       SUM(multi_site_locations) AS multi_site_locations,
                       SUM(sites_with_phone) AS sites_with_phone,
                       ROUND(100.0*SUM(multi_site_locations)/(SELECT SUM(multi_site_locations) FROM d1_multi_site),1) AS share_of_all_multi_pct
                FROM d1_multi_site
                GROUP BY category_ko, major_ko
                ORDER BY multi_site_locations DESC
                LIMIT :n
              requires: [select_columns, aggregate, group_by, subquery, sort]
              param_defaults: { n: 10 }
            - pattern_id: "metric_switch_rank"
              question_ko: "원하는 지표(:metric ∈ {ratio, locations, operators, independent, max_sites}) 기준 상위 업종은? (:major='ALL'이면 전체, 대분류 코드(culture/environment/health/industry)면 해당 대분류만)"
              axes: "지표 스위치 랭킹 + 대분류 센티널 필터 — top_multi_site_ratio·top_multi_site_volume·new_max_sites_extreme 의 상위호환, independent(단독 지점 수) 지표는 신규"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "지점 300곳 이상 업종에서 다지점 비율 1위는 영화배급업으로, 지점 393곳 중 350곳(89.1%)이 다지점이다."
              sql: |
                -- :metric='ratio', :major='ALL', :min_sites=300, :n=10
                SELECT dataset, dataset_ko, major_ko, category_ko, sites_with_phone,
                       multi_site_locations, ROUND(multi_site_ratio*100,1) AS multi_site_pct,
                       multi_site_operators, max_sites_per_operator,
                       sites_with_phone - multi_site_locations AS single_site_locations
                FROM d1_multi_site
                WHERE sites_with_phone >= :min_sites
                  AND (:major = 'ALL' OR major = :major)
                ORDER BY CASE :metric
                           WHEN 'ratio' THEN multi_site_ratio
                           WHEN 'locations' THEN multi_site_locations
                           WHEN 'operators' THEN multi_site_operators
                           WHEN 'independent' THEN sites_with_phone - multi_site_locations
                           ELSE max_sites_per_operator
                         END DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_sites: 300, major: "ALL", n: 10 }
              param_enum: { metric: [ratio, locations, operators, independent, max_sites] }
            - pattern_id: "category_leader_per_group"
              question_ko: "각 중분류에서 체인화가 가장 앞선 세부 업종은 무엇인가? (중분류별 1위만, 지점 :min_sites 곳 이상)"
              axes: "중분류별 argmax(윈도우 ROW_NUMBER) — 그룹당 1행 리더보드, 기존에 없는 축"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "중분류별 1위 가운데 최고는 문화의 영화상영관으로 다지점 비율 96.2%(지점 288곳, 최대 체인 12개점)다."
              sql: |
                -- :min_sites=100
                SELECT category_ko, major_ko, dataset_ko, sites_with_phone,
                       ROUND(multi_site_ratio*100,1) AS multi_site_pct, max_sites_per_operator
                FROM (
                  SELECT *, ROW_NUMBER() OVER (PARTITION BY category ORDER BY multi_site_ratio DESC) AS rn
                  FROM d1_multi_site
                  WHERE sites_with_phone >= :min_sites
                ) t
                WHERE rn = 1
                ORDER BY multi_site_pct DESC
              requires: [select_columns, window, subquery, filter_range, sort]
              param_defaults: { min_sites: 100 }
            - pattern_id: "major_chained_share"
              question_ko: "대분류별로 '체인화가 :min_ratio 이상 진행된 업종'은 몇 개이고 전체의 몇 %인가? (지점 :min_sites 곳 이상만)"
              axes: "대분류 × 임계 초과 업종 수 비중 — 조건부 카운트 비율, 기존에 없는 축"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "지점 100곳 이상 업종 중 체인화율 30%를 넘긴 비중은 문화가 26개 중 19개(73.1%)로 가장 높다."
              sql: |
                -- :min_ratio=0.3, :min_sites=100
                SELECT major_ko,
                       COUNT(*) AS n_datasets,
                       SUM(CASE WHEN multi_site_ratio >= :min_ratio THEN 1 ELSE 0 END) AS n_chained,
                       ROUND(100.0*SUM(CASE WHEN multi_site_ratio >= :min_ratio THEN 1 ELSE 0 END)/COUNT(*),1) AS chained_dataset_pct
                FROM d1_multi_site
                WHERE sites_with_phone >= :min_sites
                GROUP BY major_ko
                ORDER BY chained_dataset_pct DESC
              requires: [select_columns, aggregate, group_by, filter_range, sort]
              param_defaults: { min_ratio: 0.3, min_sites: 100 }
            - pattern_id: "dominance_skew"
              question_ko: "평균적인 체인 대비 최대 운영자가 유독 큰(한 사업자 편중이 심한) 업종은 어디인가? (운영주체 :min_ops 곳 이상, 상위 :n개)"
              axes: "업종 랭킹 — 최대 체인 심도 / 평균 체인 심도 편중 배수. chain_depth_ranking(평균 심도)과 다른 '지배 사업자 쏠림' 관점"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "식품판매업(기타)은 다지점 운영주체 324곳의 평균이 1.06개점인데 최대 운영자는 19개점을 보유해 편중 배수 17.95로 1위다."
              sql: |
                -- :min_ops=30, :n=10
                SELECT dataset_ko, category_ko, multi_site_operators, multi_site_locations,
                       max_sites_per_operator,
                       ROUND(1.0*multi_site_locations/multi_site_operators,2) AS avg_sites_per_operator,
                       ROUND(1.0*max_sites_per_operator*multi_site_operators/multi_site_locations,2) AS dominance_skew
                FROM d1_multi_site
                WHERE multi_site_operators >= :min_ops
                ORDER BY dominance_skew DESC
                LIMIT :n
              requires: [select_columns, aggregate, sort, filter_range]
              param_defaults: { min_ops: 30, n: 10 }
            - pattern_id: "size_band_chain_pct"
              question_ko: "업종 규모(지점 수)가 클수록 체인화도 높은가? (소형 <:small_max / 중형 <:mid_max / 대형 3개 밴드 비교)"
              axes: "업종 규모 밴드 × 가중 다지점 비율 — 규모-체인화 상관을 보는 교차 분포, 기존에 없는 축"
              verified_rows: 3
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "지점 500곳 미만 소형 업종 85개의 가중 다지점 비율이 42.6%(지점 9,431곳 중 4,019곳)로, 소형 업종군에서도 체인화가 상당하다."
              sql: |
                -- :small_max=500, :mid_max=3000
                SELECT CASE WHEN sites_with_phone < :small_max THEN '1_소형'
                            WHEN sites_with_phone < :mid_max THEN '2_중형'
                            ELSE '3_대형' END AS size_band,
                       COUNT(*) AS n_datasets,
                       SUM(sites_with_phone) AS sites_with_phone,
                       SUM(multi_site_locations) AS multi_site_locations,
                       ROUND(100.0*SUM(multi_site_locations)/SUM(sites_with_phone),1) AS weighted_multi_pct,
                       MAX(max_sites_per_operator) AS max_chain_depth
                FROM d1_multi_site
                GROUP BY CASE WHEN sites_with_phone < :small_max THEN '1_소형'
                            WHEN sites_with_phone < :mid_max THEN '2_중형'
                            ELSE '3_대형' END
                ORDER BY size_band
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "dataset_vs_category_avg"
              question_ko: "이 중분류(:category) 안에서 중분류 평균보다 유독 체인화가 앞선(뒤처진) 세부 업종은? (지점 :min_sites 곳 이상)"
              axes: "세부 업종 vs 소속 중분류 가중평균 편차(%p) — 벤치마크 대비 편차 축, inv_category_fixed_dataset_rank(단순 랭킹)와 다른 정보"
              verified_rows: 16
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f298d8d5cb20419a9a79652bc99c6944"
              insight_sample_ko: "식품 중분류에서 건강기능식품유통전문판매업이 다지점율 69.7%로 중분류 가중평균 19.6%보다 50.0%p 높아 가장 앞서 있다."
              sql: |
                -- :category='food', :min_sites=100
                SELECT d.dataset_ko, d.sites_with_phone,
                       ROUND(d.multi_site_ratio*100,1) AS multi_site_pct,
                       ROUND(c.cat_weighted_pct,1) AS category_weighted_pct,
                       ROUND(d.multi_site_ratio*100 - c.cat_weighted_pct,1) AS diff_pp
                FROM d1_multi_site d
                JOIN (
                  SELECT category, 100.0*SUM(multi_site_locations)/SUM(sites_with_phone) AS cat_weighted_pct
                  FROM d1_multi_site GROUP BY category
                ) c ON c.category = d.category
                WHERE d.category = :category AND d.sites_with_phone >= :min_sites
                ORDER BY diff_pp DESC
              requires: [select_columns, aggregate, group_by, subquery, filter_range, sort]
              param_defaults: { min_sites: 100 }
          contract_version: v1
          product_question: 다점포 운영이 흔한 업종은?
          grain: 업종3단
          primary_key: [major, category, dataset]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]
      - name: sites_with_phone
        data_type: bigint
        description: 전화번호 보유 영업 지점 수(분모).
      - name: multi_site_locations
        data_type: bigint
        description: 다지점(동일 전화 2곳 이상)에 속한 지점 수.
      - name: multi_site_ratio
        data_type: decimal(38,18)
        description: 다지점 비율 = multi_site_locations / sites_with_phone(체인화 근사).
      - name: multi_site_operators
        data_type: bigint
        description: 다지점 운영주체(고유 전화) 수.
      - name: max_sites_per_operator
        data_type: bigint
        description: 단일 전화 최대 지점 수(20+ 공용번호는 컷).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_change_activity
    description: 간판·자리 자주 바꾸는 업종 — 업소당 버전수·개명/이전 발생률 × 업종. 씨앗 지표(이력 축적 초기, 상대순위로 해석).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_change_activity
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_change_activity   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 업소 정보 변경 활발도
            summary: 업소마다 정보가 몇 번 바뀌었는지, 상호 변경과 이전이 얼마나 잦은지 업종별로 냈습니다.
            caveat: 이력이 쌓이는 초기라 절대값보다 업종 간 상대 순위로 읽어야 합니다.
            use_cases:
              - 간판 교체가 잦은 업종 파악
              - 업소 안정성 비교
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rename_ratio_top"
              question_ko: "간판(상호)을 가장 자주 바꾸는 업종은? (개명률 top-N)"
              axes: "dataset→rename_ratio desc (랭킹 top-N, 모수 하한 필터)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "개명률 1위는 대규모점포 0.96%(1,047곳 중 10곳), 2위 배출가스전문정비 0.68%, 3위 영화상영관 0.64% — 전 업종 1% 미만의 씨앗 지표라 상대순위로만 해석."
              sql: |
                -- :min_businesses 예 100 (극소 모수 왜곡 방지), :top_n 예 10
                SELECT dataset, dataset_ko, category_ko, businesses, with_rename,
                       ROUND(rename_ratio*100, 2) AS rename_pct
                FROM d1_change_activity
                WHERE businesses >= :min_businesses
                ORDER BY rename_ratio DESC, businesses DESC
                LIMIT :top_n
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "rename_volume_top"
              question_ko: "개명 절대 건수가 가장 많은 업종은? (비율이 아닌 절대값 관점)"
              axes: "rename_ratio_top 의 관점 반전: 비중(rename_ratio)↔절대(with_rename)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "절대 건수는 일반음식점 469곳 개명으로 압도적 1위 — 그러나 비율은 0.09%로 비율 1위 대규모점포(0.96%)의 1/10. 축을 바꾸면 1위가 완전히 달라짐."
              sql: |
                SELECT dataset, dataset_ko, businesses, with_rename,
                       ROUND(rename_ratio*100, 2) AS rename_pct
                FROM d1_change_activity
                ORDER BY with_rename DESC, businesses DESC
                LIMIT 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "relocation_ratio_top"
              question_ko: "자리를 가장 자주 옮기는(주소 변경) 업종은? (이전율 top-N)"
              axes: "rename_ratio_top 의 관점 반전: 개명(rename)↔이전(relocation)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "이전율 1위 동물용의료용구판매업 0.37%, 2위 국제회의기획업 0.25%, 3위 건강기능식품유통전문판매업 0.24% — 매장 입지 의존이 낮은 유통·기획형 업종이 상위."
              sql: |
                -- :min_businesses 예 100
                SELECT dataset, dataset_ko, category_ko, businesses, with_relocation,
                       ROUND(relocation_ratio*100, 2) AS relocation_pct
                FROM d1_change_activity
                WHERE businesses >= :min_businesses
                ORDER BY relocation_ratio DESC, businesses DESC
                LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "version_activity_top"
              question_ko: "업소 정보 갱신(버전 축적)이 가장 활발한 업종은?"
              axes: "dataset→avg_versions desc"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "병원이 업소당 평균 1.15버전으로 갱신 최다(2위 부속의료기관 1.09) — 의료계가 상위 독식, 의원은 단일 업소 최대 8회 갱신 기록."
              sql: |
                -- :min_businesses 예 100
                SELECT dataset, dataset_ko, businesses, avg_versions, max_versions
                FROM d1_change_activity
                WHERE businesses >= :min_businesses
                ORDER BY avg_versions DESC, businesses DESC
                LIMIT 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "static_large_industries"
              question_ko: "모수가 큰데도 정보 변경이 거의 없는 정적 업종은?"
              axes: "version_activity_top 의 정렬 반전: desc↔asc (최다 갱신↔무변경 대형)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "통신판매업은 93.6만 업소로 최대 모수인데 평균 버전 1.00 — 등록 후 정보가 사실상 안 바뀌는 대표 업종(일반음식점 53.6만도 동일 1.00)."
              sql: |
                -- :min_businesses 예 1000 (대형 업종만)
                SELECT dataset, dataset_ko, businesses, avg_versions, with_rename, with_relocation
                FROM d1_change_activity
                WHERE businesses >= :min_businesses
                ORDER BY avg_versions ASC, businesses DESC
                LIMIT 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "category_change_rollup"
              question_ko: "중분류(11종) 단위로 보면 어느 분야가 개명·이전이 활발한가?"
              axes: "rename_ratio_top 의 차원 교환: dataset(업종 3단)↔category(중분류 rollup, 가중 집계)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "중분류 개명률 1위는 숙박 0.211%로 최하위 산업(0.016%)의 13배 — 반면 이전율은 안경·치과(0.067%)·문화(0.050%)가 상위로 축마다 순위가 뒤집힘."
              sql: |
                SELECT category, category_ko, major_ko,
                       COUNT(*) AS datasets, SUM(businesses) AS businesses,
                       ROUND(SUM(with_rename)*100.0/SUM(businesses), 3) AS rename_pct,
                       ROUND(SUM(with_relocation)*100.0/SUM(businesses), 3) AS relocation_pct,
                       ROUND(SUM(businesses*avg_versions)/SUM(businesses), 3) AS w_avg_versions
                FROM d1_change_activity
                GROUP BY category, category_ko, major_ko
                ORDER BY rename_pct DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "industry_keyword_profile"
              question_ko: "특정 업종(한글 키워드)의 변경 활동 프로필은? — 파라미터 단면 조회"
              axes: "파라미터 단면: :keyword→dataset_ko LIKE (전 지표 프로필)"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "'음식점' 매칭 4개 업종 중 일반음식점(53.6만 업소)이 개명률 0.09%로 최고, 외국인전용·관광 유흥음식점 2종(모수 10 미만)은 변경 이력 전무."
              sql: |
                -- :keyword 예 '음식점' (dataset_ko 부분 일치 검색)
                SELECT dataset, dataset_ko, major_ko, category_ko, businesses, avg_versions,
                       max_versions, with_rename, ROUND(rename_ratio*100,2) AS rename_pct,
                       with_relocation, ROUND(relocation_ratio*100,2) AS relocation_pct
                FROM d1_change_activity
                WHERE dataset_ko LIKE '%' || :keyword || '%'
                ORDER BY businesses DESC
              requires: [select_columns, sort, aggregate, filter_set]
            - pattern_id: "rename_vs_relocation_tilt"
              question_ko: "개명 성향 업종 vs 이전 성향 업종 — 두 변경 축을 교차하면?"
              axes: "두 축 교차: rename_ratio × relocation_ratio → 성향 분류(tilt)"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "대규모점포·영화상영관·숙박업은 '개명우세'(리브랜딩형), 동물용의료용구판매·국제회의기획업은 '이전우세'(이동형) — 목재수입유통업만 0.15%로 정확히 동률."
              sql: |
                -- :min_businesses 예 100
                SELECT dataset, dataset_ko, businesses,
                       ROUND(rename_ratio*100, 2) AS rename_pct,
                       ROUND(relocation_ratio*100, 2) AS relocation_pct,
                       CASE WHEN rename_ratio > relocation_ratio THEN '개명우세'
                            WHEN relocation_ratio > rename_ratio THEN '이전우세'
                            ELSE '동률' END AS tilt
                FROM d1_change_activity
                WHERE (with_rename + with_relocation) > 0 AND businesses >= :min_businesses
                ORDER BY (rename_ratio + relocation_ratio) DESC
                LIMIT 15
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "major_change_summary"
              question_ko: "대분류(보건/문화/산업/환경) 수준의 변경 활동 총괄은?"
              axes: "차원 교환: dataset↔major(최상위 rollup, 4행 요약)"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "개명률은 보건(0.057%)이 산업(0.016%)의 3.6배로 1위인데, 이전율 1위는 문화(0.050%) — 대분류에서도 개명 축과 이전 축의 1위가 갈림."
              sql: |
                SELECT major, major_ko, COUNT(*) AS datasets, SUM(businesses) AS businesses,
                       SUM(with_rename) AS with_rename, SUM(with_relocation) AS with_relocation,
                       ROUND(SUM(with_rename)*100.0/SUM(businesses), 3) AS rename_pct,
                       ROUND(SUM(with_relocation)*100.0/SUM(businesses), 3) AS relocation_pct
                FROM d1_change_activity
                GROUP BY major, major_ko
                ORDER BY businesses DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "inv_rename_ratio_asc"
              question_ko: "상호 변경이 가장 드문(간판이 안 바뀌는) 업종은?"
              axes: "업종 랭킹 — rename_ratio ASC(변경 활발 랭킹의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "식품자동판매기업은 68,288곳 전체에서 상호 변경 0% — 간판이 바뀌지 않는 업종."
              sql: |
                -- :min_biz=200, :n=10
                SELECT dataset_ko, businesses, ROUND(rename_ratio*100,1) AS rename_pct,
                       ROUND(relocation_ratio*100,1) AS reloc_pct
                FROM d1_change_activity WHERE businesses >= :min_biz
                ORDER BY rename_ratio ASC, businesses DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_biz: 200, n: 10 }
            - pattern_id: "new_reloc_vs_rename_gap"
              question_ko: "간판만 바꾸는 업종 vs 자리를 옮기는 업종의 차이는? (두 관점 교차)"
              axes: "업종 랭킹 — 이전율-개명율 격차(두 변경 관점 대비)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "동물용의료용구판매업은 이전 0.4% vs 개명 0% — 자리는 옮기지만 이름은 그대로."
              sql: |
                -- :min_biz=200, :n=10
                SELECT dataset_ko, businesses, ROUND(rename_ratio*100,1) AS rename_pct,
                       ROUND(relocation_ratio*100,1) AS reloc_pct,
                       ROUND((relocation_ratio - rename_ratio)*100,1) AS reloc_minus_rename
                FROM d1_change_activity WHERE businesses >= :min_biz
                ORDER BY reloc_minus_rename DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_biz: 200, n: 10 }
            - pattern_id: "new_max_versions_extreme"
              question_ko: "이력 변경이 가장 많이 쌓인 업종은? (평균 대신 최대값 지표)"
              axes: "업종 랭킹 — max_versions(avg_versions 관점의 지표 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "f29e096f59d640c3801767583c6b6c8d"
              insight_sample_ko: "의원은 최대 9개 버전까지 이력이 쌓였다(평균 1.04) — 평균만 보면 놓치는 극단."
              sql: |
                -- :n=10
                SELECT dataset_ko, businesses, avg_versions, max_versions
                FROM d1_change_activity ORDER BY max_versions DESC LIMIT :n
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
            - pattern_id: "metric_dir_rank_generic"
              question_ko: "지표(개명률/이전율/평균버전/업소수)와 정렬 방향을 골라 업종 랭킹을 뽑으려면? — 통합 랭킹 스위치"
              axes: "랭킹 일반화: :metric ∈ {rename, relocation, versions, businesses} × :dir ∈ {asc, desc} + 모수 하한 — 기존 고정 랭킹(rename_ratio_top·relocation_ratio_top·version_activity_top·static_large_industries·inv_rename_ratio_asc)의 파라미터 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "이전율 내림차순(모수 100 이상)에서는 동물용의료용구판매업이 이전율 0.37%로 1위다(업소 808곳, 개명률은 0%)."
              sql: |
                -- :metric='relocation', :dir='desc', :min_biz=100, :n=10
                SELECT dataset_ko, category_ko, businesses,
                       ROUND(rename_ratio*100, 2) AS rename_pct,
                       ROUND(relocation_ratio*100, 2) AS reloc_pct,
                       avg_versions,
                       ROUND(CASE :metric WHEN 'rename' THEN rename_ratio*100
                                          WHEN 'relocation' THEN relocation_ratio*100
                                          WHEN 'versions' THEN avg_versions
                                          ELSE businesses END, 3) AS metric_value
                FROM d1_change_activity
                WHERE businesses >= :min_biz
                ORDER BY
                  CASE WHEN :dir = 'asc' THEN
                    CASE :metric WHEN 'rename' THEN rename_ratio WHEN 'relocation' THEN relocation_ratio
                                 WHEN 'versions' THEN avg_versions ELSE businesses END
                  END ASC,
                  CASE WHEN :dir = 'desc' THEN
                    CASE :metric WHEN 'rename' THEN rename_ratio WHEN 'relocation' THEN relocation_ratio
                                 WHEN 'versions' THEN avg_versions ELSE businesses END
                  END DESC,
                  businesses DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_biz: 100, dir: "desc", n: 10 }
              param_enum: { metric: [rename, relocation, versions, businesses], dir: [asc, desc] }
            - pattern_id: "category_concentration_share"
              question_ko: "특정 중분류(또는 서울 전체) 안에서 업소 수와 변경 이벤트가 어느 업종에 얼마나 집중돼 있나?"
              axes: "단면+분포: :category 센티널 필터 안에서 window 합계 대비 업종별 점유율(업소 수 vs 변경 이벤트)"
              verified_rows: 9
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "의료 중분류에서는 의료기기판매(임대)업이 업소 수의 54.24%(69,959곳)를 차지하지만 변경 이벤트 점유율은 34.01%(50건)에 그친다."
              sql: |
                -- :category='health_medical', :n=10
                SELECT dataset_ko, category_ko, businesses,
                       ROUND(businesses*100.0/SUM(businesses) OVER (), 2) AS biz_share_pct,
                       with_rename + with_relocation AS change_events,
                       ROUND((with_rename + with_relocation)*100.0/NULLIF(SUM(with_rename + with_relocation) OVER (), 0), 2) AS change_share_pct
                FROM d1_change_activity
                WHERE (:category = 'ALL' OR category = :category)
                ORDER BY businesses DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range, window]
              param_defaults: { category: "ALL", n: 10 }
            - pattern_id: "size_band_change_profile"
              question_ko: "업종 규모(업소 수 구간)가 클수록 개명·이전·정보 갱신이 더 잦은가?"
              axes: "분포: businesses 4구간 밴드 → 구간별 가중 개명률·이전율·평균버전 집계"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "업소 100곳 미만의 소형 33개 업종(총 1,036곳)은 개명·이전이 0%이고 가중 평균 버전도 1.008로, 변경 활동이 사실상 없다."
              sql: |
                SELECT CASE WHEN businesses < 100 THEN '1_100미만'
                            WHEN businesses < 1000 THEN '2_100~999'
                            WHEN businesses < 10000 THEN '3_1000~9999'
                            ELSE '4_10000이상' END AS size_band,
                       COUNT(*) AS datasets, SUM(businesses) AS total_businesses,
                       ROUND(SUM(with_rename)*100.0/SUM(businesses), 3) AS rename_pct,
                       ROUND(SUM(with_relocation)*100.0/SUM(businesses), 3) AS reloc_pct,
                       ROUND(SUM(businesses*avg_versions)/SUM(businesses), 3) AS w_avg_versions
                FROM d1_change_activity
                GROUP BY size_band
                ORDER BY size_band
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "industry_rank_position"
              question_ko: "특정 업종(한글 키워드)의 개명률·이전율·갱신활동은 전체 152개 업종 중 몇 위인가?"
              axes: "단면+랭킹 교차: :keyword 단면 조회에 상관 서브쿼리로 전체 대비 순위 3종 부여 — industry_keyword_profile(절대치 프로필)의 상대 위치 확장"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "약국은 개명률 0.03%로 152개 업종 중 51위, 이전율 0.06%로 35위, 갱신활동(평균 버전 1.01)은 22위 — 모든 축에서 중간권이다."
              sql: |
                -- :keyword='약국'
                SELECT dataset_ko, category_ko, businesses,
                       ROUND(rename_ratio*100, 2) AS rename_pct,
                       (SELECT COUNT(*)+1 FROM d1_change_activity r WHERE r.rename_ratio > t.rename_ratio) AS rename_rank,
                       ROUND(relocation_ratio*100, 2) AS reloc_pct,
                       (SELECT COUNT(*)+1 FROM d1_change_activity r WHERE r.relocation_ratio > t.relocation_ratio) AS reloc_rank,
                       avg_versions,
                       (SELECT COUNT(*)+1 FROM d1_change_activity r WHERE r.avg_versions > t.avg_versions) AS versions_rank,
                       (SELECT COUNT(*) FROM d1_change_activity) AS total_industries
                FROM d1_change_activity t
                WHERE dataset_ko LIKE '%' || :keyword || '%'
                ORDER BY businesses DESC
              requires: [select_columns, sort, subquery, filter_range]
            - pattern_id: "zero_change_overview"
              question_ko: "개명·이전 이벤트가 전혀 없는 업종은 몇 개이고, 업소 수 기준으로는 얼마나 되나?"
              axes: "단면 요약: 무변경(개명 0·이전 0) 업종 수·비중과 그 업소 수 비중을 한 행으로"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "152개 업종 중 70개(46.1%)는 개명·이전이 전혀 없지만, 이들의 업소 수는 40,637곳으로 전체의 1.4%에 불과하다 — 무변경은 소형 업종에 몰려 있다."
              sql: |
                SELECT COUNT(*) AS total_industries,
                       SUM(CASE WHEN with_rename = 0 THEN 1 ELSE 0 END) AS no_rename,
                       SUM(CASE WHEN with_relocation = 0 THEN 1 ELSE 0 END) AS no_relocation,
                       SUM(CASE WHEN with_rename = 0 AND with_relocation = 0 THEN 1 ELSE 0 END) AS fully_static,
                       ROUND(SUM(CASE WHEN with_rename = 0 AND with_relocation = 0 THEN 1 ELSE 0 END)*100.0/COUNT(*), 1) AS fully_static_pct,
                       SUM(CASE WHEN with_rename = 0 AND with_relocation = 0 THEN businesses ELSE 0 END) AS static_businesses,
                       ROUND(SUM(CASE WHEN with_rename = 0 AND with_relocation = 0 THEN businesses ELSE 0 END)*100.0/SUM(businesses), 1) AS static_biz_pct
                FROM d1_change_activity
              requires: [select_columns, aggregate]
            - pattern_id: "silent_update_rank"
              question_ko: "개명도 이전도 없는데 이력 갱신은 쌓이는 업종은? — 상호·주소 외 정보만 바뀌는 업종"
              axes: "교차: with_rename=0 ∧ with_relocation=0 ∧ avg_versions>:min_avg → 기타 항목 갱신 성향 랭킹 (static_large_industries 의 역질문)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "부속의료기관(업소 146곳)은 개명·이전이 0건인데 평균 버전 1.12(최대 4)로, 상호·주소 외 정보 갱신이 가장 활발하다."
              sql: |
                -- :min_avg=1, :n=10
                SELECT dataset_ko, category_ko, businesses, avg_versions, max_versions
                FROM d1_change_activity
                WHERE with_rename = 0 AND with_relocation = 0 AND avg_versions > :min_avg
                ORDER BY avg_versions DESC, businesses DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_avg: 1, n: 10 }
            - pattern_id: "above_avg_multiple"
              question_ko: "서울 전체 평균 개명률(또는 이전율)의 몇 배 이상인 과열 업종은 어디이고, 평균의 몇 배인가?"
              axes: "비율 벤치마크: 가중 전체 평균(서브쿼리) 대비 :factor 배 임계 + :metric ∈ {rename, relocation} 스위치 — top-N 절대 랭킹과 달리 기준선·배수를 함께 반환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "대규모점포(업소 1,049곳)의 개명률은 0.95%로 서울 전체 가중 평균 0.057%의 16.8배 — 평균 대비 가장 과열된 업종이다."
              sql: |
                -- :metric='rename', :factor=2, :min_biz=100, :n=10
                WITH bench AS (
                  SELECT CASE :metric WHEN 'rename' THEN SUM(with_rename)*1.0/SUM(businesses)
                              ELSE SUM(with_relocation)*1.0/SUM(businesses) END AS seoul_avg
                  FROM d1_change_activity
                )
                SELECT dataset_ko, category_ko, businesses,
                       ROUND(CASE :metric WHEN 'rename' THEN rename_ratio ELSE relocation_ratio END*100, 3) AS metric_pct,
                       ROUND(b.seoul_avg*100, 3) AS seoul_avg_pct,
                       ROUND((CASE :metric WHEN 'rename' THEN rename_ratio ELSE relocation_ratio END)/b.seoul_avg, 1) AS vs_avg_multiple
                FROM d1_change_activity, bench b
                WHERE businesses >= :min_biz
                  AND (CASE :metric WHEN 'rename' THEN rename_ratio ELSE relocation_ratio END) >= :factor*b.seoul_avg
                ORDER BY vs_avg_multiple DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range, subquery, aggregate]
              param_defaults: { min_biz: 100, n: 10 }
              param_enum: { metric: [rename, relocation] }
            - pattern_id: "version_depth_distribution"
              question_ko: "업소 이력 버전은 최대 몇 겹까지 쌓였고, 깊이별로 업종이 어떻게 분포하나?"
              axes: "분포: max_versions 히스토그램(깊이별 업종 수·업소 수·대표 업종) — new_max_versions_extreme(top-N 리스트)의 분포 관점 전환"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "버전이 11겹까지 쌓인 업종은 의원(37,560곳) 단 하나로, 나머지는 최대 6겹 이하 5개 깊이 구간에 분포한다."
              sql: |
                SELECT max_versions, COUNT(*) AS datasets, SUM(businesses) AS total_businesses,
                       (SELECT dataset_ko FROM d1_change_activity r
                        WHERE r.max_versions = t.max_versions ORDER BY r.businesses DESC LIMIT 1) AS top_dataset_ko
                FROM d1_change_activity t
                GROUP BY max_versions
                ORDER BY max_versions DESC
              requires: [select_columns, aggregate, group_by, sort, subquery]
            - pattern_id: "top_per_category_metric"
              question_ko: "11개 중분류 각각에서 개명률(또는 이전율)이 가장 높은 업종을 한 번에 보려면? — 그룹별 top-N"
              axes: "랭킹×그룹: ROW_NUMBER() PARTITION BY category + :metric ∈ {rename, relocation} 스위치 — 전체 top-N 이 아닌 중분류별 대표 추출"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "405e6e8ccd5642c4a2e48d4ec7c65282"
              insight_sample_ko: "중분류별 개명률 1위(모수 100 이상)를 모으면 산업 분야의 대규모점포가 개명률 0.95%로 11개 분야 챔피언 중 최고다."
              sql: |
                -- :metric='rename', :n=1, :min_biz=100
                WITH ranked AS (
                  SELECT category_ko, dataset_ko, businesses,
                         ROUND(rename_ratio*100, 2) AS rename_pct,
                         ROUND(relocation_ratio*100, 2) AS reloc_pct,
                         ROW_NUMBER() OVER (
                           PARTITION BY category
                           ORDER BY CASE :metric WHEN 'rename' THEN rename_ratio ELSE relocation_ratio END DESC,
                                    businesses DESC
                         ) AS rn
                  FROM d1_change_activity
                  WHERE businesses >= :min_biz
                )
                SELECT category_ko, dataset_ko, businesses, rename_pct, reloc_pct
                FROM ranked
                WHERE rn <= :n
                ORDER BY CASE :metric WHEN 'rename' THEN rename_pct ELSE reloc_pct END DESC
              requires: [select_columns, sort, filter_range, window]
              param_defaults: { min_biz: 100, n: 1 }
              param_enum: { metric: [rename, relocation] }
          contract_version: v1
          product_question: 업소 정보 변경이 활발한 업종은?
          grain: 업종3단
          primary_key: [major, category, dataset]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]
      - name: businesses
        data_type: bigint
        description: 집계 대상 업소 수(모수).
      - name: avg_versions
        data_type: double
        description: 업소당 평균 이력 버전 수(현재 실측 최대 약 1.1 — 씨앗).
      - name: max_versions
        data_type: bigint
        description: 업소당 최대 버전 수.
      - name: with_rename
        data_type: bigint
        description: 상호명이 바뀐 적 있는 업소 수.
      - name: rename_ratio
        data_type: decimal(38,18)
        description: 개명률 = with_rename / businesses.
      - name: with_relocation
        data_type: bigint
        description: 주소가 바뀐 적 있는 업소 수.
      - name: relocation_ratio
        data_type: decimal(38,18)
        description: 이전율 = with_relocation / businesses.

  # ═══ 화면 5: 자리 승계·연쇄창업(succession) — 근사(분모 없는 매칭 성사 건, 상대 비교만) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_address_succession
    description: 이 자리엔 다음에 뭐가? — 폐업 후 같은 도로명주소 후속 개업(365일 이내 최근접 1건) 업종 승계. 건물 단위 주소 근사.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_address_succession
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_address_succession   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 폐업 자리의 후속 업종
            summary: 어떤 업소가 닫힌 자리에 1년 안에 어떤 업종이 들어섰는지 업종 쌍으로 집계했습니다.
            caveat: 도로명주소가 같으면 같은 자리로 보는 건물 단위 근사입니다.
            use_cases:
              - 자리 대물림 패턴 분석
              - 입지별 적합 업종 추정
              - 상권 전환 방향 예측
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "top_succession_pairs"
              question_ko: "폐업→개업 업종 승계에서 가장 흔한 전이쌍 top-N은?"
              axes: "(closed_category × opened_category) 쌍 → successions DESC (ASC 반전: 희귀 전이)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품→식품 99,713건(전체 승계의 39%)으로 압도적 1위, 중앙 공실 10일. 2위 산업→산업 79,190건은 중앙 56일로 5배 느리다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days
                FROM d1_address_succession
                ORDER BY successions DESC
                LIMIT :n; -- :n 예시 10
              requires: [select_columns, sort]
            - pattern_id: "category_stickiness"
              question_ko: "어떤 업종의 자리가 같은 업종으로 다시 채워지나(자리의 업종 고착률)?"
              axes: "closed_category → 동일업종 재입점 비율 / 정렬 반전 가능(고착 최강↔최약), conversion_top 과 관점 반전쌍(고착↔전환)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품 자리 고착률 82.9% 최고 — 폐업한 식품 자리 10곳 중 8곳에 다시 식품이 들어온다. 문화는 26.7%로 최저(4곳 중 3곳이 타업종행)."
              sql: |
                SELECT closed_category, closed_category_ko, SUM(successions) AS total,
                       ROUND(100.0*SUM(CASE WHEN opened_category=closed_category THEN successions ELSE 0 END)/SUM(successions),1) AS same_pct
                FROM d1_address_succession
                GROUP BY 1,2
                ORDER BY same_pct DESC; -- ASC 반전: 자리 정체성이 약해 타업종에 넘어가는 업종부터
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "what_opens_after_close"
              question_ko: "특정 업종이 폐업한 자리에는 무엇이 들어오나? (:closed_category 단면)"
              axes: "폐업 업종 고정 → 개업 업종 분포 (what_closed_before_open 과 차원 교환 반전쌍)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품 폐업 자리는 82.9%가 다시 식품(중앙 공실 10일), 12.4%는 산업 계열(72일) — 같은 업종일수록 훨씬 빨리 채워진다."
              sql: |
                SELECT opened_category_ko, successions,
                       ROUND(100.0*successions/SUM(successions) OVER (),1) AS share_pct, p50_gap_days
                FROM d1_address_succession
                WHERE closed_category = :closed_category -- 예시 'food' (코드: food|industry|health_medical|culture|hygiene_beauty|livestock|pharmacy|animal|environment|optical_dental)
                ORDER BY successions DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "what_closed_before_open"
              question_ko: "특정 업종이 새로 들어온 자리는 원래 무엇이 폐업했던 자리인가? (:opened_category 단면 — 역방향)"
              axes: "개업 업종 고정 → 폐업 업종 분포 (what_opens_after_close 의 차원 교환 반전)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품이 들어온 자리의 88.6%는 식품 폐업 자리 — 개업 관점 고착률(88.6%)이 폐업 관점(82.9%)보다 더 높다."
              sql: |
                SELECT closed_category_ko, successions,
                       ROUND(100.0*successions/SUM(successions) OVER (),1) AS share_pct, p50_gap_days
                FROM d1_address_succession
                WHERE opened_category = :opened_category -- 예시 'food' (개업 측은 lodging 도 가능)
                ORDER BY successions DESC
                LIMIT 8;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "fastest_turnover_pairs"
              question_ko: "공실 없이 가장 빨리 채워지는 승계 전이는?"
              axes: "전이쌍 → p50_gap_days ASC (longest_vacancy_pairs 와 정렬 반전쌍)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "약국→약국 평균 공실 8.4일·중앙 0일(당일 승계), 안경·치과와 환경도 중앙 0일 — 면허 인계형 업종은 공실이 사실상 없다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days
                FROM d1_address_succession
                WHERE successions >= :min_successions -- 예시 100 (소표본 왜곡 방지)
                ORDER BY p50_gap_days ASC
                LIMIT :n; -- :n 예시 8
              requires: [select_columns, sort, filter_range]
            - pattern_id: "longest_vacancy_pairs"
              question_ko: "가장 오래 비어 있다가 채워지는 승계 전이는?"
              axes: "전이쌍 → p50_gap_days DESC (fastest_turnover_pairs 의 정렬 반전)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품→환경 평균 133일, 환경→산업 118일 — 업종이 바뀌는 승계는 공실이 3~4개월로, 동일 업종 승계(0~11일)의 수십 배."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days
                FROM d1_address_succession
                WHERE successions >= :min_successions -- 예시 100
                ORDER BY p50_gap_days DESC
                LIMIT :n; -- :n 예시 8
              requires: [select_columns, sort, filter_range]
            - pattern_id: "fast_succession_rate"
              question_ko: "90일 이내 승계 비율(회전율)이 높은 전이는?"
              axes: "전이쌍 → within_90d/successions 비율 (절대건수 within_90d 의 비중 관점 전환, 정렬 반전 가능)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "약국→약국은 96.8%가 90일 내 승계로 최고 회전율. 동일 업종 전이는 모두 82% 이상이 90일 내 채워진다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions,
                       ROUND(100.0*within_90d/successions,1) AS within_90d_pct
                FROM d1_address_succession
                WHERE successions >= :min_successions -- 예시 100
                ORDER BY within_90d_pct DESC -- ASC 반전: 가장 더디게 채워지는 전이
                LIMIT :n; -- :n 예시 8
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "major_cross_matrix"
              question_ko: "대분류(보건/문화/산업/환경) 간 승계 매트릭스 — 규모와 공실 속도는?"
              axes: "closed_major × opened_major 두 축 교차(16셀) → 건수 + 가중평균 공실"
              verified_rows: 16
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "보건→보건 116,570건(가중 평균 공실 41일)으로 최대 — 동일 대분류 내 승계가 교차 대분류(85~158일)보다 2배 이상 빠르다."
              sql: |
                SELECT closed_major_ko, opened_major_ko, SUM(successions) AS s,
                       ROUND(SUM(avg_gap_days*successions)/SUM(successions),1) AS wavg_gap
                FROM d1_address_succession
                GROUP BY 1,2
                ORDER BY s DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "conversion_top"
              question_ko: "업종이 바뀌는 승계(전환)만 보면 어디서 어디로 가장 많이 넘어가나?"
              axes: "동일업종 제외 전이쌍 → successions DESC (category_stickiness 와 관점 반전: 고착↔전환)"
              verified_rows: 8
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "업종 전환 1위는 식품→산업 14,962건(중앙 공실 72일), 역방향 산업→식품은 8,420건(51일) — 식품 자리가 산업으로 넘어가는 흐름이 1.8배 우세."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, p50_gap_days
                FROM d1_address_succession
                WHERE closed_category <> opened_category
                ORDER BY successions DESC
                LIMIT :n; -- :n 예시 8
              requires: [select_columns, sort, filter_range]
            - pattern_id: "category_net_flow"
              question_ko: "승계 시장에서 자리를 흡수하는 업종 vs 내주는 업종은? (폐업측 합계↔개업측 합계 순유입)"
              axes: "category 하나의 축을 폐업측·개업측 양방향 합산으로 반전 대조 → 순유입 DESC/ASC"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "산업이 순유입 +7,517건으로 자리를 가장 많이 흡수, 식품은 -7,730건 최대 순유출 — 폐업한 식품 자리가 산업 계열로 전환되는 압력이 가장 크다."
              sql: |
                SELECT category, category_ko, SUM(closed_s) AS closed_s, SUM(opened_s) AS opened_s,
                       SUM(opened_s)-SUM(closed_s) AS net
                FROM (
                  SELECT closed_category AS category, closed_category_ko AS category_ko, successions AS closed_s, 0 AS opened_s FROM d1_address_succession
                  UNION ALL
                  SELECT opened_category, opened_category_ko, 0, successions FROM d1_address_succession
                )
                GROUP BY 1,2
                ORDER BY net DESC; -- ASC 반전: 자리를 내주는(순유출) 업종부터
              requires: [select_columns, sort, aggregate, group_by, subquery]
            - pattern_id: "pair_cell_lookup"
              question_ko: "특정 전이쌍(예: 식품→위생·미용)의 승계 규모·공실·회전율 상세는?"
              axes: "두 파라미터 단면(:closed_category, :opened_category) → 단일 셀 전체 지표"
              verified_rows: 1
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "식품→위생·미용 승계 1,267건, 중앙 공실 14일, 90일 내 승계 72.5% — 식품 자리의 미용실 전환은 비교적 빠르다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days, within_90d,
                       ROUND(100.0*within_90d/successions,1) AS within_90d_pct
                FROM d1_address_succession
                WHERE closed_category = :closed_category -- 예시 'food'
                  AND opened_category = :opened_category; -- 예시 'hygiene_beauty'
              requires: [select_columns, aggregate]
            - pattern_id: "inv_within90d_rate_asc"
              question_ko: "같은 자리에 새 업소가 들어오기까지 오래 비는 업종쌍은? (빠른 회전 랭킹의 반전)"
              axes: "업종쌍 랭킹 — 90일 내 승계 비율 ASC(fast-succession 의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "축산→위생·미용 전환은 90일 내 승계가 20%뿐이고 중앙 공백이 206일 — 자리 전환에 시간이 걸린다."
              sql: |
                -- :min_successions=5
                SELECT closed_category_ko, opened_category_ko, successions, p50_gap_days,
                       ROUND(100.0*within_90d/successions,1) AS within90d_pct
                FROM d1_address_succession WHERE successions >= :min_successions
                ORDER BY within90d_pct ASC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_successions: 5 }
            - pattern_id: "new_same_vs_switch_category"
              question_ko: "같은 업종이 다시 들어오나, 다른 업종으로 바뀌나? (동종/이종 승계 대비)"
              axes: "동종 승계 vs 업종 전환 집계 — 관점 이분"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "동종 승계 192,058건의 중앙 공백은 11.8일 — 같은 업종이 곧바로 들어오는 경우가 압도적."
              sql: |
                SELECT CASE WHEN closed_category = opened_category THEN 'same_category' ELSE 'switched' END AS kind,
                       SUM(successions) AS successions,
                       ROUND(AVG(p50_gap_days),1) AS avg_p50_gap_days
                FROM d1_address_succession GROUP BY kind
              requires: [select_columns, aggregate, group_by]
            - pattern_id: "x_address_vs_phone_gap"
              question_ko: "자리 회전(주소 승계)은 빠른데 운영자 재도전(연락처 승계)은 느린 업종쌍은? (두 승계 제품 교차)"
              axes: "제품 간 조인 — address_succession × phone_succession p50 간격 비교"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e112ff3e9e464ac6ac8a0acdb69e0e97"
              insight_sample_ko: "안경·치과→식품은 자리 회전 119일 vs 운영자 재도전 688일로 569일 격차 — 자리는 빨리 채워지나 사람은 늦게 돌아온다."
              sql: |
                -- :min_successions=5
                SELECT a.closed_category_ko, a.opened_category_ko,
                       a.p50_gap_days AS addr_gap, p.p50_gap_days AS phone_gap,
                       (p.p50_gap_days - a.p50_gap_days) AS phone_minus_addr
                FROM d1_address_succession a
                JOIN d1_phone_succession p
                  ON p.closed_category = a.closed_category AND p.opened_category = a.opened_category
                WHERE a.successions >= :min_successions AND p.successions >= :min_successions
                ORDER BY phone_minus_addr DESC LIMIT 10
              requires: [select_columns, sort, join, filter_range]
              param_defaults: { min_successions: 5 }
            - pattern_id: "pair_rank_by_metric"
              question_ko: "전이쌍 랭킹을 원하는 지표·방향으로 보면? (:metric ∈ {successions, within90d_pct, p50_gap_days, avg_gap_days}, :dir ∈ {asc, desc})"
              axes: "전이쌍 → 지표 스위치 × 정렬 방향 스위치 랭킹 + 소표본 임계값 (top_succession_pairs·fastest_turnover_pairs·longest_vacancy_pairs·fast_succession_rate·inv_within90d_rate_asc 5종 고정 랭킹의 파라미터 일반화 상위호환)"
              verified_rows: 8
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "90일 내 승계 비율 1위는 약국→약국으로 96.8%(721건, 평균 공실 8.4일·중앙값 0일) — 약국 자리는 사실상 끊김 없이 이어진다."
              sql: |
                -- :metric='within90d_pct', :dir='desc', :min_successions=100, :n=8
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days,
                       ROUND(100.0*within_90d/successions,1) AS within90d_pct
                FROM d1_address_succession
                WHERE successions >= :min_successions
                ORDER BY
                  CASE WHEN :dir='asc' THEN
                    CASE :metric WHEN 'successions' THEN successions
                                 WHEN 'within90d_pct' THEN 100.0*within_90d/successions
                                 WHEN 'p50_gap_days' THEN p50_gap_days
                                 WHEN 'avg_gap_days' THEN avg_gap_days END
                  END ASC,
                  CASE WHEN :dir='desc' THEN
                    CASE :metric WHEN 'successions' THEN successions
                                 WHEN 'within90d_pct' THEN 100.0*within_90d/successions
                                 WHEN 'p50_gap_days' THEN p50_gap_days
                                 WHEN 'avg_gap_days' THEN avg_gap_days END
                  END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_successions: 100, dir: "desc", n: 8 }
              param_enum: { dir: [asc, desc], metric: [successions, within90d_pct, p50_gap_days, avg_gap_days] }
            - pattern_id: "opened_same_origin_rate"
              question_ko: "새로 여는 업종 입장에서, 같은 업종이 떠난 자리를 이어받는 비율은? (category_stickiness 의 개업측 반전)"
              axes: "opened_category → 동종 유래 비율 / :dir 정렬 스위치 (category_stickiness 와 방향 반전쌍: 폐업측 고착률 ↔ 개업측 유래율)"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "식품 개업 승계 112,438건 중 88.8%가 식품이 떠난 자리에서 일어난다 — 개업측 동종 유래율 1위. 반대로 숙박은 동종 유래 0%다."
              sql: |
                -- :dir='desc'
                SELECT * FROM (
                  SELECT opened_category, opened_category_ko, SUM(successions) AS total,
                         ROUND(100.0*SUM(CASE WHEN closed_category=opened_category THEN successions ELSE 0 END)/SUM(successions),1) AS same_origin_pct
                  FROM d1_address_succession
                  GROUP BY 1,2
                )
                ORDER BY CASE WHEN :dir='asc' THEN same_origin_pct END ASC,
                         CASE WHEN :dir='desc' THEN same_origin_pct END DESC
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { dir: "desc" }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "side_vacancy_profile"
              question_ko: "업종별 공실 프로필 — :side='closed'면 그 업종이 떠난 자리가 얼마나 빨리 채워지는지, 'opened'면 그 업종이 들어간 자리가 얼마나 비어 있었는지"
              axes: "category 단일 축(:side 로 폐업측/개업측 스위치) → 총 건수·가중평균 공실·90일내 비율, :dir 정렬 스위치 (쌍 단위 지표를 업종 단위 프로필로 접음 — major_cross_matrix 의 소분류·단측 버전)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "폐업측 공실이 가장 짧은 업종은 약국 — 떠난 자리 913건이 가중평균 26.4일 만에 채워지고 89.3%는 90일 내 승계된다."
              sql: |
                -- :side='closed', :dir='asc'
                SELECT * FROM (
                  SELECT CASE :side WHEN 'closed' THEN closed_category ELSE opened_category END AS category,
                         CASE :side WHEN 'closed' THEN closed_category_ko ELSE opened_category_ko END AS category_ko,
                         SUM(successions) AS total,
                         ROUND(SUM(avg_gap_days*successions)/SUM(successions),1) AS wavg_gap_days,
                         ROUND(100.0*SUM(within_90d)/SUM(successions),1) AS within90d_pct
                  FROM d1_address_succession
                  GROUP BY 1,2
                )
                ORDER BY CASE WHEN :dir='asc' THEN wavg_gap_days END ASC,
                         CASE WHEN :dir='desc' THEN wavg_gap_days END DESC
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { dir: "asc" }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "long_tail_vacancy_pairs"
              question_ko: "평균 공실이 중앙값보다 훨씬 긴(오른쪽 꼬리) 전이쌍은? — 일부 자리가 유난히 오래 비는 전이"
              axes: "전이쌍 → avg_gap_days − p50_gap_days DESC (공실 분포의 왜도 관점 — 기존 속도 랭킹 fastest/longest 가 못 보는 축)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "식품→위생·미용은 중앙값 15일 vs 평균 70.3일로 격차 55.3일 — 절반은 보름 안에 채워지지만 꼬리가 매우 긴 이중 구조다(1,271건)."
              sql: |
                -- :min_successions=100, :n=10
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days,
                       ROUND(avg_gap_days - p50_gap_days,1) AS mean_median_gap_days
                FROM d1_address_succession
                WHERE successions >= :min_successions
                ORDER BY mean_median_gap_days DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_successions: 100, n: 10 }
            - pattern_id: "top_successors_per_closed"
              question_ko: "폐업 업종 각각의 최다 승계 업종 1~:top_n위 지도 — 모든 업종의 자리는 주로 무엇으로 채워지나?"
              axes: "closed_category 전체 × 그룹 내 successions 순위 상위 :top_n → 그룹 내 점유율 (what_opens_after_close 의 단일 단면을 전 업종 일괄 요약으로 확장)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "폐업 업종별 1위 승계를 보면 동물 업종 자리는 60.5%(290건)가 다시 동물 업종으로 채워진다 — 10개 업종 전부의 1위 승계가 한 행씩 나온다."
              sql: |
                -- :top_n=1
                SELECT closed_category_ko, opened_category_ko, successions, share_pct, rank_in_closed
                FROM (
                  SELECT closed_category, closed_category_ko, opened_category_ko, successions,
                         ROUND(100.0*successions/SUM(successions) OVER (PARTITION BY closed_category),1) AS share_pct,
                         ROW_NUMBER() OVER (PARTITION BY closed_category ORDER BY successions DESC) AS rank_in_closed
                  FROM d1_address_succession
                )
                WHERE rank_in_closed <= :top_n
                ORDER BY closed_category_ko, rank_in_closed
              requires: [select_columns, sort, window, subquery, filter_range]
              param_defaults: { top_n: 1 }
            - pattern_id: "cumulative_share_top_pairs"
              question_ko: "상위 전이쌍 누적 점유율 — 승계 시장이 몇 개 쌍에 얼마나 집중돼 있나?"
              axes: "전이쌍 successions DESC 상위 :n → 개별 점유율 + 누적 점유율 (분포 집중도 관점 — top_succession_pairs 에 없는 누적 축)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "1위 식품→식품 한 쌍(99,843건)이 전체 승계의 39.4%를 차지한다 — 승계 시장은 극소수 전이쌍에 강하게 집중돼 있다."
              sql: |
                -- :n=10
                SELECT closed_category_ko, opened_category_ko, successions,
                       ROUND(100.0*successions/(SELECT SUM(successions) FROM d1_address_succession),1) AS share_pct,
                       ROUND(100.0*SUM(successions) OVER (ORDER BY successions DESC, closed_category, opened_category)/(SELECT SUM(successions) FROM d1_address_succession),1) AS cum_share_pct
                FROM d1_address_succession
                ORDER BY successions DESC, closed_category, opened_category
                LIMIT :n
              requires: [select_columns, sort, aggregate, window, subquery]
              param_defaults: { n: 10 }
            - pattern_id: "gap_speed_buckets"
              question_ko: "공실 중앙값을 속도 구간(:b1/:b2/:b3일 경계)으로 나누면 승계가 어느 구간에 몰려 있나?"
              axes: "p50_gap_days 를 4개 속도 구간으로 이산화 → 쌍 종류 수·건수·점유율 (분포 축 — 구간 경계 3개가 임계값 파라미터)"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "중앙 공실 30일 이하 구간에 전이쌍 15종·111,237건이 몰려 전체의 43.9% — 승계의 절반 가까이가 한 달 내 회전이다."
              sql: |
                -- :b1=30, :b2=90, :b3=180
                SELECT CASE WHEN p50_gap_days <= :b1 THEN 'A_'||:b1||'일 이하'
                            WHEN p50_gap_days <= :b2 THEN 'B_'||:b2||'일 이하'
                            WHEN p50_gap_days <= :b3 THEN 'C_'||:b3||'일 이하'
                            ELSE 'D_'||:b3||'일 초과' END AS gap_band,
                       COUNT(*) AS pair_kinds,
                       SUM(successions) AS successions,
                       ROUND(100.0*SUM(successions)/(SELECT SUM(successions) FROM d1_address_succession),1) AS share_pct
                FROM d1_address_succession
                GROUP BY 1
                ORDER BY 1
              requires: [select_columns, sort, aggregate, group_by, subquery]
            - pattern_id: "pair_direction_asymmetry"
              question_ko: "업종 간 자리 교환은 대칭인가? A→B와 B→A 건수가 가장 크게 어긋나는 업종쌍은?"
              axes: "무방향 쌍(사전순 A<B로 중복 제거) → 양방향 건수 대조·순흐름 |A→B − B→A| DESC (category_net_flow 의 업종 총계 순유입을 쌍 단위로 분해)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "식품↔산업 교환은 일방적이다 — 식품→산업 15,004건 vs 산업→식품 8,255건으로 식품 자리가 산업 쪽으로 6,749건 순유출."
              sql: |
                -- :min_pair_successions=50, :n=10
                SELECT cat_a_ko, cat_b_ko, a_to_b, b_to_a,
                       a_to_b - b_to_a AS net_a_to_b
                FROM (
                  SELECT a.closed_category_ko AS cat_a_ko, a.opened_category_ko AS cat_b_ko,
                         a.successions AS a_to_b,
                         COALESCE((SELECT b.successions FROM d1_address_succession b
                                   WHERE b.closed_category = a.opened_category
                                     AND b.opened_category = a.closed_category), 0) AS b_to_a
                  FROM d1_address_succession a
                  WHERE a.closed_category < a.opened_category
                )
                WHERE a_to_b + b_to_a >= :min_pair_successions
                ORDER BY ABS(a_to_b - b_to_a) DESC
                LIMIT :n
              requires: [select_columns, sort, subquery, filter_range]
              param_defaults: { min_pair_successions: 50, n: 10 }
            - pattern_id: "same_switch_by_level"
              question_ko: "동종 승계 vs 업종 전환의 비중·공실 속도를 대분류(:level='major')와 소분류('category') 기준 각각으로 보면?"
              axes: "same/switched 이분(:level 로 대분류/소분류 스위치) → 건수·점유율·가중평균 공실·90일내 비율 (new_same_vs_switch_category 의 차원 스위치 상위호환 + 단순평균을 가중 지표로 교정)"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "08fd713b1b9f4706920c4b1702d44bc7"
              insight_sample_ko: "대분류 기준 동종 승계가 199,627건으로 전체의 78.7%(가중평균 공실 63.1일, 90일 내 75.2%) — 자리의 업종 정체성은 대분류 수준에서 강하게 유지된다."
              sql: |
                -- :level='major'
                SELECT CASE WHEN (CASE :level WHEN 'major' THEN closed_major ELSE closed_category END)
                              = (CASE :level WHEN 'major' THEN opened_major ELSE opened_category END)
                            THEN 'same' ELSE 'switched' END AS kind,
                       SUM(successions) AS successions,
                       ROUND(100.0*SUM(successions)/(SELECT SUM(successions) FROM d1_address_succession),1) AS share_pct,
                       ROUND(SUM(avg_gap_days*successions)/SUM(successions),1) AS wavg_gap_days,
                       ROUND(100.0*SUM(within_90d)/SUM(successions),1) AS within90d_pct
                FROM d1_address_succession
                GROUP BY 1
                ORDER BY 1
              requires: [select_columns, sort, aggregate, group_by, subquery]
          contract_version: v1
          product_question: 폐업 자리에 무슨 업종이 들어서나(자리 대물림)?
          grain: 폐업→개업 업종쌍
          primary_key: [closed_major, closed_category, opened_major, opened_category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [closed_major, closed_category, opened_major, opened_category]
    columns:
      - name: closed_major
        data_type: varchar
        description: 폐업(선행) 업소 대분류.
        tests: [not_null]
      - name: closed_category
        data_type: varchar
        description: 폐업(선행) 업소 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: opened_major
        data_type: varchar
        description: 후속 개업 업소 대분류.
        tests: [not_null]
      - name: opened_category
        data_type: varchar
        description: 후속 개업 업소 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: successions
        data_type: bigint
        description: 해당 전이(폐업업종→개업업종) 승계 건수(매칭 성사분).
        tests: [not_null]
      - name: avg_gap_days
        data_type: double
        description: 평균 공실 기간(폐업→후속 개업, 일).
      - name: p50_gap_days
        data_type: bigint
        description: 중앙값 공실 기간(일).
      - name: within_90d
        data_type: bigint
        description: 90일 이내 승계 건수(빠른 회전).
      - name: closed_major_ko
        data_type: varchar
        description: 폐업(선행) 업소 대분류 한글
      - name: closed_category_ko
        data_type: varchar
        description: 폐업(선행) 업소 중분류 한글
      - name: opened_major_ko
        data_type: varchar
        description: 후속 개업 업소 대분류 한글
      - name: opened_category_ko
        data_type: varchar
        description: 후속 개업 업소 중분류 한글
  - name: gold_license_phone_succession
    description: 폐업 사장님의 재도전 — 동일 전화의 폐업→개업(3년 이내·주소 상이) 업종 전환. 연쇄창업 근사(전화 44%).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_phone_succession
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_phone_succession   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 전화번호 승계 창업 전환
            summary: 같은 전화번호가 폐업 뒤 다른 주소에서 다시 나타나는 경우를 모아 어떤 업종에서 어떤 업종으로 옮겨갔는지 집계했습니다.
            caveat: 전화번호가 있는 업소가 44%뿐이라 연쇄 창업의 일부만 잡힙니다.
            use_cases:
              - 재창업 업종 전환 경로 분석
              - 연쇄 창업자 행태 파악
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "top_succession_pairs"
              question_ko: "폐업→재창업 전환이 가장 많은 업종 조합 top-N은?"
              axes: "closed_category×opened_category → successions desc (top-N 랭킹)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "식품→식품 20,077건(전체 51,591건의 39%)으로 압도적 1위 — 중앙값 90일 만에 재개업, 75.5%가 1년 내 복귀."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days,
                       ROUND(100.0*within_1y/successions, 1) AS within_1y_pct
                FROM d1_phone_succession
                ORDER BY successions DESC
                LIMIT :top_n; -- 예: 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "destinations_after_closing"
              question_ko: "특정 업종을 폐업한 사장님은 어떤 업종으로 재창업하나? (행선지 분포)"
              axes: "폐업 업종 단면(:closed_category) → 개업 업종 분포 / 반전쌍: origins_before_opening (유출→유입 차원 교환)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "식품 폐업자의 77%는 다시 식품으로 — 업종을 바꾸면(산업 13.9%) 중앙값 329일로 동일업종(90일)보다 3.7배 오래 걸림."
              sql: |
                SELECT opened_category_ko, successions,
                       ROUND(100.0*successions/SUM(successions) OVER (), 1) AS share_pct,
                       p50_gap_days
                FROM d1_phone_succession
                WHERE closed_category = :closed_category -- 예: 'food' (영문 코드)
                ORDER BY successions DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "origins_before_opening"
              question_ko: "특정 업종으로 개업한 재도전자는 어떤 업종 폐업 출신인가? (출신지 분포)"
              axes: "개업 업종 단면(:opened_category) → 폐업 업종 분포 / destinations_after_closing의 차원·관점 반전(유입←유출)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "식품 재창업자의 85.3%가 식품 폐업 출신 — 타 업종에서 식품으로 유입되는 몫은 산업(9.4%)이 사실상 전부."
              sql: |
                SELECT closed_category_ko, successions,
                       ROUND(100.0*successions/SUM(successions) OVER (), 1) AS share_pct,
                       p50_gap_days
                FROM d1_phone_succession
                WHERE opened_category = :opened_category -- 예: 'food' (영문 코드)
                ORDER BY successions DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "same_category_retention_rate"
              question_ko: "폐업 후 같은 업종으로 다시 도전하는 비율(동일업종 유지율)이 높은/낮은 업종은?"
              axes: "closed_category → 동일업종 유지율 / 관점 반전: 유지(same_cat_pct)↔전환(100-same_cat_pct), desc↔asc"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "동일업종 재창업률 1위는 위생·미용 81%, 최저는 환경 52.7% — 문화(53.1%)·환경 폐업자는 절반 가까이 업종을 갈아탄다."
              sql: |
                SELECT closed_category_ko,
                       SUM(successions) AS total_out,
                       SUM(CASE WHEN opened_category = closed_category THEN successions ELSE 0 END) AS same_cat,
                       ROUND(100.0*SUM(CASE WHEN opened_category = closed_category THEN successions ELSE 0 END)/SUM(successions), 1) AS same_cat_pct
                FROM d1_phone_succession
                GROUP BY 1
                ORDER BY same_cat_pct DESC; -- 반전: ASC = 업종 갈아타기 비율 랭킹
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "fastest_reentry_pairs"
              question_ko: "재개업이 가장 빠른(중앙값 간격 최단) 업종 전환 조합은?"
              axes: "업종쌍 → p50_gap_days asc / 반전쌍: slowest_reentry_pairs (asc↔desc)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "안경·치과(중앙값 8일)·동물(9일) 동일업종 재개업이 최단 — 사실상 즉시 재등록에 가까운 패턴."
              sql: |
                SELECT closed_category_ko, opened_category_ko, p50_gap_days, avg_gap_days, successions
                FROM d1_phone_succession
                WHERE successions >= :min_successions -- 예: 30 (소형 셀 노이즈 컷)
                ORDER BY p50_gap_days ASC
                LIMIT :top_n; -- 예: 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "slowest_reentry_pairs"
              question_ko: "재개업까지 가장 오래 걸리는 업종 전환 조합은?"
              axes: "업종쌍 → p50_gap_days desc / fastest_reentry_pairs의 정렬 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "문화→의료 전환이 중앙값 633일로 최장(식품→환경 552일 2위) — 자격·시설 전환 장벽을 시사."
              sql: |
                SELECT closed_category_ko, opened_category_ko, p50_gap_days, avg_gap_days, successions
                FROM d1_phone_succession
                WHERE successions >= :min_successions -- 예: 30
                ORDER BY p50_gap_days DESC
                LIMIT :top_n; -- 예: 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "major_cross_matrix"
              question_ko: "대분류 4종 간 폐업→재창업 흐름 매트릭스(어느 대분류에서 어느 대분류로)는?"
              axes: "closed_major×opened_major 두 축 교차(4×4 매트릭스) + 가중평균 간격"
              verified_rows: 16
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "보건→보건 29,712건(58%)이 최다, 교차 전환 최대는 보건→산업 4,450건(가중평균 394일) — 대분류를 넘는 전환은 동일 대분류보다 재개업이 100일 이상 느리다."
              sql: |
                SELECT closed_major_ko, opened_major_ko,
                       SUM(successions) AS successions,
                       ROUND(SUM(successions*avg_gap_days)/SUM(successions), 1) AS wavg_gap_days
                FROM d1_phone_succession
                GROUP BY 1, 2
                ORDER BY successions DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "within_1y_urgency_ranking"
              question_ko: "폐업 후 1년 내 재도전 비율이 가장 높은 업종 조합은?"
              axes: "업종쌍 → 1년 내 재도전율 desc (비율 관점 — successions 절대값 랭킹의 관점 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "1년 내 재도전율 1위 안경·치과→안경·치과 88.8%, 동물→동물 85.8% — 소규모 전문직 업종일수록 복귀가 빠르다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, within_1y,
                       ROUND(100.0*within_1y/successions, 1) AS within_1y_pct
                FROM d1_phone_succession
                WHERE successions >= :min_successions -- 예: 30
                ORDER BY within_1y_pct DESC -- 반전: ASC = 1년 내 복귀가 가장 드문 조합
                LIMIT :top_n; -- 예: 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "category_net_flow"
              question_ko: "재도전 흐름에서 순유입(들어오는 재창업 > 나가는 폐업) 업종과 순유출 업종은?"
              axes: "category → inflow↔outflow 관점 반전(같은 테이블을 개업축·폐업축 양방향 집계 후 순흐름)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "순유입 1위 산업 +1,172건, 순유출 1위 식품 -2,564건 — 식품은 재도전 과정에서 이탈 초과, 산업·의료(+759)로 갈아탄다."
              sql: |
                WITH outf AS (SELECT closed_category_ko AS cat, SUM(successions) AS s FROM d1_phone_succession GROUP BY 1),
                     inf  AS (SELECT opened_category_ko AS cat, SUM(successions) AS s FROM d1_phone_succession GROUP BY 1)
                SELECT COALESCE(o.cat, i.cat) AS category_ko,
                       COALESCE(i.s, 0) AS inflow,
                       COALESCE(o.s, 0) AS outflow,
                       COALESCE(i.s, 0) - COALESCE(o.s, 0) AS net_flow
                FROM outf o FULL OUTER JOIN inf i ON i.cat = o.cat
                ORDER BY net_flow DESC;
              requires: [select_columns, sort, aggregate, group_by, join, subquery]
            - pattern_id: "avg_vs_median_gap_skew"
              question_ko: "평균 간격이 중앙값보다 크게 부풀려진(장기 지연 꼬리가 긴) 전환 조합은?"
              axes: "업종쌍 → (avg-p50) 괴리 desc — 평균↔중앙값 지표 함정 탐지"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "의료→환경은 평균 328일 vs 중앙값 136일(괴리 192일) — 소수의 장기 지연 사례가 평균을 끌어올리므로 대표값은 p50을 써야 한다."
              sql: |
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days,
                       ROUND(avg_gap_days - p50_gap_days, 1) AS skew_days
                FROM d1_phone_succession
                WHERE successions >= :min_successions -- 예: 30
                ORDER BY skew_days DESC
                LIMIT :top_n; -- 예: 5
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "inv_within1y_rate_asc"
              question_ko: "같은 연락처로 재개업까지 가장 오래 걸리는 업종쌍은? (빠른 재도전 랭킹의 반전)"
              axes: "업종쌍 랭킹 — 1년 내 재개업 비율 ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "약국→위생·미용 재도전은 1년 내 16.7%뿐, 중앙 654일 — 업종 전환형 재개업은 오래 걸린다."
              sql: |
                -- :min_successions=5
                SELECT closed_category_ko, opened_category_ko, successions, p50_gap_days,
                       ROUND(100.0*within_1y/successions,1) AS within1y_pct
                FROM d1_phone_succession WHERE successions >= :min_successions
                ORDER BY within1y_pct ASC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_successions: 5 }
            - pattern_id: "new_same_vs_switch_reentry"
              question_ko: "재도전 시 같은 업종을 고르나, 업종을 바꾸나?"
              axes: "동종 재도전 vs 업종 전환 — 관점 이분(주소 승계와 대조 가능)"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "0f7222b296d54d09bcf81ab89d8ba566"
              insight_sample_ko: "동종 재도전 37,566건의 중앙 간격은 82.8일 — 주소 승계(11.8일)보다 7배 길다."
              sql: |
                SELECT CASE WHEN closed_category = opened_category THEN 'same_category' ELSE 'switched' END AS kind,
                       SUM(successions) AS successions, ROUND(AVG(p50_gap_days),1) AS avg_p50_gap_days
                FROM d1_phone_succession GROUP BY kind
              requires: [select_columns, aggregate, group_by]
            - pattern_id: "pair_detail_lookup"
              question_ko: "특정 폐업 업종→개업 업종 전환 조합의 상세 통계(건수·간격·1년내 비율·비중)는?"
              axes: "업종쌍 단면(셀 조회) — :closed_category×:opened_category 지정 → 해당 셀 상세 + 전체/유출 내 비중"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "식품 폐업 후 약국 개업 전환은 94건, 중앙값 411일이 걸리고 1년 내 재개업이 44.7%다. 식품 폐업 유출 전체의 0.4%에 해당한다."
              sql: |
                -- :closed_category='food', :opened_category='pharmacy'
                SELECT closed_category_ko, opened_category_ko, successions, avg_gap_days, p50_gap_days, within_1y,
                       ROUND(100.0*within_1y/successions, 1) AS within_1y_pct,
                       ROUND(100.0*successions/(SELECT SUM(s2.successions) FROM d1_phone_succession s2 WHERE s2.closed_category = :closed_category), 1) AS share_of_origin_outflow_pct,
                       ROUND(100.0*successions/(SELECT SUM(s3.successions) FROM d1_phone_succession s3), 2) AS share_of_total_pct
                FROM d1_phone_succession
                WHERE closed_category = :closed_category
                  AND opened_category = :opened_category
              requires: [select_columns, aggregate, subquery]
            - pattern_id: "top_pairs_scoped"
              question_ko: "범위를 골라서(전체/동일업종만/업종전환만/대분류 이탈만) 전환이 가장 많은 업종 조합 top-N은?"
              axes: "업종쌍 랭킹 — successions desc, :scope ∈ {all, same_category, switched, cross_major} 범위 스위치 (top_succession_pairs 고정 패턴의 상위호환)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "업종을 갈아탄 전환 중 최대는 식품→산업 3,646건으로 중앙값 331일, 1년 내 재개업률 53.2%다."
              sql: |
                -- :scope='switched', :top_n=10
                SELECT closed_category_ko, opened_category_ko, closed_major_ko, opened_major_ko,
                       successions, p50_gap_days,
                       ROUND(100.0*within_1y/successions, 1) AS within_1y_pct
                FROM d1_phone_succession
                WHERE (:scope = 'all'
                   OR (:scope = 'same_category' AND closed_category = opened_category)
                   OR (:scope = 'switched' AND closed_category <> opened_category)
                   OR (:scope = 'cross_major' AND closed_major <> opened_major))
                ORDER BY successions DESC
                LIMIT :top_n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { scope: "all", top_n: 10 }
            - pattern_id: "top_destinations_per_origin"
              question_ko: "모든 폐업 업종 각각의 상위 K개 재창업 행선지는? (행선지 지도를 한 번에)"
              axes: "그룹별 top-K — closed_category 파티션 × 행선지 successions desc 랭크 :top_n 컷 (destinations_after_closing의 전 업종 일괄 버전)"
              verified_rows: 30
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "동물 업종 폐업자의 1순위 행선지는 같은 동물 업종으로, 124건·유출의 55.4%를 차지한다."
              sql: |
                -- :top_n=3
                SELECT closed_category_ko, opened_category_ko, successions, share_in_origin_pct, rank_in_origin
                FROM (
                  SELECT closed_category_ko, opened_category_ko, successions,
                         ROUND(100.0*successions/SUM(successions) OVER (PARTITION BY closed_category), 1) AS share_in_origin_pct,
                         ROW_NUMBER() OVER (PARTITION BY closed_category ORDER BY successions DESC) AS rank_in_origin
                  FROM d1_phone_succession
                )
                WHERE rank_in_origin <= :top_n
                ORDER BY closed_category_ko, rank_in_origin
              requires: [select_columns, sort, window, subquery, filter_range]
              param_defaults: { top_n: 3 }
            - pattern_id: "category_reentry_profile"
              question_ko: "업종별(폐업 기준 또는 개업 기준)로 재개업까지 걸리는 가중평균 기간과 1년 내 재개업률은? 빠른 순/느린 순 정렬 선택"
              axes: ":side ∈ {closed, opened} 차원 스위치 → category 집계 프로필, 가중평균 간격 :dir ∈ {asc, desc} 정렬 스위치"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "폐업 기준으로 재기가 가장 빠른 업종은 동물로, 가중평균 208.3일 만에 재개업하고 76.8%가 1년 내 복귀한다."
              sql: |
                -- :side='closed', :dir='asc'
                SELECT CASE :side WHEN 'opened' THEN opened_category_ko ELSE closed_category_ko END AS category_ko,
                       SUM(successions) AS total_successions,
                       ROUND(SUM(successions*avg_gap_days)/SUM(successions), 1) AS wavg_gap_days,
                       ROUND(100.0*SUM(within_1y)/SUM(successions), 1) AS within_1y_pct
                FROM d1_phone_succession
                GROUP BY CASE :side WHEN 'opened' THEN opened_category_ko ELSE closed_category_ko END
                ORDER BY CASE WHEN :dir = 'asc' THEN wavg_gap_days END ASC,
                         CASE WHEN :dir = 'desc' THEN wavg_gap_days END DESC
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { dir: "asc" }
              param_enum: { side: [closed, opened], dir: [asc, desc] }
            - pattern_id: "destination_concentration"
              question_ko: "폐업 후 행선지가 한 업종에 쏠린(집중) 업종과 다양하게 흩어지는(분산) 업종은?"
              axes: "closed_category → 행선지 집중도(top1 점유율) 랭킹, :dir ∈ {asc, desc} 반전 + top1 행선지명 동반"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "위생·미용은 행선지 10곳 가운데 top1(위생·미용)이 유출 4,792건의 80.9%를 흡수해 쏠림이 가장 크다."
              sql: |
                -- :dir='desc'
                SELECT d.closed_category_ko,
                       COUNT(*) AS n_destinations,
                       SUM(d.successions) AS total_out,
                       (SELECT s2.opened_category_ko FROM d1_phone_succession s2
                        WHERE s2.closed_category_ko = d.closed_category_ko
                        ORDER BY s2.successions DESC LIMIT 1) AS top1_destination_ko,
                       MAX(d.successions) AS top1_successions,
                       ROUND(100.0*MAX(d.successions)/SUM(d.successions), 1) AS top1_share_pct
                FROM d1_phone_succession d
                GROUP BY d.closed_category_ko
                ORDER BY CASE WHEN :dir = 'asc' THEN 100.0*MAX(d.successions)/SUM(d.successions) END ASC,
                         CASE WHEN :dir = 'desc' THEN 100.0*MAX(d.successions)/SUM(d.successions) END DESC
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { dir: "desc" }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gap_bucket_distribution"
              question_ko: "재개업 소요 기간(중앙값)은 구간별로 어떻게 분포하나? 특정 대분류만 좁혀 볼 수도"
              axes: "p50_gap_days 구간 버킷(90/180/365일) 분포 — 건수 가중 히스토그램, :closed_major 센티널 단면"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "중앙값 90일 미만에 재개업이 이뤄지는 전환 조합(10쌍)에 전체 재도전의 50.6%(26,119건)가 몰려 있다."
              sql: |
                -- :closed_major='ALL'
                SELECT CASE WHEN p50_gap_days < 90 THEN '1_90일미만'
                            WHEN p50_gap_days < 180 THEN '2_90~179일'
                            WHEN p50_gap_days < 365 THEN '3_180~364일'
                            ELSE '4_365일이상' END AS gap_bucket,
                       COUNT(*) AS n_pairs,
                       SUM(successions) AS successions,
                       ROUND(100.0*SUM(successions)/(SELECT SUM(s2.successions) FROM d1_phone_succession s2 WHERE (:closed_major = 'ALL' OR s2.closed_major = :closed_major)), 1) AS share_pct
                FROM d1_phone_succession
                WHERE (:closed_major = 'ALL' OR closed_major = :closed_major)
                GROUP BY 1
                ORDER BY 1
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { closed_major: "ALL" }
            - pattern_id: "succession_kpi_overview"
              question_ko: "전화번호 승계 재도전의 전체(또는 대분류 방향별) 총 규모·평균 소요·1년 내 비율 요약은?"
              axes: "전역/대분류 방향 단면 KPI 1행 — :closed_major×:opened_major 이중 센티널('ALL')"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "보건 분야로 유입되는 재도전은 총 33,349건(62개 조합), 가중평균 253.0일이 걸리고 72.1%가 1년 내 재개업한다."
              sql: |
                -- :closed_major='ALL', :opened_major='health'
                SELECT SUM(successions) AS total_successions,
                       COUNT(*) AS n_pairs,
                       ROUND(SUM(successions*avg_gap_days)/SUM(successions), 1) AS wavg_gap_days,
                       ROUND(100.0*SUM(within_1y)/SUM(successions), 1) AS within_1y_pct
                FROM d1_phone_succession
                WHERE (:closed_major = 'ALL' OR closed_major = :closed_major)
                  AND (:opened_major = 'ALL' OR opened_major = :opened_major)
              requires: [select_columns, aggregate]
              param_defaults: { closed_major: "ALL", opened_major: "ALL" }
            - pattern_id: "same_group_retention_by_level"
              question_ko: "폐업 후 같은 분야(대분류 또는 소분류 수준 선택)에 남는 비율이 높은/낮은 분야는?"
              axes: ":level ∈ {major, category} 수준 스위치 → 동일 그룹 잔류율, :dir ∈ {asc, desc} 정렬 반전 (same_category_retention_rate 고정 패턴의 상위호환)"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "대분류 기준 잔류율 1위는 보건으로, 유출 34,946건 중 85.0%(29,712건)가 같은 보건 분야 안에서 재창업한다."
              sql: |
                -- :level='major', :dir='desc'
                SELECT CASE :level WHEN 'major' THEN closed_major_ko ELSE closed_category_ko END AS group_ko,
                       SUM(successions) AS total_out,
                       SUM(CASE WHEN (:level = 'major' AND closed_major = opened_major)
                                  OR (:level <> 'major' AND closed_category = opened_category)
                                THEN successions ELSE 0 END) AS stayed,
                       ROUND(100.0*SUM(CASE WHEN (:level = 'major' AND closed_major = opened_major)
                                              OR (:level <> 'major' AND closed_category = opened_category)
                                            THEN successions ELSE 0 END)/SUM(successions), 1) AS stay_pct
                FROM d1_phone_succession
                GROUP BY 1
                ORDER BY CASE WHEN :dir = 'asc' THEN stay_pct END ASC,
                         CASE WHEN :dir = 'desc' THEN stay_pct END DESC
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { dir: "desc" }
              param_enum: { level: [major, category], dir: [asc, desc] }
            - pattern_id: "pair_affinity_lift"
              question_ko: "규모 효과를 제거하면(유출·유입 규모 대비 기대치 대비) 유난히 강하게 이어지는 폐업→개업 조합은?"
              axes: "업종쌍 → lift(실측/기대 배율) desc 랭킹, :min_successions 소형 셀 컷"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "62e7c28cb22441689bbca5028afae8ca"
              insight_sample_ko: "안경·치과→안경·치과 전환(107건)은 규모 기대치의 237.46배(lift)로, 규모를 감안하면 가장 강하게 이어지는 조합이다."
              sql: |
                -- :min_successions=30, :top_n=10
                SELECT closed_category_ko, opened_category_ko, successions,
                       ROUND(1.0*successions*total_all/(out_total*in_total), 2) AS lift
                FROM (
                  SELECT closed_category_ko, opened_category_ko, successions,
                         SUM(successions) OVER () AS total_all,
                         SUM(successions) OVER (PARTITION BY closed_category) AS out_total,
                         SUM(successions) OVER (PARTITION BY opened_category) AS in_total
                  FROM d1_phone_succession
                )
                WHERE successions >= :min_successions
                ORDER BY lift DESC
                LIMIT :top_n
              requires: [select_columns, sort, window, subquery, filter_range]
              param_defaults: { min_successions: 30, top_n: 10 }
          contract_version: v1
          product_question: 전화번호가 승계되는 업종 조합은?
          grain: 폐업→개업 업종쌍
          primary_key: [closed_major, closed_category, opened_major, opened_category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [closed_major, closed_category, opened_major, opened_category]
    columns:
      - name: closed_major
        data_type: varchar
        description: 폐업(선행) 업소 대분류.
        tests: [not_null]
      - name: closed_category
        data_type: varchar
        description: 폐업(선행) 업소 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: opened_major
        data_type: varchar
        description: 재도전(후속) 업소 대분류.
        tests: [not_null]
      - name: opened_category
        data_type: varchar
        description: 재도전(후속) 업소 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: successions
        data_type: bigint
        description: 해당 전환 건수(동일 전화·주소 상이·공용번호 컷).
        tests: [not_null]
      - name: avg_gap_days
        data_type: double
        description: 평균 재도전 간격(폐업→재개업, 일).
      - name: p50_gap_days
        data_type: bigint
        description: 중앙값 재도전 간격(일).
      - name: within_1y
        data_type: bigint
        description: 1년 이내 재도전 건수.

  # ═══ 화면 6: 데이터 품질·환경 특수축(governance) ═══
      - name: closed_major_ko
        data_type: varchar
        description: 폐업(선행) 업소 대분류 한글
      - name: closed_category_ko
        data_type: varchar
        description: 폐업(선행) 업소 중분류 한글
      - name: opened_major_ko
        data_type: varchar
        description: 후속 개업 업소 대분류 한글
      - name: opened_category_ko
        data_type: varchar
        description: 후속 개업 업소 중분류 한글
  - name: gold_license_data_quality
    description: 데이터 신뢰도 진단 — dataset(API)별 필드 커버리지(전화/좌표/행정동/주소/폐업일/상호). 거버넌스·수집 우선순위.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_data_quality
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_data_quality   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 인허가 데이터 품질 커버리지
            summary: 원천 API마다 전화·좌표·행정동·주소·폐업일·상호가 얼마나 채워져 있는지 비율로 정리했습니다.
            use_cases:
              - 분석 전 결측 확인
              - 수집 보완 우선순위 결정
              - 지표 신뢰도 판단
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "worst_phone_rate_topn"
              question_ko: "전화번호 결측이 가장 심한 데이터셋(API)은 어디인가? (보유율 기준, 소형셋 제외)"
              axes: "dataset 랭킹 | phone_coverage ASC | 최소행수 필터 — [반전쌍 A-1: 비율 관점]"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "숙박업·고압가스업은 전화 보유율 0%. 이어 청소년게임제공업 3.5%, 인터넷컴퓨터게임시설 9.1% 등 문화 게임업종이 최하위권을 독식 — 연락처 결측이 업종 구조적."
              sql: |
                -- :min_rows 예시 1000, :n 예시 10
                SELECT dataset, dataset_ko, category_ko, total_rows, phone_coverage
                FROM d1_data_quality
                WHERE total_rows >= :min_rows
                ORDER BY phone_coverage ASC
                LIMIT :n;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "worst_phone_missing_volume_topn"
              question_ko: "전화번호 결측 '건수'가 가장 많은 데이터셋은? (개선 시 회수량이 큰 곳)"
              axes: "dataset 랭킹 | 절대 결측건수 DESC — [반전쌍 A-2: 비율→볼륨 관점 반전, A-1과 목록이 완전히 다름]"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "볼륨 관점에선 통신판매업이 결측 59.7만 건으로 압도적 1위(보유율 36.2% × 93.6만 행), 2위 일반음식점 23.2만 건 — 비율 최하위(A-1)와 전혀 다른 개선 우선순위가 나온다."
              sql: |
                -- :n 예시 10
                SELECT dataset, dataset_ko, total_rows, phone_coverage,
                       CAST(ROUND(total_rows * (1.0 - phone_coverage)) AS INTEGER) AS phone_missing_rows
                FROM d1_data_quality
                ORDER BY phone_missing_rows DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_cross_weighted_coverage"
              question_ko: "대분류×중분류 업종 축에서 커버리지(행수 가중)는 어떻게 갈리나?"
              axes: "두 축 교차(major×category) | 행수 가중 평균 3지표 — [반전쌍 B-1: 업종 롤업 관점]"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "행정동 매핑률이 산업 12.2%·문화 44.1%로 붕괴 수준(식품 88.8%, 위생·미용 99.9% 대비) — 산업·문화 API 는 동 단위 분석에 사실상 못 쓴다. 전화는 숙박 0%·축산 29.2% 최하."
              sql: |
                SELECT major_ko, category_ko, COUNT(*) AS dataset_cnt, SUM(total_rows) AS total_rows,
                       ROUND(1.0 * SUM(phone_coverage * total_rows) / SUM(total_rows), 4) AS phone_w,
                       ROUND(1.0 * SUM(geo_coverage * total_rows) / SUM(total_rows), 4) AS geo_w,
                       ROUND(1.0 * SUM(admin_dong_coverage * total_rows) / SUM(total_rows), 4) AS admin_dong_w
                FROM d1_data_quality
                GROUP BY major_ko, category_ko
                ORDER BY phone_w ASC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_drilldown_datasets"
              question_ko: "특정 중분류 안에서 어떤 데이터셋이 커버리지를 깎아먹고 있나?"
              axes: "category 고정 :param → dataset 상세 — [반전쌍 B-2: 롤업↔드릴다운 차원 교환]"
              verified_rows: 23
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "식품 23개 API 중 좌표 최하위는 식품냉동냉장업 64%·식품첨가물제조업 65.7%(둘 다 500행 미만 소형). 대형 중엔 일반음식점 89.1%가 바닥이고, 식품운반업은 행정동 매핑 0%가 눈에 띈다."
              sql: |
                -- :category 예시 'food' (코드: food/livestock/health_medical/pharmacy/animal/hygiene_beauty/optical_dental/lodging/culture/industry/environment)
                SELECT dataset, dataset_ko, total_rows, phone_coverage, geo_coverage, admin_dong_coverage
                FROM d1_data_quality
                WHERE category = :category
                ORDER BY geo_coverage ASC;
              requires: [select_columns, sort]
            - pattern_id: "dataset_profile_lookup"
              question_ko: "이 데이터셋 하나의 품질 프로파일 전체는? (분석 전 신뢰도 사전점검)"
              axes: ":param 단면 조회 | dataset 1행 전 지표"
              verified_rows: 1
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "일반음식점: 53.6만 행 중 영업 12만(22.5%), 전화 56.6%·좌표 89.1%·행정동 99.98%·폐업일 99.99% — 좌표 없는 약 5.8만 행이 지도 분석의 사각지대."
              sql: |
                -- :dataset 예시 'general_restaurant' (한글명으로 찾으려면 WHERE dataset_ko LIKE '%일반음식점%')
                SELECT * FROM d1_data_quality WHERE dataset = :dataset;
              requires: []
            - pattern_id: "composite_score_worst_topn"
              question_ko: "종합 품질 점수가 가장 낮은 데이터셋은? (수집 개선 우선순위)"
              axes: "dataset 랭킹 | 합성점수 ASC — [반전쌍 C-1: 최악 정렬]"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "종합 최하위는 통신판매업 0.512 — 최대 규모(93.6만 행) API 가 품질 꼴찌라 개선 ROI 1순위. 이어 의료기기판매 0.555, 대중문화예술기획 0.557."
              sql: |
                -- 점수 = 변별력 있는 4지표 평균(address·close_date 는 상수/왜곡이라 제외). :min_rows 예시 1000, :n 예시 10
                SELECT dataset, dataset_ko, total_rows,
                       ROUND((phone_coverage + geo_coverage + admin_dong_coverage + name_coverage) / 4.0, 4) AS quality_score
                FROM d1_data_quality
                WHERE total_rows >= :min_rows
                ORDER BY quality_score ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "composite_score_best_topn"
              question_ko: "종합 품질이 가장 좋은(그대로 믿고 쓸 수 있는) 데이터셋은?"
              axes: "dataset 랭킹 | 합성점수 DESC — [반전쌍 C-2: 정렬 반전]"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "최상위는 집단급식소 0.943·단란주점 0.940·석유판매업 0.940 — 위생·안전 규제가 센 업종일수록 필드가 꽉 차 있다."
              sql: |
                -- :min_rows 예시 1000, :n 예시 10
                SELECT dataset, dataset_ko, total_rows,
                       ROUND((phone_coverage + geo_coverage + admin_dong_coverage + name_coverage) / 4.0, 4) AS quality_score
                FROM d1_data_quality
                WHERE total_rows >= :min_rows
                ORDER BY quality_score DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "close_date_anomaly_audit"
              question_ko: "폐업일 지표가 깨진(1 초과 또는 NULL) 데이터셋은 어디인가? (원천 상태코드 운용 이상 감지)"
              axes: "이상치 필터(>1 또는 NULL) | 진단 전용 랭킹"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "국제회의기획업은 폐업일 보유율 403%(1의 4배), 일반여행업 329%, 영화제작업 302% — 여행·영상·게임 등록업종에서 취소·말소 행에도 폐업일이 찍히는 원천 특성이 일괄 확인된다(전체 64행이 1 초과)."
              sql: |
                -- 분자(폐업일 보유)는 상태 무관 전체 행, 분모는 폐업('03') 행뿐이라 1 초과 = 비폐업 상태에도 폐업일 기록된 API. :n 예시 15
                SELECT dataset, dataset_ko, total_rows, close_date_coverage_of_closed
                FROM d1_data_quality
                WHERE close_date_coverage_of_closed IS NULL OR close_date_coverage_of_closed > 1.0
                ORDER BY COALESCE(close_date_coverage_of_closed, -1) DESC
                LIMIT :n;
              requires: [select_columns, sort, filter_range, filter_null]
            - pattern_id: "reliable_large_datasets"
              question_ko: "품질 게이트(좌표·행정동 커버리지 임계)를 통과한 대형 데이터셋은? (지도·동 단위 분석에 안전한 API 선별)"
              axes: ":param 임계 게이트 × 규모 랭킹 | 커버리지·규모 두 축 교차"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "좌표≥90%·행정동≥99% 게이트 통과 최대 API 는 즉석판매제조가공업(15.5만 행)과 휴게음식점(14.6만 행) — 단 즉석판매는 영업비율 9.9%로 누적 폐업이 대부분이라 '현재 영업' 분석엔 active_rows 를 봐야 한다."
              sql: |
                -- :geo_min 예시 0.9, :dong_min 예시 0.99, :n 예시 10
                SELECT dataset, dataset_ko, total_rows, active_rows,
                       ROUND(1.0 * active_rows / total_rows, 4) AS active_ratio,
                       geo_coverage, admin_dong_coverage
                FROM d1_data_quality
                WHERE geo_coverage >= :geo_min AND admin_dong_coverage >= :dong_min
                ORDER BY total_rows DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "inv_geo_coverage_asc"
              question_ko: "좌표 커버리지가 가장 낮은 업종은? (양호 랭킹의 반전)"
              axes: "업종 랭킹 — geo_coverage ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "방문판매업은 좌표 61.6%·행정동 0% — 지도·동 단위 분석에서 제외해야 하는 업종."
              sql: |
                -- :min_rows=1000, :n=10
                SELECT dataset_ko, total_rows, ROUND(geo_coverage*100,1) AS geo_pct,
                       ROUND(admin_dong_coverage*100,1) AS dong_pct
                FROM d1_data_quality WHERE total_rows >= :min_rows
                ORDER BY geo_coverage ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_rows: 1000, n: 10 }
            - pattern_id: "new_geo_vs_phone_gap"
              question_ko: "주소는 있는데 연락처가 비어 있는 업종은? (두 커버리지 지표 교차)"
              axes: "업종 랭킹 — address_coverage 대비 phone_coverage 격차"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "숙박업은 주소 100%인데 전화 0% — 연락처 기반 분석(다점포·재도전)에서 통째로 빠진다."
              sql: |
                -- :min_rows=1000, :n=10
                SELECT dataset_ko, total_rows, ROUND(address_coverage*100,1) AS addr_pct,
                       ROUND(phone_coverage*100,1) AS phone_pct,
                       ROUND((address_coverage - phone_coverage)*100,1) AS addr_minus_phone
                FROM d1_data_quality WHERE total_rows >= :min_rows
                ORDER BY addr_minus_phone DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_rows: 1000, n: 10 }
            - pattern_id: "x_quality_vs_area"
              question_ko: "데이터 커버리지가 낮은 업종은 매장 규모도 특이한가? (품질 × 면적 프로필 교차)"
              axes: "제품 간 조인 — data_quality(geo 커버리지) × area_profile(면적)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "008e812588f64bd78a5c712408df0077"
              insight_sample_ko: "축산판매업은 좌표 74.6%로 낮은데 평균 면적 323.3㎡ — 커버리지 낮은 업종이 대형 매장일 수 있다."
              sql: |
                -- :min_rows=1000
                WITH a AS (SELECT dataset, SUM(n_with_area) AS n_area,
                                  ROUND(SUM(avg_m2*n_with_area)/SUM(n_with_area),1) AS w_avg_m2
                           FROM d1_area_profile GROUP BY dataset)
                SELECT q.dataset_ko, q.total_rows, ROUND(q.geo_coverage*100,1) AS geo_pct,
                       a.n_area, a.w_avg_m2
                FROM d1_data_quality q JOIN a ON a.dataset = q.dataset
                WHERE q.total_rows >= :min_rows
                ORDER BY q.geo_coverage ASC LIMIT 12
              requires: [select_columns, sort, aggregate, group_by, join, subquery, filter_range]
              param_defaults: { min_rows: 1000 }
            - pattern_id: "coverage_metric_rank_switch"
              question_ko: "선택한 커버리지 지표(phone/geo/admin_dong/name) 기준 최악·최상 데이터셋은? (전체 또는 특정 중분류, 소형셋 제외)"
              axes: "dataset 랭킹 | 지표 스위치(:metric) × 정렬 스위치(:dir) × 카테고리 센티널(:category='ALL') × 최소행수 임계 — worst_phone_rate_topn·inv_geo_coverage_asc·category_drilldown_datasets 의 파라미터 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "전화 커버리지 최하위(1000행 이상 기준)는 서울시 숙박업 인허가 정보로 보유율 0% — 7,109행 전부 전화번호가 없다."
              sql: |
                -- :metric='phone', :dir='asc', :category='ALL', :min_rows=1000, :n=10
                SELECT dataset, dataset_ko, category_ko, total_rows,
                       ROUND(CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END, 4) AS metric_value
                FROM d1_data_quality
                WHERE total_rows >= :min_rows
                  AND (:category = 'ALL' OR category = :category)
                ORDER BY CASE WHEN :dir = 'asc' THEN CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END END ASC,
                         CASE WHEN :dir = 'desc' THEN CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_rows: 1000, category: "ALL", dir: "asc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "missing_volume_rank_switch"
              question_ko: "선택한 지표(phone/geo/admin_dong/name)의 결측 '건수'가 가장 많은 데이터셋은? (개선 시 회수량이 큰 곳)"
              axes: "dataset 랭킹 | 절대 결측건수 DESC | 지표 스위치(:metric) — worst_phone_missing_volume_topn 의 지표 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "좌표 결측 건수 1위는 서울시 통신판매업 인허가 정보 — 937,522행 중 293,257행(커버리지 68.7%)이 좌표 없이 적재돼 있다."
              sql: |
                -- :metric='geo', :n=10
                SELECT dataset, dataset_ko, category_ko, total_rows,
                       ROUND(CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END, 4) AS coverage_rate,
                       CAST(ROUND(total_rows * (1.0 - CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END)) AS INTEGER) AS missing_rows
                FROM d1_data_quality
                ORDER BY missing_rows DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate]
              param_defaults: { n: 10 }
            - pattern_id: "active_ratio_rank_switch"
              question_ko: "등록 대비 실제 영업 중 비율이 가장 낮은(또는 높은) 데이터셋은? (폐업 이력 아카이브형 vs 현행 목록형 API 판별)"
              axes: "dataset 랭킹 | active_rows/total_rows 비율 | 정렬 스위치(:dir) × 최소행수 임계"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "영업 비율 최하위는 서울시 일반게임제공업 인허가 정보 — 10,204행 중 영업 중은 337곳(3.3%)뿐이라 사실상 폐업 이력 데이터다."
              sql: |
                -- :dir='asc', :min_rows=1000, :n=10
                SELECT dataset, dataset_ko, category_ko, total_rows, active_rows,
                       ROUND(1.0 * active_rows / total_rows, 4) AS active_ratio
                FROM d1_data_quality
                WHERE total_rows >= :min_rows
                ORDER BY CASE WHEN :dir = 'asc' THEN 1.0 * active_rows / total_rows END ASC,
                         CASE WHEN :dir = 'desc' THEN 1.0 * active_rows / total_rows END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_rows: 1000, dir: "asc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "coverage_band_distribution"
              question_ko: "선택한 커버리지 지표의 분포는? 품질 문제가 전반적인가, 소수 데이터셋에 편중돼 있나?"
              axes: "분포 | 커버리지 5구간 밴드별 데이터셋 수·행수 합 | 지표 스위치(:metric)"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "전화 커버리지 분포는 양극화 — 보유율 25% 미만 구간에 데이터셋 26개(85,349행)가 몰려 있다."
              sql: |
                -- :metric='phone'
                WITH m AS (
                  SELECT total_rows,
                         CASE :metric WHEN 'phone' THEN phone_coverage WHEN 'geo' THEN geo_coverage WHEN 'admin_dong' THEN admin_dong_coverage WHEN 'name' THEN name_coverage END AS v
                  FROM d1_data_quality
                )
                SELECT CASE WHEN v < 0.25 THEN '00-25%' WHEN v < 0.50 THEN '25-50%' WHEN v < 0.75 THEN '50-75%' WHEN v < 0.95 THEN '75-95%' ELSE '95-100%' END AS coverage_band,
                       COUNT(*) AS dataset_cnt,
                       SUM(total_rows) AS rows_in_band
                FROM m
                GROUP BY coverage_band
                ORDER BY MIN(v);
              requires: [select_columns, sort, aggregate, group_by, subquery]
            - pattern_id: "quality_safe_row_share"
              question_ko: "품질 게이트(좌표·행정동 커버리지 임계)를 통과하는 데이터는 전체 행의 몇 %인가? (지도·동 단위 분석 가용 데이터 비중)"
              axes: "비율/집계 단면 | 임계 게이트 통과 데이터셋 수·행수·행 비중 1행 요약 — reliable_large_datasets(통과 목록)의 집계 요약 관점"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "geo>=0.9·행정동>=0.99 게이트를 152개 중 55개 데이터셋만 통과하고, 행 기준으로는 전체 2,900,301행의 22.3%(646,816행)만 안전하다."
              sql: |
                -- :geo_min=0.9, :dong_min=0.99
                SELECT COUNT(*) AS datasets_total,
                       SUM(CASE WHEN geo_coverage >= :geo_min AND admin_dong_coverage >= :dong_min THEN 1 ELSE 0 END) AS datasets_pass,
                       SUM(total_rows) AS rows_total,
                       SUM(CASE WHEN geo_coverage >= :geo_min AND admin_dong_coverage >= :dong_min THEN total_rows ELSE 0 END) AS rows_pass,
                       ROUND(1.0 * SUM(CASE WHEN geo_coverage >= :geo_min AND admin_dong_coverage >= :dong_min THEN total_rows ELSE 0 END) / SUM(total_rows), 4) AS row_share_pass
                FROM d1_data_quality;
              requires: [select_columns, aggregate]
            - pattern_id: "category_worst_dataset_picker"
              question_ko: "각 중분류에서 종합 품질이 가장 나쁜 데이터셋은 무엇인가? (분류별 개선 1순위 목록)"
              axes: "그룹별 극값(윈도우) | 중분류마다 합성점수 최하위 1개 | 최소행수 임계"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "산업 중분류의 개선 1순위는 서울시 통신판매업 인허가 정보 — 종합 점수 0.5123으로 분류 내 최하위인데 규모는 937,522행으로 가장 크다."
              sql: |
                -- :min_rows=1000, :n=11
                WITH ranked AS (
                  SELECT category, category_ko, dataset, dataset_ko, total_rows,
                         ROUND((phone_coverage + geo_coverage + admin_dong_coverage + name_coverage) / 4.0, 4) AS quality_score,
                         ROW_NUMBER() OVER (PARTITION BY category ORDER BY (phone_coverage + geo_coverage + admin_dong_coverage + name_coverage) ASC) AS rn
                  FROM d1_data_quality
                  WHERE total_rows >= :min_rows
                )
                SELECT category_ko, dataset, dataset_ko, total_rows, quality_score
                FROM ranked
                WHERE rn = 1
                ORDER BY quality_score ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range, window, subquery]
              param_defaults: { min_rows: 1000, n: 11 }
            - pattern_id: "dataset_search_ko"
              question_ko: "한글 키워드로 데이터셋을 찾으면? (dataset 코드를 모를 때 품질 프로파일 진입점)"
              axes: "단면 검색 | dataset_ko 부분일치(LIKE) | 규모순 정렬"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "'음식점' 검색 결과 최대 데이터셋은 서울시 일반음식점 인허가 정보 — 535,953행(영업 중 120,431), 좌표 커버리지 89.1%."
              sql: |
                -- :kw='음식점', :n=20
                SELECT dataset, dataset_ko, category_ko, total_rows, active_rows,
                       phone_coverage, geo_coverage, admin_dong_coverage
                FROM d1_data_quality
                WHERE dataset_ko LIKE '%' || :kw || '%'
                ORDER BY total_rows DESC
                LIMIT :n;
              requires: [select_columns, sort]
              param_defaults: { n: 20 }
            - pattern_id: "inventory_rollup_switch"
              question_ko: "대분류/중분류별 등록·영업 업소 인벤토리 규모와 현행성(영업 비율)은?"
              axes: "롤업 집계 | 차원 스위치(:dim ∈ major/category) | 데이터셋 수·행수 합·영업 비율 — category_cross_weighted_coverage(커버리지 롤업)와 달리 인벤토리 규모 관점"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "6445b6f61a6d4be79ba02c48781f6b85"
              insight_sample_ko: "중분류 인벤토리 1위는 산업 — 데이터셋 32개, 총 1,129,313행 중 영업 중 471,735행(영업 비율 41.8%)."
              sql: |
                -- :dim='category'
                SELECT CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko END AS dim_ko,
                       COUNT(*) AS dataset_cnt,
                       SUM(total_rows) AS total_rows_sum,
                       SUM(active_rows) AS active_rows_sum,
                       ROUND(1.0 * SUM(active_rows) / SUM(total_rows), 4) AS active_ratio
                FROM d1_data_quality
                GROUP BY CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko END
                ORDER BY active_rows_sum DESC;
              requires: [select_columns, sort, aggregate, group_by]
          contract_version: v1
          product_question: 이 데이터셋의 품질(연락처·좌표·주소 커버리지)은?
          grain: 업종3단
          primary_key: [major, category, dataset]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: total_rows
        data_type: bigint
        description: 해당 API 전체 업소 수(커버리지 분모).
      - name: active_rows
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: phone_coverage
        data_type: decimal(38,18)
        description: 전화번호 보유율(0~1).
      - name: geo_coverage
        data_type: decimal(38,18)
        description: 좌표(위경도) 보유율.
      - name: admin_dong_coverage
        data_type: decimal(38,18)
        description: 행정동 매핑 성공률.
      - name: address_coverage
        data_type: decimal(38,18)
        description: 주소 보유율.
      - name: close_date_coverage_of_closed
        data_type: decimal(38,18)
        description: 폐업 업소 중 폐업일(dcbymd) 보유율 — 폐업행 0인 API 는 null(해당없음).
      - name: name_coverage
        data_type: decimal(38,18)
        description: 상호명 보유율.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_env_facility_operation
    description: 우리 구 배출시설 가동 — 환경 배출시설(대기/수질) 자치구별 연간 가동일수·가동시간. 영업시간 필드는 LOCALDATA 원천 부재(수질 가동필드 결측 큼).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_env_facility_operation
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_env_facility_operation   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 자치구별 환경 배출시설 가동
            summary: 대기·수질 배출시설이 자치구마다 연간 며칠, 몇 시간 가동했는지 집계했습니다.
            caveat: 수질 시설은 가동 필드 결측이 커서 대기 시설보다 신뢰도가 낮습니다.
            use_cases:
              - 자치구 환경 부하 비교
              - 배출시설 밀집 지역 파악
              - 환경 점검 우선순위
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "air_operating_days_top_gu"
              question_ko: "대기오염 배출시설을 연중 가장 오래 가동하는 자치구는 어디인가?"
              axes: "metric(연간 가동일수)→gu 랭킹, DESC (반전쌍: air_operating_days_bottom_gu)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "도봉구가 연평균 294.6일로 최장 가동, 금천 293.6일·중랑 292.8일이 근소 추격. 상위권은 p50이 모두 300일 — '연 300일 가동' 기입 관행이 뚜렷하다."
              sql: |
                -- :n = 5 (top-N)
                SELECT gu, avg_operating_days_per_year, p50_operating_days, with_operating_days
                FROM d1_env_facility_operation
                WHERE dataset='air_pollution_facility' AND gu_code<>'UNK' AND with_operating_days>=10
                ORDER BY avg_operating_days_per_year DESC
                LIMIT :n;
              requires: [select_columns, sort, filter_range]
              param_defaults: { n: 5 }
            - pattern_id: "air_operating_days_bottom_gu"
              question_ko: "대기오염 배출시설 가동일수가 가장 짧게 기록된 자치구는 어디인가?"
              axes: "metric(연간 가동일수)→gu 랭킹, ASC — 최장↔최단 정렬 반전"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "구로구가 연평균 33.2일로 압도적 최저(p50=0 — 관측 554건 중 '0일' 기입이 절반 이상), 2위 성동구 138.7일과 4배 차이. 실가동이 짧다기보다 0 기입 관행 신호다."
              sql: |
                -- :n = 5 (bottom-N) — top 패턴의 정렬 반전(DESC→ASC)
                SELECT gu, avg_operating_days_per_year, p50_operating_days, with_operating_days
                FROM d1_env_facility_operation
                WHERE dataset='air_pollution_facility' AND gu_code<>'UNK' AND with_operating_days>=10
                ORDER BY avg_operating_days_per_year ASC
                LIMIT :n;
              requires: [select_columns, sort, filter_range]
              param_defaults: { n: 5 }
            - pattern_id: "gu_facility_scale_top"
              question_ko: "환경 배출시설(대기+수질)이 가장 많이 가동 중인 자치구는 어디인가?"
              axes: "절대 규모(시설 수)→gu 랭킹, DESC (관점 반전쌍: air_days_coverage_low_gu 의 '비중')"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "강서구가 641곳으로 배출시설 최다, 구로 595·종로 573·강남 541 순. 준공업지(강서·구로)와 도심(종로·중구)이 나란히 상위권이다."
              sql: |
                -- :n = 5. facility_rows는 업소당 2관측(배출+방지)이라 /2로 실제 업소 수 환산
                SELECT gu, SUM(facility_rows)/2 AS active_facilities
                FROM d1_env_facility_operation
                WHERE gu_code<>'UNK'
                GROUP BY gu
                ORDER BY active_facilities DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "air_days_coverage_low_gu"
              question_ko: "가동일수 기록 보유율(커버리지)이 가장 낮은 자치구는 어디인가 — 데이터가 부실한 구는?"
              axes: "비중(기재율 %)→gu 랭킹, ASC — '절대 시설 수' 랭킹과 절대↔비중 관점 반전, ASC↔DESC 정렬 반전 겸용"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "서초구는 대기 배출시설 224곳 중 가동일수 기재가 23.9%뿐으로 최저, 강서 35.0%·중구 40.2%가 뒤따른다. 시설 수 최다인 강서구가 기재율 하위 2위 — 규모와 데이터 품질이 따로 논다."
              sql: |
                -- :dataset 예: 'air_pollution_facility', :n = 5. ASC(최저)↔DESC(최고) 반전 가능
                SELECT gu, ROUND(100.0*with_operating_days/facility_rows,1) AS days_coverage_pct,
                       facility_rows/2 AS active_facilities
                FROM d1_env_facility_operation
                WHERE dataset=:dataset AND gu_code<>'UNK' AND facility_rows>=20
                ORDER BY days_coverage_pct ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "gu_operation_profile"
              question_ko: "특정 자치구의 대기·수질 배출시설 가동 현황은 어떤가? (단면 조회)"
              axes: "gu 고정 → dataset×지표 단면 — 랭킹 패턴(지표→구)과 차원 교환(구→지표)"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "강남구는 대기 배출시설 289곳이 연평균 244.7일·하루 9.8시간 가동. 수질 252곳은 가동일수 기재 6건에 값도 전부 0 — 수질 축은 사실상 빈 껍데기다."
              sql: |
                -- :gu 예: '강남구'
                SELECT dataset_ko, facility_rows/2 AS active_facilities,
                       with_operating_days, avg_operating_days_per_year, p50_operating_days,
                       with_operating_hours, avg_operating_hours, p50_operating_hours
                FROM d1_env_facility_operation
                WHERE gu = :gu;
              requires: [select_columns]
            - pattern_id: "air_vs_water_facility_cross"
              question_ko: "자치구별로 대기 배출시설과 수질 배출시설 중 어느 쪽이 우세한가?"
              axes: "두 축 교차(dataset×gu 피벗) + 대기 우세↔수질 우세 관점 반전(DESC↔ASC)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "구로구는 대기/수질 비 1.75(379 vs 216곳)로 대기 우세 1위, 금천 1.61. 반대로 양천구는 0.18(21 vs 115곳)로 수질 시설이 5배 이상 많다."
              sql: |
                -- :n = 5. DESC=대기 우세 top ↔ ASC=수질 우세 top 반전
                SELECT a.gu, a.facility_rows/2 AS air_facilities, w.facility_rows/2 AS water_facilities,
                       ROUND(1.0*a.facility_rows/w.facility_rows,2) AS air_per_water
                FROM (SELECT * FROM d1_env_facility_operation WHERE dataset='air_pollution_facility') a
                JOIN (SELECT * FROM d1_env_facility_operation WHERE dataset='water_pollution_facility') w
                  ON w.gu_code = a.gu_code
                WHERE a.gu_code<>'UNK'
                ORDER BY air_per_water DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, join, filter_range]
            - pattern_id: "air_avg_p50_skew"
              question_ko: "평균과 중앙값 가동일수 괴리가 큰(분포가 왜곡된) 자치구는 어디인가?"
              axes: "파생 metric(avg−p50 괴리)→gu 랭킹 — 대표값 신뢰도 진단 축"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "성동구는 평균 138.7일 vs 중앙값 6.4일(+132.3)로 괴리 최대 — 절반 이상이 0 근처 기입인데 소수 장기가동 시설이 평균을 끌어올린다. 강서구는 반대로 −85.1(평균 214.9 < 중앙값 300)."
              sql: |
                -- :n = 5. 양수=소수 장기가동이 평균 견인, 음수=0 기입 소수가 평균 하향
                SELECT gu, avg_operating_days_per_year, p50_operating_days,
                       ROUND(avg_operating_days_per_year - p50_operating_days,1) AS avg_minus_p50
                FROM d1_env_facility_operation
                WHERE dataset='air_pollution_facility' AND gu_code<>'UNK' AND with_operating_days>=10
                ORDER BY ABS(avg_operating_days_per_year - p50_operating_days) DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "air_operating_hours_top_gu"
              question_ko: "대기 배출시설의 하루 가동시간이 가장 긴 자치구는 어디인가?"
              axes: "metric(시간/일)→gu 랭킹, DESC — 가동일수 랭킹과 지표 교환(일수↔시간)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "강동구가 하루 평균 12.7시간으로 최장 가동, 용산 11.1·동대문 11.0시간. 대부분 구의 p50은 8시간 — 표준 근무시간 가동이 기본값이다."
              sql: |
                -- :n = 5. 단위: 시간/일 (연간 아님). 수질은 기재 0건이라 대기 전용
                SELECT gu, avg_operating_hours, p50_operating_hours, with_operating_hours
                FROM d1_env_facility_operation
                WHERE dataset='air_pollution_facility' AND gu_code<>'UNK' AND with_operating_hours>=10
                ORDER BY avg_operating_hours DESC
                LIMIT :n;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "dataset_quality_rollup"
              question_ko: "데이터셋(대기 vs 수질)별로 가동 기록의 커버리지와 가중평균 가동일수는 얼마나 다른가?"
              axes: "차원 교환: 구별 랭킹 → 데이터셋별 전체 롤업(거버넌스/품질 관점)"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "대기는 업소 2,978곳·가동일수 커버리지 65.2%·가중평균 205.5일로 분석 가능하지만, 수질은 3,986곳 중 커버리지 5%·가동시간 0%·기재값 전부 0 — 이 테이블의 실질 분석축은 대기 데이터셋뿐이다."
              sql: |
                SELECT dataset_ko, SUM(facility_rows)/2 AS active_facilities,
                       ROUND(100.0*SUM(with_operating_days)/SUM(facility_rows),1) AS days_coverage_pct,
                       ROUND(100.0*SUM(with_operating_hours)/SUM(facility_rows),1) AS hours_coverage_pct,
                       ROUND(SUM(avg_operating_days_per_year*with_operating_days)/NULLIF(SUM(with_operating_days),0),1) AS weighted_avg_days
                FROM d1_env_facility_operation
                GROUP BY dataset_ko;
              requires: [select_columns, aggregate, group_by]
            - pattern_id: "inv_hours_coverage_asc"
              question_ko: "가동시간 정보가 가장 부실한 자치구는? (일수 커버리지 관점의 지표 교환)"
              axes: "자치구 랭킹 — 가동시간 커버리지 ASC(일수 커버리지 관점의 지표 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "서초구는 대기배출시설 448건 중 가동시간 기재가 55건(12.3%)뿐으로 최저."
              sql: |
                -- :dataset='air_pollution_facility', :n=10
                SELECT gu, facility_rows, with_operating_hours,
                       ROUND(100.0*with_operating_hours/facility_rows,1) AS hours_coverage_pct
                FROM d1_env_facility_operation WHERE dataset = :dataset AND gu_code <> 'UNK'
                ORDER BY hours_coverage_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "new_days_vs_hours_cross"
              question_ko: "연간 가동일수와 일 가동시간을 함께 보면 어느 구가 집약적인가?"
              axes: "자치구 × 두 지표 교차(일수 × 시간 → 연간 가동시간 파생)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2782a3846709488f811b1af7e08a32b1"
              insight_sample_ko: "강동구는 중앙값 292.5일 × 10.8시간 → 연 3,169시간 추정으로 가동 집약도 최상위."
              sql: |
                -- :dataset='air_pollution_facility'  (water 는 가동시간 결측이라 예시는 air)
                SELECT gu, p50_operating_days, p50_operating_hours,
                       ROUND(p50_operating_days * p50_operating_hours,0) AS annual_hours_est
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu_code <> 'UNK' AND p50_operating_days > 0 AND p50_operating_hours > 0
                ORDER BY annual_hours_est DESC LIMIT 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "env_gu_metric_rank_switch"
              question_ko: "가동 강도 지표(연간 가동일수 또는 일 가동시간)를 골라, 데이터셋별로 자치구 top/bottom-N 을 한 패턴으로 뽑으면?"
              axes: "일반화 랭킹: dataset × metric(days/hours) × 정렬 방향 스위치 → gu top/bottom-N — 기존 air_operating_days_top_gu/bottom_gu/air_operating_hours_top_gu 3개 고정 패턴의 파라미터 상위호환"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "대기 배출시설 연간 가동일수 1위는 도봉구로 평균 294.6일(중앙값 300일, 기재 89건)이다."
              sql: |
                -- :dataset='air_pollution_facility', :metric='days', :dir='desc', :min_records=10, :n=5
                SELECT gu,
                       CASE :metric WHEN 'days' THEN avg_operating_days_per_year WHEN 'hours' THEN avg_operating_hours END AS avg_value,
                       CASE :metric WHEN 'days' THEN p50_operating_days WHEN 'hours' THEN p50_operating_hours END AS p50_value,
                       CASE :metric WHEN 'days' THEN with_operating_days WHEN 'hours' THEN with_operating_hours END AS n_records
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu_code <> 'UNK'
                  AND CASE :metric WHEN 'days' THEN with_operating_days WHEN 'hours' THEN with_operating_hours END >= :min_records
                ORDER BY CASE WHEN :dir='asc' THEN CASE :metric WHEN 'days' THEN avg_operating_days_per_year WHEN 'hours' THEN avg_operating_hours END END ASC,
                         CASE WHEN :dir='desc' THEN CASE :metric WHEN 'days' THEN avg_operating_days_per_year WHEN 'hours' THEN avg_operating_hours END END DESC
                LIMIT :n;
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_records: 10, dir: "desc", n: 5 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "env_gu_share_of_total"
              question_ko: "서울 전체 환경 배출시설 중 각 자치구가 차지하는 비중(%)은 얼마인가?"
              axes: "비율: gu별 시설 수의 서울 전체 대비 점유율 랭킹 — 기존 gu_facility_scale_top(절대 수)의 절대↔비중 관점 전환 + dataset 센티널"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "대기+수질 합산 기준 시설 점유율 1위는 강서구로 641개소, 서울 전체의 9.2%를 차지한다."
              sql: |
                -- :dataset='ALL', :n=10
                SELECT gu, SUM(facility_rows)/2 AS active_facilities,
                       ROUND(100.0*SUM(facility_rows)/(SELECT SUM(facility_rows) FROM d1_env_facility_operation WHERE gu_code <> 'UNK' AND (:dataset='ALL' OR dataset = :dataset)),1) AS share_pct
                FROM d1_env_facility_operation
                WHERE gu_code <> 'UNK' AND (:dataset='ALL' OR dataset = :dataset)
                GROUP BY gu
                ORDER BY share_pct DESC
                LIMIT :n;
              requires: [select_columns, aggregate, group_by, sort, subquery, filter_range]
              param_defaults: { dataset: "ALL", n: 10 }
            - pattern_id: "env_days_band_distribution"
              question_ko: "연간 가동일수 기준으로 자치구들이 고가동/중가동/저가동 구간에 몇 곳씩 분포하는가?"
              axes: "분포: metric(가동일수)을 파라미터 경계(:hi/:lo)로 3구간 밴딩 → 구간별 자치구 수·명단 — 랭킹 축이 아닌 히스토그램 축(기존 패턴에 부재)"
              verified_rows: 3
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "경계 250/150일 기준 대기시설 고가동(high) 자치구는 9곳으로, 은평·동대문·중랑·금천·용산·노원·송파·도봉·광진구가 여기에 든다."
              sql: |
                -- :dataset='air_pollution_facility', :hi=250, :lo=150
                SELECT CASE WHEN avg_operating_days_per_year >= :hi THEN 'high'
                            WHEN avg_operating_days_per_year >= :lo THEN 'mid'
                            ELSE 'low' END AS band,
                       COUNT(*) AS n_gu,
                       GROUP_CONCAT(gu, ', ') AS gu_list
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu_code <> 'UNK'
                GROUP BY band
                ORDER BY MIN(avg_operating_days_per_year) DESC;
              requires: [select_columns, aggregate, group_by, sort]
            - pattern_id: "env_days_hours_coverage_gap"
              question_ko: "가동일수는 기재하면서 가동시간은 누락하는 — 두 커버리지의 갭이 큰 자치구는 어디인가?"
              axes: "파생 metric(일수 기재율 − 시간 기재율 갭)→gu 랭킹 — 기존 단일 커버리지 패턴(air_days_coverage_low_gu, inv_hours_coverage_asc) 두 축의 차이를 새 지표로 결합"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "강남구는 대기시설 가동일수 기재율 95.8%에 가동시간 기재율 48.1%로 갭이 47.8%p — 시간 정보 누락이 서울에서 가장 크다."
              sql: |
                -- :dataset='air_pollution_facility', :n=5
                SELECT gu,
                       ROUND(100.0*with_operating_days/facility_rows,1) AS days_coverage_pct,
                       ROUND(100.0*with_operating_hours/facility_rows,1) AS hours_coverage_pct,
                       ROUND(100.0*(with_operating_days - with_operating_hours)/facility_rows,1) AS coverage_gap_pct
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu_code <> 'UNK' AND facility_rows >= 20
                ORDER BY coverage_gap_pct DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { n: 5 }
            - pattern_id: "env_gu_vs_seoul_baseline"
              question_ko: "특정 자치구의 배출시설 가동 강도는 서울 전체 가중평균 대비 어느 수준인가?"
              axes: "단면+기준선 비교: gu 고정 단면에 서울 전체 가중평균(기재건수 가중)을 붙여 편차 산출 — 기존 gu_operation_profile(단면만)의 비교 기준선 확장"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "강남구 대기시설 평균 가동일수는 244.7일로 서울 가중평균 205.6일보다 39.1일 길고, 일 가동시간도 9.8시간으로 평균보다 2.0시간 길다."
              sql: |
                -- :gu='강남구', :dataset='air_pollution_facility'
                SELECT t.gu, t.avg_operating_days_per_year AS gu_avg_days, s.wavg_days AS seoul_wavg_days,
                       ROUND(t.avg_operating_days_per_year - s.wavg_days, 1) AS days_diff,
                       t.avg_operating_hours AS gu_avg_hours, s.wavg_hours AS seoul_wavg_hours,
                       ROUND(t.avg_operating_hours - s.wavg_hours, 1) AS hours_diff
                FROM d1_env_facility_operation t
                CROSS JOIN (SELECT ROUND(SUM(avg_operating_days_per_year*with_operating_days)/NULLIF(SUM(with_operating_days),0),1) AS wavg_days,
                                   ROUND(SUM(avg_operating_hours*with_operating_hours)/NULLIF(SUM(with_operating_hours),0),1) AS wavg_hours
                            FROM d1_env_facility_operation WHERE dataset = :dataset AND gu_code <> 'UNK') s
                WHERE t.gu = :gu AND t.dataset = :dataset;
              requires: [select_columns, aggregate, subquery]
            - pattern_id: "env_gu_pair_compare"
              question_ko: "두 자치구의 배출시설 규모·가동 강도·기재율을 나란히 비교하면 어떤가?"
              axes: "2-gu 병렬 단면: 같은 dataset 안에서 지정한 두 구를 지표 전열로 대조 — 단일 gu 단면(gu_operation_profile)의 비교쌍 확장"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "마포구-성동구 대기시설 비교에서 마포구가 평균 가동일수 245.9일(99개소, 일수 기재율 82.8%)로 앞선다."
              sql: |
                -- :gu_a='마포구', :gu_b='성동구', :dataset='air_pollution_facility'
                SELECT gu, facility_rows/2 AS active_facilities,
                       avg_operating_days_per_year, p50_operating_days,
                       avg_operating_hours, p50_operating_hours,
                       ROUND(100.0*with_operating_days/facility_rows,1) AS days_coverage_pct
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu IN (:gu_a, :gu_b)
                ORDER BY avg_operating_days_per_year DESC;
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "env_min_days_threshold_census"
              question_ko: "연평균 가동일수가 기준값 이상인 자치구는 몇 곳이고 어디인가? (top-N 절단 없는 전수 목록)"
              axes: "임계값 센서스: metric >= 기준값 필터로 전수 반환 — 랭킹(LIMIT 절단)으로는 답할 수 없는 '몇 곳인가' 질문 축"
              verified_rows: 9
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "연평균 250일 이상 가동하는 대기시설 자치구는 9곳이고 최상위는 도봉구(294.6일)다."
              sql: |
                -- :dataset='air_pollution_facility', :min_days=250, :min_records=10
                SELECT gu, avg_operating_days_per_year, p50_operating_days, with_operating_days
                FROM d1_env_facility_operation
                WHERE dataset = :dataset AND gu_code <> 'UNK'
                  AND with_operating_days >= :min_records
                  AND avg_operating_days_per_year >= :min_days
                ORDER BY avg_operating_days_per_year DESC;
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_records: 10, min_days: 250 }
            - pattern_id: "env_unmapped_share"
              question_ko: "자치구 매핑에 실패한(UNK) 시설 행이 데이터셋별로 얼마나 되나 — 구 단위 분석을 믿어도 되나?"
              axes: "거버넌스 단면: dataset별 UNK 행수·전체 행수·미매핑 비율 — 기존 dataset_quality_rollup(기재율)이 다루지 않는 지오 매핑 품질 축"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "68d88acdb7ab45cebd1d65e23010941d"
              insight_sample_ko: "대기 데이터는 5,952행 중 2행(0.03%)만 자치구 미매핑이고 수질은 0행 — 구 단위 분석의 모수 손실은 무시할 수준이다."
              sql: |
                SELECT dataset_ko,
                       SUM(CASE WHEN gu_code='UNK' THEN facility_rows ELSE 0 END) AS unmapped_rows,
                       SUM(facility_rows) AS total_rows,
                       ROUND(100.0*SUM(CASE WHEN gu_code='UNK' THEN facility_rows ELSE 0 END)/SUM(facility_rows), 2) AS unmapped_pct
                FROM d1_env_facility_operation
                GROUP BY dataset_ko;
              requires: [select_columns, aggregate, group_by]
          contract_version: v1
          product_question: 환경시설의 가동 일수·시간은?
          grain: 환경 dataset×자치구
          primary_key: [dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
