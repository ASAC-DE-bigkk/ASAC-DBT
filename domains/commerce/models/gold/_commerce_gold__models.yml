              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "food 최밀집 격자는 홍대 서교동 일대(37.55, 126.92) 844곳, 2위 동교·연남(37.56, 126.925) 773곳 — 강남역(37.495, 127.03) 735곳보다 홍대권이 위."
