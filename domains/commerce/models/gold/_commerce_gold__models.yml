              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "일반음식점의 서울 전체 조기폐업률 14.0% 대비 노원구는 16.3%로 +2.3%p 높아 편차 1위다."
              sql: |
                -- :dataset='general_restaurant', :min_closed=30, :n=10
                WITH city AS (
                  SELECT 1.0*SUM(closed_within_1y)/SUM(n_closed) AS city_ecr,
                         SUM(avg_days*n_closed)/SUM(n_closed) AS city_avg_days
                  FROM d1_lifespan
                  WHERE dataset = :dataset
                )
                SELECT l.gu_code, l.gu, l.n_closed,
                       ROUND(l.early_close_ratio,4) AS early_close_ratio,
                       ROUND(c.city_ecr,4) AS city_ecr,
                       ROUND(l.early_close_ratio - c.city_ecr,4) AS ecr_delta,
                       l.avg_days,
                       ROUND(c.city_avg_days,0) AS city_avg_days
                FROM d1_lifespan l CROSS JOIN city c
                WHERE l.dataset = :dataset AND l.gu_code != 'UNK' AND l.n_closed >= :min_closed
                ORDER BY ecr_delta DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range, subquery]
              param_defaults: { min_closed: 30, n: 10 }
            - pattern_id: "lifespan_category_share_in_gu"
              question_ko: "특정 자치구(:gu_code)의 폐업은 어떤 중분류로 구성되는가? (구성비 %)"
              axes: ":gu_code 단면 × 중분류 구성비 — 윈도우 합계로 share 산출"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "강남구 폐업의 47.8%는 식품 중분류(84,932건)가 차지하며, 이 축의 조기폐업률은 28.5%다."
              sql: |
                -- :gu_code='11680', :n=10
                SELECT category, category_ko, SUM(n_closed) AS n_closed,
                       ROUND(100.0*SUM(n_closed)/SUM(SUM(n_closed)) OVER (),1) AS closed_share_pct,
                       ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio,
                       ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w
                FROM d1_lifespan
                WHERE gu_code = :gu_code
                GROUP BY category, category_ko
                ORDER BY n_closed DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, window]
              param_defaults: { n: 10 }
            - pattern_id: "lifespan_gu_share_for_dataset"
              question_ko: "특정 업종(:dataset)의 폐업은 어느 자치구에 얼마나 집중돼 있는가? (구별 점유율 %)"
              axes: ":dataset 단면 × 자치구 폐업 점유율 — 볼륨 집중도 내림차순"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "일반음식점 폐업은 강남구가 38,812건(전체의 9.3%)으로 가장 집중돼 있고, 그 조기폐업률은 16.0%다."
              sql: |
                -- :dataset='general_restaurant', :n=10
                SELECT gu_code, gu, n_closed,
                       ROUND(100.0*n_closed/SUM(n_closed) OVER (),1) AS closed_share_pct,
                       ROUND(early_close_ratio,4) AS early_close_ratio,
                       avg_days
                FROM d1_lifespan
                WHERE dataset = :dataset AND gu_code != 'UNK'
                ORDER BY n_closed DESC
                LIMIT :n
              requires: [select_columns, sort, window, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "lifespan_stable_cell_screen"
              question_ko: "조기폐업률이 :max_ecr 이하이고 중위수명이 :min_p50 일 이상인 안정 업종×자치구 조합은 어디인가? (진입 후보 스크리닝)"
              axes: "업종×자치구 셀 다중 임계값 스크리닝 — ECR 상한 + p50 하한 + 모수 하한"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "조기폐업률 10% 이하·중위수명 2,000일 이상 조건에서 은평구 공연장이 중위수명 11,496일(조기폐업률 2.4%, 10년+ 생존 201건)로 1위다."
              sql: |
                -- :max_ecr=0.1, :min_p50=2000, :min_closed=50, :n=15
                SELECT dataset, dataset_ko, gu_code, gu, n_closed, p50_days, avg_days,
                       ROUND(early_close_ratio,4) AS early_close_ratio, survived_10y_then_closed
                FROM d1_lifespan
                WHERE gu_code != 'UNK' AND n_closed >= :min_closed
                  AND early_close_ratio <= :max_ecr AND p50_days >= :min_p50
                ORDER BY p50_days DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_closed: 50, max_ecr: 0.1, min_p50: 2000, n: 15 }
            - pattern_id: "lifespan_skew_ranking"
              question_ko: "같은 업종×자치구 안에서 수명 양극화(p90/p50 배율)가 가장 심한(:dir='desc') 또는 가장 고른(:dir='asc') 곳은?"
              axes: "업종×자치구 셀 랭킹 — 분포 형태 지표(p90/p50 배율), 정렬 방향 스위치"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "은평구 즉석판매제조가공업은 중위수명 27일 vs 상위 10% 2,997일로 배율 111배 — 수명 양극화가 가장 심한 셀이다."
              sql: |
                -- :min_closed=100, :dir='desc', :n=10
                SELECT dataset, dataset_ko, gu, n_closed, p50_days, p90_days,
                       ROUND(1.0*p90_days/p50_days,2) AS p90_over_p50
                FROM d1_lifespan
                WHERE n_closed >= :min_closed AND p50_days > 0 AND gu_code != 'UNK'
                ORDER BY CASE WHEN :dir = 'desc' THEN 1.0*p90_days/p50_days END DESC,
                         CASE WHEN :dir = 'asc' THEN 1.0*p90_days/p50_days END ASC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_closed: 100, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "lifespan_unk_coverage_by_dataset"
              question_ko: "자치구 미상(UNK) 폐업 비중이 높은 업종은? — 지역 분석 신뢰도(커버리지) 점검"
              axes: "업종 랭킹 — UNK 귀속 비중(%) 내림차순, 조건부 합계"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "방문판매업은 폐업 16,072건 중 1,425건(8.9%)이 자치구 미상(UNK)으로, 지역 귀속 커버리지가 가장 낮은 업종이다."
              sql: |
                -- :min_closed=500, :n=10
                SELECT dataset, dataset_ko, SUM(n_closed) AS n_closed_total,
                       SUM(CASE WHEN gu_code = 'UNK' THEN n_closed ELSE 0 END) AS n_closed_unk,
                       ROUND(100.0*SUM(CASE WHEN gu_code = 'UNK' THEN n_closed ELSE 0 END)/SUM(n_closed),1) AS unk_pct
                FROM d1_lifespan
                GROUP BY dataset, dataset_ko
                HAVING SUM(n_closed) >= :min_closed
                ORDER BY unk_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { min_closed: 500, n: 10 }
            - pattern_id: "lifespan_dataset_search"
              question_ko: "업종 한글명에 :kw 가 들어가는 업종들의 폐업 규모·조기폐업률·수명 요약은? (업종 코드 발견용 검색)"
              axes: "키워드 검색 단면 — dataset_ko LIKE 부분일치, 폐업 규모 내림차순"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "'음식' 키워드로 4개 업종이 검색되며, 최대 모수는 일반음식점(폐업 415,495건, 조기폐업률 14.0%, 가중평균 수명 2,469일)이다."
              sql: |
                -- :kw='음식', :n=10
                SELECT dataset, dataset_ko, SUM(n_closed) AS n_closed,
                       ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio,
                       ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w
                FROM d1_lifespan
                WHERE dataset_ko LIKE '%' || :kw || '%'
                GROUP BY dataset, dataset_ko
                ORDER BY n_closed DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "lifespan_top_dataset_per_gu"
              question_ko: "각 자치구에서 조기폐업률이 가장 높은 업종 top-:k 는 무엇인가? (구별 위험 업종 지도)"
              axes: "그룹별 top-k — 자치구 파티션 ROW_NUMBER, 조기폐업률 내림차순"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "종로구의 조기폐업률 1위 업종은 즉석판매제조가공업으로 49.0%가 1년 내 폐업했고 중위수명은 388일에 불과하다."
              sql: |
                -- :min_closed=50, :k=1
                WITH ranked AS (
                  SELECT gu_code, gu, dataset, dataset_ko, n_closed,
                         ROUND(early_close_ratio,4) AS early_close_ratio, p50_days,
                         ROW_NUMBER() OVER (PARTITION BY gu_code ORDER BY early_close_ratio DESC) AS rn
                  FROM d1_lifespan
                  WHERE gu_code != 'UNK' AND n_closed >= :min_closed
                )
                SELECT gu_code, gu, rn, dataset, dataset_ko, n_closed, early_close_ratio, p50_days
                FROM ranked
                WHERE rn <= :k
                ORDER BY gu_code, rn
              requires: [select_columns, sort, window, filter_range, subquery]
              param_defaults: { min_closed: 50 }
          contract_version: v1
          product_question: 업종별 폐업까지 걸리는 수명은?
          grain: 업종3단×자치구
          primary_key: [major, category, dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, gu_code]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: n_closed
        data_type: bigint
        description: 수명 계산 모수 — 개업일·폐업일이 모두 유효한 폐업 완결 업소 수.
        tests: [not_null]
      - name: avg_days
        data_type: double
        description: 평균 수명(일).
      - name: p50_days
        data_type: bigint
        description: 중앙값 수명(일, approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 수명(일, approx_percentile).
      - name: closed_within_1y
        data_type: bigint
        description: 개업 1년 이내 폐업한 업소 수(조기폐업).
      - name: early_close_ratio
        data_type: decimal(38,18)
        description: 조기폐업률 = closed_within_1y / n_closed.
      - name: survived_10y_then_closed
        data_type: bigint
        description: 10년 이상 영업 후 폐업한 업소 수(장수 후 폐업).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_cohort_survival
    description: 창업 생존율 곡선 — 개업연도 코호트의 경과연차별 생존율 × 대/중분류. 우측검열 차단(관측 가능 연차만), 연 단위 근사.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_cohort_survival
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_cohort_survival   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 창업 코호트 생존율
            summary: 같은 해에 문을 연 업소들이 1년·2년·3년 뒤 몇 %나 살아남았는지 업종별로 계산했습니다.
            caveat: 관측이 가능한 연차까지만 계산하며 연 단위 근사입니다.
            use_cases:
              - 업종별 생존 곡선 비교
              - 창업 3년 고비 확인
              - 투자·대출 심사 참고
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "survival_top_ranking"
              question_ko: "최근 창업 코호트 기준 k년차 생존율이 가장 높은 업종 top-N은?"
              axes: "랭킹 top-N (업종 × 고정 연차, 코호트 가중 합산, DESC)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015~2019 코호트 5년차: 숙박 1.0은 폐업일 결측 아티팩트고, 실질 1위는 환경 69.7%·안경치과 69.4%·동물 64.0%. 최하위 식품은 35.7%."
              sql: |
                -- 검증값: :k=5, :from_y=2015, :to_y=2019, :n=10
                SELECT category, category_ko, major_ko,
                       SUM(cohort_n) AS cohort_total,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n), 4) AS survival_k
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                ORDER BY survival_k DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "survival_bottom_ranking"
              question_ko: "(반전) k년차 생존율이 가장 낮은 — 가장 빨리 사라지는 업종은? (소형 업종 노이즈 제거)"
              axes: "축 반전쌍 1/2 — survival_top_ranking의 정렬 반전(ASC) + HAVING 최소표본"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "5년 생존율 최하위는 식품 35.7%(16.9만 개 코호트) — 2위 위생·미용 52.2%와 16.5%p 격차로 압도적 꼴찌. 하위 5개가 전부 보건 계열."
              sql: |
                -- 검증값: :k=5, :from_y=2015, :to_y=2019, :min_n=1000, :n=10 — survival_top_ranking의 정렬 반전쌍
                SELECT category, category_ko, major_ko,
                       SUM(cohort_n) AS cohort_total,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n), 4) AS survival_k
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                HAVING SUM(cohort_n) >= :min_n
                ORDER BY survival_k ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_n: 1000, n: 10 }
            - pattern_id: "cohort_trend_by_category"
              question_ko: "(시계열) 특정 업종의 k년차 생존율이 개업연도 세대에 따라 어떻게 변했나 — 언제 창업한 세대가 강했나?"
              axes: "시계열 (코호트연도 축, 업종·연차 고정) — category_ranking_by_cohort와 차원 교환쌍"
              verified_rows: 32
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "식품 5년 생존율: 1990 코호트 73.0% → 1995 이후 45~48%대 → 2016부터 30%대로 추락(2019 31.5%, 2020 31.2%), 2021 33.6% 소폭 반등. 최근 창업 세대일수록 불리."
              sql: |
                -- 검증값: :category='food', :k=5 (32행: 1990~2021 코호트)
                SELECT cohort_y, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE category = :category AND years_elapsed = :k
                ORDER BY cohort_y;
              requires: [select_columns, sort]
            - pattern_id: "category_ranking_by_cohort"
              question_ko: "(반전) 특정 개업연도 코호트 하나를 고정하면, 그 해 창업자들은 업종별로 k년 뒤 얼마나 살아남았나?"
              axes: "축 반전쌍 2/2 — 차원 교환: 시계열(연도 가변)을 단면(연도 고정×업종 가변)으로 반전"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2018년 개업 코호트의 5년차: 문화 63.3%·산업 62.9%·의료 62.6%가 상위권, 식품만 33.0%로 유일한 30%대(37,328곳 중 12,323곳 생존)."
              sql: |
                -- 검증값: :cohort_y=2018, :k=5 — cohort_trend_by_category의 차원 교환쌍(업종 고정→연도 고정)
                SELECT category, category_ko, major_ko, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE cohort_y = :cohort_y AND years_elapsed = :k
                ORDER BY survival_rate DESC;
              requires: [select_columns, sort]
            - pattern_id: "survival_curve_slice"
              question_ko: "(:param 단면) 특정 업종·특정 개업연도의 생존곡선 전체 — 몇 년차에 얼마나 남나?"
              axes: ":param 단면 조회 (업종+연도 고정 → 연차 축 곡선) — 차트용 원자재"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015년 개업 식품 24,866곳: 개업 당해 92.6% → 1년차 80.2% → 5년차 44.8% → 11년차 25.0%. 첫 3년에 32%p가 사라진다."
              sql: |
                -- 검증값: :category='food', :cohort_y=2015 (12행: k=0~11)
                SELECT years_elapsed, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE category = :category AND cohort_y = :cohort_y
                ORDER BY years_elapsed;
              requires: [select_columns, sort]
            - pattern_id: "category_k_matrix"
              question_ko: "(두 축 교차) 업종 × 경과연차(1/3/5/10년) 생존율 매트릭스 — 어느 업종이 어느 구간에서 무너지나?"
              axes: "두 축 교차 (업종 × 연차 피벗, 조건부 가중 집계)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010~2015 코호트: 산업은 10년차에도 51.8% 생존 vs 식품 25.8% — 2배 격차. 약국은 1년차 69.0%로 첫해 이탈이 전 업종 최대(개국 실패는 초반에 결판)."
              sql: |
                -- 검증값: :from_y=2010, :to_y=2015 (10년차까지 전 코호트 관측 가능 창)
                SELECT category_ko, major_ko,
                       SUM(CASE WHEN years_elapsed=0 THEN cohort_n END) AS cohort_total,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=1 THEN survivors END)/SUM(CASE WHEN years_elapsed=1 THEN cohort_n END),4) AS y1,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=3 THEN survivors END)/SUM(CASE WHEN years_elapsed=3 THEN cohort_n END),4) AS y3,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=5 THEN survivors END)/SUM(CASE WHEN years_elapsed=5 THEN cohort_n END),4) AS y5,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=10 THEN survivors END)/SUM(CASE WHEN years_elapsed=10 THEN cohort_n END),4) AS y10
                FROM d1_cohort_survival
                WHERE cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category_ko, major_ko
                ORDER BY y5 DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "half_life_by_category"
              question_ko: "(관점 반전) 생존율을 고정하고 시간을 묻는다 — 몇 년차에 절반이 사라지나(업종별 반감기)?"
              axes: "관점 반전 — 랭킹류(k 고정→생존율)를 뒤집어 생존율 50% 고정→도달 연차. 미출현 업종 = :max_k년 내 반감 없음"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "반감기(생존율 50% 붕괴 연차): 식품 5년 최단, 의료·위생미용 6년, 동물·축산 7년, 약국 9년. 문화·산업·환경은 11년 내 반감 자체가 없음(결과에 미출현)."
              sql: |
                -- 검증값: :from_y=2000, :to_y=2015, :max_k=11 (창 내 모든 코호트가 k=11까지 관측 가능 → 구성 왜곡 없음)
                WITH curve AS (
                  SELECT category, category_ko, years_elapsed,
                         1.0*SUM(survivors)/SUM(cohort_n) AS rate
                  FROM d1_cohort_survival
                  WHERE cohort_y BETWEEN :from_y AND :to_y AND years_elapsed <= :max_k
                  GROUP BY 1,2,3
                )
                SELECT category, category_ko, MIN(years_elapsed) AS half_life_years
                FROM curve
                WHERE rate < 0.5
                GROUP BY category, category_ko
                ORDER BY half_life_years ASC, category;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { max_k: 11 }
            - pattern_id: "entry_volume_trend"
              question_ko: "(시계열) 연간 신규 개업(창업) 규모는 어떻게 변해 왔나 — 대분류별 기여 포함?"
              axes: "시계열 (연도 축 × 대분류 조건부 피벗) — 생존율이 아닌 cohort_n 자체를 지표로 쓰는 보조 관점"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "연간 신규 개업: 2016년 9.7만 → 2020년 14.5만 피크(산업 8.2만이 견인) → 이후 매년 감소해 2025년 10.9만. 보건은 5만 안팎으로 안정적."
              sql: |
                -- 검증값: :from_y=2016, :to_y=2025 — years_elapsed=0 단면만 사용(cohort_n 반복 과대집계 방지), 2026은 부분연도라 제외
                SELECT cohort_y, SUM(cohort_n) AS new_total,
                       SUM(CASE WHEN major='health' THEN cohort_n ELSE 0 END) AS health_n,
                       SUM(CASE WHEN major='industry' THEN cohort_n ELSE 0 END) AS industry_n,
                       SUM(CASE WHEN major='culture' THEN cohort_n ELSE 0 END) AS culture_n,
                       SUM(CASE WHEN major='environment' THEN cohort_n ELSE 0 END) AS environment_n
                FROM d1_cohort_survival
                WHERE years_elapsed = 0 AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY cohort_y ORDER BY cohort_y;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "major_survival_curves"
              question_ko: "대분류 4개의 생존곡선을 겹쳐 그리면 어디서 갈라지나?"
              axes: "두 축 교차 (대분류 × 연차, long 포맷) — 멀티라인 생존곡선 차트용"
              verified_rows: 44
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010~2015 코호트 10년차 생존율: 산업 51.8%·환경 50.4%·문화 50.2%로 3개 대분류가 절반 유지 vs 보건 28.4% — 식품이 포함된 보건만 곡선이 급락한다."
              sql: |
                -- 검증값: :from_y=2010, :to_y=2015, :max_k=10
                SELECT major_ko, years_elapsed,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n),4) AS survival_rate
                FROM d1_cohort_survival
                WHERE cohort_y BETWEEN :from_y AND :to_y AND years_elapsed <= :max_k
                GROUP BY major_ko, years_elapsed
                ORDER BY major_ko, years_elapsed;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { max_k: 10 }
            - pattern_id: "inv_worst_survival"
              question_ko: "5년 생존율이 가장 낮은 업종은? (높은 생존율 랭킹의 반전)"
              axes: "업종 랭킹 — 생존율 ASC(생존 top 관점의 반전)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "5년 생존율 최저는 식품 44.5%(코호트 856,241 중 380,708 생존)."
              sql: |
                -- :years_elapsed=5, :min_n=500
                SELECT category_ko, SUM(cohort_n) AS cohort_n, SUM(survivors) AS survivors,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE years_elapsed = :years_elapsed
                GROUP BY category_ko HAVING SUM(cohort_n) >= :min_n
                ORDER BY survival_pct ASC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_n: 500 }
            - pattern_id: "new_cohort_fixed_curve"
              question_ko: "특정 연도에 개업한 업소들의 생존 곡선은? (코호트 고정 단면)"
              axes: "코호트 고정(:cohort_y) → 경과연수 전개(시계열 성격)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015년 개업 코호트는 0년차 94%에서 시작해 경과연수별로 곡선이 내려간다."
              sql: |
                -- :cohort_y=2015
                SELECT years_elapsed, SUM(cohort_n) AS cohort_n, SUM(survivors) AS survivors,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE cohort_y = :cohort_y
                GROUP BY years_elapsed ORDER BY years_elapsed
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "new_cohort_year_compare"
              question_ko: "개업 연도별로 3년 생존율이 좋아지고 있나 나빠지고 있나? (코호트 간 추이)"
              axes: "코호트 연도 시계열 — 경과연수 고정(:years_elapsed) 단면"
              verified_rows: 14
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010년 코호트의 3년 생존율은 63.4% — 코호트 연도별 비교로 개선/악화 추세를 읽는다."
              sql: |
                -- :years_elapsed=3, :min_n=1000
                SELECT cohort_y, SUM(cohort_n) AS cohort_n,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE years_elapsed = :years_elapsed AND cohort_y >= 2010
                GROUP BY cohort_y HAVING SUM(cohort_n) >= :min_n
                ORDER BY cohort_y
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_n: 1000 }
            - pattern_id: "x_entry_boom_vs_survival"
              question_ko: "개업 붐이 컸던 해에 진입한 코호트는 생존율이 낮은가 — 특정 개업연도(:cohort_y)의 업종군별 진입률(그 해 birth rate)과 같은 코호트의 :k년차 생존율 결합"
              axes: "업종군(category) 랭킹 — cohort_survival(cohort_y·k 고정) ⋈ churn_yearly(같은 해, 구 합산 → category 그레인) on category + 연도, 1:1. y(TEXT)↔cohort_y(INT)는 CAST로 정합"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2018년 진입률 1위 업종군은 산업(그 해 진입률 13.39%)으로, 이 코호트 48,540곳의 5년차 생존율은 62.9%다 — 진입 붐 상위 업종부터 생존 성적을 나란히 읽을 수 있다."
              sql: |
                -- :cohort_y=2018, :k=5
                WITH cs AS (
                  SELECT category, MAX(category_ko) AS category_ko,
                         SUM(cohort_n) AS cohort_n, SUM(survivors) AS survivors,
                         100.0*SUM(survivors)/SUM(cohort_n) AS survival_k_pct
                  FROM d1_cohort_survival
                  WHERE cohort_y = :cohort_y AND years_elapsed = :k
                  GROUP BY category
                ), ch AS (
                  SELECT category, SUM(opened) AS opened, SUM(stock_start) AS stock_start,
                         100.0*SUM(opened)/NULLIF(SUM(stock_start),0) AS birth_pct
                  FROM d1_churn_yearly
                  WHERE CAST(y AS INTEGER) = :cohort_y
                  GROUP BY category
                )
                SELECT s.category, s.category_ko, ROUND(c.birth_pct,2) AS birth_pct_that_year,
                       s.cohort_n, ROUND(s.survival_k_pct,1) AS survival_k_pct
                FROM cs s JOIN ch c ON c.category = s.category
                ORDER BY c.birth_pct DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
            - pattern_id: "interval_hazard_curve"
              question_ko: "(파생지표) 특정 업종(또는 전체)은 몇 년차 구간에서 탈락이 집중되나 — 연차별 조건부 탈락률(hazard) 곡선은?"
              axes: "시계열 + 파생지표 (연차 축, 직전 연차 생존자 대비 탈락률) — 누적 생존율 곡선의 미분 관점"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "식품 업종 2010~2015년 코호트는 0년차 생존율 0.9162(생존 116,007곳)로 곡선이 시작된다 — 개업 연도 안에 이미 8.38%p가 빠진 상태이며, 이후 연차별 hazard_rate가 탈락이 집중되는 구간을 보여준다."
              sql: |
                -- :category='food', :from_y=2010, :to_y=2015, :max_k=10
                WITH curve AS (
                  SELECT years_elapsed,
                         SUM(cohort_n) AS cohort_n,
                         SUM(survivors) AS survivors
                  FROM d1_cohort_survival
                  WHERE (:category = 'ALL' OR category = :category)
                    AND cohort_y BETWEEN :from_y AND :to_y
                    AND years_elapsed <= :max_k
                  GROUP BY years_elapsed
                )
                SELECT years_elapsed,
                       survivors,
                       ROUND(1.0*survivors/cohort_n, 4) AS survival_rate,
                       ROUND(1.0 - 1.0*survivors / LAG(survivors) OVER (ORDER BY years_elapsed), 4) AS hazard_rate
                FROM curve
                ORDER BY years_elapsed;
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { category: "ALL", max_k: 10 }
            - pattern_id: "category_pair_curve_gap"
              question_ko: "(교차 비교) 임의의 두 업종 A/B의 생존곡선을 나란히 놓으면 격차가 몇 년차에 얼마나 벌어지나?"
              axes: "교차 비교 (두 업종 파라미터 × 연차 축, 격차 컬럼) — 멀티라인 2선 비교 차트용"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2010~2015년 코호트에서 식품 vs 숙박의 1년차 생존율은 0.7905 대 1.0 — 식품이 20.95%p 뒤진 채 출발한다."
              sql: |
                -- :cat_a='food', :cat_b='lodging', :from_y=2010, :to_y=2015, :max_k=10
                WITH pair AS (
                  SELECT years_elapsed,
                         1.0*SUM(CASE WHEN category = :cat_a THEN survivors END)
                            /SUM(CASE WHEN category = :cat_a THEN cohort_n END) AS rate_a,
                         1.0*SUM(CASE WHEN category = :cat_b THEN survivors END)
                            /SUM(CASE WHEN category = :cat_b THEN cohort_n END) AS rate_b
                  FROM d1_cohort_survival
                  WHERE category IN (:cat_a, :cat_b)
                    AND cohort_y BETWEEN :from_y AND :to_y
                    AND years_elapsed <= :max_k
                  GROUP BY years_elapsed
                )
                SELECT years_elapsed,
                       ROUND(rate_a, 4) AS rate_a,
                       ROUND(rate_b, 4) AS rate_b,
                       ROUND(rate_a - rate_b, 4) AS gap_a_minus_b
                FROM pair
                WHERE rate_a IS NOT NULL AND rate_b IS NOT NULL
                ORDER BY years_elapsed;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { max_k: 10 }
            - pattern_id: "first_year_below_threshold"
              question_ko: "(임계값 일반화) 업종별로 누적 생존율이 :threshold 아래로 처음 떨어지는 연차는 언제인가 — 반감기(0.5 고정) 패턴의 임계 자유화판?"
              axes: "관점 반전 랭킹 (생존율 임계 고정 → 도달 연차) — half_life_by_category의 파라미터 일반화 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2000~2015년 코호트 기준 식품 업종은 2년차에 생존율 70% 선이 처음 무너진다(first_below_year=2) — 임계 0.7을 11년 내 하회한 업종은 10개다."
              sql: |
                -- :threshold=0.7, :from_y=2000, :to_y=2015, :max_k=11
                WITH curve AS (
                  SELECT category, category_ko, years_elapsed,
                         1.0*SUM(survivors)/SUM(cohort_n) AS rate
                  FROM d1_cohort_survival
                  WHERE cohort_y BETWEEN :from_y AND :to_y AND years_elapsed <= :max_k
                  GROUP BY 1, 2, 3
                )
                SELECT category, category_ko, MIN(years_elapsed) AS first_below_year
                FROM curve
                WHERE rate < :threshold
                GROUP BY category, category_ko
                ORDER BY first_below_year ASC, category;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { max_k: 11 }
            - pattern_id: "cohort_yoy_delta_rank"
              question_ko: "(변화폭 랭킹) k년차 생존율이 전년 개업 코호트 대비 가장 급변한(악화 또는 개선) 개업연도는 언제인가?"
              axes: "랭킹 (코호트 연도 축 × 전년 대비 변화폭, 윈도우 LAG, 정렬 스위치)"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "3년차 생존율 기준 2016년 개업 코호트가 전년 대비 -0.146으로 가장 크게 악화됐다(해당 코호트 생존율 0.5672)."
              sql: |
                -- :k=3, :from_y=2010, :to_y=2020, :dir='asc', :n=5
                WITH series AS (
                  SELECT cohort_y,
                         1.0*SUM(survivors)/SUM(cohort_n) AS rate
                  FROM d1_cohort_survival
                  WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                  GROUP BY cohort_y
                ),
                delta AS (
                  SELECT cohort_y,
                         ROUND(rate, 4) AS survival_rate,
                         ROUND(rate - LAG(rate) OVER (ORDER BY cohort_y), 4) AS delta_vs_prev
                  FROM series
                )
                SELECT cohort_y, survival_rate, delta_vs_prev
                FROM delta
                WHERE delta_vs_prev IS NOT NULL
                ORDER BY CASE WHEN :dir = 'asc' THEN delta_vs_prev END ASC,
                         CASE WHEN :dir = 'desc' THEN delta_vs_prev END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { dir: "asc", n: 5 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "survival_volatility_rank"
              question_ko: "(분포) 같은 업종이라도 개업 시점에 따라 k년차 생존율이 얼마나 출렁였나 — 타이밍 민감도(변동성)가 큰 업종은?"
              axes: "분포 (업종별 코호트 간 생존율 산포: 최저/최고/spread/평균 랭킹)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "약국은 5년차 생존율이 개업연도에 따라 0.3608~0.7285까지 출렁여 spread 0.3677로 변동성 1위다(9개 코호트, 평균 0.5209)."
              sql: |
                -- :k=5, :from_y=2005, :to_y=2018, :min_n=100, :n=10
                SELECT category, category_ko,
                       COUNT(*) AS n_cohorts,
                       ROUND(MIN(survival_rate), 4) AS worst_rate,
                       ROUND(MAX(survival_rate), 4) AS best_rate,
                       ROUND(MAX(survival_rate) - MIN(survival_rate), 4) AS spread,
                       ROUND(AVG(survival_rate), 4) AS avg_rate
                FROM d1_cohort_survival
                WHERE years_elapsed = :k
                  AND cohort_y BETWEEN :from_y AND :to_y
                  AND cohort_n >= :min_n
                GROUP BY category, category_ko
                ORDER BY spread DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { min_n: 100, n: 10 }
            - pattern_id: "early_vs_late_attrition"
              question_ko: "(조건부 분해) 어떤 업종이 초기(:k_early년차)에 무너지고, 어떤 업종이 초기를 버틴 뒤 장기(:k_late년차)에 소모되나?"
              axes: "단면 교차 (업종 × 두 체크포인트, 조건부 생존율 분해) — 누적 생존율을 초기/후기 구간으로 분리"
              verified_rows: 11
              verified_at: "2026-08-08T06:07:49Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2010~2015년 코호트에서 약국은 1년차 생존율 0.6901로 초기 탈락이 가장 크고, 1년차 생존자 중 5년차까지 남는 비율도 0.2973에 그쳐 장기 소모까지 겹친다."
              sql: |
                -- :k_early=1, :k_late=5, :from_y=2010, :to_y=2015
                SELECT category, category_ko, major_ko,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed = :k_early THEN survivors END)
                            /SUM(CASE WHEN years_elapsed = :k_early THEN cohort_n END), 4) AS early_survival,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed = :k_late THEN survivors END)
                            /SUM(CASE WHEN years_elapsed = :k_early THEN survivors END), 4) AS late_conditional_survival
                FROM d1_cohort_survival
                WHERE cohort_y BETWEEN :from_y AND :to_y
                  AND years_elapsed IN (:k_early, :k_late)
                GROUP BY category, category_ko, major_ko
                ORDER BY early_survival ASC;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "closure_volume_rank"
              question_ko: "(볼륨 랭킹) 비율 말고 절대 수로 — k년 안에 문 닫은 업소가 가장 많은 업종은 어디인가?"
              axes: "랭킹 top-N (업종 × 폐업 절대 규모 DESC) — 비율 랭킹(inv_worst_survival)의 볼륨 관점 보완"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2015~2019년 코호트에서 5년 내 폐업 절대 규모 1위는 식품 — 101,415곳 개업 중 64,949곳이 닫아 폐업률 0.6404다."
              sql: |
                -- :k=5, :from_y=2015, :to_y=2019, :n=10
                SELECT category, category_ko, major_ko,
                       SUM(cohort_n) AS opened,
                       SUM(cohort_n) - SUM(survivors) AS closed_within_k,
                       ROUND(1.0*(SUM(cohort_n) - SUM(survivors))/SUM(cohort_n), 4) AS closure_rate
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                ORDER BY closed_within_k DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "era_survival_compare"
              question_ko: "(시대 비교) 예전 세대(A 창)와 요즘 세대(B 창)를 비교하면 k년차 생존율이 가장 개선/악화된 업종은?"
              axes: "교차 비교 (업종 × 두 코호트 시대 창, 델타 랭킹, 정렬 스위치) — 단일 시계열 패턴들의 두 창 압축판"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "동물 업종은 5년차 생존율이 2005~2009 세대 0.4904에서 2015~2019 세대 0.6431로 +0.1527 개선돼 세대 간 개선 폭 1위다."
              sql: |
                -- :k=5, :a_from=2005, :a_to=2009, :b_from=2015, :b_to=2019, :dir='desc', :n=11
                WITH eras AS (
                  SELECT category, category_ko,
                         1.0*SUM(CASE WHEN cohort_y BETWEEN :a_from AND :a_to THEN survivors END)
                            /SUM(CASE WHEN cohort_y BETWEEN :a_from AND :a_to THEN cohort_n END) AS era_a_rate,
                         1.0*SUM(CASE WHEN cohort_y BETWEEN :b_from AND :b_to THEN survivors END)
                            /SUM(CASE WHEN cohort_y BETWEEN :b_from AND :b_to THEN cohort_n END) AS era_b_rate
                  FROM d1_cohort_survival
                  WHERE years_elapsed = :k
                  GROUP BY category, category_ko
                )
                SELECT category, category_ko,
                       ROUND(era_a_rate, 4) AS era_a_rate,
                       ROUND(era_b_rate, 4) AS era_b_rate,
                       ROUND(era_b_rate - era_a_rate, 4) AS delta_b_minus_a
                FROM eras
                WHERE era_a_rate IS NOT NULL AND era_b_rate IS NOT NULL
                ORDER BY CASE WHEN :dir = 'asc' THEN era_b_rate - era_a_rate END ASC,
                         CASE WHEN :dir = 'desc' THEN era_b_rate - era_a_rate END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { dir: "desc", n: 11 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "survivor_share_composition"
              question_ko: "(구성비) 코호트 창에서 k년을 버틴 생존 업소들의 업종 구성비는 — '살아남은 시장'은 어떤 모습인가?"
              axes: "비율/구성 (k년차 생존자 업종 점유율, 윈도우 전체합 분모)"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "c6d54be78e134f4d801ecc3cecf61744"
              insight_sample_ko: "2015~2019년 코호트의 5년차 생존 업소 중 산업 카테고리가 92,698곳으로 전체의 51.97%를 차지한다."
              sql: |
                -- :k=5, :from_y=2015, :to_y=2019
                SELECT category, category_ko, major_ko,
                       SUM(survivors) AS survivors_k,
                       ROUND(100.0*SUM(survivors)/SUM(SUM(survivors)) OVER (), 2) AS share_pct
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                ORDER BY survivors_k DESC;
              requires: [select_columns, sort, aggregate, group_by, window, filter_range]
          contract_version: v1
          product_question: 창업 후 몇 년을 버티나(코호트 생존율)?
          grain: 업종×창업연도×경과연차
          primary_key: [major, category, cohort_y, years_elapsed]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, cohort_y, years_elapsed]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: cohort_y
        data_type: integer
        description: 개업연도 코호트(정수).
        tests: [not_null]
      - name: years_elapsed
        data_type: bigint
        description: 개업 후 경과 연차(0=개업년).
        tests: [not_null]
      - name: cohort_n
        data_type: bigint
        description: 코호트 초기 개업 업소 수(생존율 분모).
      - name: survivors
        data_type: bigint
        description: 경과연차 시점 생존(미폐업) 업소 수.
      - name: survival_rate
        data_type: decimal(38,18)
        description: 생존율 = survivors / cohort_n.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_duration
    description: 휴업하면 얼마나 쉬나 — 상태(영업/휴업/폐업/취소) 세그먼트 지속기간 요약 × 업종·상태군. 이력 기반(씨앗 — 표본 축적 중).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_status_duration
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_status_duration   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 인허가 상태 지속기간
            summary: 영업·휴업·폐업 같은 상태에 업소가 얼마나 오래 머무는지 업종과 상태군별로 요약했습니다.
            caveat: 이력이 쌓이는 중인 씨앗 지표라 표본이 적습니다.
            use_cases:
              - 휴업 후 재개 시점 가늠
              - 상태 전환 대기시간 파악
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "pause_longest_topn"
              question_ko: "지금 휴업 중인 업소들이 가장 오래 쉬고 있는 업종은? (랭킹 top-N)"
              axes: "업종(dataset) → 평균 경과일 내림차순 | 단면: 휴업(02)·진행중"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "휴업 체류 최장은 통신판매업 — 진행중 2,671세그먼트 평균 164.2일(p50 195일). 소독업 155.5일, 고압가스업 149.1일 순."
              sql: |
                -- 축 반전 쌍 1-A (pause_recent_influx 와 정렬 반전) — 모집단 12행이라 LIMIT 5 권장
                SELECT dataset_ko, category_ko, n_segments, avg_days, p50_days, p90_days
                FROM d1_status_duration
                WHERE status_code = '02' AND is_ongoing = 1 AND n_segments >= 30
                ORDER BY avg_days DESC
                LIMIT 5;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "pause_recent_influx"
              question_ko: "최근에 휴업이 새로 쌓이고 있는(경과일이 짧은) 업종은? (정렬 반전)"
              axes: "업종(dataset) → 평균 경과일 오름차순 | 단면: 휴업(02)·진행중"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "휴업 경과일 최단은 의료기기판매(임대)업 68.6일(46세그) — 최근 휴업 유입이 상대적으로 활발. 의원 85.1일, 목재수입유통업 85.8일."
              sql: |
                -- 축 반전 쌍 1-B: pause_longest_topn 의 ORDER BY 반전 — 경과일 짧음 = 최근 휴업 유입 활발
                SELECT dataset_ko, category_ko, n_segments, avg_days, p50_days, p90_days
                FROM d1_status_duration
                WHERE status_code = '02' AND is_ongoing = 1 AND n_segments >= 30
                ORDER BY avg_days ASC
                LIMIT 5;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "major_status_matrix"
              question_ko: "대분류 × 상태군 교차로 보면 어느 분야가 어느 상태에 오래 머무나? (두 축 교차)"
              axes: "대분류(major_ko) × 상태군(status_group) 매트릭스, 셀값=가중평균 경과일"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "진행중 기준 산업 대분류가 전 상태군에서 최장(취소/말소 172.4일, 영업 160.4일). 보건의 제외/전출은 93.8일로 최단 셀."
              sql: |
                -- 가중평균(세그먼트 수 가중) — 행 단순 평균은 저표본 행에 왜곡됨
                SELECT major_ko, status_group,
                       SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                GROUP BY major_ko, status_group
                ORDER BY major_ko, status_group;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "completed_durations"
              question_ko: "실제로 끝난 상태는 얼마나 지속됐나 — 완결 세그먼트 기준 (관점 반전 A)"
              axes: "상태군(status_group) → 완결 지속일 | 관점: 종료 세그먼트(is_ongoing=0)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "완결 표본은 총 약 4,510세그먼트뿐(씨앗) — 종료된 휴업 31세그 평균 113.2일, 종료된 영업 4,465세그 105.6일, 종료된 폐업은 7세그 11.4일(저표본)."
              sql: |
                -- 축 반전 쌍 2-A (ongoing_durations 와 관점 반전): is_ongoing=0 만이 진짜 '지속기간'
                SELECT status_group,
                       SUM(n_segments) AS completed_segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days,
                       MAX(p90_days) AS max_p90
                FROM d1_status_duration
                WHERE is_ongoing = 0
                GROUP BY status_group
                ORDER BY w_avg_days DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "ongoing_durations"
              question_ko: "지금 진행 중인 상태에는 얼마나 머물러 있나 — 경과일 기준 (관점 반전 B)"
              axes: "상태군(status_group) → 현재까지 경과일 | 관점: 진행중 세그먼트(is_ongoing=1)"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "진행중은 취소/말소가 평균 164.7일(186,939세그)로 최장 경과, 폐업 140.7일(1,562,650세그) — 완결 관점(P4)과 표본 규모가 3자릿수 차이."
              sql: |
                -- 축 반전 쌍 2-B: completed_durations 의 is_ongoing 반전 — 값 의미가 '지속기간'→'현재까지 경과일'로 바뀜
                SELECT status_group,
                       SUM(n_segments) AS ongoing_segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days,
                       MAX(p90_days) AS max_p90
                FROM d1_status_duration
