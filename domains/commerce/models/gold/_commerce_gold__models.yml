          quality_coverage:
            field: dataset
            expected_distinct_count: 152
            # dev Gold 실측 147/152. 아래 5개 registry source는 완결월 이력이 아직 0건이라 정상 제외다.
            # caregiver_academy, construction_waste, special_high_pressure_gas,
            # tobacco_wholesale, water_tank_cleaning
            minimum_ratio: 0.95
            measurement_scope: source_relation
          public_projection:
            schema_version: "1.0.0"
            columns: [ym, event_type, major, category, gu_code, cnt]
          public_primary_key: [ym, event_type, major, category, gu_code]
          d1_rollup: (ym,event_type,major,category,gu_code) SUM(cnt) — dataset/dong/legal 드롭(HOW 정본=export SERVING_SPEC)
          event_time: ym                      # 시간축(#478 v1) — _catalog.time_axis/freshness 채움(타 도메인 동형)
          freshness_slo_minutes: 89280        # 62일. 완결월 grain: ym='YYYY-MM' 를 월초로 파싱하면 최신 이벤트월이 최대 약 62일 전(당월 제외+월 마감 지연). 게시 지연 감시는 publication_trigger.max_interval_minutes(26h) 담당
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "flow_trend_monthly"
              question_ko: "서울 전체 월별 개업·폐업·순증 추이는? (시계열)"
              axes: "시간(ym) × 이벤트(opened/closed 피벗 + net 파생)"
              verified_rows: 24
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "2024-12 폐업 13,506건 급증으로 순증 -6,554건 — 연말 일괄 폐업신고 효과가 매년 반복(2023-12 11,540건, 2025-12 12,240건). 그 외 달은 대체로 개업 우위(2024-07 순증 +2,862)."
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06'
                SELECT ym,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                GROUP BY ym
                ORDER BY ym;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "gu_open_topn"
              question_ko: "최근 N개월 개업이 가장 많은 자치구 top-N은? (랭킹)"
              axes: "자치구(gu_code) 랭킹, 개업 관점 DESC"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "최근 24개월 개업 1위 강남구(11680) 26,319건 — 2위 서초구(11650) 14,944건의 약 1.8배로 독보적. 송파(14,114)·마포(13,007)·강서(11,955) 순."
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06', :n=5
                SELECT gu_code, SUM(cnt) AS opened_cnt
                FROM d1_flow_monthly
                WHERE event_type='opened'
                  AND ym BETWEEN :ym_from AND :ym_to
                  AND gu_code <> 'UNK'
                GROUP BY gu_code
                ORDER BY opened_cnt DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "gu_net_bottom"
              question_ko: "같은 기간 폐업이 개업을 초과(순감)한 자치구는? (gu_open_topn의 축 반전 쌍 — 정렬·관점 반전)"
              axes: "자치구(gu_code) 랭킹, 순증 관점 ASC(개업랭킹의 반대 시선)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "최근 24개월 순감 자치구는 25곳 중 단 2곳 — 서대문구(11410) -620건, 중랑구(11260) -241건. 나머지는 모두 개업 우위(3위 은평 +179부터 양수)."
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06', :n=5
                SELECT gu_code,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                  AND gu_code <> 'UNK'
                GROUP BY gu_code
                ORDER BY net ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "gu_category_mix"
              question_ko: "특정 자치구의 업종(중분류)별 개·폐업 구성은? (:param 단면 — 구를 고정하고 업종 축 전개)"
              axes: "업종(major×category) 전개, 자치구 고정 단면"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "강남구 최근 24개월: industry 개업 12,684건(폐업 7,104)으로 최다, food는 개업 8,423 < 폐업 8,965로 유일하게 순감 — 강남 성장은 산업(통판 등) 주도, 음식점은 교체만 활발."
              sql: |
                -- :gu_code='11680'(강남구), :ym_from='2024-07', :ym_to='2026-06'
                SELECT major, category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed
                FROM d1_flow_monthly
                WHERE gu_code = :gu_code
                  AND ym BETWEEN :ym_from AND :ym_to
                GROUP BY major, category
                ORDER BY opened DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "category_gu_spread"
              question_ko: "특정 업종의 자치구별 개·폐업 분포는? (gu_category_mix의 축 반전 쌍 — 차원 교환: 업종 고정 × 구 전개)"
              axes: "자치구(gu_code) 전개, 업종(category) 고정 단면"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "food 개업 상위 5개 구(강남 8,423·송파 4,965·영등포 4,868·서초 4,715·마포 4,151) 전부 폐업이 개업을 초과 — 음식점업은 최상위 상권조차 순감 국면."
              sql: |
                -- :category='food', :ym_from='2024-07', :ym_to='2026-06', :n=5
                SELECT gu_code,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed
                FROM d1_flow_monthly
                WHERE category = :category
                  AND ym BETWEEN :ym_from AND :ym_to
                  AND gu_code <> 'UNK'
                GROUP BY gu_code
                ORDER BY opened DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "year_major_cross"
              question_ko: "연도별 × 대분류별 개업(또는 폐업) 건수 크로스탭은? (두 축 교차)"
              axes: "연(substr(ym,1,4)) × 대분류(major 피벗), 이벤트 고정"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "industry 개업이 2016년 42,872건 → 2020년 82,182건으로 약 1.9배 급증(코로나기 통신판매 붐) 후 2025년 53,180건까지 둔화. 마지막 연도(2026)는 6월까지 부분연도(26,057건)임에 주의."
              sql: |
                -- :event_type='opened', :ym_from='2016-01'
                SELECT substr(ym,1,4) AS y,
                       SUM(CASE WHEN major='health' THEN cnt ELSE 0 END) AS health,
                       SUM(CASE WHEN major='industry' THEN cnt ELSE 0 END) AS industry,
                       SUM(CASE WHEN major='culture' THEN cnt ELSE 0 END) AS culture,
                       SUM(CASE WHEN major='environment' THEN cnt ELSE 0 END) AS environment
                FROM d1_flow_monthly
                WHERE event_type = :event_type
                  AND ym >= :ym_from
                GROUP BY y
                ORDER BY y;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "ym_gu_slice"
              question_ko: "특정 연월 × 특정 자치구의 개·폐업 상세 내역은? (:param 단면 조회)"
              axes: "단면(ym×gu_code 고정) → 이벤트×업종 상세 행"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "2026-06 강남구: 최다 폐업은 food 297건, industry 250건 순 — 최신 완결월의 구 단위 드릴다운이 행 20개로 즉답 가능."
              sql: |
                -- :ym='2026-06', :gu_code='11680'(강남구)
                SELECT event_type, major, category, cnt
                FROM d1_flow_monthly
                WHERE ym = :ym
                  AND gu_code = :gu_code
                ORDER BY event_type, cnt DESC;
              requires: [select_columns, sort]
            - pattern_id: "category_close_ratio"
              question_ko: "업종별 개업 대비 폐업 배율(교체·수축 강도)은? (건수 랭킹의 관점 반전 — 비율 시선)"
              axes: "업종(category) 랭킹, 폐업/개업 비율 관점(절대 건수와 반대 시선) + 소표본 컷(:min_opened)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "최근 24개월 폐업/개업 배율: livestock 1.30, food 1.14로 1 초과(수축), 반대편 pharmacy 0.67·culture 0.72는 개업 우위 — 절대 건수 1위 food가 비율로는 수축 업종."
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06', :min_opened=100
                SELECT category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 2) AS close_per_open
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                GROUP BY category
                HAVING opened >= :min_opened
                ORDER BY close_per_open DESC;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "open_seasonality"
              question_ko: "개업은 몇 월에 몰리나? (월중 계절성 — 시계열 파생)"
              axes: "월중(month-of-year, substr(ym,6,2)) × 개업 건수 — 연도 축을 접은 계절성"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "최근 5년 개업은 1월 57,223건 최다, 12월 36,386건 최저(1월의 64%) — 연초 개업 집중·연말 회피가 뚜렷하고 7월(55,320)이 2위로 반기 초 효과도 관측."
              sql: |
                -- :ym_from='2021-07', :ym_to='2026-06' (정수 연 단위 창 권장 — 월별 표본수 균형)
                SELECT substr(ym,6,2) AS month_of_year,
                       SUM(cnt) AS opened_total
