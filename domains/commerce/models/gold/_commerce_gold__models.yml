                FROM d1_flow_yearly
                WHERE y BETWEEN :y_from AND :y_to
                GROUP BY y
                ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rank_gu_event_in_category"
              question_ko: "특정 연도·특정 업종(중분류)에서 개업(또는 폐업)이 가장 많았던 자치구 top-N은? (업종 내 자치구 경쟁 구도)"
              axes: "연도·업종·이벤트 고정 → 자치구 랭킹. rank_gu_by_event_year는 전 업종 합산이라 업종별 자치구 판도를 못 봄, cross_gu_category_net은 대분류 고정 net 셀 랭킹이라 상이"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2024년 food 개업 1위 자치구는 강남구(11680)로 4,439건이다."
              sql: |
                -- :y='2024', :event_type='opened', :category='food', :n=10
                SELECT f.gu_code, g.gu, SUM(f.cnt) AS cnt_sum
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.event_type = :event_type AND f.category = :category AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu
                ORDER BY cnt_sum DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
              param_defaults: { n: 10 }
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_flow_yearly   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 서울 인허가 개·폐업 흐름(연도별)
            summary: 연도 단위로 업종·지역별 개업과 폐업 건수를 집계했습니다. 수십 년치가 쌓여 있어 장기 추세를 봅니다.
            caveat: 완결된 연도만 담아 올해는 빠집니다.
            use_cases:
              - 업종 장기 성장·쇠퇴 추세
              - 지역 상권 구조 변화
              - 정책 효과 전후 비교
          contract_version: v1
          product_question: 개·폐업 흐름 추이(연)
          grain: 연×이벤트×업종×지역3축
          primary_key: [y, event_type, dataset, gu_code, admin_dong_code, legal_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [y, event_type, dataset, gu_code, admin_dong_code, legal_code]
    columns:
      - name: y
        data_type: integer
        description: 이벤트 발생 연도(정수). 완결연만(당해 제외). 원천 커버리지 1900~2025.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: cnt
        data_type: bigint
        description: 연별 개업/폐업 건수.
        tests: [not_null]
      - name: src_collected_at
        data_type: timestamp(6)
        description: >-
          이 행을 만든 빌드가 반영한 원천 수집 시각.
          다음 갱신은 이 시각 이후 바뀐 기간만 다시 계산해 바꿔 넣습니다.
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_seasonality
    description: 개업/폐업 월중 계절성(1~12월) × 업종 — '어느 달에 개·폐업 몰리나'(연도 무관, 최근 10개 완결연).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_seasonality
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_seasonality   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 개·폐업이 몰리는 달
            summary: 최근 10년 자료로 업종마다 1~12월 중 어느 달에 개업과 폐업이 몰리는지 집계했습니다.
            caveat: 연도를 구분하지 않고 합쳐 본 값이라 특정 해의 사정은 드러나지 않습니다.
            use_cases:
              - 개업 시기 결정
              - 업종별 성수기·비수기 파악
              - 계절 마케팅 기획
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "peak_months_top_n"
              question_ko: "개업(또는 폐업)이 가장 몰리는 달 top-N은?"
              axes: "월(1~12) 랭킹 내림차순 × 이벤트 단면 — 랭킹 top-N"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "개업은 1월(111,352건)·3월(110,709건)·4월(106,760건)에 최다 — 연초·봄 창업 러시가 뚜렷하다."
              sql: |
                -- :event_type 예시 'opened' | :n 예시 3
                SELECT month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY month_of_year
                ORDER BY total DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "quiet_months_bottom_n"
              question_ko: "반대로 개업(또는 폐업)이 가장 한산한 달은? (peak_months_top_n의 정렬 반전쌍)"
              axes: "월 랭킹 오름차순 × 이벤트 단면 — 축 반전쌍 B(정렬 반전)"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "개업 최저는 12월(76,924건)로 피크 1월 대비 31% 적고, 9월(91,755)·10월(92,803)이 뒤따른다."
              sql: |
                -- :event_type 예시 'opened' | :n 예시 3
                SELECT month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY month_of_year
                ORDER BY total ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "monthly_open_close_curve"
              question_ko: "1~12월 개업·폐업 곡선과 월별 폐업/개업 비율은 어떻게 움직이나?"
              axes: "시계열(월 1→12) × 이벤트 피벗(개업·폐업 두 곡선 + 비율)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "폐업/개업 비율은 12월에만 1을 넘는다(1.332 — 폐업 102,440 > 개업 76,924). 11월 0.707이 2위로, 연말로 갈수록 폐업 압력이 급등한다."
              sql: |
                SELECT month_of_year,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS closed_per_opened
                FROM d1_seasonality
                GROUP BY month_of_year
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_peak_month"
              question_ko: "업종(중분류)별로 개·폐업이 가장 몰리는 '피크 달'과 그 쏠림 강도(연중 점유율)는?"
              axes: "업종→달 방향(업종마다 피크 달 1개) — 축 반전쌍 A-1(차원 교환)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "계절성이 가장 강한 업종은 환경(6월 점유 17.2% — 균등 8.3%의 2배), 이어 숙박 12월 12.0%, 의료 2월 10.8%, 산업 1월 10.7%."
              sql: |
                -- :event_type 예시 'opened' (균등분포 기준 점유율 8.3%)
                WITH m AS (
                  SELECT category_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY category_ko, month_of_year
                ), s AS (
                  SELECT category_ko, month_of_year, total,
                         ROUND(100.0*total/SUM(total) OVER (PARTITION BY category_ko), 1) AS share_pct,
                         ROW_NUMBER() OVER (PARTITION BY category_ko ORDER BY total DESC) AS rn
                  FROM m
                )
                SELECT category_ko, month_of_year AS peak_month, total, share_pct
                FROM s WHERE rn = 1
                ORDER BY share_pct DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "month_hot_category"
              question_ko: "달별로 '유독' 그 달에 몰리는 업종은? (자기 연중 평균 대비 계절지수 1위 — category_peak_month의 축 반전)"
              axes: "달→업종 방향(달마다 계절지수 1위 업종) — 축 반전쌍 A-2(차원 교환). season_index=1이 평균, 2면 평달의 2배"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "12월 폐업 계절지수 1위는 환경(1.72배), 1월은 산업(1.48배) — 절대량 1위(식품)와 전혀 다른 그림이 나온다."
              sql: |
                -- :event_type 예시 'closed' | :min_annual 예시 2000 (소규모 업종 노이즈 컷)
                WITH m AS (
                  SELECT category_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY category_ko, month_of_year
                ), s AS (
                  SELECT category_ko, month_of_year, total,
                         SUM(total) OVER (PARTITION BY category_ko) AS annual,
                         ROUND(12.0*total/SUM(total) OVER (PARTITION BY category_ko), 2) AS season_index
                  FROM m
                ), r AS (
                  SELECT *, ROW_NUMBER() OVER (PARTITION BY month_of_year ORDER BY season_index DESC) AS rn
                  FROM s WHERE annual >= :min_annual
                )
                SELECT month_of_year, category_ko AS hot_category, total, season_index
                FROM r WHERE rn = 1
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "category_month_profile"
              question_ko: "특정 업종(:category)의 월별 개업·폐업 프로파일은?"
              axes: ":param 단면(업종 고정) × 시계열(월) × 이벤트 피벗"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "식품업은 11월(폐업 33,582 > 개업 32,688)과 12월(46,027 > 29,317, 1.57배)에만 폐업이 개업을 역전 — 12월 격차가 압도적이다."
              sql: |
                -- :category 예시 'food' (코드 사용 — 식품). 11종 코드: food/livestock/health_medical/pharmacy/animal/hygiene_beauty/optical_dental/lodging/culture/industry/environment
                SELECT month_of_year,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt
                FROM d1_seasonality
                WHERE category = :category
                GROUP BY month_of_year
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "major_month_heatmap"
              question_ko: "대분류 × 월 히트맵 — 어느 대분류가 어느 달에 몰리고, 진폭은 얼마나 다른가?"
              axes: "두 축 교차(대분류 × 월) — 히트맵/스몰멀티플용"
              verified_rows: 48
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "산업 개업은 1월 63,956 → 12월 32,487로 진폭 약 2.0배인 반면, 보건(최대 5월 46,648/최소 12월 37,213, 1.25배)·문화(1.23배)는 평탄 — 계절 진폭 자체가 대분류를 가른다."
              sql: |
                -- :event_type 예시 'opened' (4개 대분류 × 12월 = 48셀)
                SELECT major_ko, month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY major_ko, month_of_year
                ORDER BY major_ko, month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "dataset_extreme_seasonality"
              question_ko: "최세분(데이터셋) 단위에서 계절성이 극단적인 업종 top-N은? (피크월/최저월 배율)"
              axes: "데이터셋(148종) 랭킹 top-N × 파생 지표(피크/최저 배율). months_present=12 조건이 결측월 왜곡 차단"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "수질오염설치시설(기타)은 피크월 1,309건 vs 최저월 62건으로 21.1배 — 대기오염배출시설 10.7배와 함께 규제·행정 일괄처리성 계절성이 극단적이다."
              sql: |
                -- :event_type 예시 'opened' | :min_total 예시 1200 (10년 누적 — 월평균 10건 이상) | :n 예시 5
                WITH m AS (
                  SELECT dataset_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY dataset_ko, month_of_year
                ), s AS (
                  SELECT dataset_ko, SUM(total) AS annual_total, MAX(total) AS peak_cnt, MIN(total) AS trough_cnt,
                         COUNT(*) AS months_present
                  FROM m GROUP BY dataset_ko
                )
                SELECT dataset_ko, annual_total, peak_cnt, trough_cnt,
                       ROUND(1.0*peak_cnt/trough_cnt, 1) AS peak_to_trough
                FROM s
                WHERE months_present = 12 AND annual_total >= :min_total
                ORDER BY peak_to_trough DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "inv_flat_seasonality"
              question_ko: "계절성이 거의 없는(연중 고른) 업종은? (극단 계절성 랭킹의 반전)"
              axes: "업종 랭킹 — 피크/최저 배율 ASC(dataset_extreme_seasonality 의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "담배소매업은 피크/최저 배율 1.23으로 사실상 계절성이 없다(연중 고른 개업)."
              sql: |
                -- :event_type='opened', :min_total=500, :n=10
                SELECT dataset_ko, SUM(cnt) AS total, MAX(cnt) AS peak, MIN(cnt) AS trough,
                       ROUND(1.0*MAX(cnt)/NULLIF(MIN(cnt),0),2) AS peak_over_trough
                FROM d1_seasonality WHERE event_type = :event_type
                GROUP BY dataset_ko HAVING SUM(cnt) >= :min_total AND MIN(cnt) > 0
                ORDER BY peak_over_trough ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_total: 500, n: 10 }
            - pattern_id: "inv_closed_peak_month"
              question_ko: "폐업이 몰리는 달은? (개업 피크 분석의 관점 반전)"
              axes: "월중 랭킹 — 폐업 이벤트(개업 관점의 반전)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "폐업은 12월 102,440건으로 최다 — 연말 일괄 신고 효과."
              sql: |
                SELECT month_of_year, SUM(cnt) AS closed_total
                FROM d1_seasonality WHERE event_type='closed'
                GROUP BY month_of_year ORDER BY closed_total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "new_month_fixed_dataset_rank"
              question_ko: "특정 달에 개업이 가장 많은 업종은? (월 고정 단면)"
              axes: "월 고정(:month_of_year) → 업종 랭킹 — 시간축을 필터로 세운 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "1월 개업 1위는 통신판매업 59,646건 — 연초 개업 집중의 실체."
              sql: |
                -- :month_of_year=1, :event_type='opened', :n=10
                SELECT dataset_ko, cnt
                FROM d1_seasonality
                WHERE month_of_year = :month_of_year AND event_type = :event_type
                ORDER BY cnt DESC LIMIT :n
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
            - pattern_id: "new_open_close_peak_gap"
              question_ko: "개업 피크월과 폐업 피크월이 다른 업종은? (두 관점 교차)"
              axes: "업종별 개업 피크월 vs 폐업 피크월 비교 — 이벤트 관점 교차"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "건강기능식품일반판매업은 개업 피크 1월 vs 폐업 피크 12월로 정반대 — 연초 진입·연말 정리 사이클."
              sql: |
                -- :min_total=1000
                WITH pk AS (
                  SELECT dataset_ko, event_type, month_of_year, cnt,
                         ROW_NUMBER() OVER (PARTITION BY dataset_ko, event_type ORDER BY cnt DESC) rn,
                         SUM(cnt) OVER (PARTITION BY dataset_ko, event_type) tot
                  FROM d1_seasonality)
                SELECT o.dataset_ko, o.month_of_year AS open_peak_m, c.month_of_year AS close_peak_m,
                       o.tot AS open_total, c.tot AS close_total
                FROM pk o JOIN pk c ON o.dataset_ko=c.dataset_ko AND o.rn=1 AND c.rn=1
                WHERE o.event_type='opened' AND c.event_type='closed' AND o.tot >= :min_total
                ORDER BY ABS(o.month_of_year - c.month_of_year) DESC LIMIT 10
              requires: [select_columns, sort, aggregate, join, subquery, window, filter_range]
              param_defaults: { min_total: 1000 }
            - pattern_id: "x_close_season_vs_lifespan"
              question_ko: "폐업이 특정 달에 쏠리는 업종의 폐업은 '계절적 일괄 정리'인가 '구조적 단명'인가 — 폐업 피크월·쏠림 강도와 수명 프로필(조기폐업률·평균 수명)의 결합"
              axes: "업종(dataset) 랭킹 — seasonality(event_type='closed' 피크월과 연중 점유율, 윈도우) ⋈ lifespan(조기폐업률·가중평균 수명) on dataset, 1:1"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "폐업 쏠림 1위는 비디오물시청제공업 — 폐업의 81.7%가 2월 한 달에 몰렸다. 그런데 이 업종 폐업 1,086건의 가중평균 수명은 2,765일, 조기폐업률은 14.0%로 낮다 — 단명이 아니라 특정 시점 일괄 정리(행정 처리) 성격의 폐업임을 결합으로 판별한 사례다."
              sql: |
                -- :min_closed=1000, :n=10
                WITH m AS (
                  SELECT dataset, MAX(dataset_ko) AS dataset_ko, month_of_year, SUM(cnt) AS cnt
                  FROM d1_seasonality WHERE event_type = 'closed'
                  GROUP BY dataset, month_of_year
                ), s AS (
                  SELECT dataset, dataset_ko, month_of_year, cnt,
                         SUM(cnt) OVER (PARTITION BY dataset) AS annual,
                         ROW_NUMBER() OVER (PARTITION BY dataset ORDER BY cnt DESC) AS rn
                  FROM m
                ), pk AS (
                  SELECT dataset, dataset_ko, month_of_year AS peak_close_month,
                         ROUND(100.0*cnt/annual,1) AS peak_share_pct, annual AS closed_events
                  FROM s WHERE rn = 1
                ), lf AS (
                  SELECT dataset, SUM(n_closed) AS n_closed,
                         ROUND(100.0*SUM(closed_within_1y)/SUM(n_closed),1) AS early_close_pct,
                         ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w
                  FROM d1_lifespan GROUP BY dataset
                )
                SELECT p.dataset_ko, p.peak_close_month, p.peak_share_pct, l.n_closed, l.early_close_pct, l.avg_days_w
                FROM pk p JOIN lf l ON l.dataset = p.dataset
                WHERE l.n_closed >= :min_closed
                ORDER BY p.peak_share_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, window, join]
              param_defaults: { min_closed: 1000, n: 10 }
            - pattern_id: "dim_volume_rank"
              question_ko: "대분류·중분류·데이터셋 중 원하는 계층(:dim)으로 개·폐업 누적 총량 순위와 전체 점유율을 보면?"
              axes: "차원 스위치(:dim ∈ major|category|dataset) × 볼륨 랭킹 DESC × 이벤트 피벗(개업/폐업/합계) + 전체 점유율·폐업/개업 비율"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "중분류 기준 물량 1위는 산업으로 전체 이벤트의 43.6%(871,738건)를 차지하며, 개업 597,230건 대비 폐업 274,508건으로 폐업/개업 비율은 0.46이다."
              sql: |
                -- :dim='category', :n=11
                SELECT CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko ELSE dataset_ko END AS dim_value,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_total,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_total,
                       SUM(cnt) AS all_events,
                       ROUND(100.0*SUM(cnt)/(SELECT SUM(cnt) FROM d1_seasonality), 1) AS share_pct,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)/NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS closed_per_opened
                FROM d1_seasonality
                GROUP BY CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko ELSE dataset_ko END
                ORDER BY all_events DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery]
              param_defaults: { n: 11 }
            - pattern_id: "dim_churn_ratio_rank"
              question_ko: "개업 대비 폐업이 가장 심한(:dir='desc') 또는 가장 건전한(:dir='asc') 업종 축은? 계층(:dim ∈ major|category|dataset)과 최소 개업량(:min_opened) 지정 가능"
              axes: "차원 스위치 × 비율 랭킹(폐업/개업) × 정렬 방향 스위치 + 최소 개업량 임계값"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "개업 1,000건 이상 데이터셋 중 폐업/개업 비율 1위는 서울시 세탁업 인허가 정보로, 개업 1,016건에 폐업 3,409건(비율 3.355) — 전형적인 구조적 축소 업종이다."
              sql: |
                -- :dim='dataset', :dir='desc', :min_opened=1000, :n=10
                WITH s AS (
                  SELECT CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko ELSE dataset_ko END AS dim_value,
                         SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_total,
                         SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_total
                  FROM d1_seasonality
                  GROUP BY CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko ELSE dataset_ko END
                  HAVING SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) >= :min_opened
                )
                SELECT dim_value, opened_total, closed_total,
                       ROUND(1.0*closed_total/opened_total, 3) AS closed_per_opened
                FROM s
                ORDER BY CASE WHEN :dir='asc' THEN 1.0*closed_total/opened_total END ASC,
                         CASE WHEN :dir='desc' THEN 1.0*closed_total/opened_total END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, having, subquery, filter_range]
              param_defaults: { min_opened: 1000, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "month_window_share_rank"
              question_ko: "특정 월 구간(:m_from~:m_to)에 개업(또는 폐업)이 유난히 몰리는 데이터셋 top-N은? (여름 장사·연말 정리 업종 발굴)"
              axes: "기간 창(월 구간 BETWEEN) × 데이터셋 랭킹(구간 점유율 DESC) + 최소 물량 임계값"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "6~8월 개업 비중 1위는 서울시 수질오염설치시설(기타) 인허가 정보로, 연중 개업 2,907건 중 56.8%(1,650건)가 여름 석 달에 몰린다."
              sql: |
                -- :event_type='opened', :m_from=6, :m_to=8, :min_total=1200, :n=10
                SELECT dataset_ko,
                       SUM(CASE WHEN month_of_year BETWEEN :m_from AND :m_to THEN cnt ELSE 0 END) AS window_cnt,
                       SUM(cnt) AS annual_cnt,
                       ROUND(100.0*SUM(CASE WHEN month_of_year BETWEEN :m_from AND :m_to THEN cnt ELSE 0 END)/SUM(cnt), 1) AS window_share_pct
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY dataset_ko
                HAVING SUM(cnt) >= :min_total
                ORDER BY window_share_pct DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_total: 1200, n: 10 }
            - pattern_id: "quarter_profile"
              question_ko: "분기(1~4Q) 단위로 접으면 개업·폐업과 폐업/개업 비율은 어떻게 움직이나? 특정 중분류(:category)만 볼 수도 있다('ALL'=전체)"
              axes: "파생 시간축(월→분기 접기) × 이벤트 피벗(개업/폐업/비율) × 선택 필터(:category, 'ALL' 센티널)"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "전체 기준 1분기는 개업 318,778건, 폐업 201,318건으로 폐업/개업 비율 0.632의 개업 우위 분기다."
              sql: |
                -- :category='ALL'
                SELECT (month_of_year - 1) / 3 + 1 AS quarter,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)/NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS closed_per_opened
                FROM d1_seasonality
                WHERE (:category = 'ALL' OR category = :category)
                GROUP BY (month_of_year - 1) / 3 + 1
                ORDER BY quarter;
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { category: "ALL" }
            - pattern_id: "monthly_risk_rank"
              question_ko: "개업 대비 폐업 비율이 가장 나쁜(:dir='desc') 또는 가장 좋은(:dir='asc') 달 top-N은? 업종 필터(:category, 'ALL'=전체) 가능"
              axes: "월 랭킹(폐업/개업 비율) × 정렬 방향 스위치 × 선택 필터(센티널) — monthly_open_close_curve 의 비율 컬럼을 랭킹 축으로 세운 상위호환"
              verified_rows: 3
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "전체 기준 폐업/개업 비율이 가장 나쁜 달은 12월로, 개업 76,939건 대비 폐업 102,443건(비율 1.331)이라 폐업이 개업을 앞지른다."
              sql: |
                -- :category='ALL', :dir='desc', :n=3
                SELECT month_of_year,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)/NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS closed_per_opened
                FROM d1_seasonality
                WHERE (:category = 'ALL' OR category = :category)
                GROUP BY month_of_year
                ORDER BY CASE WHEN :dir='asc' THEN closed_per_opened END ASC,
                         CASE WHEN :dir='desc' THEN closed_per_opened END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { category: "ALL", dir: "desc", n: 3 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "dim_month_season_profile"
              question_ko: "임의 계층(:level ∈ major|category|dataset)에서 코드(:code) 하나를 골라 월별 물량·연중 점유율·계절지수 곡선을 보면?"
              axes: "차원 스위치(계층 선택) × 단면(:code 고정) × 시계열(월 1→12) + 정규화 지표(점유율%, 계절지수 1=평달) — category_month_profile 의 계층 일반화·정규화 상위호환"
              verified_rows: 12
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "통신판매업(mail_order_sale) 개업은 1월에 59,664건으로 연중 10.9%, 계절지수 1.31 — 연초 한 달에 평달의 1.3배가 몰린다."
              sql: |
                -- :level='dataset', :code='mail_order_sale', :event_type='opened'
                WITH m AS (
                  SELECT month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                    AND CASE :level WHEN 'major' THEN major WHEN 'category' THEN category ELSE dataset END = :code
                  GROUP BY month_of_year
                )
                SELECT month_of_year, total,
                       ROUND(100.0*total/SUM(total) OVER (), 1) AS share_pct,
                       ROUND(12.0*total/SUM(total) OVER (), 2) AS season_index
                FROM m
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "month_season_index_rank"
              question_ko: "특정 달(:month_of_year)에 유독 몰리는 중분류 전체 순위는? (계절지수 기준 — month_hot_category 가 달마다 1위만 주는 한계를 걷어낸 월 고정 일반화)"
              axes: "월 고정 단면 × 중분류 랭킹(계절지수 DESC) + 최소 연물량 임계값"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "12월 폐업 계절지수 1위는 환경(1.71)으로, 연간 폐업 7,998건 중 1,142건이 12월 한 달에 몰린다."
              sql: |
                -- :month_of_year=12, :event_type='closed', :min_annual=1000, :n=11
                WITH m AS (
                  SELECT category_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY category_ko, month_of_year
                ), s AS (
                  SELECT category_ko, month_of_year, total,
                         SUM(total) OVER (PARTITION BY category_ko) AS annual,
                         ROUND(12.0*total/SUM(total) OVER (PARTITION BY category_ko), 2) AS season_index
                  FROM m
                )
                SELECT category_ko, total AS month_cnt, annual, season_index
                FROM s
                WHERE month_of_year = :month_of_year AND annual >= :min_annual
                ORDER BY season_index DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { min_annual: 1000, n: 11 }
            - pattern_id: "dataset_peak_concentration_rank"
              question_ko: "연중 물량이 피크 한 달에 가장 심하게 쏠리는 데이터셋 top-N은? (피크월 점유율 기준 — 결측월·0건 달이 있는 데이터셋도 포함)"
              axes: "데이터셋 랭킹(피크월 점유율 DESC) × 파생 지표(피크월 + 피크 점유율%) — dataset_extreme_seasonality 의 peak/trough 배율과 달리 trough=0·결측월 데이터셋도 평가하는 보완 척도"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "8122376b03f64c458dda8a0d4361f0fb"
              insight_sample_ko: "개업 쏠림 1위는 서울시 수질오염설치시설(기타) 인허가 정보로, 6월 한 달에 연중 개업의 45.0%(1,309/2,907건)가 집중된다."
              sql: |
                -- :event_type='opened', :min_total=600, :n=10
                WITH m AS (
                  SELECT dataset_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY dataset_ko, month_of_year
                ), s AS (
                  SELECT dataset_ko, month_of_year, total,
                         SUM(total) OVER (PARTITION BY dataset_ko) AS annual,
                         ROW_NUMBER() OVER (PARTITION BY dataset_ko ORDER BY total DESC) AS rn
                  FROM m
                )
                SELECT dataset_ko, month_of_year AS peak_month, total AS peak_cnt, annual,
                       ROUND(100.0*total/annual, 1) AS peak_share_pct
                FROM s
                WHERE rn = 1 AND annual >= :min_total
                ORDER BY peak_share_pct DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { min_total: 600, n: 10 }
          contract_version: v1
          product_question: 개·폐업이 몰리는 달은 언제인가?
          grain: 이벤트×월×업종3단
          primary_key: [event_type, month_of_year, major, category, dataset]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [event_type, month_of_year, major, category, dataset]
    columns:
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: month_of_year
        data_type: integer
        description: 월(1~12 정수) — 연도 제거한 월중 집계축.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: cnt
        data_type: bigint
