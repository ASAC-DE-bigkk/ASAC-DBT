            - pattern_id: "point-area-category-mix"
              d1_table: d1_geo_grid_detail
              question_ko: "특정 좌표 주변(±0.005도, 약 반경 500m+) 상권의 업종 구성과 비중은?"
              axes: "grid(좌표)→category 구성 — 반전쌍 A: category-top-grids 의 차원 교환(X별 Y ↔ Y별 X). 좌표 등호 대신 BETWEEN(부동소수 함정 회피)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "강남역(37.4979, 127.0276) 주변은 industry 49.2%(4,997곳, 통신판매 포함), food 19.1%(1,935곳), culture 16.0% — 실점포 기준으론 식품이 최대."
              sql: |
                SELECT major, category, SUM(active_cnt) AS active_cnt,
                       SUM(opened_last_365d_active) AS opened_last_365d_active,
                       ROUND(100.0 * SUM(active_cnt) / SUM(SUM(active_cnt)) OVER (), 1) AS share_pct
                FROM d1_geo_grid_detail
                WHERE grid_lat BETWEEN :lat - 0.005 AND :lat + 0.005  -- :lat 예: 37.4979 (강남역)
                  AND grid_lng BETWEEN :lng - 0.005 AND :lng + 0.005  -- :lng 예: 127.0276
