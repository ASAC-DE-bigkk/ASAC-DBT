              insight_sample_ko: "최근 폐업 유입 최상위는 의료유사업(p50 78일, 395세그)과 의료기기판매(임대)업(p50 79일, 36,440세그) — 대형 표본에서 경과 중앙값이 짧다 = 최근 폐업 전환이 계속 쌓이는 중."
              sql: |
