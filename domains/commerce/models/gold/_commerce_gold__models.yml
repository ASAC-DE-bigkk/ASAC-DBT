              question_ko: "특정 월(예: 3월)만 놓고 보면 개업(또는 폐업)은 해마다 어떻게 변해왔나? (계절성 드릴다운 — 월 고정 연도 추이)"
              axes: "월중(month-of-year) 고정 단면 × 연(y) 시계열 — open_seasonality 가 접은 연도 축을 다시 편다"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "매년 3월만 뽑은 개업 추이는 2016년 373건에서 시작한다."
              sql: |
                -- :month='03', :event_type='opened', :y_from='2016'
