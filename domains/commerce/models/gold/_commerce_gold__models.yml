            - pattern_id: "x_age_vs_churn"
              question_ko: "업소 연령대가 젊은 자치구가 폐업률도 높은가? (연령 구성 × 폐업률 교차)"
              axes: "제품 간 조인 — age_band(젊은 비중) × churn_yearly(폐업률)"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "7ff0a3957e274ea6a57f0265871efca8"
              insight_sample_ko: "서대문구는 3년 이하 비중 28.7%에 폐업률 13.74% — 25개 구를 젊음×폐업률 좌표로 놓고 볼 수 있다."
              sql: |
                -- :y='2024'
                WITH age AS (
                  SELECT gu_code,
                         ROUND(100.0*SUM(CASE WHEN age_band IN ('0_lt1y','1_1to3y') THEN active_cnt ELSE 0 END)/SUM(active_cnt),1) AS young_pct
                  FROM d1_age_band WHERE gu_code <> 'UNK' GROUP BY gu_code),
                ch AS (
                  SELECT gu_code, ROUND(100.0*SUM(closed)/NULLIF(SUM(stock_start),0),2) AS churn_pct
                  FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK' GROUP BY gu_code)
                SELECT a.gu_code, a.young_pct, c.churn_pct
                FROM age a JOIN ch c ON c.gu_code = a.gu_code
                ORDER BY a.young_pct DESC
              requires: [select_columns, sort, aggregate, group_by, join, subquery, filter_range]
            - pattern_id: "x_young_cell_vs_early_close"
              question_ko: "지금 젊은(업력 3년 미만) 가게가 몰려 있는 자치구×업종군 셀은 역대 조기폐업률도 높은 위험 지대인가 — 현재 스톡의 연령 구성과 누적 수명 이력의 셀 단위 2키 결합"
              axes: "자치구×업종군 셀 랭킹 — age_band(현재 스톡 스냅샷) ⋈ lifespan(전 기간 누적) on gu_code+category 2키, 1:1. 기존 x_age_vs_churn(구 단독 키 × churn)과 달리 셀 그레인"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "젊은 스톡 비중 1위 셀은 서대문구×산업(영업 7,720곳 중 3년 미만 36.7%)인데, 같은 셀의 역대 조기폐업률도 25.8%로 높다 — 신규 유입이 빠르게 소모되는 전형적 고회전 셀이다."
              sql: |
                -- :min_active=300, :min_closed=200, :n=15
                WITH ab AS (
                  SELECT gu_code, category, SUM(active_cnt) AS active_cnt,
                         100.0*SUM(CASE WHEN age_band IN ('0_lt1y','1_1to3y') THEN active_cnt ELSE 0 END)/SUM(active_cnt) AS young_pct
                  FROM d1_age_band WHERE gu_code <> 'UNK' GROUP BY gu_code, category
                ), lf AS (
                  SELECT gu_code, category, MAX(gu) AS gu, MAX(category_ko) AS category_ko,
                         SUM(n_closed) AS n_closed,
                         100.0*SUM(closed_within_1y)/SUM(n_closed) AS early_close_pct
                  FROM d1_lifespan WHERE gu_code <> 'UNK' GROUP BY gu_code, category
                )
                SELECT a.gu_code, l.gu, a.category, l.category_ko, a.active_cnt,
                       ROUND(a.young_pct,1) AS young_pct, ROUND(l.early_close_pct,1) AS early_close_pct
                FROM ab a JOIN lf l ON l.gu_code = a.gu_code AND l.category = a.category
                WHERE a.active_cnt >= :min_active AND l.n_closed >= :min_closed
                ORDER BY a.young_pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
              param_defaults: { min_active: 300, min_closed: 200, n: 15 }
            - pattern_id: "x_stock_survival_outlook"
              question_ko: "업종군별 현재 젊은 스톡 비중에 그 업종의 역사적 :k년차 생존율을 겹치면 — 어느 업종의 현재 스톡이 앞으로 가장 많이 줄어들 것으로 보이나 (전망 결합)"
              axes: "업종군(category) 랭킹 — age_band(현재 스톡의 3년 미만 비중) ⋈ cohort_survival(:from_y~:to_y 코호트의 k년차 생존율) on category, 1:1. at_risk_index = 젊은 비중 × (1-생존율)"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "위험 노출 1위는 식품 — 현재 영업 230,756곳 중 27.0%가 업력 3년 미만인데, 2010~2018 코호트의 5년차 생존율이 42.7%에 그쳐 at_risk_index 15.5로 전 업종군 중 가장 높다. 현재의 젊은 스톡이 앞으로 가장 많이 깎일 업종군이다."
              sql: |
                -- :k=5, :from_y=2010, :to_y=2018
                WITH ab AS (
                  SELECT category, SUM(active_cnt) AS active_total,
                         100.0*SUM(CASE WHEN age_band IN ('0_lt1y','1_1to3y') THEN active_cnt ELSE 0 END)/SUM(active_cnt) AS young_pct
                  FROM d1_age_band GROUP BY category
                ), cs AS (
                  SELECT category, MAX(category_ko) AS category_ko,
                         100.0*SUM(survivors)/SUM(cohort_n) AS survival_k_pct
                  FROM d1_cohort_survival
                  WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                  GROUP BY category
                )
                SELECT a.category, c.category_ko, a.active_total, ROUND(a.young_pct,1) AS young_pct,
                       ROUND(c.survival_k_pct,1) AS survival_k_pct,
                       ROUND(a.young_pct*(100.0-c.survival_k_pct)/100.0,1) AS at_risk_index
                FROM ab a JOIN cs c ON c.category = a.category
                ORDER BY at_risk_index DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
            - pattern_id: "band_range_share_rank"
              question_ko: "임의의 연속 업력 구간(:band_from~:band_to) 비중이 높은/낮은 자치구 또는 업종 랭킹 — 신생·중견·노포 어느 구간이든 한 패턴으로"
              axes: "행=:dim 스위치(gu|category), 지표=구간 비중(range_pct), 정렬=:dir(asc|desc) — rank_gu_new_share_top/rank_gu_old_share_top/inv_old_share_category_top 의 파라미터 일반화 상위호환. age_band 사전순=연령순이라 BETWEEN 으로 연속 구간 지정 가능, 기존이 못 덮던 중견(3~10년) 구간도 커버"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "3~10년 성장기 업소 비중 1위 자치구는 성동구(11200)로 전체 32,398곳 중 14,454곳, 44.6%가 이 구간에 있다."
              sql: |
                -- :dim='gu', :band_from='2_3to5y', :band_to='3_5to10y', :dir='desc', :top_n=10
                SELECT CASE :dim WHEN 'gu' THEN gu_code ELSE category END AS dim_value,
                       SUM(active_cnt) AS total_cnt,
                       SUM(CASE WHEN age_band BETWEEN :band_from AND :band_to THEN active_cnt ELSE 0 END) AS range_cnt,
                       ROUND(100.0*SUM(CASE WHEN age_band BETWEEN :band_from AND :band_to THEN active_cnt ELSE 0 END)/SUM(active_cnt),1) AS range_pct
                FROM d1_age_band
                WHERE (:dim <> 'gu' OR gu_code <> 'UNK')
                GROUP BY CASE :dim WHEN 'gu' THEN gu_code ELSE category END
                ORDER BY CASE WHEN :dir='asc' THEN range_pct END ASC,
                         CASE WHEN :dir='desc' THEN range_pct END DESC
                LIMIT :top_n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { dir: "desc", top_n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "gu_band_pivot"
              question_ko: "자치구 × 업력 밴드 크로스탭 — 25개 구의 연령 구성을 한 표로 (특정 업종만 좁혀 보기도 가능)"
              axes: "행=gu_code(25), 열=age_band 6종 피벗(CASE 집계), 필터=:category('ALL'=전체) — cross_major_band_pivot(major축)·new_category_age_profile(category축)의 gu축 결락 보완 + 센티널로 업종 한정 지원"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "전 업종 기준 총량 1위는 강남구(11680) 109,134곳이며 5~10년 밴드가 30,057곳으로 가장 두텁다."
              sql: |
                -- :category='ALL'
                SELECT gu_code,
                       SUM(CASE WHEN age_band='0_lt1y' THEN active_cnt ELSE 0 END) AS lt1y,
                       SUM(CASE WHEN age_band='1_1to3y' THEN active_cnt ELSE 0 END) AS y1_3,
                       SUM(CASE WHEN age_band='2_3to5y' THEN active_cnt ELSE 0 END) AS y3_5,
                       SUM(CASE WHEN age_band='3_5to10y' THEN active_cnt ELSE 0 END) AS y5_10,
                       SUM(CASE WHEN age_band='4_10to20y' THEN active_cnt ELSE 0 END) AS y10_20,
                       SUM(CASE WHEN age_band='5_ge20y' THEN active_cnt ELSE 0 END) AS ge20y,
                       SUM(active_cnt) AS total
                FROM d1_age_band
                WHERE gu_code <> 'UNK' AND (:category = 'ALL' OR category = :category)
                GROUP BY gu_code
                ORDER BY total DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { category: "ALL" }
            - pattern_id: "band_dist_flexible"
              question_ko: "서울 전체·특정 구·특정 업종 어느 수준에서든 업력 6밴드 분포(수량+비중)는? — 고정 단면 패턴의 센티널 일반화"
              axes: "행=age_band(6, 연령 오름차순), 필터=:gu_code·:category 각각 'ALL' 센티널 — slice_gu_category_band(둘 다 고정 필수)의 상위호환: 전체/구만/업종만/둘 다 4가지 수준을 한 패턴으로"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "서울 전체 food 업종의 1년 미만 신생 업소는 22,158곳으로 전체의 9.6%다(전 업종 전체 기준으로는 8.9%)."
              sql: |
                -- :gu_code='ALL', :category='food'
                SELECT age_band,
                       SUM(active_cnt) AS cnt,
                       ROUND(100.0*SUM(active_cnt)/(SELECT SUM(active_cnt) FROM d1_age_band
                             WHERE (:gu_code='ALL' OR gu_code=:gu_code) AND (:category='ALL' OR category=:category)),1) AS pct
                FROM d1_age_band
                WHERE (:gu_code='ALL' OR gu_code=:gu_code) AND (:category='ALL' OR category=:category)
                GROUP BY age_band
                ORDER BY age_band;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { gu_code: "ALL", category: "ALL" }
            - pattern_id: "compare_two_profiles"
              question_ko: "두 자치구(또는 두 업종)의 업력 구성 맞비교 — A/B 수량과 비중을 한 표에"
              axes: "행=age_band(6), 열=A/B 각각 cnt·pct, :dim 스위치(gu|category)로 비교 축 선택 — 기존엔 단면을 두 번 호출해 수동 비교해야 했던 head-to-head 를 한 방 조회로"
              verified_rows: 6
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "1년 미만 밴드에서 강남구(11680)는 10,586곳(9.7%), 마포구(11440)는 5,441곳(9.0%)으로 강남 쪽 신생 유입이 비중으로도 소폭 높다."
              sql: |
                -- :dim='gu', :a='11680', :b='11440'
                SELECT age_band,
                       SUM(CASE WHEN (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :a THEN active_cnt ELSE 0 END) AS a_cnt,
                       ROUND(100.0*SUM(CASE WHEN (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :a THEN active_cnt ELSE 0 END)
                             /(SELECT SUM(active_cnt) FROM d1_age_band WHERE (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :a),1) AS a_pct,
                       SUM(CASE WHEN (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :b THEN active_cnt ELSE 0 END) AS b_cnt,
                       ROUND(100.0*SUM(CASE WHEN (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :b THEN active_cnt ELSE 0 END)
                             /(SELECT SUM(active_cnt) FROM d1_age_band WHERE (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) = :b),1) AS b_pct
                FROM d1_age_band
                WHERE (CASE :dim WHEN 'gu' THEN gu_code ELSE category END) IN (:a, :b)
                GROUP BY age_band
                ORDER BY age_band;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "screen_cells_band_range"
              question_ko: "규모가 :min_cnt 이상이면서 특정 업력 구간 비중이 :min_pct% 이상인 (자치구×업종) 셀 발굴 — 조건 스크리닝"
              axes: "행=(gu_code×category) 셀, 필터=HAVING 이중 임계값(규모·비중), 구간=:band_from~:band_to BETWEEN — 기존 랭킹류가 단일 축이던 것과 달리 두 축 교차 그레인에서 조건 검색"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "3년 미만 비중 조건(규모 100+, 비중 30%+)에서 1위 셀은 서대문구(11410) animal 로 122곳 중 51곳, 41.8%가 신생이다. 노포 조건에서는 중랑구(11260) lodging 이 89곳 중 84곳(94.4%)이 20년 이상."
              sql: |
                -- :band_from='0_lt1y', :band_to='1_1to3y', :min_cnt=100, :min_pct=30, :n=15
                SELECT gu_code, category,
                       SUM(active_cnt) AS total_cnt,
                       SUM(CASE WHEN age_band BETWEEN :band_from AND :band_to THEN active_cnt ELSE 0 END) AS range_cnt,
                       ROUND(100.0*SUM(CASE WHEN age_band BETWEEN :band_from AND :band_to THEN active_cnt ELSE 0 END)/SUM(active_cnt),1) AS range_pct
                FROM d1_age_band
                WHERE gu_code <> 'UNK'
                GROUP BY gu_code, category
                HAVING SUM(active_cnt) >= :min_cnt
                   AND 100.0*SUM(CASE WHEN age_band BETWEEN :band_from AND :band_to THEN active_cnt ELSE 0 END)/SUM(active_cnt) >= :min_pct
                ORDER BY range_pct DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_cnt: 100, min_pct: 30, n: 15 }
            - pattern_id: "dominant_band_by_dim"
              question_ko: "각 자치구(또는 업종)의 최빈 업력 밴드는 무엇이고 얼마나 지배적인가?"
              axes: "행=:dim 스위치(gu|category) 전체, 지표=최빈 밴드(ROW_NUMBER=1)와 그 점유율 — 분포 6행을 대표 밴드 1행으로 접는 요약, gu_est_mean_age(가중 평균 스칼라)와 달리 분포의 모드를 준다"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "최빈 밴드 지배력 1위 자치구는 송파구(11710)로 5~10년 밴드가 18,405곳, 점유율 29.0%다. 업종 축에서는 lodging 이 20년 이상 밴드에 62.9%(1,727곳) 몰려 있다."
              sql: |
                -- :dim='gu'
                WITH agg AS (
                  SELECT CASE :dim WHEN 'gu' THEN gu_code ELSE category END AS dim_value,
                         age_band,
                         SUM(active_cnt) AS cnt
                  FROM d1_age_band
                  WHERE (:dim <> 'gu' OR gu_code <> 'UNK')
                  GROUP BY CASE :dim WHEN 'gu' THEN gu_code ELSE category END, age_band
                ), ranked AS (
                  SELECT dim_value, age_band, cnt,
                         ROUND(100.0*cnt/SUM(cnt) OVER (PARTITION BY dim_value),1) AS share_pct,
                         ROW_NUMBER() OVER (PARTITION BY dim_value ORDER BY cnt DESC) AS rn
                  FROM agg
                )
                SELECT dim_value, age_band AS dominant_band, cnt, share_pct
                FROM ranked
                WHERE rn = 1
                ORDER BY share_pct DESC;
              requires: [select_columns, sort, aggregate, group_by, window, subquery, filter_range]
            - pattern_id: "unk_coverage_by_dim"
              question_ko: "위치 미상(gu_code='UNK') 업소가 어느 업종/부문에 얼마나 있나 — 지역 분석 신뢰도 점검"
              axes: "행=:dim 스위치(category|major), 지표=UNK 수량·비중 내림차순 — 기존 패턴이 전부 UNK 를 제외만 하고 그 크기를 보여주지 않던 관측 사각 해소"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "UNK 비중이 가장 높은 업종은 industry 로 471,735곳 중 1,458곳(0.31%)이 자치구 미배정이다 — 구 단위 해석에 큰 왜곡은 없는 수준."
              sql: |
                -- :dim='category'
                SELECT CASE :dim WHEN 'major' THEN major ELSE category END AS dim_value,
                       SUM(active_cnt) AS total_cnt,
                       SUM(CASE WHEN gu_code='UNK' THEN active_cnt ELSE 0 END) AS unk_cnt,
                       ROUND(100.0*SUM(CASE WHEN gu_code='UNK' THEN active_cnt ELSE 0 END)/SUM(active_cnt),2) AS unk_pct
                FROM d1_age_band
                GROUP BY CASE :dim WHEN 'major' THEN major ELSE category END
                ORDER BY unk_pct DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "band_city_concentration"
              question_ko: "특정 업력 밴드의 서울 전체 물량이 어디에 얼마나 집중돼 있나 — 구(또는 업종)별 점유율과 누적 집중도"
              axes: "행=:dim 스위치(gu|category) 상위 :n, 지표=밴드 내 도시 점유율(city_share_pct)·누적 점유율(cum_share_pct) — inv_band_fixed_gu_rank(절대량만)의 상위호환: 윈도 합으로 집중도 곡선 제공"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "4cf99b7251e64f81a876d7b7cd3e2429"
              insight_sample_ko: "1년 미만 신생 업소의 12.4%(10,586곳)가 강남구(11680) 한 곳에 몰려 있다. 20년+ 노포는 업종 축에서 food 가 33.8%(39,728곳)로 최대 지분."
              sql: |
                -- :age_band='0_lt1y', :dim='gu', :n=10
                SELECT dim_value, band_cnt,
                       ROUND(100.0*band_cnt/SUM(band_cnt) OVER (),1) AS city_share_pct,
                       ROUND(100.0*SUM(band_cnt) OVER (ORDER BY band_cnt DESC ROWS UNBOUNDED PRECEDING)/SUM(band_cnt) OVER (),1) AS cum_share_pct
                FROM (
                  SELECT CASE :dim WHEN 'gu' THEN gu_code ELSE category END AS dim_value,
                         SUM(active_cnt) AS band_cnt
                  FROM d1_age_band
                  WHERE age_band = :age_band AND (:dim <> 'gu' OR gu_code <> 'UNK')
                  GROUP BY CASE :dim WHEN 'gu' THEN gu_code ELSE category END
                )
                ORDER BY band_cnt DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, window, subquery, filter_range]
              param_defaults: { n: 10 }
          contract_version: v1
          product_question: 신상 가게와 노포의 비중은?
          grain: 업종3단×자치구×업력밴드
          primary_key: [major, category, dataset, gu_code, age_band]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, gu_code, age_band]
