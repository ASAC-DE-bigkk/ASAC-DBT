            - pattern_id: "recent_closure_influx"
              question_ko: "최근 폐업 유입이 활발한(폐업 경과 중앙값이 짧은) 업종은?"
              axes: "업종(dataset) → 폐업 경과 중앙값 오름차순 | 단면: 폐업(03)·진행중·표본 100+"
