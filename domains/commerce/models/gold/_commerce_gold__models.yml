        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_gu_specialization
    description: 우리 구 특화 업종 — 자치구별 업종 특화지수(LQ)·구성비. LQ>1 이면 서울 평균 대비 밀집.
    config:
      contract: {enforced: true}
    columns:
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리(grain).
        tests: [not_null]
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류(특화 판정 업종축).
        tests: [not_null]
      - name: active_cnt
        data_type: bigint
        description: 구 내 해당 업종 영업(01) 업소 수.
