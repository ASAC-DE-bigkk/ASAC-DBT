                ORDER BY active_cnt DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "category_spatial_concentration"
              d1_table: d1_geo_grid_detail
              question_ko: "어떤 업종이 공간적으로 집중돼 있고 어떤 업종이 전역에 분산돼 있나? (top10 격자 점유율 비교)"
              axes: "category→공간 집중도 지표(파생) — 격자 랭킹의 관점 반전(어디가 최대 ↔ 얼마나 쏠렸나)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "livestock은 top10 격자가 전체의 23.1%를 점유(마장동 쏠림)로 최고 집중, food는 3.4%로 서울 전역에 가장 고르게 분산."
              sql: |
                WITH ranked AS (
                  SELECT category, active_cnt,
                         ROW_NUMBER() OVER (PARTITION BY category ORDER BY active_cnt DESC) AS rn,
                         SUM(active_cnt) OVER (PARTITION BY category) AS tot,
                         COUNT(*) OVER (PARTITION BY category) AS cells
                  FROM d1_geo_grid_detail)
                SELECT category, MAX(cells) AS grid_cells, MAX(tot) AS total_active,
                       SUM(CASE WHEN rn <= 10 THEN active_cnt ELSE 0 END) AS top10_active,
                       ROUND(100.0 * SUM(CASE WHEN rn <= 10 THEN active_cnt ELSE 0 END) / MAX(tot), 1) AS top10_share_pct
                FROM ranked GROUP BY category
                ORDER BY top10_share_pct DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "densest_grids_dominant_category"
              d1_table: d1_geo_grid_detail
              question_ko: "실점포 기준(무점포 성격의 industry 제외) 서울 최대 상권 격자 top10과 각 격자의 지배 업종은?"
              axes: "grid(전 업종 합)→dominant category — category_top_grids 의 축 반전(업종별 최대 격자 ↔ 격자별 최대 업종)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "실점포 1위는 을지로·명동(37.565, 126.995) 2,004곳(culture 지배), 2위 강남역(37.495, 127.03) 1,999곳(food 지배) — 도심은 문화·강남은 식품이 주도."
              sql: |
                WITH g AS (
                  SELECT grid_lat, grid_lng, SUM(active_cnt) AS total_active
                  FROM d1_geo_grid_detail
                  WHERE category <> 'industry'  -- 통신판매 등 무점포 등록 제외(포함 시 전 격자 72%가 industry 지배)
                  GROUP BY grid_lat, grid_lng
                  ORDER BY total_active DESC LIMIT 10)
                SELECT ROUND(g.grid_lat,3) AS grid_lat, ROUND(g.grid_lng,3) AS grid_lng, g.total_active,
                       (SELECT d.category FROM d1_geo_grid_detail d
                         WHERE d.grid_lat = g.grid_lat AND d.grid_lng = g.grid_lng
                           AND d.category <> 'industry'
                         ORDER BY d.active_cnt DESC LIMIT 1) AS dominant_category
                FROM g ORDER BY g.total_active DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "category_coverage_breadth"
              d1_table: d1_geo_grid_detail
              question_ko: "업종별로 서울에 얼마나 넓게 퍼져 있나? (존재 격자 수와 셀당 평균 밀도)"
              axes: "category→커버리지(격자 수)·평균 밀도 — 절대 밀집(top-N) 관점의 반전(퍼짐 vs 쏠림)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "industry는 전체 2,277개 격자 중 2,119개(93%)에 존재하며 셀당 평균 173.6곳으로 최광역, lodging은 558개 격자(25%)뿐인 희소 업종."
              sql: |
                SELECT category, COUNT(*) AS grid_cells, SUM(active_cnt) AS total_active,
                       ROUND(1.0 * SUM(active_cnt) / COUNT(*), 1) AS avg_per_cell
                FROM d1_geo_grid_detail
                GROUP BY category
                ORDER BY grid_cells DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "inv_growth_ratio_top"
              d1_table: d1_geo_grid_overview
              question_ko: "기존 규모 대비 신규 개업 비중이 높은(성장 중인) 격자는? (절대 밀도 관점의 반전)"
              axes: "격자 랭킹 — 신규/재고 비율(active_cnt 절대량 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "격자(37.500, 126.995) 산업은 활성 445곳 중 291곳이 최근 1년 신규 — 성장 최전선."
              sql: |
                -- :min_active=200, :n=10
                SELECT grid_lat, grid_lng, major, active_cnt, opened_last_365d_active,
                       ROUND(100.0*opened_last_365d_active/active_cnt,1) AS growth_pct
                FROM d1_geo_grid_overview WHERE active_cnt >= :min_active
                ORDER BY growth_pct DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { min_active: 200, n: 10 }
            - pattern_id: "new_major_fixed_grid_rank"
              d1_table: d1_geo_grid_overview
              question_ko: "이 대분류가 가장 밀집한 격자는? (대분류 고정 단면)"
              axes: "대분류 고정(:major) → 격자 랭킹"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "문화 대분류 최밀집 격자는 (37.565, 126.995) 1,415곳."
              sql: |
                -- :major='culture', :n=10
                SELECT grid_lat, grid_lng, active_cnt, opened_last_365d_active
                FROM d1_geo_grid_overview WHERE major = :major
                ORDER BY active_cnt DESC LIMIT :n
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
            - pattern_id: "inv_category_fixed_grid_rank"
              d1_table: d1_geo_grid_detail
              question_ko: "이 업종이 가장 밀집한 격자 좌표는? (격자 고정→업종 구성의 차원 교환)"
              axes: "업종 고정(:category) → 격자 랭킹 — point_area_category_mix 의 역방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "숙박 최밀집 격자는 (37.570, 126.990) 58곳 — 업종 고정 시 밀집지가 달라진다."
              sql: |
                -- :category='lodging', :n=10
                SELECT grid_lat, grid_lng, active_cnt, opened_last_365d_active
                FROM d1_geo_grid_detail WHERE category = :category
                ORDER BY active_cnt DESC LIMIT :n
              requires: [select_columns, sort]
              param_defaults: { n: 10 }
            - pattern_id: "new_grid_diversity"
              d1_table: d1_geo_grid_detail
              question_ko: "업종이 가장 다양하게 섞인 격자는? (단일 업종 밀집과 대비되는 시선)"
              axes: "격자 랭킹 — 업종 종수(밀도 관점의 대안 지표)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "격자(37.485, 126.895)는 11개 업종이 모두 섞인 4,488곳 — 밀도가 아닌 다양성 1위."
              sql: |
                -- :n=10
                SELECT grid_lat, grid_lng, COUNT(DISTINCT category) AS category_kinds, SUM(active_cnt) AS active_cnt
                FROM d1_geo_grid_detail GROUP BY grid_lat, grid_lng
                ORDER BY category_kinds DESC, active_cnt DESC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { n: 10 }
            - pattern_id: "category_growth_rank_citywide"
              d1_table: d1_geo_grid_detail
              question_ko: "서울 전역에서 어떤 업종이 최근 1년 신규 개업 비중이 높은가/낮은가? (:dim ∈ {category, major} 차원 선택, :dir ∈ {asc, desc} 정렬 방향)"
              axes: "단면+랭킹: 차원 스위치(category|major)→신규 개업 비중, 정렬 스위치 — 격자 축을 접은 전역 업종 단면. 기존 패턴은 전부 격자 축을 유지하거나(growth_hotspots) 커버리지만 봄(category_coverage_breadth); 업종 단위 성장/정체 랭킹은 미커버였고 major 축 사용 패턴도 최초"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "신규 개업 비중 1위 업종은 industry로, 1,506개 격자에서 활성 276,650건 중 최근 1년 개업이 30,686건(11.1%)이다."
              sql: |
                -- :dim='category', :dir='desc'
                SELECT CASE :dim WHEN 'major' THEN major ELSE category END AS dim_value,
                       COUNT(*) AS grid_cells,
                       SUM(active_cnt) AS active_cnt,
                       SUM(opened_last_365d_active) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d_active) / SUM(active_cnt), 1) AS new_open_share_pct
                FROM d1_geo_grid_detail
                GROUP BY CASE :dim WHEN 'major' THEN major ELSE category END
                ORDER BY CASE WHEN :dir = 'asc' THEN 1.0 * SUM(opened_last_365d_active) / SUM(active_cnt) END ASC,
                         CASE WHEN :dir = 'desc' THEN 1.0 * SUM(opened_last_365d_active) / SUM(active_cnt) END DESC
              requires: [select_columns, sort, aggregate, group_by]
              param_defaults: { dir: "desc" }
              param_enum: { dim: [category, major], dir: [asc, desc] }
            - pattern_id: "growth_grid_rank_generalized"
              d1_table: d1_geo_grid_detail
              question_ko: "특정 업종(:category, 'ALL'=전 업종)의 격자별 신규 개업 비중 상위/하위 랭킹은? (최소 활성 임계 :min_active, 방향 :dir ∈ {asc, desc}, 상위 :n개)"
              axes: "grid 랭킹 일반화: growth_hotspots_new_open_share·stable_low_turnover_zones 두 고정 패턴의 상위호환 — 고정 임계 100→:min_active, 고정 방향→:dir 스위치, 전 업종 고정→:category 센티널. 업종별 뜨는/정착 상권 조회가 새로 열림"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "전 업종 기준 신규 개업 비중 1위 격자는 (37.5, 126.995)로, 활성 499건 중 294건(58.9%)이 최근 1년 내 개업했다."
              sql: |
                -- :category='ALL', :min_active=100, :dir='desc', :n=10
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       SUM(active_cnt) AS active_cnt, SUM(opened_last_365d_active) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d_active) / SUM(active_cnt), 1) AS new_open_share_pct
                FROM d1_geo_grid_detail
                WHERE (:category = 'ALL' OR category = :category)
                GROUP BY ROUND(grid_lat,3), ROUND(grid_lng,3)
                HAVING SUM(active_cnt) >= :min_active
                ORDER BY CASE WHEN :dir = 'asc' THEN 1.0 * SUM(opened_last_365d_active) / SUM(active_cnt) END ASC,
                         CASE WHEN :dir = 'desc' THEN 1.0 * SUM(opened_last_365d_active) / SUM(active_cnt) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { category: "ALL", min_active: 100, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "nearest_category_grids"
              d1_table: d1_geo_grid_detail
              question_ko: "내 좌표(:lat, :lng)에서 가장 가까운 특정 업종 밀집 격자(활성 :min_cnt 이상)는 어디인가? (가까운 순 :n개)"
              axes: "근접 랭킹: 좌표→거리순 격자. 기존 point_area_category_mix 는 고정 ±0.005 창 안만 보지만, 이건 제곱거리 정렬이라 창 밖 원거리까지 최근접 N개를 항상 반환(빈 창 문제 없음)"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "강남역(37.4979, 127.0276)에서 가장 가까운 약국 밀집 격자는 (37.5, 127.025)로 활성 약국 26곳, 최근 1년 개업 2곳이다."
              sql: |
                -- :lat=37.4979, :lng=127.0276, :category='pharmacy', :min_cnt=5, :n=10
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       active_cnt, opened_last_365d_active,
                       ROUND((grid_lat - :lat)*(grid_lat - :lat) + (grid_lng - :lng)*(grid_lng - :lng), 6) AS sq_deg_dist
                FROM d1_geo_grid_detail
                WHERE category = :category
                  AND active_cnt >= :min_cnt
                ORDER BY (grid_lat - :lat)*(grid_lat - :lat) + (grid_lng - :lng)*(grid_lng - :lng) ASC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_cnt: 5, n: 10 }
            - pattern_id: "category_specialization_grids"
              d1_table: d1_geo_grid_detail
              question_ko: "특정 업종(:category)의 상권 내 비중(특화도)이 가장 높은 격자는 어디인가? (전체 활성 :min_total 이상 격자만, 상위 :n개)"
              axes: "특화도 랭킹: 격자별 :category 비중 — densest_grids_dominant_category(절대량→지배 업종)의 관점 반전(상대 비중→전문화 상권). category_top_grids 의 절대 밀집과 달리 '그 동네가 그 업종 동네인가'를 봄"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "pharmacy 특화도 1위 격자는 (37.61, 126.93)으로 전체 활성 160건 중 약국이 27건, 특화 비중 16.9%다."
              sql: |
                -- :category='pharmacy', :min_total=50, :n=10
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       SUM(CASE WHEN category = :category THEN active_cnt ELSE 0 END) AS target_cnt,
                       SUM(active_cnt) AS total_active,
                       ROUND(100.0 * SUM(CASE WHEN category = :category THEN active_cnt ELSE 0 END) / SUM(active_cnt), 1) AS target_share_pct
                FROM d1_geo_grid_detail
                GROUP BY ROUND(grid_lat,3), ROUND(grid_lng,3)
                HAVING SUM(active_cnt) >= :min_total
                   AND SUM(CASE WHEN category = :category THEN active_cnt ELSE 0 END) > 0
                ORDER BY target_share_pct DESC, target_cnt DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { min_total: 50, n: 10 }
            - pattern_id: "grid_density_distribution"
              d1_table: d1_geo_grid_detail
              question_ko: "서울 상권 격자의 규모 분포는 어떤 모양인가? (:category 선택, 'ALL'=전 업종 — 밀도 5구간별 격자 수·비중)"
              axes: "분포: 격자 밀도 히스토그램(5구간 고정 밴드) — 기존 패턴이 모두 랭킹/단면인 데 반해 분포 형태(롱테일 정도)를 요약하는 신규 축"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "전 업종 기준 활성 10건 미만의 초소형 격자가 279개로 전체 셀의 14.8%를 차지하며 이들의 활성 합계는 1,076건에 그친다."
              sql: |
                -- :category='ALL'
                WITH g AS (
                  SELECT grid_lat, grid_lng, SUM(active_cnt) AS total_active
                  FROM d1_geo_grid_detail
                  WHERE (:category = 'ALL' OR category = :category)
                  GROUP BY grid_lat, grid_lng)
                SELECT CASE WHEN total_active < 10 THEN 'a_under_10'
                            WHEN total_active < 50 THEN 'b_10_49'
                            WHEN total_active < 200 THEN 'c_50_199'
                            WHEN total_active < 1000 THEN 'd_200_999'
                            ELSE 'e_1000_plus' END AS density_band,
                       COUNT(*) AS grid_cells,
                       SUM(total_active) AS active_total,
                       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS cell_share_pct
                FROM g
                GROUP BY density_band
                ORDER BY density_band
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { category: "ALL" }
            - pattern_id: "two_area_category_mix_compare"
              d1_table: d1_geo_grid_detail
              question_ko: "두 지역(bbox A: :a_min_lat~:a_max_lat × :a_min_lng~:a_max_lng vs bbox B: :b_min_lat~:b_max_lat × :b_min_lng~:b_max_lng)의 업종 구성은 어떻게 다른가? (예: 강남 vs 홍대)"
              axes: "교차 비교: 두 bbox × category 조건부 집계 — 단일 영역 구성(point_area_category_mix)의 2영역 나란히 확장. 상권 A/B 비교라는 새 질문 형태"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "강남(A) vs 홍대(B) 비교에서 industry가 양쪽 모두 최대 업종으로 A 16,032건, B 15,174건이다."
              sql: |
                -- :a_min_lat=37.49, :a_max_lat=37.51, :a_min_lng=127.02, :a_max_lng=127.05, :b_min_lat=37.55, :b_max_lat=37.57, :b_min_lng=126.91, :b_max_lng=126.94
                SELECT category,
                       SUM(CASE WHEN grid_lat BETWEEN :a_min_lat AND :a_max_lat
                                 AND grid_lng BETWEEN :a_min_lng AND :a_max_lng THEN active_cnt ELSE 0 END) AS area_a_cnt,
                       SUM(CASE WHEN grid_lat BETWEEN :b_min_lat AND :b_max_lat
                                 AND grid_lng BETWEEN :b_min_lng AND :b_max_lng THEN active_cnt ELSE 0 END) AS area_b_cnt
                FROM d1_geo_grid_detail
                WHERE (grid_lat BETWEEN :a_min_lat AND :a_max_lat AND grid_lng BETWEEN :a_min_lng AND :a_max_lng)
                   OR (grid_lat BETWEEN :b_min_lat AND :b_max_lat AND grid_lng BETWEEN :b_min_lng AND :b_max_lng)
                GROUP BY category
                ORDER BY area_a_cnt + area_b_cnt DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "grid_rank_of_point"
              d1_table: d1_geo_grid_detail
              question_ko: "특정 좌표(:lat, :lng)가 속한 격자의 상권 규모는 서울 전체 격자 중 몇 위, 상위 몇 %인가?"
              axes: "단면+백분위: 좌표→해당 격자의 전역 순위/상위% — 기존 랭킹 패턴은 top-N 진입 격자만 노출하고 개별 격자의 위상(내 동네는 몇 위인가)은 미커버"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "강남역 좌표가 속한 격자 (37.5, 127.03)은 총 활성 733건으로 전체 1,886개 격자 중 106위, 상위 5.6%다."
              sql: |
                -- :lat=37.4979, :lng=127.0276
                WITH g AS (
                  SELECT grid_lat, grid_lng, SUM(active_cnt) AS total_active, SUM(opened_last_365d_active) AS opened_1y
                  FROM d1_geo_grid_detail
                  GROUP BY grid_lat, grid_lng),
                r AS (
                  SELECT grid_lat, grid_lng, total_active, opened_1y,
                         RANK() OVER (ORDER BY total_active DESC) AS density_rank,
                         COUNT(*) OVER () AS total_grids
                  FROM g)
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       total_active, opened_1y, density_rank, total_grids,
                       ROUND(100.0 * density_rank / total_grids, 1) AS top_pct
                FROM r
                WHERE grid_lat BETWEEN :lat - 0.0025 AND :lat + 0.0025
                  AND grid_lng BETWEEN :lng - 0.0025 AND :lng + 0.0025
                ORDER BY total_active DESC
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
            - pattern_id: "category_cooccurrence_grids"
              d1_table: d1_geo_grid_detail
              question_ko: "두 업종(:cat_a, :cat_b)이 함께 밀집한 격자는 어디인가? (각 업종 활성 :min_each 이상, 약한 쪽 기준 상위 :n개 — 동반 상권 탐색)"
              axes: "교차(업종 쌍): 두 업종 AND 동반 밀집 격자 — 단일 업종 밀집(category_top_grids)·격자 다양성(new_grid_diversity)이 못 답하는 특정 업종 조합의 공존 지역"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "culture와 health_medical이 가장 균형 있게 동반 밀집한 격자는 (37.5, 127.025)로 각각 328건, 342건이다."
              sql: |
                -- :cat_a='culture', :cat_b='health_medical', :min_each=10, :n=10
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       SUM(CASE WHEN category = :cat_a THEN active_cnt ELSE 0 END) AS a_cnt,
                       SUM(CASE WHEN category = :cat_b THEN active_cnt ELSE 0 END) AS b_cnt
                FROM d1_geo_grid_detail
                WHERE category IN (:cat_a, :cat_b)
                GROUP BY ROUND(grid_lat,3), ROUND(grid_lng,3)
                HAVING SUM(CASE WHEN category = :cat_a THEN active_cnt ELSE 0 END) >= :min_each
                   AND SUM(CASE WHEN category = :cat_b THEN active_cnt ELSE 0 END) >= :min_each
                ORDER BY MIN(SUM(CASE WHEN category = :cat_a THEN active_cnt ELSE 0 END),
                             SUM(CASE WHEN category = :cat_b THEN active_cnt ELSE 0 END)) DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { min_each: 10, n: 10 }
            - pattern_id: "bbox_area_kpi_summary"
              d1_table: d1_geo_grid_detail
              question_ko: "지도 화면 영역(bbox :min_lat~:max_lat × :min_lng~:max_lng)의 상권 총괄 지표는? (:category='ALL'이면 전 업종, 특정 업종 지정 가능)"
              axes: "단면 KPI: bbox 총괄 1행 요약(격자 수·총 활성·신규 비중·업종 종수) — bbox_heatmap_slice(셀 목록 반환)의 집계 반전. 지도 화면 요약 카드용 canonical 질의"
              verified_rows: 1
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2b17740bf64f4f0282c34b936c31f121"
              insight_sample_ko: "홍대·연남 일대 bbox(37.54~37.57 × 126.91~126.94)는 격자 43개, 총 활성 24,846건, 최근 1년 신규 2,145건(비중 8.6%), 업종 6종이다."
              sql: |
                -- :min_lat=37.54, :max_lat=37.57, :min_lng=126.91, :max_lng=126.94, :category='ALL'
                SELECT COUNT(DISTINCT CAST(grid_lat AS TEXT) || ',' || CAST(grid_lng AS TEXT)) AS grid_cells,
                       SUM(active_cnt) AS total_active,
                       SUM(opened_last_365d_active) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d_active) / SUM(active_cnt), 1) AS new_open_share_pct,
                       COUNT(DISTINCT category) AS category_kinds
                FROM d1_geo_grid_detail
                WHERE grid_lat BETWEEN :min_lat AND :max_lat
                  AND grid_lng BETWEEN :min_lng AND :max_lng
                  AND (:category = 'ALL' OR category = :category)
              requires: [select_columns, aggregate, filter_range]
              param_defaults: { min_lat: 37.54, max_lat: 37.57, min_lng: 126.91, max_lng: 126.94, category: "ALL" }
            - pattern_id: "grid_rank_metric_switch"
              d1_table: d1_geo_grid_overview
              question_ko: "격자 랭킹을 지표(:metric ∈ active/opened/new_ratio)·방향(:dir ∈ asc/desc)·대분류(:major, 'ALL'=전체)·최소규모(:min_active)로 바꿔가며 뽑으면? (기존 고정 랭킹 패턴들의 일반화)"
              axes: "grid→랭킹, 지표·방향·대분류 스위치 — hotspot_top_grids/major_top_grids/rising·stagnant_grids_new_ratio 의 파라미터 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "전 업종 신규율 1위 격자는 (37.5, 127.065)로 활성 510개 중 최근 1년 개업이 284개, 신규율 0.557에 달한다."
              sql: |
                -- :major='ALL', :metric='new_ratio', :dir='desc', :min_active=100, :n=10
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL)/SUM(active_cnt),3) AS new_ratio
                FROM d1_geo_grid_overview
                WHERE (:major='ALL' OR major=:major)
                GROUP BY grid_lat, grid_lng
                HAVING SUM(active_cnt) >= :min_active
                ORDER BY
                  CASE WHEN :dir='asc' THEN
                    CASE :metric WHEN 'active' THEN SUM(active_cnt)
                                 WHEN 'opened' THEN SUM(opened_last_365d_active)
                                 ELSE CAST(SUM(opened_last_365d_active) AS REAL)/SUM(active_cnt) END
                  END ASC,
                  CASE WHEN :dir='desc' THEN
                    CASE :metric WHEN 'active' THEN SUM(active_cnt)
                                 WHEN 'opened' THEN SUM(opened_last_365d_active)
                                 ELSE CAST(SUM(opened_last_365d_active) AS REAL)/SUM(active_cnt) END
                  END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { major: "ALL", min_active: 100, dir: "desc", n: 10 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "radius_top_grids"
              d1_table: d1_geo_grid_overview
              question_ko: "지정 좌표(:lat,:lng) 주변 반경(:r, 도 단위) 안에서 업소가 가장 밀집한 격자는 어디인가? (내 위치 주변 상권 탐색)"
              axes: "point+반경 창→grid 랭킹 — point_major_mix(고정 반셀 허용오차·구성)와 달리 반경이 파라미터고 출력이 격자 랭킹"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "강남역(37.5, 127.025) 반경 0.01도 안에서는 (37.495, 127.03) 격자가 활성 4,199개(최근 1년 개업 391개)로 가장 밀집해 있다."
              sql: |
                -- :lat=37.5, :lng=127.025, :r=0.01, :n=10
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d
                FROM d1_geo_grid_overview
                WHERE ABS(grid_lat - :lat) <= :r
                  AND ABS(grid_lng - :lng) <= :r
                GROUP BY grid_lat, grid_lng
                ORDER BY active_total DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "two_zone_compare"
              d1_table: d1_geo_grid_overview
              question_ko: "두 상권(A: :lat_a,:lng_a / B: :lat_b,:lng_b, 반경 :r)의 규모·신규율을 나란히 비교하면? (예: 강남역 vs 홍대)"
              axes: "두 공간 창 교차 → zone 단면 비교 — 단일 지점/랭킹 패턴들이 못 주는 A/B 병렬 비교"
              verified_rows: 2
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "강남역 반경 0.01도 구역(A)은 격자 20개에 활성 22,729개·신규율 0.091로, 같은 반경의 홍대 구역과 한 번의 호출로 비교된다."
              sql: |
                -- :lat_a=37.5, :lng_a=127.025, :lat_b=37.555, :lng_b=126.925, :r=0.01
                SELECT CASE WHEN ABS(grid_lat - :lat_a) <= :r AND ABS(grid_lng - :lng_a) <= :r THEN 'A' ELSE 'B' END AS zone,
                       COUNT(DISTINCT grid_lat || ',' || grid_lng) AS grid_cells,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL)/SUM(active_cnt),3) AS new_ratio
                FROM d1_geo_grid_overview
                WHERE (ABS(grid_lat - :lat_a) <= :r AND ABS(grid_lng - :lng_a) <= :r)
                   OR (ABS(grid_lat - :lat_b) <= :r AND ABS(grid_lng - :lng_b) <= :r)
                GROUP BY zone
                ORDER BY zone
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "major_share_specialized_grids"
              d1_table: d1_geo_grid_overview
              question_ko: "특정 대분류(:major)가 상권 구성의 :min_share 이상을 차지하는 '특화 격자'는 어디인가? (규모 :min_total 이상만)"
              axes: "grid→대분류 점유율(비율) 랭킹 — 절대량 랭킹(major_top_grids)과 달리 '그 격자 안에서의 비중'으로 특화지역을 찾음"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "(37.535, 126.88) 격자는 활성 150개가 전부 culture 업종(점유율 1.0)인 문화 특화 상권이다."
              sql: |
                -- :major='culture', :min_share=0.3, :min_total=100, :n=10
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS total_active,
                       SUM(CASE WHEN major = :major THEN active_cnt ELSE 0 END) AS major_active,
                       ROUND(CAST(SUM(CASE WHEN major = :major THEN active_cnt ELSE 0 END) AS REAL)/SUM(active_cnt),3) AS major_share
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                HAVING SUM(active_cnt) >= :min_total
                   AND CAST(SUM(CASE WHEN major = :major THEN active_cnt ELSE 0 END) AS REAL)/SUM(active_cnt) >= :min_share
                ORDER BY major_share DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { min_total: 100, min_share: 0.3, n: 10 }
            - pattern_id: "major_pair_ratio_grids"
              d1_table: d1_geo_grid_overview
              question_ko: "대분류 A(:major_a)가 B(:major_b)보다 상대적으로 발달한 격자는 어디인가? (B 최소 :min_b 이상인 격자에서 A/B 비율 상위)"
              axes: "grid→두 대분류 비율(A/B) 랭킹 — 단일 대분류 절대량/점유율 패턴이 못 주는 업종 간 상대 지형"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "health 50개 이상인 격자 중 (37.575, 126.89)는 culture 270개 대 health 90개로 문화가 3.0배 우위다."
              sql: |
                -- :major_a='culture', :major_b='health', :min_b=50, :n=10
                SELECT grid_lat, grid_lng,
                       SUM(CASE WHEN major = :major_a THEN active_cnt ELSE 0 END) AS a_active,
                       SUM(CASE WHEN major = :major_b THEN active_cnt ELSE 0 END) AS b_active,
                       ROUND(CAST(SUM(CASE WHEN major = :major_a THEN active_cnt ELSE 0 END) AS REAL)
                             / SUM(CASE WHEN major = :major_b THEN active_cnt ELSE 0 END), 2) AS a_per_b
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                HAVING SUM(CASE WHEN major = :major_b THEN active_cnt ELSE 0 END) >= :min_b
                ORDER BY a_per_b DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
              param_defaults: { min_b: 50, n: 10 }
            - pattern_id: "bbox_major_mix_summary"
              d1_table: d1_geo_grid_overview
              question_ko: "지도 화면(bbox) 안 상권의 대분류 구성은? (뷰포트 전체를 업종별로 집계한 요약 패널)"
              axes: "공간 bbox→major 구성 단면 — bbox_viewport_heatmap(격자별 행, 단일 대분류)과 달리 화면 전체를 대분류 4행으로 요약"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "홍대·연남 일대 bbox에서는 industry가 격자 24개·활성 10,523개(신규율 0.088)로 구성 1위다."
              sql: |
                -- :min_lat=37.54, :max_lat=37.57, :min_lng=126.91, :max_lng=126.94
                SELECT major,
                       COUNT(*) AS grid_cells,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL)/SUM(active_cnt),3) AS new_ratio
                FROM d1_geo_grid_overview
                WHERE grid_lat BETWEEN :min_lat AND :max_lat
                  AND grid_lng BETWEEN :min_lng AND :max_lng
                GROUP BY major
                ORDER BY active_total DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { min_lat: 37.54, max_lat: 37.57, min_lng: 126.91, max_lng: 126.94 }
            - pattern_id: "density_histogram"
              d1_table: d1_geo_grid_overview
              question_ko: "격자 밀집도는 어떤 분포인가? (:bw 단위 구간별 격자 수 히스토그램, :major='ALL' 또는 특정 대분류)"
              axes: "grid 밀집도→분포(히스토그램) — 랭킹·집중도 스칼라(top1pct_concentration)가 못 주는 전체 분포 형상"
              verified_rows: 21
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "전 업종 기준 200개 폭 히스토그램에서 최빈 구간은 0~199개로, 격자 1,266개(활성 합계 71,093개)가 몰린 롱테일 분포다."
              sql: |
                -- :major='ALL', :bw=200
                WITH g AS (
                  SELECT SUM(active_cnt) AS a
                  FROM d1_geo_grid_overview
                  WHERE (:major='ALL' OR major=:major)
                  GROUP BY grid_lat, grid_lng
                )
                SELECT CAST(a/:bw AS INTEGER)*:bw AS bin_start,
                       CAST(a/:bw AS INTEGER)*:bw + :bw - 1 AS bin_end,
                       COUNT(*) AS grid_cells,
                       SUM(a) AS active_total
                FROM g
                GROUP BY CAST(a/:bw AS INTEGER)
                ORDER BY bin_start
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_defaults: { major: "ALL" }
            - pattern_id: "regrid_coarse_hotspots"
              d1_table: d1_geo_grid_overview
              question_ko: "셀 크기를 :cell(도 단위)로 키워 광역 단위로 보면 어디가 최대 밀집권인가? (지도 줌아웃용 재격자화)"
              axes: "grid→coarse cell 재집계 랭킹 — 500m 고정 해상도 패턴들과 달리 해상도 자체가 파라미터"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "53ee2ca57aa0484ba308ab8ba1e1b62a"
              insight_sample_ko: "0.02도(약 2km) 셀로 묶으면 (37.51, 127.03) 권역이 격자 16개·활성 20,583개로 서울 최대 밀집권이다."
              sql: |
