version: 2

# commerce gold 계약·테스트 (culture _culture_gold__models.yml 패턴 승계 — 레이어별 문서 분리).
# gold = 집계·지표·인사이트 전용(PROJECT.md §4). 정본 명단 = include/gold/report.py::AGG_TABLES(22).
# 계보(계승): 전 모델 → ref(silver_license_entity)[+ ref(commerce_dataset_taxonomy) 시드] 또는
#   source(commerce_silver_details, silver_*_detail) → bronze_localdata_license → LOCALDATA 152 API.
# 크로스도메인(culture): models/exposures.yml 의 cross_domain_activity_join 참조(행정동/gu × 기간 공통축).
# 공통 차원 규약: gu_code/admin_dong_code/legal_code 결측 = 'UNK'(문자열). major=health/culture/industry/environment.
# 날짜 문자열 ISO(사전순=날짜순). 서빙 tier·의도: docs/DB/gold/serving-design.md.

models:
  # ═══ 화면 1: 상권 흐름(market-flow) ═══
  - name: gold_license_flow_daily
    description: 개업/폐업 흐름 일 grain × 업종3단 × 지역3축 — '언제·어디서·무슨 업종이 생기고 닫혔나' 추이 정본. 완결일만(당일 제외). 소급 신고가 건드린 날은 다음 증분이 그 날만 재계산해 교체(#603, src_collected_at 워터마크).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478) — D1 미게시 제품(iceberg_api 직조회). 필수 필드는 형식 충족, 게시는 enabled=false 로 제외
          enabled: false              # D1 게시 안 함 — 원장 약 290만행(§1.1)
          external: false             # enabled=false 제품은 external 불가(#478 모순 규칙)
          serving_tier: iceberg_api   # D1 금지(원장 약 290만행) — Iceberg(Trino) 직조회 서빙(§1.1)
          product_id: commerce_flow_daily   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 서울 인허가 개·폐업 흐름(일별)
            summary: 서울시 인허가 자료에서 매일 몇 곳이 새로 열고 닫았는지를 업종 3단계와 자치구·행정동 축으로 집계했습니다.
            caveat: 완결된 날짜만 담아 당일 자료는 빠지고, 소급 신고가 들어온 날은 다음 수집에서 다시 계산됩니다.
            use_cases:
              - 일 단위 상권 모니터링
              - 개·폐업 급증 구간 탐지
              - 월·연 집계의 원장 대조
          contract_version: v1
          product_question: 개·폐업 흐름 추이(일)
          grain: 일×이벤트×업종×지역3축
          primary_key: [event_date, event_type, dataset, gu_code, admin_dong_code, legal_code]
          publication_mode: snapshot        # 형식 필수(미게시 — D1 승격 시 재정의)
          zero_policy: retain_last_good     # 형식 필수(미게시)
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: event
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [event_date, event_type, dataset, gu_code, admin_dong_code, legal_code]
    columns:
      - name: event_date
        data_type: date
        description: 이벤트 발생일(개업 apvpermymd/폐업 dcbymd) — date 타입. 완결일만(당일 제외), 무효일자 제외.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: 이벤트 유형 — opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(=LOCALDATA API 단위, 152종). 한글명은 registry name_ko.
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리(법정동코드 앞 5자리). 결측 'UNK'(이벤트 가중 약 0.6%).
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(마스킹 주소 등 — 비율은 시점에 따라 변해 품질 실측으로 관측. 동 축 절대량 비교는 부적합).
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'(비율은 품질 실측으로 관측).
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류 — health/culture/industry/environment(taxonomy 시드).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['health', 'culture', 'industry', 'environment']
      - name: category
        data_type: varchar
        description: 중분류(taxonomy 시드 category).
      - name: cnt
        data_type: bigint
        description: 해당 grain 개업/폐업 건수.
        tests: [not_null]
      - name: src_collected_at
        data_type: timestamp(6)
        description: >-
          이 행을 만든 빌드가 반영한 원천 수집 시각.
          다음 갱신은 이 시각 이후 바뀐 기간만 다시 계산해 바꿔 넣습니다.
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_flow_monthly
    description: 개업/폐업 흐름 월 grain × 업종3단 × 지역3축 — 월별 상권 증감 추이(화면 기본 해상도). 완결월만(당월 제외). 소급 신고가 건드린 달은 다음 증분이 그 달만 재계산해 교체(#603, src_collected_at 워터마크).
