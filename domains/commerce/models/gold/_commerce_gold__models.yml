              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "대분류별 1위 격자: 산업=가산(37.485,126.895) 2,960 · 문화=을지로(37.565,126.995) 1,415 · 보건=마곡(37.560,126.83) 1,376(신규 206으로 유입도 최상위) · 환경=(37.570,126.995) 145."
              sql: |
                -- :k = 1  (대분류별 상위 k개 격자)
                SELECT major, grid_lat, grid_lng, active_cnt, opened_last_365d_active
                FROM (
                  SELECT major, grid_lat, grid_lng, active_cnt, opened_last_365d_active,
                         ROW_NUMBER() OVER (PARTITION BY major ORDER BY active_cnt DESC) AS rn
                  FROM d1_geo_grid_overview
                )
                WHERE rn <= :k
                ORDER BY active_cnt DESC
              requires: [select_columns, sort, window, filter_range]
