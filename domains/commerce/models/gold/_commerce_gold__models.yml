    config:
      contract: {enforced: true}
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류.
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(grain — API 단위).
        tests: [not_null]
      - name: total_rows
        data_type: bigint
        description: 해당 API 전체 업소 수(커버리지 분모).
      - name: active_rows
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: phone_coverage
        data_type: decimal(38,18)
        description: 전화번호 보유율(0~1).
      - name: geo_coverage
        data_type: decimal(38,18)
        description: 좌표(위경도) 보유율.
      - name: admin_dong_coverage
        data_type: decimal(38,18)
        description: 행정동 매핑 성공률.
      - name: address_coverage
        data_type: decimal(38,18)
        description: 주소 보유율.
      - name: close_date_coverage_of_closed
        data_type: decimal(38,18)
        description: 폐업 업소 중 폐업일(dcbymd) 보유율 — 폐업행 0인 API 는 null(해당없음).
      - name: name_coverage
        data_type: decimal(38,18)
        description: 상호명 보유율.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_env_facility_operation
    description: 우리 구 배출시설 가동 — 환경 배출시설(대기/수질) 자치구별 연간 가동일수·가동시간. 영업시간 필드는 LOCALDATA 원천 부재(수질 가동필드 결측 큼).
    config:
      contract: {enforced: true}
    columns:
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(air_pollution_facility/water_pollution_facility).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: facility_rows
        data_type: bigint
        description: 배출시설 업소(영업 01) 수.
      - name: with_operating_days
        data_type: bigint
        description: 가동일수 필드 보유 업소 수(수질은 약 0 — 원천 결측).
      - name: avg_operating_days_per_year
        data_type: double
        description: 연평균 가동일수.
      - name: p50_operating_days
        data_type: double
        description: 중앙값 가동일수(approx_percentile).
      - name: with_operating_hours
        data_type: bigint
        description: 가동시간 필드 보유 업소 수.
      - name: avg_operating_hours
        data_type: double
        description: 평균 가동시간.
      - name: p50_operating_hours
        data_type: double
        description: 중앙값 가동시간(approx_percentile).
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
