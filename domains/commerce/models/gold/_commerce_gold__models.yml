              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "폐업은 12월 58,887건으로 연중 최다 — 개업 피크(1월)와 정반대로 연말에 몰린다."
              sql: |
                -- :ym_from='2021-07', :ym_to='2026-06'
