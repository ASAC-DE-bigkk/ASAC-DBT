    config:
      contract: {enforced: true}
    columns:
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리(grain — 동당 1행).
        tests: [not_null, unique]
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글).
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: business_count
        data_type: bigint
        description: 누적 업소 수(폐업 포함 — active_cnt 와 혼용 금지).
