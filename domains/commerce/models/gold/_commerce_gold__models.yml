            - pattern_id: "grid-major-crosstab"
              d1_table: d1_geo_grid_overview
              question_ko: "밀집 상위 격자의 업종(대분류) 구성은 어떻게 다른가? (격자×대분류 교차)"
              axes: "grid × major 두 축 교차(피벗) — 행=격자, 열=대분류"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "밀집 1~2위 격자는 모두 산업이 정확히 2,960곳으로 동률(가산 66%, 선릉~삼성 66%) — 서울 최상위 상권은 산업(판매·통신판매 등) 대분류가 절반 이상을 차지한다."
              sql: |
                -- 상위 격자 N개를 대분류 피벗으로 — LIMIT 조정
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(CASE WHEN major='health' THEN active_cnt ELSE 0 END) AS health_cnt,
                       SUM(CASE WHEN major='industry' THEN active_cnt ELSE 0 END) AS industry_cnt,
                       SUM(CASE WHEN major='culture' THEN active_cnt ELSE 0 END) AS culture_cnt,
                       SUM(CASE WHEN major='environment' THEN active_cnt ELSE 0 END) AS environment_cnt
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                ORDER BY active_total DESC
                LIMIT 5
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "top1pct-concentration"
              d1_table: d1_geo_grid_overview
              question_ko: "서울 상권은 얼마나 소수 격자에 집중돼 있나? (상위 1% 셀 점유율)"
              axes: "grid 랭킹 → 전체 대비 비중(집중도) 스칼라 — 절대↔비중 관점 전환"
              verified_rows: 1
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "전체 2,277개 격자 중 상위 23개(1%)가 서울 영업업소 833,685곳의 8.3%(69,573곳)를 점유 — 상권 집중도가 뚜렷하다."
              sql: |
                -- :top_n = 23  (전체 2,277셀의 약 1%)
                WITH g AS (
                  SELECT grid_lat, grid_lng, SUM(active_cnt) AS a
                  FROM d1_geo_grid_overview GROUP BY grid_lat, grid_lng
                )
                SELECT (SELECT COUNT(*) FROM g) AS total_grids,
                       (SELECT SUM(a) FROM g) AS citywide_active,
                       (SELECT SUM(a) FROM (SELECT a FROM g ORDER BY a DESC LIMIT :top_n)) AS top_active,
                       ROUND(CAST((SELECT SUM(a) FROM (SELECT a FROM g ORDER BY a DESC LIMIT :top_n)) AS REAL)
                             / (SELECT SUM(a) FROM g), 3) AS top_share
              requires: [select_columns, sort, aggregate, group_by, subquery]
            - pattern_id: "per-major-argmax-grid"
              d1_table: d1_geo_grid_overview
              question_ko: "대분류마다 최대 밀집 격자(1위 상권)는 각각 어디인가?"
              axes: "major별 그룹 내 grid argmax(윈도우) — 4개 대분류를 한 번에 비교"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "대분류별 1위 격자: 산업=가산(37.485,126.895) 2,960 · 문화=을지로(37.565,126.995) 1,415 · 보건=마곡(37.560,126.83) 1,376(신규 206으로 유입도 최상위) · 환경=(37.570,126.995) 145."
              sql: |
                -- :k = 1  (대분류별 상위 k개 격자)
                SELECT major, grid_lat, grid_lng, active_cnt, opened_last_365d_active
                FROM (
                  SELECT major, grid_lat, grid_lng, active_cnt, opened_last_365d_active,
                         ROW_NUMBER() OVER (PARTITION BY major ORDER BY active_cnt DESC) AS rn
                  FROM d1_geo_grid_overview
                )
                WHERE rn <= :k
                ORDER BY active_cnt DESC
              requires: [select_columns, sort, window, filter_range]
            - pattern_id: "category-top-grids"
