  - name: gold_license_churn_yearly
    description: 상권 역동성 — 연도별 개업/폐업/순증·교체율·신생비 × 업종 × 자치구. 순증형 vs 교체형 진단(최근 20개 완결연).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_churn_yearly
          d1_rollup: (y,major,category,gu_code) 집계 후 비율 재산출(churn/birth_rate — 합산 불가) — dataset 드롭
          event_time: y                       # 시간축(#478 v1) — _catalog.time_axis/freshness(타 도메인 동형)
          freshness_slo_minutes: 1051200   # 730일(2년). 완결연 grain: y='YYYY' 를 연초로 파싱하면 최신 이벤트연이 최대 약 730일 전. 게시 지연 감시는 publication_trigger.max_interval_minutes(26h) 담당
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "gu_churn_rank_topn"
              question_ko: "특정 연도에 교체율(폐업 회전)이 가장 높은 자치구 top-N은? (축반전 쌍 A-1: 연도 고정 → 자치구 랭킹)"
              axes: "gu_code(랭킹) × 전업종 합산 @ y 고정 — 비율은 SUM 재산출"
              verified_rows: 10
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 교체율 1위는 서대문구(11410) 0.1077로, 상위 10개 구 중 유일하게 순감(-80). 양천(0.0979)·강서(0.0974)가 뒤를 잇지만 이들은 순증 유지."
              sql: |
                -- :y='2025', :n=10
                SELECT gu_code, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly WHERE y = :y AND gu_code<>'UNK' GROUP BY gu_code ORDER BY churn_rate DESC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "gu_yearly_timeseries"
              question_ko: "특정 자치구의 20년 개업·폐업·교체율 추이는? (축반전 쌍 A-2: 자치구 고정 → 연도 시계열)"
              axes: "y(시계열) × 전업종 합산 @ gu_code 고정"
              verified_rows: 20
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "강남구(11680) 교체율은 2006년 0.1297에서 2025년 0.0725로 장기 하락. 2025년에도 순증 +3,857로 서울 최대 순증 유지."
              sql: |
                -- :gu_code='11680' (강남구)
                SELECT y, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly WHERE gu_code = :gu_code GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_rank_in_gu"
              question_ko: "특정 자치구 안에서 어느 업종이 가장 고회전인가? (축반전 쌍 B-1: 구 고정 → 업종 랭킹)"
              axes: "category(랭킹) @ y·gu_code 고정 — 소형 스톡 노이즈 차단용 HAVING stock_start>=100"
              verified_rows: 11
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 강남구에서 food 교체율 0.1932(순감 -196)로 압도적 1위 — 2위 hygiene_beauty(0.099)의 2배. culture는 0.0345로 안정적 순증(+554)."
              sql: |
                -- :y='2025', :gu_code='11680'
                SELECT category, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate FROM d1_churn_yearly WHERE y = :y AND gu_code = :gu_code GROUP BY category HAVING SUM(stock_start)>=100 ORDER BY churn_rate DESC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "gu_rank_in_category"
              question_ko: "특정 업종에서 어느 자치구가 가장 고회전인가? (축반전 쌍 B-2: 업종 고정 → 구 랭킹)"
              axes: "gu_code(랭킹) @ y·category 고정 — (y,category,gu_code)가 유일키라 GROUP BY 불필요, 행 그대로 사용"
              verified_rows: 10
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 음식점(food) 교체율 1위는 양천구(11470) 0.2575 — 서울 어디서나 4곳 중 1곳이 1년 새 회전. 상위 10개 구 전부 순감(net_change 음수)."
              sql: |
                -- :y='2025', :category='food', :n=10
                SELECT gu_code, opened, closed, net_change, stock_start, ROUND(churn_rate,4) AS churn_rate, ROUND(birth_rate,4) AS birth_rate FROM d1_churn_yearly WHERE y = :y AND category = :category AND gu_code<>'UNK' AND stock_start>=100 ORDER BY churn_rate DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "seoul_macro_timeseries"
              question_ko: "서울 전체의 연도별 창업·폐업 체력 변화는? (시계열 매크로)"
              axes: "y(시계열) × 서울 전체 합산 — 필터 없음"
              verified_rows: 20
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "서울 신생비는 2006년 0.1564에서 2025년 0.0958로 20년간 지속 하락 — 진입 활력 둔화. 순증은 2024년 17,141로 급감했다가 2025년 18,522로 소폭 반등."
              sql: |
                SELECT y, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_gu_cross_hotcells"
              question_ko: "특정 연도에 업종×자치구 교차 셀 중 교체율이 가장 높은 핫셀은? (두 축 교차)"
              axes: "category × gu_code 교차 셀(랭킹) @ y 고정 — stock_start>=200으로 유의 셀만"
              verified_rows: 15
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 교체율 상위 15개 셀이 전부 food — 최고는 food×양천(0.2575), food×강서(0.2162). 고회전 문제는 사실상 음식점업 단일 이슈."
              sql: |
                -- :y='2025', :n=15
                SELECT category, gu_code, opened, closed, stock_start, ROUND(churn_rate,4) AS churn_rate FROM d1_churn_yearly WHERE y = :y AND gu_code<>'UNK' AND stock_start>=200 ORDER BY churn_rate DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
              param_defaults: { n: 15 }
            - pattern_id: "slice_gu_category_series"
              question_ko: "특정 자치구×업종 한 단면의 20년 원장(개업·폐업·비율)은? (:param 단면 — 행 그대로)"
              axes: "y(시계열) @ gu_code·category 고정 — 테이블 그레인 그대로, 집계 불필요"
              verified_rows: 20
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "마포구 food는 2024년 교체율 0.2157로 20년 최고치, 순감 -759. 2025년에도 0.1931·-471로 수축 지속 — 2023년(+285)에서 추세 반전."
              sql: |
                -- :gu_code='11440' (마포구), :category='food'
                SELECT y, opened, closed, net_change, stock_start, ROUND(churn_rate,4) AS churn_rate, ROUND(birth_rate,4) AS birth_rate FROM d1_churn_yearly WHERE gu_code = :gu_code AND category = :category ORDER BY y
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_yoy_momentum"
              question_ko: "최근 연도에 개업이 급증/급감한 업종은? (전년 대비 모멘텀, 윈도우 함수)"
              axes: "category(랭킹) × YoY 증감률 @ y 고정 — LAG 윈도우로 전년 결합"
              verified_rows: 11
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 개업 모멘텀 1위는 lodging +63.9%(72→118건). 반면 environment -30.6%, health_medical -20.2%(4,690→3,744)로 급랭."
              sql: |
                -- :y='2025'
                WITH s AS (SELECT y, category, SUM(opened) AS op FROM d1_churn_yearly GROUP BY y, category), d AS (SELECT y, category, op, LAG(op) OVER (PARTITION BY category ORDER BY y) AS prev_op FROM s) SELECT category, op AS opened_cur, prev_op AS opened_prev, op-prev_op AS diff, ROUND(100.0*(op-prev_op)/prev_op,1) AS pct FROM d WHERE y = :y AND prev_op>0 ORDER BY pct DESC
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
            - pattern_id: "gu_regime_diagnosis"
              question_ko: "각 자치구는 순증형 성장인가, 고회전 소모전인가? (순증×교체율 4분면 진단 — 모델 설계 취지)"
              axes: "gu_code × (net_change, churn_rate) 2지표 4분면 @ y 고정 — 임계값은 그 해 서울 평균 교체율(서브쿼리)"
              verified_rows: 25
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 25개 구 중 강남(+3,857)·서초(+1,923)는 낮은 교체율의 growth_stable, 서대문은 유일 순감+최고 교체율(0.1077)의 shrink_high_turnover — 같은 '활발함'도 체질이 다름."
              sql: |
                -- :y='2025' — 서브쿼리(서울 평균 임계값) 안 y 도 같은 :y 로 바인딩
                SELECT gu_code, SUM(net_change) AS net_change, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, CASE WHEN SUM(net_change)>=0 AND 1.0*SUM(closed)/SUM(stock_start) >= (SELECT 1.0*SUM(closed)/SUM(stock_start) FROM d1_churn_yearly WHERE y = :y) THEN 'growth_high_turnover' WHEN SUM(net_change)>=0 THEN 'growth_stable' WHEN 1.0*SUM(closed)/SUM(stock_start) >= (SELECT 1.0*SUM(closed)/SUM(stock_start) FROM d1_churn_yearly WHERE y = :y) THEN 'shrink_high_turnover' ELSE 'shrink_stable' END AS regime FROM d1_churn_yearly WHERE y = :y AND gu_code<>'UNK' GROUP BY gu_code ORDER BY net_change DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "inv_lowest_churn_gu"
              question_ko: "폐업률이 가장 낮은(안정적인) 자치구는? (높은 폐업률 랭킹의 반전)"
              axes: "자치구 랭킹 — churn_rate ASC"
              verified_rows: 10
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2024년 폐업률 최저는 중구(11140) 6.44% — 재고 54,351곳 대비 3,499곳 폐업."
              sql: |
                -- :y='2024', :n=10
                SELECT gu_code, SUM(stock_start) AS stock, SUM(closed) AS closed,
                       ROUND(100.0*SUM(closed)/NULLIF(SUM(stock_start),0),2) AS churn_pct
                FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK'
                GROUP BY gu_code HAVING SUM(stock_start) > 1000
                ORDER BY churn_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "inv_birth_rate_top"
              question_ko: "신규 진입률(birth rate)이 가장 높은 업종은? (폐업률 관점의 반전)"
              axes: "업종 랭킹 — birth_rate 관점(churn 관점의 반전)"
              verified_rows: 11
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2024년 신규 진입률 1위는 식품 16.17%(재고 242,351 대비 개업 39,192)."
              sql: |
                -- :y='2024'
                SELECT category, SUM(opened) AS opened, SUM(stock_start) AS stock,
                       ROUND(100.0*SUM(opened)/NULLIF(SUM(stock_start),0),2) AS birth_pct
                FROM d1_churn_yearly WHERE y = :y
                GROUP BY category HAVING SUM(stock_start) > 500
                ORDER BY birth_pct DESC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "new_year_fixed_net_asc"
              question_ko: "특정 연도에 순감이 가장 심했던 업종×구 조합은?"
              axes: "연도 고정(:y) → 업종×구 교차 랭킹 net ASC"
              verified_rows: 10
              verified_at: "2026-08-07T16:14:15Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2024년 최악 조합은 강서구(11500) 식품 -1,034곳(개업 1,933 vs 폐업 2,967)."
              sql: |
                -- :y='2024', :n=10
                SELECT gu_code, category, opened, closed, net_change
                FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK'
                ORDER BY net_change ASC LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { n: 10 }
            - pattern_id: "x_gu_churn_vs_lq"
              question_ko: "특정 연도·업종에서 자치구별 폐업 회전율과 업종 특화도(LQ)를 함께 보면? — 특화가 방어력이 되는 구 vs 특화 없이 고회전인 구 진단"
              axes: "gu_code 랭킹(churn_rate DESC) @ y·category 고정 — churn(y×category×gu 원장) ⋈ spec(gu×category 현재 스냅샷), 조인 키 gu_code+category, 1:1(양쪽 모두 해당 그레인 유일키)이라 팬아웃 없음. 부수 효과: churn 단일 테이블이 못 주던 자치구 한글명(s.gu)도 함께 반환"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 food 폐업률 1위 양천구는 폐업률 25.75%·순감 -182인데 LQ는 0.951로 특화 없는 구다 — 고회전이 특화와 무관하게 도는 소모전 상권임이 한 행에서 드러난다."
              sql: |
                -- :y='2025', :category='food', :n=25
                SELECT c.gu_code, s.gu, s.lq, ROUND(s.share_in_gu*100,2) AS share_pct,
                       c.stock_start, c.opened, c.closed, c.net_change,
                       ROUND(c.churn_rate,4) AS churn_rate, ROUND(c.birth_rate,4) AS birth_rate
                FROM d1_churn_yearly c
                JOIN d1_gu_specialization s ON s.gu_code = c.gu_code AND s.category = c.category
                WHERE c.y = :y AND c.category = :category AND c.gu_code <> 'UNK'
                ORDER BY c.churn_rate DESC
                LIMIT :n
              requires: [select_columns, sort, join, filter_range]
              param_defaults: { n: 25 }
            - pattern_id: "x_gu_churn_vs_lifespan"
              question_ko: "특정 연도(:y)에 폐업 회전율이 높은 자치구는 역대 폐업 업소의 수명 체질도 취약한가 — 그 해 회전율(churn)과 누적 수명 프로필(평균 수명·조기폐업률)의 자치구 결합 진단"
              axes: "자치구 랭킹 — churn_yearly(:y 연도 단면, 전업종 합산) ⋈ lifespan(전 기간 누적, 전업종 가중 합산) on gu_code, 1:1"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2024년 폐업 회전율 1위는 서대문구(14.2%, 그 해 폐업 3,422건)다. 이 구의 역대 폐업 51,222건은 가중평균 2,095일을 버텼고 21.5%가 1년 안에 문을 닫았다 — 높은 회전율이 누적 조기폐업 체질과 같은 방향으로 겹치는 구간이다."
              sql: |
                -- :y='2024', :n=25
                WITH ch AS (
                  SELECT gu_code, SUM(closed) AS closed_y, SUM(stock_start) AS stock_start,
                         1.0*SUM(closed)/NULLIF(SUM(stock_start),0) AS churn_rate
                  FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK' GROUP BY gu_code
                ), lf AS (
                  SELECT gu_code, MAX(gu) AS gu, SUM(n_closed) AS n_closed,
                         ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w,
                         ROUND(100.0*SUM(closed_within_1y)/SUM(n_closed),1) AS early_close_pct
                  FROM d1_lifespan WHERE gu_code <> 'UNK' GROUP BY gu_code
                )
                SELECT c.gu_code, l.gu, ROUND(c.churn_rate*100,2) AS churn_pct, c.closed_y,
                       l.avg_days_w, l.early_close_pct, l.n_closed AS closed_alltime
                FROM ch c JOIN lf l ON l.gu_code = c.gu_code
                ORDER BY c.churn_rate DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range, subquery, join]
              param_defaults: { n: 25 }
            - pattern_id: "dim_value_timeseries"
              question_ko: "특정 업종(소분류) 또는 대분류의 서울 전체 20년 개업·폐업·폐업률 추이는? (:dim ∈ {category, major})"
              axes: "y(시계열) × 서울 전체 합산 @ :dim∈{category,major} 값(:val) 고정 — 기존 구 단위 시계열의 업종/대분류 축 대응물"
              verified_rows: 20
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "food 업종은 2006년 재고 194,994곳에서 개업 21,559·폐업 25,403으로 순감 -3,844, 폐업률 13.03%로 시계열이 시작된다."
              sql: |
                -- :dim='category', :val='food'
                SELECT y,
                       SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start,
                       ROUND(1.0*SUM(closed)/NULLIF(SUM(stock_start),0),4) AS churn_rate,
                       ROUND(1.0*SUM(opened)/NULLIF(SUM(stock_start),0),4) AS birth_rate
                FROM d1_churn_yearly
                WHERE (CASE :dim WHEN 'category' THEN category WHEN 'major' THEN major END) = :val
                GROUP BY y
                ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_enum: { dim: [category, major] }
            - pattern_id: "period_cum_net_rank"
              question_ko: "임의 기간(:from~:to) 동안 누적 순증이 가장 큰(또는 가장 심하게 순감한) 자치구/업종 top-N은? (:dim ∈ {gu, category}, :dir ∈ {asc, desc})"
              axes: "gu_code|category(랭킹) × 기간 누적 합산 @ :from~:to 창 — 단년 스냅샷 패턴들의 기간 창 상위호환"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2021~2025년 누적 순증 1위는 강남구(11680)로, 개업 72,382·폐업 46,205에 순증 +26,177(기간 폐업률 7.44%)이다."
              sql: |
                -- :from='2021', :to='2025', :dim='gu', :dir='desc', :n=10
                SELECT (CASE :dim WHEN 'gu' THEN gu_code WHEN 'category' THEN category END) AS dim_value,
                       SUM(opened) AS opened_total, SUM(closed) AS closed_total, SUM(net_change) AS net_change_total,
                       ROUND(1.0*SUM(closed)/NULLIF(SUM(stock_start),0),4) AS period_churn_rate
                FROM d1_churn_yearly
                WHERE y BETWEEN :from AND :to AND (:dim<>'gu' OR gu_code<>'UNK')
                GROUP BY dim_value
                ORDER BY CASE WHEN :dir='asc' THEN SUM(net_change) END ASC,
                         CASE WHEN :dir='desc' THEN SUM(net_change) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dim: [gu, category], dir: [asc, desc] }
            - pattern_id: "year_extreme_rank"
              question_ko: "임의 단면(서울 전체·특정 구·특정 업종·그 교차)에서 폐업률이 가장 높았던(또는 낮았던) 연도 top-N은? (:gu_code/:category 센티널 'ALL', :dir ∈ {asc, desc})"
              axes: "y(랭킹) @ 임의 단면 — gu_code·category 센티널 'ALL' 필터 + 정렬 방향 스위치, 시계열 패턴들의 '순위' 반전"
              verified_rows: 5
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "food 업종의 폐업률 최악 연도는 2024년으로, 재고 242,362곳 중 45,740곳이 폐업해 폐업률 18.87%·순감 -6,548을 기록했다."
              sql: |
                -- :gu_code='ALL', :category='food', :dir='desc', :n=5
                SELECT y,
                       SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start,
                       ROUND(1.0*SUM(closed)/NULLIF(SUM(stock_start),0),4) AS churn_rate
                FROM d1_churn_yearly
                WHERE (:gu_code = 'ALL' OR gu_code = :gu_code)
                  AND (:category = 'ALL' OR category = :category)
                GROUP BY y
                ORDER BY CASE WHEN :dir='asc' THEN 1.0*SUM(closed)/NULLIF(SUM(stock_start),0) END ASC,
                         CASE WHEN :dir='desc' THEN 1.0*SUM(closed)/NULLIF(SUM(stock_start),0) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { gu_code: "ALL", category: "ALL", dir: "desc", n: 5 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "two_year_churn_delta"
              question_ko: "두 연도(:y1 vs :y2) 사이 폐업률이 가장 악화된 자치구/업종은? (코로나 전후 등 이벤트 비교, :dim ∈ {gu, category})"
              axes: "gu_code|category(랭킹) × 두 연도 폐업률 델타 @ :y1·:y2 — 조건부 집계로 두 시점을 한 행에 결합"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2019→2022년 폐업률이 가장 악화된 자치구는 은평구(11380)로 9.89%에서 10.03%로 +0.14%p 올랐다."
              sql: |
                -- :y1='2019', :y2='2022', :dim='gu', :n=25
                SELECT (CASE :dim WHEN 'gu' THEN gu_code WHEN 'category' THEN category END) AS dim_value,
                       ROUND(1.0*SUM(CASE WHEN y = :y1 THEN closed END)/NULLIF(SUM(CASE WHEN y = :y1 THEN stock_start END),0),4) AS churn_rate_a,
                       ROUND(1.0*SUM(CASE WHEN y = :y2 THEN closed END)/NULLIF(SUM(CASE WHEN y = :y2 THEN stock_start END),0),4) AS churn_rate_b,
                       ROUND(1.0*SUM(CASE WHEN y = :y2 THEN closed END)/NULLIF(SUM(CASE WHEN y = :y2 THEN stock_start END),0)
                            - 1.0*SUM(CASE WHEN y = :y1 THEN closed END)/NULLIF(SUM(CASE WHEN y = :y1 THEN stock_start END),0),4) AS churn_delta
                FROM d1_churn_yearly
                WHERE y IN (:y1, :y2) AND (:dim<>'gu' OR gu_code<>'UNK')
                GROUP BY dim_value
                ORDER BY churn_delta DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { n: 25 }
              param_enum: { dim: [gu, category] }
            - pattern_id: "closure_spike_dim"
              question_ko: "특정 연도에 폐업이 전년 대비 가장 급증한 자치구/업종은? (위기 신호 탐지, :dim ∈ {gu, category})"
              axes: "gu_code|category(랭킹) × 폐업 YoY 증감률 @ :y — LAG 윈도우, 기존 개업 모멘텀 패턴의 폐업(위기) 극성 대응물"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2020년 폐업이 전년 대비 가장 급증한 자치구는 종로구(11110)로, 2,066건에서 2,509건으로 +21.4% 늘었다."
              sql: |
                -- :y='2020', :dim='gu', :n=10
                WITH s AS (
                  SELECT y, (CASE :dim WHEN 'gu' THEN gu_code WHEN 'category' THEN category END) AS dim_value, SUM(closed) AS closed_sum
                  FROM d1_churn_yearly
                  WHERE (:dim<>'gu' OR gu_code<>'UNK')
                  GROUP BY y, dim_value
                ), d AS (
                  SELECT y, dim_value, closed_sum, LAG(closed_sum) OVER (PARTITION BY dim_value ORDER BY y) AS closed_prev
                  FROM s
                )
                SELECT dim_value, closed_sum AS closed_cur, closed_prev, closed_sum - closed_prev AS diff,
                       ROUND(100.0*(closed_sum - closed_prev)/closed_prev, 1) AS pct
                FROM d
                WHERE y = :y AND closed_prev > 0
                ORDER BY pct DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
              param_defaults: { n: 10 }
              param_enum: { dim: [gu, category] }
            - pattern_id: "stock_composition_share"
              question_ko: "특정 연도 서울 재고와 폐업은 어떤 업종/자치구/대분류에 몰려 있나? (점유율 구성, :dim ∈ {gu, category, major})"
              axes: "gu_code|category|major(분포) × 재고·폐업 점유율 @ :y — 서브쿼리 분모로 구성비 산출, 기존 패턴에 없던 분포 축"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 서울 재고의 54.67%(611,847곳)는 industry 업종이지만 폐업 점유율은 36.04%에 그쳐, 재고 비중 대비 폐업이 덜한 구성이다."
              sql: |
                -- :y='2025', :dim='category'
                SELECT (CASE :dim WHEN 'gu' THEN gu_code WHEN 'category' THEN category WHEN 'major' THEN major END) AS dim_value,
                       SUM(stock_start) AS stock_start,
                       ROUND(100.0*SUM(stock_start)/(SELECT SUM(stock_start) FROM d1_churn_yearly WHERE y = :y AND (:dim<>'gu' OR gu_code<>'UNK')), 2) AS stock_share_pct,
                       SUM(closed) AS closed,
                       ROUND(100.0*SUM(closed)/(SELECT SUM(closed) FROM d1_churn_yearly WHERE y = :y AND (:dim<>'gu' OR gu_code<>'UNK')), 2) AS closed_share_pct
                FROM d1_churn_yearly
                WHERE y = :y AND (:dim<>'gu' OR gu_code<>'UNK')
                GROUP BY dim_value
                ORDER BY stock_share_pct DESC
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
              param_enum: { dim: [gu, category, major] }
            - pattern_id: "growth_cell_screen"
              question_ko: "특정 연도에 진입률·재고·순증 조건을 만족하는 성장 유망 업종×구 셀은? (임계값 스크리닝: :min_stock, :min_birth)"
              axes: "category × gu_code 교차 셀(스크리닝) @ :y — birth_rate·stock_start 임계값 + 순증>0, 쇠퇴 셀 랭킹(기존)의 반대 극성"
              verified_rows: 15
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 성장 셀 1위는 강동구(11740)×food로 진입률 21.28%·폐업률 20.56%에 순증 +60을 기록한 고회전 성장 셀이다."
              sql: |
                -- :y='2025', :min_stock=100, :min_birth=0.12, :n=15
                SELECT gu_code, category, opened, closed, net_change, stock_start,
                       ROUND(birth_rate,4) AS birth_rate, ROUND(churn_rate,4) AS churn_rate
                FROM d1_churn_yearly
                WHERE y = :y AND gu_code<>'UNK'
                  AND stock_start >= :min_stock AND birth_rate >= :min_birth AND net_change > 0
                ORDER BY birth_rate DESC
                LIMIT :n
              requires: [select_columns, sort, filter_range]
              param_defaults: { min_stock: 100, min_birth: 0.12, n: 15 }
            - pattern_id: "top_category_per_gu"
              question_ko: "특정 연도에 25개 자치구 각각에서 폐업률이 가장 높은 업종은 무엇인가? (구별 최고 회전 업종 맵)"
              axes: "gu_code × 그룹내 1위 category(교차 맵) @ :y — ROW_NUMBER 그룹별 top-1, stock_start>=100으로 소형 스톡 노이즈 차단"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "eb461a98e9cb462cb8b986e7eb5a6a6c"
              insight_sample_ko: "2025년 구별 최고 회전 업종 맵에서 1위는 양천구(11470)의 food로, 재고 6,308곳에 폐업률 25.75%다."
              sql: |
                -- :y='2025'
                WITH r AS (
                  SELECT gu_code, category, stock_start, ROUND(churn_rate,4) AS churn_rate,
                         ROW_NUMBER() OVER (PARTITION BY gu_code ORDER BY churn_rate DESC) AS rn
                  FROM d1_churn_yearly
                  WHERE y = :y AND gu_code<>'UNK' AND stock_start >= 100
                )
                SELECT gu_code, category, stock_start, churn_rate
                FROM r
                WHERE rn = 1
                ORDER BY churn_rate DESC
              requires: [select_columns, sort, subquery, window, filter_range]
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_churn_yearly   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 상권 역동성(교체율·신생비)
            summary: 연도별로 업종과 자치구마다 개업·폐업·순증을 묶어 교체율과 신생비를 냈습니다. 상권이 커지는 중인지 주인만 바뀌는 중인지 갈라 봅니다.
            caveat: 최근 20개 완결연도만 담습니다.
            use_cases:
              - 순증형·교체형 상권 진단
              - 자치구 상권 건전성 비교
              - 진입 위험도 평가
          contract_version: v1
          product_question: 연별 교체율·신생비는?
          grain: 연×업종3단×자치구
          primary_key: [y, major, category, dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
