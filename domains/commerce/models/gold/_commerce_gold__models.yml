            - pattern_id: "lifespan_dim_switch_ranking"
              question_ko: "선택한 축(:dim ∈ {major, category, gu})별 조기폐업률 랭킹은? 정렬 방향(:dir ∈ {asc, desc})도 선택 — 위험 순/안전 순 모두 지원"
              axes: "차원 스위치 랭킹 — 대분류/중분류/자치구 중 택1, 가중 재계산 3지표 동시, 정렬 방향 스위치"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "대분류 4개 중 조기폐업률이 가장 높은 축은 산업(27.3%)이며, 가중평균 수명 1,265일에 10년 장수 비율은 6.4%에 그친다."
              sql: |
                -- :dim='major', :dir='desc', :n=25
                SELECT CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko WHEN 'gu' THEN gu END AS dim_value,
                       SUM(n_closed) AS n_closed,
                       ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio,
                       ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w,
                       ROUND(1.0*SUM(survived_10y_then_closed)/SUM(n_closed),4) AS longevity_ratio
                FROM d1_lifespan
                WHERE (:dim != 'gu' OR gu_code != 'UNK')
                GROUP BY CASE :dim WHEN 'major' THEN major_ko WHEN 'category' THEN category_ko WHEN 'gu' THEN gu END
                ORDER BY CASE WHEN :dir = 'asc' THEN 1.0*SUM(closed_within_1y)/SUM(n_closed) END ASC,
                         CASE WHEN :dir = 'desc' THEN 1.0*SUM(closed_within_1y)/SUM(n_closed) END DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { dir: "desc", n: 25 }
              param_enum: { dim: [major, category, gu], dir: [asc, desc] }
            - pattern_id: "lifespan_gu_ranking_by_category"
              question_ko: "특정 중분류(:category, 'ALL'이면 전 업종)에서 조기폐업률이 높은 자치구 순위는?"
              axes: "중분류 조건부 자치구 랭킹 — 센티널 'ALL'로 전체 축소, 모수 임계값 파라미터"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "944d692e8fc14b2e9f26e80b1ea67916"
              insight_sample_ko: "식품 중분류의 조기폐업률 1위 자치구는 노원구(30.4%)로, 폐업 29,920건의 가중평균 수명은 1,658일이다."
              sql: |
                -- :category='food', :min_closed=100, :n=25
                SELECT gu_code, MAX(gu) AS gu, SUM(n_closed) AS n_closed,
                       ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio,
                       ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w
                FROM d1_lifespan
                WHERE gu_code != 'UNK' AND (:category = 'ALL' OR category = :category)
