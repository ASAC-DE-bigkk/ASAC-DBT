            - pattern_id: "citywide-major-summary"
              d1_table: d1_geo_grid_overview
              question_ko: "서울 전체에서 대분류별 규모(절대)와 신규 유입률(비중)은 어떻게 다른가?"
              axes: "major 단일 축 전체 단면 — 절대값(active_total)과 비율(new_ratio) 동시 제시"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "산업 36.8만곳(신규율 10.9%) > 보건 33.4만(8.7%) > 문화 11.8만(6.3%) > 환경 1.4만(3.5%) — 규모가 큰 대분류일수록 신규 유입률도 높다."
              sql: |
                SELECT major, COUNT(*) AS grid_cells,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL) / SUM(active_cnt), 3) AS new_ratio
                FROM d1_geo_grid_overview
