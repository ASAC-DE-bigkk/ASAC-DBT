            - pattern_id: "inv_gu_net_top"
              question_ko: "순증이 가장 큰 자치구는? (순감 랭킹의 정렬 반전)"
              axes: "자치구 랭킹 — 순증 DESC(gu_net_bottom 의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "실측 1위: gu_code=11680, opened=26319, closed=19620 (반환 10행)"
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06', :n=10
                SELECT gu_code,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
