              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "cumulative_net_by_gu"
              question_ko: "특정 자치구의 순증(개업-폐업)을 기간 시작점부터 누적하면 얼마나 쌓였나? (플로우를 스톡 근사로 변환한 누적 곡선)"
              axes: "자치구 고정 → 연도 시계열 + 누적 합(러닝 토탈). 연도별 플로우(trend_one_gu_yearly)와 달리 누적 스톡 관점"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "강남구(11680)는 2022년 개업 7,315건·폐업 4,372건, 순증 +2,943으로 누적 곡선을 시작한다(cum_net 2,943)."
              sql: |
                -- :gu_code='11680', :y_from='2022', :y_to='2025'
                WITH t AS (
                  SELECT y,
                         SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                         SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                         SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                  FROM d1_flow_yearly
                  WHERE gu_code = :gu_code AND y BETWEEN :y_from AND :y_to
                  GROUP BY y
                )
                SELECT y, opened, closed, net,
                       SUM(net) OVER (ORDER BY y ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum_net
                FROM t
                ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
            - pattern_id: "unk_share_yearly"
              question_ko: "연도별로 자치구 미상(gu_code='UNK') 레코드가 전체에서 차지하는 비중은? (지역 축 분석의 신뢰 구간 진단)"
              axes: "연도 시계열 — 데이터 커버리지 품질 지표(UNK 비중 %). 기존 패턴이 전부 UNK를 버리기만 하고 크기를 안 알려주는 결측 지점"
              verified_rows: 4
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "f3361dc2edd942b28e1b7b008eaceab3"
              insight_sample_ko: "2022년 전체 138,158건 중 자치구 미상(UNK)은 60건, 0.04%로 지역 축 분석의 커버리지 손실이 미미하다."
              sql: |
                -- :y_from='2022', :y_to='2025'
                SELECT y,
                       SUM(cnt) AS total_cnt,
                       SUM(CASE WHEN gu_code='UNK' THEN cnt ELSE 0 END) AS unk_cnt,
