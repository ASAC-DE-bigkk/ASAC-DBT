version: 2

# commerce gold 계약·테스트 (culture _culture_gold__models.yml 패턴 승계 — 레이어별 문서 분리).
# gold = 집계·지표·인사이트 전용(PROJECT.md §4). 정본 명단 = include/gold/report.py::AGG_TABLES(22).
# 계보(계승): 전 모델 → ref(silver_license_entity)[+ ref(commerce_dataset_taxonomy) 시드] 또는
#   source(commerce_silver_details, silver_*_detail) → bronze_localdata_license → LOCALDATA 152 API.
# 크로스도메인(culture): models/exposures.yml 의 cross_domain_activity_join 참조(행정동/gu × 기간 공통축).
# 공통 차원 규약: gu_code/admin_dong_code/legal_code 결측 = 'UNK'(문자열). major=health/culture/industry/environment.
# 날짜 문자열 ISO(사전순=날짜순). 서빙 tier·의도: docs/DB/gold/serving-design.md.

models:
  # ═══ 화면 1: 상권 흐름(market-flow) ═══
  - name: gold_license_flow_daily
    description: 개업/폐업 흐름 일 grain × 업종3단 × 지역3축 — '언제·어디서·무슨 업종이 생기고 닫혔나' 추이 정본. 완결일만(append, 재실행 0건).
    config:
      contract: {enforced: true}
    columns:
      - name: event_date
        data_type: date
        description: 이벤트 발생일(개업 apvpermymd/폐업 dcbymd) — date 타입. 완결일만(당일 제외), 무효일자 제외.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: 이벤트 유형 — opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(=LOCALDATA API 단위, 152종). 한글명은 registry name_ko.
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리(법정동코드 앞 5자리). 결측 'UNK'(이벤트 가중 약 0.6%).
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(이벤트 가중 약 42% — 동 축 절대량 비교 부적합).
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'(약 42%).
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류 — health/culture/industry/environment(taxonomy 시드).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['health', 'culture', 'industry', 'environment']
      - name: category
        data_type: varchar
        description: 중분류(taxonomy 시드 category).
      - name: cnt
        data_type: bigint
        description: 해당 grain 개업/폐업 건수.
        tests: [not_null]
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_flow_monthly
    description: 개업/폐업 흐름 월 grain × 업종3단 × 지역3축 — 월별 상권 증감 추이(화면 기본 해상도). 완결월만(append, 재실행 0건).
    config:
      contract: {enforced: true}
    columns:
      - name: ym
        data_type: varchar
        description: 이벤트 발생 연월(YYYY-MM, 문자열). 완결월만(당월 제외).
      - name: y
        data_type: integer
        description: 연(정수, ym 파생) — 월 데이터의 연 단위 집계용.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(약 42%).
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류(health/culture/industry/environment).
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: cnt
        data_type: bigint
        description: 월별 개업/폐업 건수.
        tests: [not_null]
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_flow_yearly
    description: 개업/폐업 흐름 연 grain × 업종3단 × 지역3축 — 장기(수십 년) 상권 추세. 완결연만(append, 재실행 0건).
    config:
      contract: {enforced: true}
    columns:
      - name: y
        data_type: integer
        description: 이벤트 발생 연도(정수). 완결연만(당해 제외). 원천 커버리지 1900~2025.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: cnt
        data_type: bigint
        description: 연별 개업/폐업 건수.
        tests: [not_null]
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_seasonality
    description: 개업/폐업 월중 계절성(1~12월) × 업종 — '어느 달에 개·폐업 몰리나'(연도 무관, 최근 10개 완결연).
    config:
      contract: {enforced: true}
    columns:
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: month_of_year
        data_type: integer
        description: 월(1~12 정수) — 연도 제거한 월중 집계축.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
      - name: cnt
        data_type: bigint
        description: 해당 월 개업/폐업 누적 건수(최근 10년 완결연 합).
        tests: [not_null]
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_churn_yearly
    description: 상권 역동성 — 연도별 개업/폐업/순증·교체율·신생비 × 업종 × 자치구. 순증형 vs 교체형 진단(최근 20개 완결연).
    config:
      contract: {enforced: true}
    columns:
      - name: y
        data_type: integer
        description: 연도(정수). 실측 2006~2025.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
      - name: opened
        data_type: bigint
        description: 해당 연 개업 수.
      - name: closed
        data_type: bigint
        description: 해당 연 폐업 수.
      - name: net_change
        data_type: bigint
        description: 순증 = opened - closed.
      - name: stock_start
        data_type: bigint
        description: 연초 근사 영업스톡(교체율·신생비 분모) — 연 단위 문자열 연산 기반 근사.
      - name: churn_rate
        data_type: decimal(38,18)
        description: 교체율 = closed / stock_start(근사). stock_start=0 이면 null.
      - name: birth_rate
        data_type: decimal(38,18)
        description: 신생비 = opened / stock_start(근사).

  # ═══ 화면 2: 업종 생존·수명·상태(survival) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_lifespan
    description: 이 업종 얼마나 버티나 — 폐업 완결분 수명(개업→폐업 일수) 분포 × 업종 × 자치구. 조기폐업률 포함(폐업분 기준 편향 주의).
    config:
      contract: {enforced: true}
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
      - name: n_closed
        data_type: bigint
        description: 수명 계산 모수 — 개업일·폐업일이 모두 유효한 폐업 완결 업소 수.
        tests: [not_null]
      - name: avg_days
        data_type: double
        description: 평균 수명(일).
      - name: p50_days
        data_type: bigint
        description: 중앙값 수명(일, approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 수명(일, approx_percentile).
      - name: closed_within_1y
        data_type: bigint
        description: 개업 1년 이내 폐업한 업소 수(조기폐업).
      - name: early_close_ratio
        data_type: decimal(38,18)
        description: 조기폐업률 = closed_within_1y / n_closed.
      - name: survived_10y_then_closed
        data_type: bigint
        description: 10년 이상 영업 후 폐업한 업소 수(장수 후 폐업).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_cohort_survival
    description: 창업 생존율 곡선 — 개업연도 코호트의 경과연차별 생존율 × 대/중분류. 우측검열 차단(관측 가능 연차만), 연 단위 근사.
    config:
      contract: {enforced: true}
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: cohort_y
        data_type: integer
        description: 개업연도 코호트(정수).
        tests: [not_null]
      - name: years_elapsed
        data_type: bigint
        description: 개업 후 경과 연차(0=개업년).
        tests: [not_null]
      - name: cohort_n
        data_type: bigint
        description: 코호트 초기 개업 업소 수(생존율 분모).
      - name: survivors
        data_type: bigint
        description: 경과연차 시점 생존(미폐업) 업소 수.
      - name: survival_rate
        data_type: decimal(38,18)
        description: 생존율 = survivors / cohort_n.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_duration
    description: 휴업하면 얼마나 쉬나 — 상태(영업/휴업/폐업/취소) 세그먼트 지속기간 요약 × 업종·상태군. 이력 기반(씨앗 — 표본 축적 중).
    config:
      contract: {enforced: true}
    columns:
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류.
      - name: status_code
        data_type: varchar
        description: 상태코드 2자리 정규화 — 01영업/02휴업/03폐업/04취소·말소/05제외·전출/06기타.
        tests: [not_null]
      - name: status_group
        data_type: varchar
        description: 상태군 한글 라벨(status_code 그룹핑).
      - name: is_ongoing
        data_type: boolean
        description: 진행중 세그먼트 여부(true=아직 종료 안 된 현재 상태).
      - name: n_segments
        data_type: bigint
        description: 집계 세그먼트 수(표본). 30 미만은 저표본(회색 처리 권장).
      - name: avg_days
        data_type: double
        description: 평균 지속 일수.
      - name: p50_days
        data_type: bigint
        description: 중앙값 지속 일수(approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 지속 일수(approx_percentile).
      - name: max_days
        data_type: bigint
        description: 최대 지속 일수.
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_transition
    description: 휴업 다음은 재개? 폐업? — 상태 전이 매트릭스(from→to) × 업종. 씨앗 지표(이력 축적에 따라 성장).
    config:
      contract: {enforced: true}
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류.
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
      - name: from_status
        data_type: varchar
        description: 전이 이전 상태코드(01~06).
        tests: [not_null]
      - name: to_status
        data_type: varchar
        description: 전이 이후 상태코드(01~06).
        tests: [not_null]
      - name: from_group
        data_type: varchar
        description: 이전 상태군 한글 라벨.
      - name: to_group
        data_type: varchar
        description: 이후 상태군 한글 라벨.
      - name: transitions
        data_type: bigint
        description: 해당 전이 발생 건수. 30 미만 저표본.
        tests: [not_null]

  # ═══ 화면 3: 지역 프로파일·지도(geo-place) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
