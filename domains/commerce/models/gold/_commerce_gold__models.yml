      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: age_band
        data_type: varchar
        description: 업력 구간 라벨(1년 미만 / 1~3 / 3~5 / 5~10 / 10~20 / 20년+). 개업일 보유분 기준.
        tests: [not_null]
      - name: active_cnt
        data_type: bigint
        description: 해당 밴드의 영업(01) 업소 수.
        tests: [not_null]

