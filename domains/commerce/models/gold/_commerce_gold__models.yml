  - name: gold_license_flow_yearly
    description: 개업/폐업 흐름 연 grain × 업종3단 × 지역3축 — 장기(수십 년) 상권 추세. 완결연만(당년 제외). 소급 신고가 건드린 연도는 다음 증분이 그 연도만 재계산해 교체(#603, src_collected_at 워터마크).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_flow_yearly
          d1_rollup: (y,event_type,major,category,gu_code) SUM(cnt) — dataset/dong 드롭, y→varchar
          event_time: y                       # 시간축(#478 v1) — _catalog.time_axis/freshness(타 도메인 동형)
          freshness_slo_minutes: 1051200   # 730일(2년). 완결연 grain: y='YYYY' 를 연초로 파싱하면 최신 이벤트연이 최대 약 730일 전. 게시 지연 감시는 publication_trigger.max_interval_minutes(26h) 담당
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rank_gu_by_event_year"
              question_ko: "특정 연도에 개업(또는 폐업)이 가장 많았던 자치구 top-N은?"
              axes: "연도·이벤트 고정 → 자치구 랭킹(top-N). 축 반전쌍 A의 정방향(trend_one_gu_yearly와 차원 교환)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 개업 1위는 강남구 14,217건으로 2위 서초구(7,954건)의 1.8배 — 상위 4개 구(강남·서초·송파·마포)가 뚜렷한 선두 그룹."
              sql: |
                -- 예시값: :y='2024', :event_type='opened', :n=10
                SELECT f.gu_code, g.gu, SUM(f.cnt) AS cnt
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.event_type = :event_type AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu
                ORDER BY cnt DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
            - pattern_id: "trend_one_gu_yearly"
              question_ko: "특정 자치구의 연도별 개업·폐업·순증 추이는? (rank_gu_by_event_year의 축 반전: 구 고정→연도 나열)"
              axes: "자치구 고정 → 연도 시계열(개업/폐업/순증). 축 반전쌍 A의 역방향(차원 교환)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "강남구 순증은 2020~21년 7,000건대로 정점 후 2024~25년 3,800건대로 반토막 — 개업은 유지(1.4만)되나 폐업이 2015년 5,825→2024년 10,356건으로 늘어난 탓."
              sql: |
                -- 예시값: :gu_code='11680'(강남구), :y_from='2015', :y_to='2025'
                SELECT y,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE gu_code = :gu_code AND y BETWEEN :y_from AND :y_to
                GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rank_category_net_top"
              question_ko: "특정 연도에 순증(개업-폐업)이 가장 큰 업종은?"
              axes: "연도 고정 → 업종(중분류) 랭킹, 순증 내림차순. 축 반전쌍 B의 정방향"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 순증 1위는 산업(industry) +20,073건으로 압도적(개업 58,755·폐업 38,682) — 2위 문화 +1,933건과 10배 차이."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT major, category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE y = :y
                GROUP BY major, category
                ORDER BY net DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "rank_category_net_bottom"
              question_ko: "특정 연도에 순감(폐업 초과)이 가장 심한 업종은? (rank_category_net_top의 정렬 반전)"
              axes: "연도 고정 → 업종 랭킹, 순증 오름차순(순감 우선). 축 반전쌍 B의 역방향(정렬 반전)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 순감 업종은 식품(food) -6,547건과 축산(livestock) -234건 단 둘 — 나머지 9개 업종은 모두 순증이라 '식품 폐업 초과'가 유일한 대형 수축축."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT major, category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE y = :y
                GROUP BY major, category
                ORDER BY net ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "timeseries_category_flow"
              question_ko: "특정 업종의 연도별 개업·폐업·순증 시계열은? (변곡점 탐지)"
              axes: "업종 고정 → 연도 시계열(시간축 y)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "식품업 순증은 2020~22년 +5,600~7,200건에서 2023년 +4건으로 급락, 2024년 -6,547건·2025년 -4,863건 — 2024년부터 폐업(45,739)이 개업(39,192)을 추월하는 구조 전환."
              sql: |
                -- 예시값: :category='food', :y_from='2016', :y_to='2025'
                SELECT y,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly
                WHERE category = :category AND y BETWEEN :y_from AND :y_to
                GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "slice_flow_cell"
              question_ko: "특정 연도×자치구×업종 한 단면의 개업·폐업 원값은? (:param 단면 조회)"
              axes: "y×gu_code×category 전축 고정 → event_type 2행 단면(저장 grain 그대로)"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 강남구 식품업: 개업 4,439건 vs 폐업 4,834건 — 서울 개업 1위 구에서도 식품업은 순감(-395건)."
              sql: |
                -- 예시값: :y='2024', :gu_code='11680'(강남구), :category='food'
                SELECT y, event_type, major, category, gu_code, cnt
                FROM d1_flow_yearly
                WHERE y = :y AND gu_code = :gu_code AND category = :category
                ORDER BY event_type
              requires: [select_columns, sort]
            - pattern_id: "cross_gu_category_net"
              question_ko: "특정 연도·대분류에서 자치구×업종 교차로 어느 조합이 가장 수축/성장했나?"
              axes: "연도·대분류 고정 → 자치구 × 중분류 두 축 교차(셀 랭킹)"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 보건 대분류의 순감 상위 15개 셀은 전부 식품업 — 1위 강서구 -1,034건(개업 1,933·폐업 2,967), 2위 종로구 -777건으로 식품 수축이 특정 구가 아닌 전역 현상임을 보여줌."
              sql: |
                -- 예시값: :y='2024', :major='health', :n=15 (성장 조합은 ORDER BY net DESC로 반전)
                SELECT f.gu_code, g.gu, f.category,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.major = :major AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu, f.category
                ORDER BY net ASC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
            - pattern_id: "decade_longrun_flow"
              question_ko: "10년 단위로 본 서울 인허가 개업·폐업의 장기(1900~2025) 물결은?"
              axes: "시간축 재버킷(연→10년대) 장기 시계열"
              verified_rows: 13
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "개업은 1990s 32.9만→2000s 68.7만→2010s 93.9만으로 정점, 2020s는 6년치만으로 76.8만. 폐업 기록은 1980s 이전 사실상 0(전산화 이전) — 장기 비교는 개업축만 신뢰 가능."
              sql: |
                -- 파라미터 없음(전 기간). 필요시 WHERE y >= :y_from ('1960') 추가
                SELECT CAST(CAST(y AS INTEGER)/10*10 AS TEXT) || 's' AS decade,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed
                FROM d1_flow_yearly
                GROUP BY CAST(y AS INTEGER)/10*10
                ORDER BY CAST(y AS INTEGER)/10*10
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "rank_gu_closure_pressure"
              question_ko: "특정 연도에 개업 대비 폐업 압력(폐업/개업 비율)이 가장 높은 자치구는? (개업량 랭킹의 관점 반전)"
              axes: "연도 고정 → 자치구 랭킹(절대량 아닌 비율 지표 — 볼륨 랭킹의 관점 반전)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2024년 폐업/개업 비율 1위는 서대문구 1.208(개업 2,905 vs 폐업 3,510)로 유일하게 종로구(1.028)와 함께 1.0 초과 — 개업 절대량 1위 강남구는 이 랭킹엔 없음."
              sql: |
                -- 예시값: :y='2024', :n=5
                SELECT f.gu_code, g.gu,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS close_per_open
                FROM d1_flow_yearly f
                LEFT JOIN (SELECT DISTINCT gu_code, gu FROM d1_gu_specialization) g ON g.gu_code = f.gu_code
                WHERE f.y = :y AND f.gu_code <> 'UNK'
                GROUP BY f.gu_code, g.gu
                ORDER BY close_per_open DESC
                LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, join, filter_range]
            - pattern_id: "inv_closed_yearly_top"
              question_ko: "연도별 폐업이 가장 많았던 해는? (개업 관점의 반전)"
              axes: "연도 랭킹 — 폐업 DESC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "폐업이 가장 많았던 해는 2024년 99,361건."
              sql: |
                -- :n=10
                SELECT y, SUM(cnt) AS closed_cnt
                FROM d1_flow_yearly WHERE event_type='closed' AND y >= '2010'
                GROUP BY y ORDER BY closed_cnt DESC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "new_yoy_growth"
              question_ko: "전년 대비 개업 증가율이 가장 높았던 해는? (절대량 대신 증감률)"
              axes: "연도 시계열 — YoY 증감률(절대량 관점의 파생 반전)"
              verified_rows: 14
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5410d7b0049048ab8ccacb2b30309a4b"
              insight_sample_ko: "2012년 개업 82,807건이 기준점(직전 연도 없어 증감률 null) — 이후 연도부터 YoY 해석."
              sql: |
                -- :y_from='2012'
                WITH y AS (SELECT y, SUM(cnt) AS opened FROM d1_flow_yearly
                           WHERE event_type='opened' AND y >= :y_from GROUP BY y)
                SELECT y, opened, LAG(opened) OVER (ORDER BY y) AS prev,
                       ROUND(100.0*(opened - LAG(opened) OVER (ORDER BY y))/NULLIF(LAG(opened) OVER (ORDER BY y),0),1) AS yoy_pct
                FROM y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_flow_yearly   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 서울 인허가 개·폐업 흐름(연도별)
            summary: 연도 단위로 업종·지역별 개업과 폐업 건수를 집계했습니다. 수십 년치가 쌓여 있어 장기 추세를 봅니다.
            caveat: 완결된 연도만 담아 올해는 빠집니다.
            use_cases:
              - 업종 장기 성장·쇠퇴 추세
              - 지역 상권 구조 변화
              - 정책 효과 전후 비교
          contract_version: v1
          product_question: 개·폐업 흐름 추이(연)
          grain: 연×이벤트×업종×지역3축
          primary_key: [y, event_type, dataset, gu_code, admin_dong_code, legal_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [y, event_type, dataset, gu_code, admin_dong_code, legal_code]
    columns:
      - name: y
        data_type: integer
        description: 이벤트 발생 연도(정수). 완결연만(당해 제외). 원천 커버리지 1900~2025.
        tests: [not_null]
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: dataset
        data_type: varchar
        description: 데이터셋 short(API 단위).
        tests: [not_null]
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: legal_code
        data_type: varchar
        description: 법정동코드 10자리. 결측 'UNK'.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
      - name: cnt
        data_type: bigint
        description: 연별 개업/폐업 건수.
        tests: [not_null]
      - name: src_collected_at
        data_type: timestamp(6)
        description: >-
          이 행을 만든 빌드가 반영한 원천 수집 시각.
          다음 갱신은 이 시각 이후 바뀐 기간만 다시 계산해 바꿔 넣습니다.
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글)
      - name: legal_dong
        data_type: varchar
        description: 법정동명(한글)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_seasonality
    description: 개업/폐업 월중 계절성(1~12월) × 업종 — '어느 달에 개·폐업 몰리나'(연도 무관, 최근 10개 완결연).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_seasonality
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_seasonality   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 개·폐업이 몰리는 달
            summary: 최근 10년 자료로 업종마다 1~12월 중 어느 달에 개업과 폐업이 몰리는지 집계했습니다.
            caveat: 연도를 구분하지 않고 합쳐 본 값이라 특정 해의 사정은 드러나지 않습니다.
            use_cases:
              - 개업 시기 결정
              - 업종별 성수기·비수기 파악
              - 계절 마케팅 기획
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "peak_months_top_n"
              question_ko: "개업(또는 폐업)이 가장 몰리는 달 top-N은?"
              axes: "월(1~12) 랭킹 내림차순 × 이벤트 단면 — 랭킹 top-N"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "개업은 1월(111,352건)·3월(110,709건)·4월(106,760건)에 최다 — 연초·봄 창업 러시가 뚜렷하다."
              sql: |
                -- :event_type 예시 'opened' | :n 예시 3
                SELECT month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY month_of_year
                ORDER BY total DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "quiet_months_bottom_n"
              question_ko: "반대로 개업(또는 폐업)이 가장 한산한 달은? (peak_months_top_n의 정렬 반전쌍)"
              axes: "월 랭킹 오름차순 × 이벤트 단면 — 축 반전쌍 B(정렬 반전)"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "개업 최저는 12월(76,924건)로 피크 1월 대비 31% 적고, 9월(91,755)·10월(92,803)이 뒤따른다."
              sql: |
                -- :event_type 예시 'opened' | :n 예시 3
                SELECT month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY month_of_year
                ORDER BY total ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "monthly_open_close_curve"
              question_ko: "1~12월 개업·폐업 곡선과 월별 폐업/개업 비율은 어떻게 움직이나?"
              axes: "시계열(월 1→12) × 이벤트 피벗(개업·폐업 두 곡선 + 비율)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "폐업/개업 비율은 12월에만 1을 넘는다(1.332 — 폐업 102,440 > 개업 76,924). 11월 0.707이 2위로, 연말로 갈수록 폐업 압력이 급등한다."
              sql: |
                SELECT month_of_year,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt,
                       ROUND(1.0*SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END),0), 3) AS closed_per_opened
                FROM d1_seasonality
                GROUP BY month_of_year
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_peak_month"
              question_ko: "업종(중분류)별로 개·폐업이 가장 몰리는 '피크 달'과 그 쏠림 강도(연중 점유율)는?"
              axes: "업종→달 방향(업종마다 피크 달 1개) — 축 반전쌍 A-1(차원 교환)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "계절성이 가장 강한 업종은 환경(6월 점유 17.2% — 균등 8.3%의 2배), 이어 숙박 12월 12.0%, 의료 2월 10.8%, 산업 1월 10.7%."
              sql: |
                -- :event_type 예시 'opened' (균등분포 기준 점유율 8.3%)
                WITH m AS (
                  SELECT category_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY category_ko, month_of_year
                ), s AS (
                  SELECT category_ko, month_of_year, total,
                         ROUND(100.0*total/SUM(total) OVER (PARTITION BY category_ko), 1) AS share_pct,
                         ROW_NUMBER() OVER (PARTITION BY category_ko ORDER BY total DESC) AS rn
                  FROM m
                )
                SELECT category_ko, month_of_year AS peak_month, total, share_pct
                FROM s WHERE rn = 1
                ORDER BY share_pct DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "month_hot_category"
              question_ko: "달별로 '유독' 그 달에 몰리는 업종은? (자기 연중 평균 대비 계절지수 1위 — category_peak_month의 축 반전)"
              axes: "달→업종 방향(달마다 계절지수 1위 업종) — 축 반전쌍 A-2(차원 교환). season_index=1이 평균, 2면 평달의 2배"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "12월 폐업 계절지수 1위는 환경(1.72배), 1월은 산업(1.48배) — 절대량 1위(식품)와 전혀 다른 그림이 나온다."
              sql: |
                -- :event_type 예시 'closed' | :min_annual 예시 2000 (소규모 업종 노이즈 컷)
                WITH m AS (
                  SELECT category_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY category_ko, month_of_year
                ), s AS (
                  SELECT category_ko, month_of_year, total,
                         SUM(total) OVER (PARTITION BY category_ko) AS annual,
                         ROUND(12.0*total/SUM(total) OVER (PARTITION BY category_ko), 2) AS season_index
                  FROM m
                ), r AS (
                  SELECT *, ROW_NUMBER() OVER (PARTITION BY month_of_year ORDER BY season_index DESC) AS rn
                  FROM s WHERE annual >= :min_annual
                )
                SELECT month_of_year, category_ko AS hot_category, total, season_index
                FROM r WHERE rn = 1
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "category_month_profile"
              question_ko: "특정 업종(:category)의 월별 개업·폐업 프로파일은?"
              axes: ":param 단면(업종 고정) × 시계열(월) × 이벤트 피벗"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "식품업은 11월(폐업 33,582 > 개업 32,688)과 12월(46,027 > 29,317, 1.57배)에만 폐업이 개업을 역전 — 12월 격차가 압도적이다."
              sql: |
                -- :category 예시 'food' (코드 사용 — 식품). 11종 코드: food/livestock/health_medical/pharmacy/animal/hygiene_beauty/optical_dental/lodging/culture/industry/environment
                SELECT month_of_year,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened_cnt,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed_cnt
                FROM d1_seasonality
                WHERE category = :category
                GROUP BY month_of_year
                ORDER BY month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "major_month_heatmap"
              question_ko: "대분류 × 월 히트맵 — 어느 대분류가 어느 달에 몰리고, 진폭은 얼마나 다른가?"
              axes: "두 축 교차(대분류 × 월) — 히트맵/스몰멀티플용"
              verified_rows: 48
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "산업 개업은 1월 63,956 → 12월 32,487로 진폭 약 2.0배인 반면, 보건(최대 5월 46,648/최소 12월 37,213, 1.25배)·문화(1.23배)는 평탄 — 계절 진폭 자체가 대분류를 가른다."
              sql: |
                -- :event_type 예시 'opened' (4개 대분류 × 12월 = 48셀)
                SELECT major_ko, month_of_year, SUM(cnt) AS total
                FROM d1_seasonality
                WHERE event_type = :event_type
                GROUP BY major_ko, month_of_year
                ORDER BY major_ko, month_of_year;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "dataset_extreme_seasonality"
              question_ko: "최세분(데이터셋) 단위에서 계절성이 극단적인 업종 top-N은? (피크월/최저월 배율)"
              axes: "데이터셋(148종) 랭킹 top-N × 파생 지표(피크/최저 배율). months_present=12 조건이 결측월 왜곡 차단"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "수질오염설치시설(기타)은 피크월 1,309건 vs 최저월 62건으로 21.1배 — 대기오염배출시설 10.7배와 함께 규제·행정 일괄처리성 계절성이 극단적이다."
              sql: |
                -- :event_type 예시 'opened' | :min_total 예시 1200 (10년 누적 — 월평균 10건 이상) | :n 예시 5
                WITH m AS (
                  SELECT dataset_ko, month_of_year, SUM(cnt) AS total
                  FROM d1_seasonality
                  WHERE event_type = :event_type
                  GROUP BY dataset_ko, month_of_year
                ), s AS (
                  SELECT dataset_ko, SUM(total) AS annual_total, MAX(total) AS peak_cnt, MIN(total) AS trough_cnt,
                         COUNT(*) AS months_present
                  FROM m GROUP BY dataset_ko
                )
                SELECT dataset_ko, annual_total, peak_cnt, trough_cnt,
                       ROUND(1.0*peak_cnt/trough_cnt, 1) AS peak_to_trough
                FROM s
                WHERE months_present = 12 AND annual_total >= :min_total
                ORDER BY peak_to_trough DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "inv_flat_seasonality"
              question_ko: "계절성이 거의 없는(연중 고른) 업종은? (극단 계절성 랭킹의 반전)"
              axes: "업종 랭킹 — 피크/최저 배율 ASC(dataset_extreme_seasonality 의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "담배소매업은 피크/최저 배율 1.23으로 사실상 계절성이 없다(연중 고른 개업)."
              sql: |
                -- :event_type='opened', :min_total=500, :n=10
                SELECT dataset_ko, SUM(cnt) AS total, MAX(cnt) AS peak, MIN(cnt) AS trough,
                       ROUND(1.0*MAX(cnt)/NULLIF(MIN(cnt),0),2) AS peak_over_trough
                FROM d1_seasonality WHERE event_type = :event_type
                GROUP BY dataset_ko HAVING SUM(cnt) >= :min_total AND MIN(cnt) > 0
                ORDER BY peak_over_trough ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "inv_closed_peak_month"
              question_ko: "폐업이 몰리는 달은? (개업 피크 분석의 관점 반전)"
              axes: "월중 랭킹 — 폐업 이벤트(개업 관점의 반전)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "폐업은 12월 102,440건으로 최다 — 연말 일괄 신고 효과."
              sql: |
                SELECT month_of_year, SUM(cnt) AS closed_total
                FROM d1_seasonality WHERE event_type='closed'
                GROUP BY month_of_year ORDER BY closed_total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "new_month_fixed_dataset_rank"
              question_ko: "특정 달에 개업이 가장 많은 업종은? (월 고정 단면)"
              axes: "월 고정(:month_of_year) → 업종 랭킹 — 시간축을 필터로 세운 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "1월 개업 1위는 통신판매업 59,646건 — 연초 개업 집중의 실체."
              sql: |
                -- :month_of_year=1, :event_type='opened', :n=10
                SELECT dataset_ko, cnt
                FROM d1_seasonality
                WHERE month_of_year = :month_of_year AND event_type = :event_type
                ORDER BY cnt DESC LIMIT :n
              requires: [select_columns, sort]
            - pattern_id: "new_open_close_peak_gap"
              question_ko: "개업 피크월과 폐업 피크월이 다른 업종은? (두 관점 교차)"
              axes: "업종별 개업 피크월 vs 폐업 피크월 비교 — 이벤트 관점 교차"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5695700193244ac6925d93197ff7fb8f"
              insight_sample_ko: "건강기능식품일반판매업은 개업 피크 1월 vs 폐업 피크 12월로 정반대 — 연초 진입·연말 정리 사이클."
              sql: |
                -- :min_total=1000
                WITH pk AS (
                  SELECT dataset_ko, event_type, month_of_year, cnt,
                         ROW_NUMBER() OVER (PARTITION BY dataset_ko, event_type ORDER BY cnt DESC) rn,
                         SUM(cnt) OVER (PARTITION BY dataset_ko, event_type) tot
                  FROM d1_seasonality)
                SELECT o.dataset_ko, o.month_of_year AS open_peak_m, c.month_of_year AS close_peak_m,
                       o.tot AS open_total, c.tot AS close_total
                FROM pk o JOIN pk c ON o.dataset_ko=c.dataset_ko AND o.rn=1 AND c.rn=1
                WHERE o.event_type='opened' AND c.event_type='closed' AND o.tot >= :min_total
                ORDER BY ABS(o.month_of_year - c.month_of_year) DESC LIMIT 10
              requires: [select_columns, sort, aggregate, join, subquery, window, filter_range]
          contract_version: v1
          product_question: 개·폐업이 몰리는 달은 언제인가?
          grain: 이벤트×월×업종3단
          primary_key: [event_type, month_of_year, major, category, dataset]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [event_type, month_of_year, major, category, dataset]
    columns:
      - name: event_type
        data_type: varchar
        description: opened(개업)/closed(폐업).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['opened', 'closed']
      - name: month_of_year
        data_type: integer
        description: 월(1~12 정수) — 연도 제거한 월중 집계축.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: cnt
        data_type: bigint
        description: 해당 월 개업/폐업 누적 건수(최근 10년 완결연 합).
        tests: [not_null]
      - name: event_type_ko
        data_type: varchar
        description: 이벤트 유형 한글(개업/폐업)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_churn_yearly
    description: 상권 역동성 — 연도별 개업/폐업/순증·교체율·신생비 × 업종 × 자치구. 순증형 vs 교체형 진단(최근 20개 완결연).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: d1_churn_yearly
          d1_rollup: (y,major,category,gu_code) 집계 후 비율 재산출(churn/birth_rate — 합산 불가) — dataset 드롭
          event_time: y                       # 시간축(#478 v1) — _catalog.time_axis/freshness(타 도메인 동형)
          freshness_slo_minutes: 1051200   # 730일(2년). 완결연 grain: y='YYYY' 를 연초로 파싱하면 최신 이벤트연이 최대 약 730일 전. 게시 지연 감시는 publication_trigger.max_interval_minutes(26h) 담당
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "gu_churn_rank_topn"
              question_ko: "특정 연도에 교체율(폐업 회전)이 가장 높은 자치구 top-N은? (축반전 쌍 A-1: 연도 고정 → 자치구 랭킹)"
              axes: "gu_code(랭킹) × 전업종 합산 @ y 고정 — 비율은 SUM 재산출"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 교체율 1위는 서대문구(11410) 0.1077로, 상위 10개 구 중 유일하게 순감(-80). 양천(0.0979)·강서(0.0974)가 뒤를 잇지만 이들은 순증 유지."
              sql: |
                SELECT gu_code, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly WHERE y='2025' /* :y */ AND gu_code<>'UNK' GROUP BY gu_code ORDER BY churn_rate DESC LIMIT 10 /* :n */
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "gu_yearly_timeseries"
              question_ko: "특정 자치구의 20년 개업·폐업·교체율 추이는? (축반전 쌍 A-2: 자치구 고정 → 연도 시계열)"
              axes: "y(시계열) × 전업종 합산 @ gu_code 고정"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "강남구(11680) 교체율은 2006년 0.1297에서 2025년 0.0725로 장기 하락. 2025년에도 순증 +3,857로 서울 최대 순증 유지."
              sql: |
                SELECT y, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly WHERE gu_code='11680' /* :gu_code 강남구 */ GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_rank_in_gu"
              question_ko: "특정 자치구 안에서 어느 업종이 가장 고회전인가? (축반전 쌍 B-1: 구 고정 → 업종 랭킹)"
              axes: "category(랭킹) @ y·gu_code 고정 — 소형 스톡 노이즈 차단용 HAVING stock_start>=100"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 강남구에서 food 교체율 0.1932(순감 -196)로 압도적 1위 — 2위 hygiene_beauty(0.099)의 2배. culture는 0.0345로 안정적 순증(+554)."
              sql: |
                SELECT category, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate FROM d1_churn_yearly WHERE y='2025' /* :y */ AND gu_code='11680' /* :gu_code */ GROUP BY category HAVING SUM(stock_start)>=100 ORDER BY churn_rate DESC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "gu_rank_in_category"
              question_ko: "특정 업종에서 어느 자치구가 가장 고회전인가? (축반전 쌍 B-2: 업종 고정 → 구 랭킹)"
              axes: "gu_code(랭킹) @ y·category 고정 — (y,category,gu_code)가 유일키라 GROUP BY 불필요, 행 그대로 사용"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 음식점(food) 교체율 1위는 양천구(11470) 0.2575 — 서울 어디서나 4곳 중 1곳이 1년 새 회전. 상위 10개 구 전부 순감(net_change 음수)."
              sql: |
                SELECT gu_code, opened, closed, net_change, stock_start, ROUND(churn_rate,4) AS churn_rate, ROUND(birth_rate,4) AS birth_rate FROM d1_churn_yearly WHERE y='2025' /* :y */ AND category='food' /* :category */ AND gu_code<>'UNK' AND stock_start>=100 ORDER BY churn_rate DESC LIMIT 10 /* :n */
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "seoul_macro_timeseries"
              question_ko: "서울 전체의 연도별 창업·폐업 체력 변화는? (시계열 매크로)"
              axes: "y(시계열) × 서울 전체 합산 — 필터 없음"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "서울 신생비는 2006년 0.1564에서 2025년 0.0958로 20년간 지속 하락 — 진입 활력 둔화. 순증은 2024년 17,141로 급감했다가 2025년 18,522로 소폭 반등."
              sql: |
                SELECT y, SUM(opened) AS opened, SUM(closed) AS closed, SUM(net_change) AS net_change, SUM(stock_start) AS stock_start, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, ROUND(1.0*SUM(opened)/SUM(stock_start),4) AS birth_rate FROM d1_churn_yearly GROUP BY y ORDER BY y
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "category_gu_cross_hotcells"
              question_ko: "특정 연도에 업종×자치구 교차 셀 중 교체율이 가장 높은 핫셀은? (두 축 교차)"
              axes: "category × gu_code 교차 셀(랭킹) @ y 고정 — stock_start>=200으로 유의 셀만"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 교체율 상위 15개 셀이 전부 food — 최고는 food×양천(0.2575), food×강서(0.2162). 고회전 문제는 사실상 음식점업 단일 이슈."
              sql: |
                SELECT category, gu_code, opened, closed, stock_start, ROUND(churn_rate,4) AS churn_rate FROM d1_churn_yearly WHERE y='2025' /* :y */ AND gu_code<>'UNK' AND stock_start>=200 ORDER BY churn_rate DESC LIMIT 15 /* :n */
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "slice_gu_category_series"
              question_ko: "특정 자치구×업종 한 단면의 20년 원장(개업·폐업·비율)은? (:param 단면 — 행 그대로)"
              axes: "y(시계열) @ gu_code·category 고정 — 테이블 그레인 그대로, 집계 불필요"
              verified_rows: 20
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "마포구 food는 2024년 교체율 0.2157로 20년 최고치, 순감 -759. 2025년에도 0.1931·-471로 수축 지속 — 2023년(+285)에서 추세 반전."
              sql: |
                SELECT y, opened, closed, net_change, stock_start, ROUND(churn_rate,4) AS churn_rate, ROUND(birth_rate,4) AS birth_rate FROM d1_churn_yearly WHERE gu_code='11440' /* :gu_code 마포구 */ AND category='food' /* :category */ ORDER BY y
              requires: [select_columns, sort, aggregate]
            - pattern_id: "category_yoy_momentum"
              question_ko: "최근 연도에 개업이 급증/급감한 업종은? (전년 대비 모멘텀, 윈도우 함수)"
              axes: "category(랭킹) × YoY 증감률 @ y 고정 — LAG 윈도우로 전년 결합"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 개업 모멘텀 1위는 lodging +63.9%(72→118건). 반면 environment -30.6%, health_medical -20.2%(4,690→3,744)로 급랭."
              sql: |
                WITH s AS (SELECT y, category, SUM(opened) AS op FROM d1_churn_yearly GROUP BY y, category), d AS (SELECT y, category, op, LAG(op) OVER (PARTITION BY category ORDER BY y) AS prev_op FROM s) SELECT category, op AS opened_cur, prev_op AS opened_prev, op-prev_op AS diff, ROUND(100.0*(op-prev_op)/prev_op,1) AS pct FROM d WHERE y='2025' /* :y */ AND prev_op>0 ORDER BY pct DESC
              requires: [select_columns, sort, aggregate, group_by, subquery, window, filter_range]
            - pattern_id: "gu_regime_diagnosis"
              question_ko: "각 자치구는 순증형 성장인가, 고회전 소모전인가? (순증×교체율 4분면 진단 — 모델 설계 취지)"
              axes: "gu_code × (net_change, churn_rate) 2지표 4분면 @ y 고정 — 임계값은 그 해 서울 평균 교체율(서브쿼리)"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2025년 25개 구 중 강남(+3,857)·서초(+1,923)는 낮은 교체율의 growth_stable, 서대문은 유일 순감+최고 교체율(0.1077)의 shrink_high_turnover — 같은 '활발함'도 체질이 다름."
              sql: |
                SELECT gu_code, SUM(net_change) AS net_change, ROUND(1.0*SUM(closed)/SUM(stock_start),4) AS churn_rate, CASE WHEN SUM(net_change)>=0 AND 1.0*SUM(closed)/SUM(stock_start) >= (SELECT 1.0*SUM(closed)/SUM(stock_start) FROM d1_churn_yearly WHERE y='2025') THEN 'growth_high_turnover' WHEN SUM(net_change)>=0 THEN 'growth_stable' WHEN 1.0*SUM(closed)/SUM(stock_start) >= (SELECT 1.0*SUM(closed)/SUM(stock_start) FROM d1_churn_yearly WHERE y='2025') THEN 'shrink_high_turnover' ELSE 'shrink_stable' END AS regime FROM d1_churn_yearly WHERE y='2025' /* :y — 서브쿼리 안 y도 동일 값으로 치환 */ AND gu_code<>'UNK' GROUP BY gu_code ORDER BY net_change DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "inv_lowest_churn_gu"
              question_ko: "폐업률이 가장 낮은(안정적인) 자치구는? (높은 폐업률 랭킹의 반전)"
              axes: "자치구 랭킹 — churn_rate ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2024년 폐업률 최저는 중구(11140) 6.44% — 재고 54,351곳 대비 3,499곳 폐업."
              sql: |
                -- :y='2024', :n=10
                SELECT gu_code, SUM(stock_start) AS stock, SUM(closed) AS closed,
                       ROUND(100.0*SUM(closed)/NULLIF(SUM(stock_start),0),2) AS churn_pct
                FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK'
                GROUP BY gu_code HAVING SUM(stock_start) > 1000
                ORDER BY churn_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "inv_birth_rate_top"
              question_ko: "신규 진입률(birth rate)이 가장 높은 업종은? (폐업률 관점의 반전)"
              axes: "업종 랭킹 — birth_rate 관점(churn 관점의 반전)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2024년 신규 진입률 1위는 식품 16.17%(재고 242,351 대비 개업 39,192)."
              sql: |
                -- :y='2024'
                SELECT category, SUM(opened) AS opened, SUM(stock_start) AS stock,
                       ROUND(100.0*SUM(opened)/NULLIF(SUM(stock_start),0),2) AS birth_pct
                FROM d1_churn_yearly WHERE y = :y
                GROUP BY category HAVING SUM(stock_start) > 500
                ORDER BY birth_pct DESC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "new_year_fixed_net_asc"
              question_ko: "특정 연도에 순감이 가장 심했던 업종×구 조합은?"
              axes: "연도 고정(:y) → 업종×구 교차 랭킹 net ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "5a812c712c904b79a22035ad00b86389"
              insight_sample_ko: "2024년 최악 조합은 강서구(11500) 식품 -1,034곳(개업 1,933 vs 폐업 2,967)."
              sql: |
                -- :y='2024', :n=10
                SELECT gu_code, category, opened, closed, net_change
                FROM d1_churn_yearly WHERE y = :y AND gu_code <> 'UNK'
                ORDER BY net_change ASC LIMIT :n
              requires: [select_columns, sort, filter_range]
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_churn_yearly   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 상권 역동성(교체율·신생비)
            summary: 연도별로 업종과 자치구마다 개업·폐업·순증을 묶어 교체율과 신생비를 냈습니다. 상권이 커지는 중인지 주인만 바뀌는 중인지 갈라 봅니다.
            caveat: 최근 20개 완결연도만 담습니다.
            use_cases:
              - 순증형·교체형 상권 진단
              - 자치구 상권 건전성 비교
              - 진입 위험도 평가
          contract_version: v1
          product_question: 연별 교체율·신생비는?
          grain: 연×업종3단×자치구
          primary_key: [y, major, category, dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [y, major, category, dataset, gu_code]
    columns:
      - name: y
        data_type: integer
        description: 연도(정수). 실측 2006~2025.
        tests: [not_null]
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: opened
        data_type: bigint
        description: 해당 연 개업 수.
      - name: closed
        data_type: bigint
        description: 해당 연 폐업 수.
      - name: net_change
        data_type: bigint
        description: 순증 = opened - closed.
      - name: stock_start
        data_type: bigint
        description: 연초 근사 영업스톡(교체율·신생비 분모) — 연 단위 문자열 연산 기반 근사.
      - name: churn_rate
        data_type: decimal(38,18)
        description: 교체율 = closed / stock_start(근사). stock_start=0 이면 null.
      - name: birth_rate
        data_type: decimal(38,18)
        description: 신생비 = opened / stock_start(근사).

  # ═══ 화면 2: 업종 생존·수명·상태(survival) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_lifespan
    description: 이 업종 얼마나 버티나 — 폐업 완결분 수명(개업→폐업 일수) 분포 × 업종 × 자치구. 조기폐업률 포함(폐업분 기준 편향 주의).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_lifespan
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_lifespan   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 업종별 영업 수명
            summary: 폐업까지 간 업소들이 개업 후 며칠을 버텼는지 업종과 자치구별로 분포를 냈습니다. 1년 안에 닫은 비율도 함께 있습니다.
            caveat: 폐업한 업소만 세기 때문에 아직 영업 중인 곳이 빠져 실제 수명보다 짧게 보입니다.
            use_cases:
              - 업종 진입 위험 평가
              - 조기 폐업률 비교
              - 사업계획 손익분기 가정
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "lifespan_ecr_worst_topn"
              question_ko: "조기폐업률(1년 내 폐업)이 가장 높은 업종 top 10은?"
              axes: "업종(dataset) 랭킹 — 구 합산, 모수 1,000건 이상, 가중 재계산"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "즉석판매제조가공업은 폐업 13.9만 건 중 71.3%가 1년 내 폐업(압도적 1위) — 2위 청소년게임제공업 42.5%와도 격차가 크다."
              sql: |
                SELECT dataset, dataset_ko, SUM(n_closed) AS n_closed, ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio, ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w FROM d1_lifespan GROUP BY dataset, dataset_ko HAVING SUM(n_closed) >= 1000 ORDER BY early_close_ratio DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "lifespan_longest_topn"
              question_ko: "평균적으로 가장 오래 버티는(가중평균 수명 최장) 업종 top 10은?"
              axes: "업종(dataset) 랭킹 — 수명 가중평균 내림차순"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "목욕장업이 가중평균 5,711일(약 15.6년)로 최장수, 고압가스업 5,233일·유흥주점 5,069일이 뒤따른다."
              sql: |
                SELECT dataset, dataset_ko, SUM(n_closed) AS n_closed, ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w FROM d1_lifespan GROUP BY dataset, dataset_ko HAVING SUM(n_closed) >= 1000 ORDER BY avg_days_w DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "lifespan_by_gu_for_dataset"
              question_ko: "특정 업종(:dataset)은 어느 자치구에서 조기폐업이 많은가? (축 반전 쌍 A-1: 업종 고정 → 구 랭킹)"
              axes: ":dataset 단면 × 자치구 랭킹(조기폐업률)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "일반음식점 조기폐업률 1위는 노원구 16.3%(폐업 12,725건), 송파 16.3%·강남 16.0% 순 — 구간 격차는 크지 않다."
              sql: |
                SELECT gu_code, gu, n_closed, avg_days, p50_days, p90_days, early_close_ratio FROM d1_lifespan WHERE dataset = :dataset /* 예: 'general_restaurant' */ AND gu_code != 'UNK' AND n_closed >= 30 ORDER BY early_close_ratio DESC LIMIT 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "lifespan_by_dataset_for_gu"
              question_ko: "특정 자치구(:gu_code)에서 가장 오래 버티는 업종은? (축 반전 쌍 A-2: 구 고정 → 업종 랭킹)"
              axes: ":gu_code 단면 × 업종 랭킹(평균 수명)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "강남구 최장수 폐업 업종은 석유판매업 평균 7,731일(약 21년, n=43), 고압가스업 5,995일·유흥주점 5,136일 순."
              sql: |
                SELECT dataset, dataset_ko, n_closed, avg_days, p50_days, early_close_ratio FROM d1_lifespan WHERE gu_code = :gu_code /* 예: '11680'(강남구) */ AND n_closed >= 30 ORDER BY avg_days DESC LIMIT 10
              requires: [select_columns, sort, filter_range]
            - pattern_id: "lifespan_gu_ranking"
              question_ko: "자치구별 전 업종 조기폐업률 순위는? (축 반전 쌍 B-1: 지역 축)"
              axes: "자치구 25개 전체 랭킹 — 업종 합산 가중 재계산"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "조기폐업률 최고는 노원구 27.4%(가중평균 수명 1,650일), 양천 27.2%·강동 26.4% — 강남권보다 외곽 주거 구가 상위."
              sql: |
                SELECT gu_code, MAX(gu) AS gu, SUM(n_closed) AS n_closed, ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio, ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w FROM d1_lifespan WHERE gu_code != 'UNK' GROUP BY gu_code ORDER BY early_close_ratio DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "lifespan_category_ranking"
              question_ko: "중분류별 조기폐업률·수명·10년 장수 비율은? (축 반전 쌍 B-2: 업종 축)"
              axes: "중분류 10개 전체 랭킹 — 3개 지표 동시 비교"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "산업(통신판매 포함)이 조기폐업률 27.3%로 최고·가중평균 수명 1,265일로 최단, 약국은 수명 2,950일에 10년 장수 비율 24.6%로 안정적."
              sql: |
                SELECT category, category_ko, SUM(n_closed) AS n_closed, ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio, ROUND(SUM(avg_days*n_closed)/SUM(n_closed),0) AS avg_days_w, ROUND(1.0*SUM(survived_10y_then_closed)/SUM(n_closed),4) AS longevity_ratio FROM d1_lifespan GROUP BY category, category_ko ORDER BY early_close_ratio DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "lifespan_gu_category_cross"
              question_ko: "자치구×중분류 교차에서 조기폐업 위험이 가장 높은 조합은? (두 축 교차)"
              axes: "자치구 × 중분류 교차 매트릭스 — 모수 200건 이상 상위 15"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "최악 조합은 강동구×축산 39.2%, 관악×축산 37.3%, 서초×축산 36.7% — 축산 판매업이 구를 가리지 않고 상위를 독식."
              sql: |
                SELECT gu, category_ko, SUM(n_closed) AS n_closed, ROUND(1.0*SUM(closed_within_1y)/SUM(n_closed),4) AS early_close_ratio FROM d1_lifespan WHERE gu_code != 'UNK' GROUP BY gu_code, category HAVING SUM(n_closed) >= 200 ORDER BY early_close_ratio DESC LIMIT 15
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "lifespan_slice_full"
              question_ko: "특정 업종×자치구(:dataset, :gu_code) 한 칸의 수명 프로필 전체는? (:param 단면)"
              axes: ":dataset × :gu_code 단일 셀 — 전 지표 단면"
              verified_rows: 1
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "강남구 일반음식점: 폐업 38,773건 기준 평균 수명 2,333일(6.4년)·중앙값 1,595일, 조기폐업 16.0%, 10년 이상 버틴 후 폐업 8,698건."
              sql: |
                SELECT major_ko, category_ko, dataset_ko, gu, n_closed, avg_days, p50_days, p90_days, closed_within_1y, early_close_ratio, survived_10y_then_closed FROM d1_lifespan WHERE dataset = :dataset /* 예: 'general_restaurant' */ AND gu_code = :gu_code /* 예: '11680' */
              requires: [select_columns]
            - pattern_id: "lifespan_longevity_ratio_topn"
              question_ko: "폐업하더라도 10년 이상 버틴 비율(장수 후 폐업)이 높은 업종 top 10은?"
              axes: "업종(dataset) 랭킹 — 10년+ 생존 비율, 모수 1,000건 이상"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "목욕장업은 폐업 업소의 63.2%가 10년 이상 영업 후 폐업(고압가스 59.9%, 유흥주점 55.7%) — '망해도 오래 버틴' 전통 업종군."
              sql: |
                SELECT dataset, dataset_ko, SUM(n_closed) AS n_closed, SUM(survived_10y_then_closed) AS survived_10y, ROUND(1.0*SUM(survived_10y_then_closed)/SUM(n_closed),4) AS longevity_ratio FROM d1_lifespan GROUP BY dataset, dataset_ko HAVING SUM(n_closed) >= 1000 ORDER BY longevity_ratio DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "inv_shortest_lifespan"
              question_ko: "평균 수명이 가장 짧은 업종은? (장수 랭킹의 정렬 반전)"
              axes: "업종 랭킹 — p50 수명 ASC(전 패턴이 DESC 편중이던 것의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "즉석판매제조가공업은 폐업까지 중앙값 17일 — 평균 395일과 23배 차이로 극단 왜도."
              sql: |
                -- :min_closed=100, :n=10
                SELECT dataset_ko, category_ko, n_closed, p50_days, avg_days, ROUND(early_close_ratio*100,1) AS early_pct
                FROM d1_lifespan WHERE n_closed >= :min_closed
                GROUP BY dataset_ko, category_ko, n_closed, p50_days, avg_days, early_close_ratio
                ORDER BY p50_days ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "inv_early_close_lowest"
              question_ko: "1년 내 폐업률이 가장 낮은(초기 안정성 높은) 업종은?"
              axes: "업종 랭킹 — early_close_ratio ASC(조기폐업 top 랭킹의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "석유판매업은 1년 내 폐업이 2.1%로 최저 — 초기 안착이 가장 안정적."
              sql: |
                -- :min_closed=200, :n=10
                SELECT dataset_ko, SUM(n_closed) AS n_closed,
                       ROUND(100.0*SUM(closed_within_1y)/SUM(n_closed),1) AS early_pct
                FROM d1_lifespan GROUP BY dataset_ko HAVING SUM(n_closed) >= :min_closed
                ORDER BY early_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "inv_survived10y_lowest"
              question_ko: "10년 이상 버틴 비중이 가장 낮은 업종은? (장기생존 랭킹의 반전)"
              axes: "업종 랭킹 — 10년+ 생존 비중 ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "유원시설업(기타)은 10년 이상 버틴 비중이 0.7%로 최저."
              sql: |
                -- :min_closed=200, :n=10
                SELECT dataset_ko, SUM(n_closed) AS n_closed,
                       ROUND(100.0*SUM(survived_10y_then_closed)/SUM(n_closed),1) AS survived10y_pct
                FROM d1_lifespan GROUP BY dataset_ko HAVING SUM(n_closed) >= :min_closed
                ORDER BY survived10y_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "inv_p90_long_tail"
              question_ko: "오래 버틴 상위 10%의 수명이 가장 긴 업종은? (평균 대신 p90 꼬리)"
              axes: "업종 랭킹 — p90_days(지표 반전: avg/p50 → 상위 꼬리)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "약국은 상위 10%가 16,252일(약 44년) — 중앙값 2,285일의 7.1배로 장수 꼬리가 가장 길다."
              sql: |
                -- :min_closed=100, :n=10
                SELECT dataset_ko, n_closed, p50_days, p90_days,
                       ROUND(1.0*p90_days/NULLIF(p50_days,0),1) AS p90_over_p50
                FROM d1_lifespan WHERE n_closed >= :min_closed AND p50_days > 0
                ORDER BY p90_days DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "new_gu_fixed_shortest_dataset"
              question_ko: "이 자치구에서 수명이 가장 짧은 업종은? (구 고정 단면 + 정렬 반전)"
              axes: "자치구 고정(:gu_code) → 업종 랭킹 ASC"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "088b2dbe5167403e9709c3b4772e44e8"
              insight_sample_ko: "강남구에서 가장 단명한 업종은 즉석판매제조가공업(중앙값 19일·조기폐업 76.4%)."
              sql: |
                -- :gu_code='11680', :min_closed=50, :n=10
                SELECT dataset_ko, n_closed, p50_days, ROUND(early_close_ratio*100,1) AS early_pct
                FROM d1_lifespan WHERE gu_code = :gu_code AND n_closed >= :min_closed
                ORDER BY p50_days ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
          contract_version: v1
          product_question: 업종별 폐업까지 걸리는 수명은?
          grain: 업종3단×자치구
          primary_key: [major, category, dataset, gu_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, gu_code]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리. 결측 'UNK'.
        tests: [not_null]              # PK 근거(#478)
      - name: n_closed
        data_type: bigint
        description: 수명 계산 모수 — 개업일·폐업일이 모두 유효한 폐업 완결 업소 수.
        tests: [not_null]
      - name: avg_days
        data_type: double
        description: 평균 수명(일).
      - name: p50_days
        data_type: bigint
        description: 중앙값 수명(일, approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 수명(일, approx_percentile).
      - name: closed_within_1y
        data_type: bigint
        description: 개업 1년 이내 폐업한 업소 수(조기폐업).
      - name: early_close_ratio
        data_type: decimal(38,18)
        description: 조기폐업률 = closed_within_1y / n_closed.
      - name: survived_10y_then_closed
        data_type: bigint
        description: 10년 이상 영업 후 폐업한 업소 수(장수 후 폐업).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: gu
        data_type: varchar
        description: 자치구명(한글)
  - name: gold_license_cohort_survival
    description: 창업 생존율 곡선 — 개업연도 코호트의 경과연차별 생존율 × 대/중분류. 우측검열 차단(관측 가능 연차만), 연 단위 근사.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_cohort_survival
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_cohort_survival   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 창업 코호트 생존율
            summary: 같은 해에 문을 연 업소들이 1년·2년·3년 뒤 몇 %나 살아남았는지 업종별로 계산했습니다.
            caveat: 관측이 가능한 연차까지만 계산하며 연 단위 근사입니다.
            use_cases:
              - 업종별 생존 곡선 비교
              - 창업 3년 고비 확인
              - 투자·대출 심사 참고
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "survival_top_ranking"
              question_ko: "최근 창업 코호트 기준 k년차 생존율이 가장 높은 업종 top-N은?"
              axes: "랭킹 top-N (업종 × 고정 연차, 코호트 가중 합산, DESC)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015~2019 코호트 5년차: 숙박 1.0은 폐업일 결측 아티팩트고, 실질 1위는 환경 69.7%·안경치과 69.4%·동물 64.0%. 최하위 식품은 35.7%."
              sql: |
                -- 검증값: :k=5, :from_y=2015, :to_y=2019, :n=10
                SELECT category, category_ko, major_ko,
                       SUM(cohort_n) AS cohort_total,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n), 4) AS survival_k
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                ORDER BY survival_k DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "survival_bottom_ranking"
              question_ko: "(반전) k년차 생존율이 가장 낮은 — 가장 빨리 사라지는 업종은? (소형 업종 노이즈 제거)"
              axes: "축 반전쌍 1/2 — survival_top_ranking의 정렬 반전(ASC) + HAVING 최소표본"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "5년 생존율 최하위는 식품 35.7%(16.9만 개 코호트) — 2위 위생·미용 52.2%와 16.5%p 격차로 압도적 꼴찌. 하위 5개가 전부 보건 계열."
              sql: |
                -- 검증값: :k=5, :from_y=2015, :to_y=2019, :min_n=1000, :n=10 — survival_top_ranking의 정렬 반전쌍
                SELECT category, category_ko, major_ko,
                       SUM(cohort_n) AS cohort_total,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n), 4) AS survival_k
                FROM d1_cohort_survival
                WHERE years_elapsed = :k AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category, category_ko, major_ko
                HAVING SUM(cohort_n) >= :min_n
                ORDER BY survival_k ASC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "cohort_trend_by_category"
              question_ko: "(시계열) 특정 업종의 k년차 생존율이 개업연도 세대에 따라 어떻게 변했나 — 언제 창업한 세대가 강했나?"
              axes: "시계열 (코호트연도 축, 업종·연차 고정) — category_ranking_by_cohort와 차원 교환쌍"
              verified_rows: 32
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "식품 5년 생존율: 1990 코호트 73.0% → 1995 이후 45~48%대 → 2016부터 30%대로 추락(2019 31.5%, 2020 31.2%), 2021 33.6% 소폭 반등. 최근 창업 세대일수록 불리."
              sql: |
                -- 검증값: :category='food', :k=5 (32행: 1990~2021 코호트)
                SELECT cohort_y, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE category = :category AND years_elapsed = :k
                ORDER BY cohort_y;
              requires: [select_columns, sort]
            - pattern_id: "category_ranking_by_cohort"
              question_ko: "(반전) 특정 개업연도 코호트 하나를 고정하면, 그 해 창업자들은 업종별로 k년 뒤 얼마나 살아남았나?"
              axes: "축 반전쌍 2/2 — 차원 교환: 시계열(연도 가변)을 단면(연도 고정×업종 가변)으로 반전"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2018년 개업 코호트의 5년차: 문화 63.3%·산업 62.9%·의료 62.6%가 상위권, 식품만 33.0%로 유일한 30%대(37,328곳 중 12,323곳 생존)."
              sql: |
                -- 검증값: :cohort_y=2018, :k=5 — cohort_trend_by_category의 차원 교환쌍(업종 고정→연도 고정)
                SELECT category, category_ko, major_ko, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE cohort_y = :cohort_y AND years_elapsed = :k
                ORDER BY survival_rate DESC;
              requires: [select_columns, sort]
            - pattern_id: "survival_curve_slice"
              question_ko: "(:param 단면) 특정 업종·특정 개업연도의 생존곡선 전체 — 몇 년차에 얼마나 남나?"
              axes: ":param 단면 조회 (업종+연도 고정 → 연차 축 곡선) — 차트용 원자재"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015년 개업 식품 24,866곳: 개업 당해 92.6% → 1년차 80.2% → 5년차 44.8% → 11년차 25.0%. 첫 3년에 32%p가 사라진다."
              sql: |
                -- 검증값: :category='food', :cohort_y=2015 (12행: k=0~11)
                SELECT years_elapsed, cohort_n, survivors, survival_rate
                FROM d1_cohort_survival
                WHERE category = :category AND cohort_y = :cohort_y
                ORDER BY years_elapsed;
              requires: [select_columns, sort]
            - pattern_id: "category_k_matrix"
              question_ko: "(두 축 교차) 업종 × 경과연차(1/3/5/10년) 생존율 매트릭스 — 어느 업종이 어느 구간에서 무너지나?"
              axes: "두 축 교차 (업종 × 연차 피벗, 조건부 가중 집계)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010~2015 코호트: 산업은 10년차에도 51.8% 생존 vs 식품 25.8% — 2배 격차. 약국은 1년차 69.0%로 첫해 이탈이 전 업종 최대(개국 실패는 초반에 결판)."
              sql: |
                -- 검증값: :from_y=2010, :to_y=2015 (10년차까지 전 코호트 관측 가능 창)
                SELECT category_ko, major_ko,
                       SUM(CASE WHEN years_elapsed=0 THEN cohort_n END) AS cohort_total,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=1 THEN survivors END)/SUM(CASE WHEN years_elapsed=1 THEN cohort_n END),4) AS y1,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=3 THEN survivors END)/SUM(CASE WHEN years_elapsed=3 THEN cohort_n END),4) AS y3,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=5 THEN survivors END)/SUM(CASE WHEN years_elapsed=5 THEN cohort_n END),4) AS y5,
                       ROUND(1.0*SUM(CASE WHEN years_elapsed=10 THEN survivors END)/SUM(CASE WHEN years_elapsed=10 THEN cohort_n END),4) AS y10
                FROM d1_cohort_survival
                WHERE cohort_y BETWEEN :from_y AND :to_y
                GROUP BY category_ko, major_ko
                ORDER BY y5 DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "half_life_by_category"
              question_ko: "(관점 반전) 생존율을 고정하고 시간을 묻는다 — 몇 년차에 절반이 사라지나(업종별 반감기)?"
              axes: "관점 반전 — 랭킹류(k 고정→생존율)를 뒤집어 생존율 50% 고정→도달 연차. 미출현 업종 = :max_k년 내 반감 없음"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "반감기(생존율 50% 붕괴 연차): 식품 5년 최단, 의료·위생미용 6년, 동물·축산 7년, 약국 9년. 문화·산업·환경은 11년 내 반감 자체가 없음(결과에 미출현)."
              sql: |
                -- 검증값: :from_y=2000, :to_y=2015, :max_k=11 (창 내 모든 코호트가 k=11까지 관측 가능 → 구성 왜곡 없음)
                WITH curve AS (
                  SELECT category, category_ko, years_elapsed,
                         1.0*SUM(survivors)/SUM(cohort_n) AS rate
                  FROM d1_cohort_survival
                  WHERE cohort_y BETWEEN :from_y AND :to_y AND years_elapsed <= :max_k
                  GROUP BY 1,2,3
                )
                SELECT category, category_ko, MIN(years_elapsed) AS half_life_years
                FROM curve
                WHERE rate < 0.5
                GROUP BY category, category_ko
                ORDER BY half_life_years ASC, category;
              requires: [select_columns, sort, aggregate, group_by, subquery, filter_range]
            - pattern_id: "entry_volume_trend"
              question_ko: "(시계열) 연간 신규 개업(창업) 규모는 어떻게 변해 왔나 — 대분류별 기여 포함?"
              axes: "시계열 (연도 축 × 대분류 조건부 피벗) — 생존율이 아닌 cohort_n 자체를 지표로 쓰는 보조 관점"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "연간 신규 개업: 2016년 9.7만 → 2020년 14.5만 피크(산업 8.2만이 견인) → 이후 매년 감소해 2025년 10.9만. 보건은 5만 안팎으로 안정적."
              sql: |
                -- 검증값: :from_y=2016, :to_y=2025 — years_elapsed=0 단면만 사용(cohort_n 반복 과대집계 방지), 2026은 부분연도라 제외
                SELECT cohort_y, SUM(cohort_n) AS new_total,
                       SUM(CASE WHEN major='health' THEN cohort_n ELSE 0 END) AS health_n,
                       SUM(CASE WHEN major='industry' THEN cohort_n ELSE 0 END) AS industry_n,
                       SUM(CASE WHEN major='culture' THEN cohort_n ELSE 0 END) AS culture_n,
                       SUM(CASE WHEN major='environment' THEN cohort_n ELSE 0 END) AS environment_n
                FROM d1_cohort_survival
                WHERE years_elapsed = 0 AND cohort_y BETWEEN :from_y AND :to_y
                GROUP BY cohort_y ORDER BY cohort_y;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "major_survival_curves"
              question_ko: "대분류 4개의 생존곡선을 겹쳐 그리면 어디서 갈라지나?"
              axes: "두 축 교차 (대분류 × 연차, long 포맷) — 멀티라인 생존곡선 차트용"
              verified_rows: 44
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010~2015 코호트 10년차 생존율: 산업 51.8%·환경 50.4%·문화 50.2%로 3개 대분류가 절반 유지 vs 보건 28.4% — 식품이 포함된 보건만 곡선이 급락한다."
              sql: |
                -- 검증값: :from_y=2010, :to_y=2015, :max_k=10
                SELECT major_ko, years_elapsed,
                       ROUND(1.0*SUM(survivors)/SUM(cohort_n),4) AS survival_rate
                FROM d1_cohort_survival
                WHERE cohort_y BETWEEN :from_y AND :to_y AND years_elapsed <= :max_k
                GROUP BY major_ko, years_elapsed
                ORDER BY major_ko, years_elapsed;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "inv_worst_survival"
              question_ko: "5년 생존율이 가장 낮은 업종은? (높은 생존율 랭킹의 반전)"
              axes: "업종 랭킹 — 생존율 ASC(생존 top 관점의 반전)"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "5년 생존율 최저는 식품 44.5%(코호트 856,241 중 380,708 생존)."
              sql: |
                -- :years_elapsed=5, :min_n=500
                SELECT category_ko, SUM(cohort_n) AS cohort_n, SUM(survivors) AS survivors,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE years_elapsed = :years_elapsed
                GROUP BY category_ko HAVING SUM(cohort_n) >= :min_n
                ORDER BY survival_pct ASC
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "new_cohort_fixed_curve"
              question_ko: "특정 연도에 개업한 업소들의 생존 곡선은? (코호트 고정 단면)"
              axes: "코호트 고정(:cohort_y) → 경과연수 전개(시계열 성격)"
              verified_rows: 12
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2015년 개업 코호트는 0년차 94%에서 시작해 경과연수별로 곡선이 내려간다."
              sql: |
                -- :cohort_y=2015
                SELECT years_elapsed, SUM(cohort_n) AS cohort_n, SUM(survivors) AS survivors,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE cohort_y = :cohort_y
                GROUP BY years_elapsed ORDER BY years_elapsed
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "new_cohort_year_compare"
              question_ko: "개업 연도별로 3년 생존율이 좋아지고 있나 나빠지고 있나? (코호트 간 추이)"
              axes: "코호트 연도 시계열 — 경과연수 고정(:years_elapsed) 단면"
              verified_rows: 14
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "4c6518fc026c46ba9272195924754874"
              insight_sample_ko: "2010년 코호트의 3년 생존율은 63.4% — 코호트 연도별 비교로 개선/악화 추세를 읽는다."
              sql: |
                -- :years_elapsed=3, :min_n=1000
                SELECT cohort_y, SUM(cohort_n) AS cohort_n,
                       ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                FROM d1_cohort_survival WHERE years_elapsed = :years_elapsed AND cohort_y >= 2010
                GROUP BY cohort_y HAVING SUM(cohort_n) >= :min_n
                ORDER BY cohort_y
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
          contract_version: v1
          product_question: 창업 후 몇 년을 버티나(코호트 생존율)?
          grain: 업종×창업연도×경과연차
          primary_key: [major, category, cohort_y, years_elapsed]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, cohort_y, years_elapsed]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: cohort_y
        data_type: integer
        description: 개업연도 코호트(정수).
        tests: [not_null]
      - name: years_elapsed
        data_type: bigint
        description: 개업 후 경과 연차(0=개업년).
        tests: [not_null]
      - name: cohort_n
        data_type: bigint
        description: 코호트 초기 개업 업소 수(생존율 분모).
      - name: survivors
        data_type: bigint
        description: 경과연차 시점 생존(미폐업) 업소 수.
      - name: survival_rate
        data_type: decimal(38,18)
        description: 생존율 = survivors / cohort_n.
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_duration
    description: 휴업하면 얼마나 쉬나 — 상태(영업/휴업/폐업/취소) 세그먼트 지속기간 요약 × 업종·상태군. 이력 기반(씨앗 — 표본 축적 중).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_status_duration
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_status_duration   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 인허가 상태 지속기간
            summary: 영업·휴업·폐업 같은 상태에 업소가 얼마나 오래 머무는지 업종과 상태군별로 요약했습니다.
            caveat: 이력이 쌓이는 중인 씨앗 지표라 표본이 적습니다.
            use_cases:
              - 휴업 후 재개 시점 가늠
              - 상태 전환 대기시간 파악
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "pause_longest_topn"
              question_ko: "지금 휴업 중인 업소들이 가장 오래 쉬고 있는 업종은? (랭킹 top-N)"
              axes: "업종(dataset) → 평균 경과일 내림차순 | 단면: 휴업(02)·진행중"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "휴업 체류 최장은 통신판매업 — 진행중 2,671세그먼트 평균 164.2일(p50 195일). 소독업 155.5일, 고압가스업 149.1일 순."
              sql: |
                -- 축 반전 쌍 1-A (pause_recent_influx 와 정렬 반전) — 모집단 12행이라 LIMIT 5 권장
                SELECT dataset_ko, category_ko, n_segments, avg_days, p50_days, p90_days
                FROM d1_status_duration
                WHERE status_code = '02' AND is_ongoing = 1 AND n_segments >= 30
                ORDER BY avg_days DESC
                LIMIT 5;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "pause_recent_influx"
              question_ko: "최근에 휴업이 새로 쌓이고 있는(경과일이 짧은) 업종은? (정렬 반전)"
              axes: "업종(dataset) → 평균 경과일 오름차순 | 단면: 휴업(02)·진행중"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "휴업 경과일 최단은 의료기기판매(임대)업 68.6일(46세그) — 최근 휴업 유입이 상대적으로 활발. 의원 85.1일, 목재수입유통업 85.8일."
              sql: |
                -- 축 반전 쌍 1-B: pause_longest_topn 의 ORDER BY 반전 — 경과일 짧음 = 최근 휴업 유입 활발
                SELECT dataset_ko, category_ko, n_segments, avg_days, p50_days, p90_days
                FROM d1_status_duration
                WHERE status_code = '02' AND is_ongoing = 1 AND n_segments >= 30
                ORDER BY avg_days ASC
                LIMIT 5;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "major_status_matrix"
              question_ko: "대분류 × 상태군 교차로 보면 어느 분야가 어느 상태에 오래 머무나? (두 축 교차)"
              axes: "대분류(major_ko) × 상태군(status_group) 매트릭스, 셀값=가중평균 경과일"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "진행중 기준 산업 대분류가 전 상태군에서 최장(취소/말소 172.4일, 영업 160.4일). 보건의 제외/전출은 93.8일로 최단 셀."
              sql: |
                -- 가중평균(세그먼트 수 가중) — 행 단순 평균은 저표본 행에 왜곡됨
                SELECT major_ko, status_group,
                       SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days
                FROM d1_status_duration
                WHERE is_ongoing = 1
                GROUP BY major_ko, status_group
                ORDER BY major_ko, status_group;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "completed_durations"
              question_ko: "실제로 끝난 상태는 얼마나 지속됐나 — 완결 세그먼트 기준 (관점 반전 A)"
              axes: "상태군(status_group) → 완결 지속일 | 관점: 종료 세그먼트(is_ongoing=0)"
              verified_rows: 5
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "완결 표본은 총 약 4,510세그먼트뿐(씨앗) — 종료된 휴업 31세그 평균 113.2일, 종료된 영업 4,465세그 105.6일, 종료된 폐업은 7세그 11.4일(저표본)."
              sql: |
                -- 축 반전 쌍 2-A (ongoing_durations 와 관점 반전): is_ongoing=0 만이 진짜 '지속기간'
                SELECT status_group,
                       SUM(n_segments) AS completed_segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days,
                       MAX(p90_days) AS max_p90
                FROM d1_status_duration
                WHERE is_ongoing = 0
                GROUP BY status_group
                ORDER BY w_avg_days DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "ongoing_durations"
              question_ko: "지금 진행 중인 상태에는 얼마나 머물러 있나 — 경과일 기준 (관점 반전 B)"
              axes: "상태군(status_group) → 현재까지 경과일 | 관점: 진행중 세그먼트(is_ongoing=1)"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "진행중은 취소/말소가 평균 164.7일(186,939세그)로 최장 경과, 폐업 140.7일(1,562,650세그) — 완결 관점(P4)과 표본 규모가 3자릿수 차이."
              sql: |
                -- 축 반전 쌍 2-B: completed_durations 의 is_ongoing 반전 — 값 의미가 '지속기간'→'현재까지 경과일'로 바뀜
                SELECT status_group,
                       SUM(n_segments) AS ongoing_segments,
                       ROUND(SUM(avg_days * n_segments) / SUM(n_segments), 1) AS w_avg_days,
                       MAX(p90_days) AS max_p90
                FROM d1_status_duration
                WHERE is_ongoing = 1
                GROUP BY status_group
                ORDER BY w_avg_days DESC;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "status_slice_ranking"
              question_ko: "특정 상태군을 고정하면 어떤 업종이 가장 오래 머무나? (차원 교환 A: 상태→업종 랭킹, :param)"
              axes: "업종(dataset) 랭킹 | 단면 파라미터: :status_code (상태군 고정)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "(:status_code='03' 검증) 폐업 정체 1위 석유및석유대체연료판매업체 — 135세그 평균 225일(관측 시작부터 전원 폐업 유지). 다단계판매업체 224.4일(461세그)."
              sql: |
                -- 축 반전 쌍 3-A (dataset_profile 과 차원 교환). :status_code 예시 '03' (01영업/02휴업/03폐업/04취소·말소/05제외·전출)
                -- 주의: p50 정렬은 상한 225 동률 다수 — avg_days 정렬이 변별력 있음
                SELECT dataset_ko, major_ko, n_segments, avg_days, p50_days
                FROM d1_status_duration
                WHERE status_code = :status_code AND is_ongoing = 1 AND n_segments >= 30
                ORDER BY avg_days DESC
                LIMIT 10;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "dataset_profile"
              question_ko: "특정 업종을 고정하면 상태군×진행중 프로파일은? (차원 교환 B: 업종→상태 단면, :param)"
              axes: "상태군(status_group) × 진행중(is_ongoing) 프로파일 | 단면 파라미터: :dataset (업종 고정)"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "(:dataset='general_restaurant' 검증) 일반음식점: 진행중 폐업 415,139세그 p50 136일 vs 진행중 영업 120,464세그 p50 193일. 완결 폐업은 3세그뿐(씨앗)."
              sql: |
                -- 축 반전 쌍 3-B: status_slice_ranking 과 고정축 교환. :dataset 예시 'general_restaurant' (서울시 일반음식점)
                SELECT status_group, is_ongoing, n_segments, avg_days, p50_days, p90_days, max_days
                FROM d1_status_duration
                WHERE dataset = :dataset
                ORDER BY status_code, is_ongoing;
              requires: [select_columns, sort]
            - pattern_id: "recent_closure_influx"
              question_ko: "최근 폐업 유입이 활발한(폐업 경과 중앙값이 짧은) 업종은?"
              axes: "업종(dataset) → 폐업 경과 중앙값 오름차순 | 단면: 폐업(03)·진행중·표본 100+"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "최근 폐업 유입 최상위는 의료유사업(p50 78일, 395세그)과 의료기기판매(임대)업(p50 79일, 36,440세그) — 대형 표본에서 경과 중앙값이 짧다 = 최근 폐업 전환이 계속 쌓이는 중."
              sql: |
                -- p50 79일 부근 몰림은 이력 대량 적재 시점 영향 가능 — 절대값보다 순위·표본 규모 위주 해석
                SELECT dataset_ko, status_group, n_segments, p50_days, avg_days
                FROM d1_status_duration
                WHERE is_ongoing = 1 AND status_code = '03' AND n_segments >= 100
                ORDER BY p50_days ASC, n_segments DESC
                LIMIT 10;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "inv_p90_tail_risk"
              question_ko: "상태가 비정상적으로 길게 지속되는(꼬리 위험) 업종은? (avg/p50 대신 p90 지표)"
              axes: "업종 랭킹 — 지표 반전(avg/p50 → p90 꼬리)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "의원 휴업은 중앙값 79일인데 상위 10%는 226일까지 — 장기 휴업 꼬리가 3배 가까이 길다."
              sql: |
                -- :status_code='02', :min_n=30, :n=10
                SELECT dataset_ko, status_group, n_segments, p50_days, p90_days, max_days
                FROM d1_status_duration
                WHERE status_code = :status_code AND n_segments >= :min_n
                ORDER BY p90_days DESC LIMIT :n
              requires: [select_columns, sort, filter_range]
            - pattern_id: "inv_max_days_extreme"
              question_ko: "단일 최장 체류 기록이 가장 긴 업종×상태는?"
              axes: "업종×상태 랭킹 — max_days 극단값(지표 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "최장 체류 기록은 226일에서 다수 업종이 동률 — 관측창 상한(수집 시작 이후 경과일)에 걸린 값이라 '실제 최댓값'이 아님."
              sql: |
                -- :n=10
                SELECT dataset_ko, status_group, n_segments, p90_days, max_days
                FROM d1_status_duration ORDER BY max_days DESC LIMIT :n
              requires: [select_columns, sort]
            - pattern_id: "inv_shortest_duration"
              question_ko: "상태 체류가 가장 짧게 끝나는 업종은? (최장 랭킹의 정렬 반전)"
              axes: "업종 랭킹 — p50 ASC(정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "즉석판매제조가공업은 영업 상태 중앙값이 16일 — 개업 직후 상태가 가장 빨리 바뀌는 업종."
              sql: |
                -- :status_code='01', :min_n=30, :n=10
                SELECT dataset_ko, status_group, n_segments, p50_days, avg_days
                FROM d1_status_duration
                WHERE status_code = :status_code AND n_segments >= :min_n
                ORDER BY p50_days ASC LIMIT :n
              requires: [select_columns, sort, filter_range]
            - pattern_id: "inv_dataset_fixed_status_mix"
              question_ko: "이 업종은 어떤 상태에 얼마나 머무르나? (상태 고정→업종 랭킹의 차원 교환)"
              axes: "업종 고정(:dataset) → 상태(status_group) 전개 — status_slice_ranking 의 차원 교환"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "일반음식점은 폐업 세그먼트 415,202건이 압도적 — 상태 4종 중 폐업 체류가 대부분."
              sql: |
                -- :dataset='general_restaurant'
                SELECT status_group, is_ongoing, n_segments, p50_days, p90_days, max_days
                FROM d1_status_duration WHERE dataset = :dataset
                ORDER BY n_segments DESC
              requires: [select_columns, sort]
            - pattern_id: "new_duration_skew"
              question_ko: "체류기간 분포가 가장 비대칭인(소수가 극단적으로 긴) 업종×상태는?"
              axes: "업종×상태 랭킹 — p90/p50 왜도 파생지표"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "즉석판매제조가공업 영업 상태는 p50 16일 vs p90 73일로 4.6배 비대칭 — 소수가 극단적으로 길다."
              sql: |
                -- :min_n=50, :n=10
                SELECT dataset_ko, status_group, n_segments, p50_days, p90_days,
                       ROUND(1.0*p90_days/NULLIF(p50_days,0),1) AS p90_over_p50
                FROM d1_status_duration
                WHERE n_segments >= :min_n AND p50_days > 0
                ORDER BY p90_over_p50 DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "new_status_group_rollup"
              question_ko: "상태군별 전체 체류기간 프로필은? (상위 축 롤업)"
              axes: "상태군(status_group) 롤업 — dataset 축을 접은 상위 집계"
              verified_rows: 6
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "310593a30e454a6f86a53ff4b9f1b986"
              insight_sample_ko: "폐업 세그먼트 156만건·가중평균 141.6일. max 226일은 관측창 상한이라 상태군 간 max 비교는 무의미."
              sql: |
                SELECT status_group, COUNT(*) AS dataset_cells, SUM(n_segments) AS segments,
                       ROUND(SUM(avg_days*n_segments)/SUM(n_segments),1) AS w_avg_days,
                       MAX(max_days) AS max_days
                FROM d1_status_duration GROUP BY status_group ORDER BY segments DESC
              requires: [select_columns, sort, aggregate, group_by]
          contract_version: v1
          product_question: 인허가 상태에 얼마나 머무나?
          grain: dataset×상태×진행중
          primary_key: [dataset, status_code, is_ongoing]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [dataset, status_code, is_ongoing]
    columns:
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: major
        data_type: varchar
        description: 대분류.
      - name: category
        data_type: varchar
        description: 중분류.
      - name: status_code
        data_type: varchar
        description: 상태코드 2자리 정규화 — 01영업/02휴업/03폐업/04취소·말소/05제외·전출/06기타.
        tests: [not_null]
      - name: status_group
        data_type: varchar
        description: 상태군 한글 라벨(status_code 그룹핑).
      - name: is_ongoing
        data_type: boolean
        description: 진행중 세그먼트 여부(true=아직 종료 안 된 현재 상태).
        tests: [not_null]              # PK 근거(#478)
      - name: n_segments
        data_type: bigint
        description: 집계 세그먼트 수(표본). 30 미만은 저표본(회색 처리 권장).
      - name: avg_days
        data_type: double
        description: 평균 지속 일수.
      - name: p50_days
        data_type: bigint
        description: 중앙값 지속 일수(approx_percentile).
      - name: p90_days
        data_type: bigint
        description: 90퍼센타일 지속 일수(approx_percentile).
      - name: max_days
        data_type: bigint
        description: 최대 지속 일수.
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_status_transition
    description: 휴업 다음은 재개? 폐업? — 상태 전이 매트릭스(from→to) × 업종. 씨앗 지표(이력 축적에 따라 성장).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_status_transition
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_status_transition   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 인허가 상태 전이 경로
            summary: 업소가 어떤 상태에서 어떤 상태로 옮겨가는지(영업에서 휴업, 휴업에서 폐업 등) 업종별 전이 건수를 표로 만들었습니다.
            caveat: 이력이 쌓이는 중인 씨앗 지표라 절대 건수보다 상대 비중으로 읽어야 합니다.
            use_cases:
              - 휴업의 결말 분석
              - 폐업 선행 신호 탐색
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "rank_transition_paths"
              question_ko: "서울 인허가 업소의 상태 전이는 어떤 경로가 가장 많은가?"
              axes: "랭킹 — 행=전이경로(from_group→to_group), 값=건수·전체 구성비"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "영업→폐업이 3,580건(79.4%)으로 압도적 1위, 영업→제외/전출 695건(15.4%), 영업→취소/말소 165건(3.7%) 순. 휴업→영업(재개)은 14건(0.3%)에 불과해 관측된 전이의 대부분이 '퇴장' 방향."
              sql: |
                SELECT from_group || '→' || to_group AS path, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/(SELECT SUM(transitions) FROM d1_status_transition),1) AS pct FROM d1_status_transition GROUP BY 1 ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "rank_datasets_by_path"
              question_ko: "특정 전이 경로(예: 영업→폐업)가 가장 많이 발생한 업종은 어디인가?"
              axes: ":param 단면(:from_status,:to_status) + 랭킹 — 행=dataset"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:from_status='01', :to_status='03' 검증) 영업→폐업은 일반음식점 783건 > 즉석판매제조가공업 604건 > 통신판매업 511건 > 휴게음식점 454건 순 — 식품업이 상위권 대부분을 차지."
              sql: |
                SELECT dataset_ko, category_ko, transitions FROM d1_status_transition WHERE from_status = :from_status AND to_status = :to_status ORDER BY transitions DESC LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "from_slice_destinations"
              question_ko: "특정 상태(예: 휴업)에서 다음에 어디로 가는가 — 재개인가 폐업인가?"
              axes: "축반전쌍 A-1 — from 고정 단면(:from_status), 행=행선지(to_group)"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:from_status='02' 검증) 휴업 이후는 폐업 16건(51.6%) vs 재개 14건(45.2%)로 거의 반반의 갈림길, 제외/전출 1건(3.2%). 단 총 31건 저표본(<30 기준선 근처)이라 방향성 참고용."
              sql: |
                SELECT to_group, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/SUM(SUM(transitions)) OVER (),1) AS pct FROM d1_status_transition WHERE from_status = :from_status GROUP BY to_group ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "to_slice_origins"
              question_ko: "특정 상태(예: 폐업)로는 어떤 상태에서 유입되는가?"
              axes: "축반전쌍 A-2 — to 고정 단면(:to_status), 행=출발지(from_group). A-1과 방향 반전"
              verified_rows: 3
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:to_status='03' 검증) 폐업 유입의 99.5%(3,580건)가 영업에서 직행. 휴업을 거친 폐업은 16건(0.4%)뿐 — 서울 인허가 데이터에서 '휴업 후 폐업' 경로는 사실상 드물고, 폐업은 영업 상태에서 곧바로 발생."
              sql: |
                SELECT from_group, SUM(transitions) AS transitions, ROUND(100.0*SUM(transitions)/SUM(SUM(transitions)) OVER (),1) AS pct FROM d1_status_transition WHERE to_status = :to_status GROUP BY from_group ORDER BY transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "category_destination_mix"
              question_ko: "중분류(업종군)별로 전이의 종착지 구성은 어떻게 다른가 — 폐업행 비중은?"
              axes: "축반전쌍 B-1 — 행=category, 값=행선지(폐업/재개) 구성비"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "식품은 전이 2,314건 중 99.8%(2,310건)가 폐업행인 반면, 산업은 1,323건 중 폐업행이 47.5%(628건)뿐 — 산업(통신판매업 등)은 제외/전출·취소가 대체 퇴장 경로. 의료 82.2%, 문화 44.3%로 업종군 간 격차가 큼."
              sql: |
                SELECT category_ko, SUM(transitions) AS total, SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END) AS to_closure, SUM(CASE WHEN to_status='01' THEN transitions ELSE 0 END) AS to_reopen, ROUND(100.0*SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END)/SUM(transitions),1) AS closure_pct FROM d1_status_transition GROUP BY category_ko ORDER BY total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "destination_category_leaders"
              question_ko: "각 종착 상태(폐업·제외/전출·취소 등)별로 어떤 업종군이 주도하는가?"
              axes: "축반전쌍 B-2 — 행=행선지(to_group), 값=상위 3개 category. B-1과 축 반전"
              verified_rows: 15
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "폐업의 1위는 식품(2,310건)이지만, 제외/전출(525건)·취소/말소(148건)의 1위는 모두 산업 — 같은 '퇴장'이라도 식품은 폐업 신고로, 산업(통신판매업)은 행정적 제외·취소로 나가는 구조가 뚜렷."
              sql: |
                SELECT to_group, category_ko, transitions FROM (SELECT to_group, category_ko, SUM(transitions) AS transitions, ROW_NUMBER() OVER (PARTITION BY to_group ORDER BY SUM(transitions) DESC) AS rn FROM d1_status_transition GROUP BY to_group, category_ko) t WHERE rn <= 3 ORDER BY to_group, transitions DESC
              requires: [select_columns, sort, aggregate, group_by, window, filter_range]
            - pattern_id: "cross_major_destination"
              question_ko: "대분류 × 종착 상태 교차표 — 분야별 퇴장 방식의 프로파일은?"
              axes: "두 축 교차 — 행=major_ko, 열=to_group 피벗(CASE), 값=건수"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "보건은 2,928건 중 폐업 2,847건(97.2%)으로 폐업 단일 경로에 집중, 산업은 1,323건이 폐업 628·제외/전출 525·취소 148로 3분산. 문화는 제외/전출(115)이 폐업(105)을 앞서는 유일한 대분류."
              sql: |
                SELECT major_ko, SUM(CASE WHEN to_group='영업' THEN transitions ELSE 0 END) AS reopen, SUM(CASE WHEN to_group='휴업' THEN transitions ELSE 0 END) AS suspend, SUM(CASE WHEN to_group='폐업' THEN transitions ELSE 0 END) AS close, SUM(CASE WHEN to_group='취소/말소' THEN transitions ELSE 0 END) AS cancel, SUM(CASE WHEN to_group='제외/전출' THEN transitions ELSE 0 END) AS moveout, SUM(transitions) AS total FROM d1_status_transition GROUP BY major_ko ORDER BY total DESC
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "closure_share_by_dataset"
              question_ko: "전이가 충분히 관측된 업종 중 폐업행 비중이 높은/낮은 곳은?"
              axes: "랭킹(저표본 컷 HAVING>=30) — 행=dataset, 값=폐업행 구성비"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "표본 30건 이상 업종 중 즉석판매제조가공업(604건)·미용업(176건)·건강기능식품일반판매업(334건) 등 7개는 폐업행 100%. 반면 담배소매업은 81.2%(56/69)로 최저권 — 취소/말소 등 행정 경로 비중이 상대적으로 큼."
              sql: |
                SELECT dataset_ko, SUM(transitions) AS total, SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END) AS closures, ROUND(100.0*SUM(CASE WHEN to_status='03' THEN transitions ELSE 0 END)/SUM(transitions),1) AS closure_pct FROM d1_status_transition GROUP BY dataset_ko HAVING SUM(transitions) >= 30 ORDER BY closure_pct DESC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "dataset_transition_matrix"
              question_ko: "특정 업종(데이터셋) 하나의 전이 매트릭스 전체는 어떤 모양인가?"
              axes: ":param 단면(:dataset short 코드) — 행=from→to 조합 전체"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "(:dataset='mail_order_sale' 검증) 통신판매업은 제외/전출 515건 > 폐업 511건 > 취소/말소 109건 — 폐업 신고보다 행정적 이탈이 절반 이상. 휴업→폐업 10건 vs 휴업→재개 6건으로 휴업 후에도 폐업 우세. 78개 데이터셋 중 전이 경로가 가장 다양한 업종(10개 경로)."
              sql: |
                SELECT from_group, to_group, transitions FROM d1_status_transition WHERE dataset = :dataset ORDER BY transitions DESC
              requires: [select_columns, sort]
            - pattern_id: "inv_reopen_paths"
              question_ko: "영업으로 복귀(재개)하는 경로는 어디서 오나? (퇴장 관점의 반전)"
              axes: "전이 랭킹 — to_status='01'(재개) 관점(폐업 퇴장 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "재개(→영업) 경로는 휴업에서 오는 통신판매업 6건이 최다 — 퇴장 경로(수천 건) 대비 극히 희소."
              sql: |
                SELECT from_group, dataset_ko, transitions
                FROM d1_status_transition WHERE to_status = '01'
                ORDER BY transitions DESC LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "inv_rarest_paths"
              question_ko: "가장 드물게 관측되는 전이 경로는? (최다 경로 랭킹의 반전)"
              axes: "전이경로 랭킹 — 건수 ASC(rank_transition_paths 의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "73245ff0a79440ee9ed0a3914eee5726"
              insight_sample_ko: "가장 희귀한 경로는 취소/말소→폐업 1건 — 행정 말소 후 폐업 신고가 겹친 예외 사례."
              sql: |
                SELECT from_group || '→' || to_group AS path, SUM(transitions) AS transitions
                FROM d1_status_transition GROUP BY path ORDER BY transitions ASC LIMIT 10
              requires: [select_columns, sort, aggregate, group_by]
          contract_version: v1
          product_question: 영업→폐업 등 상태 전이는 어떤 경로인가?
          grain: 업종3단×상태전이
          primary_key: [major, category, dataset, from_status, to_status]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [major, category, dataset, from_status, to_status]
    columns:
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류.
        tests: [not_null]              # PK 근거(#478)
      - name: dataset
        data_type: varchar
        description: 데이터셋 short.
        tests: [not_null]              # PK 근거(#478)
      - name: from_status
        data_type: varchar
        description: 전이 이전 상태코드(01~06).
        tests: [not_null]
      - name: to_status
        data_type: varchar
        description: 전이 이후 상태코드(01~06).
        tests: [not_null]
      - name: from_group
        data_type: varchar
        description: 이전 상태군 한글 라벨.
      - name: to_group
        data_type: varchar
        description: 이후 상태군 한글 라벨.
      - name: transitions
        data_type: bigint
        description: 해당 전이 발생 건수. 30 미만 저표본.
        tests: [not_null]

  # ═══ 화면 3: 지역 프로파일·지도(geo-place) ═══
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
      - name: dataset_ko
        data_type: varchar
        description: 데이터셋 한글명(registry name_ko)
  - name: gold_license_dong_summary
    description: 우리 동네 상권 요약 — 행정동별 업소 현황 스냅샷(전체·영업·폐업·업종수·지도표시 가능). 동 지도/요약 서빙 표면.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_dong_summary
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_dong_summary   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 행정동별 상권 요약
            summary: 행정동마다 업소가 몇 곳이고 그중 영업 중은 몇 곳인지, 업종은 몇 가지인지 한 줄로 정리했습니다.
            use_cases:
              - 동네 상권 규모 비교
              - 지도 위 상권 요약 표시
              - 입지 후보 1차 선별
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "dong-open-top"
              question_ko: "서울에서 영업 중 업소가 가장 많은 동(상권 최대 동)은 어디인가?"
              axes: "dong → 영업 업소 수 랭킹(top-N, desc)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "역삼1동이 영업 8,924개(누적 32,486)로 서울 1위, 서초1동 7,622개·신림동 6,915개가 뒤를 잇는다."
              sql: |
                SELECT admin_dong, gu, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                ORDER BY business_open_count DESC
                LIMIT :n; -- :n 예시 10
              requires: [select_columns, sort, aggregate]
            - pattern_id: "gu-open-rollup"
              question_ko: "자치구별로 영업 업소 규모와 영업 비중은 어떻게 다른가?"
              axes: "반전 쌍A-1: dong → gu 롤업(차원 상향 교환)"
              verified_rows: 25
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구가 21개 동 합계 영업 37,525개로 구 1위(송파 24,870·마포 20,907), 영업 비중은 마포구 27.8%가 가장 높다."
              sql: |
                SELECT gu, COUNT(*) AS dong_cnt, SUM(business_open_count) AS open_total,
                       SUM(business_count) AS total_cnt,
                       ROUND(100.0 * SUM(business_open_count) / SUM(business_count), 1) AS open_pct
                FROM d1_dong_summary
                GROUP BY gu
                ORDER BY open_total DESC; -- 25개 구 전체
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu-dong-breakdown"
              question_ko: "특정 구 안에서는 어느 동이 상권이 큰가?"
              axes: "반전 쌍A-2: gu → dong 분해(차원 하향 교환, gu-open-rollup 의 역방향) + :gu 파라미터 단면"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구 21개 동 중 역삼1동(8,924)이 2위 논현1동(5,976)의 1.5배 — 구 내 상권 집중이 뚜렷하다."
              sql: |
                SELECT admin_dong, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                WHERE gu = :gu -- 예시 '강남구'
                ORDER BY business_open_count DESC;
              requires: [select_columns, sort, aggregate]
            - pattern_id: "dong-closed-share-top"
              question_ko: "누적 대비 폐업 비중이 가장 높은(상권 물갈이가 심했던) 동은 어디인가?"
              axes: "반전 쌍B-1: 폐업 관점 · 비중(절대값 아님) · desc"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "압구정동은 누적 6,386개 중 5,817개(91.1%)가 폐업 상태로 서울 최고 — 길음1동 84.4%, 신도림동 82.5% 순."
              sql: |
                SELECT admin_dong, gu, business_closed_count, business_count,
                       ROUND(100.0 * business_closed_count / business_count, 1) AS closed_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 500 (극소 동 노이즈 컷)
                ORDER BY closed_pct DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dong-open-share-top"
              question_ko: "누적 대비 영업 비중이 가장 높은(살아있는 가게 비율이 높은) 동은 어디인가?"
              axes: "반전 쌍B-2: 영업(생존) 관점 — dong-closed-share-top 의 관점 반전"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "세곡동이 영업 비중 42.3%로 1위(서울 평균 24.4%의 1.7배) — 가양1동 39.9%, 마장동 38.9% 등 신규 개발지가 상위."
              sql: |
                SELECT admin_dong, gu, business_open_count, business_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 500
                ORDER BY open_pct DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "dong-profile-lookup"
              question_ko: "우리 동네(특정 동)의 상권 프로필과 구 내 순위는?"
              axes: "단일 dong 단면(:dong 파라미터) + 구 내 순위 파생"
              verified_rows: 2
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "역삼1동은 강남구 영업 1위(8,924개, 지오코딩 96.8%)인 반면 '역삼%'에 같이 걸리는 역삼2동은 영업 6개·구 내 18위 — 접두 검색이 성격이 전혀 다른 동을 함께 반환함을 확인."
              sql: |
                SELECT admin_dong, gu, business_count, business_open_count, business_closed_count,
                       dataset_count, geocoded_count,
                       ROUND(100.0 * business_open_count / business_count, 1) AS open_pct,
                       ROUND(100.0 * geocoded_count / business_count, 1) AS geocoded_pct,
                       latest_collected_at,
                       (SELECT COUNT(*) + 1 FROM d1_dong_summary s2
                        WHERE s2.gu = s1.gu AND s2.business_open_count > s1.business_open_count) AS open_rank_in_gu
                FROM d1_dong_summary s1
                WHERE admin_dong LIKE :dong; -- 예시 '역삼%' (동명 중복 주의 — gu 필터 병용 권장)
              requires: [select_columns, aggregate, filter_set]
            - pattern_id: "dong-geocode-coverage-bottom"
              question_ko: "지도에 못 찍히는 업소가 많은(좌표 커버리지 최저) 동은 어디인가?"
              axes: "정렬 반전(asc — 최저 커버리지) · 데이터 품질 관점"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "성내3동은 181개 중 80개(44.2%)만 좌표 보유로 지도 커버리지 최저 — 상위 동(역삼1동 96.8%)과 2배 이상 격차."
              sql: |
                SELECT admin_dong, gu, geocoded_count, business_count,
                       ROUND(100.0 * geocoded_count / business_count, 1) AS geocoded_pct
                FROM d1_dong_summary
                WHERE business_count >= :min_count -- 예시 100
                ORDER BY geocoded_pct ASC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, aggregate, filter_range]
            - pattern_id: "freshness-by-collected-date"
              question_ko: "동별 데이터가 언제 수집분인가 — 얼마나 신선한가?"
              axes: "시간축(수집일) 분포 — 스냅샷 테이블의 유일한 시간 단면"
              verified_rows: 16
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "417개 동 중 171개는 7/9, 139개는 7/27 수집분이고 8개 동은 6/30 이후 갱신이 없다 — '데이터 기준일'은 동마다 다르다."
              sql: |
                SELECT date(latest_collected_at) AS collected_date, COUNT(*) AS dong_cnt
                FROM d1_dong_summary
                GROUP BY collected_date
                ORDER BY collected_date;
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "diversity-vs-size-rank-cross"
              question_ko: "업종 다양성이 규모 대비 두드러지는 동은 어디인가?"
              axes: "두 축 교차: 업종 다양성 rank × 규모 rank (윈도우 함수 — D1 지원 확인)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "구로1동이 업종 100종으로 다양성 1위인데 규모는 5위 — 독산1동은 다양성 4위 vs 규모 20위로 격차가 가장 크다."
              sql: |
                SELECT admin_dong, gu, dataset_count, business_count,
                       RANK() OVER (ORDER BY dataset_count DESC) AS diversity_rank,
                       RANK() OVER (ORDER BY business_count DESC) AS size_rank
                FROM d1_dong_summary
                ORDER BY dataset_count DESC
                LIMIT :n; -- 예시 10
              requires: [select_columns, sort, window]
            - pattern_id: "size-quartile-open-rate"
              question_ko: "동 규모(누적 업소 수) 구간별로 영업 비중과 업종 다양성이 어떻게 다른가?"
              axes: "두 축 교차: 규모 4분위 × 영업 비중/다양성 평균"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "규모 하위 절반 동은 평균 영업 비중 12.5~14.5%·업종 6~13종에 그치는 반면 상위 절반은 24~26%·63~79종 — 소형 동 레코드는 폐업 잔재 비중이 압도적."
              sql: |
                SELECT q AS size_quartile, COUNT(*) AS dongs,
                       ROUND(AVG(open_pct), 1) AS avg_open_pct,
                       ROUND(AVG(dataset_count), 0) AS avg_dataset_count
                FROM (SELECT NTILE(4) OVER (ORDER BY business_count) AS q,
                             100.0 * business_open_count / business_count AS open_pct,
                             dataset_count
                      FROM d1_dong_summary)
                GROUP BY q
                ORDER BY q; -- quartile 1=규모 최소 … 4=최대
              requires: [select_columns, sort, aggregate, group_by, window]
            - pattern_id: "inv_dataset_count_asc"
              question_ko: "업종 다양성이 가장 낮은(단조로운) 동은? (다양성 top 랭킹의 반전)"
              axes: "동 랭킹 — dataset_count ASC(다양성 관점의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "방화2동은 업소 310곳에 업종 37종뿐 — 규모 대비 업종 다양성 최저."
              sql: |
                -- :min_count=300, :n=10
                SELECT admin_dong, gu, dataset_count, business_count, business_open_count
                FROM d1_dong_summary WHERE business_count >= :min_count
                ORDER BY dataset_count ASC LIMIT :n
              requires: [select_columns, sort, filter_range]
            - pattern_id: "new_gu_fixed_closed_share"
              question_ko: "이 자치구 안에서 물갈이(폐업 비중)가 심한 동은? (구 고정 단면 + 폐업 관점)"
              axes: "자치구 고정(:gu) → 동 랭킹, 폐업 비중 관점"
              verified_rows: 21
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "강남구 내에서는 압구정동이 누적 6,389곳 중 91.1% 폐업으로 물갈이 최심."
              sql: |
                -- :gu='강남구'
                SELECT admin_dong, business_count, business_closed_count,
                       ROUND(100.0*business_closed_count/business_count,1) AS closed_pct
                FROM d1_dong_summary WHERE gu = :gu
                ORDER BY closed_pct DESC
              requires: [select_columns, sort, aggregate]
            - pattern_id: "x_churned_dong_hot_category"
              question_ko: "물갈이가 심했던 동네에서 지금 신규 유입 1위 업종은? (동 이력 × 동×업종 매트릭스 교차)"
              axes: "제품 간 조인 — dong_summary(폐업 비중) × dong_category_matrix(신규 유입)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e5f7ab4bbd8b4fbc8db7fc0f8fa54eac"
              insight_sample_ko: "폐업 비중 91.1%인 압구정동에서도 최근 1년 신규 1위는 식품 592곳 — 물갈이와 재유입이 동시에 일어난다."
              sql: |
                -- :min_count=500, :n=10
                WITH churn AS (
                  SELECT admin_dong_code, admin_dong, gu, business_count,
                         ROUND(100.0*business_closed_count/business_count,1) AS closed_pct
                  FROM d1_dong_summary WHERE business_count >= :min_count),
                hot AS (
                  SELECT admin_dong_code, category, opened_last_365d,
                         ROW_NUMBER() OVER (PARTITION BY admin_dong_code ORDER BY opened_last_365d DESC) rn
                  FROM d1_dong_category_matrix)
                SELECT c.admin_dong, c.gu, c.closed_pct, h.category AS hot_category, h.opened_last_365d
                FROM churn c JOIN hot h ON h.admin_dong_code = c.admin_dong_code AND h.rn = 1
                ORDER BY c.closed_pct DESC LIMIT :n
              requires: [select_columns, sort, aggregate, join, subquery, window, filter_range]
          contract_version: v1
          product_question: 우리 동네(행정동)에 업소가 몇 개 있고 얼마나 열고 닫혔나?
          grain: 행정동
          primary_key: [admin_dong_code]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: wide
    columns:
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리(동당 1행).
        tests: [not_null, unique]
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글).
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: business_count
        data_type: bigint
        description: 누적 업소 수(폐업 포함 — active_cnt 와 혼용 금지).
        tests: [not_null]
      - name: business_open_count
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: business_closed_count
        data_type: bigint
        description: 폐업(03) 업소 수.
      - name: dataset_count
        data_type: bigint
        description: 이 동에 존재하는 업종(dataset) 종수.
      - name: geocoded_count
        data_type: bigint
        description: 좌표(위경도) 보유 업소 수 — 지도 커버리지 배지(geocoded/business).
      - name: latest_collected_at
        data_type: timestamp(6)
        description: 이 동 데이터의 최신 수집 시각(화면 '데이터 기준일').

  - name: gold_license_dong_category_matrix
    description: 우리 동네엔 뭐가 많나 — 행정동 × 중분류 스톡(영업/전체) + 최근 1년 신규 개업. 동네 프로파일/지도 서빙.
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_direct
          d1_table: d1_dong_category_matrix
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_dong_category_matrix   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 행정동별 업종 구성
            summary: 행정동마다 어떤 업종이 몇 곳씩 있는지, 최근 1년 신규 개업은 얼마나 되는지 교차 집계했습니다.
            use_cases:
              - 동네 업종 프로파일 작성
              - 경쟁 밀도 확인
              - 미진출 업종 탐색
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "dong-category-profile"
              question_ko: "이 동네(:dong)엔 무슨 업종이 많나? (구성비 포함)"
              axes: "dong→category (특정 단면 파라미터 + 동네 내 비중) — 반전쌍 A의 정방향"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "역삼1동 영업 업소의 51.2%(4,568곳)가 식품 — 산업 12.8%, 의료 9.5% 순. 최근 1년 식품 개업만 492건."
              sql: |
                SELECT category_ko, major_ko, active_cnt, total_cnt, opened_last_365d,
                       ROUND(100.0 * active_cnt / SUM(active_cnt) OVER (), 1) AS share_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong = :dong  -- 예: '역삼1동' (동명 중복 시 AND gu = :gu 병행, 예: '신사동')
                ORDER BY active_cnt DESC;
              requires: [select_columns, sort, aggregate, window]
            - pattern_id: "category-top-dongs"
              question_ko: "이 업종(:category_ko)이 가장 많은 동네는 어디인가? (top-N)"
              axes: "category→dong (축 반전: dong-category-profile 과 차원 교환 쌍 A) + 랭킹 top-N (수정: 파라미터명을 :category_ko 로 명시 — 한글 라벨 컬럼과 비교함을 소비 측에 드러냄)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품 영업 업소 1위 동은 역삼1동(4,568곳) — 신림동(3,806)·종로1·2·3·4가동(3,529)·보라매동(3,454) 순. 단 산업(93%)·문화(71%)는 동 미상 비중이 높아 이 패턴은 식품·위생·미용 등 커버리지 높은 업종에 적합."
              sql: |
                SELECT admin_dong, gu, active_cnt, opened_last_365d
                FROM d1_dong_category_matrix
                WHERE category_ko = :category_ko  -- 예: '식품' (11종: 식품/의료/위생·미용/약국/동물/안경·치과/숙박/축산/문화/산업/환경)
                  AND admin_dong_code <> 'UNK'    -- 지오코딩 실패분 제외(미제외 시 UNK 가 상위 독점)
                ORDER BY active_cnt DESC
                LIMIT 10;
              requires: [select_columns, sort, filter_range]
            - pattern_id: "vital-dongs-top"
              question_ko: "최근 1년 개업이 가장 활발한(뜨는) 동네는 어디인가?"
              axes: "dong 랭킹(활력 desc) — 반전쌍 B의 정방향(활발)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 개업 1위는 역삼1동(960건), 가양1동(929)·목1동(926)이 근소한 차. 반포1동은 영업 스톡 대비 개업률 29.3%로 유입 강도 최고."
              sql: |
                SELECT admin_dong, gu, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                GROUP BY admin_dong_code, admin_dong, gu
                ORDER BY opened_1y DESC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "dormant-dongs"
              question_ko: "상권 규모는 있는데 신규 개업이 끊긴(침체) 동네는 어디인가?"
              axes: "정렬·관점 반전(쌍 B): 개업 최다 desc ↔ 개업률 최저 asc(활발↔침체)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "영업 500곳 이상 동 중 개업률 최저는 마장동 3.6%(2,622곳 중 신규 94건) — 중림동 4.7%, 가리봉동 4.8%, 혜화동 5.2%가 뒤따르는 침체권."
              sql: |
                SELECT admin_dong, gu, SUM(active_cnt) AS active_total, SUM(opened_last_365d) AS opened_1y,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                WHERE admin_dong_code <> 'UNK'
                GROUP BY admin_dong_code, admin_dong, gu
                HAVING SUM(active_cnt) >= :min_active  -- 예: 500 (군소 동 노이즈 컷)
                ORDER BY open_rate_pct ASC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
            - pattern_id: "category-survival-stock"
              question_ko: "어떤 업종이 많이 사라졌나 — 업종별 영업 잔존율과 소멸 스톡은?"
              axes: "관점 반전(쌍 C): 영업 스톡 ↔ 소멸 스톡(누적-현재), 비중 ↔ 절대값 병기 — 서울 전체 총량이므로 UNK 포함이 정확"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품은 누적 110.4만 중 20.9%만 영업 잔존(소멸 스톡 87.3만) — 잔존율 최고 동물(54.3%)의 2.6배 소멸 강도. 단, 폐업 시점 정보는 없으니 '누적 잔존율'로만 해석."
              sql: |
                SELECT category_ko, SUM(active_cnt) AS active_cnt, SUM(total_cnt) AS total_cnt,
                       SUM(total_cnt) - SUM(active_cnt) AS gone_cnt,
                       ROUND(100.0 * SUM(active_cnt) / SUM(total_cnt), 1) AS alive_pct
                FROM d1_dong_category_matrix
                GROUP BY category_ko
                ORDER BY alive_pct ASC;  -- DESC 로 바꾸면 '가장 오래 남는 업종'
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "gu-category-cross"
              question_ko: "두 자치구(:gu_a vs :gu_b)의 업종 구성은 어떻게 다른가?"
              axes: "두 축 교차 비교(gu × category) + 구내 비중 — 동 미상(UNK) 행도 gu 는 유효해 구 단위는 커버리지 완전"
              verified_rows: 22
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "강남구·마포구 모두 산업(통신판매 등)이 절반가량(47.1% vs 48.4%) — 문화 비중은 마포(19.2%)가 강남(17.4%)보다 높고, 식품은 강남 21.9% vs 마포 21.2%로 비슷."
              sql: |
                SELECT gu, category_ko, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(active_cnt) / SUM(SUM(active_cnt)) OVER (PARTITION BY gu), 1) AS share_in_gu_pct
                FROM d1_dong_category_matrix
                WHERE gu IN (:gu_a, :gu_b)  -- 예: '강남구', '마포구'
                GROUP BY gu, category_ko
                ORDER BY category_ko, gu;
              requires: [select_columns, sort, aggregate, group_by, window, filter_set]
            - pattern_id: "dong-signature-category"
              question_ko: "서울 각 동네의 '대표(1위) 업종'은 무엇이 가장 흔한가?"
              axes: "dong→category 를 다시 category 로 접는 2단 축(동별 1위 업종의 도시 분포) — 윈도우 함수 D1 동작 검증됨"
              verified_rows: 7
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "서울 417개 동 중 217개 동(52%)의 최다 영업 업종은 식품, 92개 동은 산업, 68개 동은 의료. 단 산업·문화는 동 미상 비중이 커 실제보다 과소평가될 수 있음."
              sql: |
                WITH ranked AS (
                  SELECT admin_dong, gu, category_ko, active_cnt,
                         ROW_NUMBER() OVER (PARTITION BY admin_dong_code, gu_code ORDER BY active_cnt DESC) AS rn
                  FROM d1_dong_category_matrix
                  WHERE admin_dong_code <> 'UNK'
                )
                SELECT category_ko, COUNT(*) AS dong_cnt
                FROM ranked
                WHERE rn = 1
                GROUP BY category_ko
                ORDER BY dong_cnt DESC;
              requires: [select_columns, sort, aggregate, group_by, subquery, window]
            - pattern_id: "gu-category-concentration"
              question_ko: "이 업종(:category_ko)은 어느 자치구에 집중돼 있나? (서울 점유율)"
              axes: "category→gu 집중도(절대값 + 도시 점유율 비중 병기) — category-top-dongs 의 구 스케일판 (수정: 파라미터명을 :category_ko 로 명시 — 한글 라벨 컬럼과 비교함을 소비 측에 드러냄)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "숙박 영업 업소는 중구(469곳, 서울의 17.1%)·종로구(342곳, 12.5%)에 집중 — 상위 2개 구가 서울 숙박의 약 30%를 점유."
              sql: |
                SELECT gu, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(active_cnt) /
                             (SELECT SUM(active_cnt) FROM d1_dong_category_matrix WHERE category_ko = :category_ko), 1) AS city_share_pct
                FROM d1_dong_category_matrix
                WHERE category_ko = :category_ko  -- 예: '숙박'
                  AND gu_code <> 'UNK'
                GROUP BY gu
                ORDER BY active_cnt DESC
                LIMIT 10;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "category-openings-rank"
              question_ko: "최근 1년 어떤 업종이 가장 많이 새로 생겼나? (규모와 개업률)"
              axes: "category 랭킹(신규 유입 절대값 desc ↔ 영업 대비 개업률로 관점 전환 가능) — 서울 전체 총량이므로 UNK 포함"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 개업은 산업(49,608건)·식품(35,837건)이 압도. 영업 스톡 대비 개업률은 식품 15.5%로 최고 수준(회전 빠름), 환경은 3.4%로 최저."
              sql: |
                SELECT category_ko, SUM(opened_last_365d) AS opened_1y, SUM(active_cnt) AS active_cnt,
                       ROUND(100.0 * SUM(opened_last_365d) / NULLIF(SUM(active_cnt), 0), 1) AS open_rate_pct
                FROM d1_dong_category_matrix
                GROUP BY category_ko
                ORDER BY opened_1y DESC;  -- open_rate_pct DESC 로 바꾸면 '회전이 빠른 업종'
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "inv_category_fixed_dong_rank"
              question_ko: "이 업종이 가장 많은 동은? (동 고정→업종 구성의 차원 교환)"
              axes: "업종 고정(:category) → 동 랭킹 — dong-category-profile 의 역방향"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "식품이 가장 많은 동은 역삼1동 4,568곳(누적 19,044) — 동 고정 조회의 역방향."
              sql: |
                -- :category='food', :n=10
                SELECT admin_dong, gu, active_cnt, total_cnt, opened_last_365d
                FROM d1_dong_category_matrix WHERE category = :category AND admin_dong IS NOT NULL
                ORDER BY active_cnt DESC LIMIT :n
              requires: [select_columns, sort, filter_null]
            - pattern_id: "new_hot_new_opening_cells"
              question_ko: "최근 1년 신규 개업이 가장 몰린 동×업종 조합은? (재고 대신 유입 관점)"
              axes: "동×업종 교차 랭킹 — opened_last_365d(재고 active_cnt 관점의 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "최근 1년 신규가 가장 몰린 조합은 목1동 식품 817곳(활성 대비 40.8%)."
              sql: |
                -- :n=10
                SELECT admin_dong, gu, category, opened_last_365d, active_cnt,
                       ROUND(100.0*opened_last_365d/NULLIF(active_cnt,0),1) AS new_pct
                FROM d1_dong_category_matrix WHERE admin_dong IS NOT NULL
                ORDER BY opened_last_365d DESC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_null]
            - pattern_id: "inv_new_share_asc"
              question_ko: "신규 유입이 거의 없는(정체된) 동×업종 조합은?"
              axes: "동×업종 랭킹 — 신규 비중 ASC(유입 관점의 정렬 반전)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "e409c92341914477aad70dd86a8e5efa"
              insight_sample_ko: "장위1동 환경 업종은 활성 115곳에 최근 1년 신규 0건 — 완전 정체 셀."
              sql: |
                -- :min_active=100, :n=10
                SELECT admin_dong, gu, category, active_cnt, opened_last_365d,
                       ROUND(100.0*opened_last_365d/active_cnt,2) AS new_pct
                FROM d1_dong_category_matrix WHERE active_cnt >= :min_active
                ORDER BY new_pct ASC LIMIT :n
              requires: [select_columns, sort, aggregate, filter_range]
          contract_version: v1
          product_question: 이 동네엔 무슨 업종이 많나?
          grain: 행정동×업종
          primary_key: [admin_dong_code, gu_code, major, category]
          publication_mode: snapshot        # 전량 교체 스냅샷(DROP+CREATE) — rollup 파생도 게시는 스냅샷
          zero_policy: retain_last_good     # 0행/밴드 밖 → 스왑 스킵 + 직전 스냅샷 유지(§1.4 밴드 게이트)
          partial_policy:
            min_publish_ratio: 0.5          # 행수 밴드(실측 ±50%) 하한의 계약 표현
          publication_trigger:                # 구 refresh 대체(#478 v1)
            trigger_type: asset               # gold 완료 Asset(iceberg://commerce/gold) 트리거
            max_interval_minutes: 1560        # 26h(일 1회+여유) 초과 미게시 = stale(§7.4 감시축)
          shape: rollup
    tests:                                  # PK 조합 유일 근거(#478 primary_key evidence)
      - unique_combination_of_columns:
          combination_of_columns: [admin_dong_code, gu_code, major, category]
    columns:
      - name: admin_dong_code
        data_type: varchar
        description: 행정동코드 10자리. 결측 'UNK'(보존).
        tests: [not_null]
      - name: admin_dong
        data_type: varchar
        description: 행정동명(한글).
      - name: gu_code
        data_type: varchar
        description: 시군구 코드 5자리.
        tests: [not_null]              # PK 근거(#478)
      - name: gu
        data_type: varchar
        description: 자치구명(한글).
      - name: major
        data_type: varchar
        description: 대분류.
        tests: [not_null]              # PK 근거(#478)
      - name: category
        data_type: varchar
        description: 중분류(동네 업종 구성축).
        tests: [not_null]
      - name: active_cnt
        data_type: bigint
        description: 영업(01) 업소 수.
      - name: total_cnt
        data_type: bigint
        description: 누적 업소 수(폐업 포함).
      - name: opened_last_365d
        data_type: bigint
        description: 최근 365일 개업 수(동네 활력 — 개업일 보유분 기준).
      - name: major_ko
        data_type: varchar
        description: 대분류 한글(보건/문화/산업/환경)
      - name: category_ko
        data_type: varchar
        description: 중분류 한글
  - name: gold_license_geo_grid
    description: 상권 밀집 히트맵 — 좌표 0.005도(약 500m) 격자 × 업종 영업 밀도·최근 신규. 지도 핫스팟 질의(좌표 84%만).
    config:
      contract: {enforced: true}
      meta:
        serving:   # Serving Contract v1(#478 확정 필드) + commerce 확장(serving_tier/d1_*). 소비: commerce_serving_export(분리 DAG, gold Asset 트리거)
          enabled: true               # D1 게시 대상
          external: true              # 공개 /catalog·외부 API 노출
          serving_tier: d1_rollup
          d1_table: [d1_geo_grid_overview, d1_geo_grid_detail]
          d1_rollup: overview=(grid_lat,grid_lng,major) 집계 · detail=(grid_lat,grid_lng,major,category) 원 grain
          # 원천 권리 증거(#434 · ASK-Seoul-Serving#88) — 152 LOCALDATA 공통.
          # 정의는 flow_monthly 의 앵커 1벌(&commerce_localdata_sources) — rights_checked_at 갱신도 그 한 곳만.
          source_evidence: *commerce_localdata_sources
          product_id: commerce_geo_grid   # 전역 유일(도메인 접두) — _catalog.product_id 와 대응
          display:                      # v1.10(#706) 화면 표시 정본 — description(기계·API용)과 청중이 다르다
            title: 상권 밀집 격자(개요)
            summary: 서울을 약 500m 격자로 나눠 격자마다 영업 중인 업소 수와 최근 신규 개업 수를 셌습니다.
            caveat: 좌표가 있는 업소만 격자에 담겨 전체의 약 84%를 반영합니다.
            use_cases:
              - 지도 히트맵
              - 상권 핫스팟 탐색
              - 배후 수요 추정
          d1_display:                   # commerce 확장 — 한 모델이 여러 D1 제품을 낳을 때 제품별 덮어쓰기
            d1_geo_grid_detail:
              title: 상권 밀집 격자(업종별)
              summary: 500m 격자를 업종까지 쪼개 격자마다 업종별 영업 업소 수와 최근 신규 개업 수를 담았습니다.
              caveat: 좌표가 있는 업소만 격자에 담겨 전체의 약 84%를 반영합니다.
              use_cases:
                - 업종별 지도 히트맵
                - 격자 단위 경쟁 밀도 확인
                - 출점 후보지 선별
          usage_patterns:   # MCP/API 핸드오프 — D1 실행 검증 질의 패턴(export 가 d1_usage_patterns 로 게시)
            - pattern_id: "hotspot-top-grids"
              d1_table: d1_geo_grid_overview
              question_ko: "서울에서 업소가 가장 밀집한 500m 격자는 어디인가? (전 업종 합산 top-N)"
              axes: "grid(격자)→랭킹 desc, major 합산 소거 — top-N 기본형"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "최대 밀집 격자는 가산디지털단지 일대(37.485,126.895) 4,489곳, 2위 테헤란로 선릉~삼성(37.505,127.055) 4,467곳 — 최근 1년 개업은 후자가 828곳으로 전자(217곳)의 4배."
              sql: |
                -- 예시값: LIMIT 10 (top-N 조정)
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                ORDER BY active_total DESC
                LIMIT 10
              requires: [select_columns, sort, aggregate, group_by]
            - pattern_id: "major-top-grids"
              d1_table: d1_geo_grid_overview
              question_ko: "특정 대분류(예: 문화) 업소가 가장 밀집한 격자는 어디인가?"
              axes: "major→grid (대분류 고정, 격자 랭킹) — point-major-mix 와 축 반전 쌍"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "문화 대분류 1위 격자는 을지로 인쇄골목 일대(37.565,126.995) 1,415곳 — 신규는 19곳(1.3%)뿐인 오래된 집적지. 신규가 가장 활발한 상위권은 홍대(37.555,126.92) 42곳."
              sql: |
                -- :major = 'culture'  (health/industry/culture/environment)
                SELECT grid_lat, grid_lng, active_cnt, opened_last_365d_active
                FROM d1_geo_grid_overview
                WHERE major = :major
                ORDER BY active_cnt DESC
                LIMIT 10
              requires: [select_columns, sort]
            - pattern_id: "point-major-mix"
              d1_table: d1_geo_grid_overview
              question_ko: "특정 지점(좌표)의 격자에는 어떤 대분류가 얼마나 있나? (상권 구성)"
              axes: "grid(지점)→major 구성 — major-top-grids 의 차원 교환(반전) 쌍"
              verified_rows: 4
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "강남역 격자(37.500,127.025)는 보건 906 > 산업 784 > 문화 328 > 환경 28 — 의료·미용(보건) 중심 상권이며 신규 개업도 보건이 95곳으로 최다."
              sql: |
                -- :lat = 37.500, :lng = 127.025  (강남역 인근) — REAL 등가비교 금지, 허용오차 ±0.0025(반 셀)
                SELECT major,
                       SUM(active_cnt) AS active_cnt,
                       SUM(opened_last_365d_active) AS opened_365d
                FROM d1_geo_grid_overview
                WHERE ABS(grid_lat - :lat) <= 0.0025
                  AND ABS(grid_lng - :lng) <= 0.0025
                GROUP BY major
                ORDER BY active_cnt DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "rising-grids-new-ratio"
              d1_table: d1_geo_grid_overview
              question_ko: "최근 1년 신규 개업 비율이 가장 높은 '뜨는' 격자는 어디인가?"
              axes: "grid→신규율(비중) desc — stagnant-grids 와 정렬·관점 반전 쌍(뜨는↔정체, 절대값 아닌 비율)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "신규율 1위는 반포 신축단지 일대(37.500,126.995) — 영업 594곳 중 306곳(51.5%)이 최근 1년 개업. 2위 (37.500,127.065) 43.5%."
              sql: |
                -- :min_active = 100  (소규모 격자 노이즈 컷)
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL) / SUM(active_cnt), 3) AS new_ratio
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                HAVING SUM(active_cnt) >= :min_active
                ORDER BY new_ratio DESC
                LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "stagnant-grids-new-ratio"
              d1_table: d1_geo_grid_overview
              question_ko: "규모는 있는데 신규 유입이 끊긴 '정체' 격자는 어디인가?"
              axes: "grid→신규율 asc — rising-grids 의 desc↔asc 반전(뜨는↔정체)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
              insight_sample_ko: "영업 100곳 이상 격자 중 신규율 최저는 (37.460,127.035) 1.4%(280곳 중 4곳). 삼성동 (37.495,127.11)은 961곳 규모인데 신규 21곳(2.2%)으로 대형 정체 상권."
              sql: |
                -- :min_active = 100
                SELECT grid_lat, grid_lng,
                       SUM(active_cnt) AS active_total,
                       SUM(opened_last_365d_active) AS opened_365d,
                       ROUND(CAST(SUM(opened_last_365d_active) AS REAL) / SUM(active_cnt), 3) AS new_ratio
                FROM d1_geo_grid_overview
                GROUP BY grid_lat, grid_lng
                HAVING SUM(active_cnt) >= :min_active
                ORDER BY new_ratio ASC
                LIMIT 10
              requires: [select_columns, sort, aggregate, group_by, having]
            - pattern_id: "bbox-viewport-heatmap"
              d1_table: d1_geo_grid_overview
              question_ko: "지도 화면(bbox) 안에서 특정 대분류 업소가 많은 격자는? (뷰포트 히트맵 단면)"
              axes: "공간 bbox + major 파라미터 단면 — /api/geo/heatmap/overview 대응"
              verified_rows: 43
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "8c9c130654024b498d911507566ab12a"
