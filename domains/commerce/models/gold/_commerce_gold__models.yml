            - pattern_id: "bbox-heatmap-slice"
              d1_table: d1_geo_grid_detail
              question_ko: "지도 화면 영역(bbox) 안에서 특정 업종 히트맵 셀을 밀도순으로 보여줘 (canonical 히트맵 질의)"
              axes: "bbox+category 파라미터 단면 조회 (설계 문서의 /api/geo/heatmap 과 동일 축)"
              verified_rows: 41
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "ce0411c469c045bb9bd08b641cd47fea"
              insight_sample_ko: "홍대 bbox(37.54~37.57, 126.91~126.94) 내 food 셀 41개, 최고 셀(37.55, 126.92) 844곳 — 인접 셀(37.555, 126.925) 634곳과 연담 핫존 형성."
              sql: |
                SELECT ROUND(grid_lat,3) AS grid_lat, ROUND(grid_lng,3) AS grid_lng,
                       active_cnt, opened_last_365d_active
                FROM d1_geo_grid_detail
                WHERE grid_lat BETWEEN :min_lat AND :max_lat  -- 예: 37.54 ~ 37.57 (홍대·연남 일대)
                  AND grid_lng BETWEEN :min_lng AND :max_lng  -- 예: 126.91 ~ 126.94
                  AND category = :category                    -- 예: 'food'
                  AND active_cnt >= :min_cnt                  -- 예: 10 (노이즈 셀 컷)
