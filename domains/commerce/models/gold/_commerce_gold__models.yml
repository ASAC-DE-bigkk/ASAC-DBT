            - pattern_id: "new_category_closed_topn"
              question_ko: "폐업 절대량이 가장 많은 업종(중분류)은?"
              axes: "업종 랭킹 — 폐업 절대량 DESC(업종 축의 폐업 관점)"
              verified_rows: 10
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "폐업 절대량 1위는 식품(food) 85,230건 — 개업 1위 업종이 폐업도 1위."
              sql: |
                -- :ym_from='2024-07', :ym_to='2026-06'
                SELECT category, SUM(cnt) AS closed_cnt
                FROM d1_flow_monthly
                WHERE event_type='closed' AND ym BETWEEN :ym_from AND :ym_to
                GROUP BY category ORDER BY closed_cnt DESC
              requires: [select_columns, sort, aggregate, group_by, filter_range]
            - pattern_id: "x_inflow_vs_survival"
              question_ko: "최근 개업이 몰린 업종이 실제로 오래 버티는 업종인가? (유입 열기 × 장기 생존율 교차)"
              axes: "제품 간 조인 — flow_monthly(유입) × cohort_survival(5년 생존율) 사분면"
              verified_rows: 11
              verified_at: "2026-07-31T15:12:23Z"
              verified_publication_id: "2ba0d0d146474951bdca1b8454d0b3bc"
              insight_sample_ko: "산업은 최근 개업 103,504건에 5년 생존율 61.5%로 '유입 많고 튼튼한' 조합 — 식품(44.5%)과 대조된다."
              sql: |
                -- :ym_from='2024-07', :years_elapsed=5
                WITH inflow AS (
                  SELECT category, SUM(cnt) AS opened FROM d1_flow_monthly
                  WHERE event_type='opened' AND ym >= :ym_from GROUP BY category),
                surv AS (
                  SELECT category, ROUND(100.0*SUM(survivors)/SUM(cohort_n),1) AS survival_pct
                  FROM d1_cohort_survival WHERE years_elapsed = :years_elapsed GROUP BY category)
                SELECT i.category, i.opened, s.survival_pct,
                       CASE WHEN s.survival_pct >= 50 THEN 'durable' ELSE 'fragile' END AS durability
                FROM inflow i JOIN surv s ON s.category = i.category
                ORDER BY i.opened DESC
              requires: [select_columns, sort, aggregate, group_by, join, subquery, filter_range]
            - pattern_id: "rank_by_dim_generic"
              question_ko: "임의 차원(:dim ∈ {gu, major, category})을 임의 지표(:metric ∈ {opened, closed, net})·임의 방향(:dir ∈ {asc, desc})으로 랭킹하면? (고정 랭킹 패턴군의 파라미터 일반화 상위호환)"
              axes: "차원 스위치(gu/major/category) × 지표 스위치(opened/closed/net) × 방향 스위치 랭킹"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "2024-07~2026-06 순증 1위 자치구는 11620(관악구)으로 개업 569건·폐업 13건, 순증 +556이다."
              sql: |
                -- :dim='gu', :metric='net', :dir='desc', :ym_from='2024-07', :ym_to='2026-06', :n=10
                SELECT CASE :dim WHEN 'gu' THEN gu_code WHEN 'major' THEN major ELSE category END AS dim_value,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                  AND NOT (:dim='gu' AND gu_code='UNK')
                GROUP BY dim_value
                ORDER BY
                  CASE WHEN :dir='asc' THEN CASE :metric WHEN 'opened' THEN opened WHEN 'closed' THEN closed ELSE net END END ASC,
                  CASE WHEN :dir='desc' THEN CASE :metric WHEN 'opened' THEN opened WHEN 'closed' THEN closed ELSE net END END DESC
                LIMIT :n;
              requires: [select_columns, sort, aggregate, group_by, filter_range]
              param_defaults: { dir: "desc", n: 10 }
              param_enum: { dim: [gu, major, category], dir: [asc, desc], metric: [opened, closed, net] }
            - pattern_id: "trend_filtered_cum"
              question_ko: "특정 자치구(:gu_code, 'ALL'=서울 전체)·특정 업종(:category, 'ALL'=전체)의 월별 개업·폐업·순증 추이와 누적 순증은? (flow_trend_monthly 의 센티널 필터 일반화 + 누적 곡선)"
              axes: "시간(ym) 시계열 × 선택 필터(gu/category 센티널) + 윈도우 누적(net 러닝합)"
              verified_rows: 24
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "강남구(11680)의 2024-07 은 개업 0건·폐업 2건으로 순증 -2, 누적 순증도 -2에서 출발한다."
              sql: |
                -- :gu_code='11680', :category='ALL', :ym_from='2024-07', :ym_to='2026-06'
                SELECT ym,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END) AS net,
                       SUM(SUM(CASE WHEN event_type='opened' THEN cnt ELSE -cnt END)) OVER (ORDER BY ym) AS cum_net
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                  AND (:gu_code='ALL' OR gu_code = :gu_code)
                  AND (:category='ALL' OR category = :category)
                GROUP BY ym
                ORDER BY ym;
              requires: [select_columns, sort, aggregate, group_by, filter_range, window]
              param_defaults: { gu_code: "ALL", category: "ALL" }
            - pattern_id: "yoy_yearly_growth"
              question_ko: "연도별 개업(또는 폐업) 규모는 전년 대비 몇 % 늘거나 줄었나? — 자치구·업종은 선택('ALL'=전체)"
              axes: "연(substr(ym,1,4)) 시계열 × 윈도우 LAG 전년비 + 선택 필터(gu/category 센티널)"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "서울 전체 개업 시계열은 2016년 2,595건에서 시작하며, 첫 해는 전년 비교치가 없어 yoy_pct 가 비어 있다."
              sql: |
                -- :event_type='opened', :gu_code='ALL', :category='ALL', :y_from='2016'
                SELECT substr(ym,1,4) AS y,
                       SUM(cnt) AS total,
                       LAG(SUM(cnt)) OVER (ORDER BY substr(ym,1,4)) AS prev_total,
                       ROUND(100.0 * (SUM(cnt) - LAG(SUM(cnt)) OVER (ORDER BY substr(ym,1,4)))
                             / NULLIF(LAG(SUM(cnt)) OVER (ORDER BY substr(ym,1,4)), 0), 1) AS yoy_pct
                FROM d1_flow_monthly
                WHERE event_type = :event_type
                  AND substr(ym,1,4) >= :y_from
                  AND (:gu_code='ALL' OR gu_code = :gu_code)
                  AND (:category='ALL' OR category = :category)
                GROUP BY y
                ORDER BY y;
              requires: [select_columns, sort, aggregate, group_by, filter_range, window]
              param_defaults: { gu_code: "ALL", category: "ALL" }
            - pattern_id: "event_share_by_dim"
              question_ko: "기간 내 개업(또는 폐업)에서 각 자치구/대분류/업종이 차지하는 비중(%)은? (:dim ∈ {gu, major, category})"
              axes: "차원 스위치 × 분포(비중 % — 윈도우 전체합 분모)"
              verified_rows: 11
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "2024-07~2026-06 개업에서 industry 업종이 4,519건, 비중 56.8%로 1위다."
              sql: |
                -- :event_type='opened', :dim='category', :ym_from='2024-07', :ym_to='2026-06'
                SELECT CASE :dim WHEN 'gu' THEN gu_code WHEN 'major' THEN major ELSE category END AS dim_value,
                       SUM(cnt) AS event_cnt,
                       ROUND(100.0 * SUM(cnt) / SUM(SUM(cnt)) OVER (), 1) AS share_pct
                FROM d1_flow_monthly
                WHERE event_type = :event_type
                  AND ym BETWEEN :ym_from AND :ym_to
                  AND NOT (:dim='gu' AND gu_code='UNK')
                GROUP BY dim_value
                ORDER BY event_cnt DESC;
              requires: [select_columns, sort, aggregate, group_by, filter_range, window]
              param_enum: { dim: [gu, major, category] }
            - pattern_id: "churn_ratio_by_dim"
              question_ko: "개업 대비 폐업 배율(교체 강도)이 높은 곳은 — 자치구/대분류/업종 어느 축으로든? (category_close_ratio 의 차원 스위치 일반화 상위호환)"
              axes: "차원 스위치(gu/major/category) × 비율(closed/opened) 랭킹 + 소표본 컷(:min_opened)"
              verified_rows: 25
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "2024-07~2026-06 배율 1위 자치구는 11545(금천구)로 개업 105건 대비 폐업 161건, 폐업/개업 배율 1.53이다."
              sql: |
                -- :dim='gu', :ym_from='2024-07', :ym_to='2026-06', :min_opened=50
                SELECT CASE :dim WHEN 'gu' THEN gu_code WHEN 'major' THEN major ELSE category END AS dim_value,
                       SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END) AS opened,
                       SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END) AS closed,
                       ROUND(1.0 * SUM(CASE WHEN event_type='closed' THEN cnt ELSE 0 END)
                             / NULLIF(SUM(CASE WHEN event_type='opened' THEN cnt ELSE 0 END), 0), 2) AS close_per_open
                FROM d1_flow_monthly
                WHERE ym BETWEEN :ym_from AND :ym_to
                  AND NOT (:dim='gu' AND gu_code='UNK')
                GROUP BY dim_value
                HAVING opened >= :min_opened
                ORDER BY close_per_open DESC;
              requires: [select_columns, sort, aggregate, group_by, having, filter_range]
              param_defaults: { min_opened: 50 }
            - pattern_id: "record_cells_topn"
              question_ko: "역대 한 달·한 구·한 업종 기준 최다 개업(또는 폐업) 기록은 언제 어디였나? (단일 셀 극값 랭킹)"
              axes: "원자 행(ym × gu × major × category) 극값 랭킹 — 집계 없이 cnt DESC"
              verified_rows: 10
              verified_at: "2026-08-08T06:00:50Z"
              verified_publication_id: "2928878dccce4dadac7ef984268d3721"
              insight_sample_ko: "2010-01 이후 단일 셀 최다 폐업 기록은 2014-03 광진구(11215) culture 업종의 591건이다."
              sql: |
