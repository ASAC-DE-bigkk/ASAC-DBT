version: 2

models:
  - name: gold_license_phone_succession
    description: 연쇄창업 — '같은 사업자가 폐업 후 무엇으로 재도전하나'(동일 전화·주소 상이·공용번호 컷). 근사(전화 44%).
  - name: gold_detail_uptae_mix
    description: 업태(uptaenm) 구성·플로우 × 업종 — 소분류보다 깊은 업태 축(일반음식점 안 한식/커피숍). 19 detail union.
  - name: gold_license_geo_grid
    description: 좌표 ~500m 격자 상권 히트맵 × 업종 — 지도 밀도/핫스팟 질의. 실측 top=가산·선릉·강남역. D1 지도 후보.
  - name: gold_license_address_succession
    description: 자리 승계 — '폐업 후 같은 주소에 무엇이 들어오나'(<=365일). food->food 고착성. 건물 단위 주소 근사.
  - name: gold_license_lifespan
    description: 업소 수명(개업→폐업 일수) 분포 × 업종 × 자치구 — '이 업종은 보통 몇 년 버티나'. avg/p50/p90/조기폐업률. 폐업 완결분 기준.
  - name: gold_license_cohort_survival
    description: 개업연도 코호트 생존곡선 × 대/중분류 — 'Y년 개업분이 k년 뒤 몇 % 생존'. 관측 가능 연차만(우측검열 차단).
  - name: gold_license_seasonality
    description: 개업/폐업 월중 계절성(1~12월) × 업종 — '어느 달에 개·폐업 몰리나'. 최근 10개 완결연.
  - name: gold_license_stock_age_band
    description: 영업 중 업소 업력 밴드(<1y~20y+) 분포 × 업종 × 자치구 — '신생 상권 vs 노포 상권' 구분.
  - name: gold_license_gu_specialization
    description: "자치구 업종 특화지수(LQ) — '이 구는 어떤 업종에 특화됐나'. LQ>1=서울 평균 대비 밀집(예: 성동 축산 5.8)."
  - name: gold_license_churn_yearly
    description: 연도별 순증·교체율·신생비 × 업종 × 자치구 — '이 업종 상권이 얼마나 역동적인가'(폐업/기초스톡). 최근 20개 완결연.
  - name: gold_license_data_quality
    description: dataset(API)별 커버리지 진단 — '어느 API가 결측 심한가'. 전화/좌표/행정동/폐업일 보유율(거버넌스·수집 우선순위).
  - name: gold_license_status_transition
    description: 상태 전이 매트릭스(from→to) × 업종 — '휴업하면 재개하나 폐업하나'. ※이력 축적에 따라 성장하는 씨앗 지표.
  - name: gold_license_dong_category_matrix
    description: 행정동 × 중분류 스톡(+최근 1년 개업) — '이 동네엔 뭐가 많고 뭐가 새로 생기나'. 동네 프로파일/지도 서빙.
  - name: gold_license_change_activity
    description: 업소당 버전수·개명/이전 발생률 × 업종 — '정보가 얼마나 자주 바뀌나'. ※이력 축적 초기(씨앗 지표).
  - name: gold_detail_area_profile
    description: 영업장 면적(sitearea m2) 분포 × 업종 × 자치구 — '이 업종 가게 크기'. avg/p50/p90/소형/대형. 23개 detail union.
  - name: gold_license_multi_site
    description: 동일 전화 다지점(체인/다점포 추정) 비율 × 업종 — '이 업종 프랜차이즈화 정도'. 20+ 공용번호 컷, 근사(전화 44%).
  - name: gold_license_flow_daily
    description: 개업/폐업 흐름 일 grain × 업종3단 × 지역3축(gu·행정동·법정동) — '언제·어디서·무슨 업종이 생기고 닫혔나' 추이 질의. 완결일 초과분만 append(재실행 0건).
    columns:
      - name: event_date
        tests: [not_null]
      - name: event_type
        tests: [not_null]

  - name: gold_license_flow_monthly
    description: 개업/폐업 흐름 월 grain × 업종3단 × 지역3축 — 월별 상권 증감 추이. 완결월 초과분만 append(재실행 0건).
    columns:
      - name: ym
        tests: [not_null]

  - name: gold_license_flow_yearly
    description: 개업/폐업 흐름 연 grain × 업종3단 × 지역3축 — 장기 상권 추세. 완결연 초과분만 append(재실행 0건).
    columns:
      - name: y
        tests: [not_null]

  - name: gold_license_status_duration
    description: 상태 세그먼트 지속기간 요약 × 업종·상태군 — '휴업/폐업이 보통 며칠 유지되나'. avg/p50/p90/진행중. 이력 기반.
    columns:
      - name: status_code
        tests: [not_null]

  - name: gold_env_facility_operation
    description: 환경 배출시설(대기/수질) 가동 시간·일수 × 자치구 — '이 구 배출시설 연간 가동'. (영업시간 필드는 LOCALDATA 원천 부재).

  # ── 원형 정리본(silver — 레이어 재분류 2026-07-15, dags docs/PROJECT.md §4) ────
  - name: silver_license_entity
    description: >
      업소 현재 상태(공통 컬럼 서빙 프로젝션, Iceberg 정본). grain = 자연키
      (dataset, opnsfteamcode, mgtno) — silver_license_current 와 1:1(D1/SQLite 특성상
      DB 발급 서러게이트 금지, PROJECT.md §4.2). record_json 등 대형/내부 컬럼 제외.
      API 별 상이 컬럼은 카탈로그 구동 detail(silver_<domain>_detail, dags include/gold/) 담당.
    columns:
      - name: dataset
        tests:
          - not_null
      - name: opnsfteamcode
        tests:
          - not_null
      - name: mgtno
        tests:
          - not_null

  - name: silver_license_entity_history
    description: >
      업소 버전 이력 프로젝션(append-only, Iceberg 전용 — D1 export 금지·대용량).
      증분 = collected_at 워터마크(silver history 가 append-only 라 신규 버전 행만 승계).
      버전 grain = silver 와 동일 (dataset, opnsfteamcode, mgtno, collected_at, content_hash).
    columns:
      - name: dataset
        tests:
          - not_null
      - name: collected_at
        tests:
          - not_null
      - name: content_hash
        tests:
          - not_null

  - name: gold_license_dong_summary
    description: 행정동(admin_dong_code) × 업소 현황 스냅샷 — '이 동네 업소 수·영업률'. 영업(01)·폐업(03)·좌표보유 카운트. 동 지도/요약 서빙 표면.
    columns:
      - name: admin_dong_code
        tests:
          - not_null
          - unique

  - name: silver_license_history
    description: >
      서울 인허가 변경 이력(정제된 변경로그). bronze 를 publishable run 으로 필터하고 연속 중복을
      제거(정당한 원복 A→B→A 는 보존)한다. 명시적 버전 컬럼 없음 — (dataset, opnsfteamcode, mgtno)
      안에서 (updatedt_sort, lastmodts_sort, observed_date, collected_at, content_hash) 내림차순
      정렬이 곧 버전 순서(암묵 버저닝). 행 식별 그레인 = (dataset, opnsfteamcode, mgtno,
      collected_at, content_hash) — MGTNO 는 발급 자치단체(OPNSFTEAMCODE) 안에서만 유니크.
    columns:
      - name: dataset
        tests:
          - not_null
      - name: opnsfteamcode
        description: 개방자치단체코드(발급 구청) — MGTNO 유니크 범위. 업소 식별키 구성 요소.
        tests:
          - not_null
      - name: mgtno
        tests:
          - not_null
      - name: content_hash
        tests:
          - not_null
      - name: collected_at
        description: 파이프라인 수집 시각. bronze 는 UTC 기록 → silver 에서 **+9h KST 변환**(silver timestamp 는 전부 KST).
        tests:
          - not_null
      - name: updatedt_ts
        description: UPDATEDT(개방 데이터 갱신시각, KST 원문) → **KST timestamp**(파싱만·무변환). 비정형이면 null.
      - name: updatedt_sort
        description: 버전 정렬 1순위(전용). UPDATEDT 결측 시 LASTMODTS 로 폴백, 그마저 없으면 epoch. 시각 해석엔 updatedt_ts 를 쓸 것.
        tests:
          - not_null
      - name: lastmodts_ts
        description: LASTMODTS(원천 최종수정시점, KST 원문) → **KST timestamp**(파싱만·무변환). 비정형이면 null.
      - name: lastmodts_sort
        description: 정렬 전용(결측=epoch 치환). 시각 해석에는 lastmodts_ts 를 쓸 것.
        tests:
          - not_null
      - name: jibun_address
        description: 지번주소 — 원천(SITEWHLADDR) → LOTNO_ADDR(숙박업 등) → Juso 보강(도로명 키) 순 채움.
      - name: jibun_address_source
        description: 지번주소 채움 계보 — source | lotno_addr | juso_api | null(3계보 모두 없음).
      - name: gu
        description: 자치구(구). 도로명 우선·지번 폴백 파싱. 서울 외/미매칭은 null. (구 district 컬럼 rename)
      - name: gu_code
        description: 시군구 코드 5자리(법정동코드 앞 5자리, 행안부 참조). gu 미매칭이면 null.
      - name: legal_dong
        description: 법정동명 — 지번주소 동 토큰이 법정동명에 매치(우선), 아니면 행정동→법정동 참조 매핑으로 보완.
      - name: legal_code
        description: 법정동코드 10자리(행안부).
      - name: admin_dong
        description: 행정동명 — 동 토큰이 행정동명에 매치, 아니면 법정동→행정동 참조 매핑으로 보완(다대다는 결정적 근사 — docs/address-and-geo.md).
      - name: admin_dong_code
        description: 행정동코드 10자리(행안부).
      - name: latitude
        description: WGS84 위도 — 원천 X/Y(중부원점 TM, EPSG:5174)를 순수 계산 변환. 한반도 bbox 밖·결측은 null(원문 X/Y 보존).
      - name: longitude
        description: WGS84 경도 — 변환 파라미터·검증 근거는 docs/address-and-geo.md.

  - name: silver_license_current
    description: >
      인허가 현재 상태(업소당 최신 1행). history 의 암묵 버저닝 정렬 내림차순 최상위(row_number=1).
      grain=(dataset, opnsfteamcode, mgtno) — MGTNO 는 발급 자치단체 안에서만 유니크.
    columns:
      - name: dataset
        tests:
          - not_null
      - name: opnsfteamcode
        description: 개방자치단체코드(발급 구청) — MGTNO 유니크 범위.
        tests:
          - not_null
      - name: mgtno
        tests:
          - not_null
      - name: bplcnm
        description: 업소명(BPLCNM). 원본 '' 는 null 로 정규화.

  - name: silver_license_detail_health
    description: >
      보건 대분류(식품·의료·위생·미용·안경·치과·숙박·축산·동물·약국)의 **분야별(개별) 영역** —
      공통/주소/좌표는 silver_license_current 에 있고 여기서는 업종군 고유 컬럼만 record_json 에서
      추출한 '정규화 이전 큰 정보 단위'. 해당 군에 없는 필드는 null(schema-on-read). 완전 정규화 X.
      grain=(dataset, opnsfteamcode, mgtno). 필드 사전: docs/dataset-columns.md §3.
    columns:
      - name: dataset
        tests:
          - not_null
      - name: opnsfteamcode
        tests:
          - not_null
      - name: mgtno
        tests:
          - not_null
      - name: category
        description: 중분류(식품/의료/위생·미용/…) — taxonomy 시드 기준.
        tests:
          - not_null
      - name: record_json
        description: 원본 레코드(개별 필드 소급 추출 + gold table화용) 보존.
        tests:
          - not_null

seeds:
  - name: commerce_dataset_taxonomy
    description: >
      데이터셋 short → 대분류(major=보건/문화/산업/환경) · 중분류(category) · 명칭분류(sub_category) ·
      포맷(fmt v1/v2). ASAC-DAG 레지스트리에서 파생(분류 규칙: ASAC-DAG docs/PROJECT.md).
    columns:
      - name: short
        description: 데이터셋 short(= silver.dataset 조인키).
        tests:
          - not_null
          - unique
      - name: major
        description: 대분류. 문화·산업·환경 외 전부 health(보건).
        tests:
          - not_null
