version: 2

sources:
  - name: commerce_bronze
    description: >
      Seoul LOCALDATA 인허가(상권) Bronze Iceberg 테이블. ASAC-DAG 의 commerce_load_bronze DAG 가
      raw 증분(row-NDJSON)을 적재한다(전체=PyIceberg / 증분=Trino). 39종 데이터셋은 동일 스키마라
      단일 테이블(dataset 컬럼으로 구분). raw(R2)와 bronze(Iceberg)는 분리 레이어다.
    database: "{{ target.database }}"
    schema: "{{ env_var('COMMERCE_SCHEMA', 'commerce') }}"
    loaded_at_field: collected_at
    freshness:
      # dev 는 일배치라 warn-only 성격. error 임계는 prod 전환 시 조정.
      warn_after: {count: 30, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: localdata_license
        identifier: bronze_localdata_license
        description: 인허가 레코드 변경로그(append-only). record_json 통짜 + 계보 컬럼.
        columns:
          - name: dataset
            description: 데이터셋 short. 예 general_restaurant. 39종 구분.
            tests:
              - not_null
          - name: mgtno
            description: 소스 네이티브 관리번호(MGTNO). 업소 식별 키.
            tests:
              - not_null
          - name: record_json
            description: 원본 인허가 레코드 1건 통짜(JSON 문자열, schema-on-read).
            tests:
              - not_null
          - name: content_hash
            description: 키 정렬 canonical JSON sha256(내용 동일성/변경 감지).
            tests:
              - not_null
          - name: observed_date
            tests:
              - not_null
          - name: load_date
            tests:
              - not_null
          - name: bronze_run_id
            tests:
              - not_null
          - name: dag_run_id
            tests:
              - not_null
          - name: collected_at
            tests:
              - not_null

      - name: ref_admin_dong
        identifier: bronze_ref_admin_dong
        description: >
          행안부 행정동↔법정동 매핑(전국) 최신 스냅샷. commerce_load_silver 의
          enrich_admin_dong_ref 태스크가 R2 raw/common/admin_dong 최신본으로 전량 교체 적재.
          silver 의 gu_code·legal/admin dong 상호 매핑 참조.
        loaded_at_field: loaded_at
        freshness: null    # 참조 스냅샷 — 신선도 게이트 비대상(소스 공통 기준 상속 차단)
        columns:
          - name: legal_dong_code
            tests:
              - not_null
          - name: admin_dong_code
            tests:
              - not_null

      - name: address_enrichment
        identifier: bronze_address_enrichment
        description: >
          도로명→지번 Juso 보강 캐시(그레인 road_address_norm). enrich_fill_jibun 태스크가
          지번 결측 도로명만 조회해 적재(패턴/호출수/상태 감사 컬럼 포함). status='filled' 만 silver 조인.
        loaded_at_field: requested_at
        freshness: null    # 보강 캐시 — 결측이 없으면 갱신도 없음(신선도 비대상)

      - name: collection_run_manifest
        identifier: bronze_collection_run_manifest
        description: 데이터셋별 발행 게이트(그레인 source_id×bronze_run_id). is_publishable 만 silver 반영.
        loaded_at_field: event_at
        columns:
          - name: source_id
            tests:
              - not_null
          - name: dataset
            tests:
              - not_null
          - name: bronze_run_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null
          - name: is_publishable
            tests:
              - not_null
          - name: event_at
            tests:
              - not_null
