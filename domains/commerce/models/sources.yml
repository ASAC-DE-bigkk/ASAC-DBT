version: 2

sources:
  - name: commerce_bronze
    description: >
      Seoul LOCALDATA 인허가(상권) Bronze Iceberg 테이블. ASAC-DAG 의 commerce_load_bronze DAG 가
      raw 증분(row-NDJSON)을 적재한다(전체=PyIceberg / 증분=Trino). 152종(v1 인허가 139 + v2 환경 13)을
      record_json 통짜(schema-on-read)로 단일 테이블에 수용한다 — v1/v2 필드명이 달라도 무관, dataset
      컬럼으로 구분. v1/v2 통합은 silver 의 lf() 매크로에서 일어난다. raw(R2)와 bronze(Iceberg)는 분리 레이어다.
    database: "{{ target.database }}"
    schema: "{{ env_var('COMMERCE_SCHEMA', 'commerce') }}"
    loaded_at_field: collected_at
    freshness:
      # dev 는 일배치라 warn-only 성격. error 임계는 prod 전환 시 조정.
      warn_after: {count: 30, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: localdata_license
        identifier: bronze_localdata_license
        description: 인허가 레코드 변경로그(append-only). record_json 통짜 + 계보 컬럼.
        columns:
          - name: dataset
            description: 데이터셋 short. 예 general_restaurant. 152종 구분.
            tests:
              - not_null
          - name: mgtno
            description: 소스 네이티브 관리번호(MGTNO). 업소 식별 키.
            tests:
              - not_null
          - name: record_json
            description: 원본 인허가 레코드 1건 통짜(JSON 문자열, schema-on-read).
            tests:
              - not_null
          - name: content_hash
            description: >
              키 정렬 canonical JSON sha256(내용 동일성/변경 감지). 입력은 **raw 원본 레코드
              전체** — 원천 좌표(v1 X/Y·v2 XCRD/YCRD)는 브론즈 원래 컬럼이라 **포함**(UPDATEDT
              무갱신 좌표 채움도 원천 변경 = 정당한 버전 이력). **임의추가/파생컬럼**(행정동/
              법정동/위도·경도 등 silver 보강·파생값)은 해시 입력 금지 — 입력이 raw 뿐이라
              구조적으로 유입 불가(사용자 확정, dags change-log #63).
            tests:
              - not_null
          - name: observed_date
            tests:
              - not_null
          - name: load_date
            tests:
              - not_null
          - name: bronze_run_id
            tests:
              - not_null
          - name: dag_run_id
            tests:
              - not_null
          - name: collected_at
            tests:
              - not_null

      - name: ref_admin_dong
        identifier: bronze_ref_admin_dong
        description: >
          행안부 행정동↔법정동 매핑(전국) 최신 스냅샷. commerce_load_silver 의
          enrich_admin_dong_ref 태스크가 R2 raw/common/admin_dong 최신본으로 전량 교체 적재.
          silver 의 gu_code·legal/admin dong 상호 매핑 참조.
        loaded_at_field: loaded_at
        freshness: null    # 참조 스냅샷 — 신선도 게이트 비대상(소스 공통 기준 상속 차단)
        columns:
          - name: legal_dong_code
            tests:
              - not_null
          - name: admin_dong_code
            tests:
              - not_null

      - name: address_enrichment
        identifier: bronze_address_enrichment
        description: >
          도로명→지번 Juso 보강 캐시(그레인 road_address_norm). enrich_fill_jibun 태스크가
          지번 결측 도로명만 조회해 적재(패턴/호출수/상태 감사 컬럼 포함). status='filled' 만 silver 조인.
        loaded_at_field: requested_at
        freshness: null    # 보강 캐시 — 결측이 없으면 갱신도 없음(신선도 비대상)

      - name: collection_run_manifest
        identifier: bronze_collection_run_manifest
        description: 데이터셋별 발행 게이트(그레인 source_id×bronze_run_id). is_publishable 만 silver 반영.
        loaded_at_field: event_at
        columns:
          - name: source_id
            tests:
              - not_null
          - name: dataset
            tests:
              - not_null
          - name: bronze_run_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null
          - name: is_publishable
            tests:
              - not_null
          - name: event_at
            tests:
              - not_null

  # ── silver detail(카탈로그 구동 — dags include/gold 적재) 중 dbt gold 가 소비하는 것만 ────
  # detail 은 dbt 외부(Python) 적재라 source 로 참조. 물리명 = OL stitch 키.
  - name: commerce_silver_details
    description: >
      silver_<domain>_detail(원형 — API 별 상이 컬럼, #70) 중 gold 집계가 입력으로 쓰는 테이블.
      가동시간·일수 축(영업시간 필드는 LOCALDATA 원천 부재 — 환경 v2 2종만 보유).
    database: "{{ target.database }}"
    schema: "{{ env_var('COMMERCE_SCHEMA', 'commerce') }}"
    freshness: null    # 적재 주체는 silver DAG — 신선도는 그쪽 계약
    tables:
      - name: silver_air_pollution_facility_detail
      - name: silver_water_pollution_facility_detail
      - name: silver_emission_repair_agent_detail
      - name: silver_mail_order_sale_detail
      - name: silver_medical_institution_detail
      - name: silver_medical_similar_detail
      - name: silver_petroleum_alt_fuel_sale_detail
      - name: silver_amusement_park_detail
      - name: silver_animal_drug_wholesale_detail
      - name: silver_animal_hospital_detail
      - name: silver_animal_medical_device_sale_detail
      - name: silver_animal_pharmacy_detail
      - name: silver_animal_sale_detail
      - name: silver_culture_arts_corporation_detail
      - name: silver_feed_manufacturing_detail
      - name: silver_food_sanitation_business_detail
      - name: silver_high_pressure_gas_detail
      - name: silver_hospital_detail
      - name: silver_large_store_detail
      - name: silver_livestock_breeding_detail
      - name: silver_livestock_processing_detail
      - name: silver_livestock_sale_detail
      - name: silver_livestock_storage_detail
      - name: silver_livestock_transport_detail
      - name: silver_lodging_detail
      - name: silver_meat_packaging_detail
      - name: silver_petroleum_sale_detail
