name: seoul_ppltn
version: "1.0.0"
config-version: 2

profile: seoul_ppltn

flags:
  require_certificate_validation: true

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  seoul_ppltn:
    +materialized: table

seeds:
  seoul_ppltn:
    seoul_ppltn_area_geo:
      +column_types:
        area_cd: varchar
        category: varchar
        area_nm: varchar
        center_lon: double
        center_lat: double
        lon_min: double
        lat_min: double
        lon_max: double
        lat_max: double
        polygon_wkt: varchar
