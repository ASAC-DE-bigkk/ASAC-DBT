seoul_ppltn:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    prod:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      catalog: iceberg
      schema: seoul_ppltn
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300

    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      catalog: iceberg_dev
      # 개인 샌드박스 테스트 시 env로 덮어쓴다 (예: dev_<github_id>_ppltn) --
      # 공유 dev 스키마(seoul_ppltn)와 격리. DAG 쪽 SEOUL_PPLTN_SCHEMA와 같은 키.
      schema: "{{ env_var('SEOUL_PPLTN_SCHEMA', 'seoul_ppltn') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300
