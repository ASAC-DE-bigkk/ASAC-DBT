# 모노프로젝트 공용 프로파일 — dev/prod 는 카탈로그로 가른다.
# target.schema 는 citydata 계열의 기본 스키마(폴더 +schema 없는 모델·seed 용).
# traffic 등 타 도메인 스키마는 dbt_project.yml 의 폴더별 +schema 가 결정.
asac_seoul:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    prod:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      catalog: iceberg
      schema: seoul_citydata
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300

    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'airflow') }}"
      catalog: iceberg_dev
      # 개인 샌드박스는 SEOUL_CITYDATA_SCHEMA 로 격리(예: dev_<id>) — 기존 컨벤션 유지.
      schema: "{{ env_var('SEOUL_CITYDATA_SCHEMA', 'seoul_citydata') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      threads: 4
      timeout_seconds: 300
